    triggerUndo("Deleted contribution",{collection:"goals",id:goalId,childKey:"contributions",childId:cid});
    pushImportantRef.current();
  };

  /* investments */
  const invs=(data.investments||[]).filter(x=>!x.deletedAt);
  /* Phase 2: addInv(type) — each Investment Account type starts with only
     the fields it actually uses, rather than one shape crammed with every
     field from every type. */
  const NEW_INV_BY_TYPE={
    stocks:()=>({ticker:"",name:"",broker:"",trades:[]}),
    mp2:()=>({name:"",nickname:"",currency:"PHP",startDate:new Date().toISOString().slice(0,10),maturityDate:"",payoutMode:"compounded",projectionRate:6,contributions:[],paidDividends:[],rateOverrides:{},notes:""}),
    td:()=>({name:"",currency:"PHP",principal:0,rate:0,startDate:new Date().toISOString().slice(0,10),maturityDate:"",compounding:"maturity",taxRate:0,institution:"",status:"active",notes:""}),
    gold:()=>({name:"",currency:"USD",weight:0,weightUnit:"g",purityType:"24k",karat:24,purchaseDate:new Date().toISOString().slice(0,10),purchaseCost:0,notes:""}),
  };
  const addInv=(type="stocks",owner="me")=>setData(d=>({...d,investments:[...(d.investments||[]),{id:uid(),owner,type,...(NEW_INV_BY_TYPE[type]||NEW_INV_BY_TYPE.stocks)(),updatedAt:new Date().toISOString()}]}));
  const updateInv=(id,patch)=>setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===id?{...x,...patch,updatedAt:new Date().toISOString()}:x)}));
  const removeInv=id=>{
    const inv=(data.investments||[]).find(x=>x.id===id);
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===id?{...x,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:x)}));
    if(inv)triggerUndo(`Deleted "${inv.ticker||inv.name||"investment"}"`,{collection:"investments",id});
    pushImportantRef.current();
  };
  const addTrade=(invId,trade)=>{const now=new Date().toISOString();setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,trades:[...(x.trades||[]),{id:uid(),...trade,updatedAt:now}],updatedAt:now}:x)}));pushImportantRef.current();};
  const removeTrade=(invId,tid)=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,trades:(x.trades||[]).map(t=>t.id===tid?{...t,deletedAt:now,updatedAt:now}:t),updatedAt:now}:x)}));
    triggerUndo("Deleted trade",{collection:"investments",id:invId,childKey:"trades",childId:tid});
    pushImportantRef.current();
  };

  /* MP2 contributions — same add/edit/delete-with-undo shape as goal
     contributions (App()'s contributeToGoal/removeContribution above), just
     scoped under an investment account instead of a goal. */
  const addMp2Contribution=(invId,amount,date,note="")=>{
    const now=new Date().toISOString();
    const contrib={id:uid(),amount:Number(amount),date,note,createdAt:now,updatedAt:now};
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:[...(x.contributions||[]),contrib],updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const updateMp2Contribution=(invId,cid,patch)=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:(x.contributions||[]).map(c=>c.id===cid?{...c,...patch,amount:patch.amount!==undefined?Number(patch.amount):c.amount,updatedAt:now}:c),updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const removeMp2Contribution=(invId,cid)=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:(x.contributions||[]).map(c=>c.id===cid?{...c,deletedAt:now,updatedAt:now}:c),updatedAt:now}:x)}));
    triggerUndo("Deleted contribution",{collection:"investments",id:invId,childKey:"contributions",childId:cid});
    pushImportantRef.current();
  };

  /* MP2 declared dividend rates — centrally stored (data.mp2DividendRates),
     one entry per year, shared by every MP2 account unless a specific
     account overrides it via acc.rateOverrides (see mp2Valuation). */
  const mp2Rates=(data.mp2DividendRates||[]).filter(r=>!r.deletedAt);
  const mp2RatesByYear=useMemo(()=>{
    const m={};mp2Rates.forEach(r=>{m[r.year]=Number(r.rate);});return m;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[data.mp2DividendRates]);
  const addMp2Rate=(year,rate)=>{setData(d=>({...d,mp2DividendRates:[...(d.mp2DividendRates||[]),{id:uid(),year:Number(year),rate:Number(rate),updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  const updateMp2Rate=(id,patch)=>{setData(d=>({...d,mp2DividendRates:(d.mp2DividendRates||[]).map(r=>r.id===id?{...r,...patch,updatedAt:new Date().toISOString()}:r)}));pushImportantRef.current();};
  const removeMp2Rate=id=>{
    const r=(data.mp2DividendRates||[]).find(x=>x.id===id);
    setData(d=>({...d,mp2DividendRates:(d.mp2DividendRates||[]).map(x=>x.id===id?{...x,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:x)}));
    if(r)triggerUndo(`Deleted ${r.year} MP2 rate`,{collection:"mp2DividendRates",id});
    pushImportantRef.current();
  };

  /* "Record annual dividend payout" — MP2 annual-payout mode only. Declared
     dividends sit as a receivable inside the MP2 account (see mp2Valuation's
     `paid` subtraction) until the person confirms the bank actually received
     them; this both records the receipt on the account (so it stops being
     counted as still-inside-MP2 value) and, only if a bank is chosen,
     credits that bank's balance — never automatic, always an explicit
     confirm action per section 5 of the spec. */
  const recordMp2Payout=(invId,{year,amount,date,bankId,note=""})=>{
    const now=new Date().toISOString();
    const receipt={id:uid(),year:Number(year),amount:Number(amount),date,note,bankId:bankId||null,createdAt:now,updatedAt:now};
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,paidDividends:[...(x.paidDividends||[]),receipt],updatedAt:now}:x)}));
    // Settle any accrued interest and re-anchor before crediting: adding to
    // the stale stored balance would then compound past days' interest onto
    // money that only arrived today (see settledBankPatch).
    if(bankId)setData(d=>({...d,banks:(d.banks||[]).map(b=>{
      if(b.id!==bankId)return b;
      const s=settledBankPatch(b,now.slice(0,10));
      return{...b,...s,balance:s.balance+Number(amount),updatedAt:now};
    })}));
    pushImportantRef.current();
  };

  /* Time Deposit maturity confirmation — user-entered actual credited
     interest/final amount become the new source of truth (no more estimate
     once the bank has actually confirmed it), status flips to "matured".
     Transferring to a bank is optional and, once done, flips status to
     "closed" so the TD's own value drops to 0 in totals (the money now
     lives in that bank balance instead — see investmentValueSar) rather
     than being counted in both places. */
  const confirmTdMaturity=(invId,{confirmedInterest,confirmedFinalAmount,transferBankId})=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,status:"matured",confirmedInterest:Number(confirmedInterest),confirmedFinalAmount:Number(confirmedFinalAmount),maturedAt:now,updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const transferTdProceeds=(invId,bankId)=>{
    const inv=(data.investments||[]).find(x=>x.id===invId);
    if(!inv||inv.confirmedFinalAmount==null)return;
    const now=new Date().toISOString();
    setData(d=>({
      ...d,
      investments:(d.investments||[]).map(x=>x.id===invId?{...x,status:"closed",transferBankId:bankId,transferredAt:now,updatedAt:now}:x),
      // Same settle-then-credit rule as recordMp2Payout above.
      banks:(d.banks||[]).map(b=>{
        if(b.id!==bankId)return b;
        const s=settledBankPatch(b,now.slice(0,10));
        return{...b,...s,balance:s.balance+Number(inv.confirmedFinalAmount),updatedAt:now};
      }),
    }));
    pushImportantRef.current();
  };
  const setProjection=patch=>setData(d=>({...d,projection:{...(d.projection||{monthly:1500,years:20,rate:8}),...patch}}));

  /* runway/capital targets — trend-based forecasting toward a custom goal.
     Distinct from `goals` (manual-contribution pots): a target's progress is
     derived live from (a) the budget categories you tag as counting toward it
     and (b) your current invested/cash balances, projected forward at two
     separately-editable conservative rates. */
  const targets=(data.targets||[]).filter(t=>!t.deletedAt);
  const addTarget=()=>setData(d=>({...d,targets:[...(d.targets||[]),{
    id:uid(),name:"New target",targetAmount:100000,targetDate:"",
    categoryAlloc:{},investRate:4,cashRate:1,currency:"SAR",color:SEG[(d.targets||[]).length%SEG.length],
    updatedAt:new Date().toISOString(),
  }]}));
  const updateTarget=(id,patch)=>setData(d=>({...d,targets:(d.targets||[]).map(t=>t.id===id?{...t,...patch,updatedAt:new Date().toISOString()}:t)}));
  const removeTarget=id=>{
    const t=(data.targets||[]).find(x=>x.id===id);
    setData(d=>({...d,targets:(d.targets||[]).map(t=>t.id===id?{...t,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:t)}));
    if(t)triggerUndo(`Deleted target "${t.name||"Target"}"`,{collection:"targets",id});
    pushImportantRef.current();
  };
  const livePrice=data.livePrice||{};
  const livePriceAt=data.livePriceAt||null;
  const prevClose=data.prevClose||{};
  /* quote refreshes (manual InvestmentsView button or the auto-refresh
     below) are deliberately NOT pushed via pushImportantRef — livePrice/
     livePriceAt/prevClose are excluded from fingerprint() so this only ever
     rides the slow idle-autosave path, never forces an immediate cloud write.
     fetchQuotes() now returns {ticker:{price,previousClose}} uniformly, but
     livePrice itself stays a bare {ticker:number} map — every existing
     reader (invSar calc, InvestmentsView's per-ticker lookups) expects that
     shape, so previousClose is split off into its own device-local field
     instead of changing livePrice's shape. */
  const setLivePrice=quotes=>setData(d=>{
    const prices={},prevs={};
    Object.entries(quotes||{}).forEach(([t,q])=>{
      if(q&&typeof q==="object"){prices[t]=q.price;if(q.previousClose!=null)prevs[t]=q.previousClose;}
      else prices[t]=q; // tolerate a bare-number map too (defensive)
    });
    return{...d,livePrice:{...(d.livePrice||{}),...prices},livePriceAt:Date.now(),prevClose:{...(d.prevClose||{}),...prevs}};
  });

  /* portfolio history — snapshot of total USD value taken when user refreshes prices */
  const portHistory=data.portHistory||[];
  const addPortSnap=(valueUSD)=>{
    const month=new Date().toISOString().slice(0,7);
    setData(d=>{
      const rest=(d.portHistory||[]).filter(h=>h.month!==month);
      return{...d,portHistory:[...rest,{id:uid(),month,value:Math.round(valueUSD)}].sort((a,b)=>a.month.localeCompare(b.month))};
    });
    pushImportantRef.current();
  };

  /* expense tracker — transactions per budget category.
     Schema: {id,catId,name,note,amount,date,owner,isTransfer,isExtraFunds,
              createdAt,ord?}
     `createdAt` is stamped once at insert and never re-stamped — that's what
     separates it from `updatedAt`, which every edit bumps and which therefore
     can't answer "what did I log first". `ord` is the optional manual
     within-a-day position; see compareTxForDisplay for why its absence is
     meaningful.
     `name` is the recurring/short title (e.g. "Amazon Now"), `note` is the
     free-form detail (e.g. "bought a charger + cable"). isTransfer marks
     quick-transfer logs against untracked categories. isExtraFunds marks a
     one-off top-up to a *tracked* category's spending room for the viewed
     month only (e.g. a spouse handing over extra cash for groceries) — it
     boosts that category's effective budget in the Expenses tab without
     ever touching the category's base amount/percentage in the Budget tab. */
  const expenses=(data.expenses||[]).filter(e=>!e.deletedAt);
  /* Returns the new row's id, which rapid entry needs so its undo toast can
     target the row it just wrote.

     `uid()` is hoisted OUT of the updater deliberately: an updater must be a
     pure function of the previous state, and React may invoke it more than
     once. Minting the id inside meant two invocations produced two different
     ids for one logical insert. Nothing depended on that before, but returning
     the id makes it observable, and the pure version is correct either way. */
  const addExpenseTx=(catId,name,note,amount,date,owner=budgetOwner,isTransfer=false,isExtraFunds=false)=>{
    const now=new Date().toISOString();
    const id=uid();
    setData(d=>({...d,expenses:[...(d.expenses||[]),{id,catId,name,note:note||"",amount:Number(amount),date,owner,isTransfer:!!isTransfer,isExtraFunds:!!isExtraFunds,createdAt:now,updatedAt:now}]}));
    pushImportantRef.current();
    return id;
  };
  const updateExpenseTx=(id,patch)=>{
    setData(d=>({...d,expenses:(d.expenses||[]).map(e=>{
      if(e.id!==id)return e;
      const next={...e,...patch,
        amount:patch.amount!==undefined?Number(patch.amount):e.amount,
        createdAt:e.createdAt,                       // entry stamp is immutable
        updatedAt:new Date().toISOString()};
      /* A date change re-homes the row into another day, where its old manual
         position means nothing — drop it so it lands at the newest position
         there. A spread can't delete, hence the explicit build-then-delete. */
      if(patch.date!==undefined&&patch.date!==e.date)delete next.ord;
      return next;
    })}));
    pushImportantRef.current();
  };
  /* Manual order within ONE day. Takes the whole ordered id list rather than a
     direction so `ord` becomes total for that day in a single write — a
     partial assignment would leave placed and unplaced rows interleaved, and
     per-tap writes would fight setData's debounce. */
  const setExpenseDayOrder=orderedIds=>{
    const now=new Date().toISOString();
    const pos=new Map((orderedIds||[]).map((id,i)=>[id,i]));
    setData(d=>({...d,expenses:(d.expenses||[]).map(e=>
      pos.has(e.id)?{...e,ord:pos.get(e.id),updatedAt:now}:e)}));
    pushImportantRef.current();
  };
  const removeExpenseTx=id=>{
    const e=(data.expenses||[]).find(x=>x.id===id);
    /* A linked installment row carries its schedule with it: deleting it means
       the money didn't move, so the payment reopens (or a payoff un-closes) in
       the SAME setData. Both directions live in applyInstallmentExpense*, so
       delete and restore can't get out of step. */
    const linked=!!(e&&(e.installmentPaymentId||e.installmentPayoff));
    /* A goal contribution carries its goal with it for the same reason:
       deleting the transfer means the money didn't move, so the goal has to
       give it back in the SAME write. */
    const goalLinked=!!(e&&e.goalId&&e.goalContributionId);
    setData(d=>linked
      ?applyInstallmentExpenseDelete(d,{expenseId:id,now:new Date().toISOString()})
      :goalLinked
      ?applyGoalContributionDeleteByExpense(d,{expenseId:id,now:new Date().toISOString()})
      :{...d,expenses:(d.expenses||[]).map(e=>e.id===id?{...e,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:e)});
    if(e)triggerUndo(`Deleted "${e.name||"transaction"}"`,{collection:"expenses",id});
    pushImportantRef.current();
  };

  /* Pinned transaction shortcuts. Deliberately thin: a shortcut is inert data
     that fills a form, so there is no coupling to protect and no reason for a
     module-scope apply* pair like installments needed.

     Pinning is idempotent on (owner,name,catId) — re-pinning an existing
     shortcut updates its amount rather than creating a twin, because the row
     is keyed by what the user recognises, not by an id they never see. A
     TOMBSTONED match is revived rather than left dead beside a new record, so
     pin/unpin/pin doesn't accumulate junk that syncs forever. */
  const pinTxTemplate=({catId,name,note,amount,owner=budgetOwner})=>{
    if(!catId||!name||!(Number(amount)>0))return;
    const now=new Date().toISOString();
    setData(d=>{
      const list=d.txTemplates||[];
      const hit=list.find(t=>(t.owner||"me")===owner&&t.catId===catId&&t.name===name);
      if(hit)return{...d,txTemplates:list.map(t=>t===hit
        ?{...t,amount:Number(amount),note:note||"",deletedAt:null,updatedAt:now}:t)};
      return{...d,txTemplates:[...list,{id:uid(),owner,catId,name,note:note||"",
        amount:Number(amount),createdAt:now,updatedAt:now}]};
    });
    pushImportantRef.current();
  };
  const removeTxTemplate=id=>{
    const t=(data.txTemplates||[]).find(x=>x.id===id);
    const now=new Date().toISOString();
    setData(d=>({...d,txTemplates:(d.txTemplates||[]).map(x=>
      x.id===id?{...x,deletedAt:now,updatedAt:now}:x)}));
    if(t)triggerUndo(`Removed shortcut "${t.name||"Shortcut"}"`,{collection:"txTemplates",id});
    pushImportantRef.current();
  };

  /* quick-transfer: logs a transaction against an untracked category (e.g. Savings)
     and remembers the actual amount transferred, since it doesn't always match
     the budgeted figure exactly. Keyed by category id. */
  const quickTransferLast=data.quickTransferLast||{};
  /* A transfer against an untracked category — and, when that category is
     linked to a goal (v1.28.0), the goal credit too, in the SAME write.

     Was two setData calls (the row, then quickTransferLast). Now one, for the
     reason installments and goal contributions already follow: a half-written
     pair can be synced.

     The link is resolved HERE rather than inside applyGoalContribution,
     because that function writes nothing for an unknown goal — correct for a
     direct contribution, but it would silently swallow a transfer whose linked
     goal has since been deleted. `categoryGoalFor` returning null is what makes
     a stale link degrade to an ordinary transfer instead. */
  const quickTransfer=(catId,catName,amount,date,owner=budgetOwner,linkedGoalId=null)=>{
    const now=new Date().toISOString();
    const amt=Number(amount);
    const day=date||now.slice(0,10);
    const expenseId=uid(),contributionId=uid();
    setData(d=>{
      const withLast={...d,quickTransferLast:{...(d.quickTransferLast||{}),[catId]:amt}};
      if(linkedGoalId)
        return applyGoalContribution(withLast,{goalId:linkedGoalId,amount:amt,
          note:"Quick transfer",date:day,owner,name:catName,catId,
          expenseId,contributionId,now});
      return{...withLast,expenses:[...(withLast.expenses||[]),
        {id:expenseId,catId,name:catName,note:"Quick transfer",amount:amt,date:day,
         owner,isTransfer:true,isExtraFunds:false,createdAt:now,updatedAt:now}]};
    });
    pushImportantRef.current();
  };

  /* extra funds: ad-hoc top-up to a tracked category's room for the month,
     e.g. a spouse sending extra cash earmarked for a specific category. */
  const addExtraFunds=(catId,catName,amount,date,note,owner=budgetOwner)=>{
    addExpenseTx(catId,catName,note||"Extra funds",amount,date,owner,false,true);
  };

  /* ── Installments ──────────────────────────────────────────────────────
     Every one of these is a one-liner over a pure transaction at module
     scope. The rule is that a plan and its schedule, or a payment and its
     ledger row, land in ONE setData — see the apply* banner for why. Nothing
     here computes a balance; every figure the UI shows is derived on read. */
  const installments=(data.installments||[]).filter(x=>!x.deletedAt);
  const installmentPayments=(data.installmentPayments||[]).filter(x=>!x.deletedAt);
  const nowStamp=()=>new Date().toISOString();
  const addInstallment=(plan,rows)=>{
    const id=uid();
    setData(d=>applyInstallmentCreate(d,{plan:{...plan,id},rows,ids:rows.map(()=>uid()),now:nowStamp()}));
    pushImportantRef.current();
    return id;
  };
  const updateInstallment=(installmentId,patch,rows)=>{
    setData(d=>applyInstallmentUpdate(d,{installmentId,patch,rows,
      ids:(rows||[]).filter(r=>!r.id).map(()=>uid()),now:nowStamp()}));
    pushImportantRef.current();
  };
  const recordInstallmentPayment=(paymentId,{actualAmount,paidDate,name,note,fundedCatId}={})=>{
    setData(d=>applyInstallmentPayment(d,{paymentId,actualAmount,paidDate,name,note,fundedCatId,
      now:nowStamp(),expenseId:uid()}));
    pushImportantRef.current();
  };
  const payOffInstallmentEarly=(installmentId,{payoffDate,amount,name,note}={})=>{
    setData(d=>applyInstallmentPayoff(d,{installmentId,payoffDate,amount,name,note,
      now:nowStamp(),expenseId:uid()}));
    pushImportantRef.current();
  };
  const cancelInstallment=installmentId=>{
    setData(d=>applyInstallmentCancel(d,{installmentId,now:nowStamp()}));
    pushImportantRef.current();
  };
  const removeInstallment=installmentId=>{
    const x=installments.find(i=>i.id===installmentId);
    setData(d=>applyInstallmentDelete(d,{installmentId,now:nowStamp()}));
    if(x)triggerUndo(`Deleted "${x.name||"installment"}"`,{collection:"installments",id:installmentId});
    pushImportantRef.current();
  };
  const updateInstallmentExpense=(expenseId,patch)=>{
    setData(d=>applyInstallmentExpenseEdit(d,{expenseId,...patch,now:nowStamp()}));
    pushImportantRef.current();
  };
  const unlinkInstallmentExpense=expenseId=>{
    setData(d=>applyInstallmentUnlink(d,{expenseId,now:nowStamp()}));
    pushImportantRef.current();
  };
  /* One-shot hand-off from a derived Budget row to the Installments tab, the
     same {id,nonce} shape Home uses to drive the Expenses filter — kept out of
     `data` because it's "what am I looking at", not a synced setting. */
  const[installmentFocus,setInstallmentFocus]=useState(null);
  const openInstallment=id=>{setInstallmentFocus({id,nonce:Date.now()});setTab("installments");};


  /* ── FX ────────────────────────────────────────────────────────────────
     Cached in `data`, exactly like livePrice/prevClose above, and excluded
     from fingerprint() for exactly the same reason — see the comment there.

     These used to be useState(null), which meant every reload started with no
     rates at all: convert() returned null for everything until the network
     answered, so an offline cold start could show nothing in a foreign
     currency even though it had converted fine a minute earlier. Persisting
     them is what makes "≈ SAR 9,750 · rate from 3 Aug" possible, and it costs
     nothing precisely because the exclusion mechanism already existed.

     Deliberately NOT seeded in structuralDefaults(): absent means "nothing
     cached yet", so the empty-document shape is unchanged. */
  const rates=(data.rates&&typeof data.rates==="object")?data.rates:null;
  const ratesAt=data.ratesAt||null;
  const[ratesErr,setRatesErr]=useState(false);
  const[ratesLoading,setRatesLoading]=useState(false);
  const loadRates=async()=>{
    setRatesLoading(true);setRatesErr(false);
    let ok=true;
    /* Like setLivePrice, this rides the slow idle-autosave path only — it is
       never pushed via pushImportantRef, and being outside the fingerprint it
       cannot force a cloud write on its own. */
    try{const{rates:r,at}=await fetchRates();setData(d=>({...d,rates:r,ratesAt:at}));}
    catch(e){setRatesErr(true);ok=false;}
    setRatesLoading(false);
    return ok; // used by refreshMarketDataIfStale to surface a "some data failed" flag
  };
  /* Only fetch when there is nothing cached or the cache has aged out. While
     rates lived in useState this effect had to run unconditionally — there was
     never anything to reuse — but now that they persist, refetching on every
     open would rewrite the document each time for a number that moves daily.
     Same staleness gate refreshMarketDataIfStale already applies.

     Gated on `loaded`, and that gate is the whole thing working. App's initial
     state is an EMPTY document (structuralDefaults); the stored one arrives
     later, in the load effect. A bare [] mount effect therefore looks at
     `data.rates` before the document exists, finds nothing cached every single
     time, and refetches on every open — which is exactly what this was written
     to stop. Measured in the sandbox: rates 80 seconds old, refetched anyway. */
  useEffect(()=>{
    if(!loaded)return;
    if(!rates||Date.now()-(ratesAt||0)>RATES_STALE_MS)loadRates();
  },[loaded]);
  const convert=(amt,from,to)=>{
    if(!rates||!rates[from]||!rates[to])return null;
    return(Number(amt)||0)/rates[from]*rates[to];
  };
  const sarRate=rates&&rates.SAR?rates.SAR:null;
  /* How old the cached rates are, for the "rate from 3 Aug" caveat. Whole days
     so it can't churn within a calendar day. */
  const ratesStaleDays=ratesAt?Math.max(0,Math.floor((Date.now()-ratesAt)/86400000)):null;

  /* banks */
  const banks=(data.banks||[]).filter(b=>!b.deletedAt);
  const addBank=owner=>{setData(d=>({...d,banks:[...(d.banks||[]),{id:uid(),owner,name:"New account",bank:"",country:"SA",currency:"SAR",balance:0,updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  /* shared by every field's onChange (name/bank/country/currency/balance as
     the person types) — deliberately left on the debounced idle-autosave
     path, not pushImportant, or every keystroke would trigger a push. The
     balance field's onBlur (its "commit" moment) calls pushImportant
     separately where it's wired up in BanksView below. */
  const updateBank=(id,patch)=>setData(d=>({...d,banks:(d.banks||[]).map(b=>b.id===id?{...b,...patch,updatedAt:new Date().toISOString()}:b)}));
  const removeBank=id=>{
    const b=(data.banks||[]).find(x=>x.id===id);
    setData(d=>({...d,banks:(d.banks||[]).map(b=>b.id===id?{...b,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:b)}));
    if(b)triggerUndo(`Deleted "${b.name||"account"}"`,{collection:"banks",id});
    pushImportantRef.current();
  };

  /* assets */
  const assets=(data.assets||[]).filter(a=>!a.deletedAt);
  const addAsset=kind=>setData(d=>({...d,assets:[...(d.assets||[]),
    kind==="liability"
      ?{id:uid(),name:"New liability",kind:"liability",currency:"SAR",owner:"household",value:0,installment:true,monthly:0,monthsRemaining:0,asOfDate:new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString()}
      :{id:uid(),name:"New asset",kind:"asset",currency:"SAR",owner:"household",value:0,updatedAt:new Date().toISOString()}
  ]}));
  const updateAsset=(id,patch)=>setData(d=>({...d,assets:(d.assets||[]).map(a=>a.id===id?{...a,...patch,updatedAt:new Date().toISOString()}:a)}));
  const removeAsset=id=>{
    const a=(data.assets||[]).find(x=>x.id===id);
    setData(d=>({...d,assets:(d.assets||[]).map(a=>a.id===id?{...a,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:a)}));
    if(a)triggerUndo(`Deleted "${a.name||"item"}"`,{collection:"assets",id});
  };

  /* net worth */
  const sarOf=(amt,ccy)=>{const v=convert(amt,ccy,"SAR");return v==null?0:v;};
  /* Every bank total in the app values through bankValue(), so an
     interest-earning account contributes its accrued estimate rather than the
     last figure someone typed. Pinned to one date string per render pass so
     three totals computed microseconds apart can't land on different days. */
  const todayStr=new Date().toISOString().slice(0,10);
  const banksSar=banks.reduce((s,b)=>s+sarOf(bankValue(b,todayStr),b.currency),0);
  /* Investment Accounts (Phase 1): one shared valuation loop, called once for
     the combined (household) total and again — filtered — per owner, so
     Home's per-profile cards (HeroCard/PortfolioCard/SavingsInvestingCard)
     never fall back to counting every investment on every profile. */
  const includeMp2Estimate=!!(data.settings&&data.settings.includeMp2EstimateInNetWorth);
  /* Per-type valuation, dispatched by hld.type — stocks price live, MP2/TD
     use their dedicated rate-driven valuation strategies (mp2Valuation/
     tdValuation) instead of a market price. Net Worth default is MP2's
     *confirmed* value and TD's *current estimated net* value (spec §11);
     the Settings toggle swaps MP2 to its estimated value everywhere this
     runs, since Portfolio/Net Worth/snapshots all share this one function.
     A "closed" TD (proceeds already transferred to a bank) values at 0 so
     the money isn't counted in both places. */
  const investmentValueSar=hld=>{
    if(hld.type==="mp2"){
      const v=mp2Valuation(hld,mp2RatesByYear);
      const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
      return convert?(convert(chosen,hld.currency||"PHP","SAR")||0):0;
    }
    if(hld.type==="td"){
      if(hld.status==="closed")return 0;
      const v=tdValuation(hld);
      const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
      return convert?(convert(val,hld.currency||"PHP","SAR")||0):0;
    }
    if(hld.type==="gold"){
      // priced off the live spot quote cached at livePrice[GOLD_TICKER] —
      // same never-clear-on-failure guarantee as stocks (see setLivePrice).
      const v=goldValuation(hld,livePrice[GOLD_TICKER]||0,convert);
      return convert?(convert(v.currentValueUsd,"USD","SAR")||0):0;
    }
    // stocks (default)
    const{shares}=holdingStats(hld.trades);
    const price=livePrice[baseKey(hld.ticker)]||0;
    return shares*price*(sarRate||0);
  };
  const investmentsSarValue=list=>list.reduce((s,hld)=>s+investmentValueSar(hld),0);
  /* Per-type SAR breakdown for one owner's investments — used by the
     snapshot capture below (Phase 3 §5) to record a per-type composition
     alongside each day's total, without a second bespoke reduce. */
  const investmentBreakdownSar=list=>{
    const out={stocks:0,mp2:0,td:0,gold:0};
    (list||[]).forEach(hld=>{
      const t=(hld.type in out)?hld.type:"stocks";
      out[t]+=investmentValueSar(hld);
    });
    return out;
  };
  const invSar=investmentsSarValue(invs);
  const invSarForOwner=useCallback(owner=>investmentsSarValue(investmentsForProfile(invs,owner)),[invs,livePrice,sarRate,convert,mp2RatesByYear,includeMp2Estimate]);

  /* ── Net worth, per profile. One helper rather than a reduce per call site
     (see CLAUDE.md). "household" is the combined view: everything, including
     jointly-owned records. A person's view is strictly what they own, so
     me + wife does NOT equal household whenever anything is joint — that's
     deliberate, not a rounding bug.

     Banks filter literally (a joint bank belongs to neither person's view);
     investments go through investmentsForProfile, which already encodes the
     same rule; assets/liabilities use ownerMatch, whose "no owner" fallback
     is household because migrate() defaults them there. ──────────────────── */
  const netWorthParts=p=>{
    const pBanksSar=p==="household"
      ?banksSar
      :banks.filter(b=>b.owner===p).reduce((s,b)=>s+sarOf(bankValue(b,todayStr),b.currency),0);
    const pInvSar=p==="household"?invSar:invSarForOwner(p);
    const mine=assets.filter(a=>ownerMatch(a,p));
    const pAssetSar=mine.filter(a=>a.kind==="asset").reduce((s,a)=>s+sarOf(a.value,a.currency),0);
    const pLiabSar=mine.filter(a=>a.kind==="liability").reduce((s,a)=>s+sarOf(liabilityBalance(a),a.currency),0);
    return{banks:pBanksSar,investments:pInvSar,assets:pAssetSar,liabilities:pLiabSar,
      net:pBanksSar+pInvSar+pAssetSar-pLiabSar};
  };
  const householdParts=netWorthParts("household");
  const assetSar=householdParts.assets;
  const liabSar=householdParts.liabilities;
  const netWorth=householdParts.net;

  /* history */
  const history=data.history||[];
  const captureSnapshot=()=>{
    const month=new Date().toISOString().slice(0,7);
    setData(d=>{const rest=(d.history||[]).filter(h=>h.month!==month);
      return{...d,history:[...rest,{id:uid(),month,net:Math.round(netWorth),banks:Math.round(banksSar),investments:Math.round(invSar),assets:Math.round(assetSar),liabilities:Math.round(liabSar)}].sort((a,b)=>a.month.localeCompare(b.month))};});
  };
  const addPastSnap=(month,net)=>setData(d=>{const rest=(d.history||[]).filter(h=>h.month!==month);
    return{...d,history:[...rest,{id:uid(),month,net:Math.round(net),banks:0,investments:0,assets:0,liabilities:0}].sort((a,b)=>a.month.localeCompare(b.month))};});
  const removeSnap=id=>setData(d=>({...d,history:(d.history||[]).filter(h=>h.id!==id)}));

  /* net worth auto-pull — silently keeps this month's snapshot in sync with
     live bank/investment/asset balances, so the timeline stays accurate
     without needing a manual "Capture this month" tap every time. Only
     updates the CURRENT month's entry, debounced, and only once balances
     have settled (loaded + non-zero so we don't overwrite real history with
     a startup 0 before data finishes loading). */
  const netWorthReady=loaded&&!!rates&&(banks.length>0||invs.length>0||assets.length>0);
  useEffect(()=>{
    if(!netWorthReady)return;
    const t=setTimeout(()=>{
      const month=new Date().toISOString().slice(0,7);
      // setDataRaw: automatic background recompute, not a user edit — see
      // the note on the daily-snapshot effect above for why this must not
      // stamp dataUpdatedAt.
      setDataRaw(d=>{
        const existing=(d.history||[]).find(h=>h.month===month);
        const rounded=Math.round(netWorth);
        if(existing&&existing.net===rounded&&existing.banks===Math.round(banksSar)&&existing.investments===Math.round(invSar)&&existing.assets===Math.round(assetSar)&&existing.liabilities===Math.round(liabSar)){
          return d; // no change, skip write to avoid loops
        }
        const rest=(d.history||[]).filter(h=>h.month!==month);
        return{...d,history:[...rest,{id:existing?.id||uid(),month,net:rounded,banks:Math.round(banksSar),investments:Math.round(invSar),assets:Math.round(assetSar),liabilities:Math.round(liabSar),auto:true}].sort((a,b)=>a.month.localeCompare(b.month))};
      });
    },1200);
    return()=>clearTimeout(t);
  },[netWorth,banksSar,invSar,assetSar,liabSar,netWorthReady]);

  /* ── Daily per-profile snapshots (Phase 3 §5) ──────────────────────────────
     Separate from the monthly `history` auto-pull above: captures Me/Wife/
     Household each as their own row, once per calendar day, with a per-type
     investment breakdown, feeding the new range-selectable charts. Same
     debounce-then-write-only-if-changed shape as the effect above, just
     looped over 3 profiles and keyed by day instead of month. */
  const ownerNetWorthSar=owner=>netWorthParts(owner).net;
  const snapshots=data.snapshots||[];
  useEffect(()=>{
    if(!netWorthReady)return;
    const t=setTimeout(()=>{
      const today=new Date().toISOString().slice(0,10);
      // setDataRaw, not setData: this is an automatic background snapshot,
      // not a real user edit, so it must not stamp dataUpdatedAt — doing so
      // would make merely opening the app look like "just edited" and skew
      // tryAutoMergeAll's preferLocal choice toward whichever device was
      // simply opened most recently rather than actually edited most
      // recently. Persistence/dirty-marking (the [data,loaded] effect) still
      // runs normally since skipSave.current is untouched here.
      setDataRaw(d=>{
        let snaps=[...(d.snapshots||[])];
        let changed=false;
        ["me","wife","household"].forEach(profile=>{
          const pInvs=investmentsForProfile(invs,profile);
          /* All five fields come from the one helper. assets/liabilities used
             to store the HOUSEHOLD figures on every profile's row, which made
             Net Worth's per-person "What's driving it" wrong no matter what
             the hero showed. */
          const parts=netWorthParts(profile);
          const breakdown=investmentBreakdownSar(pInvs);
          const rounded={
            net:Math.round(parts.net),
            investments:Math.round(parts.investments),
            banks:Math.round(parts.banks),
            assets:Math.round(parts.assets),
            liabilities:Math.round(parts.liabilities),
            byType:{stocks:Math.round(breakdown.stocks),mp2:Math.round(breakdown.mp2),td:Math.round(breakdown.td),gold:Math.round(breakdown.gold)},
          };
          const idx=snaps.findIndex(s=>s.date===today&&s.profile===profile);
          if(idx>=0){
            const ex=snaps[idx];
            const same=ex.net===rounded.net&&ex.investments===rounded.investments&&ex.banks===rounded.banks&&ex.assets===rounded.assets&&ex.liabilities===rounded.liabilities&&JSON.stringify(ex.byType)===JSON.stringify(rounded.byType);
            if(!same){snaps[idx]={...ex,...rounded,updatedAt:new Date().toISOString()};changed=true;}
          }else{
            snaps.push({id:uid(),date:today,profile,...rounded,updatedAt:new Date().toISOString(),auto:true});
            changed=true;
          }
        });
        if(!changed)return d;
        const retention=(d.settings&&d.settings.snapshotRetention)||{dailyDays:35,weeklyDays:365};
        return{...d,snapshots:compressSnapshots(snaps,retention)};
      });
    },1500);
    return()=>clearTimeout(t);
    // `assets` is in the deps as well as the derived assetSar/liabSar: editing
    // an item's OWNER moves value between profiles without changing either
    // household total, so the derived numbers alone wouldn't re-fire this.
  },[netWorth,banksSar,invSar,assetSar,liabSar,assets,banks,invs,netWorthReady]);

  /* ── automatic market-data refresh ────────────────────────────────────────
     Keeps stock quotes and FX rates from silently going stale for people who
     never open Investments/Currency and just live on Home. Piggybacks on the
     exact same "app became active" moments checkCloudOnActivate already
     uses (visibility/focus/online) — no new listeners. Ref-guarded (not
     state-guarded) so a second trigger while a fetch is already in flight is
     a no-op even across the stale closures those event handlers capture.
     Failures are swallowed here and never clear/zero the cached
     livePrice/rates — fetchQuotes/fetchRates already only resolve on
     success, so there's nothing to overwrite on failure. */
  const quotesRefreshingRef=useRef(false);
  const ratesRefreshingRef=useRef(false);
  /* {force:true} bypasses the staleness window — used by the manual/gesture
     pull-to-refresh, where the person explicitly asked for fresh data right
     now. Passive lifecycle triggers (visibility/focus/online) call this with
     no args and keep respecting the thresholds. Either way the in-flight
     dedup refs still apply, so a forced pull and a passive stale-check firing
     at once never double-fetch. Returns {failed} — true if any attempted
     phase errored — purely for the pull-to-refresh indicator text; never
     used to clear/zero cached data. */
  const refreshMarketDataIfStale=async({force=false,onPhase}={})=>{
    let failed=false;
    if(!quotesRefreshingRef.current){
      // Gold rides the same stock-quote refresh cycle/staleness window (spec
      // §3: "reuse the existing refresh workflow") — the settings toggle only
      // gates the *automatic* passive refresh; a forced/manual refresh always
      // includes it, same as stocks have no per-ticker opt-out either.
      const goldAutoRefresh=!(data.settings&&data.settings.goldAutoRefresh===false);
      const tickers=[...new Set([
        ...invs.map(h=>(h.ticker||"").trim().toUpperCase()).filter(Boolean),
        ...((force||goldAutoRefresh)&&invs.some(h=>h.type==="gold")?[GOLD_TICKER]:[]),
      ])];
      if(tickers.length&&(force||Date.now()-(livePriceAt||0)>QUOTES_STALE_MS)){
        quotesRefreshingRef.current=true;
        if(onPhase)onPhase("quotes");
        try{const q=await fetchQuotes(tickers);setLivePrice(q);}catch(e){failed=true;/* keep last-good prices */}
        quotesRefreshingRef.current=false;
      }
    }
    if(!ratesRefreshingRef.current&&(force||Date.now()-(ratesAt||0)>RATES_STALE_MS)){
      ratesRefreshingRef.current=true;
      if(onPhase)onPhase("rates");
      const ok=await loadRates().catch(()=>false);
      if(!ok)failed=true;
      ratesRefreshingRef.current=false;
    }
    return{failed};
  };
  const refreshMarketDataRef=useRef(refreshMarketDataIfStale);
  useEffect(()=>{refreshMarketDataRef.current=refreshMarketDataIfStale;});
  useEffect(()=>{if(loaded)refreshMarketDataRef.current();},[loaded]);

  /* household — expenses use the same soft-delete tombstone convention as
     every other collection (see mergeArrayById): a hard splice here would
     remove the record locally, but since nothing tells the cloud a delete
     happened, the next pull/reconcile sees local-missing + remote-has-it and
     resurrects it. `hh` (the read-side view handed to HouseholdView) filters
     deletedAt; the mutators below still operate on data.household directly
     so tombstones themselves stay in the synced array. */
  const rawHh=data.household||{splitMine:50,expenses:[]};
  const hh={...rawHh,expenses:(rawHh.expenses||[]).filter(e=>!e.deletedAt)};
  const setSplit=v=>{setData(d=>({...d,household:{...(d.household||{splitMine:50,expenses:[]}),splitMine:v}}));pushImportantRef.current();};
  const addExpense=()=>setData(d=>{const h=d.household||{splitMine:50,expenses:[]};const live=h.expenses.filter(e=>!e.deletedAt);return{...d,household:{...h,expenses:[...h.expenses,{id:uid(),name:"New expense",amount:0,color:SEG[live.length%SEG.length],trackInBills:false,updatedAt:new Date().toISOString()}]}};});
  const updateExpense=(id,patch)=>setData(d=>{const h=d.household;return{...d,household:{...h,expenses:h.expenses.map(e=>e.id===id?{...e,...patch,updatedAt:new Date().toISOString()}:e)}};});
  const removeExpense=id=>setData(d=>{const h=d.household;return{...d,household:{...h,expenses:h.expenses.map(e=>e.id===id?{...e,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:e)}};});

  /* ── Household Bills ──────────────────────────────────────────────────
     A lightweight layer on top of household.expenses (see docs/decisions.md).
     Household stays the single source of truth for what a bill *is*; this
     module only owns the monthly actuals (allocated snapshot, actual paid,
     payment date/status) and the rolling reserve. */
  const currentBillMonthKey=billMonthKeyOf();
  const billsAll=(data.bills||[]).filter(b=>!b.deletedAt);
  const billAdjustmentsAll=(data.billAdjustments||[]).filter(a=>!a.deletedAt);
  const billsReserve=useMemo(()=>computeBillsReserve(data),[data.billsSettings,data.bills,data.billAdjustments]);
  const trackedHhKey=hh.expenses.filter(e=>e.trackInBills).map(e=>`${e.id}:${e.name}:${e.amount}`).join("|");
  /* Reconcile the current bill bucket against the live tracked Household set.
     This used to be create-only, which meant un-ticking "track in Bills" (or
     deleting the item outright) left its row in Bills — and in the rolling
     reserve — forever, and renaming/re-pricing an item never reached the row
     that had already been created. It now creates, revives, retires and
     resyncs in one pass. Two deliberate asymmetries:
       • a row with money recorded against it (paid > 0) survives untracking —
         that's real payment history, not a projection;
       • `allocated` only follows the Household amount while the row is
         unpaid. Once paid, the snapshot freezes so the reserve maths stays
         honest about what was actually budgeted at payment time.
     Prior buckets are never touched. Retirement tombstones (`deletedAt`)
     rather than splicing, per the convention noted above — and since
     computeBillsReserve already skips tombstones, the reserve self-corrects.
     The `changed` flag matters: this runs in an effect, so returning a fresh
     object every pass would loop and dirty the document. */
  useEffect(()=>{
    if(!loaded)return;
    // setDataRaw: automatic background generation, not a user edit — see the
    // note on the daily-snapshot effect above for why this must not stamp
    // dataUpdatedAt.
    setDataRaw(d=>{
      const items=((d.household||{}).expenses||[]).filter(e=>!e.deletedAt&&e.trackInBills);
      const tracked=new Map(items.map(it=>[it.id,it]));
      const now=new Date().toISOString();
      let changed=false;
      const seen=new Set();
      const next=(d.bills||[]).map(b=>{
        if(b.monthKey!==currentBillMonthKey)return b;
        const it=tracked.get(b.itemId);
        const paid=Number(b.paid)||0;
        if(!it){
          // no longer tracked — retire it, unless money was recorded against it
          if(b.deletedAt||paid>0)return b;
          changed=true;
          return{...b,deletedAt:now,updatedAt:now};
        }
        seen.add(b.itemId);
        const patch={};
        if(b.deletedAt)patch.deletedAt=null;               // re-tracked → revive, don't duplicate
        if(b.itemName!==it.name)patch.itemName=it.name;
        const amt=Number(it.amount)||0;
        if(paid===0&&(Number(b.allocated)||0)!==amt)patch.allocated=amt;
        if(Object.keys(patch).length===0)return b;
        changed=true;
        return{...b,...patch,updatedAt:now};
      });
      const created=items.filter(it=>!seen.has(it.id)).map(it=>({id:uid(),monthKey:currentBillMonthKey,itemId:it.id,itemName:it.name,
        allocated:Number(it.amount)||0,paid:0,paymentDate:null,status:"unpaid",createdAt:now,updatedAt:now}));
      if(!changed&&created.length===0)return d;
      return{...d,bills:[...next,...created]};
    });
  },[loaded,currentBillMonthKey,trackedHhKey]);
  const updateBill=(id,patch)=>setData(d=>({...d,bills:(d.bills||[]).map(b=>
    b.id===id?{...b,...patch,updatedAt:new Date().toISOString()}:b)}));
  const setOpeningReserve=v=>{setData(d=>({...d,billsSettings:{...(d.billsSettings||{}),openingReserve:Number(v)||0}}));pushImportantRef.current();};
  const adjustBillsReserve=(newBalance,note)=>setData(d=>{
    const prev=computeBillsReserve(d);
    const amount=(Number(newBalance)||0)-prev;
    const now=new Date().toISOString();
    return{...d,billAdjustments:[...(d.billAdjustments||[]),{id:uid(),prevBalance:prev,newBalance:Number(newBalance)||0,
      amount,date:now.slice(0,10),note:note||"",createdAt:now,updatedAt:now}]};
  });

  const setOwnerName=(key,name)=>{setData(d=>({...d,owners:{...d.owners,[key]:name}}));pushImportantRef.current();};
  const setPayPeriod=(owner,patch)=>{setData(d=>({...d,payPeriods:{...(d.payPeriods||{}),[owner]:{...((d.payPeriods||{})[owner]||{enabled:false,payday:1}),...patch}}}));pushImportantRef.current();};
  /* Record (or clear) the day a period really began. Goes through
     withActualStart so the "clear removes the key" rule lives in one place —
     see the pay-period utilities block. Pushed immediately rather than left to
     the idle autosave: it re-buckets expenses, so the other device should see
     it before someone logs against the old boundary. */
  const setActualStart=(owner,periodKey,value)=>{
    setData(d=>({...d,payPeriods:withActualStart(d.payPeriods,owner,periodKey,value)}));
    pushImportantRef.current();
  };

  /* derived */
  const allocated=useMemo(()=>plan.categories.reduce((s,c)=>s+(Number(c.amount)||0),0),[plan]);
  const remaining=(Number(plan.income)||0)-allocated;
  const fmt=n=>formatMoney(n,{code:cur});

  const pct=n=>plan.income>0?((Number(n)||0)/plan.income)*100:0;
  const setInvestTarget=patch=>{setData(d=>({...d,investTarget:{...(d.investTarget||{}),[budgetOwner]:{...((d.investTarget||{})[budgetOwner]||{thresholdPct:20,groupNames:[]}),...patch}}}));pushImportantRef.current();};

  return(
    <div style={{background:P.bg,color:P.ink,minHeight:"100dvh"}}>

          </div>
          {cloudWaitReason&&(

            </div>

            style={{marginTop:8,padding:"10px 20px",fontSize:13,fontWeight:600,color:P.neuSub,borderRadius:12}}>

        </div>
