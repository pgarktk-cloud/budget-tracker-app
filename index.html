            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Quick add</h3>
            <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {quickActionItems(handlers).map(([label,Icon,fn])=>(
              <button key={label} onClick={()=>{onClose();fn();}} className="neu-btn"
                style={{display:"flex",alignItems:"center",gap:10,borderRadius:12,
                  padding:"12px 14px",fontSize:14,fontWeight:600,color:P.gr,textAlign:"left"}}>
                <I.Plus size={13}/><Icon size={16}/>{label}
              </button>
            ))}
          </div>
        </div>
      </div>
    </Portal>
  );
}

/* Native "add goal contribution" sheet for Home — styled identically to
   GoalsView's own add-money sheet (same .sheet-bg/.sheet classes, same
   Portal+useScrollLock pattern) but calls contributeToGoal({goalId,...})
   directly rather than routing through the Goals tab, since that mutator is
   already a clean standalone function. */
function GoalContributionSheet({goals,contributeToGoal,onClose}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const[goalId,setGoalId]=useState((goals&&goals[0]&&goals[0].id)||null);
  const[amount,setAmount]=useState("");
  const[note,setNote]=useState("");
  const canSubmit=goalId&&Number(amount)>0;
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Add goal contribution</h3>
            <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
          </div>
          {(!goals||goals.length===0)
            ?<div style={{fontSize:13,color:P.sub}}>No goals yet — create one in the Goals tab first.</div>
            :<>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Goal</div>
                <select value={goalId||""} onChange={e=>setGoalId(e.target.value)}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}>
                  {goals.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
                </select>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount to add</div>
                <input type="text" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)}
                  placeholder="0" autoFocus
                  style={{width:"100%",borderRadius:10,padding:"10px",fontSize:18,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Note (optional)</div>
                <input value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Monthly deposit"
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <button onClick={()=>{if(canSubmit){contributeToGoal({goalId,amount,note});onClose();}}}
                disabled={!canSubmit}
                style={{width:"100%",borderRadius:10,padding:"10px",fontSize:14,fontWeight:600,background:P.gr,color:"#fff",border:"none",opacity:canSubmit?1:.5}}>
                Add contribution
              </button>
            </>}
        </div>
      </div>
    </Portal>
  );
}

/* Composition root — see the block comment above for the "small sibling
   components" rationale. Adding a new card later = write <YCard/> above and
   add one line to the JSX below. */
/* ── "Salary arrived" — correcting a pay period's boundaries ───────────────
   Salary sometimes lands early (or late), and the app would otherwise keep
   counting it against the old period's budget while the money was already
   being spent. Auto-advance is unaffected: periods still roll over on payday,
   so a correction never has to be made and the failure mode is "nothing
   happened" rather than "the budget is lying".

   This USED to be a Home card that prompted in a 5-day window around payday.
   It was removed (2026-07-31): a card that speculatively asks "has your salary
   arrived?" is noise for the overwhelmingly common case where it arrived on
   time, and it was invisible for the case that actually needed it — an owner
   whose pay-period tracking was off saw no card at all, which is precisely
   when their spending is being bucketed by calendar month against their will.
   Corrections now live in Settings → Pay periods, where they can be made at
   any time rather than only inside a window. The sheet below is what Settings
   opens. ──────────────────────────────────────────────────────────────────── */
/* Date picker for "my salary actually arrived on…". Shows the consequence
   before it's committed — the new boundaries, the new length, and how many
   already-logged expenses move into this period — because moving a boundary
   silently re-buckets real transactions. */
function SalaryArrivedSheet({periodKey,cfg,owner,owners,expenses,heading,onClose,onConfirm}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  /* Seed with the period's current start, so opening this on an existing
     correction is an EDIT of that date rather than a silent reset to today.
     Clamped to today because the field forbids a future date: the upcoming
     period's nominal start is by definition in the future, so seeding it
     literally would open the sheet already showing "That's in the future"
     with Save disabled — an error message for something the user hasn't done
     yet. */
  const[date,setDate]=useState(()=>{
    const own=periodActualStart(periodKey,cfg),now=todayISO();
    return own>now?now:own;
  });
  const v=periodStartValidity(periodKey,cfg,date);
  const preview=useMemo(()=>{
    if(!v.ok)return null;
    const trial={...cfg,actualStarts:{...(cfg.actualStarts||{}),[periodKey]:date}};
    const{start,end}=periodRange(periodKey,trial);
    // expenses that currently sit elsewhere and would land in this period
    const moving=(expenses||[]).filter(e=>e.date&&!e.deletedAt&&(e.owner||"me")===owner
      &&periodKeyFor(e.date,cfg)!==periodKey&&periodKeyFor(e.date,trial)===periodKey).length;
    return{start,end,len:periodLength(periodKey,trial),moving};
  },[date,periodKey,cfg,expenses,owner,v.ok]);
  const fmtD=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>{heading||"When did it arrive?"}</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub}}/>
        </div>
        <div style={{fontSize:12,color:P.faint,marginBottom:14}}>
          {owners[owner]}'s pay period · normally starts {keyToDate(periodKey).toLocaleDateString("en-US",{month:"short",day:"numeric"})}
        </div>
        <input type="date" value={date} max={todayISO()} onChange={e=>setDate(e.target.value)}
          style={{width:"100%",borderRadius:10,padding:"12px",fontSize:16,fontWeight:600,
            background:"rgba(0,0,0,.05)",border:"none",color:P.ink,marginBottom:12}}/>
        <div style={{...neuInset(12),padding:"10px 12px",marginBottom:16,fontSize:12,color:P.neuSub,lineHeight:1.6,minHeight:52}}>
          {v.ok&&preview
            ?<>This period runs <strong style={{color:P.neuInk}}>{fmtD(preview.start)} – {fmtD(preview.end)}</strong> ({preview.len} days).
               <br/>{preview.moving>0
                 ?<>{preview.moving} logged {preview.moving===1?"expense moves":"expenses move"} into it.</>
                 :<>No logged expenses change period.</>}
               <br/><span style={{color:P.faint}}>Budget amounts don't change — the daily allowance adjusts instead.</span></>
            :<span style={{color:P.wine}}>{v.why}</span>}
        </div>
        <button onClick={()=>{if(v.ok)onConfirm(date);}} disabled={!v.ok}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:10,
            padding:"12px 0",fontSize:14,fontWeight:600,border:"none",
            background:v.ok?P.jade:P.sfA,color:v.ok?"#fff":P.faint,cursor:v.ok?"pointer":"default"}}>
          <I.Check size={14}/>Save
        </button>
      </div>
    </div>
    </Portal>
  );
}

function HomeView({budgetOwner,setBudgetOwner,profile,setProfile,owners,netWorth,banks,invSar,invSarForOwner,assetSar,liabSar,convert,sarRate,ratesAt,ratesErr,isOnline,data,invs,livePrice,livePriceAt,prevClose,portHistory,plans,activePlanId,goals,fmt,cur,setTab,setGlobalAddTrigger,contributeToGoal,history,planForMonth,expenses,payPeriods,mp2RatesByYear,includeMp2Estimate,setExpensesFilterRequest}){
  /* profile/setProfile now come from App() and are shared with Banks,
     Investments and Net Worth — see VIEW_PROFILE_KEY. setProfile is already
     the synced setter, so this alias just keeps the call sites below. */
  const setProfileSynced=setProfile;
  const[goalSheet,setGoalSheet]=useState(false);
  const[qaSheet,setQaSheet]=useState(false);
  useScrollLock(goalSheet);
  const homeDisplay=data.homeDisplay||{};
  const homeSettings=data.homeSettings||{};
  const visibility=homeSettings.cardVisibility||{};
  const isVisible=key=>visibility[key]!==false;
  const savingsCategories=homeSettings.savingsCategories||[];
  const investmentCategories=homeSettings.investmentCategories||[];
  const savingsTargetPct=(data.settings&&data.settings.savingsTargetPct)||20;

  /* Completed-period history behind the two trend cards. Empty until three
     periods have been tracked, which is what keeps those cards unrendered —
     see the block comment above LifestyleCreepCard. */
  const trendHistory=useMemo(
    ()=>bucketHistoryCombined(profile,{planForMonth,expenses,payPeriods},savingsCategories,investmentCategories),
    [profile,planForMonth,expenses,payPeriods,savingsCategories,investmentCategories]);

  /* Investment Accounts (Phase 1): everything below is filtered by the
     selected profile using the same investmentsForProfile()/invSarForOwner()
     helpers App() already computed — no calculation is re-derived here,
     just sliced per owner so each card only ever shows its own profile's
     accounts (banks were already owner-tagged; investments now are too). */
  const profileInvs=useMemo(()=>investmentsForProfile(invs,profile),[invs,profile]);
  const profileBanks=useMemo(()=>profile==="household"?(banks||[]):(banks||[]).filter(b=>b.owner===profile),[banks,profile]);
  const profileInvSar=profile==="household"?invSar:invSarForOwner(profile);

  const netWorthByProfile=useCallback(profileKey=>{
    if(profileKey==="household")return netWorth;
    const ownerBanksSar=(banks||[]).filter(b=>b.owner===profileKey).reduce((s,b)=>{
      const v=convert?convert(bankValue(b),b.currency,"SAR"):null;return s+(v==null?0:v);
    },0);
    return ownerBanksSar+invSarForOwner(profileKey)+assetSar-liabSar;
  },[banks,invSarForOwner,assetSar,liabSar,convert,netWorth]);

  /* Drill-down for the Tracked Spending card. Expenses derives its own
     viewMonth from bucketNow(payPeriods,budgetOwner) and re-anchors whenever
     budgetOwner changes, so aligning the owner and switching tab lands on the
     right profile AND the current period with no extra state. "Household"
     isn't a real profile in the data model, so it drills into whichever owner
     is currently active rather than inventing a combined Expenses view. */
  const openExpenses=useCallback(()=>{
    if(profile==="me"||profile==="wife")setBudgetOwner(profile);
    setTab("expenses");
  },[profile,setBudgetOwner,setTab]);

  /* Savings & Investing's drill-down (§4/§10): same owner/tab handoff as
     Tracked Spending, plus a one-shot filter request so Expenses opens
     already scoped to the selected savings+investment categories instead of
     showing everything. ExpenseTrackerView applies this itself (matches
     category names to this month's category ids) and doesn't otherwise
     change — Expenses stays out of scope for this phase. */
  const openExpensesFiltered=useCallback(()=>{
    if(profile==="me"||profile==="wife")setBudgetOwner(profile);
    if(setExpensesFilterRequest){
      setExpensesFilterRequest({catNames:[...savingsCategories,...investmentCategories],nonce:Date.now()});
    }
    setTab("expenses");
  },[profile,setBudgetOwner,setTab,setExpensesFilterRequest,savingsCategories,investmentCategories]);

  const actions={
    onExpense:()=>{setTab("expenses");setGlobalAddTrigger(n=>n+1);},
    onIncome:()=>setTab("budget"),
    onInvestment:()=>setTab("investments"),
    onGoal:()=>setGoalSheet(true),
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div className="home-grid">
        {isVisible("hero")&&
          <div className="home-cell cell-hero">
            <HeroCard profile={profile} setProfile={setProfileSynced} owners={owners}
              netWorthByProfile={netWorthByProfile} history={history} homeDisplay={homeDisplay} convert={convert} ratesErr={ratesErr}
              onOpen={()=>setTab("networth")}/>
          </div>}
        {isVisible("portfolio")&&
          <div className="home-cell cell-portfolio">
            <PortfolioCard invs={profileInvs} livePrice={livePrice} livePriceAt={livePriceAt} prevClose={prevClose} convert={convert} homeDisplay={homeDisplay} portHistory={portHistory} snapshots={data.snapshots} profile={profile} isOnline={isOnline} isHousehold={profile==="household"} mp2RatesByYear={mp2RatesByYear} includeMp2Estimate={includeMp2Estimate}
              onOpen={()=>setTab("investments")}/>
          </div>}
        {isVisible("savingsInvesting")&&
          <div className="home-cell cell-savings">
            <SavingsInvestingCard profile={profile} payPeriods={payPeriods} planForMonth={planForMonth} expenses={expenses}
              savingsCategories={savingsCategories} investmentCategories={investmentCategories}
              homeDisplay={homeDisplay} convert={convert} cur={cur} savingsTargetPct={savingsTargetPct}
              onOpen={openExpensesFiltered}/>
          </div>}
        {isVisible("trackedSpending")&&
          <div className="home-cell cell-budget">
            <TrackedSpendingCard profile={profile} owners={owners} payPeriods={payPeriods}
              planForMonth={planForMonth} expenses={expenses}
              homeDisplay={homeDisplay} convert={convert} cur={cur} onOpen={openExpenses}/>
          </div>}
        {isVisible("goals")&&
          <div className="home-cell cell-goals">
            <GoalsSummaryCard goals={goals} profile={profile} owners={owners} onOpen={()=>setTab("goals")}/>
          </div>}
        {/* Both render null until three completed periods exist, so the cells
            are wrapped to stay out of the grid entirely rather than leaving a
            gap where an invisible card would sit. */}
        {isVisible("lifestyle")&&trendHistory.length>=MIN_TREND_BUCKETS&&
          <div className="home-cell cell-lifestyle">
            <LifestyleCreepCard history={trendHistory} homeDisplay={homeDisplay} convert={convert} cur={cur}
              onOpen={openExpenses}/>
          </div>}
        {isVisible("savingsTrend")&&trendHistory.length>=MIN_TREND_BUCKETS&&
          <div className="home-cell cell-savingstrend">
            <SavingsTrendCard history={trendHistory} savingsTargetPct={savingsTargetPct}
              onOpen={openExpensesFiltered}/>
          </div>}
        <div className="home-cell cell-qa">
          <QuickActions {...actions}/>
        </div>
      </div>
      {/* Mobile-only floating +; App suppresses its global FAB on the Home tab
          so only ever one + is on screen, and CSS hides this one >=768px where
          the in-grid Quick Actions bar takes over.
          MUST be portalled to <body>: HomeView renders inside TabPane, whose
          .tab-enter-* animation is declared `both`, so the final keyframe's
          transform:translateX(0) sticks permanently. Any transform other than
          `none` makes that element the containing block for position:fixed
          descendants, which would anchor this button to the tab pane and make
          it scroll with the page instead of floating. App's own FAB avoids
          this by living outside TabPane; Portal is how the rest of this file
          escapes transformed/clipped ancestors. */}
      <Portal>
        <button aria-label="Quick add" className="fab-btn home-fab" onClick={()=>setQaSheet(true)}
          style={{background:P.gr}}>
          <I.Plus size={24}/>
        </button>
      </Portal>
      {qaSheet&&<QuickActionSheet {...actions} onClose={()=>setQaSheet(false)}/>}
      {goalSheet&&<GoalContributionSheet goals={goals} contributeToGoal={contributeToGoal} onClose={()=>setGoalSheet(false)}/>}
    </div>
  );
}

/* ── BUDGET VIEW — month-aware, percentage shown inline beside amount ── */
function BudgetView({planForMonth,planSourceForMonth,monthlyPlans,plans,clonePlanForMonth,editPlanForMonth,removePlanForMonth,activePlanId,fmt,cur,budgetOwner,setBudgetOwner,owners,payPeriods,investTarget,setInvestTarget,syncNow,installments,installmentPayments,onOpenInstallment,goals}){
  const usesPayPeriod=ownerUsesPayPeriod(payPeriods,budgetOwner);
  const nowMonth=bucketNow(payPeriods,budgetOwner);
  const[viewMonth,setViewMonth]=useState(nowMonth);
  // when switching owners, OR when pay-period settings finish loading/change
  // (e.g. the cloud sync pull resolves after this component already mounted
  // with default settings), re-anchor to that owner's "now" so we're never
  // holding a calendar-month key while in pay-period mode (or vice versa) —
  // that mismatch is what produces "Invalid Date".
  useEffect(()=>{setViewMonth(bucketNow(payPeriods,budgetOwner));},[budgetOwner,JSON.stringify(payPeriods)]);
  const[expandedSubs,setExpandedSubs]=useState({});
  const toggleSubs=id=>setExpandedSubs(s=>({...s,[id]:!s[id]}));
  /* Move-categories selection. Groups (Invest & Grow, Essentials, …) are the
     fixed frame; the CATEGORY rows under them are what gets reorganised, so
     this ticks categories and moves them to a different group. Plan-wide:
     categories from any number of groups can be ticked at once and land in a
     single destination. Keyed by category id → its current group id, which the
     destination sheet needs for its before/after summary. */
  const[selectMode,setSelectMode]=useState(false);
  const[selectedCats,setSelectedCats]=useState({});
  /* Goals this owner can link a category to. Live only — a tombstoned goal
     must not be offerable, and an already-linked-but-deleted goal shows as
     "No goal" because categoryGoalFor resolves it to null anyway. */
  const ownerGoals=useMemo(()=>(goals||[]).filter(g=>g.owner===budgetOwner&&!g.deletedAt),[goals,budgetOwner]);
  const[showMoveSheet,setShowMoveSheet]=useState(false);
  useScrollLock(showMoveSheet);
  const moveSheetRef=useDialogA11y(()=>setShowMoveSheet(false),showMoveSheet);
  const exitSelect=()=>{setSelectMode(false);setSelectedCats({});setShowMoveSheet(false);};
  const toggleSelectCat=(catId,groupId)=>setSelectedCats(s=>{
    if(s[catId]){const n={...s};delete n[catId];return n;}
    return{...s,[catId]:groupId};
  });
  // a selection is only meaningful within one plan — drop it when the plan
  // under it changes out from under the user (month nav, owner switch)
  useEffect(()=>{setSelectMode(false);setSelectedCats({});setShowMoveSheet(false);},[viewMonth,budgetOwner]);
  // Mobile UX fix: deletion of a group/category/sub-item used to be a bare
  // icon button sitting right next to the tracking-toggle and expand
  // buttons — a prime accidental-tap spot. Deletes now route through this
  // single confirm dialog instead of firing immediately.
  const[confirmDelete,setConfirmDelete]=useState(null); // {type:"group"|"cat"|"sub",id,subId,name}
  const[showInvestSettings,setShowInvestSettings]=useState(false);
  /* neu/neuInset/glassPanel come from the shared helpers above; only alias
     the button-style one since its shared name differs (neuBtnStyle). */
  const neuBtn=neuBtnStyle;

  const addMonths=(ym,n)=>bucketShift(ym,payPeriods,budgetOwner,n);
  const fmtMonth=m=>bucketLabel(m,payPeriods,budgetOwner);
  const isFuture=viewMonth>nowMonth;
  const isNow=viewMonth===nowMonth;
  const isPast=viewMonth<nowMonth;

  /* the plan that applies to the viewed month for this owner, and where it
     came from — an exact mapping, an earlier month it carries forward from, or
     the base plan when nothing precedes it. */
  const planSource=planSourceForMonth(viewMonth,budgetOwner);
  const monthPlan=planSource.plan;
  const hasOwnPlan=planSource.exact;

  /* keep a category's stored amount in sync with its sub-items' sum */
  const syncAmt=c=>{const subs=c.subs||[];return subs.length>0?{...c,amount:subs.reduce((s,x)=>s+(Number(x.amount)||0),0)}:c;};

  /* ── month-scoped mutators ────────────────────────────────────────────────
     Every one routes through editPlanForMonth, which copies the carried-
     forward plan into a real plan for this month on the first actual change
     (see its comment). Nothing here needs to know whether that happened —
     which is the point: a mutator that forgot would silently edit the plan
     every other month is inheriting. */
  const cowLabel=fmtMonth(viewMonth);
  const editMonth=mutate=>editPlanForMonth(viewMonth,budgetOwner,cowLabel,mutate);
  const editCats=up=>editMonth(p=>({...p,categories:up(p.categories||[])}));
  const editGrps=up=>editMonth(p=>({...p,groups:up(p.groups||[])}));

  const updateCat=(id,patch)=>editCats(cats=>cats.map(c=>c.id===id?{...c,...patch}:c));
  const addCat=gid=>editCats(cats=>[...cats,{id:uid(),name:"New category",amount:0,groupId:gid,color:SEG[cats.length%SEG.length],subs:[],trackExpenses:true}]);
  /* Tombstone, never splice. A hard delete cannot survive a merge: the other
     device's copy still has the record and a union merge would resurrect it.
     livePlanView filters these out of every read. */
  const removeCat=id=>editCats(cats=>cats.map(c=>c.id===id?{...c,deletedAt:new Date().toISOString()}:c));
  const updateSub=(catId,subId,patch)=>editCats(cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:(c.subs||[]).map(s=>s.id===subId?{...s,...patch}:s)}):c));
  const removeSub=(catId,subId)=>editCats(cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:(c.subs||[]).filter(s=>s.id!==subId)}):c));
  const addGroup=()=>editGrps(gs=>[...gs,{id:uid(),name:"New group"}]);
  const renameGroup=(id,name)=>editGrps(gs=>gs.map(g=>g.id===id?{...g,name}:g));
  /* One mutate, not two chained calls: deleting a group and orphaning its
     categories is a single decision about this month's budget, so it must be
     one clone decision and one undo step. */
  const removeGroup=id=>editMonth(p=>{
    const at=new Date().toISOString();
    return{...p,
      categories:(p.categories||[]).map(c=>c.groupId===id&&!c.deletedAt?{...c,deletedAt:at}:c),
      groups:(p.groups||[]).map(g=>g.id===id?{...g,deletedAt:at}:g)};
  });
  const setIncome=v=>editMonth(p=>({...p,income:Number(v)||0}));

  const handleAddSub=catId=>{
    editCats(cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:[...(c.subs||[]),{id:uid(),name:"New item",amount:0}]}):c));
    setExpandedSubs(s=>({...s,[catId]:true}));
  };
  const handleSubChange=(catId,subId,patch)=>updateSub(catId,subId,patch);
  const handleRemoveSub=(catId,subId)=>removeSub(catId,subId);

  /* Module scope now (categoryEffectiveAmt, in the Purchase Advisor engine
     block) — ExpenseTrackerView carried a second inline copy and the advisor
     needed a third. Same rule, one statement of it. */
  const effectiveAmt=categoryEffectiveAmt;

  /* ── move categories between groups ─────────────────────────────────────
     Groups are the fixed frame of a budget; the categories under them are what
     actually gets reorganised as life changes. A category carries its own
     `amount`/`subs`/`trackExpenses` and everything that references it keys on
     the CATEGORY id (expenses, targets, envelopes, quick transfers), so
     changing `groupId` moves the money with it and rewires nothing else. No
     amount is created, destroyed or reinterpreted — group totals are derived
     sums, so they simply re-add.

     The one real consequence, surfaced in the sheet below: `investTarget`
     keys on group NAMES, so moving a category into or out of a group named
     there changes the Invest & Grow figure. That is usually the intent, but it
     should never be a surprise. */
  const selectedIds=Object.keys(selectedCats);
  const selectedInfo=useMemo(()=>{
    const cats=(monthPlan.categories||[]).filter(c=>selectedCats[c.id]);
    let total=0;
    const sourceGroupIds=new Set();
    const byGroup={};  // how much each source group is giving up
    cats.forEach(c=>{
      const amt=effectiveAmt(c);
      total+=amt;
      byGroup[c.groupId]=(byGroup[c.groupId]||0)+amt;
      sourceGroupIds.add(c.groupId);
    });
    // groups that would be left with no categories at all
    const emptied=(monthPlan.groups||[]).filter(g=>sourceGroupIds.has(g.id)
      &&(monthPlan.categories||[]).filter(c=>c.groupId===g.id).every(c=>selectedCats[c.id]));
    return{total,cats,sourceGroupIds,byGroup,emptied};
  },[monthPlan,selectedCats]);

  const moveSelectedTo=destGroupId=>{
    editCats(cats=>{
      const moving=cats.filter(c=>selectedCats[c.id]&&c.groupId!==destGroupId);
      if(moving.length===0)return cats;
      const movingIds=new Set(moving.map(c=>c.id));
      /* Display order inside a group is array order (rendering filters
         categories by groupId), so appending puts the moved rows at the end of
         the destination group — predictable, rather than interleaving them at
         whatever positions they happened to occupy in the source. */
      return[...cats.filter(c=>!movingIds.has(c.id)),
             ...moving.map(c=>({...c,groupId:destGroupId}))];
    });
    exitSelect();
  };

  /* ── Derived Installments group ─────────────────────────────────────────
     Read-only rows built from the installment SCHEDULE for the viewed period.
     Nothing here is stored in the plan and nothing here goes through
     editPlanForMonth: paging to a month must derive and render, never
     materialise a copy-on-write plan. (A stored copy would be worse than
     redundant — clonePlanForMonth remints category ids every month, so a plan
     category could never be a stable link back to a payment.)

     They are deliberately NOT in monthPlan.groups, which is what keeps them
     invisible to the move-categories sheet, to renameGroup/removeGroup and to
     investTarget.groupNames — no exclusion code needed anywhere. */
  const installmentRows=useMemo(()=>derivedInstallmentRowsFor(
    installments,installmentPayments,budgetOwner,viewMonth,payPeriods),
    [installments,installmentPayments,budgetOwner,viewMonth,payPeriods]);
  /* Funded rows are excluded, not hidden. Their money is allocated by the
     envelope they came out of, so counting them here as well would reserve the
     same riyal twice in one month — and this figure feeds the untracked-envelope
     allocation the unaccounted sheet reconciles against, so the double would
     show up as a plan that never balances. The row itself stays visible in the
     group below, greyed, saying where it went. */
  const installmentTotal=installmentRows.reduce((s,r)=>s+(r.fundedElsewhere?0:r.amount),0);

  /* month-scoped totals */
  const income=Number(monthPlan.income)||0;
  const manualAllocated=(monthPlan.categories||[]).reduce((s,c)=>s+effectiveAmt(c),0);
  /* Installments due this period are money already committed, so they count
     toward Allocated — otherwise "Left" would read as free money that is in
     fact spoken for. */
  const allocated=manualAllocated+installmentTotal;
  const remaining=income-allocated;
  const pct=n=>income>0?((Number(n)||0)/income)*100:0;

  /* Default: copy whatever is currently being previewed for this month
     (fixes the old bug where this silently pulled from the base plan
     instead of the shown carry-forward/custom plan). */
  const[showCopyPicker,setShowCopyPicker]=useState(false);
  const[copySourceMonth,setCopySourceMonth]=useState("");
  /* Pick a source *month*, not a plan record. The old list was every plan the
     owner had ever owned — and since removePlanForMonth only tombstones the
     month→plan mapping, orphaned plans accumulate all bearing the same month
     label, so "March 2026" could appear three times with no way to tell them
     apart. Worse, a month that never had a custom copy had no entry at all.
     Resolving through planForMonth — the same function this tab renders from —
     means the option shows, and copies, exactly what that month displays. */
  const copyMonthOptions=useMemo(()=>{
    /* Anchored on the VIEWED month and reaching forwards as well as back: any
       month can have its own plan now, so "plan October from September" is a
       real thing to want and the old backwards-only-from-today window made it
       impossible. Months with their own mapping are unioned in so a custom
       plan further out than the window is still reachable. */
    const range=[];
    for(let i=-12;i<=3;i++)range.push(addMonths(viewMonth,i));
    const owned=(monthlyPlans||[])
      .filter(m=>m.owner===budgetOwner&&!m.deletedAt&&m.planId)
      .map(m=>m.month)
      // a mapping left over from the other bucket mode has a different key
      // shape and would render a nonsense label through fmtMonth
      .filter(m=>String(m).length===String(viewMonth).length);
    const out=[];
    [...new Set([...range,...owned])].filter(m=>m!==viewMonth).sort().reverse().forEach(m=>{
      const p=planForMonth(m,budgetOwner);
      if(!p)return;
      out.push({month:m,plan:p,
        custom:!!(monthlyPlans||[]).find(x=>x.month===m&&x.owner===budgetOwner),
        future:m>nowMonth});
    });
    return out;
  },[nowMonth,viewMonth,budgetOwner,plans,monthlyPlans,JSON.stringify(payPeriods)]);
  const[confirmOverwrite,setConfirmOverwrite]=useState(false);
  const doCopyFrom=()=>{
    const src=planForMonth(copySourceMonth,budgetOwner);
    if(!src)return;
    clonePlanForMonth(viewMonth,src.id,budgetOwner,fmtMonth(viewMonth));
    setShowCopyPicker(false);
    setConfirmOverwrite(false);
  };
  const createCopyFrom=()=>{
    if(!copySourceMonth)return;
    /* Copying over a month that already has its own plan discards that plan —
       removePlanForMonth only tombstones the mapping, so the old record is
       orphaned rather than recoverable. Worth one confirmation. */
    if(hasOwnPlan)setConfirmOverwrite(true);
    else doCopyFrom();
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px",transition:"background .25s ease"}}>
      {/* ── owner toggle ── */}
      <OwnerToggle owner={budgetOwner} setOwner={setBudgetOwner} owners={owners}/>

      {/* ── month navigator (glass — floating nav chrome) ── */}
      <div className="fade-up glass-panel" style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"10px 14px"}}>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,-1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>‹</button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontSize:15,fontWeight:700,color:P.ink}}>{fmtMonth(viewMonth)}</div>
          <div style={{fontSize:11,fontWeight:600,marginTop:1,color:isFuture?P.br:isNow?P.jade:P.faint}}>
            {isFuture?"Planning ahead":isNow?(usesPayPeriod?"Current pay period":"Current month"):(usesPayPeriod?"Past pay period":"Past month")}
          </div>
        </div>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>›</button>
        {viewMonth!==nowMonth&&(
          <button className="glass-btn" onClick={()=>setViewMonth(nowMonth)}
            style={{padding:"4px 10px",fontSize:12,fontWeight:600,color:P.jadeD||P.jade}}>Today</button>
        )}
      </div>

      {/* ── plan status banner (neumorphic raised, subtly tinted) ── */}
      <div style={{...neu(14),padding:"12px 14px",marginBottom:12,
        display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,
            color:hasOwnPlan?P.br:planSource.fromMonth?P.jade:P.neuSub}}>
            <I.Receipt size={12}/>
            {hasOwnPlan?`Custom plan for ${fmtMonth(viewMonth)}`
              :planSource.fromMonth?`Carried forward from ${fmtMonth(planSource.fromMonth)}`
              :"Base plan"}
          </div>
          <div style={{fontSize:11,color:hasOwnPlan?P.br:planSource.fromMonth?P.gr:P.faint,marginTop:2}}>
            {hasOwnPlan
              ?"Only this month uses it. Later months carry it forward until you change them."
              :planSource.fromMonth
                ?`Editing anything here makes a copy for ${fmtMonth(viewMonth)} automatically. Earlier months keep what they had.`
                :`No month before this one has its own budget. Editing here makes a copy for ${fmtMonth(viewMonth)}; the base plan stays put.`}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
          {hasOwnPlan&&
            <button onClick={()=>removePlanForMonth(viewMonth,budgetOwner)} className="neu-btn"
              style={{fontSize:11,padding:"5px 12px",color:P.wine,fontWeight:500}}>Remove</button>}
          <button onClick={()=>setShowCopyPicker(v=>!v)}
            style={{fontSize:10,background:"transparent",border:"none",color:P.neuSub,padding:0,textDecoration:"underline",whiteSpace:"nowrap"}}>copy from a different month</button>
        </div>
      </div>

      {/* ── optional: pick a specific source plan to copy from ── */}
      {showCopyPicker&&(
        <div style={{...neuInset(14),padding:12,marginBottom:12,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <select value={copySourceMonth} onChange={e=>setCopySourceMonth(e.target.value)}
            style={{fontSize:12,borderRadius:8,padding:"5px 8px",background:P.neuBg,border:"none",color:P.neuInk,flex:1,minWidth:160}}>
            <option value="">Select a month to copy…</option>
            {copyMonthOptions.map(o=>(
              <option key={o.month} value={o.month}>
                {fmtMonth(o.month)} — {cur} {(o.plan.income||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}, {(o.plan.categories||[]).length} categories{o.custom?(o.future?" (planned)":""):" (carry-forward)"}
              </option>
            ))}
          </select>
          <button onClick={createCopyFrom} disabled={!copySourceMonth} className="neu-btn"
            style={{fontSize:11,padding:"6px 14px",color:copySourceMonth?P.jade:P.neuSub,fontWeight:600}}>Copy</button>
        </div>
      )}

      {/* ── income + allocation summary ── */}
      <div style={{...neu(16),padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"baseline",gap:6}}>
            <span style={{fontSize:12,color:P.neuSub,textTransform:"uppercase",letterSpacing:".08em"}}>Income</span>
            <span style={{fontSize:13,color:P.neuSub}}>{cur}</span>
            <NumField value={income} min={0}
              onCommit={setIncome}
              onBlur={()=>syncNow&&syncNow()}
              className="bare tnum serif" style={{fontSize:22,fontWeight:600,width:130,color:P.neuInk,
                ...neuInset(8),padding:"2px 8px"}}/>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:600,color:P.neuSub}}>Allocated {fmt(allocated)}</span>
          <span key={remaining} className="num-flash" style={{fontSize:13,fontWeight:600,color:remaining<0?P.wine:P.jade}}>
            {remaining<0?"Over by ":"Left "}{fmt(Math.abs(remaining))}
          </span>
        </div>
      </div>

      {/* ── allocation breakdown: proportion bar + list. The donut that used to
             sit here was decorative (no click, no filter, just a hover tooltip)
             and cost a whole card of height, so it's a stacked bar now — same
             SEG colours, same shape as Net Worth's Composition bar. ── */}
      {(()=>{
        const groupData=[
          ...(monthPlan.groups||[]).map((g,i)=>({
            name:g.name,
            value:(monthPlan.categories||[]).filter(c=>c.groupId===g.id).reduce((s,c)=>s+effectiveAmt(c),0),
            color:SEG[i%SEG.length],
          })),
          // the derived group takes a segment too, or the bar would claim the
          // income goes somewhere it doesn't
          ...(installmentTotal>0?[{name:"Installments",value:installmentTotal,color:P.br}]:[]),
        ].filter(d=>d.value>0);
        if(!groupData.length)return null;
        /* proportions of what's ALLOCATED, so the bar always fills — the
           income-vs-allocated gap is already stated in the card above. */
        const allocTotal=groupData.reduce((s,d)=>s+d.value,0);
        return(
          <div style={{...neu(16),padding:16,marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:600,color:P.neuSub,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Where {fmt(income)} goes</div>
            <div style={{...neuInset(999),height:12,width:"100%",overflow:"hidden",marginBottom:12,position:"relative"}}>
              <div style={{display:"flex",height:"100%",width:"100%"}}>
                {groupData.map(d=><div key={d.name} className="bar-animated liquid-fill" title={`${d.name} · ${fmt(d.value)}`}
                  style={{width:`${(d.value/allocTotal)*100}%`,height:"100%",background:liquidFillBg(d.color)}}/>)}
              </div>
            </div>
            {groupData.map(d=>(
              <div key={d.name} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,padding:"4px 0"}}>
                <span style={{width:9,height:9,borderRadius:999,background:d.color,flexShrink:0}}/>
                <span style={{flex:1,color:P.neuSub,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                <span className="tnum" style={{color:P.neuSub,fontSize:12,opacity:.75}}>{fmt(d.value)}</span>
                <span className="tnum" style={{color:P.neuSub,fontSize:12,opacity:.75,minWidth:52,textAlign:"right"}}>{pct(d.value).toFixed(2)}%</span>
              </div>
            ))}
          </div>
        );
      })()}

      {/* ── Invest & Grow target badge ── */}
      {(()=>{
        const investGroupNames=investTarget?.groupNames||[];
        const investAmt=(monthPlan.categories||[]).filter(c=>{
          const g=(monthPlan.groups||[]).find(gr=>gr.id===c.groupId);
          return g&&investGroupNames.includes(g.name);
        }).reduce((s,c)=>s+effectiveAmt(c),0);
        const investPct=pct(investAmt);
        const thresholdPct=Number(investTarget?.thresholdPct)||0;
        const meetsTarget=thresholdPct>0&&investPct>=thresholdPct;
        const gapSar=Math.max(0,(thresholdPct/100)*income-investAmt);
        const barPct=thresholdPct>0?Math.min(100,(investPct/thresholdPct)*100):Math.min(100,investPct);
        const fillColor=thresholdPct===0?P.neuSub:meetsTarget?P.jade:P.br;
        return(
          <div style={{...neu(16),padding:"12px 14px",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{fontSize:13,fontWeight:600,color:thresholdPct===0?P.neuSub:meetsTarget?P.jade:P.br}}>
                {thresholdPct>0&&(meetsTarget?"✓ ":"⚠ ")}
                Invest &amp; Grow — {investPct.toFixed(2)}% of income
                {thresholdPct>0&&(meetsTarget
                  ?` · meeting your ${thresholdPct}% target`
                  :` · ${fmt(gapSar)} short of ${thresholdPct}% target`)}
              </div>
              <button onClick={()=>setShowInvestSettings(v=>!v)} title="Edit target"
                style={{background:"transparent",border:"none",color:thresholdPct===0?P.neuSub:meetsTarget?P.jade:P.br,padding:2,display:"flex"}}>
                <I.Settings size={14}/>
              </button>
            </div>
            {/* ── signature: liquid-glass fill in a neumorphic inset trough ── */}
            <div style={{...neuInset(999),height:14,marginTop:10,overflow:"hidden"}}>
              <div className="bar-animated liquid-fill" style={{width:`${barPct}%`,
                background:`linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,.08) 45%, ${fillColor}CC 45%, ${fillColor} 100%)`}}/>
            </div>
            {showInvestSettings&&(
              <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${P.line}`}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <span style={{fontSize:12,color:P.neuSub}}>Target</span>
                  <NumField value={thresholdPct} min={0} max={100}
                    onCommit={v=>setInvestTarget({thresholdPct:v})}
                    className="bare tnum" style={{...neuInset(6),width:50,fontSize:13,fontWeight:600,textAlign:"right",padding:"2px 4px",color:P.neuInk}}/>
                  <span style={{fontSize:12,color:P.neuSub}}>% of income</span>
                </div>
                <div style={{fontSize:11,color:P.neuSub,marginBottom:6}}>Groups counted toward this target:</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                  {(monthPlan.groups||[]).map(g=>{
                    const checked=investGroupNames.includes(g.name);
                    return(
                      <label key={g.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:P.neuSub,cursor:"pointer"}}>
                        <input type="checkbox" checked={checked} onChange={()=>{
                          const next=checked?investGroupNames.filter(n=>n!==g.name):[...investGroupNames,g.name];
                          setInvestTarget({groupNames:next});
                        }}/>
                        {g.name}
                      </label>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* ── move categories: selection bar ──
          Needs at least two groups to have somewhere to move to, and at least
          one category to move. */}
      {(monthPlan.groups||[]).length>1&&(monthPlan.categories||[]).length>0&&(
        selectMode
          ?<div style={{...neu(14),padding:"8px 12px",marginBottom:12,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
             <span style={{fontSize:12,fontWeight:600,color:P.neuInk}}>
               {selectedIds.length} selected{selectedIds.length>0?` · ${fmt(selectedInfo.total)}`:""}
             </span>
             <button onClick={()=>setShowMoveSheet(true)} disabled={selectedIds.length===0}
               className="status-pill" style={{marginLeft:"auto",cursor:selectedIds.length?"pointer":"default",
                 border:`1px solid ${selectedIds.length?P.grS:P.line}`,background:selectedIds.length?P.grS:"transparent",
                 color:selectedIds.length?P.grD:P.neuSub}}>
               Move…
             </button>
             <button onClick={exitSelect} className="status-pill"
               style={{cursor:"pointer",border:`1px solid ${P.line}`,background:"transparent",color:P.neuSub}}>
               Cancel
             </button>
           </div>
          :<button onClick={()=>setSelectMode(true)} className="status-pill"
             style={{marginBottom:12,cursor:"pointer",border:`1px solid ${P.line}`,background:"transparent",color:P.neuSub}}>
             Select categories to move
           </button>
      )}

      {(monthPlan.groups||[]).map(g=>{
        const items=(monthPlan.categories||[]).filter(c=>c.groupId===g.id);
        const groupTotal=items.reduce((s,c)=>s+effectiveAmt(c),0);
        /* overflow:clip, not hidden — `hidden` turns the section into a
           scroll container and the sticky group header stops working. */
        return(
          <section key={g.id} style={{...neu(16),overflow:"clip",marginBottom:16}}>
            {/* Group header — sticky while this card is on screen */}
            <div className="group-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px"}}>
              <input value={g.name} onChange={e=>renameGroup(g.id,e.target.value)} className="bare" style={{fontSize:14,fontWeight:600,color:P.neuInk}}/>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:13,fontWeight:600,color:P.neuSub}} className="tnum">{fmt(groupTotal)}</span>
                <IconButton icon={I.Trash} label={`Delete ${g.name||"group"}`} onClick={()=>setConfirmDelete({type:"group",id:g.id,name:g.name||"this group"})} size={14} style={{color:P.wine,opacity:.5}}/>
              </div>
            </div>

            {items.map(c=>{
              const subs=c.subs||[];
              const hasSubs=subs.length>0;
              const effAmt=effectiveAmt(c);
              // Selection works on the category rows themselves, so nothing
              // needs force-opening — collapsed rows are what makes a
              // plan-wide selection scannable in the first place.
              const subsOpen=expandedSubs[c.id];
              return(
                <div key={c.id} style={{borderBottom:"1px solid rgba(0,0,0,.06)"}}>
                  {/* Category row */}
                  <div className="cat-row">
                    <div className="cat-row-name">
                      {/* the checkbox replaces the colour dot rather than
                          sitting beside it — the row is already tight at
                          mobile widths */}
                      {selectMode
                        ?<input type="checkbox" checked={!!selectedCats[c.id]}
                           aria-label={`Select ${c.name||"category"}`}
                           onChange={()=>toggleSelectCat(c.id,c.groupId)}
                           style={{width:16,height:16,flexShrink:0,accentColor:P.jade}}/>
                        :<span style={{width:10,height:10,borderRadius:999,background:c.color,flexShrink:0}}/>}
                      <input value={c.name} onChange={e=>updateCat(c.id,{name:e.target.value})} className="bare"
                        style={{flex:1,fontSize:14,minWidth:0,fontWeight:hasSubs?600:400,
                          color:c.trackExpenses===false?P.neuSub:P.neuInk,fontStyle:c.trackExpenses===false?"italic":"normal"}}/>
                    </div>
                    <div className="cat-row-meta">
                      <div className="cat-row-figures">
                        <span className="tnum cat-pct" style={{fontSize:12,color:P.neuSub,width:44,textAlign:"right",opacity:.75}}>{pct(effAmt).toFixed(2)}%</span>
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <span className="cat-cur" style={{fontSize:11,color:P.neuSub}}>{cur}</span>
                          {hasSubs
                            /* when subs exist, show computed total (read-only style) */
                            ?<span className="tnum" style={{width:84,textAlign:"right",fontSize:14,fontWeight:600,color:P.jade}}>{effAmt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
                            /* no subs — manual input as before. navGroup wires Enter
                               to jump to the next amount down the page, so a monthly
                               sweep never has to dismiss and re-open the keyboard. */
                            :<NumField value={c.amount} onCommit={v=>updateCat(c.id,{amount:v})} min={0} navGroup="budget"
                              className="bare tnum" style={{width:84,textAlign:"right",fontSize:14,fontWeight:600,color:P.neuInk}}/>
                          }
                        </div>
                      </div>
                      <div className="cat-row-actions">
                        {/* Only the expander stays on the row. Tracked + Delete live
                            inside the panel it opens — see the .cat-row CSS note. */}
                        <button onClick={()=>toggleSubs(c.id)} title={subsOpen?"Hide details":"Show details"}
                          aria-label={subsOpen?`Hide details for ${c.name||"category"}`:`Show details for ${c.name||"category"}`} aria-expanded={subsOpen}
                          style={{background:"transparent",border:"none",color:subsOpen?P.jade:P.neuSub,padding:8,minWidth:40,minHeight:40,display:"flex",alignItems:"center",justifyContent:"center"}}>
                          <I.Chevron size={14} style={{transform:subsOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Sub-items panel */}
                  {subsOpen&&(

              </div>
            )}

                  // a group everything selected already sits in is not a move
                  if(selectedInfo.sourceGroupIds.size===1&&selectedInfo.sourceGroupIds.has(g.id))return null;
                  const items=(monthPlan.categories||[]).filter(c=>c.groupId===g.id);
                  const before=items.reduce((s,c)=>s+effectiveAmt(c),0);
                  // a destination can also be a source (a partial move out of
                  // it), so net its own contribution back out
                  const after=before-(selectedInfo.byGroup[g.id]||0)+selectedInfo.total;
                  const staying=items.filter(c=>!selectedCats[c.id]).length;
                  const arriving=selectedInfo.cats.filter(c=>c.groupId!==g.id).length;
                  /* investTarget keys on group NAMES, so this move can change
                     what counts toward Invest & Grow. Usually the intent —
                     never a surprise. */
                  const investNames=investTarget?.groupNames||[];
                  const intoInvest=investNames.includes(g.name);
                  const outOfInvest=selectedInfo.cats.some(c=>{
                    const sg=(monthPlan.groups||[]).find(x=>x.id===c.groupId);
                    return sg&&investNames.includes(sg.name);
                  });
                  return(
                    <button key={g.id} onClick={()=>moveSelectedTo(g.id)}
                      style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,
                        padding:"10px 14px",borderRadius:12,fontSize:14,textAlign:"left",border:"none",
                        background:"rgba(0,0,0,.05)",color:P.ink}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600}}>{g.name||"Untitled group"}</div>
                        <div style={{fontSize:11,color:P.faint,marginTop:2}}>
                          {fmt(before)} → {fmt(after)} · {staying+arriving} categor{staying+arriving===1?"y":"ies"}
                          {intoInvest&&!outOfInvest?" · counts toward Invest & Grow":""}
                          {!intoInvest&&outOfInvest?" · leaves Invest & Grow":""}
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
            <button onClick={()=>setShowMoveSheet(false)}
              style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:"transparent",color:P.sub,border:`1px solid ${P.line}`}}>
              Cancel
            </button>
          </div>
        </div>
        </Portal>
      )}

      <ConfirmDialog open={!!confirmDelete}
        title={confirmDelete?.type==="group"?`Delete "${confirmDelete.name}"?`:confirmDelete?.type==="cat"?`Delete "${confirmDelete.name}"?`:`Delete "${confirmDelete?.name}"?`}
        message={confirmDelete?.type==="group"?"This also deletes every category inside this group. This can't be undone.":"This can't be undone."}
        onConfirm={()=>{

          else if(confirmDelete?.type==="sub")removeSub(confirmDelete.id,confirmDelete.subId);
          setConfirmDelete(null);

      <ConfirmDialog open={confirmOverwrite}
        title={`Replace ${fmtMonth(viewMonth)}'s plan?`}
        message={`${fmtMonth(viewMonth)} already has its own budget. Copying ${copySourceMonth?fmtMonth(copySourceMonth):"another month"} over it discards the current one.`}
        confirmLabel="Replace" danger
        onConfirm={doCopyFrom}
        onCancel={()=>setConfirmOverwrite(false)}/>
    </div>
  );

/* Rank remembered transaction names against what the user has typed so far.
   Substring match, so "amazon" still finds "Buy Amazon gift card" — but a
   prefix match ranks above a mid-string one, and ties keep the caller's order,
   which is already most-recent-first. Pure + module scope so suggesttest.cjs
   can slice it out (see CLAUDE.md on testing). */
function rankNameSuggestions(names,query,limit=6){
  const list=names||[];
  const q=(query||"").trim().toLowerCase();
  if(!q)return list.slice(0,limit);
  const hits=[];
  list.forEach((n,i)=>{
    const at=String(n).toLowerCase().indexOf(q);
    if(at>=0)hits.push({n,rank:at===0?0:1,i});
  });
  hits.sort((a,b)=>a.rank-b.rank||a.i-b.i);
  return hits.map(h=>h.n).slice(0,limit);
}

/* Repeatable past transactions, most recent first — the data behind the
   "Repeat" chips in the add-transaction modal. One tap refills category, name
   AND amount, which is what makes a recurring entry two taps instead of six.

   Pure + module scope so suggesttest.cjs can slice it out (see CLAUDE.md).

   Three exclusions, none of them cosmetic:
   - `isExtraFunds` rows are money coming IN, stored as ordinary expenses.
     Offering one here would let a tap record incoming money as spending — the
     exact trap CLAUDE.md records against new reduces over `expenses`.
   - `isTransfer` rows (untracked transfers, goal contributions, installment
     payments) don't belong to a plan category at all; their `catId` is a goal
     or installment id, so replaying one through the tracked form would write a
     tracked expense against an id no envelope will ever match.
   - tombstones. The caller already filters them (`index.html`'s App-level
     `expenses`), but this is defensive: a pure helper that silently offers
     deleted rows when handed a raw array is a trap for the next caller.

   `catIds`, when given, keeps only rows whose category still exists in the
   viewed month's plan. Without it a chip could fill a `catId` the dropdown has
   no option for — the select would render blank and Save would write a
   dangling reference.

   Deduped on `name|catId`, not name alone: the same name under two categories
   is genuinely two different repeats ("Top-up" against Transport and against
   Phone), and collapsing them would silently pick one category for both. */
/* Pinned shortcuts for one owner, oldest-pinned first so the row doesn't
   reshuffle under someone's thumb as they add more. Same category filter as
   recentTxTemplates and for the same reason: a shortcut whose category has been
   deleted from the plan would fill a catId the dropdown can't show.

   Kept separate from the derived Repeat list rather than merged into it — a
   shortcut is a thing the user made and can delete, a repeat is an observation
   about history, and one row that sometimes offers a delete affordance is the
   overloading this app already decided against for the name chips. */
function liveTxTemplates(templates,owner,{catIds=null}={}){
  const ok=catIds?(catIds instanceof Set?catIds:new Set(catIds)):null;
  return(templates||[]).filter(t=>
    t&&!t.deletedAt&&(t.owner||"me")===owner
    &&t.name&&t.catId&&Number(t.amount)>0
    &&(!ok||ok.has(t.catId)))
    .sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
}

/* Is this exact (name,catId) already pinned? Drives both the "already pinned"
   state of the pin button and the de-duplication of the Repeat row against the
   Shortcuts row — without it the same entry shows twice, one row apart. */
function txTemplateKey(t){return`${t.name}|${t.catId}`;}

function recentTxTemplates(expenses,owner,{limit=8,catIds=null,excludeKeys=null}={}){
  const ok=catIds?(catIds instanceof Set?catIds:new Set(catIds)):null;
  const skip=excludeKeys?(excludeKeys instanceof Set?excludeKeys:new Set(excludeKeys)):null;
  const rows=(expenses||[]).filter(e=>
    e&&!e.deletedAt&&!e.isTransfer&&!e.isExtraFunds
    &&(e.owner||"me")===owner
    &&e.name&&e.catId&&Number(e.amount)>0
    &&(!ok||ok.has(e.catId)));
  /* date first, then createdAt — the same "when did this happen / when was it
     entered" pair compareTxForDisplay uses. `ord` is deliberately ignored: it
     is a within-a-day display preference, not a statement about recency. */
  rows.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))
    ||String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  const seen=new Map();
  for(const e of rows){
    const key=`${e.name}|${e.catId}`;
    if(skip&&skip.has(key))continue;
    if(!seen.has(key))seen.set(key,{key,name:e.name,catId:e.catId,amount:Number(e.amount),date:e.date||""});
    if(seen.size>=limit)break;
  }
  return[...seen.values()];
}

/* Explains the "unaccounted" figure in the Expenses hero. Portalled for the
   same reason as ConfirmDialog/AdjustReserveSheet — ExpenseTrackerView renders
   inside TabPane, whose stuck transform would otherwise anchor this to the tab
   pane rather than the viewport. */
function UnaccountedSheet({monthLabel,income,parts,total,fmt,onClose}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  /* income always shows (even at zero — a blank plan is exactly what you'd want
     explained); the rest only when they actually contributed something */
  const rows=[{label:"Income for this period",value:income,sign:1}].concat([
    {label:"Extra funds received",value:parts.extraFunds,sign:1},
    {label:"Tracked spending",value:parts.trackedSpend,sign:-1},
    {label:"Transfers out (Savings, Investment…)",value:parts.untrackedTransfers,sign:-1},
    {label:"Goal contributions",value:parts.goalContribs,sign:-1},
  ].filter(r=>r.value>0));
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1}
        onClick={e=>e.stopPropagation()} style={{maxHeight:"85dvh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>{total<0?"Over-transferred":"Unaccounted"} — {monthLabel}</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub}}/>
        </div>
        <div style={{fontSize:12,color:P.faint,marginBottom:14}}>
          Everything logged against this period, whether you tracked it as spending or just moved it somewhere.
        </div>
        {rows.map(r=>(
          <div key={r.label} style={{display:"flex",alignItems:"baseline",gap:10,padding:"7px 0",borderBottom:`1px solid ${P.line}`}}>
            <span style={{flex:1,fontSize:13,color:P.sub,minWidth:0}}>{r.label}</span>
            <span className="tnum" style={{fontSize:14,fontWeight:600,color:r.sign>0?P.gr:P.ink}}>
              {r.sign>0?"+":"−"} {fmt(r.value)}
            </span>
          </div>
        ))}
        <div style={{display:"flex",alignItems:"baseline",gap:10,paddingTop:12}}>
          <span style={{flex:1,fontSize:13,fontWeight:600,color:P.ink}}>{total<0?"Over-transferred":"Still unaccounted for"}</span>
          <span className="tnum" style={{fontSize:20,fontWeight:700,color:total<0?P.wine:P.br}}>{fmt(Math.abs(total))}</span>
        </div>
        <div style={{fontSize:12,color:P.faint,marginTop:12}}>
          {total<0
            ?"You've logged more than this period's income — either the plan's income is low, or something was logged against the wrong period."
            :"Money from this period's pay that hasn't been spent, transferred or put toward a goal yet."}
        </div>
      </div>
    </div>
    </Portal>
  );
}

function ExpenseTrackerView({data,plans,planForMonth,planSourceForMonth,clonePlanForMonth,editPlanForMonth,assignPlanToMonth,removePlanForMonth,expenses,addExpenseTx,updateExpenseTx,removeExpenseTx,setExpenseDayOrder,quickTransfer,quickTransferLast,addExtraFunds,fmt,cur,budgetOwner,setBudgetOwner,owners,payPeriods,goals,contributeToGoal,globalAddTrigger,setGlobalAddTrigger,filterRequest,installments,installmentPayments,updateInstallmentExpense,unlinkInstallmentExpense,triggerUndo,pinTxTemplate,removeTxTemplate,txTemplates}){

          amount:evalMathExpr(form.amount,Number(form.amount)||0),date:form.date});
        closeForm();
        return;
      }
      if(!form.catId||!form.name||!form.amount)return;
      updateExpenseTx(editTx,{catId:form.catId,name:form.name,note:form.note,amount:evalMathExpr(form.amount,Number(form.amount)||0),date:form.date});
      closeForm();
      return;
    }
    const amt=evalMathExpr(form.amount,Number(form.amount)||0);
    if(!amt)return;
    if(addMode==="tracked"){
      if(!form.catId||!form.name)return;
      addExpenseTx(form.catId,form.name,form.note,amt,form.date,budgetOwner);
    }else if(addMode==="untracked"){
      if(!form.catId)return;
      const env=untrackedEnvelopes.find(e=>e.id===form.catId);

    }else if(addMode==="goals"){
      if(!form.goalId)return;

         could persist half-written if a sync landed between them. One write
         now, and the two records link by id. */
      contributeToGoal({goalId:form.goalId,amount:amt,note:form.note,
        date:form.date,owner:budgetOwner,name:form.name||undefined});

     Tracked mode only, and that is a scope decision rather than an oversight.
     A Goals contribution writes TWO records (the transfer row and the goal's
     own contribution), so a one-record undo would silently leave the goal
     credited — "undo" has to mean undo. Untracked transfers additionally write
     `quickTransferLast`. Both are legitimate future work; neither is a
     one-record insert, which is the only shape this undo can honestly reverse.

     What carries to the next row and what clears is the whole design: category
     and date STAY (several items from one shop on one day is the case this
     exists for, and both are one tap to change), title/note/amount CLEAR
     (they're what differs). Nothing here writes `ord` — an absent `ord` is
     meaningful, and a rapid burst is exactly where inventing one would reorder
     someone's day. `createdAt` is stamped once per row by addExpenseTx. */
  const canRapidSave=!editTx&&addMode==="tracked"&&!!form.catId&&!!form.name&&!!form.amount;
  const saveAndAddAnother=()=>{
    if(!canRapidSave)return;
    const amt=evalMathExpr(form.amount,Number(form.amount)||0);
    if(!amt)return;
    const name=form.name;
    const id=addExpenseTx(form.catId,name,form.note,amt,form.date,budgetOwner);
    triggerUndo&&triggerUndo(`Saved "${name}"`,{collection:"expenses",id,undoKind:"remove"});
