      return{...d,[collection]:arr.map(x=>x.id===id?{...x,deletedAt:null,updatedAt:new Date().toISOString()}:x)};
    });
    pushImportantRef.current();
  };
  const undoTimerRef=useRef(null);
  const[undoAction,setUndoAction]=useState(null); // {label,collection,id,childKey?,childId?} | null
  const triggerUndo=(label,restoreArgs)=>{
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoAction({label,...restoreArgs});
    undoTimerRef.current=setTimeout(()=>setUndoAction(null),6000);
  };
  const performUndo=()=>{
    if(!undoAction)return;
    restoreRecord(undoAction.collection,undoAction.id,undoAction.childKey,undoAction.childId);
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoAction(null);
  };
  const[showRecentlyDeleted,setShowRecentlyDeleted]=useState(false);

  /* Hard-drops tombstones older than the retention window so deleted data
     doesn't accumulate forever. Only ever run once local is confirmed clean
     (hasUnsyncedChanges===false) so it isn't racing an in-flight edit, and
     it goes through the normal setData path (not skipSave) so the purge
     itself gets pushed to the cloud on the next sync like any other edit. */
  const TOMBSTONE_RETENTION_DAYS=90;
  const purgeOldTombstones=(d,days=TOMBSTONE_RETENTION_DAYS)=>{
    const cutoff=Date.now()-days*86400000;
    const fresh=x=>!(x.deletedAt&&new Date(x.deletedAt).getTime()<cutoff);
    const stripChild=(arr,childKey)=>(arr||[]).map(p=>p[childKey]?{...p,[childKey]:p[childKey].filter(fresh)}:p);
    const stripChildren=(arr,keys)=>keys.reduce((a,k)=>stripChild(a,k),arr);
    return{...d,
      expenses:(d.expenses||[]).filter(fresh),
      goals:stripChild((d.goals||[]).filter(fresh),"contributions"),
      investments:stripChildren((d.investments||[]).filter(fresh),["trades","contributions"]),
      banks:(d.banks||[]).filter(fresh),
      assets:(d.assets||[]).filter(fresh),
      targets:(d.targets||[]).filter(fresh),
      plans:(d.plans||[]).filter(fresh),
      mp2DividendRates:(d.mp2DividendRates||[]).filter(fresh),
    };
  };
  const purgedThisSessionRef=useRef(false);
  useEffect(()=>{
    if(!loaded||purgedThisSessionRef.current||hasUnsyncedChanges)return;
    purgedThisSessionRef.current=true;
    const purged=purgeOldTombstones(dataRef.current);
    if(fingerprint(purged)!==fingerprint(dataRef.current))setData(purged);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[loaded,hasUnsyncedChanges]);

  const hasUnsyncedRef=useRef(false);
  useEffect(()=>{hasUnsyncedRef.current=hasUnsyncedChanges;},[hasUnsyncedChanges]);
  const isOnlineRef=useRef(isOnline);
  useEffect(()=>{isOnlineRef.current=isOnline;},[isOnline]);

  /* ── device-local theme (light/dark) ──────────────────────────────────────
     Purely a per-device UI preference, same treatment as budgetOwner below —
     never synced to the cloud, never part of `data`. Two people sharing one
     dataset can each keep their own light/dark choice without it fighting
     over what gets pushed/pulled. ────────────────────────────────────────── */
  const[theme,setThemeState]=useState(()=>{
    try{return localStorage.getItem("allocation:theme")||"light";}catch(e){return "light";}
  });

  /* ── device-remembered default profile (Me / Wife) ───────────────────────
     Asked once per device on first open, then remembered locally. Never
     synced to the cloud — purely a per-device UI preference. The in-session
     owner toggle (OwnerToggle) can still switch views without changing
     this remembered default; only "Change default profile" in Settings
     updates it. ────────────────────────────────────────────────────────── */
  const[budgetOwner,setBudgetOwner]=useState(()=>{
    try{return localStorage.getItem(PROFILE_KEY)||"me";}catch(e){return "me";}
  });
  const[showProfilePicker,setShowProfilePicker]=useState(()=>{
    try{return !localStorage.getItem(PROFILE_KEY);}catch(e){return false;}
  });
  const[profilePickerDismissable,setProfilePickerDismissable]=useState(false);
  const chooseDefaultProfile=ok=>{
    setBudgetOwner(ok);
    try{localStorage.setItem(PROFILE_KEY,ok);}catch(e){}
    setShowProfilePicker(false);
  };
  const openProfilePicker=()=>{setProfilePickerDismissable(true);setShowProfilePicker(true);};

  const stashPreCloudBackup=d=>{
    try{
      const at=new Date().toISOString();
      localStorage.setItem(PRE_CLOUD_BACKUP_KEY,JSON.stringify({at,data:d}));
      setPreCloudBackupAt(at);
    }catch(e){}
  };
  const restorePreCloudBackup=()=>{
    try{
      const raw=localStorage.getItem(PRE_CLOUD_BACKUP_KEY);
      if(!raw)return;
      const backup=JSON.parse(raw);
      const restored=migrate(backup.data);
      skipSave.current=true;
      setData(restored);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));}catch(e){}
      const dirty=fingerprint(restored)!==lastCloudSnapshotRef.current;
      setHasUnsyncedChanges(dirty);
      const meta=loadSyncMeta();meta.hasUnsyncedChanges=dirty;saveSyncMeta(meta);
      setSyncMsg("Previous local copy restored");
      setTimeout(()=>setSyncMsg(""),3000);
    }catch(e){}
  };

  /* Never let a push happen from a session that hasn't actually confirmed
     the current cloud state yet — this is what stops a new device (or one
     that just timed out) from writing an empty/incomplete dataset over
     real data that's already on the cloud. Set true once a load genuinely
     completes (whether it found data or confirmed there's legitimately
     none yet), moot when kvReady is false since there's nothing to protect. */
  const cloudConfirmedRef=useRef(false);
  const [cloudWaiting,setCloudWaiting]=useState(false);
  const [cloudReconnecting,setCloudReconnecting]=useState(false);

  /* load — local-first startup policy:
     • No unsynced local changes  → safe to auto-pull the cloud copy, as before.
     • Unsynced local changes exist from a previous session → NEVER silently
       overwrite them. Check the cloud copy; if it's identical, mark clean;
       if it differs, merge (id + updatedAt everywhere, not just expenses).
     • The initial cloud fetch is capped at 6s so a hung connection can't
       freeze the app forever. A returning device (has a local copy already)
       shows it immediately if that timeout hits, and keeps quietly retrying
       in the background — safe, because nothing gets pushed until
       cloudConfirmedRef flips true. A brand-new device with nothing local
       is the one case that stays on the loading screen (with a visible
       "still connecting" message and an explicit opt-out) rather than ever
       showing an empty app that looks safe to start typing into. */
  useEffect(()=>{
    let cancelled=false;
    let retryHandle=null;

    const withTimeout=(p,ms)=>new Promise(res=>{
      let settled=false;
      const t=setTimeout(()=>{if(!settled){settled=true;res({timedOut:true,value:null});}},ms);
      p.then(v=>{if(!settled){settled=true;clearTimeout(t);res({timedOut:false,value:v});}})
       .catch(()=>{if(!settled){settled=true;clearTimeout(t);res({timedOut:false,value:null});}});
    });

    const reconcile=(remoteEnvelope,localResolved,meta)=>{
      let resolved=localResolved;
      const remoteRaw=remoteEnvelope&&remoteEnvelope.data;
      if(remoteRaw&&Array.isArray(remoteRaw.plans)){
        const remoteMigrated=migrate(remoteRaw);
        const remoteFP=fingerprint(remoteMigrated);
        const remoteRev=Number.isFinite(remoteEnvelope.rev)?remoteEnvelope.rev:meta.localRev||0;
        let conflictShown=false;
        if(localResolved){
          const localFP=fingerprint(localResolved);
          if(localFP===remoteFP){
            resolved=localResolved;
            meta.hasUnsyncedChanges=false;
          }else{
            const merged=tryAutoMergeAll(localResolved,remoteMigrated);
            if(merged){
              resolved=merged;
              meta.hasUnsyncedChanges=fingerprint(merged)!==remoteFP;
            }else if(!cancelled){
              resolved=localResolved;
              conflictShown=true;
              setConflict({local:localResolved,remote:remoteMigrated,remoteSavedAt:KVSync.lastPulledAt,remoteRev});
            }
          }
        }else{
          // genuinely no local copy on this device yet — remote is authoritative
          resolved=remoteMigrated;
          meta.hasUnsyncedChanges=false;
        }
        lastCloudSnapshotRef.current=remoteFP;
        meta.lastCloudSnapshot=remoteFP;
        meta.lastCloudPulledAt=new Date().toISOString();
        meta.lastCloudDownloadAt=meta.lastCloudPulledAt;
        // localRev only advances to the remote rev once this device's data
        // actually reflects it (clean match / successful merge / fresh
        // adopt). Left alone while a conflict modal is pending, since
        // `resolved` is still the stale pre-merge copy in that branch.
        if(!conflictShown)meta.localRev=remoteRev;
        if(!conflictShown)cacheSyncedSnapshot(remoteMigrated);
      }
      return resolved;
    };

    const finish=(resolved,meta)=>{
      if(cancelled)return;
      if(!lastCloudSnapshotRef.current&&meta.lastCloudSnapshot){
        lastCloudSnapshotRef.current=meta.lastCloudSnapshot;
      }
      if(resolved){
        skipSave.current=true;
        setData(resolved);
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(resolved));}catch(e){}
      }
      // A push that was mid-flight when the app was last killed/backgrounded
      // leaves pendingUpload=true behind (see markUploadPending). Now that
      // we have a definitive read of the cloud, resolve it for real instead
      // of guessing: if what we uploaded is what the cloud ended up
      // confirming as the reconciled baseline, it landed — clear the flag.
      // Otherwise leave it cleared too (no point tracking a specific
      // in-flight fingerprint anymore), but hasUnsyncedChanges — already
      // computed above by the normal fingerprint/merge reconcile — stays
      // whatever that determined, so a genuinely-lost upload's changes are
      // still marked dirty and will retry via the normal autosave path.
      if(meta.pendingUpload){meta.pendingUpload=false;meta.pendingUploadFP=null;}
      saveSyncMeta(meta);
      setHasUnsyncedChanges(!!meta.hasUnsyncedChanges);
      setChangesSinceSave(meta.changesSinceSave||0);
      setLocalRev(meta.localRev||0);
      setCloudRev(meta.localRev||0);
      if(meta.lastCloudSavedAt)setLastCloudSavedAt(new Date(meta.lastCloudSavedAt));
      if(meta.lastCloudPulledAt)setLastCloudPulledAt(new Date(meta.lastCloudPulledAt));
      setSyncStatus(meta.hasUnsyncedChanges?"pending":"synced");
    };

    const revealApp=()=>{
      setCloudWaiting(false);
      applyTheme(theme);applySegTheme(theme);setThemeTick(t=>t+1);
      setLoaded(true);
      if(typeof window.__hideLoading==="function")window.__hideLoading();
    };

    // quiet background retry — used both for a returning device that timed
    // out (nothing shown, just keeps trying) and a new device that's stuck
    // on the "still connecting" screen (its success reveals the app).
    const backgroundRetry=(localResolved,attempt=1)=>{
      if(cancelled||!kvReady)return;
      setCloudReconnecting(true);
      const delay=Math.min(30000,5000*attempt);
      retryHandle=setTimeout(async()=>{
        if(cancelled)return;
        let remoteRaw=null;
        try{remoteRaw=await KVSync.load();}catch(e){}
        if(cancelled)return;
        if(remoteRaw!==null||KVSync.lastPulledAt){
          // got an actual answer (data, or a confirmed-empty account)
          cloudConfirmedRef.current=true;
          setCloudReconnecting(false);
          const meta=loadSyncMeta();
          const resolved=reconcile(remoteRaw,dataRef.current||localResolved,meta);
          finish(resolved,meta);
          revealApp();
        }else{
          backgroundRetry(localResolved,attempt+1);
        }
      },delay);
    };

    (async()=>{
      const meta=loadSyncMeta();
      let localResolved=null;
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw)localResolved=migrate(JSON.parse(raw));
      }catch(e){}

      if(!kvReady){
        cloudConfirmedRef.current=true; // nothing to protect — sync isn't configured
        finish(localResolved,meta);
        revealApp();
        return;
      }

      const{timedOut,value:remoteRaw}=await withTimeout(KVSync.load(),9000);

      if(cancelled)return;

      if(!timedOut){
        // request genuinely completed — whether it found data or confirmed
        // the account is legitimately empty, either way we now know the
        // real cloud state, so it's safe to proceed and to allow pushes.
        cloudConfirmedRef.current=true;
        const resolved=reconcile(remoteRaw,localResolved,meta);
        finish(resolved,meta);
        revealApp();
        return;
      }

      // timed out — never got an answer either way
      if(localResolved){
        // returning device: show what it already has, keep confirming quietly
        finish(localResolved,meta);
        revealApp();
      }else{
        // brand-new device with nothing local: stay on the loading screen
        // and say so, rather than opening on an empty app that looks safe
        // to start typing into
        setCloudWaiting(true);
      }
      backgroundRetry(localResolved,1);
    })();

    return()=>{cancelled=true;if(retryHandle)clearTimeout(retryHandle);};
  },[]);

  /* explicit opt-out from the "still connecting" screen — proceeds with an
     empty local dataset, but does NOT mark the cloud confirmed, so no save
     can go out until a background retry actually succeeds and reconciles
     whatever gets entered in the meantime */
  const continueOffline=()=>{
    setCloudWaiting(false);
    skipSave.current=true;
    setData(migrate(defaultData()));
    applyTheme(theme);applySegTheme(theme);setThemeTick(t=>t+1);
    setLoaded(true);
    if(typeof window.__hideLoading==="function")window.__hideLoading();
  };

  const toggleTheme=()=>{
    const next=theme==="dark"?"light":"dark";
    applyTheme(next);
    applySegTheme(next);
    try{localStorage.setItem("allocation:theme",next);}catch(e){}
    setThemeTick(t=>t+1);
    setThemeState(next);
  };

  /* persist — LOCAL ONLY. Never calls KVSync.save(). Marks the app dirty
     whenever the data no longer matches the last cloud-synced snapshot. */
  useEffect(()=>{
    if(!loaded)return;
    if(skipSave.current){skipSave.current=false;return;}
    const t=setTimeout(()=>{
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){}
      const fp=fingerprint(data);
      const dirty=fp!==lastCloudSnapshotRef.current;
      const meta=loadSyncMeta();
      meta.hasUnsyncedChanges=dirty;
      if(dirty)meta.changesSinceSave=(meta.changesSinceSave||0)+1;
      saveSyncMeta(meta);
      setHasUnsyncedChanges(dirty);
      setChangesSinceSave(meta.changesSinceSave||0);
      if(dirty&&syncOp==null)setSyncStatus(isOnline?"pending":"offline");
    },450);
    return()=>clearTimeout(t);
  },[data,loaded]);

  /* ── Save to Cloud — the ONLY place that calls KVSync.save() (aside from
     the best-effort keepalive flush below, which talks to the same worker
     endpoint directly). `reason` is just for the status message. ──────── */
  const savingRef=useRef(false);
  /* Marks a push as in-flight *before* the network call, durably, so a
     kill/background mid-upload can never look like a silent success — see
     the pendingUpload verification in the startup/activation checks. */
  const markUploadPending=payload=>{
    const meta=loadSyncMeta();
    meta.pendingUpload=true;
    meta.pendingUploadFP=fingerprint(payload);
    saveSyncMeta(meta);
  };
  const clearUploadPending=()=>{
    const meta=loadSyncMeta();
    meta.pendingUpload=false;
    meta.pendingUploadFP=null;
    saveSyncMeta(meta);
    return meta;
  };
  const commitPush=(payload,rev,now)=>{
    const fp=fingerprint(payload);
    lastCloudSnapshotRef.current=fp;
    cacheSyncedSnapshot(payload);
    const meta=clearUploadPending();
    meta.hasUnsyncedChanges=false;
    meta.lastCloudSnapshot=fp;
    meta.lastCloudSavedAt=now.toISOString();
    meta.lastCloudUploadAt=meta.lastCloudSavedAt;
    meta.changesSinceSave=0;
    meta.localRev=rev;
    saveSyncMeta(meta);
    setLastCloudSavedAt(now);
    setHasUnsyncedChanges(false);
    setChangesSinceSave(0);
    setLocalRev(rev);
    setCloudRev(rev);
  };
  const saveToCloud=async(reason="manual")=>{
    if(!kvReady){setSyncMsg("Cloudflare sync isn't configured");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(!cloudConfirmedRef.current){setSyncMsg("Still connecting to the cloud — try again in a moment");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(!isOnline){setSyncStatus("offline");setSyncMsg("Offline — will sync when back online");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(savingRef.current)return;
    savingRef.current=true;
    setSyncOp("push");
    setSyncStatus("saving");
    try{
      const payload=dataRef.current;
      markUploadPending(payload);
      let result=await KVSync.save(payload,localRevRef.current);
      if(result&&result.conflict){
        // Server handed back its current data+rev inline — no second
        // round trip needed to see what changed.
        const remoteRaw=result.data;
        if(remoteRaw&&Array.isArray(remoteRaw.plans)){
          const remoteMigrated=migrate(remoteRaw);
          const merged=tryAutoMergeAll(payload,remoteMigrated);
          const retry=merged?await KVSync.save(merged,result.rev):null;
          if(merged&&retry&&!retry.conflict&&retry.ok!==false){
            skipSave.current=true;
            setData(merged);
            try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
            const now=new Date();
            commitPush(merged,retry.rev,now);
            setSyncStatus("synced");
            setLastSyncError(null);
            setSyncMsg("Merged with cloud changes and saved ✓");
          }else{
            clearUploadPending();
            setHasUnsyncedChanges(true);
            setSyncStatus("stale");
            setSyncMsg("⚠️ Cloud changed — review before saving");
            setConflict({local:payload,remote:remoteMigrated,remoteSavedAt:result.savedAt,remoteRev:result.rev});
          }
        }else{
          clearUploadPending();
          setHasUnsyncedChanges(true);
          setSyncStatus("failed");
          setLastSyncError("Conflict response missing data");
        }
      }else if(!result||result.ok===false){
        clearUploadPending();
        setSyncStatus("failed");
        setLastSyncError(result&&result.reason?result.reason:"unknown error");
        setSyncMsg("Cloud save failed — data is safe on this device");
      }else{
        const now=new Date();
        commitPush(payload,result.rev,now);
        setSyncStatus("synced");
        setLastSyncError(null);
        setSyncMsg(reason==="gesture"?"Cloud saved and synced ✓":reason==="auto"?"Auto-synced ✓":"Cloud saved ✓");
      }
    }catch(e){
      clearUploadPending();
      setSyncStatus(isOnline?"failed":"offline");
      setLastSyncError(String((e&&e.message)||e));
      setSyncMsg("Cloud save failed — data is safe on this device");
    }
    setSyncOp(null);
    savingRef.current=false;
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const saveToCloudRef=useRef(saveToCloud);
  useEffect(()=>{saveToCloudRef.current=saveToCloud;});

  /* ── Autosave to cloud — idle-debounced with a hard ceiling ──────────────
     Fires 8s after the last edit, but never waits more than 45s from the
     *first* pending edit in a burst — so a steady stream of edits still
     syncs periodically instead of postponing forever. This keeps writes far
     under Cloudflare KV's free-tier 1,000/day cap: a normal day of entering
     transactions lands around a few dozen writes, not one per keystroke. */
  /* ── Immediate push for completed actions ────────────────────────────────
     The idle autosave above is for typing (debounced 8–45s so a burst of
     keystrokes doesn't spam the cloud). Discrete completed actions —
     add/edit/delete a transaction, a goal contribution, a bank balance
     commit, a trade, a salary update, any modal's Save button — shouldn't
     wait on that: call pushImportant() right after the setData that
     performs the action. The short delay (not 0) exists only to let the
     state update actually land in dataRef.current before saveToCloud reads
     it; it is not a "wait for more edits" debounce like the idle autosave. */
  const pushImportantTimerRef=useRef(null);
  const pushImportant=()=>{
    if(!loaded||!kvReady)return;
    if(pushImportantTimerRef.current)clearTimeout(pushImportantTimerRef.current);
    pushImportantTimerRef.current=setTimeout(()=>{
      pushImportantTimerRef.current=null;
      // supersede the idle-autosave timer so this doesn't double-fire
      if(autosaveTimerRef.current){clearTimeout(autosaveTimerRef.current);autosaveTimerRef.current=null;}
      autosaveFirstPendingRef.current=null;
      if(hasUnsyncedRef.current&&!savingRef.current)saveToCloudRef.current("auto");
    },300);
  };
  const pushImportantRef=useRef(pushImportant);
  useEffect(()=>{pushImportantRef.current=pushImportant;});

  const AUTOSAVE_IDLE_MS=8000,AUTOSAVE_MAX_WAIT_MS=45000;
  const autosaveTimerRef=useRef(null);
  const autosaveFirstPendingRef=useRef(null);
  useEffect(()=>{
    if(!loaded||!kvReady)return;
    if(!hasUnsyncedChanges){
      autosaveFirstPendingRef.current=null;
      if(autosaveTimerRef.current){clearTimeout(autosaveTimerRef.current);autosaveTimerRef.current=null;}
      return;
    }
    if(!autosaveFirstPendingRef.current)autosaveFirstPendingRef.current=Date.now();
    const elapsed=Date.now()-autosaveFirstPendingRef.current;
    const delay=Math.min(AUTOSAVE_IDLE_MS,Math.max(0,AUTOSAVE_MAX_WAIT_MS-elapsed));
    if(autosaveTimerRef.current)clearTimeout(autosaveTimerRef.current);
    autosaveTimerRef.current=setTimeout(()=>{
      autosaveFirstPendingRef.current=null;
      if(hasUnsyncedRef.current&&!savingRef.current)saveToCloudRef.current("auto");
    },delay);
    return()=>{if(autosaveTimerRef.current)clearTimeout(autosaveTimerRef.current);};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[changesSinceSave,hasUnsyncedChanges,loaded,kvReady]);

  /* ── Flush on background/close ────────────────────────────────────────
     Two different signals, two different levels of safety:
     • visibilitychange→hidden fires when the app is backgrounded (home
       button, app switcher, tab switch) but the page process usually
       keeps running for at least a moment afterward — enough time for the
       normal saveToCloud() path, which checks for conflicts and merges
       before overwriting the cloud (same protection the manual Save
       button has).
     • pagehide fires when the page is actually being torn down (closed,
       navigated away, or the OS reclaiming it) — there may be near-zero
       execution time left, so this uses a raw best-effort
       fetch(...,{keepalive:true}) instead. keepalive is designed to
       survive teardown, unlike a plain fetch or a React state update;
       custom headers (needed for the sync token) rule out
       navigator.sendBeacon, which only supports simple bodies.
     The pagehide beacon does NOT check for conflicts — there's no time to
     round-trip a check-then-merge-then-retry — so it's sent with the
     device's current baseline `rev`; the server now rejects it outright
     (no write at all) rather than overwriting if that rev is stale, which
     is strictly safer than the old always-accepts behavior. Because the
     response can't be awaited during teardown, this deliberately does NOT
     mark the change as synced — that was a false-synced-state bug (the
     beacon could silently fail or be rejected and the UI would still claim
     "saved"). It only sets pendingUpload durably; hasUnsyncedChanges is
     left exactly as it already was, so the next launch/resume verifies
     against the cloud for real instead of taking teardown's word for it.
     Browsers also cap keepalive body size (historically ~64KB), a second
     reason this is a safety net on top of — not a replacement for — the
     idle autosave above and the automatic-refresh-on-resume below. */
  const flushToCloudBeacon=()=>{
    if(!kvReady||!cloudConfirmedRef.current||!hasUnsyncedRef.current)return;
    try{
      const payload=dataRef.current;
      const body=JSON.stringify({data:payload,savedAt:new Date().toISOString(),rev:localRevRef.current||0});
      fetch(`${PROXY_URL}/sync`,{method:"POST",headers:KVSync._headers(),body,keepalive:true}).catch(()=>{});
      // Durable "in flight" marker only — never optimistically claim
      // synced here (see comment above). The next launch/resume's cloud
      // check reconciles the real outcome either way.
      const fp=fingerprint(payload);
      const meta=loadSyncMeta();
      meta.pendingUpload=true;meta.pendingUploadFP=fp;
      saveSyncMeta(meta);
    }catch(e){}
  };
  useEffect(()=>{
    if(!loaded)return;
    const onVisibility=()=>{
      if(document.visibilityState==="hidden"){
        if(hasUnsyncedRef.current&&!savingRef.current)saveToCloudRef.current("auto");
      }else if(document.visibilityState==="visible"){
        checkCloudOnActivateRef.current();
        refreshMarketDataRef.current();
      }
    };
    const onFocus=()=>{checkCloudOnActivateRef.current();refreshMarketDataRef.current();};
    window.addEventListener("visibilitychange",onVisibility);
    window.addEventListener("focus",onFocus);
    window.addEventListener("pagehide",flushToCloudBeacon);
    return()=>{
      window.removeEventListener("visibilitychange",onVisibility);
      window.removeEventListener("focus",onFocus);
      window.removeEventListener("pagehide",flushToCloudBeacon);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[loaded]);

  /* ── Ctrl+S / Cmd+S — save & sync to cloud without reaching for the mouse ── */
  useEffect(()=>{
    const onKeyDown=e=>{
      if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==="s"||e.key==="S")){
        e.preventDefault();
        saveToCloudRef.current();
      }
    };
    window.addEventListener("keydown",onKeyDown);
    return()=>window.removeEventListener("keydown",onKeyDown);
  },[]);

  /* ── manual Pull from Cloud — GET only, never POSTs ──────────────────── */
  const pullFromCloud=async()=>{
    if(!kvReady){setSyncMsg("Add Worker URL + sync token first");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(!isOnline){setSyncStatus("offline");setSyncMsg("Offline — can't pull right now");setTimeout(()=>setSyncMsg(""),3000);return;}
    setSyncOp("pull");setSyncMsg("Pulling…");
    try{
      const remoteEnvelope=await KVSync.load();
      const remoteRaw=remoteEnvelope&&remoteEnvelope.data;
      if(remoteRaw&&Array.isArray(remoteRaw.plans)){
        const remoteMigrated=migrate(remoteRaw);
        const remoteRev=Number.isFinite(remoteEnvelope.rev)?remoteEnvelope.rev:localRevRef.current;
        const localFP=fingerprint(dataRef.current);
        const remoteFP=fingerprint(remoteMigrated);
        if(localFP===remoteFP){
          lastCloudSnapshotRef.current=remoteFP;
          cacheSyncedSnapshot(remoteMigrated);
          const now=new Date();
          const meta=loadSyncMeta();meta.hasUnsyncedChanges=false;meta.lastCloudSnapshot=remoteFP;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.localRev=remoteRev;saveSyncMeta(meta);
          setHasUnsyncedChanges(false);
          setLastCloudPulledAt(now);
          setLocalRev(remoteRev);
          setCloudRev(remoteRev);
          setSyncStatus("synced");
          setSyncMsg("Already up to date ✓");
        }else{
          const merged=tryAutoMergeAll(dataRef.current,remoteMigrated);
          if(merged){
            const mergedFP=fingerprint(merged);
            const stillDirty=mergedFP!==remoteFP;
            stashPreCloudBackup(dataRef.current);
            skipSave.current=true;
            setData(merged);
            try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
            lastCloudSnapshotRef.current=remoteFP;
            cacheSyncedSnapshot(remoteMigrated);
            const now=new Date();
            const meta=loadSyncMeta();meta.hasUnsyncedChanges=stillDirty;meta.lastCloudSnapshot=remoteFP;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.localRev=remoteRev;saveSyncMeta(meta);
            setHasUnsyncedChanges(stillDirty);setLastCloudPulledAt(now);setLocalRev(remoteRev);setCloudRev(remoteRev);
            setSyncStatus(stillDirty?"pending":"synced");
            setSyncMsg(stillDirty?"Merged with cloud changes — syncing…":"Cloud data loaded ✓");
            // Close the loop: a merge means both devices had edits, so push
            // the merged result straight back rather than leaving it
            // sitting here as "pending" until the person happens to notice
            // and hits Save — that's exactly the manual step this feature
            // is meant to remove. Short delay lets the state above land in
            // dataRef.current first (pushImportant already does the same).
            if(stillDirty)setTimeout(()=>{if(!savingRef.current)saveToCloudRef.current("auto");},350);
          }else{
            setSyncMsg("");
            setSyncStatus("stale");
            setConflict({local:dataRef.current,remote:remoteMigrated,remoteSavedAt:remoteEnvelope.savedAt,remoteRev});
          }
        }
      }else{
        setSyncMsg("Nothing saved yet — will sync on next Save to Cloud");
      }
    }catch(e){
      setSyncStatus(isOnline?"failed":"offline");
      setLastSyncError(String((e&&e.message)||e));
      setSyncMsg("Pull failed — using local data");
    }
    setSyncOp(null);
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const pullFromCloudRef=useRef(pullFromCloud);
  useEffect(()=>{pullFromCloudRef.current=pullFromCloud;});

  /* ── Automatic cloud refresh on activate ─────────────────────────────────
     This is the actual fix for "edited on iPhone, iPad still shows old
     data": every place the app can become active again (tab/app
     foregrounded, window focus, reconnecting after offline) now fires a
     *cheap* GET /sync/meta — just {savedAt, rev}, no dataset transfer — and
     only escalates to a real pull when the returned rev is actually ahead
     of what this device last reconciled. That escalation reuses
     pullFromCloud() itself (not a second copy of the merge logic): clean
     match → adopt; both sides changed → auto-merge; genuinely unmergeable
     → the same conflict modal manual pull already uses. So the person
     never has to remember to hit Sync when switching devices — the check
     just happens whenever the app comes back to the foreground. Throttled
     so rapid focus/visibility events (both can fire together) don't double
     up, and skipped outright while a push/pull is already in flight. */
  const syncOpRef=useRef(null);
  useEffect(()=>{syncOpRef.current=syncOp;},[syncOp]);
  const ACTIVATE_CHECK_MIN_INTERVAL_MS=4000;
  const lastActivateCheckRef=useRef(0);
  const checkCloudOnActivate=async()=>{
    if(!kvReady||!cloudConfirmedRef.current)return;
    if(!(typeof navigator==="undefined"?true:navigator.onLine))return;
    if(syncOpRef.current||savingRef.current)return;
    const now=Date.now();
    if(now-lastActivateCheckRef.current<ACTIVATE_CHECK_MIN_INTERVAL_MS)return;
    lastActivateCheckRef.current=now;
    try{
      const meta=await KVSync.checkMeta();
      if(!meta)return; // network hiccup on a background check — not worth surfacing an error
      const remoteRev=Number.isFinite(meta.rev)?meta.rev:0;
      setCloudRev(remoteRev);
      if(remoteRev===localRevRef.current)return; // already fully caught up
      setSyncStatus("stale");
      await pullFromCloudRef.current();
    }catch(e){/* silent — this is a passive background check, not a user action */}
  };
  const checkCloudOnActivateRef=useRef(checkCloudOnActivate);
  useEffect(()=>{checkCloudOnActivateRef.current=checkCloudOnActivate;});

  /* ── network status ──────────────────────────────────────────────────────
     navigator.onLine mirror, so "Offline" shows immediately rather than
     waiting for a fetch to time out — and reconnecting fires the same
     activation check, so data catches up the moment connectivity returns. */
  useEffect(()=>{
    const onOnline=()=>{setIsOnline(true);checkCloudOnActivateRef.current();refreshMarketDataRef.current();};
    const onOffline=()=>{setIsOnline(false);setSyncStatus("offline");};
    window.addEventListener("online",onOnline);
    window.addEventListener("offline",onOffline);
    return()=>{window.removeEventListener("online",onOnline);window.removeEventListener("offline",onOffline);};
  },[]);

  /* ── conflict resolution actions ─────────────────────────────────────── */
  const resolveKeepLocal=()=>{
    // Keeping the local copy still leaves it built on a stale baseline —
    // immediately push so the next save doesn't just conflict again.
    // localRevRef is set synchronously (not just via setLocalRev) so the
    // push below — which reads the ref, not React state — sees it in time.
    if(conflict&&Number.isFinite(conflict.remoteRev)){
      localRevRef.current=conflict.remoteRev;
      setLocalRev(conflict.remoteRev);
      setCloudRev(conflict.remoteRev);
    }
    setConflict(null);
    setTimeout(()=>saveToCloudRef.current("auto"),0);
  };
  const resolveUseCloud=()=>{
    if(!conflict)return;
    stashPreCloudBackup(dataRef.current);
    const remoteMigrated=conflict.remote;
    skipSave.current=true;
    setData(remoteMigrated);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(remoteMigrated));}catch(e){}
    const fp=fingerprint(remoteMigrated);
    lastCloudSnapshotRef.current=fp;
    cacheSyncedSnapshot(remoteMigrated);
    const now=new Date();
    const rev=Number.isFinite(conflict.remoteRev)?conflict.remoteRev:localRevRef.current;
    const meta=loadSyncMeta();meta.hasUnsyncedChanges=false;meta.lastCloudSnapshot=fp;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.changesSinceSave=0;meta.localRev=rev;saveSyncMeta(meta);
    setHasUnsyncedChanges(false);
    setChangesSinceSave(0);
    setLastCloudPulledAt(now);
    setLocalRev(rev);
    setCloudRev(rev);
    setSyncStatus("synced");
    setConflict(null);
    setSyncMsg("Cloud data loaded ✓");
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const resolveSaveLocalToCloud=async()=>{
    // "Keep local, push it" — same baseline bump as resolveKeepLocal, but
    // explicit and awaited so the caller (button) can show a spinner.
    if(conflict&&Number.isFinite(conflict.remoteRev)){
      localRevRef.current=conflict.remoteRev;
      setLocalRev(conflict.remoteRev);
      setCloudRev(conflict.remoteRev);
    }
    setConflict(null);
    await saveToCloud();
  };

  /* ── pull-to-refresh ──────────────────────────────────────────────────────
     Standard mobile pattern: dragging down from the very top of the page
     triggers a sync pull. pullDist drives the visible indicator; the touch
     math lives in refs so the listeners don't need to be re-attached on
     every move (only pullDist is state, purely for rendering). ─────────── */
  const PULL_THRESHOLD=68,PULL_MAX=110;
  const[pullDist,setPullDist]=useState(0);
  const pullStartY=useRef(null);
  const pullArmed=useRef(false);
  const pullDistRef=useRef(0);
  /* Phase shown by the pull-to-sync indicator AFTER the existing cloud
     save/pull step (syncOp) resolves: null while idle, then
     "rates"→"quotes" while refreshMarketDataIfStale({force:true}) runs its
     two sub-phases, then "done"/"error"/"offline" briefly before fading.
     Kept as its own tiny piece of state rather than folding into syncOp so
     syncOp's existing push/pull meaning (read elsewhere) is untouched. */
  const[pullPhase,setPullPhase]=useState(null);
  useEffect(()=>{
    const atTop=()=>(window.scrollY||document.documentElement.scrollTop||0)<=0;
    const onStart=e=>{
      if(!atTop()){pullArmed.current=false;return;}
      pullStartY.current=e.touches[0].clientY;
      pullArmed.current=true;
    };
    const onMove=e=>{
      if(!pullArmed.current||pullStartY.current==null)return;
      if(!atTop()){pullArmed.current=false;pullDistRef.current=0;setPullDist(0);return;}
      const dy=e.touches[0].clientY-pullStartY.current;
      if(dy<=0){pullDistRef.current=0;setPullDist(0);return;}
      e.preventDefault();
      const val=Math.min(PULL_MAX,dy*0.45);
      pullDistRef.current=val;
      setPullDist(val);
    };
    const onEnd=()=>{
      if(pullArmed.current&&pullDistRef.current>=PULL_THRESHOLD){
        // context-aware: pending local changes save first; otherwise this
        // is a plain safe pull. Read handlers via refs so this listener
        // (attached once, on mount) always calls the latest version.
        if(!isOnlineRef.current){
          // no network attempts at all when offline — just say so.
          setPullPhase("offline");
          setTimeout(()=>setPullPhase(null),1600);
        }else{
          const cloudStep=hasUnsyncedRef.current?saveToCloudRef.current("gesture"):pullFromCloudRef.current();
          Promise.resolve(cloudStep)
            .then(()=>refreshMarketDataRef.current({force:true,onPhase:setPullPhase}))
            .then(({failed})=>{
              setPullPhase(failed?"error":"done");
              setTimeout(()=>setPullPhase(null),1600);
            })
            .catch(()=>{setPullPhase("error");setTimeout(()=>setPullPhase(null),1600);});
        }
      }
      pullArmed.current=false;
      pullStartY.current=null;
      pullDistRef.current=0;
      setPullDist(0);
    };
    window.addEventListener("touchstart",onStart,{passive:true});
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onEnd,{passive:true});
    window.addEventListener("touchcancel",onEnd,{passive:true});
    return()=>{
      window.removeEventListener("touchstart",onStart);
      window.removeEventListener("touchmove",onMove);
      window.removeEventListener("touchend",onEnd);
      window.removeEventListener("touchcancel",onEnd);
    };
  },[]);

  /* which owner is active in Budget/Expenses tabs — budgetOwner/setBudgetOwner
     declared near the top of App() alongside the device-remembered default. */

  /* Currency converter selections — lifted here so they persist across tab switches */
  const[fxAmount,setFxAmount]=useState(100);
  const[fxFrom,setFxFrom]=useState("USD");
  const[fxTo,setFxTo]=useState("SAR");

  /* active plan for each owner */
  const plans=(data.plans||[]).filter(p=>!p.deletedAt);
  const activePlanId=data.activePlanId||{me:plans[0]?.id,wife:null};
  const plan=plans.find(p=>p.id===activePlanId[budgetOwner])||
             plans.find(p=>p.owner===budgetOwner)||
             plans[0];
  const cur=data.currency;

  /* plan mutators — always operate on current budgetOwner's plan */
  const patchPlan=patch=>setData(d=>({...d,plans:d.plans.map(p=>p.id===plan.id?{...p,...patch,updatedAt:new Date().toISOString()}:p)}));
  const setCats=cats=>patchPlan({categories:cats});
  const setGrps=gs=>patchPlan({groups:gs});
  const updateCat=(id,patch)=>setCats(plan.categories.map(c=>c.id===id?{...c,...patch}:c));
  const addCat=gid=>setCats([...plan.categories,{id:uid(),name:"New category",amount:0,groupId:gid,color:SEG[plan.categories.length%SEG.length],subs:[],trackExpenses:true}]);
  const removeCat=id=>setCats(plan.categories.filter(c=>c.id!==id));
  const addSub=catId=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:[...(c.subs||[]),{id:uid(),name:"New item",amount:0}]}:c));
  const updateSub=(catId,subId,patch)=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:(c.subs||[]).map(s=>s.id===subId?{...s,...patch}:s)}:c));
  const removeSub=(catId,subId)=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:(c.subs||[]).filter(s=>s.id!==subId)}:c));
  const addGroup=()=>setGrps([...plan.groups,{id:uid(),name:"New group"}]);
  const renameGroup=(id,name)=>setGrps(plan.groups.map(g=>g.id===id?{...g,name}:g));
  const removeGroup=id=>{setCats(plan.categories.filter(c=>c.groupId!==id));setGrps(plan.groups.filter(g=>g.id!==id));};

  /* add a new plan for the current owner */
  const addPlan=()=>{
    const id=uid();
    setData(d=>({...d,
      activePlanId:{...activePlanId,[budgetOwner]:id},
      plans:[...d.plans,{id,owner:budgetOwner,name:"New plan",month:monthLabel(),
        income:0,groups:[{id:uid(),name:"General"}],categories:[],updatedAt:new Date().toISOString()}]
    }));
    setPlanMenu(false);
  };
  const removePlan=id=>setData(d=>{
    const ownerPlans=(d.plans||[]).filter(p=>!p.deletedAt&&p.owner===budgetOwner);
    if(ownerPlans.length<=1)return d;
    const remaining=(d.plans||[]).filter(p=>!p.deletedAt&&p.id!==id);
    const fallback=remaining.find(p=>p.owner===budgetOwner)?.id||remaining[0]?.id;
    return{...d,
      plans:d.plans.map(p=>p.id===id?{...p,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:p),
      activePlanId:{...activePlanId,[budgetOwner]:fallback}};
  });
  const renamePlan=(id,name)=>setData(d=>({...d,plans:d.plans.map(p=>p.id===id?{...p,name,updatedAt:new Date().toISOString()}:p)}));
  const switchPlan=id=>setData(d=>({...d,activePlanId:{...activePlanId,[budgetOwner]:id}}));

  /* ── generic plan-by-id mutators (used by month-aware Budget tab) ──
     These let the Budget tab edit whichever plan maps to the viewed month,
     rather than only the active plan. */
  const patchPlanById=(pid,patch)=>setData(d=>({...d,plans:d.plans.map(p=>p.id===pid?{...p,...patch,updatedAt:new Date().toISOString()}:p)}));
  const setCatsFor=(pid,updater)=>setData(d=>({...d,plans:d.plans.map(p=>p.id===pid?{...p,categories:typeof updater==="function"?updater(p.categories||[]):updater,updatedAt:new Date().toISOString()}:p)}));
  const setGrpsFor=(pid,updater)=>setData(d=>({...d,plans:d.plans.map(p=>p.id===pid?{...p,groups:typeof updater==="function"?updater(p.groups||[]):updater,updatedAt:new Date().toISOString()}:p)}));

  /* ── monthly budget plans ──
     monthlyPlans: [{ month:"2026-06", planId:"p1" }]
     Maps each calendar month to a specific budget plan.
     Falls back to activePlanId when no mapping exists. An unassignment is
     itself an upsert (planId:null, deletedAt set) rather than a hard removal,
     so it merges like any other edit instead of a stale copy on the other
     device silently reinstating the old mapping. */
  const monthlyPlans=(data.monthlyPlans||[]).filter(m=>!m.deletedAt&&m.planId);

  /* owner-aware: find the plan for a given month + owner */
  const planForMonth=(mo,owner=budgetOwner)=>{
    const mapping=monthlyPlans.find(m=>m.month===mo&&m.owner===owner);
    const pid=mapping?mapping.planId:activePlanId[owner];
    return plans.find(p=>p.id===pid)||plans.find(p=>p.owner===owner)||plans[0];
  };

  const assignPlanToMonth=(mo,planId,owner=budgetOwner)=>setData(d=>({
    ...d,
    monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId,updatedAt:new Date().toISOString()}]
  }));

  const clonePlanForMonth=(mo,sourcePlanId,owner=budgetOwner,label)=>{
    const source=plans.find(p=>p.id===sourcePlanId)||plans[0];
    const newId=uid();
    // `label` lets the caller supply a bucket-aware display name (calendar
    // month OR pay-period range); falls back to the old calendar-month-only
    // parsing if no label is given, for any caller that hasn't been updated.
    const derivedLabel=label||(()=>{
      const parts=mo.split("-");
      return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
    })();
    const cloned={
      ...source,
      id:newId,
      name:derivedLabel,
      month:derivedLabel,
      // deep-clone groups and categories so edits don't affect source
      groups:source.groups.map(g=>({...g,id:uid()})),
      categories:source.categories.map((c,i)=>{
        const newGid=source.groups[source.groups.findIndex(g=>g.id===c.groupId)];
        return{...c,id:uid(),subs:(c.subs||[]).map(s=>({...s,id:uid()}))};
      }),
    };
    // fix groupIds to point to new group ids
    const groupIdMap={};
    source.groups.forEach((g,i)=>{groupIdMap[g.id]=cloned.groups[i].id;});
    cloned.categories=cloned.categories.map(c=>({...c,groupId:groupIdMap[c.groupId]||c.groupId}));

    cloned.owner=owner;
    cloned.updatedAt=new Date().toISOString();
    setData(d=>({
      ...d,
      plans:[...d.plans,cloned],
      monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId:newId,updatedAt:new Date().toISOString()}]
    }));
    return newId;
  };

  const removePlanForMonth=(mo,owner=budgetOwner)=>setData(d=>({
    ...d,monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId:null,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]
  }));

  /* goals */
  const goals=(data.goals||[]).filter(g=>!g.deletedAt);
  const addGoal=owner=>{setData(d=>({...d,goals:[...d.goals,{id:uid(),owner,name:"New goal",type:"savings",target:10000,contributions:[],monthly:500,color:SEG[d.goals.length%SEG.length],updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  const updateGoal=(id,patch)=>setData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,...patch,updatedAt:new Date().toISOString()}:g)}));
  const removeGoal=id=>{
    const g=(data.goals||[]).find(x=>x.id===id);
    setData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:g)}));
    if(g)triggerUndo(`Deleted goal "${g.name||"Goal"}"`,{collection:"goals",id});
    pushImportantRef.current();
  };
  const addContribution=(goalId,amount,note="")=>{
    const contrib={id:uid(),date:new Date().toISOString().slice(0,10),amount:Number(amount),note};
    setData(d=>({...d,goals:d.goals.map(g=>g.id===goalId?{...g,contributions:[...(g.contributions||[]),contrib],updatedAt:new Date().toISOString()}:g)}));
    pushImportantRef.current();
  };
  const removeContribution=(goalId,cid)=>{
    setData(d=>({...d,goals:d.goals.map(g=>g.id===goalId?{...g,contributions:(g.contributions||[]).map(c=>c.id===cid?{...c,deletedAt:new Date().toISOString()}:c),updatedAt:new Date().toISOString()}:g)}));
    triggerUndo("Deleted contribution",{collection:"goals",id:goalId,childKey:"contributions",childId:cid});
    pushImportantRef.current();
  };

  /* investments */
  const invs=(data.investments||[]).filter(x=>!x.deletedAt);
  /* Phase 2: addInv(type) — each Investment Account type starts with only
     the fields it actually uses, rather than one shape crammed with every
     field from every type. */
  const NEW_INV_BY_TYPE={
    stocks:()=>({ticker:"",name:"",broker:"",trades:[]}),
    mp2:()=>({name:"",nickname:"",currency:"PHP",startDate:new Date().toISOString().slice(0,10),maturityDate:"",payoutMode:"compounded",projectionRate:6,contributions:[],paidDividends:[],rateOverrides:{},notes:""}),
    td:()=>({name:"",currency:"PHP",principal:0,rate:0,startDate:new Date().toISOString().slice(0,10),maturityDate:"",compounding:"maturity",taxRate:0,institution:"",status:"active",notes:""}),
    gold:()=>({name:"",currency:"USD",weight:0,weightUnit:"g",purityType:"24k",karat:24,purchaseDate:new Date().toISOString().slice(0,10),purchaseCost:0,notes:""}),
  };
  const addInv=(type="stocks",owner="me")=>setData(d=>({...d,investments:[...(d.investments||[]),{id:uid(),owner,type,...(NEW_INV_BY_TYPE[type]||NEW_INV_BY_TYPE.stocks)(),updatedAt:new Date().toISOString()}]}));
  const updateInv=(id,patch)=>setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===id?{...x,...patch,updatedAt:new Date().toISOString()}:x)}));
  const removeInv=id=>{
    const inv=(data.investments||[]).find(x=>x.id===id);
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===id?{...x,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:x)}));
    if(inv)triggerUndo(`Deleted "${inv.ticker||inv.name||"investment"}"`,{collection:"investments",id});
    pushImportantRef.current();
  };
  const addTrade=(invId,trade)=>{setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,trades:[...(x.trades||[]),{id:uid(),...trade}],updatedAt:new Date().toISOString()}:x)}));pushImportantRef.current();};
  const removeTrade=(invId,tid)=>{
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,trades:(x.trades||[]).map(t=>t.id===tid?{...t,deletedAt:new Date().toISOString()}:t),updatedAt:new Date().toISOString()}:x)}));
    triggerUndo("Deleted trade",{collection:"investments",id:invId,childKey:"trades",childId:tid});
    pushImportantRef.current();
  };

  /* MP2 contributions — same add/edit/delete-with-undo shape as goal
     contributions (App()'s addContribution/removeContribution above), just
     scoped under an investment account instead of a goal. */
  const addMp2Contribution=(invId,amount,date,note="")=>{
    const now=new Date().toISOString();
    const contrib={id:uid(),amount:Number(amount),date,note,createdAt:now,updatedAt:now};
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:[...(x.contributions||[]),contrib],updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const updateMp2Contribution=(invId,cid,patch)=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:(x.contributions||[]).map(c=>c.id===cid?{...c,...patch,amount:patch.amount!==undefined?Number(patch.amount):c.amount,updatedAt:now}:c),updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const removeMp2Contribution=(invId,cid)=>{
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,contributions:(x.contributions||[]).map(c=>c.id===cid?{...c,deletedAt:new Date().toISOString()}:c),updatedAt:new Date().toISOString()}:x)}));
    triggerUndo("Deleted contribution",{collection:"investments",id:invId,childKey:"contributions",childId:cid});
    pushImportantRef.current();
  };

  /* MP2 declared dividend rates — centrally stored (data.mp2DividendRates),
     one entry per year, shared by every MP2 account unless a specific
     account overrides it via acc.rateOverrides (see mp2Valuation). */
  const mp2Rates=(data.mp2DividendRates||[]).filter(r=>!r.deletedAt);
  const mp2RatesByYear=useMemo(()=>{
    const m={};mp2Rates.forEach(r=>{m[r.year]=Number(r.rate);});return m;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[data.mp2DividendRates]);
  const addMp2Rate=(year,rate)=>{setData(d=>({...d,mp2DividendRates:[...(d.mp2DividendRates||[]),{id:uid(),year:Number(year),rate:Number(rate),updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  const updateMp2Rate=(id,patch)=>{setData(d=>({...d,mp2DividendRates:(d.mp2DividendRates||[]).map(r=>r.id===id?{...r,...patch,updatedAt:new Date().toISOString()}:r)}));pushImportantRef.current();};
  const removeMp2Rate=id=>{
    const r=(data.mp2DividendRates||[]).find(x=>x.id===id);
    setData(d=>({...d,mp2DividendRates:(d.mp2DividendRates||[]).map(x=>x.id===id?{...x,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:x)}));
    if(r)triggerUndo(`Deleted ${r.year} MP2 rate`,{collection:"mp2DividendRates",id});
    pushImportantRef.current();
  };

  /* "Record annual dividend payout" — MP2 annual-payout mode only. Declared
     dividends sit as a receivable inside the MP2 account (see mp2Valuation's
     `paid` subtraction) until the person confirms the bank actually received
     them; this both records the receipt on the account (so it stops being
     counted as still-inside-MP2 value) and, only if a bank is chosen,
     credits that bank's balance — never automatic, always an explicit
     confirm action per section 5 of the spec. */
  const recordMp2Payout=(invId,{year,amount,date,bankId,note=""})=>{
    const now=new Date().toISOString();
    const receipt={id:uid(),year:Number(year),amount:Number(amount),date,note,bankId:bankId||null,createdAt:now};
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,paidDividends:[...(x.paidDividends||[]),receipt],updatedAt:now}:x)}));
    if(bankId)setData(d=>({...d,banks:(d.banks||[]).map(b=>b.id===bankId?{...b,balance:(Number(b.balance)||0)+Number(amount),updatedAt:now}:b)}));
    pushImportantRef.current();
  };

  /* Time Deposit maturity confirmation — user-entered actual credited
     interest/final amount become the new source of truth (no more estimate
     once the bank has actually confirmed it), status flips to "matured".
     Transferring to a bank is optional and, once done, flips status to
     "closed" so the TD's own value drops to 0 in totals (the money now
     lives in that bank balance instead — see investmentValueSar) rather
     than being counted in both places. */
  const confirmTdMaturity=(invId,{confirmedInterest,confirmedFinalAmount,transferBankId})=>{
    const now=new Date().toISOString();
    setData(d=>({...d,investments:(d.investments||[]).map(x=>x.id===invId?{...x,status:"matured",confirmedInterest:Number(confirmedInterest),confirmedFinalAmount:Number(confirmedFinalAmount),maturedAt:now,updatedAt:now}:x)}));
    pushImportantRef.current();
  };
  const transferTdProceeds=(invId,bankId)=>{
    const inv=(data.investments||[]).find(x=>x.id===invId);
    if(!inv||inv.confirmedFinalAmount==null)return;
    const now=new Date().toISOString();
    setData(d=>({
      ...d,
      investments:(d.investments||[]).map(x=>x.id===invId?{...x,status:"closed",transferBankId:bankId,transferredAt:now,updatedAt:now}:x),
      banks:(d.banks||[]).map(b=>b.id===bankId?{...b,balance:(Number(b.balance)||0)+Number(inv.confirmedFinalAmount),updatedAt:now}:b),
    }));
    pushImportantRef.current();
  };
  const setProjection=patch=>setData(d=>({...d,projection:{...(d.projection||{monthly:1500,years:20,rate:8}),...patch}}));

  /* runway/capital targets — trend-based forecasting toward a custom goal.
     Distinct from `goals` (manual-contribution pots): a target's progress is
     derived live from (a) the budget categories you tag as counting toward it
     and (b) your current invested/cash balances, projected forward at two
     separately-editable conservative rates. */
  const targets=(data.targets||[]).filter(t=>!t.deletedAt);
  const addTarget=()=>setData(d=>({...d,targets:[...(d.targets||[]),{
    id:uid(),name:"New target",targetAmount:100000,targetDate:"",
    categoryAlloc:{},investRate:4,cashRate:1,currency:"SAR",color:SEG[(d.targets||[]).length%SEG.length],
    updatedAt:new Date().toISOString(),
  }]}));
  const updateTarget=(id,patch)=>setData(d=>({...d,targets:(d.targets||[]).map(t=>t.id===id?{...t,...patch,updatedAt:new Date().toISOString()}:t)}));
  const removeTarget=id=>{
    const t=(data.targets||[]).find(x=>x.id===id);
    setData(d=>({...d,targets:(d.targets||[]).map(t=>t.id===id?{...t,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:t)}));
    if(t)triggerUndo(`Deleted target "${t.name||"Target"}"`,{collection:"targets",id});
    pushImportantRef.current();
  };
  const livePrice=data.livePrice||{};
  const livePriceAt=data.livePriceAt||null;
  const prevClose=data.prevClose||{};
  /* quote refreshes (manual InvestmentsView button or the auto-refresh
     below) are deliberately NOT pushed via pushImportantRef — livePrice/
     livePriceAt/prevClose are excluded from fingerprint() so this only ever
     rides the slow idle-autosave path, never forces an immediate cloud write.
     fetchQuotes() now returns {ticker:{price,previousClose}} uniformly, but
     livePrice itself stays a bare {ticker:number} map — every existing
     reader (invSar calc, InvestmentsView's per-ticker lookups) expects that
     shape, so previousClose is split off into its own device-local field
     instead of changing livePrice's shape. */
  const setLivePrice=quotes=>setData(d=>{
    const prices={},prevs={};
    Object.entries(quotes||{}).forEach(([t,q])=>{
      if(q&&typeof q==="object"){prices[t]=q.price;if(q.previousClose!=null)prevs[t]=q.previousClose;}
      else prices[t]=q; // tolerate a bare-number map too (defensive)
    });
    return{...d,livePrice:{...(d.livePrice||{}),...prices},livePriceAt:Date.now(),prevClose:{...(d.prevClose||{}),...prevs}};
  });

  /* portfolio history — snapshot of total USD value taken when user refreshes prices */
  const portHistory=data.portHistory||[];
  const addPortSnap=(valueUSD)=>{
    const month=new Date().toISOString().slice(0,7);
    setData(d=>{
      const rest=(d.portHistory||[]).filter(h=>h.month!==month);
      return{...d,portHistory:[...rest,{id:uid(),month,value:Math.round(valueUSD)}].sort((a,b)=>a.month.localeCompare(b.month))};
    });
    pushImportantRef.current();
  };

  /* expense tracker — transactions per budget category.
     Schema: {id,catId,name,note,amount,date,owner,isTransfer,isExtraFunds}
     `name` is the recurring/short title (e.g. "Amazon Now"), `note` is the
     free-form detail (e.g. "bought a charger + cable"). isTransfer marks
     quick-transfer logs against untracked categories. isExtraFunds marks a
     one-off top-up to a *tracked* category's spending room for the viewed
     month only (e.g. a spouse handing over extra cash for groceries) — it
     boosts that category's effective budget in the Expenses tab without
     ever touching the category's base amount/percentage in the Budget tab. */
  const expenses=(data.expenses||[]).filter(e=>!e.deletedAt);
  const addExpenseTx=(catId,name,note,amount,date,owner=budgetOwner,isTransfer=false,isExtraFunds=false)=>{setData(d=>({...d,expenses:[...(d.expenses||[]),{id:uid(),catId,name,note:note||"",amount:Number(amount),date,owner,isTransfer:!!isTransfer,isExtraFunds:!!isExtraFunds,updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  const updateExpenseTx=(id,patch)=>{setData(d=>({...d,expenses:(d.expenses||[]).map(e=>e.id===id?{...e,...patch,amount:patch.amount!==undefined?Number(patch.amount):e.amount,updatedAt:new Date().toISOString()}:e)}));pushImportantRef.current();};
  const removeExpenseTx=id=>{
    const e=(data.expenses||[]).find(x=>x.id===id);
    setData(d=>({...d,expenses:(d.expenses||[]).map(e=>e.id===id?{...e,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:e)}));
    if(e)triggerUndo(`Deleted "${e.name||"transaction"}"`,{collection:"expenses",id});
    pushImportantRef.current();
  };

  /* quick-transfer: logs a transaction against an untracked category (e.g. Savings)
     and remembers the actual amount transferred, since it doesn't always match
     the budgeted figure exactly. Keyed by category id. */
  const quickTransferLast=data.quickTransferLast||{};
  const quickTransfer=(catId,catName,amount,date,owner=budgetOwner)=>{
    addExpenseTx(catId,catName,"Quick transfer",amount,date,owner,true);
    setData(d=>({...d,quickTransferLast:{...(d.quickTransferLast||{}),[catId]:Number(amount)}}));
  };

  /* extra funds: ad-hoc top-up to a tracked category's room for the month,
     e.g. a spouse sending extra cash earmarked for a specific category. */
  const addExtraFunds=(catId,catName,amount,date,note,owner=budgetOwner)=>{
    addExpenseTx(catId,catName,note||"Extra funds",amount,date,owner,false,true);
  };


  /* FX */
  const[rates,setRates]=useState(null);
  const[ratesAt,setRatesAt]=useState(null);
  const[ratesErr,setRatesErr]=useState(false);
  const[ratesLoading,setRatesLoading]=useState(false);
  const loadRates=async()=>{
    setRatesLoading(true);setRatesErr(false);
    let ok=true;
    try{const{rates:r,at}=await fetchRates();setRates(r);setRatesAt(at);}
    catch(e){setRatesErr(true);ok=false;}
    setRatesLoading(false);
    return ok; // used by refreshMarketDataIfStale to surface a "some data failed" flag
  };
  useEffect(()=>{loadRates();},[]);
  const convert=(amt,from,to)=>{
    if(!rates||!rates[from]||!rates[to])return null;
    return(Number(amt)||0)/rates[from]*rates[to];
  };
  const sarRate=rates&&rates.SAR?rates.SAR:null;

  /* banks */
  const banks=(data.banks||[]).filter(b=>!b.deletedAt);
  const addBank=owner=>{setData(d=>({...d,banks:[...(d.banks||[]),{id:uid(),owner,name:"New account",bank:"",country:"SA",currency:"SAR",balance:0,updatedAt:new Date().toISOString()}]}));pushImportantRef.current();};
  /* shared by every field's onChange (name/bank/country/currency/balance as
     the person types) — deliberately left on the debounced idle-autosave
     path, not pushImportant, or every keystroke would trigger a push. The
     balance field's onBlur (its "commit" moment) calls pushImportant
     separately where it's wired up in BanksView below. */
  const updateBank=(id,patch)=>setData(d=>({...d,banks:(d.banks||[]).map(b=>b.id===id?{...b,...patch,updatedAt:new Date().toISOString()}:b)}));
  const removeBank=id=>{
    const b=(data.banks||[]).find(x=>x.id===id);
    setData(d=>({...d,banks:(d.banks||[]).map(b=>b.id===id?{...b,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:b)}));
    if(b)triggerUndo(`Deleted "${b.name||"account"}"`,{collection:"banks",id});
    pushImportantRef.current();
  };

  /* assets */
  const assets=(data.assets||[]).filter(a=>!a.deletedAt);
  const addAsset=kind=>setData(d=>({...d,assets:[...(d.assets||[]),
    kind==="liability"
      ?{id:uid(),name:"New liability",kind:"liability",currency:"SAR",value:0,installment:true,monthly:0,monthsRemaining:0,asOfDate:new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString()}
      :{id:uid(),name:"New asset",kind:"asset",currency:"SAR",value:0,updatedAt:new Date().toISOString()}
  ]}));
  const updateAsset=(id,patch)=>setData(d=>({...d,assets:(d.assets||[]).map(a=>a.id===id?{...a,...patch,updatedAt:new Date().toISOString()}:a)}));
  const removeAsset=id=>{
    const a=(data.assets||[]).find(x=>x.id===id);
    setData(d=>({...d,assets:(d.assets||[]).map(a=>a.id===id?{...a,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:a)}));
    if(a)triggerUndo(`Deleted "${a.name||"item"}"`,{collection:"assets",id});
  };

  /* net worth */
  const sarOf=(amt,ccy)=>{const v=convert(amt,ccy,"SAR");return v==null?0:v;};
  const banksSar=banks.reduce((s,b)=>s+sarOf(b.balance,b.currency),0);
  /* Investment Accounts (Phase 1): one shared valuation loop, called once for
     the combined (household) total and again — filtered — per owner, so
     Home's per-profile cards (HeroCard/PortfolioCard/SavingsInvestingCard)
     never fall back to counting every investment on every profile. */
  const includeMp2Estimate=!!(data.settings&&data.settings.includeMp2EstimateInNetWorth);
  /* Per-type valuation, dispatched by hld.type — stocks price live, MP2/TD
     use their dedicated rate-driven valuation strategies (mp2Valuation/
     tdValuation) instead of a market price. Net Worth default is MP2's
     *confirmed* value and TD's *current estimated net* value (spec §11);
     the Settings toggle swaps MP2 to its estimated value everywhere this
     runs, since Portfolio/Net Worth/snapshots all share this one function.
     A "closed" TD (proceeds already transferred to a bank) values at 0 so
     the money isn't counted in both places. */
  const investmentValueSar=hld=>{
    if(hld.type==="mp2"){
      const v=mp2Valuation(hld,mp2RatesByYear);
      const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
      return convert?(convert(chosen,hld.currency||"PHP","SAR")||0):0;
    }
    if(hld.type==="td"){
      if(hld.status==="closed")return 0;
      const v=tdValuation(hld);
      const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
      return convert?(convert(val,hld.currency||"PHP","SAR")||0):0;
    }
    if(hld.type==="gold"){
      // priced off the live spot quote cached at livePrice[GOLD_TICKER] —
      // same never-clear-on-failure guarantee as stocks (see setLivePrice).
      const v=goldValuation(hld,livePrice[GOLD_TICKER]||0,convert);
      return convert?(convert(v.currentValueUsd,"USD","SAR")||0):0;
    }
    // stocks (default)
    const{shares}=holdingStats(hld.trades);
    const price=livePrice[baseKey(hld.ticker)]||0;
    return shares*price*(sarRate||0);
  };
  const investmentsSarValue=list=>list.reduce((s,hld)=>s+investmentValueSar(hld),0);
  /* Per-type SAR breakdown for one owner's investments — used by the
     snapshot capture below (Phase 3 §5) to record a per-type composition
     alongside each day's total, without a second bespoke reduce. */
  const investmentBreakdownSar=list=>{
    const out={stocks:0,mp2:0,td:0,gold:0};
    (list||[]).forEach(hld=>{
      const t=(hld.type in out)?hld.type:"stocks";
      out[t]+=investmentValueSar(hld);
    });
    return out;
  };
  const invSar=investmentsSarValue(invs);
  const invSarForOwner=useCallback(owner=>investmentsSarValue(investmentsForProfile(invs,owner)),[invs,livePrice,sarRate,convert,mp2RatesByYear,includeMp2Estimate]);
  const assetSar=assets.filter(a=>a.kind==="asset").reduce((s,a)=>s+sarOf(a.value,a.currency),0);
  const liabSar=assets.filter(a=>a.kind==="liability").reduce((s,a)=>s+sarOf(liabilityBalance(a),a.currency),0);
  const netWorth=banksSar+invSar+assetSar-liabSar;

  /* history */
  const history=data.history||[];
  const captureSnapshot=()=>{
    const month=new Date().toISOString().slice(0,7);
    setData(d=>{const rest=(d.history||[]).filter(h=>h.month!==month);
      return{...d,history:[...rest,{id:uid(),month,net:Math.round(netWorth),banks:Math.round(banksSar),investments:Math.round(invSar),assets:Math.round(assetSar),liabilities:Math.round(liabSar)}].sort((a,b)=>a.month.localeCompare(b.month))};});
  };
  const addPastSnap=(month,net)=>setData(d=>{const rest=(d.history||[]).filter(h=>h.month!==month);
    return{...d,history:[...rest,{id:uid(),month,net:Math.round(net),banks:0,investments:0,assets:0,liabilities:0}].sort((a,b)=>a.month.localeCompare(b.month))};});
  const removeSnap=id=>setData(d=>({...d,history:(d.history||[]).filter(h=>h.id!==id)}));

  /* net worth auto-pull — silently keeps this month's snapshot in sync with
     live bank/investment/asset balances, so the timeline stays accurate
     without needing a manual "Capture this month" tap every time. Only
     updates the CURRENT month's entry, debounced, and only once balances
     have settled (loaded + non-zero so we don't overwrite real history with
     a startup 0 before data finishes loading). */
  const netWorthReady=loaded&&!!rates&&(banks.length>0||invs.length>0||assets.length>0);
  useEffect(()=>{
    if(!netWorthReady)return;
    const t=setTimeout(()=>{
      const month=new Date().toISOString().slice(0,7);
      setData(d=>{
        const existing=(d.history||[]).find(h=>h.month===month);
        const rounded=Math.round(netWorth);
        if(existing&&existing.net===rounded&&existing.banks===Math.round(banksSar)&&existing.investments===Math.round(invSar)&&existing.assets===Math.round(assetSar)&&existing.liabilities===Math.round(liabSar)){
          return d; // no change, skip write to avoid loops
        }
        const rest=(d.history||[]).filter(h=>h.month!==month);
        return{...d,history:[...rest,{id:existing?.id||uid(),month,net:rounded,banks:Math.round(banksSar),investments:Math.round(invSar),assets:Math.round(assetSar),liabilities:Math.round(liabSar),auto:true}].sort((a,b)=>a.month.localeCompare(b.month))};
      });
    },1200);
    return()=>clearTimeout(t);
  },[netWorth,banksSar,invSar,assetSar,liabSar,netWorthReady]);

  /* ── Daily per-profile snapshots (Phase 3 §5) ──────────────────────────────
     Separate from the monthly `history` auto-pull above: captures Me/Wife/
     Household each as their own row, once per calendar day, with a per-type
     investment breakdown, feeding the new range-selectable charts. Same
     debounce-then-write-only-if-changed shape as the effect above, just
     looped over 3 profiles and keyed by day instead of month. */
  const ownerNetWorthSar=owner=>{
    const ownerBanksSar=banks.filter(b=>b.owner===owner).reduce((s,b)=>s+sarOf(b.balance,b.currency),0);
    return ownerBanksSar+invSarForOwner(owner)+assetSar-liabSar;
  };
  const snapshots=data.snapshots||[];
  useEffect(()=>{
    if(!netWorthReady)return;
    const t=setTimeout(()=>{
      const today=new Date().toISOString().slice(0,10);
      setData(d=>{
        let snaps=[...(d.snapshots||[])];
        let changed=false;
        ["me","wife","household"].forEach(profile=>{
          const pInvs=investmentsForProfile(invs,profile);
          const net=profile==="household"?netWorth:ownerNetWorthSar(profile);
          const investmentsVal=profile==="household"?invSar:invSarForOwner(profile);
          const profileBanksSar=profile==="household"?banksSar:banks.filter(b=>b.owner===profile).reduce((s,b)=>s+sarOf(b.balance,b.currency),0);
          const breakdown=investmentBreakdownSar(pInvs);
          const rounded={
            net:Math.round(net),
            investments:Math.round(investmentsVal),
            banks:Math.round(profileBanksSar),
            assets:Math.round(assetSar),
            liabilities:Math.round(liabSar),
            byType:{stocks:Math.round(breakdown.stocks),mp2:Math.round(breakdown.mp2),td:Math.round(breakdown.td),gold:Math.round(breakdown.gold)},
          };
          const idx=snaps.findIndex(s=>s.date===today&&s.profile===profile);
          if(idx>=0){
            const ex=snaps[idx];
            const same=ex.net===rounded.net&&ex.investments===rounded.investments&&ex.banks===rounded.banks&&ex.assets===rounded.assets&&ex.liabilities===rounded.liabilities&&JSON.stringify(ex.byType)===JSON.stringify(rounded.byType);
            if(!same){snaps[idx]={...ex,...rounded,updatedAt:new Date().toISOString()};changed=true;}
          }else{
            snaps.push({id:uid(),date:today,profile,...rounded,updatedAt:new Date().toISOString(),auto:true});
            changed=true;
          }
        });
        if(!changed)return d;
        const retention=(d.settings&&d.settings.snapshotRetention)||{dailyDays:35,weeklyDays:365};
        return{...d,snapshots:compressSnapshots(snaps,retention)};
      });
    },1500);
    return()=>clearTimeout(t);
  },[netWorth,banksSar,invSar,assetSar,liabSar,invs,netWorthReady]);

  /* ── automatic market-data refresh ────────────────────────────────────────
     Keeps stock quotes and FX rates from silently going stale for people who
     never open Investments/Currency and just live on Home. Piggybacks on the
     exact same "app became active" moments checkCloudOnActivate already
     uses (visibility/focus/online) — no new listeners. Ref-guarded (not
     state-guarded) so a second trigger while a fetch is already in flight is
     a no-op even across the stale closures those event handlers capture.
     Failures are swallowed here and never clear/zero the cached
     livePrice/rates — fetchQuotes/fetchRates already only resolve on
     success, so there's nothing to overwrite on failure. */
  const quotesRefreshingRef=useRef(false);
  const ratesRefreshingRef=useRef(false);
  const QUOTES_STALE_MS=15*60*1000,RATES_STALE_MS=6*60*60*1000;
  /* {force:true} bypasses the staleness window — used by the manual/gesture
     pull-to-refresh, where the person explicitly asked for fresh data right
     now. Passive lifecycle triggers (visibility/focus/online) call this with
     no args and keep respecting the thresholds. Either way the in-flight
     dedup refs still apply, so a forced pull and a passive stale-check firing
     at once never double-fetch. Returns {failed} — true if any attempted
     phase errored — purely for the pull-to-refresh indicator text; never
     used to clear/zero cached data. */
  const refreshMarketDataIfStale=async({force=false,onPhase}={})=>{
    let failed=false;
    if(!quotesRefreshingRef.current){
      // Gold rides the same stock-quote refresh cycle/staleness window (spec
      // §3: "reuse the existing refresh workflow") — the settings toggle only
      // gates the *automatic* passive refresh; a forced/manual refresh always
      // includes it, same as stocks have no per-ticker opt-out either.
      const goldAutoRefresh=!(data.settings&&data.settings.goldAutoRefresh===false);
      const tickers=[...new Set([
        ...invs.map(h=>(h.ticker||"").trim().toUpperCase()).filter(Boolean),
        ...((force||goldAutoRefresh)&&invs.some(h=>h.type==="gold")?[GOLD_TICKER]:[]),
      ])];
      if(tickers.length&&(force||Date.now()-(livePriceAt||0)>QUOTES_STALE_MS)){
        quotesRefreshingRef.current=true;
        if(onPhase)onPhase("quotes");
        try{const q=await fetchQuotes(tickers);setLivePrice(q);}catch(e){failed=true;/* keep last-good prices */}
        quotesRefreshingRef.current=false;
      }
    }
    if(!ratesRefreshingRef.current&&(force||Date.now()-(ratesAt||0)>RATES_STALE_MS)){
      ratesRefreshingRef.current=true;
      if(onPhase)onPhase("rates");
      const ok=await loadRates().catch(()=>false);
      if(!ok)failed=true;
      ratesRefreshingRef.current=false;
    }
    return{failed};
  };
  const refreshMarketDataRef=useRef(refreshMarketDataIfStale);
  useEffect(()=>{refreshMarketDataRef.current=refreshMarketDataIfStale;});
  useEffect(()=>{if(loaded)refreshMarketDataRef.current();},[loaded]);

  /* household */
  const hh=data.household||{splitMine:50,expenses:[]};
  const setSplit=v=>setData(d=>({...d,household:{...(d.household||{splitMine:50,expenses:[]}),splitMine:v}}));
  const addExpense=()=>setData(d=>{const h=d.household||{splitMine:50,expenses:[]};return{...d,household:{...h,expenses:[...h.expenses,{id:uid(),name:"New expense",amount:0,color:SEG[h.expenses.length%SEG.length]}]}};});
  const updateExpense=(id,patch)=>setData(d=>{const h=d.household;return{...d,household:{...h,expenses:h.expenses.map(e=>e.id===id?{...e,...patch}:e)}};});
  const removeExpense=id=>setData(d=>{const h=d.household;return{...d,household:{...h,expenses:h.expenses.filter(e=>e.id!==id)}};});

  const setOwnerName=(key,name)=>setData(d=>({...d,owners:{...d.owners,[key]:name}}));
  const setPayPeriod=(owner,patch)=>setData(d=>({...d,payPeriods:{...(d.payPeriods||{}),[owner]:{...((d.payPeriods||{})[owner]||{enabled:false,payday:1}),...patch}}}));

  /* derived */
  const allocated=useMemo(()=>plan.categories.reduce((s,c)=>s+(Number(c.amount)||0),0),[plan]);
  const remaining=(Number(plan.income)||0)-allocated;
  const fmt=n=>`${cur} ${Math.round(Number(n)||0).toLocaleString("en-US")}`;
  const fmt2=n=>`${cur} ${(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const pct=n=>plan.income>0?((Number(n)||0)/plan.income)*100:0;
  const setInvestTarget=patch=>setData(d=>({...d,investTarget:{...(d.investTarget||{}),[budgetOwner]:{...((d.investTarget||{})[budgetOwner]||{thresholdPct:20,groupNames:[]}),...patch}}}));

  const TABS=[
    ["home","Home",I.Home],
    ["budget","Budget",I.Wallet],["expenses","Expenses",I.Receipt],["household","Household",I.Users],
    ["banks","Banks",I.Bank],["investments","Investments",I.Trending],
    ["networth","Net Worth",I.Gem],["goals","Goals",I.Target],
    ["targets","Forecast",I.TrendUp],
    ["currency","Currency",I.Swap],
  ];

  return(
    <div style={{background:P.bg,color:P.ink,minHeight:"100vh"}}>
      {cloudWaiting&&(
        <div style={{position:"fixed",inset:0,zIndex:1000,background:P.bg,display:"flex",
          flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:24,textAlign:"center"}}>
          <div className="loader" style={{width:32,height:32}}/>
          <div style={{fontSize:15,fontWeight:600,color:P.ink}}>Waiting to reach the cloud…</div>
          <div style={{fontSize:13,color:P.neuSub,maxWidth:280,lineHeight:1.5}}>
            This looks like a new device — we want to load your existing data first so nothing gets overwritten.
          </div>
          <button onClick={continueOffline} className="neu-btn"
            style={{marginTop:8,padding:"10px 20px",fontSize:13,fontWeight:600,color:P.neuSub,borderRadius:12}}>
            Continue offline for now
          </button>
        </div>
      )}
      {cloudReconnecting&&!cloudWaiting&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:70,display:"flex",justifyContent:"center",
          paddingTop:"calc(env(safe-area-inset-top) + 8px)",pointerEvents:"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 14px",borderRadius:999,
            background:P.sf,border:`1px solid ${P.line}`,boxShadow:"0 4px 14px rgba(12,22,40,.14)",
            fontSize:12,color:P.neuSub}}>
            <div className="loader" style={{width:12,height:12,borderWidth:2}}/>
            Reconnecting to check for updates…
          </div>
        </div>
      )}
      {/* pull-to-sync indicator — extended with the post-sync market-data
          phases (rates/quotes) a gesture-triggered pull now also runs; see
          the pull-gesture onEnd handler above. */}
      {(()=>{
        const marketBusy=pullPhase==="rates"||pullPhase==="quotes";
        const active=pullDist>0||syncing||!!pullPhase;
        const spinning=syncing||marketBusy;
        let label;
        if(pullPhase==="offline")label="Offline · showing cached values";
        else if(pullPhase==="rates")label="Updating exchange rates…";
        else if(pullPhase==="quotes")label="Updating investments…";
        else if(pullPhase==="done")label="Home updated";
        else if(pullPhase==="error")label="Some market data could not be updated";
        else if(syncOp==="push")label="Saving to cloud…";
        else if(syncOp==="pull")label="Checking cloud…";
        else if(pullDist>=PULL_THRESHOLD)label=hasUnsyncedChanges?"Release to save & sync":"Release to pull";
        else label=hasUnsyncedChanges?"Pull to save & sync":"Pull to check cloud";
        return(
          <div style={{position:"fixed",top:0,left:0,right:0,zIndex:60,display:"flex",flexDirection:"column",
            alignItems:"center",pointerEvents:"none",
            paddingTop:`calc(env(safe-area-inset-top) + ${Math.max(8,pullDist-30)}px)`,
            opacity:active?Math.min(1,pullDist/PULL_THRESHOLD)||(syncing||pullPhase?1:0):0,
            transition:pullDist===0?"opacity .2s ease":"none"}}>
            <div style={{width:32,height:32,borderRadius:999,background:P.sf,border:`1px solid ${P.line}`,
              display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 14px rgba(12,22,40,.18)"}}>
              <I.Refresh size={15} style={{color:pullDist>=PULL_THRESHOLD||spinning?P.gr:P.faint,
                transform:spinning?"none":`rotate(${Math.min(pullDist,PULL_THRESHOLD)/PULL_THRESHOLD*360}deg)`,
                ...(spinning?{animation:"spin .8s linear infinite"}:{})}}/>
            </div>
            {active&&
              <div style={{marginTop:6,fontSize:11,color:P.sub,background:P.sf,padding:"2px 8px",borderRadius:999,border:`1px solid ${P.line}`}}>
                {label}
              </div>}
          </div>
        );
      })()}
      <div style={{maxWidth:920,margin:"0 auto",padding:"0 16px 80px"}}>

        {/* header */}
        <header style={{paddingTop:28,paddingBottom:16}}>
