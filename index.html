/* ── MP2 declared dividend rates — one shared table (data.mp2DividendRates),
   add/edit/delete + history (section 3). Editing an existing year in place
   rather than allowing duplicate years keeps "one rate per year" true
   without extra validation plumbing. */
function Mp2RatesModal({rates,addMp2Rate,updateMp2Rate,removeMp2Rate,onClose}){
  const dlgRef=useDialogA11y(onClose);
  const[year,setYear]=useState(new Date().getFullYear());
  const[rate,setRate]=useState("");
  const sorted=[...(rates||[])].sort((a,b)=>b.year-a.year);
  const existing=sorted.find(r=>r.year===Number(year));
  const submit=()=>{
    if(!(Number(rate)>0)&&Number(rate)!==0)return;
    if(existing)updateMp2Rate(existing.id,{rate:Number(rate)});
    else addMp2Rate(year,rate);
    setRate("");
  };
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>MP2 declared dividend rates</h3>
            <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
          </div>
          <div style={{fontSize:11,color:P.sub,marginBottom:12,lineHeight:1.5}}>
            One official rate per year, shared by every MP2 account unless an account overrides it. Never a projection — only enter what Pag-IBIG has actually declared.
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <NumField value={year} onCommit={setYear} live integer inputMode="numeric" placeholder="Year"
              style={{width:90,borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            <NumField value={rate} onCommit={setRate} allowEmpty live min={0} placeholder="Rate %"
              style={{flex:1,borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            <button onClick={submit} style={{borderRadius:10,padding:"8px 14px",fontSize:14,fontWeight:600,background:P.jade,color:"#fff",border:"none"}}>
              {existing?"Update":"Add"}
            </button>
          </div>
          <div style={{maxHeight:260,overflowY:"auto",borderRadius:10,background:"rgba(0,0,0,.03)"}}>
            {sorted.length===0&&<div style={{padding:12,fontSize:13,color:P.sub}}>No declared rates yet.</div>}
            {sorted.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid rgba(0,0,0,.05)"}}>
                <span className="tnum" style={{fontWeight:600,color:P.ink}}>{r.year}</span>
                <span className="tnum" style={{color:P.jade,fontWeight:600,marginLeft:8}}>{r.rate}%</span>
                <button onClick={()=>{setYear(r.year);setRate(String(r.rate));}} style={{marginLeft:"auto",background:"transparent",border:"none",color:P.sub,fontSize:12}}>Edit</button>
                <IconButton icon={I.X} label={`Delete ${r.year} rate`} onClick={()=>removeMp2Rate(r.id)} size={14} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </Portal>
  );
}

                <span style={{fontSize:11}}>Monthly payment ({a.currency})</span>
                <NumField value={a.monthly||""} onCommit={v=>updateAsset(a.id,{monthly:v})} allowEmpty min={0}

              </label>
              <label style={{color:P.neuSub,display:"flex",flexDirection:"column",gap:3}}>
                <span style={{fontSize:11}}>Months remaining (as of)</span>

                  <NumField value={a.monthsRemaining||""} onCommit={v=>updateAsset(a.id,{monthsRemaining:v})} allowEmpty integer min={0} inputMode="numeric"

                  <input type="month" value={(a.asOfDate||"").slice(0,7)} onChange={e=>updateAsset(a.id,{asOfDate:e.target.value+"-01"})}

/* ── NET WORTH VIEW — installment liabilities ── */
function NetWorthView({netWorthParts,profile,setProfile,owners,sarRate,convert,ratesErr,assets,addAsset,updateAsset,removeAsset,history,snapshots,captureSnapshot,addPastSnap,removeSnap}){
  const[pm,setPm]=useState(new Date().toISOString().slice(0,7));
  const[pv,setPv]=useState("");
  const sar=n=>formatMoney(n,{code:"SAR"});
  /* Every figure below is for the selected profile; the household case is
     just netWorthParts("household"), so the rest of this view is unchanged. */
  const isCombined=profile==="household";
  const _p=netWorthParts(profile);
  const netWorth=_p.net,banksSar=_p.banks,invSar=_p.investments,assetSar=_p.assets,liabSar=_p.liabilities;
  const usd=sarRate?Math.round(netWorth/sarRate):null;
  const php=convert?convert(netWorth,"SAR","PHP"):null;
  const parts=[{label:"Bank accounts",value:banksSar,color:SEG[0]},{label:"Investments",value:invSar,color:SEG[3]},{label:"Other assets",value:assetSar,color:SEG[5]},{label:"Liabilities",value:-liabSar,color:P.red}];
  const gross=banksSar+invSar+assetSar;
  const fmtMo=m=>{const[y,mo]=m.split("-");return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("en-US",{month:"short",year:"2-digit"});};
  const sorted=[...history].sort((a,b)=>a.month.localeCompare(b.month));
  const last=sorted[sorted.length-1];
  /* `history` is written household-only, so this delta is meaningless beside a
     per-person figure — show it only in the Combined view. */
  const delta=(isCombined&&last)?netWorth-last.net:null;
  const assetItems=assets.filter(a=>a.kind==="asset"&&ownerMatch(a,profile));
  const liabItems=assets.filter(a=>a.kind==="liability"&&ownerMatch(a,profile));

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div className="fade-up" style={{borderRadius:18,padding:20,marginBottom:16,background:P.deep,color:"#fff",
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`}}>
        <div style={{fontSize:12,fontWeight:500,color:P.deepHi,marginBottom:4}}>
          Net worth{isCombined?" · Combined":` · ${owners[profile]||""}`}
        </div>
        <span key={Math.round(netWorth)} className="serif tnum num-flash" style={{fontSize:38,fontWeight:600}}>{sar(netWorth)}</span>
        <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:6,color:P.deepHi,fontSize:14}}>
          <span>{usd!=null?`≈ $${usd.toLocaleString("en-US")}`:"USD —"}</span>
          <span>{php!=null?`≈ ₱${Math.round(php).toLocaleString("en-US")}`:"PHP —"}</span>
        </div>
        {(usd==null||php==null)&&<div style={{fontSize:11,marginTop:6,color:"#E89B8C"}}>{ratesErr?"Couldn't load live rates — tap refresh in Currency tab.":"Loading live rates…"}</div>}
        {delta!=null&&<div className="tnum" style={{fontSize:14,marginTop:6,color:delta>=0?"#6FC6DA":"#E89B8C"}}>{delta>=0?"▲":"▼"} {sar(Math.abs(delta))} since last snapshot</div>}
      </div>

      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}>
        <HomeProfileToggle profile={profile} setProfile={setProfile} owners={owners}/>
      </div>

/* ── CURRENCY VIEW ── */
function CurrencyView({rates,ratesAt,ratesErr,ratesLoading,onRefresh,convert,fxAmount,setFxAmount,fxFrom,setFxFrom,fxTo,setFxTo}){
  const amount=fxAmount,from=fxFrom,to=fxTo;
  const setAmount=setFxAmount,setFrom=setFxFrom,setTo=setFxTo;
  const result=convert(amount,from,to);
  const one=convert(1,from,to);
  const card=neu(16);
  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div className="fade-up" style={{...card,padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600,color:P.neuSub}}>Live converter</span>
          <button onClick={onRefresh} disabled={ratesLoading} className="neu-btn" style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
            <I.Refresh size={13} style={ratesLoading?{animation:"spin .9s linear infinite"}:null}/>Refresh
          </button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:8}}>
          {/* live: the conversion result below updates as you type */}
          <NumField value={amount} onCommit={setAmount} live min={0} className="tnum"
            style={{...neuInset(10),padding:"8px 10px",fontSize:18,fontWeight:600,width:130,border:"none",color:P.neuInk}}/>
          <select value={from} onChange={e=>setFrom(e.target.value)} style={{...neu(10),padding:"8px 10px",fontSize:14,border:"none",color:P.neuInk}}>
            {FX_CODES.map(c=><option key={c}>{c}</option>)}
          </select>
          <IconButton icon={I.Swap} label="Swap currencies" onClick={()=>{setFrom(to);setTo(from);}} size={16} className="neu-btn" style={{borderRadius:999,color:P.neuSub}}/>
          <select value={to} onChange={e=>setTo(e.target.value)} style={{...neu(10),padding:"8px 10px",fontSize:14,border:"none",color:P.neuInk}}>
            {FX_CODES.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div style={{marginTop:14}}>
          {result!=null
            ?<div>
              <div key={`${from}${to}${amount}`} className="serif tnum num-flash" style={{fontSize:30,fontWeight:600,color:P.neuInk}}>{result.toLocaleString("en-US",{maximumFractionDigits:2})} <span style={{fontSize:16,color:P.neuSub}}>{to}</span></div>
              <div style={{fontSize:12,color:P.neuSub}}>1 {from} = {one.toLocaleString("en-US",{maximumFractionDigits:4})} {to}</div>
            </div>
            :<div style={{fontSize:14,color:P.wine}}>{ratesErr?"Rates unavailable — tap refresh.":"Loading rates…"}</div>
          }
        </div>
      </div>
      <div className="fade-up-1" style={{...card,padding:16}}>
        <div style={{fontSize:13,fontWeight:600,color:P.neuSub,marginBottom:10}}>Quick rates</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(150px,100%),1fr))",gap:10}}>
          {[["USD","SAR"],["SAR","PHP"],["USD","PHP"],["AED","PHP"]].map(([f,t])=>{
            const v=convert(1,f,t);
            return(
              <div key={f+t} style={{...neuInset(12),padding:12}}>
                <div style={{fontSize:11,color:P.neuSub}}>1 {f} →</div>
                <div className="tnum" style={{fontSize:18,fontWeight:600,color:P.neuInk}}>
                  {v==null?"—":v.toLocaleString("en-US",{maximumFractionDigits:t==="PHP"?2:4})} <span style={{fontSize:12,color:P.neuSub}}>{t}</span>
                </div>
              </div>
            );
          })}
        </div>
        {ratesAt&&<div style={{fontSize:11,color:P.neuSub,marginTop:10}}>Updated {new Date(ratesAt).toLocaleString()}</div>}
      </div>
    </div>
  );
}


/* ── GOAL SQUARE CARD (top-level so inputs keep focus) ── */
function GoalSquare({g,fmt,today,updateGoal,removeGoal,openAdd,openDetails,openTypePicker}){
  const saved=(g.contributions||[]).filter(c=>!c.deletedAt).reduce((s,c)=>s+(Number(c.amount)||0),0);
  const pctDone=g.target>0?Math.min(100,(saved/g.target)*100):0;
  const Icon=goalIcon(g.type);
  const R=26,C=2*Math.PI*R;
  /* Null unless this goal has a deadline, so a goal without one renders
     exactly the card it always did — no empty state, nothing to dismiss. */
  const dl=goalDeadlineStatus(g,today);
  return(
    <div style={{borderRadius:16,padding:14,background:P.neuBg,boxShadow:`6px 6px 13px ${P.neuLo},-6px -6px 13px ${P.neuHi}`,display:"flex",flexDirection:"column",gap:8}}>
      {/* top row: type icon + delete */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={()=>openTypePicker(g.id)} title="Change goal type" aria-label="Change goal type"
          style={{display:"flex",alignItems:"center",justifyContent:"center",width:34,height:34,borderRadius:10,
            background:g.color+"22",color:g.color,border:"none"}}>
          <Icon size={18}/>
        </button>
        <IconButton icon={I.X} label={`Delete ${g.name||"goal"}`} onClick={()=>removeGoal(g.id)} size={15} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
      </div>

      {/* name */}
      <input value={g.name} onChange={e=>updateGoal(g.id,{name:e.target.value})} className="bare"
        style={{fontSize:14,fontWeight:600,width:"100%",minWidth:0,color:P.neuInk}}/>

      {/* ring progress */}
      <div style={{display:"flex",justifyContent:"center",padding:"2px 0"}}>
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r={R} stroke={P.neuLo} strokeWidth="7" fill="none" opacity=".5"/>
          <circle cx="36" cy="36" r={R} stroke={g.color} strokeWidth="7" fill="none" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C*(1-pctDone/100)} transform="rotate(-90 36 36)"
            style={{transition:"stroke-dashoffset .5s"}}/>
          <text x="36" y="40" textAnchor="middle" fontSize="15" fontWeight="700" fill={P.neuInk} className="tnum">{pctDone.toFixed(0)}%</text>
        </svg>
      </div>

      {/* saved / target */}
      <div style={{textAlign:"center"}} className="tnum">
        <div style={{fontSize:14,fontWeight:700,color:P.neuInk}}>{fmt(saved)}</div>
        <div style={{fontSize:11,color:P.neuSub}}>of {fmt(g.target)}</div>
      </div>

      {/* Deadline verdict — a figure is not an answer. "38% of 5,200" doesn't
          tell you whether you will make it; this line does. Only rendered when
          a deadline exists. */}
      {dl&&
        <div style={{textAlign:"center",fontSize:10,fontWeight:600,lineHeight:1.4,
          color:dl.done?P.grD:(dl.onTrack?P.grD:(dl.overdue?P.wine:"#E07B2A"))}}>
          {dl.done?"Reached"
            :dl.overdue?`Past ${instShortDate(dl.deadline)}`
            :dl.onTrack?`On track · ${instShortDate(dl.deadline)}`
            :`Behind · needs ${fmt(dl.requiredMonthly)}/mo`}
        </div>}

      {/* actions */}
      <div style={{display:"flex",gap:6,marginTop:"auto"}}>
        <button onClick={()=>openAdd(g.id)}
          style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4,borderRadius:999,padding:"6px 0",fontSize:12,fontWeight:600,background:g.color,color:"#fff",border:"none"}}>
          <I.Plus size={12}/>Add
        </button>
        <IconButton icon={I.MoreHorizontal} label={`Details for ${g.name||"goal"}`} title="Details" onClick={()=>openDetails(g.id)} size={16} className="neu-btn"
          style={{borderRadius:999,padding:"6px 10px",color:P.neuSub}}/>
      </div>
    </div>
  );
}

/* ── GOALS VIEW — square cards with type icons ── */
function GoalsView({goals,banks,fmt,addGoal,updateGoal,removeGoal,contributeToGoal,removeContribution,owners}){
  const today=todayISO();
  const[addModal,setAddModal]=useState(null);     // goalId for "add money"

  const[addAmount,setAddAmount]=useState("");
  const[addNote,setAddNote]=useState("");
  const[detailModal,setDetailModal]=useState(null); // goalId for details
  useScrollLock(!!detailModal);
  const[typePicker,setTypePicker]=useState(null);    // goalId for type picker
  useScrollLock(!!typePicker);
  const addDlgRef=useDialogA11y(()=>setAddModal(null),!!addModal);
  const detailDlgRef=useDialogA11y(()=>setDetailModal(null),!!detailModal);
  const typePickerDlgRef=useDialogA11y(()=>setTypePicker(null),!!typePicker);

  const openAdd=id=>{setAddModal(id);setAddAmount("");setAddNote("");};
  const openDetails=id=>setDetailModal(id);
  const openTypePicker=id=>setTypePicker(id);

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      {["me","wife"].map(ok=>{
        const list=goals.filter(g=>g.owner===ok);
        return(
          <section key={ok} style={{marginBottom:22}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{width:8,height:8,borderRadius:999,background:ok==="me"?P.jade:P.br}}/>
              <h2 style={{fontSize:14,fontWeight:600,color:ok==="me"?P.jade:P.br,margin:0}}>{owners[ok]}'s goals</h2>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(min(148px,100%),1fr))",gap:10}}>
              {list.map(g=>(
                <GoalSquare key={g.id} {...{g,fmt,today,updateGoal,removeGoal,openAdd,openDetails,openTypePicker}}/>
              ))}
              {/* add-goal square */}
              <button onClick={()=>addGoal(ok)} className="neu-btn"
                style={{borderRadius:16,padding:14,minHeight:150,color:P.jade,
                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,fontSize:13,fontWeight:500}}>
                <I.Plus size={20}/>Add goal
              </button>
            </div>
          </section>
        );
      })}

      {/* ── Type picker modal ── */}
      {typePicker&&(()=>{
        const g=goals.find(x=>x.id===typePicker);
        if(!g)return null;
        return(
          <Portal>
          <div className="sheet-bg" onClick={()=>setTypePicker(null)}>
            <div className="sheet" ref={typePickerDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Goal type — {g.name}</h3>
                <IconButton icon={I.X} label="Close" onClick={()=>setTypePicker(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {GOAL_TYPES.map(([key,label])=>{
                  const Icon=goalIcon(key);
                  const active=g.type===key;
                  return(
                    <button key={key} onClick={()=>{updateGoal(g.id,{type:key});setTypePicker(null);}}
                      style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"12px 6px",borderRadius:12,
                        background:active?g.color+"22":"rgba(0,0,0,.04)",color:active?g.color:P.sub,
                        border:active?`1px solid ${g.color}`:"1px solid transparent",fontSize:11,fontWeight:600,textAlign:"center",lineHeight:1.2}}>
                      <Icon size={22}/>{label}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
          </Portal>
        );
      })()}

      {/* ── Add money modal ── */}
      {addModal&&(()=>{
        const g=goals.find(x=>x.id===addModal);
        if(!g)return null;
        const saved=(g.contributions||[]).filter(c=>!c.deletedAt).reduce((s,c)=>s+(Number(c.amount)||0),0);
        return(
          <Portal>
          <div className="sheet-bg" onClick={()=>setAddModal(null)}>
            <div className="sheet" ref={addDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Add money — {g.name}</h3>
                <IconButton icon={I.X} label="Close" onClick={()=>setAddModal(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
              </div>
              <div style={{background:"rgba(0,0,0,.05)",borderRadius:12,padding:12,marginBottom:16}}>
                <div style={{fontSize:12,color:P.sub}}>Current saved</div>
                <div className="serif tnum" style={{fontSize:24,fontWeight:600,color:P.ink}}>{fmt(saved)}</div>
                <div style={{fontSize:12,color:P.faint}}>Target: {fmt(g.target)} · {g.target>0?((saved/g.target)*100).toFixed(0):0}% there</div>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount to add</div>
                <input type="text" inputMode="decimal" value={addAmount} onChange={e=>setAddAmount(e.target.value)}
                  onBlur={e=>setAddAmount(e.target.value.trim()===""?"":String(evalMathExpr(e.target.value,Number(addAmount)||0)))}
                  onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur();}}
                  placeholder="0" autoFocus
                  style={{width:"100%",borderRadius:10,padding:"10px",fontSize:18,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Note (optional)</div>
                <input value={addNote} onChange={e=>setAddNote(e.target.value)} placeholder="e.g. Monthly deposit"
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              {addAmount&&Number(addAmount)>0&&(
                <div style={{fontSize:13,color:P.sub,marginBottom:12}} className="tnum">
                  New total: {fmt(saved+Number(addAmount))} ({g.target>0?(((saved+Number(addAmount))/g.target)*100).toFixed(0):0}%)
                </div>
              )}
              <button onClick={()=>{if(Number(addAmount)>0){contributeToGoal({goalId:addModal,amount:addAmount,note:addNote,owner:g.owner});setAddModal(null);}}}
                style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,background:P.jade,color:"#fff",border:"none"}}>
                Add {addAmount?fmt(Number(addAmount)):"money"}
              </button>
            </div>
          </div>
          </Portal>
        );
      })()}

      {/* ── Details modal: edit target/monthly + contributions ── */}
      {detailModal&&(()=>{
        const g=goals.find(x=>x.id===detailModal);
        if(!g)return null;
        const saved=(g.contributions||[]).filter(c=>!c.deletedAt).reduce((s,c)=>s+(Number(c.amount)||0),0);
        const remain=Math.max(0,g.target-saved);
        const months=g.monthly>0?Math.ceil(remain/g.monthly):null;
        const Icon=goalIcon(g.type);
        const dl=goalDeadlineStatus(g,today);
        /* Owner-scoped, and resolved from LIVE banks. A goal belongs to one
           person and its money cannot be sitting in the other person's account
           — offering those would invite a link that the advisor then has to
           refuse to read. Joint accounts are excluded for the same reason the
           advisor never counts them toward one owner. */
        const linkableBanks=(banks||[]).filter(b=>b&&!b.deletedAt&&b.owner===g.owner);
        /* A stored id whose account has since been deleted, changed owner or
           become joint reads as unlinked rather than as a dangling reference —
           resolved here, before anything writes, the same way categoryGoalFor
           degrades an unusable installment funding category. */
        const linkedBank=linkableBanks.find(b=>b.id===g.bankId)||null;
        return(
          <Portal>
          <div className="sheet-bg" onClick={()=>setDetailModal(null)}>
            <div className="sheet" ref={detailDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
                <span style={{display:"flex",alignItems:"center",justifyContent:"center",width:34,height:34,borderRadius:10,background:g.color+"22",color:g.color}}><Icon size={18}/></span>
                <input value={g.name} onChange={e=>updateGoal(g.id,{name:e.target.value})} className="bare" style={{fontSize:16,fontWeight:600,flex:1,minWidth:0,color:P.ink}}/>
                <IconButton icon={I.X} label="Close" onClick={()=>setDetailModal(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
              </div>

              <div style={{display:"flex",gap:10,marginBottom:14}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:P.faint,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Target</div>
                  <NumField value={g.target} onCommit={v=>updateGoal(g.id,{target:v})} min={0}
                    className="tnum" style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:P.faint,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Monthly</div>
                  <NumField value={g.monthly} onCommit={v=>updateGoal(g.id,{monthly:v})} min={0}
                    className="tnum" style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
                </div>
              </div>
              {/* ── Deadline and account ──
                  The date input needs all three corrections or it will not line
                  up with the field beside it: fontFamily:"inherit" (a bare date
                  input renders in the UA font), an explicit height (its
                  shadow-DOM -webkit-datetime-edit adds content height no padding
                  reaches), and appearance:none in all three prefixes (Safari
                  gives that shadow tree a min-content width that ignores
                  width:100% and spills over its neighbour). The row wraps so it
                  stacks on a narrow phone instead of colliding. */}
              <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                <div style={{flex:"1 1 150px",minWidth:0}}>
                  <div style={{fontSize:11,color:P.faint,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Target date</div>
                  <input type="date" value={g.deadline||""} aria-label="Goal deadline"
                    onChange={e=>updateGoal(g.id,{deadline:e.target.value||null})}
                    style={{width:"100%",minWidth:0,borderRadius:10,padding:"8px 10px",fontSize:14,
                      fontFamily:"inherit",height:38,background:"rgba(0,0,0,.05)",border:"none",color:P.ink,
                      WebkitAppearance:"none",MozAppearance:"none",appearance:"none"}}/>
                </div>
                <div style={{flex:"1 1 150px",minWidth:0}}>
                  <div style={{fontSize:11,color:P.faint,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Kept in</div>
                  <select value={linkedBank?linkedBank.id:""} aria-label="Account this goal is kept in"
                    onChange={e=>updateGoal(g.id,{bankId:e.target.value||null})}
                    style={{width:"100%",minWidth:0,borderRadius:10,padding:"8px 10px",fontSize:14,
                      fontFamily:"inherit",height:38,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}>
                    <option value="">Not linked</option>
                    {linkableBanks.map(b=><option key={b.id} value={b.id}>{b.name||"Account"}{b.bank?` — ${b.bank}`:""}</option>)}
                  </select>
                </div>
              </div>

              <div style={{fontSize:12,color:P.sub,marginBottom:dl?6:14}} className="tnum">
                Saved {fmt(saved)} · {fmt(remain)} to go{months!=null?` · ~${months} mo at this pace`:""}
              </div>
              {/* Only ever shown when a deadline exists — goalDeadlineStatus
                  returns null otherwise, so a goal without one keeps exactly
                  the pace line it always had. */}
              {dl&&
                <div style={{fontSize:12,marginBottom:14,lineHeight:1.5,
                  color:dl.done?P.grD:(dl.onTrack?P.grD:(dl.overdue?P.wine:"#E07B2A"))}}>
                  {dl.done
                    ?`Reached — target date ${instShortDate(dl.deadline)}`
                    :dl.overdue
                      ?<span>Past its date · <span className="tnum">{fmt(dl.remain)}</span> still to go</span>
                      :dl.onTrack
                        ?<span>On track for {instShortDate(dl.deadline)} · needs <span className="tnum">{fmt(dl.requiredMonthly)}</span>/mo</span>
                        :<span>Behind for {instShortDate(dl.deadline)} · <span className="tnum">{fmt(dl.monthly)}</span>/mo
                           needs to be <span className="tnum">{fmt(dl.requiredMonthly)}</span>/mo</span>}
                </div>}
              {linkedBank&&
                <div style={{fontSize:11,color:P.faint,marginBottom:14,lineHeight:1.5}}>
                  This money sits in {linkedBank.name||"that account"}, so the Purchase Advisor
                  won't count it twice.
                </div>}

              <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Contributions</div>
              {(g.contributions||[]).filter(c=>!c.deletedAt).length>0?(
                <div style={{borderRadius:10,overflow:"hidden",background:"rgba(0,0,0,.03)",marginBottom:8}}>
                  {[...(g.contributions||[]).filter(c=>!c.deletedAt)].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>(
                    <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid rgba(0,0,0,.06)",fontSize:13}}>
                      <span style={{color:P.faint,fontSize:11}}>{c.date}</span>
                      <span className="tnum" style={{fontWeight:600,color:P.jade}}>+{fmt(c.amount)}</span>
                      {c.note&&<span style={{color:P.sub,flex:1,fontSize:12}}>{c.note}</span>}
                      <IconButton icon={I.X} label="Delete contribution" onClick={()=>removeContribution(g.id,c.id)} size={12} style={{color:P.red,opacity:.5,marginLeft:"auto",padding:6,minWidth:32,minHeight:32}}/>
                    </div>
                  ))}
                </div>
              ):<div style={{fontSize:12,color:P.faint,marginBottom:8}}>No contributions yet.</div>}

              <button onClick={()=>{setDetailModal(null);openAdd(g.id);}}
                style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:10,padding:"9px 0",fontSize:14,fontWeight:600,background:g.color,color:"#fff",border:"none"}}>
                <I.Plus size={14}/>Add money
              </button>
            </div>
          </div>
          </Portal>
        );
      })()}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   INSTALLMENTS — short-term purchase plans (Tabby, Tamara, Amazon, card).

   Visually a cousin of Goals, but not a copy: cards go through the shared
   neu(16) rather than Goals' hand-rolled shadow (that drift is exactly what
   the 2026-07-29 audit found), and progress is a bar because "3 of 4 paid" is
   a countable sequence, not a proportion of a pot.

   The tab reads and writes nothing derived: every figure on screen comes from
   the module-scope installment* helpers, so a card, the Budget group and the
   summary can't disagree. ════════════════════════════════════════════════ */

/* Short human date for a due-date chip — "12 Aug" reads faster than an ISO
   string in a list of eight of them. */
function instShortDate(s){
  if(!s)return"—";
  const d=new Date(String(s)+"T00:00:00");
  if(isNaN(d.getTime()))return String(s);
  return d.toLocaleDateString("en-US",{day:"numeric",month:"short"});
}
function instLongDate(s){
  if(!s)return"—";
  const d=new Date(String(s)+"T00:00:00");
  if(isNaN(d.getTime()))return String(s);
  return d.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"});
}
const INSTALLMENT_STATUS_META={
  active:{label:"Active",color:()=>P.jade,bg:()=>P.jadeS},
  completed:{label:"Paid off",color:()=>P.gr,bg:()=>P.sfA},
  paidOffEarly:{label:"Paid off early",color:()=>P.gr,bg:()=>P.sfA},
  cancelled:{label:"Cancelled",color:()=>P.neuSub,bg:()=>P.sfA},
};
const INSTALLMENT_SECTIONS=[
  {key:"active",label:"Active"},
  {key:"completed",label:"Paid Off"},
  {key:"paidOffEarly",label:"Paid Off Early"},
  {key:"cancelled",label:"Cancelled"},
];

/* ── Add / Edit sheet ──────────────────────────────────────────────────────
   Top level (not nested in InstallmentsView) for the same reason GoalSquare
   is: a component redefined on every parent render remounts its inputs and
   they lose focus mid-typing.

   The schedule is GENERATED but always EDITABLE, because providers don't
   split evenly — 749.25 over 3 really is 249.75 / 249.75 / 249.75, but plenty
   of plans are 250.00 / 250.00 / 249.25. Save is gated on the rows summing to
   the original amount within INSTALLMENT_ROUND_TOL, so a typo can't create a
   plan whose schedule quietly disagrees with what was bought. ─────────────── */
/* `prefill` seeds a NEW plan's fields (the Purchase Advisor's "Create this
   plan" exit) without making the sheet think it is editing an existing record.
   Kept distinct from `initial` deliberately: `editing` decides whether Save
   updates or creates, whether the schedule starts hand-edited, and whether the
   first-due/count row is offered at all — a prefill needs none of that, it
   just wants the boxes filled in. From the moment it saves it is an ordinary
   installment and the advisor has no further relationship with it. */
function InstallmentEditSheet({initial,prefill,payments,owner,ownerLabel,cur,fmt,onClose,onSave}){
  const editing=!!initial;
  const seed=initial||prefill||null;
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const[f,setF]=useState(()=>({
    name:(seed&&seed.name)||"",
    provider:(seed&&seed.provider)||"tabby",
    customProviderName:(seed&&seed.customProviderName)||"",
    purchaseDate:(seed&&seed.purchaseDate)||todayISO(),
    originalAmount:seed?seed.originalAmount:"",
    includeInBudget:seed?seed.includeInBudget!==false:true,
    notes:(seed&&seed.notes)||"",
  }));
  /* A BNPL plan's first payment is a downpayment taken AT purchase, so
     defaulting it a month out made the common case wrong and needed correcting
     by hand every time. Only a default: `dueTouched` stops it moving under
     someone who has already set a date. */
  const[dueTouched,setDueTouched]=useState(()=>!!(prefill&&prefill.firstDueDate));
  const defaultFirstDue=key=>installmentProvider(key).bnpl?todayISO():addMonthsISO(todayISO(),1);
  const set=patch=>setF(x=>{
    const next={...x,...patch};
    if(patch.provider&&patch.provider!==x.provider&&!dueTouched&&!editing){
      const d=defaultFirstDue(patch.provider);
      setHandEdited(false);setFirstDue(d);
    }
    return next;
  });
  const[firstDue,setFirstDue]=useState(()=>
    editing?((payments[0]&&payments[0].dueDate)||todayISO())
      :((prefill&&prefill.firstDueDate)||defaultFirstDue((seed&&seed.provider)||"tabby")));
  const[count,setCount]=useState(()=>editing?payments.length:((prefill&&prefill.count)||4));
  const[rows,setRows]=useState(()=>editing
    ?payments.map(p=>({id:p.id,sequence:p.sequence,dueDate:p.dueDate,
        scheduledAmount:p.scheduledAmount,status:p.status}))
    :[]);
  /* Once a row is typed into, the generator stops overwriting it — otherwise
     entering exact provider amounts and then correcting the total would throw
     the hand-typed figures away. "Regenerate" is the explicit way back. */
  const[handEdited,setHandEdited]=useState(editing);
  useEffect(()=>{
    if(handEdited)return;
    const total=Number(f.originalAmount)||0;
    const n=Number(count)||0;
    if(!total||!n||!firstDue){setRows([]);return;}
    setRows(generateInstallmentSchedule({firstDueDate:firstDue,count:n,total}));
  },[f.originalAmount,count,firstDue,handEdited]);

  const check=scheduleDiff(f.originalAmount,rows);
  const canSave=!!String(f.name).trim()&&rows.length>0&&(Number(f.originalAmount)||0)>0&&check.ok;
  const setRow=(i,patch)=>{setHandEdited(true);setRows(rs=>rs.map((r,j)=>j===i?{...r,...patch}:r));};
  const removeRow=i=>{setHandEdited(true);setRows(rs=>rs.filter((_,j)=>j!==i).map((r,j)=>({...r,sequence:j+1})));};
  const addRow=()=>{setHandEdited(true);setRows(rs=>{
    const last=rs[rs.length-1];
    return[...rs,{sequence:rs.length+1,
      dueDate:last?addMonthsISO(last.dueDate,1):firstDue,scheduledAmount:0}];
  });};
  const regenerate=()=>{
    const total=Number(f.originalAmount)||0,n=Number(count)||0;
    if(!total||!n||!firstDue)return;
    setHandEdited(false);
    setRows(generateInstallmentSchedule({firstDueDate:firstDue,count:n,total}));
  };
  const submit=()=>{
    if(!canSave)return;
    const plan={owner,name:String(f.name).trim(),provider:f.provider,
      customProviderName:f.provider==="other"?String(f.customProviderName||"").trim():"",
      purchaseDate:f.purchaseDate,originalAmount:Number(f.originalAmount)||0,
      currency:cur,includeInBudget:!!f.includeInBudget,notes:f.notes||""};
    onSave({plan,rows:rows.map((r,i)=>({id:r.id,sequence:i+1,dueDate:r.dueDate,
      scheduledAmount:Number(r.scheduledAmount)||0}))});
  };
  const lab={fontSize:12,color:P.sub,marginBottom:4};
  /* Three separate reasons the two-up rows were misaligned, all of them about
     <input type="date"> not being an ordinary text box:

       fontFamily  — a bare date input renders in the UA's font while NumField
                     carries `tnum`, so the pair came out different heights.
       height      — even with the font matched it still measures ~2px taller,
                     because its shadow-DOM `-webkit-datetime-edit` contributes
                     content height that no padding or line-height reaches. An
                     explicit height is the only thing that actually equalises
                     them; measured in Chrome, both land on 38 exactly.
       appearance  — Safari gives that shadow tree a min-content width which
                     ignores `width:100%`, so it spills over the field beside
                     it. Killing the native appearance and allowing the box to
                     shrink is what stops the overlap.

     Height lives here rather than on the schedule rows below, which reuse `box`
     at a smaller size and set their own. */
  const box={width:"100%",borderRadius:10,padding:"9px 10px",fontSize:14,fontFamily:"inherit",
    height:38,background:"rgba(0,0,0,.05)",border:"none",color:P.ink};
  const dateBox={...box,minWidth:0,WebkitAppearance:"none",MozAppearance:"none",appearance:"none"};
  /* Wrap rather than collide: the Provider row above already does this, and these
     two rows were the ones that didn't. */
  const twoUp={display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"};
  const cell={flex:"1 1 150px",minWidth:0};
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1}
        style={{maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>
            {editing?"Edit installment":"New installment"}
          </h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18}
            style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
        </div>

        {/* Owner is shown, not chosen: an installment belongs to whoever the
            tab is showing, and a picker here would invite splitting a plan
            from the budget row and ledger entry it must stay married to. */}
        <div style={{fontSize:12,color:P.sub,marginBottom:14}}>
          For <strong style={{color:P.ink}}>{ownerLabel}</strong> · amounts in {cur}
        </div>

        <div style={{marginBottom:12}}>
          <div style={lab}>What did you buy?</div>
          <input value={f.name} onChange={e=>set({name:e.target.value})}
            placeholder="e.g. Office chair" autoFocus style={box}/>
        </div>

        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 150px",minWidth:0}}>
            <div style={lab}>Provider</div>
            <select value={f.provider} onChange={e=>set({provider:e.target.value})} style={box}>
              {INSTALLMENT_PROVIDERS.map(p=><option key={p.key} value={p.key}>{p.label}</option>)}
            </select>
          </div>
          {f.provider==="other"&&(
            <div style={{flex:"1 1 150px",minWidth:0}}>
              <div style={lab}>Provider name</div>
              <input value={f.customProviderName} onChange={e=>set({customProviderName:e.target.value})}
                placeholder="e.g. Store plan" style={box}/>
            </div>)}
        </div>

        <div style={twoUp}>
          <div style={cell}>
            <div style={lab}>Purchase date</div>
            <input type="date" value={f.purchaseDate} onChange={e=>set({purchaseDate:e.target.value})} style={dateBox}/>
          </div>
          <div style={cell}>
            <div style={lab}>Total amount</div>
            <NumField value={f.originalAmount} onCommit={v=>set({originalAmount:v})}
              allowEmpty min={0} live className="tnum" style={box}/>
          </div>
        </div>

        {!editing&&(
          <div style={twoUp}>
            <div style={cell}>
              <div style={lab}>First payment due</div>
              <input type="date" value={firstDue}
                onChange={e=>{setDueTouched(true);setHandEdited(false);setFirstDue(e.target.value);}}
                style={dateBox}/>
            </div>
            <div style={cell}>
              <div style={lab}>Number of payments</div>
              <NumField value={count} onCommit={v=>{setHandEdited(false);setCount(v);}}
                integer min={1} max={60} live className="tnum" style={box}/>
            </div>
          </div>)}

        <label style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,
          minHeight:40,fontSize:14,color:P.ink}}>
          <input type="checkbox" checked={!!f.includeInBudget}
            onChange={e=>set({includeInBudget:e.target.checked})}
            style={{width:18,height:18,accentColor:P.jade}}/>
          <span>Include in Budget
            <span style={{display:"block",fontSize:11,color:P.faint}}>
              Shows each payment in the period it falls due
            </span>
          </span>
        </label>

        <div style={{marginBottom:14}}>
          <div style={lab}>Notes (optional)</div>
          <input value={f.notes} onChange={e=>set({notes:e.target.value})}
            placeholder="e.g. 4 payments, no fees" style={box}/>
        </div>

        {/* ── Schedule editor ── */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:600,color:P.ink}}>Payment schedule</div>
          <button onClick={regenerate} className="status-pill"
            style={{border:`1px solid ${P.line}`,background:"transparent",color:P.sub,cursor:"pointer"}}>
            Regenerate
          </button>
        </div>
        <div style={{...neuInset(12),padding:"4px 0",marginBottom:10}}>
          {rows.length===0
            ?<div style={{padding:"14px 12px",fontSize:12,color:P.faint}}>
               Enter a total amount and number of payments to build a schedule.
             </div>
            :rows.map((r,i)=>{
              const paid=r.status==="paid";
              const cancelled=r.status==="cancelled";
              return(
                <div key={r.id||i} style={{display:"flex",alignItems:"center",gap:8,
                  padding:"6px 10px",opacity:cancelled?.5:1}}>
                  <span style={{fontSize:11,color:P.faint,width:20,flexShrink:0}} className="tnum">#{i+1}</span>
                  <input type="date" value={r.dueDate||""} disabled={paid||cancelled}
                    onChange={e=>setRow(i,{dueDate:e.target.value})}
                    aria-label={`Due date for payment ${i+1}`}
                    style={{...dateBox,flex:"1 1 100px",padding:"6px 8px",fontSize:13,height:32}}/>
                  {paid||cancelled
                    ?<span className="tnum" style={{width:88,textAlign:"right",fontSize:13,
                        fontWeight:600,color:P.neuSub}}>{fmt(Number(r.scheduledAmount)||0)}</span>
                    :<NumField value={r.scheduledAmount} onCommit={v=>setRow(i,{scheduledAmount:v})}
                       min={0} live className="tnum" aria-label={`Amount for payment ${i+1}`}
                       style={{...box,width:88,flexShrink:0,padding:"6px 8px",fontSize:13,height:32,textAlign:"right"}}/>}
                  {paid
                    ?<span style={{fontSize:9,fontWeight:700,color:P.gr,background:P.sfA,
                        borderRadius:999,padding:"2px 6px",flexShrink:0}}>PAID</span>
                    :<IconButton icon={I.Trash} label={`Remove payment ${i+1}`}
                       onClick={()=>removeRow(i)} size={13}
                       style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32,flexShrink:0}}/>}
                </div>
              );
            })}
          {rows.length>0&&
            <button onClick={addRow} style={{background:"transparent",border:"none",color:P.jade,
              fontSize:12,fontWeight:600,padding:"8px 12px",minHeight:40}}>+ Add a payment</button>}
        </div>

        {/* Live reconciliation. Shown always (not only on error) so the person
            can see the schedule agreeing with the receipt before saving. */}
        <div style={{fontSize:12,marginBottom:14,display:"flex",flexDirection:"column",gap:2}}>
          <div style={{display:"flex",justifyContent:"space-between",color:P.sub}}>
            <span>Original amount</span><span className="tnum">{fmt(check.originalAmount)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",color:P.sub}}>
            <span>Scheduled total</span><span className="tnum">{fmt(check.scheduledTotal)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",
            color:check.ok?P.gr:P.wine,fontWeight:600}}>
            <span>Difference</span>
            <span className="tnum">{check.difference>0?"+":""}{fmt(check.difference)}</span></div>
          {!check.ok&&<div style={{color:P.wine,fontSize:11,marginTop:2}}>
            The schedule must add up to the total before you can save.</div>}
        </div>

        <button onClick={submit} disabled={!canSave}
          style={{width:"100%",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:600,
            background:canSave?P.jade:P.sfA,color:canSave?"#fff":P.faint,border:"none"}}>
          {editing?"Save changes":"Create installment"}
        </button>
      </div>
    </div>
    </Portal>
  );
}

/* ── Record a payment ──────────────────────────────────────────────────────
   Scheduled vs actual are stored separately on purpose: the ledger row uses
   what really left the account, while Budget keeps planning the scheduled
   figure. A few halalas of difference never redistributes the rest of the
   schedule — if a provider genuinely changes the remaining amounts, that's an
   explicit schedule edit, not something inferred from one payment. ────────── */
function InstallmentPaymentSheet({inst,payment,fmt,cur,payPeriods,fundingCategoriesFor,onClose,onConfirm}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const[amount,setAmount]=useState(payment.scheduledAmount);
  const[date,setDate]=useState(payment.paidDate||todayISO());
  const[fundedCatId,setFundedCatId]=useState(payment.fundedCatId||"");
  const diff=roundTo((Number(amount)||0)-(Number(payment.scheduledAmount)||0),2);
  /* Re-read on every date change: back-dating the payment can move it into a
     bucket whose plan has a different set of categories, and offering one that
     bucket never had is how you end up funding from an envelope that doesn't
     exist there. */
  const cats=useMemo(()=>(fundingCategoriesFor?fundingCategoriesFor(date):[]),[fundingCategoriesFor,date]);
  /* The chosen category can fall out from under the picker when the date moves.
     Dropping the selection is the honest response — silently keeping an id the
     new bucket doesn't have would be resolved away at write time anyway, and the
     person would never be told their choice was ignored. */
  useEffect(()=>{
    if(fundedCatId&&!cats.some(c=>c.id===fundedCatId))setFundedCatId("");
  },[cats,fundedCatId]);
  /* The paid month and the due month can differ — paying a September instalment
     out of August's Shopping. The derived Budget row is marked in the month it
     is DUE, so this sheet says so plainly rather than letting the allocation
     quietly vanish from a month the person isn't looking at. */
  const owner=payment.owner||inst.owner||"me";
  const dueBucket=payPeriods&&payment.dueDate?bucketKeyFor(payment.dueDate,payPeriods,owner):null;
  const paidBucket=payPeriods&&date?bucketKeyFor(date,payPeriods,owner):null;
  const crossBucket=!!(fundedCatId&&dueBucket&&paidBucket&&dueBucket!==paidBucket);
  const grouped=useMemo(()=>{
    const m=new Map();
    cats.forEach(c=>{const k=c.groupName||"Other";if(!m.has(k))m.set(k,[]);m.get(k).push(c);});
    return[...m.entries()];
  },[cats]);
  const lab={fontSize:12,color:P.sub,marginBottom:4};
  /* Same three date-input corrections as InstallmentEditSheet — this sheet has
     the identical Amount / Payment date pair and drifted the same way. */
  const box={width:"100%",borderRadius:10,padding:"9px 10px",fontSize:14,fontFamily:"inherit",
    height:38,background:"rgba(0,0,0,.05)",border:"none",color:P.ink};
  const dateBox={...box,minWidth:0,WebkitAppearance:"none",MozAppearance:"none",appearance:"none"};
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1}
        style={{maxWidth:400,maxHeight:"88dvh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Record payment</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18}
            style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
        </div>
        <div style={{background:"rgba(0,0,0,.05)",borderRadius:12,padding:12,marginBottom:14}}>
          <div style={{fontSize:12,color:P.sub}}>{installmentProviderLabel(inst)}</div>
          <div style={{fontSize:15,fontWeight:600,color:P.ink}}>{inst.name}</div>
          <div style={{fontSize:12,color:P.faint,marginTop:2}}>
            Payment #{payment.sequence} · due {instLongDate(payment.dueDate)} ·
            scheduled <span className="tnum">{fmt(payment.scheduledAmount)}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 140px",minWidth:0}}>
            <div style={lab}>Amount paid ({cur})</div>
            <NumField value={amount} onCommit={setAmount} min={0} live className="tnum" style={box}/>
          </div>
          <div style={{flex:"1 1 140px",minWidth:0}}>
            <div style={lab}>Payment date</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={dateBox}/>
          </div>
        </div>
        {cats.length>0&&(
          <div style={{marginBottom:12}}>
            <div style={lab}>Pay from a budget category (optional)</div>
            <select value={fundedCatId} onChange={e=>setFundedCatId(e.target.value)} style={box}>
              <option value="">Don't take it from a category</option>
              {grouped.map(([g,list])=>(
                <optgroup key={g} label={g}>
                  {list.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </optgroup>
              ))}
            </select>
          </div>)}
        {Math.abs(diff)>INSTALLMENT_ROUND_TOL&&
          <div style={{fontSize:12,color:P.sub,marginBottom:12}}>
            {diff>0?"+":""}<span className="tnum">{fmt(diff)}</span> against the scheduled amount.
            The remaining payments are left exactly as they are — edit the schedule if the
            provider changed them.
          </div>}
        {crossBucket&&
          <div style={{fontSize:12,color:P.br,marginBottom:12}}>
            You're paying this out of {bucketLabel(paidBucket,payPeriods,owner)}, but it's due in{" "}
            {bucketLabel(dueBucket,payPeriods,owner)} — that's the month whose Installments
            row stops being allocated.
          </div>}
        <div style={{fontSize:11,color:P.faint,marginBottom:14}}>
          {fundedCatId
            ?"This spends from that category, so its envelope goes down and this payment stops taking a share of the month it's due."
            :"This creates one transfer in Expenses, linked to this payment."}
        </div>
        {(()=>{
          const ok=(Number(amount)||0)>0&&!!date;
          return(
            <button onClick={()=>{if(ok)onConfirm({actualAmount:Number(amount)||0,paidDate:date,
              fundedCatId:fundedCatId||null});}}
              disabled={!ok}
              style={{width:"100%",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:600,
                background:ok?P.jade:P.sfA,color:ok?"#fff":P.faint,border:"none"}}>
              Record {fmt(Number(amount)||0)}
            </button>
          );
        })()}
      </div>
    </div>
    </Portal>
  );
}

/* ── Pay off early ─────────────────────────────────────────────────────────
   Shows the consequence before it happens (same convention as
   UpdateBalanceSheet and the category-move sheet): what's still scheduled,
   how many payments close, and which future periods lose their Budget rows.
   ONE ledger row is created for the whole payoff — never one per cancelled
   payment, which would triple-count the money that actually moved. ───────── */
function InstallmentPayoffSheet({inst,pays,fmt,cur,payPeriods,onClose,onConfirm}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const open=pays.filter(installmentPaymentIsOpen);
  const remaining=installmentRemainingBalance(inst,pays);
  const[amount,setAmount]=useState(remaining);
  const[date,setDate]=useState(todayISO());
  const[note,setNote]=useState("");
  const owner=inst.owner||"me";
  const periods=[...new Set(open.map(p=>bucketKeyFor(p.dueDate,payPeriods,owner)))]
    .sort().map(k=>bucketLabel(k,payPeriods,owner));
  const lab={fontSize:12,color:P.sub,marginBottom:4};
  const box={width:"100%",borderRadius:10,padding:"9px 10px",fontSize:14,
    background:"rgba(0,0,0,.05)",border:"none",color:P.ink};
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1}
        style={{maxWidth:400,maxHeight:"88dvh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Pay off early</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18}
            style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
        </div>
        <div style={{background:"rgba(0,0,0,.05)",borderRadius:12,padding:12,marginBottom:14}}>
          <div style={{fontSize:15,fontWeight:600,color:P.ink}}>{inst.name}</div>
          <div style={{fontSize:12,color:P.sub,marginTop:6}}>Remaining scheduled balance</div>
          <div className="serif tnum" style={{fontSize:22,fontWeight:600,color:P.ink}}>{fmt(remaining)}</div>
          <div style={{fontSize:12,color:P.faint,marginTop:6}}>
            {open.length} future payment{open.length===1?"":"s"} will close.
          </div>
          {periods.length>0&&
            <div style={{fontSize:11,color:P.faint,marginTop:4}}>
              Budget rows disappear from: {periods.join(" · ")}
            </div>}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={lab}>Payoff amount ({cur})</div>
            <NumField value={amount} onCommit={setAmount} min={0} live className="tnum" style={box}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={lab}>Payoff date</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={box}/>
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={lab}>Note (optional)</div>
          <input value={note} onChange={e=>setNote(e.target.value)}
            placeholder="e.g. settled in the app" style={box}/>
        </div>
        <div style={{fontSize:11,color:P.faint,marginBottom:14}}>
          Payments already recorded stay exactly as they are. One transfer is created for
          the payoff itself.
        </div>
        <button onClick={()=>onConfirm({amount:Number(amount)||0,payoffDate:date,note})}
          style={{width:"100%",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:600,
            background:P.jade,color:"#fff",border:"none"}}>
          Pay off {fmt(Number(amount)||0)}
        </button>
      </div>
    </div>
    </Portal>
  );
}

/* ── Schedule sheet ── every row, its state, and what actually got paid ── */

/* ── One installment card ── */
function InstallmentCard({inst,pays,fmt,today,highlight,onRecord,onPayoff,onSchedule,onEdit,onCancel,onDelete}){
  const[menu,setMenu]=useState(false);
  const status=installmentDerivedStatus(inst,pays);
  const meta=INSTALLMENT_STATUS_META[status]||INSTALLMENT_STATUS_META.active;
  const prov=installmentProvider(inst.provider);
  const Icon=I[prov.iconKey]||I.Receipt;
  const prog=installmentProgress(pays);
  const remaining=installmentRemainingBalance(inst,pays);
  const next=installmentNextPayment(pays,today);
  const overdue=pays.some(p=>installmentPaymentDerivedStatus(p,today)==="overdue");
  const done=installmentExpectedCompletion(pays);
  const open=status==="active";
  const badgeColor=overdue&&open?P.wine:meta.color();
  const badgeBg=overdue&&open?P.redS:meta.bg();
  const act={display:"flex",alignItems:"center",gap:6,minHeight:40,padding:"6px 10px",
    borderRadius:10,fontSize:12,fontWeight:600,border:`1px solid ${P.line}`,
    background:"transparent",color:P.neuSub,cursor:"pointer"};
  return(
    <section style={{...neu(16),padding:14,marginBottom:12,
      outline:highlight?`2px solid ${P.jade}`:"none"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
        <div style={{width:36,height:36,borderRadius:10,flexShrink:0,display:"flex",
          alignItems:"center",justifyContent:"center",background:prov.color+"22",color:prov.color}}>
          <Icon size={18}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:600,color:P.neuInk,overflow:"hidden",
            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{inst.name||"Installment"}</div>
          <div style={{fontSize:12,color:P.neuSub}}>{installmentProviderLabel(inst)}</div>
        </div>
        <span className="status-pill" style={{flexShrink:0,color:badgeColor,background:badgeBg,
          border:"none",fontWeight:700}}>
          {overdue&&open?"Overdue":meta.label}
        </span>
      </div>

      <div style={{...neuInset(999),height:8,margin:"12px 0 6px",overflow:"hidden"}}>
        <div style={{height:"100%",width:`${prog.pct}%`,borderRadius:999,
          background:liquidFillBg(overdue&&open?P.wine:prov.color),transition:"width .4s"}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:P.neuSub}}>
        <span>{prog.paid} of {prog.total} payments paid</span>
        <span className="tnum">{fmt(remaining)} left</span>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",gap:10,
        fontSize:12,color:P.faint,marginTop:6,flexWrap:"wrap"}}>
        {next
          ?<span>Next <span className="tnum" style={{color:P.neuSub,fontWeight:600}}>{fmt(next.scheduledAmount)}</span> on {instShortDate(next.dueDate)}</span>
          :<span>No payments outstanding</span>}
        {done&&open&&<span>Ends {instShortDate(done)}</span>}
      </div>

      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
        {open&&next&&
          <button onClick={()=>onRecord(next)} style={{...act,border:"none",background:P.jade,color:"#fff"}}>
            <I.Check size={13}/> Record payment
          </button>}
        {open&&next&&
          <button onClick={onPayoff} style={act}><I.Send size={13}/> Pay off early</button>}
        <button onClick={onSchedule} style={act}><I.Calendar size={13}/> Schedule</button>
        <button onClick={onEdit} style={act}><I.Edit size={13}/> Edit</button>
        <button onClick={()=>setMenu(m=>!m)} aria-expanded={menu} style={act}>
          <I.MoreHorizontal size={13}/> More
        </button>
      </div>
      {menu&&
        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          {open&&
            <button onClick={()=>{setMenu(false);onCancel();}}
              style={{...act,color:P.wine}}><I.X size={13}/> Cancel plan</button>}
          <button onClick={()=>{setMenu(false);onDelete();}}
            style={{...act,color:P.wine}}><I.Trash size={13}/> Delete record</button>
        </div>}
    </section>
  );
}

function InstallmentsView({installments,installmentPayments,addInstallment,updateInstallment,
  recordInstallmentPayment,payOffInstallmentEarly,cancelInstallment,removeInstallment,
  fmt,cur,budgetOwner,setBudgetOwner,owners,payPeriods,focus,fundingCategoriesFor}){
  const today=todayISO();
  const bucket=bucketNow(payPeriods,budgetOwner);
  const mine=useMemo(()=>installmentsForOwner(installments,budgetOwner),[installments,budgetOwner]);
  const paysOf=useMemo(()=>{
    const m={};
    mine.forEach(x=>{m[x.id]=installmentPaymentsFor(installmentPayments,x.id);});
    return m;
  },[mine,installmentPayments]);
  const summary=useMemo(()=>installmentSummary(installments,installmentPayments,budgetOwner,
    {bucketKey:bucket,payPeriods,todayStr:today}),[installments,installmentPayments,budgetOwner,bucket,payPeriods,today]);

  const grouped=useMemo(()=>{
    const out={active:[],completed:[],paidOffEarly:[],cancelled:[]};
    mine.forEach(x=>{(out[installmentDerivedStatus(x,paysOf[x.id]||[])]||out.active).push(x);});
    out.active.sort((a,b)=>{
      const na=installmentNextPayment(paysOf[a.id]||[],today),nb=installmentNextPayment(paysOf[b.id]||[],today);
      return String((na&&na.dueDate)||"9999").localeCompare(String((nb&&nb.dueDate)||"9999"));
    });
    ["completed","paidOffEarly","cancelled"].forEach(k=>out[k].sort((a,b)=>
      String(b.closedAt||b.updatedAt||"").localeCompare(String(a.closedAt||a.updatedAt||""))));
    return out;
  },[mine,paysOf,today]);

  /* Active is expanded and the closed groups are not — history stays one tap
     away without competing with what still needs paying. */
  const[openSections,setOpenSections]=useState({active:true,completed:false,paidOffEarly:false,cancelled:false});
  const[sheet,setSheet]=useState(null);          // {mode:"add"|"edit", id?}
  const[paySheet,setPaySheet]=useState(null);    // {installmentId,paymentId}
  const[payoffId,setPayoffId]=useState(null);
  const[scheduleId,setScheduleId]=useState(null);
  const[confirm,setConfirm]=useState(null);      // {type:"cancel"|"delete", id, name}
  const[highlight,setHighlight]=useState(null);
  const cardRefs=useRef({});

  /* Arriving from a derived Budget row: open the right section, mark the card
     and scroll to it. One-shot on `nonce` so tapping the same row twice works. */
  useEffect(()=>{
    if(!focus||!focus.id)return;
    const inst=mine.find(x=>x.id===focus.id);
    if(!inst)return;
    const st=installmentDerivedStatus(inst,paysOf[inst.id]||[]);
    setOpenSections(s=>({...s,[st]:true}));
    setHighlight(focus.id);
    const t=setTimeout(()=>{
      const el=cardRefs.current[focus.id];
      if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
    },80);
    const clear=setTimeout(()=>setHighlight(null),2400);
    return()=>{clearTimeout(t);clearTimeout(clear);};
  },[focus&&focus.nonce]);

  const editing=sheet&&sheet.mode==="edit"?mine.find(x=>x.id===sheet.id):null;
  const payInst=paySheet?mine.find(x=>x.id===paySheet.installmentId):null;
  /* Resolvable by SEQUENCE as well as by id, because the offer to record
     payment #1 straight after creating a plan happens before the caller has
     seen the ids applyInstallmentCreate minted. */
  const payRow=paySheet
    ?(paysOf[paySheet.installmentId]||[]).find(p=>paySheet.paymentId
        ?p.id===paySheet.paymentId
        :(p.sequence===paySheet.sequence&&installmentPaymentIsOpen(p)))
    :null;
  const payoffInst=payoffId?mine.find(x=>x.id===payoffId):null;
  const schedInst=scheduleId?mine.find(x=>x.id===scheduleId):null;

  return(
    <div>
      <OwnerToggle owner={budgetOwner} setOwner={setBudgetOwner} owners={owners}/>

      {/* ── Summary ── */}
      <section style={{...neu(16),padding:14,marginBottom:16}}>
        <div style={{fontSize:12,color:P.neuSub}}>Due this period</div>
        <div className="serif tnum" style={{fontSize:26,fontWeight:600,color:P.neuInk}}>
          {fmt(summary.dueThisPeriod)}
        </div>
        <div style={{fontSize:11,color:P.faint,marginBottom:12}}>
          {bucketLabel(bucket,payPeriods,budgetOwner)}
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:12,color:P.neuSub}}>
          <div style={{...neuInset(12),padding:"8px 10px",flex:"1 1 120px"}}>
            <div style={{fontSize:11,color:P.faint}}>Remaining balance</div>
            <div className="tnum" style={{fontSize:15,fontWeight:600,color:P.neuInk}}>{fmt(summary.remaining)}</div>
          </div>
          <div style={{...neuInset(12),padding:"8px 10px",flex:"1 1 90px"}}>
            <div style={{fontSize:11,color:P.faint}}>Active</div>
            <div className="tnum" style={{fontSize:15,fontWeight:600,color:P.neuInk}}>{summary.activeCount}</div>
          </div>
          <div style={{...neuInset(12),padding:"8px 10px",flex:"1 1 140px"}}>
            <div style={{fontSize:11,color:P.faint}}>Next payment</div>
            <div style={{fontSize:13,fontWeight:600,color:P.neuInk}}>
              {summary.next
                ?<span className="tnum">{fmt(summary.next.scheduledAmount)} · {instShortDate(summary.next.dueDate)}</span>
                :"—"}
            </div>
          </div>
        </div>
        {summary.overdueCount>0&&
          <div style={{marginTop:10,fontSize:12,color:P.wine,fontWeight:600}}>
            {summary.overdueCount} payment{summary.overdueCount===1?"":"s"} past due.
          </div>}
      </section>

      {mine.length===0&&
        <div style={{...neu(16),padding:"24px 16px",textAlign:"center",color:P.neuSub}}>
          <div style={{fontSize:14,fontWeight:600,color:P.neuInk,marginBottom:4}}>No installments yet</div>
          <div style={{fontSize:12}}>Add a Tabby, Tamara, Amazon or card plan and each payment
            will show up in the Budget period it falls due.</div>
        </div>}

      {INSTALLMENT_SECTIONS.map(({key,label})=>{
        const items=grouped[key]||[];
        if(!items.length)return null;
        const isOpen=!!openSections[key];
        return(
          <div key={key} style={{marginBottom:16}}>
            <button onClick={()=>setOpenSections(s=>({...s,[key]:!s[key]}))}
              aria-expanded={isOpen}
              style={{display:"flex",alignItems:"center",gap:8,width:"100%",minHeight:40,
                background:"transparent",border:"none",padding:"4px 2px",marginBottom:6,
                color:key==="active"?P.neuInk:P.neuSub,
                fontSize:key==="active"?15:13,fontWeight:key==="active"?700:600}}>
              <I.Chevron size={13} style={{transform:isOpen?"rotate(180deg)":"rotate(-90deg)",transition:"transform .2s"}}/>
              {label}
              <span style={{fontSize:11,color:P.faint,fontWeight:600}}>{items.length}</span>
            </button>
            {isOpen&&items.map(x=>(
              <div key={x.id} ref={el=>{cardRefs.current[x.id]=el;}}>
                <InstallmentCard inst={x} pays={paysOf[x.id]||[]} fmt={fmt} today={today}
                  highlight={highlight===x.id}
                  onRecord={p=>setPaySheet({installmentId:x.id,paymentId:p.id})}
                  onPayoff={()=>setPayoffId(x.id)}
                  onSchedule={()=>setScheduleId(x.id)}
                  onEdit={()=>setSheet({mode:"edit",id:x.id})}
                  onCancel={()=>setConfirm({type:"cancel",id:x.id,name:x.name||"this installment"})}
                  onDelete={()=>setConfirm({type:"delete",id:x.id,name:x.name||"this installment"})}/>
              </div>
            ))}
          </div>
        );
      })}

      {/* Installments' own FAB: the global one adds a transaction, which is a
          different action from adding a plan.
          Portalled for the same reason every sheet is — TabPane's tab-enter
          animation is fill-mode:both, so its final transform makes it the
          containing block for position:fixed children and an un-portalled
          .fab-btn parks itself inside the tab pane instead of the viewport. */}
      <Portal>
        <button aria-label="Add installment" className="fab-btn"
          onClick={()=>setSheet({mode:"add"})} style={{background:P.gr}}>
          <I.Plus size={24}/>
        </button>
      </Portal>

      {sheet&&
        <InstallmentEditSheet
          key={sheet.mode==="edit"?sheet.id:"add"}
          initial={editing||null}
          payments={editing?(paysOf[editing.id]||[]):[]}
          owner={budgetOwner} ownerLabel={owners[budgetOwner]||budgetOwner}
          cur={cur} fmt={fmt}
          onClose={()=>setSheet(null)}
          onSave={({plan,rows})=>{
            if(editing){updateInstallment(editing.id,plan,rows);setSheet(null);return;}
            const newId=addInstallment(plan,rows);
            setSheet(null);
            /* A plan whose first payment is already due is the BNPL downpayment
               case — offer to record it now rather than making the person hunt
               for it. Deliberately opens the ORDINARY payment sheet: there is
               exactly one way money reaches a payment, and a create-and-pay
               shortcut would quietly become a second one. */
            const first=rows[0];
            if(first&&first.dueDate&&String(first.dueDate)<=todayISO())
              setPaySheet({installmentId:newId,sequence:1});
          }}/>}

      {payInst&&payRow&&
        <InstallmentPaymentSheet inst={payInst} payment={payRow} fmt={fmt} cur={cur}
          payPeriods={payPeriods} fundingCategoriesFor={fundingCategoriesFor}
          onClose={()=>setPaySheet(null)}
          onConfirm={({actualAmount,paidDate,fundedCatId})=>{
            recordInstallmentPayment(payRow.id,{actualAmount,paidDate,fundedCatId});
            setPaySheet(null);
          }}/>}

      {payoffInst&&
        <InstallmentPayoffSheet inst={payoffInst} pays={paysOf[payoffInst.id]||[]}
          fmt={fmt} cur={cur} payPeriods={payPeriods}
          onClose={()=>setPayoffId(null)}
          onConfirm={args=>{payOffInstallmentEarly(payoffInst.id,args);setPayoffId(null);}}/>}

      {schedInst&&
        <InstallmentScheduleSheet inst={schedInst} pays={paysOf[schedInst.id]||[]}
          fmt={fmt} today={today} onClose={()=>setScheduleId(null)}
          onRecord={p=>{setScheduleId(null);setPaySheet({installmentId:schedInst.id,paymentId:p.id});}}/>}

      <ConfirmDialog open={!!confirm}
        title={confirm&&confirm.type==="cancel"?"Cancel this installment?":"Delete this installment?"}
        message={confirm&&confirm.type==="cancel"
          ?`Unpaid payments for "${confirm.name}" will be closed and disappear from future Budget periods. Payments you have already recorded stay in Expenses exactly as they are.`
          :confirm?`"${confirm.name}" and its unpaid schedule move to Recently Deleted, and its future Budget rows disappear. Transactions for payments you already recorded are NOT deleted — remove those separately in Expenses if you want them gone.`:""}
        confirmLabel={confirm&&confirm.type==="cancel"?"Cancel plan":"Delete"}
        onCancel={()=>setConfirm(null)}
        onConfirm={()=>{
          if(confirm.type==="cancel")cancelInstallment(confirm.id);
          else removeInstallment(confirm.id);
          setConfirm(null);
        }}/>
    </div>
  );
}

/* ── PURCHASE ADVISOR VIEW ─────────────────────────────────────────────────
   Renders the engine block near installmentSummary and nothing else. Every
   figure on screen is derived at render time from live data; the only thing
   that survives a reload is what the person typed (PURCHASE_DRAFT_KEY).

   Nothing here can write to `data` except the one explicit exit — "Create this
   plan" — which hands a prefill to the ordinary InstallmentEditSheet. In
   particular no path from here reaches editPlanForMonth: the advisor projects
   across up to 24 future buckets, and materialising a plan into each one just
   because it was looked at is the exact trap the derived Budget rows avoid.
   purchasetest.cjs asserts that as a source-structure property. ───────────── */

/* Every field the draft holds, so a stored draft from an older build merges
   forward with defaults rather than rendering undefined into an input. */
function defaultPurchaseDraft(owner){
  return{owner:owner||"me",product:"",price:"",desiredDate:"",method:"cash",
    downPayment:"",count:4,firstDue:"",fees:"",
    unprotectedGoalIds:[],includedBankIds:[],releasedBankIds:[],trims:{}};
}

/* The category-trim lever. "What if I spent 300 less on eating out?" — applied
   to every projected bucket, clamped to the category by purchaseTrimFor, and
   held only in the draft. It never touches the plan. */
function PurchaseTrimSheet({categories,trims,setTrim,cur,fmt,onClose}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const box={width:"100%",borderRadius:10,padding:"6px 8px",fontSize:13,fontFamily:"inherit",
    height:32,background:"rgba(0,0,0,.05)",border:"none",color:P.ink,textAlign:"right"};
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" aria-label="Trim categories"
          tabIndex={-1} style={{maxWidth:460,maxHeight:"84dvh",overflowY:"auto"}}
          onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Trim categories</h3>
            <IconButton icon={I.X} label="Close" onClick={onClose} size={18}
              style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
          </div>
          <div style={{fontSize:12,color:P.sub,marginBottom:14,lineHeight:1.5}}>
            A what-if only. Nothing below changes your budget — it changes what these
            projections assume you spend, in {cur}, every period.
          </div>
          {categories.length===0
            ?<div style={{fontSize:12,color:P.faint,padding:"12px 0"}}>This plan has no categories yet.</div>
            :<div style={{...neuInset(12),padding:"4px 0"}}>
              {categories.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px"}}>
                  <span style={{flex:1,minWidth:0,fontSize:13,color:P.ink,overflow:"hidden",
                    textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name||"Untitled"}</span>
                  <span className="tnum" style={{fontSize:11,color:P.faint,flexShrink:0}}>{fmt(c.effAmt)}</span>
                  <NumField value={trims[c.id]||0} onCommit={v=>setTrim(c.id,v)}
                    min={0} max={c.effAmt} live className="tnum"
                    aria-label={`Reduce ${c.name||"category"} by`}
                    style={{...box,width:84,flexShrink:0}}/>
                </div>
              ))}
            </div>}
        </div>
      </div>
    </Portal>
  );
}

function PurchaseAdvisorView({monthlyPlans,plans,activePlanId,installments,installmentPayments,
  banks,goals,expenses,planForMonth,payPeriods,convert,ratesStaleDays,
  fmt,cur,budgetOwner,setBudgetOwner,owners,addInstallment,addGoal,openInstallment,setTab}){
  const todayStr=todayISO();
  const bucket=bucketNow(payPeriods,budgetOwner);

  const[draft,setDraft]=useState(()=>({...defaultPurchaseDraft(budgetOwner),...(loadPurchaseDraft()||{})}));
  useEffect(()=>{savePurchaseDraft(draft);},[draft]);
  /* Trims and unprotected goals name records belonging to ONE person. Carrying
     them across an owner switch would apply Jastine's ids to Charlene's plan —
     they would simply never match, which is worse than clearing them because
     the lever would look pulled and do nothing. */
  useEffect(()=>{
    setDraft(d=>d.owner===budgetOwner?d
      :{...d,owner:budgetOwner,trims:{},unprotectedGoalIds:[],includedBankIds:[],releasedBankIds:[]});
  },[budgetOwner]);
  const set=patch=>setDraft(d=>({...d,...patch}));

  const[showTrims,setShowTrims]=useState(false);
  const[createSheet,setCreateSheet]=useState(null);   // the prefill, or null

  const financedMode=draft.method!=="cash";
  const trims=draft.trims||{};

  const engineCtx=useMemo(()=>({monthlyPlans,plans,activePlanId,installments,installmentPayments,
    payPeriods,owner:budgetOwner,trims}),
    [monthlyPlans,plans,activePlanId,installments,installmentPayments,payPeriods,budgetOwner,trims]);

  const thisBucket=useMemo(()=>purchaseHeadroomForBucket(engineCtx,bucket),[engineCtx,bucket]);

  const myGoals=useMemo(()=>(goals||[]).filter(g=>g&&!g.deletedAt&&(g.owner||"me")===budgetOwner),
    [goals,budgetOwner]);
  const unprotected=useMemo(()=>new Set(draft.unprotectedGoalIds||[]),[draft.unprotectedGoalIds]);
  const protectedGoalIds=useMemo(()=>myGoals.filter(g=>!unprotected.has(g.id)).map(g=>g.id),
    [myGoals,unprotected]);

  /* Accounts are stored in their own currency; the advisor speaks one, the
     document's. A conversion that isn't available yet returns null and the
     account is reported as unconverted rather than added at face value. */
  const toBase=useCallback((v,ccy)=>(!ccy||ccy===cur)?v:convert(v,ccy,cur),[convert,cur]);
  /* Unreachable accounts opted in for THIS purchase only — a per-decision
     lever, exactly like unprotectedGoalIds. The account's own flag is a fact
     about the account and lives on the record; including it once does not. */
  const includedBankIds=useMemo(()=>draft.includedBankIds||[],[draft.includedBankIds]);
  const releasedBankIds=useMemo(()=>draft.releasedBankIds||[],[draft.releasedBankIds]);
  const stack=useMemo(()=>purchaseAvailableStack({banks,goals,owner:budgetOwner,
    protectedGoalIds,includedBankIds,releasedBankIds,todayStr,toBase}),
    [banks,goals,budgetOwner,protectedGoalIds,includedBankIds,releasedBankIds,todayStr,toBase]);

  const input=useMemo(()=>({price:Number(draft.price)||0,
