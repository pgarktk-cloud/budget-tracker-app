/* ── INVESTMENTS VIEW — trade log ── */
function InvestmentsView({invs,addInv,updateInv,removeInv,addTrade,removeTrade,livePrice,setLivePrice,sarRate,convert,projection,setProjection,portHistory,addPortSnap,snapshots,owners,
  mp2Rates,mp2RatesByYear,addMp2Rate,updateMp2Rate,removeMp2Rate,
  addMp2Contribution,updateMp2Contribution,removeMp2Contribution,recordMp2Payout,
  confirmTdMaturity,transferTdProceeds,banks,includeMp2Estimate}){
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[updatedAt,setUpdatedAt]=useState(null);
  const[tradeModal,setTradeModal]=useState(null); // invId
  const[contribModal,setContribModal]=useState(null); // invId (MP2)
  const[payoutModal,setPayoutModal]=useState(null); // invId (MP2)
  const[maturityModal,setMaturityModal]=useState(null); // invId (TD)
  const[showRates,setShowRates]=useState(false);
  useScrollLock(!!tradeModal||!!contribModal||!!payoutModal||!!maturityModal||showRates);
  const[tradeForm,setTradeForm]=useState({type:"buy",shares:"",price:"",date:new Date().toISOString().slice(0,10)});
  const[expandedId,setExpandedId]=useState(null);
  const[fetchingName,setFetchingName]=useState({});

  /* Section 8 filters — owner / account type / active-matured status.
     Status only meaningfully applies to Time Deposit (stocks/MP2 don't have
     a status field), so it's a no-op filter for the other two types. */
  const[ownerFilter,setOwnerFilter]=useState("all");
  const[typeFilter,setTypeFilter]=useState("all");
  const[statusFilter,setStatusFilter]=useState("all"); // all | active | matured
  const passFilters=hld=>{
    if(ownerFilter!=="all"&&(hld.owner||"me")!==ownerFilter)return false;
    if(typeFilter!=="all"&&(hld.type||"stocks")!==typeFilter)return false;
    if(statusFilter!=="all"&&hld.type==="td"){
      const st=hld.status||"active";
      if(statusFilter==="active"&&st!=="active")return false;
      if(statusFilter==="matured"&&st==="active")return false;
    }
    return true;
  };
  const filteredInvs=invs.filter(passFilters);
  const stocksInvs=filteredInvs.filter(x=>(x.type||"stocks")==="stocks");
  const mp2Invs=filteredInvs.filter(x=>x.type==="mp2");
  const tdInvs=filteredInvs.filter(x=>x.type==="td");
  const goldInvs=filteredInvs.filter(x=>x.type==="gold");

  /* Look up a company / fund name for a ticker.
     1) Cloudflare proxy → Yahoo (best for ETFs like VWRA, using the mapped symbol)
     2) Finnhub search (good for US stocks)                                   */
  const fetchName=async(id,ticker)=>{
    const t=(ticker||"").trim().toUpperCase();
    if(!t)return;
    setFetchingName(s=>({...s,[id]:true}));
    let name=null;
    if(!PROXY_URL.startsWith("PASTE_")){
      try{
        const ys=toYahooSym(t);
        const res=await fetch(`${PROXY_URL}/name?symbol=${encodeURIComponent(ys)}`);
        if(res.ok){const j=await res.json();if(j&&j.name)name=j.name;}
      }catch(e){}
    }
    if(!name&&!FINNHUB_KEY.startsWith("PASTE_")){
      try{
        const res=await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(t)}&token=${FINNHUB_KEY}`);
        const j=await res.json();
        const list=j.result||[];
        const match=list.find(x=>x.symbol===t)||list.find(x=>x.symbol===t+".US")||list.find(x=>x.symbol===baseKey(t))||list[0];
        if(match&&match.description)name=match.description;
      }catch(e){}
    }
    if(name)updateInv(id,{name});
    setFetchingName(s=>{const n={...s};delete n[id];return n;});
  };

  const usd=n=>`$${(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;

  const rows=stocksInvs.map(hld=>{
    const{shares,avgCost,totalCost}=holdingStats(hld.trades);
    const price=livePrice[baseKey(hld.ticker||"")]||0;
    const value=shares*price;
    const gain=value-totalCost;
    const gainPct=totalCost>0?(gain/totalCost)*100:0;
    return{...hld,shares,avgCost,totalCost,price,value,gain,gainPct};
  });
  const totVal=rows.reduce((s,r)=>s+r.value,0);
  const totCost=rows.reduce((s,r)=>s+r.totalCost,0);
  const totGain=totVal-totCost;
  const totGainPct=totCost>0?(totGain/totCost)*100:0;

  /* Non-market accounts, converted to USD (the hero's currency) for the
     combined "Total investments" line — kept visually separate from the
     stock-only cost/gain stats below it (section 9: never blend a market
     gain % with MP2/TD accrual into one misleading number). */
  const mp2TotalUsd=mp2Invs.reduce((s,hld)=>{
    const v=mp2Valuation(hld,mp2RatesByYear);
    const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
    return s+(convert?(convert(chosen,hld.currency||"PHP","USD")||0):0);
  },0);
  const tdTotalUsd=tdInvs.reduce((s,hld)=>{
    if(hld.status==="closed")return s;
    const v=tdValuation(hld);
    const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
    return s+(convert?(convert(val,hld.currency||"PHP","USD")||0):0);
  },0);
  const goldPriceUsd=livePrice[GOLD_TICKER]||0;
  const goldTotalUsd=goldInvs.reduce((s,hld)=>s+goldValuation(hld,goldPriceUsd,convert).currentValueUsd,0);
  const grandTotalUsd=totVal+mp2TotalUsd+tdTotalUsd+goldTotalUsd;

  const refresh=async()=>{
    const tickers=[...new Set([
      ...stocksInvs.map(h=>(h.ticker||"").trim().toUpperCase()).filter(Boolean),
      ...(goldInvs.length?[GOLD_TICKER]:[]),
    ])];
    if(!tickers.length){setErr("Add a ticker symbol first.");return;}
    setLoading(true);setErr("");
    try{
      const q=await fetchQuotes(tickers);
      setLivePrice(q);
      setUpdatedAt(Date.now());
      const hit=tickers.filter(t=>q[baseKey(t)]!=null).length;
      if(!hit)setErr("No prices found. Check your Worker URL or ticker symbols.");
      else if(hit<tickers.length)setErr(`Got ${hit}/${tickers.length} prices — remaining tickers not found.`);
      else setErr("");
      // auto-capture portfolio snapshot for the history chart
      const newTotVal=stocksInvs.reduce((s,hld)=>{
        const{shares}=holdingStats(hld.trades);
        const p=q[baseKey(hld.ticker||"")]||livePrice[baseKey(hld.ticker||"")]||0;
        return s+shares*p;
      },0);
      if(newTotVal>0)addPortSnap(newTotVal);
    }catch(e){
      setErr(PROXY_URL.startsWith("PASTE_")&&FINNHUB_KEY.startsWith("PASTE_")
        ?"Set up your Cloudflare Worker (for VWRA/LSE) and/or Finnhub key (for US stocks) — see the setup guide."
        :"Price fetch failed — check your Worker URL or Finnhub key.");
    }
    setLoading(false);
  };

  const openTrade=invId=>{
    setTradeModal(invId);
    setTradeForm({type:"buy",shares:"",price:"",date:new Date().toISOString().slice(0,10)});
  };
  const submitTrade=()=>{
    if(!tradeForm.shares||!tradeForm.price)return;
    addTrade(tradeModal,{type:tradeForm.type,shares:Number(tradeForm.shares),price:Number(tradeForm.price),date:tradeForm.date});
    setTradeModal(null);
  };

  const gTone=n=>n>0?P.gr:n<0?P.red:P.sub;
  const series=projectSeries(totVal,projection.monthly,projection.years,projection.rate||8);
  const projData=series.map((v,i)=>({year:`Y${i}`,value:v}));

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      {/* hero */}
      <div className="fade-up" style={{borderRadius:18,padding:20,marginBottom:16,background:P.deep,color:"#fff",
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`}}>
        {/* "Investments" not "Stock portfolio" once MP2/TD are in the mix
            (section 9) — the stock-only cost/gain line below stays clearly
            separate so a market % is never blended with MP2/TD accrual. */}
        <div style={{fontSize:12,fontWeight:500,color:P.deepHi,marginBottom:4}}>Total investments (USD)</div>
        <span key={Math.round(grandTotalUsd)} className="serif tnum num-flash" style={{fontSize:38,fontWeight:600}}>{usd(grandTotalUsd)}</span>
        {(sarRate||convert)&&(
          <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:4,fontSize:14,color:P.deepHi}}>
            {sarRate&&<span>≈ SAR {Math.round(grandTotalUsd*sarRate).toLocaleString("en-US")}</span>}
            {(()=>{const php=convert?convert(grandTotalUsd,"USD","PHP"):null;return php!=null?<span>≈ ₱{Math.round(php).toLocaleString("en-US")}</span>:null;})()}
          </div>
        )}
        {(mp2Invs.length>0||tdInvs.length>0||goldInvs.length>0)&&(
          <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:8,fontSize:12,color:P.deepHi,opacity:.85}}>
            <span>Market {usd(totVal)}</span>
            {mp2Invs.length>0&&<span>MP2 {usd(mp2TotalUsd)}{includeMp2Estimate?" (est.)":" (confirmed)"}</span>}
            {tdInvs.length>0&&<span>Time deposits {usd(tdTotalUsd)}</span>}
            {goldInvs.length>0&&<span>Gold {usd(goldTotalUsd)}</span>}
          </div>
        )}
        <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:20,fontSize:14}} className="tnum">
          <span style={{color:P.deepHi}}>Market cost {usd(totCost)}</span>
          <span style={{color:totGain>=0?"#6FC6DA":"#E89B8C",fontWeight:600}}>
            {totGain>=0?"▲":"▼"} {usd(Math.abs(totGain))} ({totGainPct.toFixed(1)}%) <span style={{opacity:.7,fontWeight:400}}>· stocks/ETF only</span>
          </span>
        </div>
      </div>

      {/* Portfolio trend (Phase 3) — range-selectable, off the new daily
          per-profile snapshots, distinct from the monthly-only chart below
          (kept as-is, off portHistory, for backward compatibility). */}
      <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 12px"}}>Portfolio trend</h3>
        <HistoryRangeChart snapshots={snapshots} profile="household" field="investments"
          money={(v,short)=>{const u=convert?convert(v,"SAR","USD"):null;const n=u!=null?u:v;return short?`$${Math.round(n/1000)}k`:`$${Math.round(n).toLocaleString("en-US")}`;}}
          emptyText="Trend appears once 2+ days of portfolio history have been captured (captured automatically once a day)."/>
      </div>

      {/* Gold value over time (roadmap Phase 4 candidate) — same snapshot
          system/component as Portfolio trend above, pointed at the
          per-type breakdown captured alongside it (snapshot.byType.gold),
          not a new chart implementation. Only shown once a Gold account
          exists, matching the "Gold {usd(...)}" hero line's own gating. */}
      {goldInvs.length>0&&(
        <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
          <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 12px"}}>Gold value over time</h3>
          <HistoryRangeChart snapshots={snapshots} profile="household" field="byType.gold" color={P.amber}
            money={(v,short)=>{const u=convert?convert(v,"SAR","USD"):null;const n=u!=null?u:v;return short?`$${Math.round(n/1000)}k`:`$${Math.round(n).toLocaleString("en-US")}`;}}
            emptyText="Trend appears once 2+ days of gold value history have been captured (captured automatically once a day)."/>
        </div>
      )}

      {/* portfolio history chart (legacy, monthly-only, captured when you refresh prices) */}
      {portHistory.length>0&&(()=>{
        const pts=[...portHistory].sort((a,b)=>a.month.localeCompare(b.month));
        const first=pts[0].value,last=pts[pts.length-1].value;
        const trending=last>=first;
        const chartColor=trending?"#4ADE80":"#F87171";
        const fmtMo=m=>{const[y,mo]=m.split("-");return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("en-US",{month:"short",year:"2-digit"});};
        const data=pts.map(p=>({label:fmtMo(p.month),value:p.value}));
        const pctChange=first>0?((last-first)/first*100):0;
        return(
          <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Portfolio over time</h3>
              <span className="tnum" style={{fontSize:13,fontWeight:600,color:trending?P.jade:P.wine}}>
                {trending?"▲":"▼"} {Math.abs(pctChange).toFixed(1)}% total
              </span>
            </div>
            <div style={{width:"100%",height:160}}>
              <ResponsiveContainer>
                <LineChart data={data} margin={{top:4,right:8,bottom:0,left:-16}}>
                  <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
                  <XAxis dataKey="label" tick={{fontSize:10,fill:P.neuSub}}/>
                  <YAxis tick={{fontSize:10,fill:P.neuSub}} tickFormatter={v=>`$${Math.round(v/1000)}k`}/>
                  <Tooltip formatter={v=>`$${Math.round(v).toLocaleString("en-US")}`}/>
                  <Line type="monotone" dataKey="value" stroke={chartColor} strokeWidth={2.5} dot={{r:3,fill:chartColor}}/>
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div style={{fontSize:11,color:P.neuSub,marginTop:6}}>
              Captured monthly when you refresh prices · {pts.length} data point{pts.length!==1?"s":""}
            </div>
          </div>
        );
      })()}

      {/* Section 8 filters: owner / account type / active-matured status */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
        <select value={ownerFilter} onChange={e=>setOwnerFilter(e.target.value)} style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="all">All owners</option>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="all">All types</option>
          {INVESTMENT_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="all">Active + matured</option>
          <option value="active">Active only</option>
          <option value="matured">Matured/closed only</option>
        </select>
        <button onClick={()=>setShowRates(true)} className="neu-btn" style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:5,padding:"5px 10px",fontSize:12,fontWeight:500,color:P.neuSub}}>
          <I.Settings size={12}/>MP2 declared rates
        </button>
      </div>

      {/* controls */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Stocks / ETF</h2>
        <button onClick={refresh} disabled={loading} className="neu-btn"
          style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",fontSize:14,fontWeight:500,color:P.jade,opacity:loading?.6:1}}>
          <I.Refresh size={14} style={loading?{animation:"spin .9s linear infinite"}:null}/>
          {loading?"Fetching…":"Refresh prices"}
        </button>
      </div>
      {err&&<div style={{fontSize:12,color:P.wine,marginBottom:8,padding:"8px 12px",background:P.wineS,borderRadius:8}}>{err}</div>}
      {updatedAt&&!err&&<div style={{fontSize:11,color:P.neuSub,marginBottom:8}}>Prices updated {new Date(updatedAt).toLocaleTimeString()}</div>}

      {/* holdings list */}
      {(typeFilter==="all"||typeFilter==="stocks")&&
      <div style={{...neu(16),overflow:"hidden",marginBottom:16}}>
        {rows.map(r=>(
          <div key={r.id} style={{borderBottom:"1px solid rgba(0,0,0,.06)"}}>
            {/* summary row */}
            <div style={{padding:"12px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <input value={r.ticker} placeholder="TICKER"
                  onChange={e=>updateInv(r.id,{ticker:e.target.value.toUpperCase()})}
                  onBlur={e=>{
                    const t=(e.target.value||"").trim().toUpperCase();
                    if(!t||r.name)return; // don't overwrite an existing name
                    fetchName(r.id,t);
                  }}
                  className="bare" style={{fontSize:14,fontWeight:700,width:80,letterSpacing:".03em",color:P.neuInk}}/>
                <input value={r.name} placeholder={fetchingName[r.id]?"fetching name…":"Name"} onChange={e=>updateInv(r.id,{name:e.target.value})} className="bare" style={{fontSize:13,color:P.neuSub,flex:1,minWidth:0}}/>
                <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk}}>{usd(r.value)}</span>
                <button onClick={()=>removeInv(r.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={15}/></button>
              </div>
              {/* Investment Account ownership + type — the minimum fields Phase 1
                  adds to an existing holding; everything else on this row is
                  unchanged. Type defaults to Stocks/ETF and is the only type with
                  real valuation today (see INVESTMENT_TYPES comment). */}
              <div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:8}}>
                <select value={r.owner||"me"} onChange={e=>updateInv(r.id,{owner:e.target.value})}
                  style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
                  {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
                </select>
                <select value={r.type||"stocks"} onChange={e=>updateInv(r.id,{type:e.target.value})}
                  style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
                  {INVESTMENT_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
              <div style={{marginTop:6,display:"flex",flexWrap:"wrap",alignItems:"center",gap:14,fontSize:13,color:P.neuSub}} className="tnum">
                <span>{r.shares.toFixed(4)} shares</span>
                <span>Avg {usd(r.avgCost)}</span>
                <span>Price {r.price>0?usd(r.price):"—"}</span>
                <span style={{color:gTone(r.gain),fontWeight:600,marginLeft:"auto"}}>
                  {r.gain>=0?"▲":"▼"} {usd(Math.abs(r.gain))} ({r.gainPct.toFixed(1)}%)
                </span>
              </div>
              {/* trade log toggle + add trade */}
              <div style={{marginTop:8,display:"flex",gap:8}}>
                <button onClick={()=>openTrade(r.id)} className="neu-btn"
                  style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
                  <I.Plus size={12}/>Add trade
                </button>
                {(r.trades||[]).filter(t=>!t.deletedAt).length>0&&(
                  <button onClick={()=>setExpandedId(expandedId===r.id?null:r.id)} className="neu-btn"
                    style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,color:P.neuSub}}>
                    {expandedId===r.id?"Hide":"Show"} {(r.trades||[]).filter(t=>!t.deletedAt).length} trade{(r.trades||[]).filter(t=>!t.deletedAt).length!==1?"s":""}
                  </button>
                )}
              </div>
            </div>

            {/* trade history */}
            {expandedId===r.id&&(r.trades||[]).filter(t=>!t.deletedAt).length>0&&(
              <div style={{...neuInset(0),borderRadius:0,padding:"2px 0"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px 32px",gap:4,padding:"6px 16px",fontSize:11,fontWeight:600,color:P.neuSub,textTransform:"uppercase",letterSpacing:".06em"}}>
                  <span>Date</span><span style={{textAlign:"right"}}>Type</span><span style={{textAlign:"right"}}>Shares</span><span style={{textAlign:"right"}}>Price</span><span/>
                </div>
                {[...(r.trades||[])].filter(tr=>!tr.deletedAt).sort((a,b)=>a.date.localeCompare(b.date)).map(tr=>(
                  <div key={tr.id} style={{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px 32px",gap:4,padding:"6px 16px",fontSize:13,alignItems:"center",borderTop:"1px solid rgba(0,0,0,.05)"}}>
                    <span className="tnum" style={{color:P.neuSub}}>{tr.date}</span>
                    <span style={{textAlign:"right",fontWeight:600,color:tr.type==="buy"?P.jade:P.wine,textTransform:"uppercase",fontSize:11}}>{tr.type}</span>
                    <span className="tnum" style={{textAlign:"right",color:P.neuInk}}>{(Number(tr.shares)||0).toFixed(4)}</span>
                    <span className="tnum" style={{textAlign:"right",color:P.neuInk}}>{usd(tr.price)}</span>
                    <button onClick={()=>removeTrade(r.id,tr.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4,padding:4}}><I.X size={12}/></button>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
        <button onClick={()=>addInv("stocks")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
          <I.Plus size={14}/>Add holding
        </button>
      </div>}

      {/* MP2 accounts */}
      {(typeFilter==="all"||typeFilter==="mp2")&&(
        <div style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Pag-IBIG MP2</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {mp2Invs.map(hld=>(
              <Mp2AccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv}
                mp2RatesByYear={mp2RatesByYear} includeMp2Estimate={includeMp2Estimate}
                onAddContribution={()=>setContribModal(hld.id)}
                onRemoveContribution={cid=>removeMp2Contribution(hld.id,cid)}
                onPayout={()=>setPayoutModal(hld.id)}/>
            ))}
            <button onClick={()=>addInv("mp2")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add MP2 account
            </button>
          </div>
        </div>
      )}

      {/* Time Deposit accounts */}
      {(typeFilter==="all"||typeFilter==="td")&&(
        <div style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Time Deposits</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {tdInvs.map(hld=>(
              <TdAccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv} banks={banks}
                onConfirmMaturity={()=>setMaturityModal(hld.id)} onTransfer={bankId=>transferTdProceeds(hld.id,bankId)}/>
            ))}
            <button onClick={()=>addInv("td")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add Time Deposit
            </button>
          </div>
        </div>
      )}

      {/* Gold accounts (Phase 3) */}
      {(typeFilter==="all"||typeFilter==="gold")&&(
        <div style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Gold</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {goldInvs.map(hld=>(
              <GoldAccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv} goldPriceUsd={goldPriceUsd} priceAt={updatedAt} convert={convert}/>
            ))}
            <button onClick={()=>addInv("gold")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add Gold account
            </button>
          </div>
        </div>
      )}

      {/* projection */}
      <div style={{...neu(16),padding:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 8px"}}>Growth projection ({projection.rate||8}%/yr)</h3>
        <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:10,fontSize:13}}>
          <label style={{color:P.neuSub}}>+$/mo <input type="number" value={projection.monthly} onChange={e=>setProjection({monthly:Number(e.target.value)})} className="bare tnum" style={{width:80,fontWeight:600,color:P.neuInk}}/></label>
          <label style={{color:P.neuSub}}>Years <input type="number" value={projection.years} onChange={e=>setProjection({years:Number(e.target.value)})} className="bare tnum" style={{width:56,fontWeight:600,color:P.neuInk}}/></label>
          <label style={{color:P.neuSub}}>Rate % <input type="number" value={projection.rate??8} onChange={e=>setProjection({rate:Number(e.target.value)})} className="bare tnum" style={{width:48,fontWeight:600,color:P.neuInk}} step="0.5" min="0" max="30"/></label>
          <span className="tnum" style={{marginLeft:"auto",fontWeight:600,color:P.jade}}>→ ${series[series.length-1].toLocaleString("en-US")}</span>
        </div>
        <div style={{width:"100%",height:180}}>
          <ResponsiveContainer>
            <LineChart data={projData} margin={{top:8,right:8,bottom:0,left:-12}}>
              <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
              <XAxis dataKey="year" tick={{fontSize:11,fill:P.neuSub}}/>
              <YAxis tick={{fontSize:11,fill:P.neuSub}} tickFormatter={v=>`${Math.round(v/1000)}k`}/>
              <Tooltip formatter={v=>`$${Math.round(v).toLocaleString("en-US")}`}/>
              <Line type="monotone" dataKey="value" stroke={P.br} strokeWidth={2} dot={false}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Add trade modal */}
      {tradeModal&&(
        <Portal>
        <div className="sheet-bg" onClick={()=>setTradeModal(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>
                Add trade — {invs.find(x=>x.id===tradeModal)?.ticker||""}
              </h3>
              <button onClick={()=>setTradeModal(null)} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              {["buy","sell"].map(t=>(
                <button key={t} onClick={()=>setTradeForm(f=>({...f,type:t}))}
                  style={{flex:1,borderRadius:10,padding:"8px 0",fontSize:14,fontWeight:600,textTransform:"capitalize",
                    background:tradeForm.type===t?(t==="buy"?P.jade:P.wine):"transparent",
                    color:tradeForm.type===t?"#fff":(t==="buy"?P.jade:P.wine),
                    border:`2px solid ${t==="buy"?P.jade:P.wine}`}}>
                  {t==="buy"?"▲ Buy":"▼ Sell"}
                </button>
              ))}
            </div>
            {[["date","Date","date"],["shares","Shares","number"],["price","Price per share (USD)","number"]].map(([k,label,type])=>(
              <div key={k} style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>{label}</div>
                <input type={type} value={tradeForm[k]} onChange={e=>setTradeForm(f=>({...f,[k]:e.target.value}))}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
            ))}
            {tradeForm.shares&&tradeForm.price&&(
              <div style={{background:"rgba(0,0,0,.05)",borderRadius:10,padding:10,marginBottom:12,fontSize:13,color:P.sub}} className="tnum">
                Total: ${(Number(tradeForm.shares)*Number(tradeForm.price)).toLocaleString("en-US",{minimumFractionDigits:2})}
              </div>
            )}
            <button onClick={submitTrade}
              style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:tradeForm.type==="buy"?P.jade:P.wine,color:"#fff",border:"none"}}>
              Confirm {tradeForm.type==="buy"?"Purchase":"Sale"}
            </button>
          </div>
        </div>
        </Portal>
      )}

      {/* Add MP2 contribution modal */}
      {contribModal&&(
        <Mp2ContributionModal
          hld={invs.find(x=>x.id===contribModal)}
          onClose={()=>setContribModal(null)}
          onSubmit={(amount,date,note)=>{addMp2Contribution(contribModal,amount,date,note);setContribModal(null);}}/>
      )}

      {/* Record MP2 annual dividend payout modal */}
      {payoutModal&&(
        <Mp2PayoutModal
          hld={invs.find(x=>x.id===payoutModal)}
          banks={banks}
          mp2RatesByYear={mp2RatesByYear}
          onClose={()=>setPayoutModal(null)}
          onSubmit={payload=>{recordMp2Payout(payoutModal,payload);setPayoutModal(null);}}/>
      )}

      {/* Confirm Time Deposit maturity modal */}
      {maturityModal&&(
        <TdMaturityModal
          hld={invs.find(x=>x.id===maturityModal)}
          onClose={()=>setMaturityModal(null)}
          onSubmit={payload=>{confirmTdMaturity(maturityModal,payload);setMaturityModal(null);}}/>
      )}

      {/* MP2 declared dividend rates */}
      {showRates&&(
        <Mp2RatesModal
          rates={mp2Rates}
          addMp2Rate={addMp2Rate}
          updateMp2Rate={updateMp2Rate}
          removeMp2Rate={removeMp2Rate}
          onClose={()=>setShowRates(false)}/>
      )}
    </div>
  );
}

/* ── MP2 account card — no live market price, so the summary is the
   confirmed/estimated split from mp2Valuation() rather than a ticker+shares
   row. Clearly labels which number is official vs projected (section 3/4). */
function Mp2AccountCard({hld,owners,updateInv,removeInv,mp2RatesByYear,includeMp2Estimate,onAddContribution,onRemoveContribution,onPayout}){
  const[expanded,setExpanded]=useState(false);
  const v=mp2Valuation(hld,mp2RatesByYear);
  const ccy=hld.currency||"PHP";
  const money=n=>`${ccy} ${Math.round(Number(n)||0).toLocaleString("en-US")}`;
  const contributions=(hld.contributions||[]).filter(c=>!c.deletedAt).sort((a,b)=>a.date.localeCompare(b.date));
  const maturityLabel=hld.maturityDate?new Date(hld.maturityDate+"T00:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"}):"—";
  const daysToMaturity=hld.maturityDate?Math.ceil((new Date(hld.maturityDate+"T00:00:00")-new Date())/86400000):null;
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"12px 16px"}}>

        <input value={hld.nickname||""} placeholder="Nickname / masked ref (optional)" onChange={e=>updateInv(hld.id,{nickname:e.target.value})}

        <select value={hld.payoutMode||"compounded"} onChange={e=>updateInv(hld.id,{payoutMode:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>

        <label style={{display:"flex",flexDirection:"column",gap:2}}>Maturity date
          <input type="date" value={hld.maturityDate||""} onChange={e=>updateInv(hld.id,{maturityDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Projection rate %/yr
          <input type="number" step="0.1" value={hld.projectionRate??""} onChange={e=>updateInv(hld.id,{projectionRate:Number(e.target.value)})} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
      </div>
      {hld.startDate&&hld.maturityDate&&new Date(hld.maturityDate)<=new Date(hld.startDate)&&(
        <div style={{fontSize:11,color:P.wine,marginBottom:8}}>Maturity date must be after the start date.</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Confirmed value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.neuInk}}>{money(v.confirmedValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Based on officially declared rates only</div>
        </div>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Estimated value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.jade}}>{money(v.estimatedValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Based on projected rate — not yet officially declared</div>
        </div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:P.neuSub}} className="tnum">
        <span>Total contributions {money(v.totalContrib)}</span>
        <span>Confirmed dividends {money(v.confirmedDividends)}</span>
        <span>Est. accrued dividends {money(v.estimatedDividends)}</span>
        {hld.payoutMode==="annual"&&v.paid>0&&<span>Paid out {money(v.paid)}</span>}
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:P.neuSub}}>
        <span>Matures {maturityLabel}</span>
        {daysToMaturity!=null&&<span>{daysToMaturity>0?`${daysToMaturity} days remaining`:"Matured"}</span>}
      </div>
      {v.undeclaredYears.length>0&&(
        <div style={{fontSize:11,color:P.amber||P.neuSub,marginBottom:8,padding:"6px 10px",background:"rgba(0,0,0,.04)",borderRadius:8}}>
          No official rate declared yet for {v.undeclaredYears.join(", ")} — estimated value uses the projection rate for {v.undeclaredYears.length>1?"those years":"that year"}.
        </div>
      )}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <button onClick={onAddContribution} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
          <I.Plus size={12}/>Add contribution
        </button>
        {contributions.length>0&&(
          <button onClick={()=>setExpanded(e=>!e)} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,color:P.neuSub}}>
            {expanded?"Hide":"Show"} {contributions.length} contribution{contributions.length!==1?"s":""}
          </button>
        )}
        {hld.payoutMode==="annual"&&(
          <button onClick={onPayout} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.br}}>
            <I.Bank size={12}/>Record annual dividend payout
          </button>
        )}
      </div>
      <textarea value={hld.notes||""} placeholder="Notes" onChange={e=>updateInv(hld.id,{notes:e.target.value})}
        style={{width:"100%",borderRadius:8,padding:"6px 8px",fontSize:12,background:"rgba(0,0,0,.03)",border:"none",color:P.neuInk,resize:"vertical",minHeight:32}}/>
      {expanded&&contributions.length>0&&(
        <div style={{marginTop:8,borderRadius:8,overflow:"hidden",background:"rgba(0,0,0,.03)"}}>
          {contributions.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",fontSize:12,borderTop:"1px solid rgba(0,0,0,.05)"}}>
              <span className="tnum" style={{color:P.neuSub}}>{c.date}</span>
              <span className="tnum" style={{fontWeight:600,color:P.neuInk,marginLeft:"auto"}}>{money(c.amount)}</span>
              {c.note&&<span style={{color:P.neuSub,fontSize:11}}>{c.note}</span>}
              <button onClick={()=>onRemoveContribution(c.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={12}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Time Deposit account card — status-driven: Active shows live estimates,

  const ccy=hld.currency||"PHP";

  const status=hld.status||"active";
  const usingConfirmed=status!=="active"&&hld.confirmedFinalAmount!=null;
  const displayValue=usingConfirmed?Number(hld.confirmedFinalAmount):v.currentEstValue;
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"12px 16px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <input value={hld.name||""} placeholder="Account name" onChange={e=>updateInv(hld.id,{name:e.target.value})}
          className="bare" style={{fontSize:14,fontWeight:700,flex:1,minWidth:0,color:P.neuInk}}/>
        <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".04em",padding:"2px 8px",borderRadius:999,
          background:status==="active"?P.jadeS||"rgba(0,0,0,.06)":"rgba(0,0,0,.08)",color:status==="active"?P.jade:P.neuSub}}>{status}</span>
        <button onClick={()=>removeInv(hld.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={15}/></button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <select value={hld.owner||"me"} onChange={e=>updateInv(hld.id,{owner:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <input value={hld.institution||""} placeholder="Bank / institution" onChange={e=>updateInv(hld.id,{institution:e.target.value})}
          className="bare" style={{fontSize:12,color:P.neuSub,minWidth:100,flex:1}}/>
        <select value={hld.compounding||"maturity"} onChange={e=>updateInv(hld.id,{compounding:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}} disabled={status!=="active"}>
          <option value="maturity">At maturity</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annually">Annually</option>
        </select>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:8,fontSize:12,color:P.neuSub}}>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Principal
          <input type="number" min="0" value={hld.principal??""} onChange={e=>updateInv(hld.id,{principal:Number(e.target.value)})} className="tnum" style={{...neuInset(6),width:100,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Annual rate %
          <input type="number" step="0.01" min="0" value={hld.rate??""} onChange={e=>updateInv(hld.id,{rate:Number(e.target.value)})} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Withholding tax %
          <input type="number" step="0.01" min="0" max="100" value={hld.taxRate??""} onChange={e=>updateInv(hld.id,{taxRate:Number(e.target.value)})} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Start date
          <input type="date" value={hld.startDate||""} onChange={e=>updateInv(hld.id,{startDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Maturity date
          <input type="date" value={hld.maturityDate||""} onChange={e=>updateInv(hld.id,{maturityDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
      </div>
      {hld.startDate&&hld.maturityDate&&new Date(hld.maturityDate)<=new Date(hld.startDate)&&(
        <div style={{fontSize:11,color:P.wine,marginBottom:8}}>Maturity date must be after the start date.</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>{usingConfirmed?"Confirmed value":"Current estimated value"}</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.neuInk}}>{money(displayValue)}</div>
          {!usingConfirmed&&<div style={{fontSize:10,color:P.neuSub}}>Estimate until maturity or bank confirmation</div>}
        </div>

          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.jade}}>{money(v.maturityValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Estimate — full term</div>

      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:P.neuSub}} className="tnum">

        <span>Withholding tax {money(v.taxAmt)}</span>

        {status==="active"&&v.daysRemaining<=0&&(
          <button onClick={onConfirmMaturity} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.br}}>
            <I.Bank size={12}/>Confirm matured
          </button>
        )}
        {status==="active"&&v.daysRemaining>0&&(
          <button onClick={onConfirmMaturity} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,color:P.neuSub}}>
            Confirm matured early

        )}
        {status==="matured"&&(
          <TdTransferControl banks={banks} onTransfer={onTransfer}/>
        )}
        {status==="closed"&&hld.transferBankId&&(

      <textarea value={hld.notes||""} placeholder="Notes" onChange={e=>updateInv(hld.id,{notes:e.target.value})}

    </div>
  );
}

function TdTransferControl({banks,onTransfer}){
  const[bankId,setBankId]=useState((banks&&banks[0]&&banks[0].id)||"");
  if(!banks||!banks.length)return<span style={{fontSize:11,color:P.neuSub}}>Add a bank account to transfer proceeds.</span>;
  return(
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <select value={bankId} onChange={e=>setBankId(e.target.value)} style={{...neu(8),padding:"3px 6px",fontSize:12,border:"none",color:P.neuSub}}>
        {banks.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
      </select>
      <button onClick={()=>bankId&&onTransfer(bankId)} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
        <I.Refresh size={12}/>Transfer proceeds
      </button>
    </div>
  );
}

/* ── Gold account card (Phase 3) — physical bars/coins only. No live market
   price series like stocks (a single spot quote, not a per-holding
   ticker/trade log), so the summary is purchase-vs-current value off
   goldValuation(), mirroring how TdAccountCard/Mp2AccountCard summarize
   rate-driven (not trade-driven) accounts. Purity is entered as karat
   (24K/22K/custom) since that's how gold is actually quoted, converted to a
   0–1 fraction only inside goldValuation(). */
function GoldAccountCard({hld,owners,updateInv,removeInv,goldPriceUsd,priceAt,convert}){
  const v=goldValuation(hld,goldPriceUsd,convert);
  const ccy=hld.currency||"USD";
  const money=(n,c=ccy)=>`${c} ${Math.round(Number(n)||0).toLocaleString("en-US")}`;
  const weightInvalid=!(Number(hld.weight)>0);
  const costInvalid=!(Number(hld.purchaseCost)>0);
  const karatInvalid=!(Number(hld.karat)>0&&Number(hld.karat)<=24);
  const setPurityType=pt=>{
    const karat=pt==="24k"?24:pt==="22k"?22:(Number(hld.karat)||18);
    updateInv(hld.id,{purityType:pt,karat});
  };
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"12px 16px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <input value={hld.name||""} placeholder="Account name" onChange={e=>updateInv(hld.id,{name:e.target.value})}
          className="bare" style={{fontSize:14,fontWeight:700,flex:1,minWidth:0,color:P.neuInk}}/>
        <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk}}>{v.hasPrice?money(convert?(convert(v.currentValueUsd,"USD",ccy)||v.currentValueUsd):v.currentValueUsd):"—"}</span>
        <button onClick={()=>removeInv(hld.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={15}/></button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <select value={hld.owner||"me"} onChange={e=>updateInv(hld.id,{owner:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <select value={ccy} onChange={e=>updateInv(hld.id,{currency:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:4,fontSize:12,color:P.neuSub}}>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Weight
          <input type="number" min="0" step="0.001" value={hld.weight??""} onChange={e=>updateInv(hld.id,{weight:Number(e.target.value)})}
            className="tnum" style={{...neuInset(6),width:90,padding:"3px 6px",fontSize:12,color:weightInvalid?P.wine:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Unit
          <select value={hld.weightUnit||"g"} onChange={e=>updateInv(hld.id,{weightUnit:e.target.value})} style={{...neu(6),padding:"3px 6px",fontSize:12,border:"none",color:P.neuInk}}>
            {GOLD_UNITS.map(([v2,l])=><option key={v2} value={v2}>{l}</option>)}
          </select>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purity
          <select value={hld.purityType||"24k"} onChange={e=>setPurityType(e.target.value)} style={{...neu(6),padding:"3px 6px",fontSize:12,border:"none",color:P.neuInk}}>
            <option value="24k">24K</option>
            <option value="22k">22K</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        {hld.purityType==="custom"&&(
          <label style={{display:"flex",flexDirection:"column",gap:2}}>Karat
            <input type="number" min="1" max="24" step="0.1" value={hld.karat??""} onChange={e=>updateInv(hld.id,{karat:Number(e.target.value)})}
              className="tnum" style={{...neuInset(6),width:60,padding:"3px 6px",fontSize:12,color:karatInvalid?P.wine:P.neuInk}}/>
          </label>
        )}
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purchase date
          <input type="date" value={hld.purchaseDate||""} onChange={e=>updateInv(hld.id,{purchaseDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purchase cost ({ccy})
          <input type="number" min="0" value={hld.purchaseCost??""} onChange={e=>updateInv(hld.id,{purchaseCost:Number(e.target.value)})}
            className="tnum" style={{...neuInset(6),width:100,padding:"3px 6px",fontSize:12,color:costInvalid?P.wine:P.neuInk}}/>
        </label>
      </div>
      {(weightInvalid||costInvalid||karatInvalid)&&(
        <div style={{fontSize:11,color:P.wine,marginBottom:6}}>
          {weightInvalid&&"Weight must be greater than 0. "}
          {costInvalid&&"Purchase cost must be greater than 0. "}
          {karatInvalid&&"Karat must be between 1 and 24."}
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Purchase value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.neuInk}}>{money(hld.purchaseCost)}</div>
        </div>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Current estimated value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.jade}}>
            {v.hasPrice?money(convert?(convert(v.currentValueUsd,"USD",ccy)||v.currentValueUsd):v.currentValueUsd):"No price yet"}
          </div>
        </div>
      </div>
      {v.hasPrice&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:v.gainUsd>=0?P.jade:P.wine,fontWeight:600}} className="tnum">
          <span>{v.gainUsd>=0?"▲":"▼"} {money(Math.abs(convert?(convert(v.gainUsd,"USD",ccy)||v.gainUsd):v.gainUsd))} ({v.gainPct.toFixed(1)}%)</span>
          <span style={{color:P.neuSub,fontWeight:400}}>Spot ${goldPriceUsd?Number(goldPriceUsd).toFixed(2):"—"}/oz{priceAt?` · updated ${new Date(priceAt).toLocaleTimeString()}`:""}</span>
        </div>
      )}
      {!v.hasPrice&&<div style={{fontSize:11,color:P.neuSub,marginBottom:8}}>No gold price cached yet — tap "Refresh prices" above.</div>}
      <textarea value={hld.notes||""} placeholder="Notes" onChange={e=>updateInv(hld.id,{notes:e.target.value})}
        style={{width:"100%",borderRadius:8,padding:"6px 8px",fontSize:12,background:"rgba(0,0,0,.03)",border:"none",color:P.neuInk,resize:"vertical",minHeight:32}}/>
    </div>
  );
}

/* ── Add MP2 contribution modal ── */

  return(

            <button onClick={onClose} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>

    <Portal>
      <div className="sheet-bg" onClick={onClose}>

            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Record dividend payout — {hld?.name||"MP2"}</h3>

            <input type="number" value={year} onChange={e=>setYear(Number(e.target.value))}
              style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount received ({hld?.currency||"PHP"})</div>
            <input type="number" min="0" value={amount} onChange={e=>setAmount(e.target.value)}
              style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Date received</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}

            <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Deposit to bank account (optional)</div>

              {(banks||[]).map(b=><option key={b.id} value={b.id}>{b.name}</option>)}

            style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,background:P.jade,color:"#fff",border:"none",opacity:valid?1:.5}}>
            Record payout
          </button>
        </div>
      </div>
    </Portal>

/* ── Confirm Time Deposit maturity modal (section 7) — the person enters

            <button onClick={onClose} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>

/* ── MP2 declared dividend rates — one shared table (data.mp2DividendRates),
   add/edit/delete + history (section 3). Editing an existing year in place
   rather than allowing duplicate years keeps "one rate per year" true
   without extra validation plumbing. */
function Mp2RatesModal({rates,addMp2Rate,updateMp2Rate,removeMp2Rate,onClose}){
  const[year,setYear]=useState(new Date().getFullYear());
  const[rate,setRate]=useState("");
  const sorted=[...(rates||[])].sort((a,b)=>b.year-a.year);
  const existing=sorted.find(r=>r.year===Number(year));
  const submit=()=>{
    if(!(Number(rate)>0)&&Number(rate)!==0)return;
    if(existing)updateMp2Rate(existing.id,{rate:Number(rate)});
    else addMp2Rate(year,rate);
    setRate("");
  };
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>MP2 declared dividend rates</h3>
            <button onClick={onClose} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>
          </div>
          <div style={{fontSize:11,color:P.sub,marginBottom:12,lineHeight:1.5}}>
            One official rate per year, shared by every MP2 account unless an account overrides it. Never a projection — only enter what Pag-IBIG has actually declared.
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <input type="number" value={year} onChange={e=>setYear(Number(e.target.value))} placeholder="Year"
              style={{width:90,borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            <input type="number" step="0.01" value={rate} onChange={e=>setRate(e.target.value)} placeholder="Rate %"
              style={{flex:1,borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            <button onClick={submit} style={{borderRadius:10,padding:"8px 14px",fontSize:14,fontWeight:600,background:P.jade,color:"#fff",border:"none"}}>
              {existing?"Update":"Add"}
            </button>
          </div>
          <div style={{maxHeight:260,overflowY:"auto",borderRadius:10,background:"rgba(0,0,0,.03)"}}>
            {sorted.length===0&&<div style={{padding:12,fontSize:13,color:P.sub}}>No declared rates yet.</div>}
            {sorted.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid rgba(0,0,0,.05)"}}>
                <span className="tnum" style={{fontWeight:600,color:P.ink}}>{r.year}</span>
                <span className="tnum" style={{color:P.jade,fontWeight:600,marginLeft:8}}>{r.rate}%</span>
                <button onClick={()=>{setYear(r.year);setRate(String(r.rate));}} style={{marginLeft:"auto",background:"transparent",border:"none",color:P.sub,fontSize:12}}>Edit</button>
                <button onClick={()=>removeMp2Rate(r.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.6}}><I.X size={14}/></button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </Portal>
  );
}

/* ── Asset / liability row (top-level so it doesn't remount on each keystroke) ── */
function AssetRow({a,updateAsset,removeAsset}){
  return(
    <div style={{padding:"12px 16px",borderBottom:"1px solid rgba(0,0,0,.06)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <input value={a.name} onChange={e=>updateAsset(a.id,{name:e.target.value})} className="bare" style={{fontSize:14,fontWeight:600,flex:1,minWidth:0,color:P.neuInk}}/>
        <select value={a.currency} onChange={e=>updateAsset(a.id,{currency:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {BANK_CCY.map(c=><option key={c}>{c}</option>)}
        </select>
        <button onClick={()=>removeAsset(a.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={15}/></button>
      </div>
      {a.kind==="asset"?(
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:12,color:P.neuSub}}>{a.currency}</span>
          <input type="number" value={a.value} onChange={e=>updateAsset(a.id,{value:Number(e.target.value)})}
            className="bare tnum" style={{width:120,textAlign:"right",fontSize:14,fontWeight:600,color:P.neuInk}}/>
        </div>
      ):(
        /* Liability installment mode */
        <div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <button onClick={()=>updateAsset(a.id,{installment:true})} className={a.installment?"":"neu-btn"}
              style={{flex:1,borderRadius:8,padding:"5px 0",fontSize:12,fontWeight:600,border:"none",
                ...(a.installment?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>
              Installment
            </button>
            <button onClick={()=>updateAsset(a.id,{installment:false})} className={!a.installment?"":"neu-btn"}
              style={{flex:1,borderRadius:8,padding:"5px 0",fontSize:12,fontWeight:600,border:"none",
                ...(!a.installment?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>
              Fixed amount
            </button>
          </div>
          {a.installment?(
            <div style={{display:"flex",flexWrap:"wrap",gap:10,fontSize:13}}>
              <label style={{color:P.neuSub,display:"flex",flexDirection:"column",gap:3}}>
                <span style={{fontSize:11}}>Monthly payment ({a.currency})</span>
                <input type="number" value={a.monthly||""} onChange={e=>updateAsset(a.id,{monthly:Number(e.target.value)})}
                  className="bare tnum" style={{...neuInset(6),width:110,fontSize:14,fontWeight:600,padding:"4px 6px",color:P.neuInk}}/>
              </label>
              <label style={{color:P.neuSub,display:"flex",flexDirection:"column",gap:3}}>
                <span style={{fontSize:11}}>Months remaining (as of)</span>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <input type="number" value={a.monthsRemaining||""} onChange={e=>updateAsset(a.id,{monthsRemaining:Number(e.target.value)})}
                    className="bare tnum" style={{...neuInset(6),width:56,fontSize:14,fontWeight:600,padding:"4px 6px",color:P.neuInk}}/>
                  <input type="month" value={(a.asOfDate||"").slice(0,7)} onChange={e=>updateAsset(a.id,{asOfDate:e.target.value+"-01"})}
                    style={{...neuInset(6),fontSize:12,padding:"4px 6px",border:"none",color:P.neuInk}}/>
                </div>
              </label>
              {(a.monthly&&a.monthsRemaining&&a.asOfDate)&&(()=>{
                const bal=liabilityBalance(a);
                const now=new Date();const ref=new Date(a.asOfDate);
                const elapsed=Math.max(0,(now.getFullYear()-ref.getFullYear())*12+(now.getMonth()-ref.getMonth()));
                const remaining=Math.max(0,a.monthsRemaining-elapsed);
                const donePct=Math.min(100,(elapsed/a.monthsRemaining)*100);
                return(
                  <div style={{width:"100%",...neu(10),padding:10,marginTop:4}}>
                    <div style={{fontSize:12,color:P.neuSub}}>Balance today: <strong className="tnum" style={{color:P.neuInk}}>{a.currency} {Math.round(bal).toLocaleString("en-US")}</strong></div>
                    <div style={{fontSize:11,color:P.neuSub,marginTop:2,opacity:.85}}>{remaining} months remaining · {elapsed} months paid</div>
                    <div style={{...neuInset(999),marginTop:6,height:8,overflow:"hidden"}}>
                      <div className="liquid-fill" style={{width:`${donePct}%`,height:"100%",background:liquidFillBg(P.jade)}}/>
                    </div>
                  </div>
                );
              })()}
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:12,color:P.neuSub}}>{a.currency}</span>
              <input type="number" value={a.value||""} onChange={e=>updateAsset(a.id,{value:Number(e.target.value)})}
                className="bare tnum" style={{width:120,textAlign:"right",fontSize:14,fontWeight:600,color:P.neuInk}}/>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── NET WORTH VIEW — installment liabilities ── */
function NetWorthView({netWorth,banksSar,invSar,assetSar,liabSar,sarRate,convert,ratesErr,assets,addAsset,updateAsset,removeAsset,history,snapshots,captureSnapshot,addPastSnap,removeSnap}){
  const[gran,setGran]=useState("month");
  const[pm,setPm]=useState(new Date().toISOString().slice(0,7));
  const[pv,setPv]=useState("");
  const sar=n=>`SAR ${Math.round(n).toLocaleString("en-US")}`;
  const usd=sarRate?Math.round(netWorth/sarRate):null;
  const php=convert?convert(netWorth,"SAR","PHP"):null;
  const parts=[{label:"Bank accounts",value:banksSar,color:SEG[0]},{label:"Investments",value:invSar,color:SEG[3]},{label:"Other assets",value:assetSar,color:SEG[5]},{label:"Liabilities",value:-liabSar,color:P.red}];
  const gross=banksSar+invSar+assetSar;
  const fmtMo=m=>{const[y,mo]=m.split("-");return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("en-US",{month:"short",year:"2-digit"});};
  const sorted=[...history].sort((a,b)=>a.month.localeCompare(b.month));
  let pts;
  if(gran==="year"){const m={};sorted.forEach(s=>{m[s.month.slice(0,4)]=s;});pts=Object.entries(m).map(([y,s])=>({label:y,net:s.net}));}
  else pts=sorted.map(s=>({label:fmtMo(s.month),net:s.net}));
  const last=sorted[sorted.length-1];
  const delta=last?netWorth-last.net:null;
  const assetItems=assets.filter(a=>a.kind==="asset");
  const liabItems=assets.filter(a=>a.kind==="liability");

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div className="fade-up" style={{borderRadius:18,padding:20,marginBottom:16,background:P.deep,color:"#fff",
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`}}>
        <div style={{fontSize:12,fontWeight:500,color:P.deepHi,marginBottom:4}}>Net worth</div>
        <span key={Math.round(netWorth)} className="serif tnum num-flash" style={{fontSize:38,fontWeight:600}}>{sar(netWorth)}</span>
        <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:6,color:P.deepHi,fontSize:14}}>
          <span>{usd!=null?`≈ $${usd.toLocaleString("en-US")}`:"USD —"}</span>
          <span>{php!=null?`≈ ₱${Math.round(php).toLocaleString("en-US")}`:"PHP —"}</span>
        </div>
        {(usd==null||php==null)&&<div style={{fontSize:11,marginTop:6,color:"#E89B8C"}}>{ratesErr?"Couldn't load live rates — tap refresh in Currency tab.":"Loading live rates…"}</div>}
        {delta!=null&&<div className="tnum" style={{fontSize:14,marginTop:6,color:delta>=0?"#6FC6DA":"#E89B8C"}}>{delta>=0?"▲":"▼"} {sar(Math.abs(delta))} since last snapshot</div>}
      </div>

      <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,margin:"0 0 12px",color:P.neuSub}}>Composition</h3>
        <div style={{...neuInset(999),height:12,width:"100%",overflow:"hidden",marginBottom:12,position:"relative"}}>
          <div style={{display:"flex",height:"100%",width:"100%"}}>
            {parts.slice(0,3).map(p=>gross>0&&p.value>0&&<div key={p.label} className="bar-animated liquid-fill" style={{width:`${(p.value/gross)*100}%`,height:"100%",background:liquidFillBg(p.color)}}/>)}
          </div>
        </div>
        {parts.map(p=>(
          <div key={p.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 0",fontSize:14}}>
            <span style={{display:"flex",alignItems:"center",gap:8,color:P.neuInk}}><span style={{width:10,height:10,borderRadius:999,background:p.color}}/>{p.label}</span>
            <span className="tnum" style={{color:p.value<0?P.wine:P.neuSub}}>{p.value<0?`− ${sar(-p.value)}`:sar(p.value)}</span>
          </div>
        ))}
      </div>

      <div className="fade-up-1b" style={{...neu(16),padding:16,marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,margin:"0 0 12px",color:P.neuSub}}>Net worth trend</h3>
        <HistoryRangeChart snapshots={snapshots} profile="household" field="net"
          money={(v,short)=>short?`${Math.round(v/1000)}k`:sar(v)}
          emptyText="Trend appears once 2+ days of history have been captured (captured automatically once a day)."/>
      </div>

      <div className="fade-up-2" style={{...neu(16),overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"10px 16px",fontSize:14,fontWeight:600,color:P.neuSub}}>Assets</div>
        {assetItems.map(a=><AssetRow key={a.id} a={a} updateAsset={updateAsset} removeAsset={removeAsset}/>)}
        <button onClick={()=>addAsset("asset")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}><I.Plus size={14}/>Add asset</button>
        <div style={{padding:"10px 16px",fontSize:14,fontWeight:600,color:P.neuSub,borderTop:"1px solid rgba(0,0,0,.06)"}}>Liabilities</div>
        {liabItems.map(a=><AssetRow key={a.id} a={a} updateAsset={updateAsset} removeAsset={removeAsset}/>)}
        <button onClick={()=>addAsset("liability")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.wine,background:"transparent",border:"none"}}><I.Plus size={14}/>Add liability</button>
      </div>

      <div className="fade-up-3" style={{...neu(16),padding:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <h3 style={{fontSize:14,fontWeight:600,margin:0,color:P.neuSub}}>Monthly snapshot log</h3>

            {["month","year"].map(gv=>(
              <button key={gv} onClick={()=>setGran(gv)} className={gran===gv?"":"neu-btn"}
                style={{borderRadius:999,padding:"3px 10px",fontSize:12,textTransform:"capitalize",border:"none",
                  ...(gran===gv?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>{gv}</button>
            ))}
          </div>
        </div>
        {pts.length>0?(
          <div style={{width:"100%",height:200}}>
            <ResponsiveContainer>
              <LineChart data={pts} margin={{top:8,right:8,bottom:0,left:-12}}>
                <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
                <XAxis dataKey="label" tick={{fontSize:11,fill:P.neuSub}}/>
                <YAxis tick={{fontSize:11,fill:P.neuSub}} tickFormatter={v=>`${Math.round(v/1000)}k`}/>
                <Tooltip formatter={v=>sar(v)}/>
                <Line type="monotone" dataKey="net" stroke={P.jade} strokeWidth={2} dot={{r:3}}/>
              </LineChart>
            </ResponsiveContainer>
          </div>
        ):<p style={{fontSize:13,color:P.neuSub}}>No snapshots yet — this month will save automatically once you add a bank, investment, or asset.</p>}
        <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:10,marginTop:12}}>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:P.jade,fontWeight:500}}>

/* ── TARGETS / FORECAST VIEW ──────────────────────────────────────────────
   Trend-based capital forecasting. Unlike Goals (manual-contribution pots),
   a Target's progress is derived live: pick which budget categories count as
   "savings rate" toward it, and it projects your current invested + cash
   balances forward at two separately-editable conservative growth rates. ── */
function TargetsView({targets,addTarget,updateTarget,removeTarget,plans,activePlanId,owners,invSar,banksSar,fmt}){
  const[openId,setOpenId]=useState(null);
  useScrollLock(!!openId);
  const[catPickerId,setCatPickerId]=useState(null);
  useScrollLock(!!catPickerId);

  // only the CURRENT plan per owner — `plans` holds one entry per month
  // (carry-forward history), so looping over all of them would repeat
  // every category once per past month
  const allCats=useMemo(()=>{
    const activeIds=new Set([activePlanId?.me,activePlanId?.wife].filter(Boolean));
    const out=[];
    (plans||[]).filter(p=>activeIds.has(p.id)).forEach(p=>(p.categories||[]).forEach(c=>{
      out.push({id:c.id,name:c.name,owner:p.owner,amount:Number(c.amount)||0});
    }));
    return out;
  },[plans,activePlanId]);

  const open=targets.find(t=>t.id===openId);
  const catPickerTarget=targets.find(t=>t.id===catPickerId);

  // sum a target's tagged categories into invest vs cash monthly flows
  const splitMonthly=t=>{
    const alloc=t.categoryAlloc||{};
    let monthlyInvest=0,monthlyCash=0,count=0;
    allCats.forEach(c=>{
      const dest=alloc[c.id];
      if(dest==="invest"){monthlyInvest+=c.amount;count++;}
      else if(dest==="cash"){monthlyCash+=c.amount;count++;}
    });
    return{monthlyInvest,monthlyCash,count};
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div style={{fontSize:12,color:P.neuSub,marginBottom:14,lineHeight:1.5}}>
        Pick which budget categories count toward each target, and tag each one
        as going into stocks (grows at the invest rate) or cash/time deposit
        (grows at the cash rate). A GoTrade contribution and a Seabank
        contribution compound differently — this keeps them separate.
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10}}>
        {targets.map(t=>{
          const{monthlyInvest,monthlyCash,count}=splitMonthly(t);
          const{hitMonth}=computeTargetForecast(invSar,banksSar,monthlyInvest,monthlyCash,t.investRate,t.cashRate,t.targetAmount);
          const current=invSar+banksSar;
          const pct=t.targetAmount>0?Math.min(100,(current/t.targetAmount)*100):0;
          return(
            <button key={t.id} onClick={()=>setOpenId(t.id)}
              style={{textAlign:"left",padding:14,minHeight:150,...neu(16),
                display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:8,height:8,borderRadius:999,background:t.color||P.jade}}/>
                <span style={{fontSize:13,fontWeight:600,color:P.neuInk}}>{t.name}</span>
              </div>
              <div style={{fontSize:11,color:P.neuSub}}>Target</div>
              <div className="tnum" style={{fontSize:15,fontWeight:700,color:P.neuInk}}>{fmt(t.targetAmount)}</div>
              <div style={{...neuInset(999),height:8,overflow:"hidden",marginTop:2}}>
                <div className="liquid-fill" style={{height:"100%",width:`${pct}%`,background:liquidFillBg(t.color||P.jade)}}/>
              </div>
              <div style={{fontSize:11,color:P.neuSub,marginTop:"auto"}}>
                {count===0?"No categories selected"
                  :hitMonth===null?"30+ yrs at current pace"
                  :hitMonth===0?"Target already reached"
                  :`~${hitMonth} mo (${(hitMonth/12).toFixed(1)} yrs) to go`}
              </div>
            </button>
          );
