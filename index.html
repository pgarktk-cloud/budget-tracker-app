       period open-ended and required two interactions on two different days,
       when saying "it started on the 4th" after the fact says the same thing in
       one. Dropping a pending key restores that period's nominal boundary —
       exactly what it reverted to once the salary landed anyway. The same sweep
       drops any other non-date value, which is what lets periodActualStart and
       periodRange treat every stored value as a real date. */
    Object.keys(as).forEach(k=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(as[k])))delete as[k];
    });
  });
  if(!d.quickTransferLast)d.quickTransferLast={};
  if(!d.netWorthAutoHistory)d.netWorthAutoHistory=[];
  if(!d.targets)d.targets=[];
  if(!d.investTarget)d.investTarget={};
  // migrate old single shared shape {thresholdPct,groupNames} to per-owner {me:{...},wife:{...}}
  if(d.investTarget.thresholdPct!==undefined||d.investTarget.groupNames!==undefined){
    d.investTarget={me:{thresholdPct:d.investTarget.thresholdPct||20,groupNames:d.investTarget.groupNames||[]},wife:{thresholdPct:20,groupNames:[]}};
  }
  if(!d.investTarget.me)d.investTarget.me={thresholdPct:20,groupNames:[]};
  if(!d.investTarget.wife)d.investTarget.wife={thresholdPct:20,groupNames:[]};
  (d.targets||[]).forEach(t=>{
    if(!t.categoryAlloc){
      // migrate old flat categoryIds (everything treated as "cash") into the
      // new destination-tagged map so nothing silently resets
      t.categoryAlloc={};
      (t.categoryIds||[]).forEach(id=>{t.categoryAlloc[id]="cash";});
    }
    delete t.categoryIds;
    if(t.investRate===undefined)t.investRate=4;   // conservative default, user-editable
    if(t.cashRate===undefined)t.cashRate=1;        // conservative default, user-editable
    if(!t.currency)t.currency="SAR";
    if(!t.color)t.color=P.gr;
    if(!t.updatedAt)t.updatedAt="2000-01-01T00:00:00.000Z";
  });
  // per-device edit clock used purely for cross-device merge tiebreaking on
  // settings that aren't record arrays (currency, projection, owners names,
  // payPeriods, investTarget, activePlanId, quickTransferLast, household
  // split %). Never shown in UI, never a source of truth for anything else.
  if(!d.dataUpdatedAt)d.dataUpdatedAt="2000-01-01T00:00:00.000Z";
  /* Per-setting merge stamps. Deliberately left EMPTY for existing data rather
     than back-filled from dataUpdatedAt: mergeSettingPaths falls back to the
     document stamp for any unstamped path, so an empty map reproduces exactly
     the old whole-document behaviour until someone actually edits a setting.
     Back-filling would instead assert that every setting was edited at the
     same instant, which is a claim this data can't support. */
  if(!d.fieldUpdatedAt||typeof d.fieldUpdatedAt!=="object")d.fieldUpdatedAt={};
  // Household Bills — household.expenses gets a new opt-in flag, and three
  // new top-level collections back the Bills module (see defaultData()).
  if(!d.household)d.household={splitMine:50,expenses:[]};
  if(!Array.isArray(d.household.expenses))d.household.expenses=[];
  d.household.expenses.forEach(e=>{
    if(e.trackInBills===undefined)e.trackInBills=false;
    if(!e.updatedAt)e.updatedAt="2000-01-01T00:00:00.000Z";
  });
  if(!d.bills)d.bills=[];
  d.bills.forEach(b=>{
    if(!b.status)b.status="unpaid";
    if(b.paid===undefined)b.paid=0;
    if(b.paymentDate===undefined)b.paymentDate=null;
    if(!b.updatedAt)b.updatedAt="2000-01-01T00:00:00.000Z";
  });
  if(!d.billAdjustments)d.billAdjustments=[];
  d.billAdjustments.forEach(a=>{if(!a.updatedAt)a.updatedAt="2000-01-01T00:00:00.000Z";});
  if(!d.billsSettings)d.billsSettings={openingReserve:0};
  if(d.billsSettings.openingReserve===undefined)d.billsSettings.openingReserve=0;

  /* Category/group display order becomes a FIELD (2026-08-05). It used to be
     array position, which `mergeArrayById` erases by sorting on id — the same
     lesson transactions learned. Backfilled from the current array order, so
     what everyone is looking at right now is preserved exactly.

     This DOES change fingerprint() for every existing document, costing one
     Cloudflare KV write per device on first open. That is a deliberate one-off,
     and a different thing from the per-app-open write the userFingerprint split
     exists to prevent. It is also deterministic — every device derives the same
     ords from the same array — so two devices converge instead of conflicting.
     `updatedAt` is deliberately NOT backfilled: absent means "never edited on
     any device", which is exactly what a merge should treat as oldest. */
  (d.plans||[]).forEach(p=>{
    (p.categories||[]).forEach((c,i)=>{if(c&&c.ord==null)c.ord=i;});
    (p.groups||[]).forEach((g,i)=>{if(g&&g.ord==null)g.ord=i;});
  });

  /* Installments. For a document written before this feature both arrays are
     simply created empty — and fingerprint() omits them while empty, so an
     existing user's document is byte-identical after the upgrade and doesn't
     fire a cloud write just for opening the app. */
  if(!Array.isArray(d.installments))d.installments=[];
  d.installments.forEach(x=>{
    if(!x.owner||(x.owner!=="me"&&x.owner!=="wife"))x.owner="me";   // never "household"
    if(!x.status)x.status="active";
    if(!x.provider)x.provider="other";
    if(!x.currency)x.currency=d.currency||"SAR";
    if(x.includeInBudget===undefined)x.includeInBudget=true;
    if(x.name===undefined)x.name="";
    if(x.notes===undefined)x.notes="";
    if(!x.createdAt)x.createdAt=x.updatedAt||"2000-01-01T00:00:00.000Z";
    if(!x.updatedAt)x.updatedAt="2000-01-01T00:00:00.000Z";
  });
  if(!Array.isArray(d.installmentPayments))d.installmentPayments=[];
  /* Pinned transaction shortcuts (v1.26.0). Nothing to backfill — the
     collection is new, so every existing document gets an empty array and
     fingerprint() omits it while empty, keeping the upgrade byte-identical.
     `ord` is NOT invented here for the same reason it isn't for expenses:
     absent means "unplaced", and creation order is what `createdAt` records. */
  /* The four oldest record collections were never defaulted here, because
     defaultData() has always produced them and no upgrade path could arrive
     without them. Adopting a cloud document exposed the gap (2026-08-07): a
     document missing them stays missing them through migrate(), the app then
     materialises them as [] a moment later, and the freshly-adopted document
     no longer matches the baseline just recorded for it — so a device that had
     "adopted the cloud exactly, without issuing a POST" pushed a normalised
     copy straight back. Defaulting them here makes adoption exact.

     Byte-identical for any real document, which already has all four; only a
     hand-written or partial one changes, and that one was already going to be
     rewritten on the next save. */
  if(!Array.isArray(d.goals))d.goals=[];
  if(!Array.isArray(d.investments))d.investments=[];
  if(!Array.isArray(d.banks))d.banks=[];
  if(!Array.isArray(d.assets))d.assets=[];
  if(!Array.isArray(d.txTemplates))d.txTemplates=[];
  d.txTemplates.forEach(t=>{
    if(!t.owner)t.owner="me";
    if(t.note===undefined)t.note="";
    if(!t.createdAt)t.createdAt=t.updatedAt||"2000-01-01T00:00:00.000Z";
    if(!t.updatedAt)t.updatedAt="2000-01-01T00:00:00.000Z";
  });
  /* `sequence` is backfilled by due date within a plan, but actualAmount and
     paidDate are deliberately NOT defaulted — their absence means "not paid",
     the same way an expense's absent `ord` means "unplaced". */
  const instSeq={};
  [...d.installmentPayments]
    .sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")))
    .forEach(p=>{
      instSeq[p.installmentId]=(instSeq[p.installmentId]||0)+1;
      if(p.sequence==null)p.sequence=instSeq[p.installmentId];
    });
  d.installmentPayments.forEach(p=>{
    const owner=(d.installments||[]).find(x=>x.id===p.installmentId);
    if(!p.owner||(p.owner!=="me"&&p.owner!=="wife"))p.owner=(owner&&owner.owner)||"me";
    if(!p.status)p.status="upcoming";
    if(p.scheduledAmount==null)p.scheduledAmount=0;
    if(!p.createdAt)p.createdAt=p.updatedAt||"2000-01-01T00:00:00.000Z";
    if(!p.updatedAt)p.updatedAt="2000-01-01T00:00:00.000Z";
  });
  return d;
}

/* ── Backup validation ──────────────────────────────────────────────────────
   Import replaces the entire dataset, so the file has to be checked BEFORE
   migrate() ever sees it. migrate() is a defaulter, not a validator: it fills
   in keys it enumerates and leaves everything else exactly as found, so a
   plausible-looking file full of the wrong shapes survives it intact and
   silently becomes the live document.

   Split deliberately into errors and warnings:
     • errors   — the file is not this app's data, or a collection is a shape
                  the app would crash or silently misread. Refuse.
     • warnings — legitimately older or hand-edited, but recoverable. An
                  absent collection is the normal case for an old backup and
                  migrate() will default it; say so rather than refusing.

   Pure and module-scope so importtest.cjs can slice it out and run it against
   real files without a browser. Never mutates its argument. */
const BACKUP_ARRAY_KEYS=["plans","expenses","goals","investments","banks","assets",
  "targets","mp2DividendRates","monthlyPlans","bills","billAdjustments",
  "installments","installmentPayments","txTemplates","history","portHistory","snapshots"];
/* Collections whose absence is normal in an older backup (the feature that
   introduced them post-dates it). `plans` is not here — it is required.

   Both lists matter for `cloudDocProblem`, which reuses this function for every
   document arriving from the cloud: being in ARRAY_KEYS means "if present it
   must be a list" (an error), and being in OPTIONAL_KEYS means "absent is
   fine" (a warning, which cloudDocProblem drops). A new collection must be in
   BOTH or the other phone gets locked out the moment it upgrades. */
const BACKUP_OPTIONAL_KEYS=["installments","installmentPayments","txTemplates",
  "billAdjustments","bills","targets","mp2DividendRates","snapshots","monthlyPlans"];

function validateBackup(obj){
  const errors=[],warnings=[];
  const fail=m=>{errors.push(m);return{ok:false,errors,warnings,summary:null};};

  if(obj===null||typeof obj!=="object"||Array.isArray(obj))
    return fail("This file doesn't contain a backup object.");
  if(!Array.isArray(obj.plans))
    return fail("No budget plans found — this doesn't look like a WheredItGo backup.");

  // Any known collection that is present must actually be an array.
  BACKUP_ARRAY_KEYS.forEach(k=>{
    if(obj[k]!==undefined&&!Array.isArray(obj[k]))errors.push(`"${k}" should be a list, but it isn't.`);
  });
  if(obj.owners!==undefined&&(obj.owners===null||typeof obj.owners!=="object"||Array.isArray(obj.owners)))
    errors.push(`"owners" should be a pair of names, but it isn't.`);
  if(obj.currency!==undefined&&typeof obj.currency!=="string")
    errors.push(`"currency" should be a currency code.`);
  if(obj.household!==undefined&&(obj.household===null||typeof obj.household!=="object"||Array.isArray(obj.household)))
    errors.push(`"household" should be an object, but it isn't.`);
  else if(obj.household&&obj.household.expenses!==undefined&&!Array.isArray(obj.household.expenses))
    errors.push(`"household.expenses" should be a list, but it isn't.`);
  if(errors.length)return{ok:false,errors,warnings,summary:null};

  // Plans: a plan without an id can't be referenced by monthlyPlans, and one
  // without categories/groups renders as an empty budget rather than failing
  // loudly — both are corruption, not an old shape.
  obj.plans.forEach((p,i)=>{
    const where=`Plan ${i+1}${p&&p.name?` ("${p.name}")`:""}`;
    if(p===null||typeof p!=="object"||Array.isArray(p)){errors.push(`${where} isn't a plan.`);return;}
    if(!p.id)errors.push(`${where} has no id.`);
    if(!Array.isArray(p.categories))errors.push(`${where} has no category list.`);
    if(!Array.isArray(p.groups))errors.push(`${where} has no group list.`);
    if(Array.isArray(p.categories))p.categories.forEach((c,j)=>{
      if(c===null||typeof c!=="object")errors.push(`${where}, category ${j+1} isn't a category.`);
      else if(!c.id)errors.push(`${where}, category ${j+1} has no id.`);
      else if(c.subs!==undefined&&!Array.isArray(c.subs))errors.push(`${where}, category "${c.name||c.id}" has a broken sub-item list.`);
    });
  });

  // Expenses are the ledger — an unusable row here is money that can't be
  // placed in a period or an envelope.
  const nums=v=>v!==null&&v!==undefined&&v!==""&&isFinite(Number(v));
  const checkTx=(arr,label)=>(arr||[]).forEach((e,i)=>{
    if(e===null||typeof e!=="object"||Array.isArray(e)){errors.push(`${label} ${i+1} isn't a transaction.`);return;}
    if(!e.id)errors.push(`${label} ${i+1} has no id.`);
    if(!nums(e.amount))errors.push(`${label} ${i+1}${e.name?` ("${e.name}")`:""} has no usable amount.`);
    if(e.date!==undefined&&e.date!==null&&typeof e.date!=="string")errors.push(`${label} ${i+1} has a broken date.`);
  });
  checkTx(obj.expenses,"Transaction");
  checkTx(obj.household&&obj.household.expenses,"Household expense");

  if(errors.length)return{ok:false,errors,warnings,summary:null};

  BACKUP_OPTIONAL_KEYS.forEach(k=>{
    if(obj[k]===undefined)warnings.push(`No "${k}" — an older backup. It'll start empty.`);
  });
  const savedAt=typeof obj.dataUpdatedAt==="string"?obj.dataUpdatedAt:null;
  if(savedAt&&Date.parse(savedAt)>Date.now()+86400000)
    warnings.push("This backup is dated in the future — check it's the file you meant.");

  const live=a=>(Array.isArray(a)?a:[]).filter(x=>x&&!x.deletedAt).length;
  const dead=a=>(Array.isArray(a)?a:[]).filter(x=>x&&x.deletedAt).length;
  const summary={
    savedAt,
    currency:typeof obj.currency==="string"?obj.currency:null,
    owners:obj.owners&&typeof obj.owners==="object"?{me:obj.owners.me||null,wife:obj.owners.wife||null}:null,
    counts:{
      transactions:live(obj.expenses),
      plans:live(obj.plans),
      monthlyPlans:live(obj.monthlyPlans),
      goals:live(obj.goals),
      investments:live(obj.investments),
      banks:live(obj.banks),
      assets:live(obj.assets),
      installments:live(obj.installments),
      householdExpenses:live(obj.household&&obj.household.expenses),
    },
    deleted:dead(obj.expenses)+dead(obj.goals)+dead(obj.investments)+dead(obj.banks)
      +dead(obj.assets)+dead(obj.plans)+dead(obj.installments),
  };
  return{ok:true,errors,warnings,summary};
}

/* ── Gate for a document arriving from the CLOUD ──────────────────────────────
   A torn, truncated or half-written document is the same corruption whichever
   way it reaches us, but until now only the *file picker* checked: every pull
   path trusted `Array.isArray(remote.plans)` and handed the rest straight to
   migrate(). That is the one-line check the import path itself outgrew.

   Reuses validateBackup rather than growing a second set of rules, with one
   deliberate difference: **warnings are dropped.** They read "No installments —
   an older backup. It'll start empty", which is normal and uninteresting for a
   phone that simply hasn't used a feature yet. Only `errors` mean "do not adopt
   this document".

   Returns null when the document is usable, otherwise a short reason string fit
   to show on a phone. That wording matters: v1.22.1 cost a whole session
   because a sync failure said only "Sync failed" (see current-status.md), so a
   rejection here names the first real problem and how many others there were.

   A nullish document is NOT a problem — "the account is legitimately empty" is
   a state the callers already handle separately from "the account is broken". */
function cloudDocProblem(raw){
  if(raw===null||raw===undefined)return null;
  if(typeof raw!=="object"||Array.isArray(raw))return "Cloud copy rejected: not a data object";
  let report;
  try{report=validateBackup(raw);}
  catch(e){return "Cloud copy rejected: could not be read";}
  if(report.ok)return null;
  const n=report.errors.length;
  const first=report.errors[0]||"unrecognised shape";
  return `Cloud copy rejected (${n} problem${n===1?"":"s"}): ${first}`;
}

/* Bills Reserve = opening baseline + every month's (allocated-paid) +
   every manual adjustment's delta. Pure function of `data` so it can be
   called both from render and from inside a setData(d=>...) updater
   (which only ever sees the latest `d`, never a stale render closure). */
function computeBillsReserve(d){
  const opening=Number((d.billsSettings||{}).openingReserve)||0;
  const diffSum=(d.bills||[]).filter(b=>!b.deletedAt)
    .reduce((s,b)=>s+((Number(b.allocated)||0)-(Number(b.paid)||0)),0);
  const adjSum=(d.billAdjustments||[]).filter(a=>!a.deletedAt)
    .reduce((s,a)=>s+(Number(a.amount)||0),0);
  return opening+diffSum+adjSum;
}
const billMonthKeyOf=n=>{const dt=n?new Date(n):new Date();return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;};

/* ── Sync passphrase — per device, never shipped in this file ────────────────
   This page is served publicly from GitHub Pages out of a public repo, so it
   cannot contain a secret: the token used to be a literal here, which meant
   anyone who viewed source could read and overwrite the whole dataset. The
   passphrase now lives ONLY in this device's localStorage, typed once in
   Settings → Cloudflare KV Sync, and is checked against the SYNC_TOKEN secret
   held by the Worker (see worker.js).

   Deliberately kept out of `data`, exactly like VIEW_PROFILE_KEY below: it is
   a per-device credential, so putting it in `data` would upload it to the
   cloud, dirty the doc, and dump it into every manual JSON backup. It must
   never appear in defaultData(), migrate(), or either fingerprint.
   ─────────────────────────────────────────────────────────────────────────── */
const SYNC_TOKEN_KEY="allocation:syncToken";
let _syncToken; // undefined = not read yet, "" = genuinely unset
function getSyncToken(){
  if(_syncToken===undefined){try{_syncToken=localStorage.getItem(SYNC_TOKEN_KEY)||"";}catch(e){_syncToken="";}}
  return _syncToken;
}
function setSyncToken(v){
  _syncToken=(v||"").trim();
  try{_syncToken?localStorage.setItem(SYNC_TOKEN_KEY,_syncToken):localStorage.removeItem(SYNC_TOKEN_KEY);}catch(e){}
}

/* ── Cloudflare KV Sync ──────────────────────────────────────────────────────
   No login ever required. The Worker URL is set above as PROXY_URL; the
   passphrase comes from getSyncToken() above.
   ─────────────────────────────────────────────────────────────────────────── */
const KVSync={
  lastPulledAt:null,
  lastKnownRev:0, // best-known cloud revision, updated by every successful load/save/meta check
  /* HTTP status of the most recent call, so callers can tell "network down"
     (null) apart from "passphrase rejected" (401) — otherwise a rotated
     passphrase is indistinguishable from an ordinary sync failure. */
  lastStatus:null,
  _ready(){return !PROXY_URL.startsWith("PASTE_")&&!!getSyncToken();},
  _headers(){return{"Content-Type":"application/json","X-Sync-Token":getSyncToken(),"X-Device-Id":deviceTag()};},
  /* Full download. Returns {data, savedAt, rev} | null (null only on
     network/parse failure — a genuinely-empty account still resolves with
     data:null, rev:0, which callers distinguish from a failed fetch). */
  async load(){
    if(!this._ready())return null;
    this.lastStatus=null;
    const r=await fetch(`${PROXY_URL}/sync`,{headers:this._headers()});
    this.lastStatus=r.status;
    if(!r.ok)return null;
    const j=await r.json();
    if(j.savedAt)this.lastPulledAt=j.savedAt;
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
  /* Cheap metadata-only GET — no dataset transfer. Returns {savedAt, rev} |
     null. This is what the "app became active" check uses. */
  async checkMeta(){
    if(!this._ready())return null;
    this.lastStatus=null;
    const r=await fetch(`${PROXY_URL}/sync/meta`,{headers:this._headers()});
    this.lastStatus=r.status;
    if(!r.ok)return null;
    const j=await r.json();
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
  /* baseRev = the cloud revision this save is built on top of (i.e. the
     device's current localRev). Server rejects with {conflict:true} and
     hands back its current data+rev if baseRev is stale, instead of
     silently overwriting a change this device never saw. */
  async save(data,baseRev){
    if(!this._ready())return{ok:false,reason:"not configured"};
    const body=JSON.stringify({data,savedAt:new Date().toISOString(),rev:baseRev||0});
    this.lastStatus=null;
    const r=await fetch(`${PROXY_URL}/sync`,{method:"POST",headers:this._headers(),body});
    this.lastStatus=r.status;
    if(!r.ok)return{ok:false,reason:r.status===401?"Passphrase rejected":`HTTP ${r.status}`};
    const j=await r.json();
    if(j.savedAt)this.lastPulledAt=j.savedAt;
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
};

/* ── Local-first sync metadata ──────────────────────────────────────────────
   Local-only bookkeeping about the sync state itself (never sent to the
   cloud, never mixed into the financial dataset). Kept in its own
   localStorage key so closing/reopening the app doesn't lose track of
   whether this device has unsaved work. ─────────────────────────────────── */
const SYNC_META_KEY="salaryPlanner:v3:syncMeta";
const LAST_SYNCED_DATA_KEY="salaryPlanner:v3:lastSyncedData";
/* _syncedSnapObj memoizes the parsed copy so the dirty check (which runs on a
   450ms debounce after every data change) doesn't re-JSON.parse the entire
   dataset each time. `undefined` means "not hydrated yet", `null` means
   "genuinely nothing cached" — they're different states, so don't collapse
   them. cacheSyncedSnapshot is the only writer of the localStorage key, so
   the memo can't go stale behind our back. */
let _syncedSnapObj=undefined;
const cacheSyncedSnapshot=d=>{try{localStorage.setItem(LAST_SYNCED_DATA_KEY,JSON.stringify(d));_syncedSnapObj=d;}catch(e){}};
const loadSyncedSnapshot=()=>{try{const raw=localStorage.getItem(LAST_SYNCED_DATA_KEY);if(raw)return JSON.parse(raw);}catch(e){}return null;};
const syncedSnapshotObj=()=>{if(_syncedSnapObj===undefined)_syncedSnapObj=loadSyncedSnapshot();return _syncedSnapObj;};
/* ── Local safety copies ────────────────────────────────────────────────────
   Two rotating slots, newest first, written before anything that replaces the
   whole document (import, "Use Cloud", a merge on pull). Two rather than one
   because the single slot had a sharp edge: a second replacement destroyed the
   copy you were about to go back to, which is exactly the moment people repeat
   an action hoping for a different result.

   Storage reality check — this device already holds the live document
   (STORAGE_KEY) and the last-synced baseline (LAST_SYNCED_DATA_KEY). Two slots
   makes FOUR copies in a ~5MB localStorage, so writePreCloudSlots degrades on
   quota instead of failing: it drops the older slot and retries, and only
   reports failure if even a single slot won't fit. Keeping the newest copy is
   worth more than keeping both. */
const PRE_CLOUD_BACKUP_KEY="salaryPlanner:v3:preCloudRestore";
const PRE_CLOUD_SLOT_LIMIT=2;
function readPreCloudSlots(){
  try{
    const raw=localStorage.getItem(PRE_CLOUD_BACKUP_KEY);
    if(!raw)return[];
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed))return parsed.filter(s=>s&&s.at&&s.data);
    // pre-2026-08-05 single-object shape — adopt it as slot 0 rather than
    // throwing away the one copy an upgrading device might need right now.
    if(parsed&&parsed.at&&parsed.data)return[{at:parsed.at,label:null,data:parsed.data}];
  }catch(e){}
  return[];
}
function writePreCloudSlots(slots){
  for(let keep=Math.min(slots.length,PRE_CLOUD_SLOT_LIMIT);keep>=1;keep--){
    try{
      localStorage.setItem(PRE_CLOUD_BACKUP_KEY,JSON.stringify(slots.slice(0,keep)));
      return slots.slice(0,keep);
    }catch(e){/* quota — try again with fewer slots */}
  }
  return null;
}
/* ── Device identity ────────────────────────────────────────────────────────
   Per-device, never in `data`, never synced — same rule as the view profile and
   the passphrase. It exists only so a conflict can say WHOSE phone saved last
   instead of "the cloud", which is the difference between a decision and a
   guess. The label is editable; the id is what the server echoes back.
   Deliberately not derived from a user agent string: two identical phones would
   be indistinguishable, which is exactly the case that needs telling apart. */
const DEVICE_ID_KEY="allocation:deviceId";
const DEVICE_LABEL_KEY="allocation:deviceLabel";
function getDeviceId(){
  try{
    let v=localStorage.getItem(DEVICE_ID_KEY);
    if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem(DEVICE_ID_KEY,v);}
    return v;
  }catch(e){return "";}
}
function getDeviceLabel(){
  try{return localStorage.getItem(DEVICE_LABEL_KEY)||"";}catch(e){return "";}
}
function setDeviceLabel(v){
  try{
    /* Control characters are stripped at the STORE point because they can
       never be wanted in a label; everything else is kept as typed and
       sanitized at the wire point below. */
    const t=String(v||"").replace(/[\x00-\x1F\x7F]/g,"").trim().slice(0,40);
    if(t)localStorage.setItem(DEVICE_LABEL_KEY,t);else localStorage.removeItem(DEVICE_LABEL_KEY);
  }catch(e){}
}
/* HTTP header values are ByteStrings: any code point above U+00FF makes
   fetch() throw *before a byte leaves the device*, and the app can only report
   that as a generic "Sync failed". iOS and Android smart punctuation silently
   turn a typed apostrophe into U+2019, so naming a phone "Wife's iPhone" broke
   sync on that device outright — shipped in v1.21.0, found on a real phone
   2026-08-05.

   Sanitize where the value is USED, not only where it's set: labels typed
   before this fix are already sitting in localStorage, and fixing the read
   point heals them without anyone having to retype. The stored label keeps its
   real punctuation — this is a wire encoding, not a rename, and Settings
   should still show what the person typed.

   Accents are folded rather than dropped (José → Jose) so a name survives
   recognisably; U+00E9 wouldn't throw, but Latin-1 header bytes decode to
   mojibake at the other end, which is worse than a plain ASCII fold. */
/* Escaped rather than written literally on purpose: these characters are
   invisible or near-identical to their ASCII twins in an editor, and a literal
   combining mark in source is the kind of thing a copy/paste silently mangles. */
const HEADER_PUNCT_MAP={
  "\u2018":"'","\u2019":"'","\u201A":"'","\u201B":"'",   // single quotes
  "\u201C":'"',"\u201D":'"',"\u201E":'"',              // double quotes
  "\u2013":"-","\u2014":"-",                             // en / em dash
  "\u2026":"...","\u00A0":" ",                          // ellipsis, non-breaking space
};
function headerSafe(s){
  return String(s==null?"":s)
    .normalize("NFD").replace(/[\u0300-\u036F]/g,"")                     // fold accents
    .replace(/[\u2018\u2019\u201A\u201B\u201C\u201D\u201E\u2013\u2014\u2026\u00A0]/g,c=>HEADER_PUNCT_MAP[c])
    .replace(/[^\x20-\x7E]/g,"")                                   // emoji, CJK, CR/LF, controls
    .replace(/\s+/g," ")
    .trim();
}
/* What the server should record as the writer: the friendly label if this
   device has one, else the opaque id. Capped to match the Worker's own slice.
   A label that sanitizes away to nothing (all emoji, say) falls back to the
   bare id rather than shipping an empty parenthetical. */
function deviceTag(){
  const l=headerSafe(getDeviceLabel());
  const id=getDeviceId();
  return headerSafe(l?`${l} (${id})`:id).slice(0,64);
}
const PROFILE_KEY="allocation:preferredProfile";
/* which profile the asset tabs are being VIEWED as — me | wife | household.
   Separate from PROFILE_KEY, which is the remembered default *person*. */
const VIEW_PROFILE_KEY="allocation:viewProfile";

/* ── Purchase Advisor draft ───────────────────────────────────────────────
   The thing being considered, so reopening the tab doesn't mean retyping it.

   Per-device localStorage and NOT a field on `data`, for exactly the reasons
   VIEW_PROFILE_KEY and PROVENANCE_KEY are: a half-finished thought is not a
   household record, syncing it would dirty the document (a KV write per
   keystroke-ish) and would change what the other phone is looking at, and a
   new `data` field costs every existing device a migrate()/fingerprint touch
   point on first open.

   INPUTS ONLY — the product, the price, the terms, which levers are pulled.
   Never a computed figure: a stored headroom or verdict would be a snapshot of
   a budget that has since moved, and the whole engine is cheap enough to
   recompute on open. Anything added here must stay on the input side. */
const PURCHASE_DRAFT_KEY="allocation:purchaseDraft";
function loadPurchaseDraft(){
  try{
    const raw=localStorage.getItem(PURCHASE_DRAFT_KEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    return(d&&typeof d==="object"&&!Array.isArray(d))?d:null;
  }catch(e){return null;}
}
function savePurchaseDraft(d){
  try{localStorage.setItem(PURCHASE_DRAFT_KEY,JSON.stringify(d||{}));}catch(e){}
}

/* ── Provenance of THIS device's document ─────────────────────────────────────
   "sample" only while the document is the untouched demo dataset loaded from
   Settings → Load sample data. Anything else — including absent — is "user".

   Deliberately per-device localStorage and NOT a field on `data`, exactly like
   VIEW_PROFILE_KEY above. Three reasons, all load-bearing:
     • Being sample data is a fact about this device's unsynced state, not about
       the document. Sync a `provenance` field and the receiving phone starts
       distrusting its own real records.
     • A new field in `data` needs a migrate() default and a fingerprint touch
       point, and per CLAUDE.md that costs every existing device a KV write on
       first open — for information no other device can use.
     • Absent must mean "user", so a device that has held real data since before
       this build is never mistaken for a demo. Defaulting in `data` would have
       to guess; here the absence itself is the answer.

   The mark is STICKY: it is not cleared by editing. That is deliberate, and it
   was arrived at the hard way. The first attempt anchored the mark to the
   document's fingerprint, so that any edit would stop it matching and end
   sample status by itself — elegant, and wrong: the bills reconciler, the
   daily snapshot effect and the quote refresh all mutate the document within
   seconds of load, so the mark cleared itself before anyone touched anything,
   and the demo dataset auto-pushed exactly as before.

   So the question "has a person edited this?" is not asked at all. The mark
   ends when somebody says so, at one of exactly three points:
     • an explicit Save to Cloud   (they chose to share it)
     • adopting or merging a cloud document (it's been replaced or absorbed)
     • loading sample data or resetting again (replaced by the other kind)
   Anything else keeps it local. A person who builds on the demo data has to
   press Save to Cloud once, which is precisely what the button's own message
   tells them — and the failure mode of being too sticky is a manual tap, while
   the failure mode of being too eager is somebody else's phone filling up with
   fake accounts.

   TWO marks, not one — "sample" and "reset". Both mean "this state was
   manufactured on this device and may not travel on its own", and the push
   guard treats them identically; they are distinguished only so the message
   shown can name what is actually being held back.

   `reset` was added 2026-08-07 after "Reset to empty" was found to be a
   quieter version of the very bug this file exists to prevent. Reset marks the
   document dirty, the idle autosave fires ~8s later, and the emptied device
   uploads itself — so a button that reads as "clean up this device" reached
   the other phone. The blast radius was smaller than it sounds (Reset writes
   no tombstones, so the other device's next merge restores everything and
   pushes it back), but it depended on another device being around to heal it,
   and "your data reappears once you open the other phone" is not a thing
   anybody should have to know. */
const PROVENANCE_KEY="allocation:provenance";
const MANUFACTURED=new Set(["sample","reset"]);
const markSampleData=()=>{try{localStorage.setItem(PROVENANCE_KEY,"sample");}catch(e){}};
const markResetData=()=>{try{localStorage.setItem(PROVENANCE_KEY,"reset");}catch(e){}};
const clearSampleMark=()=>{try{localStorage.removeItem(PROVENANCE_KEY);}catch(e){}};
const getProvenance=()=>{
  try{
    const v=localStorage.getItem(PROVENANCE_KEY);
    return MANUFACTURED.has(v)?v:"user";
  }catch(e){return "user";}
};

/* theme is a per-device UI preference (see PROFILE_KEY / allocation:theme in
   localStorage) that also happens to ride along inside the shared `data`
   object. It must never count toward "is my copy different from the
   cloud's" — two devices with different light/dark preferences would
   otherwise permanently disagree on everything, defeating auto-merge and
   re-triggering the conflict modal on every save. Fingerprints used for
   dirty-checking / conflict-detection strip it out; the actual payload
   sent to the cloud still includes theme as normal. */
const sortedById=arr=>Array.isArray(arr)?[...arr].sort((a,b)=>String((a&&a.id)||"").localeCompare(String((b&&b.id)||""))):arr;
const sortedByKey=(arr,keyOf)=>Array.isArray(arr)?[...arr].sort((a,b)=>String(keyOf(a)||"").localeCompare(String(keyOf(b)||""))):arr;
/* Two devices can hold the exact same set of records added in a different
   order (new items get appended wherever they land locally), so a raw
   JSON.stringify would call that "different" even when nothing actually
   changed. This canonicalizes every collection where order isn't
   meaningful (transactions, goals, investments, etc. — nothing in the UI
   depends on their raw array order, everything gets re-sorted by date at
   render time anyway) before comparing. Deliberately leaves plan-level
   `categories`/`groups` order alone, since reordering those IS a real edit
   a person might make on purpose. */
/* history/snapshots rows written by the two background recompute effects are
   stamped auto:true; rows a person created by hand (NetWorthView's "Capture
   this month" / "Add past entry") are not. That flag is the only thing that
   distinguishes derived data from real data in those two arrays. */
const stripAutoRows=arr=>Array.isArray(arr)?arr.filter(x=>!(x&&x.auto)):arr;
/* `ignoreAuto` additionally drops auto-derived history/snapshot rows. See
   userFingerprint() below for why that mode exists. */
const fingerprint=(d,{ignoreAuto=false}={})=>{
  try{
    // livePrice/livePriceAt/prevClose are excluded the same way theme is:
    // they're refreshed automatically in the background (manual/auto quote+FX
    // refresh) and must never make the doc look "dirty" or trigger a cloud
    // autosave just because a stock price ticked.
    // rates/ratesAt joined them in v1.32.0 and MUST stay here. They are a cache
    // of an external FX feed, not household data, and loadRates() fires from a
    // mount effect on every single app open — so a rates block inside the
    // fingerprint would mark the document dirty seconds after launch and buy a
    // Cloudflare KV write per open, for a number nobody typed. That is exactly
    // the failure the userFingerprint split below exists to prevent, and it is
    // why the rates cache lives in `data` (like livePrice) rather than needing
    // its own storage: the exclusion mechanism already existed.
    // fieldUpdatedAt is excluded for the same reason as dataUpdatedAt: it's
    // bookkeeping about when a setting changed, not the setting itself. The
    // value it stamps is inside `rest`, so a real edit still changes the
    // fingerprint — but two devices agreeing on every setting never look
    // different just because they recorded the change at different instants.
    const{theme,dataUpdatedAt,fieldUpdatedAt,livePrice,livePriceAt,prevClose,rates,ratesAt,...rest}=d||{};
    const hist=ignoreAuto?stripAutoRows(rest.history):rest.history;
    const snaps=ignoreAuto?stripAutoRows(rest.snapshots):rest.snapshots;
    const canon={
      ...rest,
      expenses:sortedById(rest.expenses),
      goals:sortedById((rest.goals||[]).map(g=>({...g,contributions:sortedByKey(g.contributions,c=>`${c.date||""}|${c.id||""}`)}))),
      investments:sortedById((rest.investments||[]).map(iv=>({...iv,
        trades:sortedByKey(iv.trades,t=>`${t.date||""}|${t.id||""}`),
        contributions:sortedByKey(iv.contributions,c=>`${c.date||""}|${c.id||""}`),
        paidDividends:sortedByKey(iv.paidDividends,p=>`${p.date||""}|${p.id||""}`),
      }))),
      banks:sortedById(rest.banks),
      assets:sortedById(rest.assets),
      targets:sortedById(rest.targets),
      mp2DividendRates:sortedById(rest.mp2DividendRates),
      plans:sortedById(rest.plans),
      bills:sortedById(rest.bills),
      billAdjustments:sortedById(rest.billAdjustments),
      /* Emitted only when non-empty. migrate() creates these two arrays on
         every existing document, and JSON.stringify drops an `undefined`
         value — so a user who has never added an installment keeps a
         byte-identical fingerprint and the upgrade doesn't look like a change
         they made, which would otherwise cost one KV write per device. */
      installments:(rest.installments||[]).length?sortedById(rest.installments):undefined,
      installmentPayments:(rest.installmentPayments||[]).length?sortedById(rest.installmentPayments):undefined,
      txTemplates:(rest.txTemplates||[]).length?sortedById(rest.txTemplates):undefined,
      monthlyPlans:sortedByKey(rest.monthlyPlans,m=>`${m.month||""}|${m.owner||""}`),
      portHistory:sortedByKey(rest.portHistory,h=>h.month||""),
      history:sortedByKey(hist,h=>h.month||""),
      snapshots:sortedByKey(snaps,s=>`${s.date||""}|${s.profile||""}`),
      household:rest.household?{...rest.household,expenses:sortedById(rest.household.expenses)}:rest.household,
    };
    return JSON.stringify(canon);
  }catch(e){return "";}
};
/* "Did a *person* change anything?" — as opposed to fingerprint(), which is
   "are the bytes different at all".

   Every app open refreshes stock quotes (>15min stale) and FX rates (>6h).
   fingerprint() already ignores livePrice/prevClose directly, but two effects
   recompute *derived* data from those prices: the current month's `history`
   row and all three per-profile `snapshots` rows. Those ARE in fingerprint(),
   so a one-riyal price tick made the whole document look edited — which set
   hasUnsyncedChanges, which fired the 8s idle autosave, which spent a
   Cloudflare KV write on data nobody touched. Every single app open, plus
   again on every tab focus once the quote window went stale.

   Used ONLY for the pending/dirty flag. fingerprint() stays untouched for
   conflict detection and the sync baseline, because there the raw bytes are
   exactly what matters — auto rows still need to merge across devices, and
   downgrading that comparison would let one device's snapshot history quietly
   replace another's. Auto rows still get uploaded; they just ride along with
   the next real save instead of provoking one. */
const userFingerprint=d=>fingerprint(d,{ignoreAuto:true});

/* union records by id; on overlap, whichever has the newer updatedAt (or
   date, as a fallback for records that don't track updatedAt) wins outright.
   Deletes are tombstones (deletedAt set on the record, filtered out at read
   time), so a delete on one device merges cleanly instead of a stale copy
   on the other device silently resurrecting it. This is the same pattern
   originally used only for expenses, now shared by every collection. */
function mergeArrayById(localArr,remoteArr,tsOf=r=>r.updatedAt||r.date||""){
  const map=new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (remoteArr||[]).forEach(rx=>{
    const lx=map.get(rx.id);
    if(!lx){map.set(rx.id,rx);return;}
    map.set(rx.id,tsOf(rx)>tsOf(lx)?rx:lx);
  });
  // sorted by id so the array order itself is deterministic — otherwise
  // Map-insertion order (local's order, then remote-only additions tacked
  // on) drifts a little differently every time this runs, and a plain
  // JSON.stringify-based fingerprint would mistake that drift for a real
  // change even when the actual record set is identical.
  return Array.from(map.values()).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
}
/* Same idea, but for parent records that own a nested child array (goals→
   contributions, investments→trades). The parent's own scalar fields still
   go to whichever side is newer, but the child array is separately unioned
   so e.g. two different contributions added on two different devices to
   the same goal both survive, even though only one device's edit to the
   goal record itself "won". */
function mergeArrayByIdWithChild(localArr,remoteArr,childKey,childTsOf){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const ids=Array.from(new Set([...lm.keys(),...rm.keys()])).sort((a,b)=>String(a).localeCompare(String(b)));
  return ids.map(id=>{
    const l=lm.get(id),r=rm.get(id);
    if(l&&r){
      const winner=(r.updatedAt||"")>(l.updatedAt||"")?r:l;
      return{...winner,[childKey]:mergeArrayById(l[childKey]||[],r[childKey]||[],childTsOf)};
    }
    return l||r;
  });
}
/* Same idea as mergeArrayByIdWithChild but for records that can carry more
   than one nested child array — investments now have "trades" (stocks),
   "contributions" (MP2) and "paidDividends" (MP2 payout receipts), never
   more than one populated per record depending on `type`, but the merge
   can't assume which. Only merges a childSpec's key when at least one side
   actually has that array, so plain scalar fields on stocks (no
   contributions) or MP2 (no trades) aren't given an empty array they never
   had. */
function mergeArrayByIdWithChildren(localArr,remoteArr,childSpecs){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const ids=Array.from(new Set([...lm.keys(),...rm.keys()])).sort((a,b)=>String(a).localeCompare(String(b)));
  return ids.map(id=>{
    const l=lm.get(id),r=rm.get(id);
    if(l&&r){
      const winner=(r.updatedAt||"")>(l.updatedAt||"")?r:l;
      const merged={...winner};
      childSpecs.forEach(({key,tsOf})=>{
        if(l[key]||r[key])merged[key]=mergeArrayById(l[key]||[],r[key]||[],tsOf);
      });
      return merged;
    }
    return l||r;
  });
}
/* Records with no id, keyed some other way (monthlyPlans by month+owner,
   portHistory/history by month). No independent per-record timestamp, so a
   genuine same-key conflict falls back to whichever whole dataset was
   edited more recently overall. Sorted by key for the same determinism
   reason as mergeArrayById above. */
function mergeKeyed(localArr,remoteArr,keyOf,preferLocal){
  const map=new Map();
  (preferLocal?(remoteArr||[]):(localArr||[])).forEach(x=>map.set(keyOf(x),x));
  (preferLocal?(localArr||[]):(remoteArr||[])).forEach(x=>map.set(keyOf(x),x));
  return Array.from(map.values()).sort((a,b)=>String(keyOf(a)).localeCompare(String(keyOf(b))));
}
/* Same as mergeKeyed, but for keyed records that DO carry their own
   updatedAt — currently monthlyPlans, whose every writer stamps one and which
   nothing ever read. Without this, assigning a plan to September on one phone
   was resolved by which whole document happened to be newer, so an unrelated
   transaction logged on the other phone could silently revert the assignment
   back to carry-forward. Records with no stamp on either side fall back to the
   old whole-document rule, so pre-stamp data behaves exactly as before.
   Note this merges rather than deletes: an unassignment is itself an upsert
   (planId:null + deletedAt), so a removal is a record and travels like one. */
function mergeKeyedByTs(localArr,remoteArr,keyOf,preferLocal){
  const map=new Map();
  (localArr||[]).forEach(x=>map.set(keyOf(x),x));
  (remoteArr||[]).forEach(rx=>{
    const k=keyOf(rx),lx=map.get(k);
    if(!lx){map.set(k,rx);return;}
    const lt=lx.updatedAt||"",rt=rx.updatedAt||"";
    if(lt||rt){map.set(k,rt>lt?rx:lx);return;}
    map.set(k,preferLocal?lx:rx);
  });
  return Array.from(map.values()).sort((a,b)=>String(keyOf(a)).localeCompare(String(keyOf(b))));
}

/* ── Historical snapshots (Phase 3) ────────────────────────────────────────
   data.snapshots: one row per {date:"YYYY-MM-DD", profile:"me"|"wife"|
   "household"} per calendar day, holding both Net Worth and Portfolio
   figures (+ a per-type investment breakdown) so one array feeds both the
   Net Worth and Portfolio range charts — never two parallel snapshot
   systems. Kept entirely separate from the pre-existing `history`/
   `portHistory` (monthly, manual-entry-friendly, MoM-stat-driving) arrays,
   which continue to work exactly as before; this is purely additive so nothing
   that already worked regresses. See docs/decisions.md for why. */
const addDaysStr=(dateStr,n)=>{const d=new Date(dateStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
/* Monday of the ISO week containing dateStr, used as a stable weekly bucket key. */
const isoWeekKey=dateStr=>{
  const d=new Date(dateStr+"T00:00:00Z");
  const dow=(d.getUTCDay()+6)%7; // 0=Mon..6=Sun
  d.setUTCDate(d.getUTCDate()-dow);
  return d.toISOString().slice(0,10);
};
const monthKeyOf=dateStr=>dateStr.slice(0,7);
/* Progressive retention (spec §6): every day for the most recent
   `dailyDays`, then one (the latest) snapshot per ISO week for the next
   `weeklyDays`, then one per calendar month forever beyond that — applied
   per profile so Me/Wife/Household compress independently. Runs on every
   write (arrays are tiny — a handful of profiles × ~400 rows tops) rather
   than as a separate scheduled job, so storage never grows unbounded (spec
   §11) without needing any background task. */
function compressSnapshots(snaps,retention){
  const{dailyDays=35,weeklyDays=365}=retention||{};
  const today=new Date().toISOString().slice(0,10);
  const dailyCutoff=addDaysStr(today,-dailyDays);
  const weeklyCutoff=addDaysStr(today,-(dailyDays+weeklyDays));
  const byProfile=new Map();
  (snaps||[]).forEach(s=>{
    if(!byProfile.has(s.profile))byProfile.set(s.profile,[]);
    byProfile.get(s.profile).push(s);
  });
  let out=[];
  byProfile.forEach(list=>{
    const sorted=[...list].sort((a,b)=>a.date.localeCompare(b.date));
    const daily=sorted.filter(s=>s.date>=dailyCutoff);
    const weekly=sorted.filter(s=>s.date<dailyCutoff&&s.date>=weeklyCutoff);
    const monthly=sorted.filter(s=>s.date<weeklyCutoff);
    const byWeek=new Map();
    weekly.forEach(s=>{const k=isoWeekKey(s.date);const cur=byWeek.get(k);if(!cur||s.date>cur.date)byWeek.set(k,s);});
    const byMonth=new Map();
    monthly.forEach(s=>{const k=monthKeyOf(s.date);const cur=byMonth.get(k);if(!cur||s.date>cur.date)byMonth.set(k,s);});
    out=out.concat(Array.from(byMonth.values()),Array.from(byWeek.values()),daily);
  });
  return out.sort((a,b)=>a.date===b.date?String(a.profile).localeCompare(b.profile):a.date.localeCompare(b.date));
}
/* Buckets a sorted (by date), already-profile-filtered snapshot list to the
   density a given range should render at (spec §7), taking the LAST
   snapshot in each bucket — never averaging/recalculating values, since
   every stored figure is itself already a point-in-time truth. Also caps to
   the range window except for "MAX". Pure + cheap (a handful of ms for
   hundreds of rows) so callers can useMemo it without a perf concern (§8). */
const RANGE_DAYS={"1W":7,"1M":30,"3M":90,"1Y":365,"MAX":Infinity};
function bucketSnapshotsForRange(sorted,range){
  const today=new Date().toISOString().slice(0,10);
  const days=RANGE_DAYS[range]??RANGE_DAYS["1M"];
  const windowed=days===Infinity?sorted:sorted.filter(s=>s.date>=addDaysStr(today,-days));
  let keyOf;
  if(range==="1W"||range==="1M")keyOf=s=>s.date;         // daily
  else if(range==="3M")keyOf=s=>isoWeekKey(s.date);       // weekly (dense enough at 90d without being noisy)
  else if(range==="1Y")keyOf=s=>isoWeekKey(s.date);       // weekly
  else keyOf=s=>monthKeyOf(s.date);                        // MAX: monthly
  const byKey=new Map();
  windowed.forEach(s=>{const k=keyOf(s);const cur=byKey.get(k);if(!cur||s.date>cur.date)byKey.set(k,s);});
  return Array.from(byKey.values()).sort((a,b)=>a.date.localeCompare(b.date));
}

/* ── Per-setting merge stamps ──────────────────────────────────────────────
   Plain settings aren't records, so there's no union to take — it's a
   most-recent-edit-wins call. That used to be decided by ONE stamp for the
   whole document (`dataUpdatedAt`), which made every setting share a fate:
   turning on your wife's pay-period tracking on the laptop was silently
   reverted the moment she logged a transaction on her phone, because her
   document was now "newer" wholesale and its (stale, off) payPeriods rode in
   with it. The two edits never actually conflicted — they touched different
   fields — but the merge couldn't tell.

   So each setting carries its own stamp in `data.fieldUpdatedAt`, keyed by
   path, and merges independently. Paths are split per owner where a setting
   is per-owner (`payPeriods.me` / `payPeriods.wife`), so the two of you can
   change your own settings concurrently without clobbering each other.

   Stamps are written automatically by the setData wrapper, which diffs these
   paths — mutators don't declare what they touched, so a new settings mutator
   can't forget to stamp. Add a path here when you add a synced setting.
   `theme` is deliberately absent: it's a device-local preference. ────────── */
const SETTING_PATHS=[
  "currency","projection","owners","settings","homeDisplay","homeSettings",
  "billsSettings","quickTransferLast","household.splitMine",
  "payPeriods.me","payPeriods.wife",
  "activePlanId.me","activePlanId.wife",
  "investTarget.me","investTarget.wife",
];
function getPath(obj,path){
  return path.split(".").reduce((o,k)=>(o==null?undefined:o[k]),obj);
}
function setPath(obj,path,value){
  const keys=path.split(".");
  const out={...obj};
  let cur=out;
  for(let i=0;i<keys.length-1;i++){
    cur[keys[i]]=(cur[keys[i]]&&typeof cur[keys[i]]==="object")?{...cur[keys[i]]}:{};
    cur=cur[keys[i]];
  }
  cur[keys[keys.length-1]]=value;
  return out;
}
/* Stamp every SETTING_PATH whose value actually changed. Compared by JSON so
   a re-render handing back an equal-but-new object doesn't bump a stamp and
   make this device spuriously "win" a field it never edited. */
function stampSettings(prev,next,now){
  let fieldUpdatedAt=next.fieldUpdatedAt||{};
  let touched=false;
  for(const p of SETTING_PATHS){
    if(JSON.stringify(getPath(prev,p))===JSON.stringify(getPath(next,p)))continue;
    if(!touched){fieldUpdatedAt={...fieldUpdatedAt};touched=true;}
    fieldUpdatedAt[p]=now;
  }
  return touched?{...next,fieldUpdatedAt}:next;
}
/* Resolve one setting path.

   The rule that matters: **an explicit stamp beats an unstamped side, whatever
   the document stamps say.** Falling back to `dataUpdatedAt` for an unstamped
   path was the original bug in miniature — it treats "this device edited
   something, anything" as evidence it edited *this* field, so logging a
   transaction on the phone would out-rank a real settings edit made on the
   laptop. A stamp is evidence of an edit; the absence of one is not evidence
   of anything.

   Only when NEITHER side has a stamp do we fall back to the whole-document
   comparison, which is exactly the old behaviour — so data written before
   fieldUpdatedAt existed merges as it always did.

   The trade-off, worth knowing: while devices are on mixed builds, an old
   stamped value can beat a newer edit made by a device that isn't stamping
   yet. That window closes as soon as every device has this build, and it is
   the better failure — the alternative loses settings edits permanently. */
function mergeSettingPaths(local,remote,out){
  let merged=out;
  const lf=local.fieldUpdatedAt||{}, rf=remote.fieldUpdatedAt||{};
  for(const p of SETTING_PATHS){
    const lStamp=lf[p], rStamp=rf[p];
    let winner;
    if(lStamp&&rStamp)      winner=lStamp>=rStamp?local:remote;   // both edited: newest
    else if(lStamp)         winner=local;                         // only local edited it
    else if(rStamp)         winner=remote;                        // only remote edited it
    else winner=(local.dataUpdatedAt||"")>=(remote.dataUpdatedAt||"")?local:remote;
    const v=getPath(winner,p);
    if(v===undefined)continue;          // never write undefined over a default
    merged=setPath(merged,p,v);
  }
  // keep the newest stamp per key so a third device sees the true history
  const fieldUpdatedAt={...rf};
  for(const k of Object.keys(lf))if(!fieldUpdatedAt[k]||lf[k]>fieldUpdatedAt[k])fieldUpdatedAt[k]=lf[k];
  merged.fieldUpdatedAt=fieldUpdatedAt;
  return merged;
}

/* Full cross-field auto-merge. Every record-bearing collection is merged by
   id (or by month/owner key where there's no id), so additions made on both
   devices always survive together — not just expenses. Plain settings are no
   longer carried wholesale by whichever document is newer; each one merges on
   its own stamp via mergeSettingPaths above. Returns null (falling
   back to the conflict modal) only if something is structurally malformed. */
/* ── Does this document contain anything a PERSON created? ────────────────────
   Records only. Settings — currency, owner names, theme, homeDisplay,
   payPeriods, the plan skeleton's own income — deliberately do not count.

   The distinction drives whether a first connection blocks on a chooser or
   adopts the cloud quietly, and it is chosen to keep false alarms out of the
   scary dialog: losing a currency pick costs one tap to redo, so showing a
   three-way data-loss dialog to someone who only chose SAR before connecting
   would be a worse lie than silently taking the cloud's answer.

   Counts LIVE records only (`!deletedAt`) — a tombstone is not something to
   protect, and an empty document that has only ever had a record deleted from
   it has nothing left to lose. */
const RECORD_COLLECTIONS=["expenses","goals","investments","banks","assets","installments","txTemplates","monthlyPlans","bills","targets"];
function countLocalRecords(d){
  if(!d||typeof d!=="object")return 0;
  const live=a=>(Array.isArray(a)?a:[]).filter(x=>x&&!x.deletedAt).length;
  let n=RECORD_COLLECTIONS.reduce((s,k)=>s+live(d[k]),0);
  n+=live(d.household&&d.household.expenses);
  // Plan CATEGORIES, not plans: structuralDefaults() ships an empty plan per
  // owner so activePlanId resolves, so counting plans would report every
  // fresh device as having user data and block every first connection.
  n+=(Array.isArray(d.plans)?d.plans:[]).reduce((s,p)=>s+live(p&&p.categories),0);
  return n;
}

/* ── "Reset to empty" — clears RECORDS, keeps preferences ─────────────────────
   Emptying the preferences too looks tidier and is wrong twice over. A person
   resetting a device means "clear my data", not "forget my name"; and on the
   next pull the reset device's freshly-stamped defaults BEAT the cloud's real
   settings in mergeSettingPaths, so the data came back while the owner names
   came back as "Me"/"My wife" — observed 2026-08-07. Carrying the preferences
   across means a reset device has nothing to disagree with the cloud about. */
const RESET_KEEPS=["currency","owners","theme","payPeriods","homeDisplay","homeSettings",
  "settings","investTarget","projection","billsSettings","fieldUpdatedAt"];
function resetToEmptyDoc(prev){
  const out=structuralDefaults();
  const p=prev||{};
  RESET_KEEPS.forEach(k=>{if(p[k]!==undefined)out[k]=p[k];});
  // splitMine is a preference living inside `household`, whose expenses are records.
  if(p.household&&p.household.splitMine!==undefined)
    out.household={...out.household,splitMine:p.household.splitMine};
  return out;
}

/* Everything that is a *preference* rather than a record. Compared only to
   decide whether adopting the cloud silently is worth a one-line note — never
   to decide whether to push, so it stays out of both fingerprints. `theme` is
   excluded for the same reason the fingerprints exclude it: it is per-device. */
function settingsSignature(d){
  if(!d||typeof d!=="object")return "";
  return JSON.stringify([d.currency,d.owners,d.payPeriods,d.homeDisplay,d.homeSettings,
    d.settings,d.investTarget,d.projection,d.billsSettings,(d.household||{}).splitMine]);
}

/* ── What should happen when this device meets the cloud document? ────────────
   Pure, module scope, and the single answer for all three paths that used to
   decide this independently (startup reconcile, pullFromCloud, and
   saveToCloud's conflict retry) — which is how they came to disagree.

   The bug this exists to end: a brand-new Safari/PWA origin booted on the
   SAMPLE dataset, and connecting a passphrase ran tryAutoMergeAll(sample,
   cloud). That merge SUCCEEDS — it is id-keyed, and every sample id is novel,
   so nothing collides and every demo record survives into the union — and the
   result was then auto-pushed. Both real phones then adopted the demo data.

   The load-bearing input is `hasBaseline`: whether this device has ever
   successfully reconciled with the cloud (meta.lastCloudSnapshot !== null).
   Merging is only meaningful against a shared ancestor. Without one there is
   no divergence to reconcile — just two unrelated documents — and unioning
   them is not a merge, it is contamination wearing a merge's clothes.

   Returns {action, post, banner}:
     merge   — established device: today's behaviour, unchanged.
     adopt   — take the cloud document exactly. post:false.
     ask     — hold, and let the person decide. post:false.
     onboard — nothing in the cloud yet; this device seeds it. post:true. */
function syncConnectDecision(ctx){
  const c=ctx||{};
  // An established device has a real ancestor, so the normal merge machinery
  // applies and nothing below changes for it. This branch must stay first.
  if(c.hasBaseline)return{action:"merge",post:true,banner:false};
  /* A manufactured document — the demo dataset, or one emptied by Reset — may
     not travel on its own, whichever of the two it is. Both are states this
     device invented rather than received, and neither is something the other
     phone asked for. */
  const manufactured=c.provenance!=="user"&&c.provenance!==undefined;
  // Empty cloud: there is nothing to contaminate and somebody has to write
  // first — but a manufactured document still may not be what seeds a shared
  // one.
  if(!c.remoteExists)return{action:"onboard",post:!manufactured,banner:false};
  // From here: no baseline, and the cloud already holds a real document.
  // A manufactured document has no claim on it whatsoever.
  if(manufactured)return{action:"adopt",post:false,banner:false};
  // Nothing a person made — adopt the cloud exactly. A settings-only
  // difference is worth a dismissible line, never a blocking dialog.
  if(!c.localHasRecords)return{action:"adopt",post:false,banner:!!c.localDiffersInSettings};
  // Genuine local records meeting an established cloud. This is the only
  // case a person has to answer, and it may never resolve itself.
  return{action:"ask",post:false,banner:false};
}

function tryAutoMergeAll(local,remote){
  try{
    const preferLocal=(local.dataUpdatedAt||"")>=(remote.dataUpdatedAt||"");
    const base=preferLocal?local:remote;
    const merged={
      ...base,
      // Device-local preference: a merge must never push the other device's
      // theme onto this one.
      theme:local.theme!==undefined?local.theme:base.theme,
      expenses:mergeArrayById(local.expenses,remote.expenses),
      goals:mergeArrayByIdWithChild(local.goals,remote.goals,"contributions",c=>c.updatedAt||c.date||""),
      investments:mergeArrayByIdWithChildren(local.investments,remote.investments,[
        {key:"trades",tsOf:t=>t.updatedAt||t.date||""},
        {key:"contributions",tsOf:c=>c.updatedAt||c.date||""},
        {key:"paidDividends",tsOf:p=>p.updatedAt||p.date||""},
      ]),
      banks:mergeArrayById(local.banks,remote.banks),
      assets:mergeArrayById(local.assets,remote.assets),
      targets:mergeArrayById(local.targets,remote.targets),
      mp2DividendRates:mergeArrayById(local.mp2DividendRates,remote.mp2DividendRates),
      /* The whole point of build 3C-2. This was mergeArrayById — whole plan
         record, newest updatedAt wins — so one person editing Groceries and
         the other editing Transport in the same month silently lost a side.
         Categories and groups now merge per record, which is only sound
         because they are tombstoned (a delete survives) and ordered by `ord`
         (array order, which this sort would erase, no longer carries meaning). */
      plans:mergeArrayByIdWithChildren(local.plans,remote.plans,[
        {key:"categories",tsOf:c=>c.updatedAt||""},
        {key:"groups",tsOf:g=>g.updatedAt||""},
      ]),
      bills:mergeArrayById(local.bills,remote.bills),
      billAdjustments:mergeArrayById(local.billAdjustments,remote.billAdjustments),
      installments:mergeArrayById(local.installments,remote.installments),
      installmentPayments:mergeArrayById(local.installmentPayments,remote.installmentPayments),
      txTemplates:mergeArrayById(local.txTemplates,remote.txTemplates),
      monthlyPlans:mergeKeyedByTs(local.monthlyPlans,remote.monthlyPlans,m=>`${m.month}|${m.owner}`,preferLocal),
      portHistory:mergeKeyed(local.portHistory,remote.portHistory,h=>h.month,preferLocal),
      history:mergeKeyed(local.history,remote.history,h=>h.month,preferLocal),
      snapshots:mergeKeyed(local.snapshots,remote.snapshots,s=>`${s.date}|${s.profile}`,preferLocal),
      household:{
        ...(base.household||{splitMine:50,expenses:[]}),
        /* Was tsOf=()=>"", which made every id collision a local win — so a
           household expense edited on the other device could never arrive, and
           a delete there was silently undone by a stale local copy. These rows
           carry updatedAt like every other collection; use it. */
        expenses:mergeArrayById((local.household||{}).expenses,(remote.household||{}).expenses),
      },
    };
    // Settings resolve per field, AFTER the record merges above — household
    // is spread there, so household.splitMine has to be applied on top.
    return mergeSettingPaths(local,remote,merged);
  }catch(e){return null;}
}

/* Reports what's different between local and remote for one id-keyed
   collection, without merging anything — used purely to show the person
   what a given conflict-modal choice would win/lose. Tombstoned records
   (deletedAt set) are left out of "only on X" so a delete on one side
   doesn't show up looking like a brand-new item on the other. */
function diffCollection(localArr,remoteArr){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const onlyLocal=[],onlyRemote=[],changed=[];
  lm.forEach((lx,id)=>{if(!rm.has(id)&&!lx.deletedAt)onlyLocal.push(lx);});
  rm.forEach((rx,id)=>{
    if(!lm.has(id)){if(!rx.deletedAt)onlyRemote.push(rx);return;}
    const lx=lm.get(id);
    if(!lx.deletedAt&&!rx.deletedAt&&JSON.stringify(lx)!==JSON.stringify(rx))changed.push({local:lx,remote:rx});
  });
  return{onlyLocal,onlyRemote,changed};
}
/* Collections worth summarizing in the conflict modal, with a short label
   function for each record so the person can recognize it at a glance. */
const CONFLICT_COLLECTIONS=[
  {key:"expenses",label:"Transactions",nameOf:e=>`${e.name||"Transaction"}${e.amount!=null?` — ${Number(e.amount).toLocaleString()}`:""}${e.date?` (${e.date})`:""}`},
  {key:"goals",label:"Goals",nameOf:g=>g.name||"Goal"},
  {key:"investments",label:"Investments",nameOf:i=>i.ticker||i.name||"Investment"},
  {key:"banks",label:"Bank accounts",nameOf:b=>`${b.name||"Account"}${b.bank?` — ${b.bank}`:""}`},
  {key:"assets",label:"Assets & liabilities",nameOf:a=>a.name||"Asset"},
  {key:"targets",label:"Targets",nameOf:t=>t.name||"Target"},
  {key:"mp2DividendRates",label:"MP2 declared rates",nameOf:r=>`${r.year||""} — ${r.rate!=null?`${r.rate}%`:""}`},
  {key:"plans",label:"Plans",nameOf:p=>`${p.name||"Plan"}${p.month?` (${p.month})`:""}`},
  {key:"bills",label:"Bills",nameOf:b=>`${b.itemName||"Bill"}${b.monthKey?` (${b.monthKey})`:""}`},
  {key:"billAdjustments",label:"Bills Reserve adjustments",nameOf:a=>`${a.amount>=0?"+":""}${a.amount||0}${a.date?` (${a.date})`:""}`},
  {key:"installments",label:"Installments",nameOf:i=>`${i.name||"Installment"}${i.provider?` — ${installmentProviderLabel(i)}`:""}${i.originalAmount!=null?` (${Number(i.originalAmount).toLocaleString()})`:""}`},
  {key:"installmentPayments",label:"Installment payments",nameOf:p=>`#${p.sequence||"?"}${p.dueDate?` due ${p.dueDate}`:""}${p.scheduledAmount!=null?` — ${Number(p.scheduledAmount).toLocaleString()}`:""}`},
  {key:"txTemplates",label:"Transaction shortcuts",nameOf:t=>`${t.name||"Shortcut"}${t.amount!=null?` — ${Number(t.amount).toLocaleString()}`:""}`},
  /* household.expenses is NESTED, hence `get`. It is id-keyed and soft-deleted
     exactly like every other collection here and was simply never added — so
     it merged, and counted toward the pending badge via a hand-written special
     case, while being invisible in the conflict modal and in Recently Deleted.
     `get` exists only for this entry; everything else reads d[key]. */
  {key:"household.expenses",label:"Household expenses",
   get:d=>((d||{}).household||{}).expenses,
   nameOf:e=>`${e.name||"Expense"}${e.amount!=null?` — ${Number(e.amount).toLocaleString()}`:""}`},
];
/* Reads a conflict collection off a document, honouring a nested `get`. */
const conflictArr=(c,d)=>(c.get?c.get(d):((d||{})[c.key]))||[];
/* Collections that belong in CONFLICT_COLLECTIONS (they merge, they're counted
   as pending, and a conflict should describe them) but NOT in Recently
   Deleted. An installment payment tombstone is a side effect of deleting the
   plan it belongs to — restoring the plan brings its schedule back — so
   listing a dozen of them per plan would bury the entries a person actually
   deleted on purpose. */
const HIDE_FROM_RECENTLY_DELETED=new Set(["installmentPayments"]);
/* How many actual records differ between the local doc and the last state we
   know the cloud has. This is what the "Save to Cloud (n)" badge shows.

   It used to show `changesSinceSave`, a counter incremented once per firing of
   the debounced dirty-check effect — so it measured "how many times did a
   write land", not "how much is pending". Two background effects (the history
   recompute and the snapshot recompute) fire ~300ms apart on app open, which
   is exactly why it so often read (1) or (2) while the Pending Changes modal
   found nothing to list.

   Covers CONFLICT_COLLECTIONS plus household.expenses (soft-deleted, id-keyed,
   and genuinely user-edited — it was simply never in that list). Deliberately
   excludes history/snapshots: those are derived, and per userFingerprint()
   they no longer mark the doc dirty on their own. `derived` reports them
   separately so the modal can explain them rather than pretend they're
   nothing. */
function countPendingChanges(local,base){
  if(!base)return{records:0,derived:0,known:false};
  let records=0;
  CONFLICT_COLLECTIONS.forEach(c=>{
    const{onlyLocal,onlyRemote,changed}=diffCollection(conflictArr(c,local),conflictArr(c,base));
    records+=onlyLocal.length+onlyRemote.length+changed.length;
  });
  let derived=0;
  [["history",h=>h.month],["snapshots",s=>`${s.date}|${s.profile}`]].forEach(([key,keyOf])=>{
    const lm=new Map(((local||{})[key]||[]).map(x=>[keyOf(x),x]));
    const bm=new Map(((base||{})[key]||[]).map(x=>[keyOf(x),x]));
    lm.forEach((lx,k)=>{const bx=bm.get(k);if(!bx||JSON.stringify(bx)!==JSON.stringify(lx))derived++;});
  });
  return{records,derived,known:true};
}
function buildConflictDiff(local,remote){
  return CONFLICT_COLLECTIONS.map(c=>{
    const{key,label,nameOf}=c;
    const{onlyLocal,onlyRemote,changed}=diffCollection(conflictArr(c,local),conflictArr(c,remote));
    return{key,label,
      onlyLocal:onlyLocal.map(nameOf),
      onlyRemote:onlyRemote.map(nameOf),
      changed:changed.map(c=>{
        const l=nameOf(c.local),r=nameOf(c.remote);
        return l===r?`${l} (other details differ)`:`${l}  →  ${r}`;
      })};
  }).filter(c=>c.onlyLocal.length||c.onlyRemote.length||c.changed.length);
}

/* localRev: the cloud revision number this device has fully reconciled
   with — either by pulling it, or by a push that the server confirmed
   landed at that revision. This (not a timestamp/fingerprint) is the
   source of truth for "am I behind the cloud".
   pendingUpload / pendingUploadFP: written to localStorage *before* a push
   request is sent, and only cleared *after* the server confirms it. If the
   process is killed/backgrounded mid-flight, these survive in localStorage
   (synchronous write) so the next launch/resume can check whether that
   upload actually landed rather than silently assuming success OR failure. */
const loadSyncMeta=()=>{
  try{
    const raw=localStorage.getItem(SYNC_META_KEY);
    if(raw){
      const m=JSON.parse(raw);
      if(!Number.isFinite(m.localRev))m.localRev=0;
      if(typeof m.pendingUpload!=="boolean")m.pendingUpload=false;
      if(m.pendingUploadFP===undefined)m.pendingUploadFP=null;
      if(m.lastCloudUploadAt===undefined)m.lastCloudUploadAt=m.lastCloudSavedAt||null;
      if(m.lastCloudDownloadAt===undefined)m.lastCloudDownloadAt=m.lastCloudPulledAt||null;
      if(typeof m.importPending!=="boolean")m.importPending=false;
      return m;
    }
  }catch(e){}
  return{hasUnsyncedChanges:false,lastCloudSavedAt:null,lastCloudPulledAt:null,lastCloudUploadAt:null,lastCloudDownloadAt:null,lastCloudSnapshot:null,changesSinceSave:0,localRev:0,pendingUpload:false,pendingUploadFP:null,importPending:false};
};
const saveSyncMeta=m=>{try{localStorage.setItem(SYNC_META_KEY,JSON.stringify(m));}catch(e){}};

/* ── Tab registry ──
   One place naming every tab, including the hidden one, so the bottom bar,
   the More sheet and any future entry point all read the same labels/icons.
   `short` is what the bottom bar shows when the full label won't survive a
   ~65px cell on a 390px phone; everything else uses `label`. */
const TAB_META={
  home:{label:"Home",short:"Home",icon:I.Home},
  budget:{label:"Budget",short:"Budget",icon:I.Wallet},
  expenses:{label:"Expenses",short:"Expenses",icon:I.Receipt},
  banks:{label:"Banks",short:"Banks",icon:I.Bank},
  investments:{label:"Investments",short:"Invest",icon:I.Trending},
  networth:{label:"Net Worth",short:"Net Worth",icon:I.Gem},
  goals:{label:"Goals",short:"Goals",icon:I.Target},
  installments:{label:"Installments",short:"Instal",icon:I.Layers},
  advisor:{label:"Purchase Advisor",short:"Advisor",icon:I.Cart},
  bills:{label:"Bills",short:"Bills",icon:I.PiggyBank},
  household:{label:"Household",short:"Household",icon:I.Users},
  currency:{label:"Currency",short:"Currency",icon:I.Swap},
  targets:{label:"Forecast",short:"Forecast",icon:I.TrendUp},
};

/* The More sheet. Portalled for the usual containing-block reason (see
   Portal near the top) — it is opened from the bottom bar, which lives
   outside TabPane, but portalling keeps it correct if that ever changes. */
function MoreSheet({tab,onPick,onClose}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" aria-label="More sections"
          tabIndex={-1} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>More</h3>
            <IconButton icon={I.X} label="Close" onClick={onClose} size={18}
              style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
          </div>
          <div className="more-grid">
            {MORE_TABS.map(id=>{
              const meta=TAB_META[id],Icon=meta.icon,on=tab===id;
              return(
                <button key={id} className="more-item" onClick={()=>onPick(id)}
                  aria-current={on?"page":undefined}
                  style={on?{background:P.jade,color:"#fff"}:{...neu(14),color:P.neuInk}}>
                  <Icon size={17}/><span>{meta.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </Portal>
  );
}

/* Bottom bar: five primary tabs + More. Rendered outside the page container
   so it is fixed to the viewport, not to the scrolling column. */
function BottomNav({tab,setTab,onMore}){
  const moreActive=MORE_TABS.includes(tab);
  return(
    <nav className="bottom-nav" aria-label="Sections">
      <div className="bottom-nav-inner" role="tablist">
      {PRIMARY_TABS.map(id=>{
        const meta=TAB_META[id],Icon=meta.icon,on=tab===id;
        return(
          <button key={id} className="bottom-nav-btn" role="tab" aria-selected={on}
            onClick={()=>setTab(id)} style={{color:on?P.jade:P.neuSub}}>
            <Icon size={19} sw={on?2.3:1.9}/><span>{meta.short}</span>
          </button>
        );
      })}
      <button className="bottom-nav-btn" onClick={onMore}
        aria-haspopup="dialog" aria-expanded={false}
        aria-label={moreActive?`More — ${TAB_META[tab].label} selected`:"More sections"}
        style={{color:moreActive?P.jade:P.neuSub}}>
        <I.MoreHorizontal size={19} sw={moreActive?2.3:1.9}/><span>More</span>
      </button>
      </div>
    </nav>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════════════════ */
function App(){
  /* An EMPTY document, never the sample one. A brand-new origin has no
     localStorage, so whatever this initializer produces is what the persist
     effect writes to disk and what the first connect would have merged into
     the cloud — which is exactly how the sample dataset used to reach both
     real phones. Sample data is now opt-in from Settings. */
  const[data,setDataRaw]=useState(()=>migrate(structuralDefaults()));
  const skipSave=useRef(false);
  /* every mutator in this file calls setData(updater). Wrapping it here (once)
     means none of those ~45 call sites need to know about dataUpdatedAt.
     skipSave.current is already set to true, right before setData, by every
     code path that's loading/merging/resolving cloud data rather than
     applying a real local edit — so we read (without consuming) that same
     flag to skip the stamp in those cases. */
  const setData=updater=>setDataRaw(d=>{
    const next=typeof updater==="function"?updater(d):updater;
    if(next===d)return d;
    if(skipSave.current)return next;
    const now=new Date().toISOString();
    // stampSettings diffs SETTING_PATHS and stamps only what actually changed,
    // so no mutator has to remember to declare which setting it touched.
    return{...stampSettings(d,next,now),dataUpdatedAt:now};
  });
  const[loaded,setLoaded]=useState(false);
  const[tab,setTab]=useState("home");
  const[showMore,setShowMore]=useState(false);
  const[planMenu,setPlanMenu]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[showPendingDiff,setShowPendingDiff]=useState(false);
  const[globalAddTrigger,setGlobalAddTrigger]=useState(0); // bumped to tell ExpenseTrackerView to open the add-transaction modal
  const[expensesFilterRequest,setExpensesFilterRequest]=useState(null); // {catNames,nonce} — Home's Savings & Investing card drill-down (Phase 4)
  const[syncMsg,setSyncMsg]=useState("");
  const[themeTick,setThemeTick]=useState(0); // bumped to force re-render after P/SEG mutate
  /* Whether this device has a sync passphrase is STATE, not a constant: typing
     one in Settings has to re-render the app so the sync buttons and the
     load/save effects come alive without a reload. getSyncToken() is the
     source of truth; this just mirrors "is it set" into React. */
  const[syncTokenSet,setSyncTokenSet]=useState(()=>!!getSyncToken());
  const kvReady=!PROXY_URL.startsWith("PASTE_")&&syncTokenSet;

  /* ── local-first sync state ──────────────────────────────────────────── */
  const[hasUnsyncedChanges,setHasUnsyncedChanges]=useState(false);
  const[lastCloudSavedAt,setLastCloudSavedAt]=useState(null); // last confirmed upload
  const[lastCloudPulledAt,setLastCloudPulledAt]=useState(null); // last confirmed download
  const[changesSinceSave,setChangesSinceSave]=useState(0);
  const[syncOp,setSyncOp]=useState(null); // null | "push" | "pull"
  const[conflict,setConflict]=useState(null); // {local,remote,remoteSavedAt} | null
  /* Set when this device has never synced, holds records a person made, and
     has met an established cloud document. Blocks every push until answered —
     deliberately NOT the conflict modal, which describes a different situation
     (two devices that diverged from a shared baseline). */
  const[firstConnect,setFirstConnect]=useState(null); // {local,remote,remoteFP,remoteRev} | null
  const firstConnectRef=useRef(null);
  useEffect(()=>{firstConnectRef.current=firstConnect;},[firstConnect]);
  /* One dismissible line after a silent adopt replaced this device's
     preferences with the cloud's. Never blocks. */
  const[adoptedSettingsNote,setAdoptedSettingsNote]=useState(false);
  /* ── revision-based sync state ───────────────────────────────────────────
     localRev tracks the last cloud revision this device has fully
     reconciled with (see loadSyncMeta comment). syncStatus drives the
     status pill in the UI; isOnline is a plain navigator.onLine mirror so
     we can show "Offline" immediately instead of waiting for a fetch to
     time out. lastSyncError is diagnostics-only. */
  const[localRev,setLocalRev]=useState(0);
  const[cloudRev,setCloudRev]=useState(0); // last-known cloud revision, incl. ahead-of-local (diagnostics + "newer data available")
  const[syncStatus,setSyncStatus]=useState("idle"); // idle|saving|synced|pending|offline|failed|stale
  const[isOnline,setIsOnline]=useState(()=>typeof navigator==="undefined"?true:navigator.onLine);
  const[lastSyncError,setLastSyncError]=useState(null);
  const localRevRef=useRef(0);
  useEffect(()=>{localRevRef.current=localRev;},[localRev]);
  /* Two rotating safety copies, newest first. The stored shape is an ARRAY;
     the pre-2026-08-05 shape was a bare {at,data} object, so readPreCloudSlots
     normalises that rather than discarding the one copy an upgrading device may
     be relying on at that exact moment. */
  const[preCloudSlots,setPreCloudSlots]=useState(()=>readPreCloudSlots().map(s=>({at:s.at,label:s.label||null})));
  /* ── Import hold ────────────────────────────────────────────────────────
