     An imported backup replaces everything, and every automatic upload path
     would otherwise push it to the cloud within ~8 seconds — replacing the
     copy the OTHER person is using, before anyone could look at it. So an
     import sets this flag and every *automatic* push checks it; only an
     explicit Save to Cloud (or a Pull, which throws the import away) clears
     it. Lives in syncMeta, not in `data`: it is a state of this device, and
     syncing it would make no sense on the other one. Survives a reload, so
     closing the app mid-decision can't quietly release the upload either. */
  const[importPending,setImportPending]=useState(()=>{
    try{return!!loadSyncMeta().importPending;}catch(e){return false;}
  });
  const importPendingRef=useRef(importPending);
  useEffect(()=>{importPendingRef.current=importPending;},[importPending]);
  const setImportHold=on=>{
    const meta=loadSyncMeta();meta.importPending=!!on;saveSyncMeta(meta);
    importPendingRef.current=!!on;
    setImportPending(!!on);
  };
  const syncing=syncOp!=null;
  const lastCloudSnapshotRef=useRef(null);
  const dataRef=useRef(data);
  useEffect(()=>{dataRef.current=data;},[data]);

  /* ── undo / recently-deleted ───────────────────────────────────────────
     Every delete in this app already sets `deletedAt` on the record instead
     of removing it (needed for tombstone merging across devices) — so undo
     just means clearing that flag again, and "recently deleted" just means
     showing what's still sitting there. restoreRecord handles both the
     6-second toast and the full recovery list with one function. */
  const restoreRecord=(collection,id,childKey,childId)=>{
    setData(d=>{
      /* The one nested collection in CONFLICT_COLLECTIONS. Handled here rather
         than by giving every caller a path, because this is the only place
         that writes a restore back. */
      if(collection==="household.expenses"){
        const hh=d.household||{splitMine:50,expenses:[]};
        return{...d,household:{...hh,expenses:(hh.expenses||[]).map(x=>x.id===id?{...x,deletedAt:null,updatedAt:new Date().toISOString()}:x)}};
      }
      const arr=d[collection]||[];
      /* Two collections restore more than one record, because more than one
         was tombstoned by the delete. Routed here rather than in the modal so
         the undo toast and Recently Deleted can't drift apart. */
      if(collection==="installments"&&!childKey)
        return applyInstallmentRestore(d,{installmentId:id,now:new Date().toISOString()});
      if(collection==="expenses"&&!childKey){
        const e=(d.expenses||[]).find(x=>x.id===id);
        if(e&&(e.installmentPaymentId||e.installmentPayoff))
          return applyInstallmentExpenseRestore(d,{expenseId:id,now:new Date().toISOString()});
        if(e&&e.goalId&&e.goalContributionId)
          return applyGoalContributionRestoreByExpense(d,{expenseId:id,now:new Date().toISOString()});
      }
      /* Restoring a goal contribution from Recently Deleted must bring its
         ledger row back too — the delete tombstoned both. */
      if(collection==="goals"&&childKey==="contributions"&&childId)
        return applyGoalContributionRestoreByContribution(d,{goalId:id,contributionId:childId,now:new Date().toISOString()});
      if(childKey&&childId){
        return{...d,[collection]:arr.map(p=>p.id===id?{...p,[childKey]:(p[childKey]||[]).map(c=>c.id===childId?{...c,deletedAt:null}:c),updatedAt:new Date().toISOString()}:p)};
      }
      return{...d,[collection]:arr.map(x=>x.id===id?{...x,deletedAt:null,updatedAt:new Date().toISOString()}:x)};
    });
    pushImportantRef.current();
  };
  /* Undoing an ADD is the mirror of undoing a delete, and the toast had only
     ever needed the second one. Rapid entry (v1.25.0) writes rows the user has
     not reviewed, so it needs the first: `undoKind:"remove"` tombstones the row
     instead of restoring it.

     Deliberately NOT routed through removeExpenseTx: that raises its own
     "Deleted …" toast, which would tell the user they deleted something they
     were only taking back. This path is silent, and the row is a plain tracked
     expense by construction — rapid entry is tracked-mode only, so none of
     removeExpenseTx's installment-link handling can apply. */
  const undoTimerRef=useRef(null);
  const[undoAction,setUndoAction]=useState(null); // {label,collection,id,childKey?,childId?,undoKind?} | null
  const triggerUndo=(label,restoreArgs)=>{
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoAction({label,...restoreArgs});
    undoTimerRef.current=setTimeout(()=>setUndoAction(null),6000);
  };
  const performUndo=()=>{
    if(!undoAction)return;
    if(undoAction.undoKind==="remove"){
      const{collection,id}=undoAction;
      const now=new Date().toISOString();
      setData(d=>({...d,[collection]:(d[collection]||[]).map(x=>
        x.id===id?{...x,deletedAt:now,updatedAt:now}:x)}));
      pushImportantRef.current();
    }else{
      restoreRecord(undoAction.collection,undoAction.id,undoAction.childKey,undoAction.childId);
    }
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoAction(null);
  };
  const[showRecentlyDeleted,setShowRecentlyDeleted]=useState(false);

  /* Hard-drops tombstones older than the retention window so deleted data
     doesn't accumulate forever. Only ever run once local is confirmed clean
     (hasUnsyncedChanges===false) so it isn't racing an in-flight edit, and
     it goes through the normal setData path (not skipSave) so the purge
     itself gets pushed to the cloud on the next sync like any other edit. */
  const TOMBSTONE_RETENTION_DAYS=90;
  const purgeOldTombstones=(d,days=TOMBSTONE_RETENTION_DAYS)=>{
    const cutoff=Date.now()-days*86400000;
    const fresh=x=>!(x.deletedAt&&new Date(x.deletedAt).getTime()<cutoff);
    const stripChild=(arr,childKey)=>(arr||[]).map(p=>p[childKey]?{...p,[childKey]:p[childKey].filter(fresh)}:p);
    const stripChildren=(arr,keys)=>keys.reduce((a,k)=>stripChild(a,k),arr);
    return{...d,
      expenses:(d.expenses||[]).filter(fresh),
      goals:stripChild((d.goals||[]).filter(fresh),"contributions"),
      investments:stripChildren((d.investments||[]).filter(fresh),["trades","contributions"]),
      banks:(d.banks||[]).filter(fresh),
      assets:(d.assets||[]).filter(fresh),
      targets:(d.targets||[]).filter(fresh),
      plans:(d.plans||[]).filter(fresh),
      mp2DividendRates:(d.mp2DividendRates||[]).filter(fresh),
      installments:(d.installments||[]).filter(fresh),
      installmentPayments:(d.installmentPayments||[]).filter(fresh),
      txTemplates:(d.txTemplates||[]).filter(fresh),
      household:d.household?{...d.household,expenses:(d.household.expenses||[]).filter(fresh)}:d.household,
    };
  };
  const purgedThisSessionRef=useRef(false);
  useEffect(()=>{
    if(!loaded||purgedThisSessionRef.current||hasUnsyncedChanges)return;
    purgedThisSessionRef.current=true;
    const purged=purgeOldTombstones(dataRef.current);
    if(fingerprint(purged)!==fingerprint(dataRef.current))setDataRaw(purged);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[loaded,hasUnsyncedChanges]);

  const hasUnsyncedRef=useRef(false);
  useEffect(()=>{hasUnsyncedRef.current=hasUnsyncedChanges;},[hasUnsyncedChanges]);
  const isOnlineRef=useRef(isOnline);
  useEffect(()=>{isOnlineRef.current=isOnline;},[isOnline]);

  /* ── device-local theme (light/dark) ──────────────────────────────────────
     Purely a per-device UI preference, same treatment as budgetOwner below —
     never synced to the cloud, never part of `data`. Two people sharing one
     dataset can each keep their own light/dark choice without it fighting
     over what gets pushed/pulled. ────────────────────────────────────────── */
  const[theme,setThemeState]=useState(()=>{
    try{return localStorage.getItem("allocation:theme")||"light";}catch(e){return "light";}
  });

  /* ── device-remembered default profile (Me / Wife) ───────────────────────
     Asked once per device on first open, then remembered locally. Never
     synced to the cloud — purely a per-device UI preference. The in-session
     owner toggle (OwnerToggle) can still switch views without changing
     this remembered default; only "Change default profile" in Settings
     updates it. ────────────────────────────────────────────────────────── */
  const[budgetOwner,setBudgetOwner]=useState(()=>{
    try{return localStorage.getItem(PROFILE_KEY)||"me";}catch(e){return "me";}
  });
  const[showProfilePicker,setShowProfilePicker]=useState(()=>{
    try{return !localStorage.getItem(PROFILE_KEY);}catch(e){return false;}
  });
  const[profilePickerDismissable,setProfilePickerDismissable]=useState(false);

  /* ── VIEWING profile — the me/wife/household switch shared by Home, Banks,
     Investments and Net Worth. "household" is NOT a third person: it is the
     combined view of both people plus anything jointly owned (see CLAUDE.md).
     It lives in localStorage, never in `data` — it's a per-device UI
     preference, and putting it in the doc would dirty it and sync your
     current view to the other device. This used to be local to HomeView.
     budgetOwner stays me/wife only, since a budget plan belongs to a person;
     when the view profile is "household", Budget/Expenses simply keep showing
     whoever was picked last, with their own 2-way toggle. ────────────────── */
  const[profile,setProfile]=useState(()=>{
    try{return localStorage.getItem(VIEW_PROFILE_KEY)||localStorage.getItem(PROFILE_KEY)||"me";}catch(e){return "me";}
  });
  const setProfileSynced=p=>{
    setProfile(p);
    try{localStorage.setItem(VIEW_PROFILE_KEY,p);}catch(e){}
    if(p==="me"||p==="wife")setBudgetOwner(p);
  };
  /* Budget/Expenses own toggle drives the global view too, so switching person
     there doesn't leave Banks/Investments/Net Worth on the other one. */
  const setBudgetOwnerSynced=p=>{setBudgetOwner(p);setProfileSynced(p);};

  const chooseDefaultProfile=ok=>{
    setBudgetOwner(ok);
    setProfileSynced(ok);
    try{localStorage.setItem(PROFILE_KEY,ok);}catch(e){}
    setShowProfilePicker(false);
  };
  const openProfilePicker=()=>{setProfilePickerDismissable(true);setShowProfilePicker(true);};

  /* Returns whether the copy actually landed. The conflict paths ignore the
     result (they have their own recovery), but import MUST NOT proceed on a
     failed stash — a full localStorage quota would otherwise leave the user
     with no way back to the data the import replaced. */
  const stashPreCloudBackup=(d,label)=>{
    try{
      const at=new Date().toISOString();
      const next=[{at,label:label||null,data:d},...readPreCloudSlots()];
      const written=writePreCloudSlots(next);
      if(!written)return false;
      setPreCloudSlots(written.map(s=>({at:s.at,label:s.label||null})));
      return true;
    }catch(e){return false;}
  };
  /* ── Take the cloud document EXACTLY ───────────────────────────────────────
     No merge, no push, no rev invention. Used by a device that has never
     synced meeting an established cloud, and by the chooser's "Use the cloud
     copy" button. The local copy is stashed first so an adopt is undoable from
     Recently Deleted → previous local copies, which is the whole reason
     adopting can be the safe default rather than a question.

     Sets the baseline to the remote fingerprint and hasUnsyncedChanges=false,
     which is what stops the persist effect from immediately re-flagging the
     document dirty and firing the idle autosave. */
  const adoptCloudDoc=(remoteMigrated,remoteFP,remoteRev,banner)=>{
    stashPreCloudBackup(dataRef.current,"before adopting the cloud copy");
    clearSampleMark(); // whatever this device held, it is gone now
    skipSave.current=true;
    setData(remoteMigrated);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(remoteMigrated));}catch(e){}
    lastCloudSnapshotRef.current=remoteFP;
    cacheSyncedSnapshot(remoteMigrated);
    const now=new Date();
    const meta=loadSyncMeta();
    meta.hasUnsyncedChanges=false;
    meta.changesSinceSave=0;
    meta.lastCloudSnapshot=remoteFP;
    meta.lastCloudPulledAt=now.toISOString();
    meta.lastCloudDownloadAt=meta.lastCloudPulledAt;
    meta.localRev=remoteRev;
    saveSyncMeta(meta);
    setHasUnsyncedChanges(false);
    setChangesSinceSave(0);
    setLastCloudPulledAt(now);
    setLocalRev(remoteRev);
    setCloudRev(remoteRev);
    setSyncStatus("synced");
    setSyncMsg("Cloud data loaded ✓");
    if(banner)setAdoptedSettingsNote(true);
  };
  const restorePreCloudBackup=(index=0)=>{
    try{
      const slots=readPreCloudSlots();
      const backup=slots[index];
      if(!backup)return;
      const restored=migrate(backup.data);
      skipSave.current=true;
      setData(restored);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));}catch(e){}
      const dirty=fingerprint(restored)!==lastCloudSnapshotRef.current;
      setHasUnsyncedChanges(dirty);
      const meta=loadSyncMeta();meta.hasUnsyncedChanges=dirty;saveSyncMeta(meta);
      setSyncMsg("Previous local copy restored");
      setTimeout(()=>setSyncMsg(""),3000);
      /* Restoring is an explicit "undo the import" — release the hold so the
         restored copy behaves like ordinary local data again. */
      if(importPendingRef.current)setImportHold(false);
    }catch(e){}
  };

  /* Apply an already-validated backup. Order matters: the safety copy is
     written FIRST and the import is abandoned if that write fails, then the
     upload hold goes on BEFORE setData, so the persist effect can never see
     a dirty document with the hold still off. Returns an error string, or
     null on success. */
  const importBackup=raw=>{
    let migrated;
    try{migrated=migrate(JSON.parse(JSON.stringify(raw)));}
    catch(e){return "That backup couldn't be read.";}
    if(!stashPreCloudBackup(dataRef.current,"before importing a backup"))
      return "Couldn't save a copy of your current data first, so the import was cancelled. Free up some space on this device and try again.";
    /* Only hold when there is something to hold back. On a device with no
       passphrase nothing uploads anyway, and a flag left set here would
       silently block syncing later, the day a passphrase is finally entered. */
    setImportHold(!!kvReady);
    setData(migrated);
    return null;
  };

  /* Never let a push happen from a session that hasn't actually confirmed
     the current cloud state yet — this is what stops a new device (or one
     that just timed out) from writing an empty/incomplete dataset over
     real data that's already on the cloud. Set true once a load genuinely
     completes (whether it found data or confirmed there's legitimately
     none yet), moot when kvReady is false since there's nothing to protect. */
  const cloudConfirmedRef=useRef(false);
  /* Why cloudConfirmedRef is false, when the reason is "we read the cloud and
     refused it" rather than "we never got an answer". Kept as its own ref so
     the blocked-push message can name the real cause instead of sniffing the
     text of lastSyncError. Cleared the moment a readable document arrives. */
  const cloudUnreadableRef=useRef(null);
  const [cloudWaiting,setCloudWaiting]=useState(false);
  /* Non-null when the waiting screen is up because the cloud copy was READ and
     refused, not because it never answered. The two look identical from the
     outside and have completely different fixes, so the screen has to say. */
  const [cloudWaitReason,setCloudWaitReason]=useState(null);
  const [cloudReconnecting,setCloudReconnecting]=useState(false);

  /* load — local-first startup policy:
     • No unsynced local changes  → safe to auto-pull the cloud copy, as before.
     • Unsynced local changes exist from a previous session → NEVER silently
       overwrite them. Check the cloud copy; if it's identical, mark clean;
       if it differs, merge (id + updatedAt everywhere, not just expenses).
     • The initial cloud fetch is capped at 6s so a hung connection can't
       freeze the app forever. A returning device (has a local copy already)
       shows it immediately if that timeout hits, and keeps quietly retrying
       in the background — safe, because nothing gets pushed until
       cloudConfirmedRef flips true. A brand-new device with nothing local
       is the one case that stays on the loading screen (with a visible
       "still connecting" message and an explicit opt-out) rather than ever
       showing an empty app that looks safe to start typing into. */
  useEffect(()=>{
    let cancelled=false;
    let retryHandle=null;
    /* Reason string when a cloud document was read but refused (see
       cloudDocProblem). Set by reconcile, read by finish — both close over it,
       so the status finish writes can't quietly paper over a rejection. */
    let rejected=null;

    const withTimeout=(p,ms)=>new Promise(res=>{
      let settled=false;
      const t=setTimeout(()=>{if(!settled){settled=true;res({timedOut:true,value:null});}},ms);
      p.then(v=>{if(!settled){settled=true;clearTimeout(t);res({timedOut:false,value:v});}})
       .catch(()=>{if(!settled){settled=true;clearTimeout(t);res({timedOut:false,value:null});}});
    });

    const reconcile=(remoteEnvelope,localResolved,meta)=>{
      let resolved=localResolved;
      const remoteRaw=remoteEnvelope&&remoteEnvelope.data;
      /* An unusable cloud document is treated exactly like a failed read: adopt
         nothing, merge nothing, advance no rev, record no cloud snapshot. It is
         NOT treated as a conflict — the conflict modal asks the user to choose
         between two documents, and one of these two isn't a document. */
      const problem=cloudDocProblem(remoteRaw);
      if(problem){rejected=problem;cloudUnreadableRef.current=problem;return localResolved;}
      cloudUnreadableRef.current=null;
      if(remoteRaw){
        const remoteMigrated=migrate(remoteRaw);
        const remoteFP=fingerprint(remoteMigrated);
        const remoteRev=Number.isFinite(remoteEnvelope.rev)?remoteEnvelope.rev:meta.localRev||0;
        let conflictShown=false;
        if(localResolved){
          const localFP=fingerprint(localResolved);
          if(localFP===remoteFP){
            resolved=localResolved;
            meta.hasUnsyncedChanges=false;
          }else{
            /* Same gate as pullFromCloud, for the same reason: without a
               baseline these two documents share no ancestor, so their union
               is contamination rather than reconciliation. Reloading before
               connecting must not be a way around the chooser. */
            const decision=syncConnectDecision({
              hasBaseline:meta.lastCloudSnapshot!=null,
              provenance:getProvenance(),
              localHasRecords:countLocalRecords(localResolved)>0,
              localDiffersInSettings:settingsSignature(localResolved)!==settingsSignature(remoteMigrated),
              remoteExists:true,
            });
            if(decision.action==="adopt"){
              stashPreCloudBackup(localResolved,"before adopting the cloud copy");
              clearSampleMark();
              resolved=remoteMigrated;
              meta.hasUnsyncedChanges=false;
              meta.changesSinceSave=0;
              if(decision.banner)setAdoptedSettingsNote(true);
            }else if(decision.action==="ask"&&!cancelled){
              /* Keep local untouched and hold. saveToCloud refuses while this
                 is set, so nothing can go up before the person answers. */
              resolved=localResolved;
              conflictShown=true;   // reuse the guard: don't advance localRev
              meta.hasUnsyncedChanges=true;
              setFirstConnect({local:localResolved,remote:remoteMigrated,remoteFP,remoteRev});
            }else{
              const merged=tryAutoMergeAll(localResolved,remoteMigrated);
              if(merged){
                resolved=merged;
                meta.hasUnsyncedChanges=fingerprint(merged)!==remoteFP;
                // Nothing manufactured survived — see the same guard in pullFromCloud.
                if(countLocalRecords(merged)<=countLocalRecords(remoteMigrated))clearSampleMark();
              }else if(!cancelled){
                resolved=localResolved;
                conflictShown=true;
                setConflict({local:localResolved,remote:remoteMigrated,remoteSavedAt:KVSync.lastPulledAt,remoteRev,remoteWriter:(remoteEnvelope&&remoteEnvelope.lastWriter)||null});
              }
            }
          }
        }else{
          // genuinely no local copy on this device yet — remote is authoritative
          resolved=remoteMigrated;
          meta.hasUnsyncedChanges=false;
        }
        lastCloudSnapshotRef.current=remoteFP;
        meta.lastCloudSnapshot=remoteFP;
        meta.lastCloudPulledAt=new Date().toISOString();
        meta.lastCloudDownloadAt=meta.lastCloudPulledAt;
        // localRev only advances to the remote rev once this device's data
        // actually reflects it (clean match / successful merge / fresh
        // adopt). Left alone while a conflict modal is pending, since
        // `resolved` is still the stale pre-merge copy in that branch.
        if(!conflictShown)meta.localRev=remoteRev;
        if(!conflictShown)cacheSyncedSnapshot(remoteMigrated);
      }
      return resolved;
    };

    const finish=(resolved,meta)=>{
      if(cancelled)return;
      if(!lastCloudSnapshotRef.current&&meta.lastCloudSnapshot){
        lastCloudSnapshotRef.current=meta.lastCloudSnapshot;
      }
      if(resolved){
        skipSave.current=true;
        setData(resolved);
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(resolved));}catch(e){}
      }
      // A push that was mid-flight when the app was last killed/backgrounded
      // leaves pendingUpload=true behind (see markUploadPending). Now that
      // we have a definitive read of the cloud, resolve it for real instead
      // of guessing: if what we uploaded is what the cloud ended up
      // confirming as the reconciled baseline, it landed — clear the flag.
      // Otherwise leave it cleared too (no point tracking a specific
      // in-flight fingerprint anymore), but hasUnsyncedChanges — already
      // computed above by the normal fingerprint/merge reconcile — stays
      // whatever that determined, so a genuinely-lost upload's changes are
      // still marked dirty and will retry via the normal autosave path.
      if(meta.pendingUpload){meta.pendingUpload=false;meta.pendingUploadFP=null;}
      saveSyncMeta(meta);
      setHasUnsyncedChanges(!!meta.hasUnsyncedChanges);
      setChangesSinceSave(meta.changesSinceSave||0);
      setLocalRev(meta.localRev||0);
      setCloudRev(meta.localRev||0);
      if(meta.lastCloudSavedAt)setLastCloudSavedAt(new Date(meta.lastCloudSavedAt));
      if(meta.lastCloudPulledAt)setLastCloudPulledAt(new Date(meta.lastCloudPulledAt));
      /* A refused cloud document outranks the normal pending/synced answer:
         this device's data is intact, but it is NOT in sync and saying "synced"
         would be a lie the person can't see through. */
      if(rejected){setSyncStatus("failed");setLastSyncError(rejected);}
      else setSyncStatus(meta.hasUnsyncedChanges?"pending":"synced");
    };

    const revealApp=()=>{
      setCloudWaiting(false);
      applyTheme(theme);applySegTheme(theme);setThemeTick(t=>t+1);
      setLoaded(true);
      if(typeof window.__hideLoading==="function")window.__hideLoading();
    };

    // quiet background retry — used both for a returning device that timed
    // out (nothing shown, just keeps trying) and a new device that's stuck
    // on the "still connecting" screen (its success reveals the app).
    const backgroundRetry=(localResolved,attempt=1)=>{
      if(cancelled||!kvReady)return;
      setCloudReconnecting(true);
      const delay=Math.min(30000,5000*attempt);
      retryHandle=setTimeout(async()=>{
        if(cancelled)return;
        let remoteRaw=null;
        try{remoteRaw=await KVSync.load();}catch(e){}
        if(cancelled)return;
        if(remoteRaw!==null||KVSync.lastPulledAt){
          // got an actual answer (data, or a confirmed-empty account)
          rejected=null;
          setCloudReconnecting(false);
          const meta=loadSyncMeta();
          const have=dataRef.current||localResolved;
          const resolved=reconcile(remoteRaw,have,meta);
          /* Set only now: reconcile has validated the document and decided
             what to do with it. Setting it before the read (as this did) means
             a device is cleared to push over a document it hasn't seen. */
          /* Refused: we do NOT have a usable read of the cloud, so pushing
             stays off (saveToCloud gates on this ref) and we keep retrying —
             a torn read heals itself on the next attempt. */
          cloudConfirmedRef.current=!rejected;
          if(rejected&&!have){setCloudWaitReason(rejected);setCloudWaiting(true);backgroundRetry(localResolved,attempt+1);return;}
          if(!rejected)setCloudWaitReason(null);
          finish(resolved,meta);
          revealApp();
          if(rejected)backgroundRetry(localResolved,attempt+1);
        }else{
          backgroundRetry(localResolved,attempt+1);
        }
      },delay);
    };

    (async()=>{
      const meta=loadSyncMeta();
      let localResolved=null;
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw)localResolved=migrate(JSON.parse(raw));
      }catch(e){}

      if(!kvReady){
        cloudConfirmedRef.current=true; // nothing to protect — sync isn't configured
        finish(localResolved,meta);
        revealApp();
        return;
      }

      const{timedOut,value:remoteRaw}=await withTimeout(KVSync.load(),9000);

      if(cancelled)return;

      if(!timedOut){
        // request genuinely completed — whether it found data or confirmed
        // the account is legitimately empty, either way we now know the
        // real cloud state. Pushing is enabled AFTER reconcile has validated
        // that state, not before: the flag means "this device knows what it
        // would be writing over", which a completed request alone doesn't say.
        const resolved=reconcile(remoteRaw,localResolved,meta);
        cloudConfirmedRef.current=!rejected;
        if(rejected){
          /* Same rule as the timeout below, for the same reason: we don't know
             the cloud's real state, so nothing may be pushed. */
          if(!localResolved){
            /* Nothing local AND an unusable cloud copy. Do not open on an empty
               app that looks safe to type into — that is exactly the trap the
               timeout branch avoids, and here it is worse: the typing would sit
               on top of a document we already know we can't reconcile with. */
            setCloudWaitReason(rejected);
            setCloudWaiting(true);
            backgroundRetry(localResolved,1);
            return;
          }
          finish(resolved,meta);
          revealApp();
          backgroundRetry(localResolved,1);
          return;
        }
        finish(resolved,meta);
        revealApp();
        return;
      }

      // timed out — never got an answer either way
      if(localResolved){
        // returning device: show what it already has, keep confirming quietly
        finish(localResolved,meta);
        revealApp();
      }else{
        // brand-new device with nothing local: stay on the loading screen
        // and say so, rather than opening on an empty app that looks safe
        // to start typing into
        setCloudWaiting(true);
      }
      backgroundRetry(localResolved,1);
    })();

    return()=>{cancelled=true;if(retryHandle)clearTimeout(retryHandle);};
  },[]);

  /* explicit opt-out from the "still connecting" screen — proceeds with an
     empty local dataset, but does NOT mark the cloud confirmed, so no save
     can go out until a background retry actually succeeds and reconciles
     whatever gets entered in the meantime */
  const continueOffline=()=>{
    setCloudWaiting(false);
    skipSave.current=true;
    setData(migrate(structuralDefaults()));
    applyTheme(theme);applySegTheme(theme);setThemeTick(t=>t+1);
    setLoaded(true);
    if(typeof window.__hideLoading==="function")window.__hideLoading();
  };

  const toggleTheme=()=>{
    const next=theme==="dark"?"light":"dark";
    applyTheme(next);
    applySegTheme(next);
    try{localStorage.setItem("allocation:theme",next);}catch(e){}
    setThemeTick(t=>t+1);
    setThemeState(next);
  };

  /* persist — LOCAL ONLY. Never calls KVSync.save(). Marks the app dirty
     whenever the data no longer matches the last cloud-synced snapshot.

     Two conditions, both required, and they answer different questions:
       fp!==baseline          — did anything change at all?
       userFingerprint differs — was any of it something a *person* did?
     The second gate is what stops an automatic quote/FX refresh from
     recomputing a history/snapshot row, flagging the doc dirty, and burning a
     Cloudflare KV write on every app open. Derived rows still get uploaded —
     they're in the payload — they just don't trigger a save by themselves.
     If there's no cached baseline object yet (brand-new device), fall back to
     the plain byte comparison so we never under-report a real pending edit. */
  useEffect(()=>{
    if(!loaded)return;
    if(skipSave.current){skipSave.current=false;return;}
    const t=setTimeout(()=>{
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){}
      const fp=fingerprint(data);
      const base=syncedSnapshotObj();
      const bytesDiffer=fp!==lastCloudSnapshotRef.current;
      const dirty=bytesDiffer&&(!base||userFingerprint(data)!==userFingerprint(base));
      const meta=loadSyncMeta();
      meta.hasUnsyncedChanges=dirty;
      // A real record count, not a tally of how many times this effect ran.
      const{records,known}=countPendingChanges(data,base);
      meta.changesSinceSave=dirty?(known?records:0):0;
      saveSyncMeta(meta);
      setHasUnsyncedChanges(dirty);
      setChangesSinceSave(meta.changesSinceSave||0);
      if(dirty&&syncOp==null)setSyncStatus(isOnline?"pending":"offline");
    },450);
    return()=>clearTimeout(t);
  },[data,loaded]);

  /* ── Save to Cloud — the ONLY place that calls KVSync.save() (aside from
     the best-effort keepalive flush below, which talks to the same worker
     endpoint directly). `reason` is just for the status message. ──────── */
  const savingRef=useRef(false);
  /* Marks a push as in-flight *before* the network call, durably, so a
     kill/background mid-upload can never look like a silent success — see
     the pendingUpload verification in the startup/activation checks. */
  const markUploadPending=payload=>{
    const meta=loadSyncMeta();
    meta.pendingUpload=true;
    meta.pendingUploadFP=fingerprint(payload);
    saveSyncMeta(meta);
  };
  const clearUploadPending=()=>{
    const meta=loadSyncMeta();
    meta.pendingUpload=false;
    meta.pendingUploadFP=null;
    saveSyncMeta(meta);
    return meta;
  };
  const commitPush=(payload,rev,now)=>{
    const fp=fingerprint(payload);
    lastCloudSnapshotRef.current=fp;
    cacheSyncedSnapshot(payload);
    const meta=clearUploadPending();
    meta.hasUnsyncedChanges=false;
    meta.lastCloudSnapshot=fp;
    meta.lastCloudSavedAt=now.toISOString();
    meta.lastCloudUploadAt=meta.lastCloudSavedAt;
    meta.changesSinceSave=0;
    meta.localRev=rev;
    saveSyncMeta(meta);
    /* The one place an import hold is released by uploading: the data is now
       genuinely on the cloud, so there is nothing left to hold back. */
    if(importPendingRef.current)setImportHold(false);
    setLastCloudSavedAt(now);
    setHasUnsyncedChanges(false);
    setChangesSinceSave(0);
    setLocalRev(rev);
    setCloudRev(rev);
  };
  const saveToCloud=async(reason="manual")=>{
    /* A held import may only be uploaded by an action the user took on
       purpose. "auto" covers the idle autosave, pushImportant, the
       backgrounding push and the post-merge re-push — none of them are a
       decision to share the imported file with the other device. */
    if(importPendingRef.current&&reason!=="manual"&&reason!=="gesture")return;
    /* A first-connection decision is outstanding: this device has never synced,
       holds records of its own, and the cloud already has a document. Until the
       person answers, NOTHING goes up — not the idle autosave, not the
       backgrounding flush, and not a manual Save either, because "Save to
       Cloud" from here has no defined meaning (overwrite? merge?). The chooser
       itself pushes, through its own explicit path. */
    if(firstConnectRef.current){
      setSyncMsg("Choose what to do with this device's data first");
      setTimeout(()=>setSyncMsg(""),4000);return;
    }
    /* A manufactured document — the demo dataset, or an emptied one — never
       reaches the cloud on its own. Only a deliberate Save to Cloud can share
       it, and doing so ends the mark: from then on it is somebody's real
       starting point.

       The reset half of this is the important one. Without it, tapping "Reset
       to empty" left the document dirty and the idle autosave uploaded the
       emptied device ~8s later, so a button that reads as "clean up this
       device" silently emptied the other phone too. */
    const manufactured=getProvenance();
    if(manufactured!=="user"){
      if(reason!=="manual"&&reason!=="gesture"){
        setSyncMsg(manufactured==="reset"
          ?"This device was reset — use Save to Cloud if you meant to clear the cloud too"
          :"Sample data won't sync — use Save to Cloud if you meant to");
        setTimeout(()=>setSyncMsg(""),4000);return;
      }
      clearSampleMark();
    }
    if(!kvReady){setSyncMsg("Cloudflare sync isn't configured");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(!cloudConfirmedRef.current){
      /* Two different reasons, and they need different answers: "we never got
         through" is worth retrying in a moment, while "we got through and the
         document is broken" never will be. Pushing is refused in both cases —
         a compare-and-swap against a document we can't read is not something
         this app decides on a phone. */
      setSyncMsg(cloudUnreadableRef.current
        ?`${cloudUnreadableRef.current} — saving is on hold until it can be read`
        :"Still connecting to the cloud — try again in a moment");
      setTimeout(()=>setSyncMsg(""),5000);return;
    }
    if(!isOnline){setSyncStatus("offline");setSyncMsg("Offline — will sync when back online");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(savingRef.current)return;
    savingRef.current=true;
    setSyncOp("push");
    setSyncStatus("saving");
    try{
      const payload=dataRef.current;
      markUploadPending(payload);
      let result=await KVSync.save(payload,localRevRef.current);
      if(result&&result.conflict){
        // Server handed back its current data+rev inline — no second
        // round trip needed to see what changed.
        const remoteRaw=result.data;
        const problem=cloudDocProblem(remoteRaw);
        if(problem){
          /* The server rejected our rev and handed back a document we can't
             read. Never merge into it and never overwrite it — the local copy
             stays dirty and the reason is shown, because a save that silently
             does nothing is the failure mode v1.22.2 exists to end. */
          cloudUnreadableRef.current=problem;
          cloudConfirmedRef.current=false;
          clearUploadPending();
          setHasUnsyncedChanges(true);
          setSyncStatus("failed");
          setLastSyncError(problem);
          setSyncMsg("Cloud copy is unreadable — nothing was changed");
        }else if(remoteRaw){
          cloudUnreadableRef.current=null;
          const remoteMigrated=migrate(remoteRaw);
          /* Third door to the same contamination. A rev rejection means the
             cloud moved under us, and the reflex is to merge and retry — but
             if this device has no baseline it has no shared ancestor with what
             came back, so that union is not a merge. Hand it to the chooser
             instead and push nothing. */
          const m0=loadSyncMeta();
          if(m0.lastCloudSnapshot==null){
            clearUploadPending();
            setHasUnsyncedChanges(true);
            setSyncStatus("pending");
            setSyncMsg("");
            setFirstConnect({local:payload,remote:remoteMigrated,
              remoteFP:fingerprint(remoteMigrated),remoteRev:result.rev});
            savingRef.current=false;setSyncOp(null);
            return;
          }
          const merged=tryAutoMergeAll(payload,remoteMigrated);
          const retry=merged?await KVSync.save(merged,result.rev):null;
          if(merged&&retry&&!retry.conflict&&retry.ok!==false){
            skipSave.current=true;
            setData(merged);
            try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
            const now=new Date();
            commitPush(merged,retry.rev,now);
            setSyncStatus("synced");
            setLastSyncError(null);
            setSyncMsg("Merged with cloud changes and saved ✓");
          }else{
            clearUploadPending();
            setHasUnsyncedChanges(true);
            setSyncStatus("stale");
            setSyncMsg("⚠️ Cloud changed — review before saving");
            setConflict({local:payload,remote:remoteMigrated,remoteSavedAt:result.savedAt,remoteRev:result.rev,remoteWriter:result.lastWriter||null});
          }
        }else{
          clearUploadPending();
          setHasUnsyncedChanges(true);
          setSyncStatus("failed");
          setLastSyncError("Conflict response missing data");
        }
      }else if(!result||result.ok===false){
        clearUploadPending();
        setSyncStatus("failed");
        setLastSyncError(result&&result.reason?result.reason:"unknown error");
        setSyncMsg("Cloud save failed — data is safe on this device");
      }else{
        const now=new Date();
        commitPush(payload,result.rev,now);
        setSyncStatus("synced");
        setLastSyncError(null);
        setSyncMsg(reason==="gesture"?"Cloud saved and synced ✓":reason==="auto"?"Auto-synced ✓":"Cloud saved ✓");
      }
    }catch(e){
      clearUploadPending();
      setSyncStatus(isOnline?"failed":"offline");
      setLastSyncError(String((e&&e.message)||e));
      setSyncMsg("Cloud save failed — data is safe on this device");
    }
    setSyncOp(null);
    savingRef.current=false;
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const saveToCloudRef=useRef(saveToCloud);
  useEffect(()=>{saveToCloudRef.current=saveToCloud;});

  /* ── Autosave to cloud — idle-debounced with a hard ceiling ──────────────
     Fires 8s after the last edit, but never waits more than 45s from the
     *first* pending edit in a burst — so a steady stream of edits still
     syncs periodically instead of postponing forever. This keeps writes far
     under Cloudflare KV's free-tier 1,000/day cap: a normal day of entering
     transactions lands around a few dozen writes, not one per keystroke. */
  /* ── Immediate push for completed actions ────────────────────────────────
     The idle autosave above is for typing (debounced 8–45s so a burst of
     keystrokes doesn't spam the cloud). Discrete completed actions —
     add/edit/delete a transaction, a goal contribution, a bank balance
     commit, a trade, a salary update, any modal's Save button — shouldn't
     wait on that: call pushImportant() right after the setData that
     performs the action. The short delay (not 0) exists only to let the
     state update actually land in dataRef.current before saveToCloud reads
     it; it is not a "wait for more edits" debounce like the idle autosave. */
  const pushImportantTimerRef=useRef(null);
  const pushImportant=()=>{
    if(!loaded||!kvReady)return;
    if(importPendingRef.current)return; // an import is waiting for an explicit Save to Cloud
    if(pushImportantTimerRef.current)clearTimeout(pushImportantTimerRef.current);
    pushImportantTimerRef.current=setTimeout(()=>{
      pushImportantTimerRef.current=null;
      // supersede the idle-autosave timer so this doesn't double-fire
      if(autosaveTimerRef.current){clearTimeout(autosaveTimerRef.current);autosaveTimerRef.current=null;}
      autosaveFirstPendingRef.current=null;
      if(hasUnsyncedRef.current&&!savingRef.current)saveToCloudRef.current("auto");
    },300);
  };
  const pushImportantRef=useRef(pushImportant);
  useEffect(()=>{pushImportantRef.current=pushImportant;});

  const AUTOSAVE_IDLE_MS=8000,AUTOSAVE_MAX_WAIT_MS=45000;
  const autosaveTimerRef=useRef(null);
  const autosaveFirstPendingRef=useRef(null);
  useEffect(()=>{
    if(!loaded||!kvReady)return;
    if(importPending)return; // held until the user explicitly saves the import
    if(!hasUnsyncedChanges){
      autosaveFirstPendingRef.current=null;
      if(autosaveTimerRef.current){clearTimeout(autosaveTimerRef.current);autosaveTimerRef.current=null;}
      return;
    }
    if(!autosaveFirstPendingRef.current)autosaveFirstPendingRef.current=Date.now();
    const elapsed=Date.now()-autosaveFirstPendingRef.current;
    const delay=Math.min(AUTOSAVE_IDLE_MS,Math.max(0,AUTOSAVE_MAX_WAIT_MS-elapsed));
    if(autosaveTimerRef.current)clearTimeout(autosaveTimerRef.current);
    autosaveTimerRef.current=setTimeout(()=>{
      autosaveFirstPendingRef.current=null;
      if(hasUnsyncedRef.current&&!savingRef.current)saveToCloudRef.current("auto");
    },delay);
    return()=>{if(autosaveTimerRef.current)clearTimeout(autosaveTimerRef.current);};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[changesSinceSave,hasUnsyncedChanges,loaded,kvReady,importPending]);

  /* ── Flush on background/close ────────────────────────────────────────
     Two different signals, two different levels of safety:
     • visibilitychange→hidden fires when the app is backgrounded (home
       button, app switcher, tab switch) but the page process usually
       keeps running for at least a moment afterward — enough time for the
       normal saveToCloud() path, which checks for conflicts and merges
       before overwriting the cloud (same protection the manual Save
       button has).
     • pagehide fires when the page is actually being torn down (closed,
       navigated away, or the OS reclaiming it) — there may be near-zero
       execution time left, so this uses a raw best-effort
       fetch(...,{keepalive:true}) instead. keepalive is designed to
       survive teardown, unlike a plain fetch or a React state update;
       custom headers (needed for the sync token) rule out
       navigator.sendBeacon, which only supports simple bodies.
     The pagehide beacon does NOT check for conflicts — there's no time to
     round-trip a check-then-merge-then-retry — so it's sent with the
     device's current baseline `rev`; the server now rejects it outright
     (no write at all) rather than overwriting if that rev is stale, which
     is strictly safer than the old always-accepts behavior. Because the
     response can't be awaited during teardown, this deliberately does NOT
     mark the change as synced — that was a false-synced-state bug (the
     beacon could silently fail or be rejected and the UI would still claim
     "saved"). It only sets pendingUpload durably; hasUnsyncedChanges is
     left exactly as it already was, so the next launch/resume verifies
     against the cloud for real instead of taking teardown's word for it.
     Browsers also cap keepalive body size (historically ~64KB), a second
     reason this is a safety net on top of — not a replacement for — the
     idle autosave above and the automatic-refresh-on-resume below. */
  const flushToCloudBeacon=()=>{
    if(!kvReady||!cloudConfirmedRef.current||!hasUnsyncedRef.current)return;
    if(importPendingRef.current)return; // never let teardown upload an unreviewed import
    try{
      const payload=dataRef.current;
      const body=JSON.stringify({data:payload,savedAt:new Date().toISOString(),rev:localRevRef.current||0});
      fetch(`${PROXY_URL}/sync`,{method:"POST",headers:KVSync._headers(),body,keepalive:true}).catch(()=>{});
      // Durable "in flight" marker only — never optimistically claim
      // synced here (see comment above). The next launch/resume's cloud
      // check reconciles the real outcome either way.
      const fp=fingerprint(payload);
      const meta=loadSyncMeta();
      meta.pendingUpload=true;meta.pendingUploadFP=fp;
      saveSyncMeta(meta);
    }catch(e){}
  };
  useEffect(()=>{
    if(!loaded)return;
    const onVisibility=()=>{
      if(document.visibilityState==="hidden"){
        if(hasUnsyncedRef.current&&!savingRef.current&&!importPendingRef.current)saveToCloudRef.current("auto");
      }else if(document.visibilityState==="visible"){
        checkCloudOnActivateRef.current();
        refreshMarketDataRef.current();
      }
    };
    const onFocus=()=>{checkCloudOnActivateRef.current();refreshMarketDataRef.current();};
    window.addEventListener("visibilitychange",onVisibility);
    window.addEventListener("focus",onFocus);
    window.addEventListener("pagehide",flushToCloudBeacon);
    return()=>{
      window.removeEventListener("visibilitychange",onVisibility);
      window.removeEventListener("focus",onFocus);
      window.removeEventListener("pagehide",flushToCloudBeacon);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[loaded]);

  /* ── Ctrl+S / Cmd+S — save & sync to cloud without reaching for the mouse ── */
  useEffect(()=>{
    const onKeyDown=e=>{
      if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==="s"||e.key==="S")){
        e.preventDefault();
        saveToCloudRef.current();
      }
    };
    window.addEventListener("keydown",onKeyDown);
    return()=>window.removeEventListener("keydown",onKeyDown);
  },[]);

  /* ── manual Pull from Cloud — GET only, never POSTs ──────────────────── */
  const pullFromCloud=async()=>{
    /* A pull *merges*, so pulling on top of a held import would fold the
       imported records into the cloud copy — neither "keep the import" nor
       "throw it away", and impossible to explain. While a decision is
       outstanding the only two answers are Save to Cloud (share it) or
       Restore previous local copy (undo it), so refuse and say which. */
    if(importPendingRef.current){
      setSyncMsg("Finish the import first — Save to Cloud, or restore your previous copy");
      setTimeout(()=>setSyncMsg(""),4000);return;
    }
    if(!kvReady){setSyncMsg("Enter your sync passphrase in Settings first");setTimeout(()=>setSyncMsg(""),3000);return;}
    if(!isOnline){setSyncStatus("offline");setSyncMsg("Offline — can't pull right now");setTimeout(()=>setSyncMsg(""),3000);return;}
    setSyncOp("pull");setSyncMsg("Pulling…");
    try{
      const remoteEnvelope=await KVSync.load();
      const remoteRaw=remoteEnvelope&&remoteEnvelope.data;
      const problem=cloudDocProblem(remoteRaw);
      if(problem){
        /* Keep local, adopt nothing, advance no rev. An explicit Pull that
           refuses has to say why on screen — this is the one path the person
           deliberately asked for and is standing there watching. Pushing goes
           back on hold too: we now know the cloud can't be reconciled with. */
        cloudUnreadableRef.current=problem;
        cloudConfirmedRef.current=false;
        setSyncStatus("failed");
        setLastSyncError(problem);
        setSyncMsg("Cloud copy is unreadable — kept this device's data");
      }else if(remoteRaw){
        cloudUnreadableRef.current=null;
        /* The document has now been READ and VALIDATED, which is the only
           thing that may enable pushing. Passphrase acceptance at /sync/meta
           is not evidence about the document — the connect effect used to set
           this flag purely on that, which is how a device could push before it
           knew what it was pushing over. */
        cloudConfirmedRef.current=true;
        const remoteMigrated=migrate(remoteRaw);
        const remoteRev=Number.isFinite(remoteEnvelope.rev)?remoteEnvelope.rev:localRevRef.current;
        const localFP=fingerprint(dataRef.current);
        const remoteFP=fingerprint(remoteMigrated);
        if(localFP===remoteFP){
          lastCloudSnapshotRef.current=remoteFP;
          cacheSyncedSnapshot(remoteMigrated);
          const now=new Date();
          const meta=loadSyncMeta();meta.hasUnsyncedChanges=false;meta.lastCloudSnapshot=remoteFP;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.localRev=remoteRev;saveSyncMeta(meta);
          setHasUnsyncedChanges(false);
          setLastCloudPulledAt(now);
          setLocalRev(remoteRev);
          setCloudRev(remoteRev);
          setSyncStatus("synced");
          // Identical to the cloud — nothing manufactured survives here either.
          clearSampleMark();
          setSyncMsg("Already up to date ✓");
        }else{
          /* Before merging, ask whether merging is even the right verb. Without
             a baseline these two documents share no ancestor, so their union is
             not a reconciliation — it is this device's contents added to
             somebody else's document. See syncConnectDecision. */
          const m0=loadSyncMeta();
          const decision=syncConnectDecision({
            hasBaseline:m0.lastCloudSnapshot!=null,
            provenance:getProvenance(),
            localHasRecords:countLocalRecords(dataRef.current)>0,
            localDiffersInSettings:settingsSignature(dataRef.current)!==settingsSignature(remoteMigrated),
            remoteExists:true,
          });
          if(decision.action==="adopt"){
            adoptCloudDoc(remoteMigrated,remoteFP,remoteRev,decision.banner);
            setSyncOp(null);setTimeout(()=>setSyncMsg(""),3000);
            return;
          }
          if(decision.action==="ask"){
            /* Hold. Not a conflict — the conflict modal describes two devices
               that diverged from a shared baseline, and that is precisely what
               has not happened here. Nothing is written and nothing is pushed
               until the person answers. */
            setSyncMsg("");
            setSyncStatus("pending");
            setFirstConnect({local:dataRef.current,remote:remoteMigrated,remoteFP,remoteRev});
            setSyncOp(null);
            return;
          }
          const merged=tryAutoMergeAll(dataRef.current,remoteMigrated);
          if(merged){
            const mergedFP=fingerprint(merged);
            const stillDirty=mergedFP!==remoteFP;
            /* A manufactured document stops being manufactured once none of it
               survived the merge — which is what a reset device's first pull
               achieves, and is what stops it being held back from syncing
               forever.

               The test is RECORD COUNT, not `stillDirty`. Gating on stillDirty
               looked right and left the device held anyway: a reset device
               keeps its preferences, so the merged result differs from a cloud
               document that happens to carry fewer settings fields, and it is
               never byte-equal no matter how correct it is. Counting records
               asks the question that actually matters — did this device add
               anything of its own? A reset device adds nothing; sample data
               merged onto an established device adds fifteen categories and
               must stay held. */
            if(countLocalRecords(merged)<=countLocalRecords(remoteMigrated))clearSampleMark();
            stashPreCloudBackup(dataRef.current,"before merging cloud changes");
            skipSave.current=true;
            setData(merged);
            try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
            lastCloudSnapshotRef.current=remoteFP;
            cacheSyncedSnapshot(remoteMigrated);
            const now=new Date();
            const meta=loadSyncMeta();meta.hasUnsyncedChanges=stillDirty;meta.lastCloudSnapshot=remoteFP;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.localRev=remoteRev;saveSyncMeta(meta);
            setHasUnsyncedChanges(stillDirty);setLastCloudPulledAt(now);setLocalRev(remoteRev);setCloudRev(remoteRev);
            setSyncStatus(stillDirty?"pending":"synced");
            setSyncMsg(stillDirty?"Merged with cloud changes — syncing…":"Cloud data loaded ✓");
            // Close the loop: a merge means both devices had edits, so push
            // the merged result straight back rather than leaving it
            // sitting here as "pending" until the person happens to notice
            // and hits Save — that's exactly the manual step this feature
            // is meant to remove. Short delay lets the state above land in
            // dataRef.current first (pushImportant already does the same).
            if(stillDirty)setTimeout(()=>{if(!savingRef.current)saveToCloudRef.current("auto");},350);
          }else{
            setSyncMsg("");
            setSyncStatus("stale");
            setConflict({local:dataRef.current,remote:remoteMigrated,remoteSavedAt:remoteEnvelope.savedAt,remoteRev,remoteWriter:remoteEnvelope.lastWriter||null});
          }
        }
      }else{
        setSyncMsg("Nothing saved yet — will sync on next Save to Cloud");
      }
    }catch(e){
      setSyncStatus(isOnline?"failed":"offline");
      setLastSyncError(String((e&&e.message)||e));
      setSyncMsg("Pull failed — using local data");
    }
    setSyncOp(null);
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const pullFromCloudRef=useRef(pullFromCloud);
  useEffect(()=>{pullFromCloudRef.current=pullFromCloud;});

  /* ── First pull after connecting a device ────────────────────────────────
     The boot effect runs once with [], so a device that started without a
     passphrase never reaches the cloud until something asks it to. Entering
     the passphrase in Settings has to behave like a reload: pull straight
     away, or the device sits on its local-only copy until the person happens
     to hit Pull. Skips the initial mount, so a device that already had a
     passphrase doesn't pull twice on open.

     It deliberately does NOT set cloudConfirmedRef any more. Connecting means
     the Worker accepted the passphrase at /sync/meta — an authentication fact,
     which says nothing at all about the document. This effect used to flip the
     flag right here, so a device that had never read the cloud was already
     cleared to push over it; combined with a fresh origin booting on sample
     data, that was the contamination path. pullFromCloud now sets the flag
     itself, and only after a full /sync response has passed cloudDocProblem
     and been reconciled. */
  const wasSyncTokenSet=useRef(syncTokenSet);
  useEffect(()=>{
    const justConnected=syncTokenSet&&!wasSyncTokenSet.current;
    wasSyncTokenSet.current=syncTokenSet;
    if(!justConnected||!loaded)return;
    pullFromCloudRef.current();
  },[syncTokenSet,loaded]);

  /* ── Automatic cloud refresh on activate ─────────────────────────────────
     This is the actual fix for "edited on iPhone, iPad still shows old
     data": every place the app can become active again (tab/app
     foregrounded, window focus, reconnecting after offline) now fires a
     *cheap* GET /sync/meta — just {savedAt, rev}, no dataset transfer — and
     only escalates to a real pull when the returned rev is actually ahead
     of what this device last reconciled. That escalation reuses
     pullFromCloud() itself (not a second copy of the merge logic): clean
     match → adopt; both sides changed → auto-merge; genuinely unmergeable
     → the same conflict modal manual pull already uses. So the person
     never has to remember to hit Sync when switching devices — the check
     just happens whenever the app comes back to the foreground. Throttled
     so rapid focus/visibility events (both can fire together) don't double
     up, and skipped outright while a push/pull is already in flight. */
  const syncOpRef=useRef(null);
  useEffect(()=>{syncOpRef.current=syncOp;},[syncOp]);
  const ACTIVATE_CHECK_MIN_INTERVAL_MS=4000;
  const lastActivateCheckRef=useRef(0);
  const checkCloudOnActivate=async()=>{
    if(!kvReady||!cloudConfirmedRef.current)return;
    if(importPendingRef.current)return; // silent: a passive check must not nag about a held import
    if(!(typeof navigator==="undefined"?true:navigator.onLine))return;
    if(syncOpRef.current||savingRef.current)return;
    const now=Date.now();
    if(now-lastActivateCheckRef.current<ACTIVATE_CHECK_MIN_INTERVAL_MS)return;
    lastActivateCheckRef.current=now;
    try{
      const meta=await KVSync.checkMeta();
      if(!meta)return; // network hiccup on a background check — not worth surfacing an error
      const remoteRev=Number.isFinite(meta.rev)?meta.rev:0;
      setCloudRev(remoteRev);
      if(remoteRev===localRevRef.current)return; // already fully caught up
      setSyncStatus("stale");
      await pullFromCloudRef.current();
    }catch(e){/* silent — this is a passive background check, not a user action */}
  };
  const checkCloudOnActivateRef=useRef(checkCloudOnActivate);
  useEffect(()=>{checkCloudOnActivateRef.current=checkCloudOnActivate;});

  /* ── network status ──────────────────────────────────────────────────────
     navigator.onLine mirror, so "Offline" shows immediately rather than
     waiting for a fetch to time out — and reconnecting fires the same
     activation check, so data catches up the moment connectivity returns. */
  useEffect(()=>{
    const onOnline=()=>{setIsOnline(true);checkCloudOnActivateRef.current();refreshMarketDataRef.current();};
    const onOffline=()=>{setIsOnline(false);setSyncStatus("offline");};
    window.addEventListener("online",onOnline);
    window.addEventListener("offline",onOffline);
    return()=>{window.removeEventListener("online",onOnline);window.removeEventListener("offline",onOffline);};
  },[]);

  /* ── conflict resolution actions ──────────────────────────────────────────
     Two actions, because there are two outcomes. There used to be three
     buttons: "Keep Local" and "Save Local to Cloud" both adopted the remote rev
     and pushed the local document — the same result by two routes, one
     fire-and-forget and one awaited — and the modal admitted as much in its own
     button text ("Same result as the green button below"). Offering the same
     outcome twice, in a dialog that only appears when something has already
     gone wrong, is a way to make a person choose wrongly. */
  const resolveUseCloud=()=>{
    if(!conflict)return;
    stashPreCloudBackup(dataRef.current,"before replacing with the cloud copy");
    const remoteMigrated=conflict.remote;
    skipSave.current=true;
    setData(remoteMigrated);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(remoteMigrated));}catch(e){}
    const fp=fingerprint(remoteMigrated);
    lastCloudSnapshotRef.current=fp;
    cacheSyncedSnapshot(remoteMigrated);
    const now=new Date();
    const rev=Number.isFinite(conflict.remoteRev)?conflict.remoteRev:localRevRef.current;
    const meta=loadSyncMeta();meta.hasUnsyncedChanges=false;meta.lastCloudSnapshot=fp;meta.lastCloudPulledAt=now.toISOString();meta.lastCloudDownloadAt=meta.lastCloudPulledAt;meta.changesSinceSave=0;meta.localRev=rev;saveSyncMeta(meta);
    setHasUnsyncedChanges(false);
    setChangesSinceSave(0);
    setLastCloudPulledAt(now);
    setLocalRev(rev);
    setCloudRev(rev);
    setSyncStatus("synced");
    setConflict(null);
    setSyncMsg("Cloud data loaded ✓");
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const resolveSaveLocalToCloud=async()=>{
    /* Keep this device's data and push it. Adopting the remote rev first is
       what stops the very next save from conflicting again on the same
       baseline; localRevRef is set synchronously, not just through setLocalRev,
       because saveToCloud reads the ref rather than React state. */
    if(conflict&&Number.isFinite(conflict.remoteRev)){
      localRevRef.current=conflict.remoteRev;
      setLocalRev(conflict.remoteRev);
      setCloudRev(conflict.remoteRev);
    }
    setConflict(null);
    await saveToCloud();
  };

  /* ── First-connection chooser outcomes ───────────────────────────────────
     All three clear firstConnect, which is what un-blocks saveToCloud. Until
     one of them runs, this device pushes nothing at all. ─────────────────── */
  const firstConnectUseCloud=()=>{
    const info=firstConnectRef.current;
    if(!info)return;
    setFirstConnect(null);firstConnectRef.current=null;
    adoptCloudDoc(info.remote,info.remoteFP,info.remoteRev,false);
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const firstConnectMerge=async()=>{
    const info=firstConnectRef.current;
    if(!info)return;
    /* Merge, never overwrite. The union of two documents with no shared
       ancestor keeps both sides whole, which is the only outcome that is safe
       to offer from a device that cannot show what it would be replacing. */
    const merged=tryAutoMergeAll(dataRef.current,info.remote)||info.remote;
    stashPreCloudBackup(dataRef.current,"before merging with the cloud copy");
    clearSampleMark();
    skipSave.current=true;
    setData(merged);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));}catch(e){}
    /* Adopt the remote rev first so the push lands as a normal CAS update
       against the revision we actually read, rather than racing from 0 and
       being rejected — the same reason resolveSaveLocalToCloud does it. */
    if(Number.isFinite(info.remoteRev)){
      localRevRef.current=info.remoteRev;
      setLocalRev(info.remoteRev);
      setCloudRev(info.remoteRev);
    }
    /* Give this device a baseline: it has now reconciled with the cloud, so
       every later divergence is a real merge rather than another first
       connection. */
    lastCloudSnapshotRef.current=info.remoteFP;
    cacheSyncedSnapshot(info.remote);
    const m=loadSyncMeta();m.lastCloudSnapshot=info.remoteFP;m.localRev=info.remoteRev;m.hasUnsyncedChanges=true;saveSyncMeta(m);
    setFirstConnect(null);firstConnectRef.current=null;
    setHasUnsyncedChanges(true);
    // Let the setData above land in dataRef.current before saveToCloud reads
    // it — the same short delay pullFromCloud and pushImportant use.
    setTimeout(()=>{if(!savingRef.current)saveToCloudRef.current("gesture");},350);
  };
  const firstConnectLater=()=>{
    setFirstConnect(null);firstConnectRef.current=null;
    /* Nothing was adopted and nothing was pushed, and there is still no
       baseline — so the next pull asks again. That repetition is correct: the
       question hasn't been answered, and quietly dropping it is how a device
       ends up silently unsynced for weeks. */
    setSyncStatus("pending");
    setSyncMsg("Left unsynced — you'll be asked again next time you pull");
    setTimeout(()=>setSyncMsg(""),4000);
  };

  /* ── pull-to-refresh ──────────────────────────────────────────────────────
     Standard mobile pattern: dragging down from the very top of the page
     triggers a sync pull. pullDist drives the visible indicator; the touch
     math lives in refs so the listeners don't need to be re-attached on
     every move (only pullDist is state, purely for rendering). ─────────── */
  const PULL_THRESHOLD=68,PULL_MAX=110;
  const[pullDist,setPullDist]=useState(0);
  const pullStartY=useRef(null);
  const pullArmed=useRef(false);
  const pullDistRef=useRef(0);
  /* Phase shown by the pull-to-sync indicator AFTER the existing cloud
     save/pull step (syncOp) resolves: null while idle, then
     "rates"→"quotes" while refreshMarketDataIfStale({force:true}) runs its
     two sub-phases, then "done"/"error"/"offline" briefly before fading.
     Kept as its own tiny piece of state rather than folding into syncOp so
     syncOp's existing push/pull meaning (read elsewhere) is untouched. */
  const[pullPhase,setPullPhase]=useState(null);
  useEffect(()=>{
    const atTop=()=>(window.scrollY||document.documentElement.scrollTop||0)<=0;
    const onStart=e=>{
      if(!atTop()){pullArmed.current=false;return;}
      pullStartY.current=e.touches[0].clientY;
      pullArmed.current=true;
    };
    const onMove=e=>{
      if(!pullArmed.current||pullStartY.current==null)return;
      if(!atTop()){pullArmed.current=false;pullDistRef.current=0;setPullDist(0);return;}
      const dy=e.touches[0].clientY-pullStartY.current;
      if(dy<=0){pullDistRef.current=0;setPullDist(0);return;}
      e.preventDefault();
      const val=Math.min(PULL_MAX,dy*0.45);
      pullDistRef.current=val;
      setPullDist(val);
    };
    const onEnd=()=>{
      if(pullArmed.current&&pullDistRef.current>=PULL_THRESHOLD){
        // context-aware: pending local changes save first; otherwise this
        // is a plain safe pull. Read handlers via refs so this listener
        // (attached once, on mount) always calls the latest version.
        if(!isOnlineRef.current){
          // no network attempts at all when offline — just say so.
          setPullPhase("offline");
          setTimeout(()=>setPullPhase(null),1600);
        }else{
          const cloudStep=hasUnsyncedRef.current?saveToCloudRef.current("gesture"):pullFromCloudRef.current();
          Promise.resolve(cloudStep)
            .then(()=>refreshMarketDataRef.current({force:true,onPhase:setPullPhase}))
            .then(({failed})=>{
              setPullPhase(failed?"error":"done");
              setTimeout(()=>setPullPhase(null),1600);
            })
            .catch(()=>{setPullPhase("error");setTimeout(()=>setPullPhase(null),1600);});
        }
      }
      pullArmed.current=false;
      pullStartY.current=null;
      pullDistRef.current=0;
      setPullDist(0);
    };
    window.addEventListener("touchstart",onStart,{passive:true});
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onEnd,{passive:true});
    window.addEventListener("touchcancel",onEnd,{passive:true});
    return()=>{
      window.removeEventListener("touchstart",onStart);
      window.removeEventListener("touchmove",onMove);
      window.removeEventListener("touchend",onEnd);
      window.removeEventListener("touchcancel",onEnd);
    };
  },[]);

  /* which owner is active in Budget/Expenses tabs — budgetOwner/setBudgetOwner
     declared near the top of App() alongside the device-remembered default. */

  /* Currency converter selections — lifted here so they persist across tab switches */
  const[fxAmount,setFxAmount]=useState(100);
  const[fxFrom,setFxFrom]=useState("USD");
  const[fxTo,setFxTo]=useState("SAR");

  /* Active plan for each owner. Since the carry-forward chain landed this is
     the ROOT of that chain — what a month earlier than the owner's first
     monthlyPlans mapping resolves to — NOT "the plan the current month edits".
     Every month now copy-on-writes its own plan on first edit, so don't
     reintroduce an assumption that editing today writes here. */
  const plans=(data.plans||[]).filter(p=>!p.deletedAt);
  const activePlanId=data.activePlanId||{me:plans[0]?.id,wife:null};
  /* livePlanView here too: this is the one plan that does NOT come through
     resolvePlanForMonth, and it feeds the header income field and `allocated`.
     Without it those would count tombstoned categories. */
  const plan=livePlanView(plans.find(p=>p.id===activePlanId[budgetOwner])||
             plans.find(p=>p.owner===budgetOwner)||
             plans[0]);
  const cur=data.currency;

  /* plan mutators — always operate on current budgetOwner's plan */
  const patchPlan=patch=>setData(d=>({...d,plans:d.plans.map(p=>p.id===plan.id?{...p,...patch,updatedAt:new Date().toISOString()}:p)}));
  const setCats=cats=>patchPlan({categories:cats});
  const setGrps=gs=>patchPlan({groups:gs});
  const updateCat=(id,patch)=>setCats(plan.categories.map(c=>c.id===id?{...c,...patch}:c));
  const addCat=gid=>setCats([...plan.categories,{id:uid(),name:"New category",amount:0,groupId:gid,color:SEG[plan.categories.length%SEG.length],subs:[],trackExpenses:true}]);
  const removeCat=id=>setCats(plan.categories.filter(c=>c.id!==id));
  const addSub=catId=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:[...(c.subs||[]),{id:uid(),name:"New item",amount:0}]}:c));
  const updateSub=(catId,subId,patch)=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:(c.subs||[]).map(s=>s.id===subId?{...s,...patch}:s)}:c));
  const removeSub=(catId,subId)=>setCats(plan.categories.map(c=>c.id===catId?{...c,subs:(c.subs||[]).filter(s=>s.id!==subId)}:c));
  const addGroup=()=>setGrps([...plan.groups,{id:uid(),name:"New group"}]);
  const renameGroup=(id,name)=>setGrps(plan.groups.map(g=>g.id===id?{...g,name}:g));
  const removeGroup=id=>{setCats(plan.categories.filter(c=>c.groupId!==id));setGrps(plan.groups.filter(g=>g.id!==id));};

  /* add a new plan for the current owner */
  const addPlan=()=>{
    const id=uid();
    setData(d=>({...d,
      activePlanId:{...activePlanId,[budgetOwner]:id},
      plans:[...d.plans,{id,owner:budgetOwner,name:"New plan",month:monthLabel(),
        income:0,groups:[{id:uid(),name:"General"}],categories:[],updatedAt:new Date().toISOString()}]
    }));
    setPlanMenu(false);
  };
  const removePlan=id=>setData(d=>{
    const ownerPlans=(d.plans||[]).filter(p=>!p.deletedAt&&p.owner===budgetOwner);
    if(ownerPlans.length<=1)return d;
    const remaining=(d.plans||[]).filter(p=>!p.deletedAt&&p.id!==id);
    const fallback=remaining.find(p=>p.owner===budgetOwner)?.id||remaining[0]?.id;
    return{...d,
      plans:d.plans.map(p=>p.id===id?{...p,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:p),
      activePlanId:{...activePlanId,[budgetOwner]:fallback}};
  });
  const renamePlan=(id,name)=>setData(d=>({...d,plans:d.plans.map(p=>p.id===id?{...p,name,updatedAt:new Date().toISOString()}:p)}));
  const switchPlan=id=>setData(d=>({...d,activePlanId:{...activePlanId,[budgetOwner]:id}}));

  /* The by-plan-id mutators (patchPlanById/setCatsFor/setGrpsFor) are gone.
     They took a plan id, which meant every call site had already decided which
     plan it was editing — and for a carried-forward month that decision was
     silently "the plan every other month is inheriting". editPlanForMonth
     below takes a MONTH instead, so the copy-on-write decision is made in one
     place rather than at a dozen call sites. */

  /* ── monthly budget plans ──
     monthlyPlans: [{ month:"2026-06", planId:"p1" }]
     Maps each calendar month to a specific budget plan.
     Falls back to activePlanId when no mapping exists. An unassignment is
     itself an upsert (planId:null, deletedAt set) rather than a hard removal,
     so it merges like any other edit instead of a stale copy on the other
     device silently reinstating the old mapping. */
  const monthlyPlans=(data.monthlyPlans||[]).filter(m=>!m.deletedAt&&m.planId);

  /* owner-aware: find the plan for a given month + owner. planForMonth keeps
     its exact old signature so every read-side caller (trackedSpendingFor,
     savingsInvestingFor, bucketHistoryFor, renderTxRow, TargetsView) is
     untouched; planSourceForMonth is for the Budget/Expenses banners, which
     need to say WHERE the plan came from. */
  const planSourceForMonth=(mo,owner=budgetOwner)=>
    resolvePlanForMonth(monthlyPlans,mo,owner,activePlanId,plans);
  const planForMonth=(mo,owner=budgetOwner)=>planSourceForMonth(mo,owner).plan;

  /* Categories an installment payment may be funded out of. A function of the
     DATE the money moved, not of "now": the payment sheet lets you back-date,
     and the envelope it comes from must be the one that bucket actually had.
     Owner-scoped by construction — it only ever reads that owner's plan chain,
     which is what stops a payment being funded from the other person's budget. */
  const fundingCategoriesFor=(dateISO,owner=budgetOwner)=>{
    const pl=planForMonth(bucketKeyFor(dateISO||todayISO(),data.payPeriods,owner),owner);
    const groupName=new Map(((pl&&pl.groups)||[]).map(g=>[g.id,g.name||""]));
    return((pl&&pl.categories)||[]).filter(c=>c&&!c.deletedAt)
      .map(c=>({id:c.id,name:c.name||"Untitled",groupName:groupName.get(c.groupId)||""}));
  };

  const assignPlanToMonth=(mo,planId,owner=budgetOwner)=>setData(d=>({
    ...d,
    monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId,updatedAt:new Date().toISOString()}]
  }));

  const clonePlanForMonth=(mo,sourcePlanId,owner=budgetOwner,label)=>{
    /* No `||plans[0]` fallback: that silently copied the *global* first plan —
       frequently the other owner's — whenever the id didn't resolve (a plan
       soft-deleted here or tombstoned by a sync from another device), then
       stamped `owner` on it so the result looked legitimate. Better to do
       nothing than to fabricate a plausible wrong budget. */
    const source=plans.find(p=>p.id===sourcePlanId);
    if(!source)return null;
    const cloned=clonePlanRecord(source,uid,owner,label,mo);
    cloned.updatedAt=new Date().toISOString();
    setData(d=>({
      ...d,
      plans:[...d.plans,cloned],
      monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId:cloned.id,updatedAt:new Date().toISOString()}]
    }));
    return cloned.id;
  };

  /* ── Copy-on-write, silent ────────────────────────────────────────────────
     Applies `mutate(plan)` to whichever plan owns `mo`, materialising a copy
     first if that month has no mapping of its own. This is the single choke
     point every budget mutator goes through; routing each call site
     individually would mean a dozen places that each have to remember the
     clone decision, and one of them forgetting means an edit to a future month
     silently rewrites the base plan for every other month.

     Clone and edit land in ONE setData on purpose. A half-materialised month —
     mapping written, edit not — renders as an empty custom budget for one
     debounce tick and can be persisted in that state if the app is closed.

     Everything reads off the `d` handed to the updater rather than closed-over
     render values, so two mutators fired in the same handler chain correctly.

     The no-op guard is load-bearing, not defensive tidiness: NumField commits
     whenever a draft exists, and re-typing the SAME number still commits.
     Without it, tapping an amount in a past month and typing what was already
     there materialises a plan for that month — which is the "paging must write
     nothing" rule leaking one step downstream. ──────────────────────────── */
  const editPlanForMonth=(mo,owner,label,mutate)=>{
    setData(d=>{
      const now=new Date().toISOString();
      const maps=d.monthlyPlans||[];
      const own=maps.find(m=>m.month===mo&&m.owner===owner&&!m.deletedAt&&m.planId);
      if(own){
        let changed=false;
        const next=(d.plans||[]).map(p=>{
          if(p.id!==own.planId)return p;
          const m=mutate(p);
          if(!m||JSON.stringify(m)===JSON.stringify(p))return p;
          changed=true;
          // Per-record stamps go on here, once, rather than in each mutator.
          return{...stampPlanRecords(p,m,now),updatedAt:now};
        });
        return changed?{...d,plans:next}:d;
      }
      const live=(d.plans||[]).filter(p=>!p.deletedAt);
      const{plan:src}=resolvePlanForMonth(maps,mo,owner,d.activePlanId||{},live);
      if(!src)return d;
      // preserveIds is mandatory here: `mutate` was built by the UI against the
      // INHERITED plan, so it targets that plan's category/group/sub ids. A
      // renumbered clone makes every id-targeted edit a silent no-op.
      const cloned=clonePlanRecord(src,uid,owner,label,mo,{preserveIds:true});
      const edited=mutate(cloned);
      // Compare against the CLONE, not the source — the clone legitimately has
      // fresh ids throughout, so comparing to the source would always differ
      // and every no-op would materialise a plan.
      if(!edited||JSON.stringify(edited)===JSON.stringify(cloned))return d;
      return{...d,
        plans:[...d.plans,{...stampPlanRecords(cloned,edited,now),updatedAt:now}],
        monthlyPlans:[...maps.filter(m=>!(m.month===mo&&m.owner===owner)),
                      {month:mo,owner,planId:cloned.id,updatedAt:now}]};
    });
  };

  const removePlanForMonth=(mo,owner=budgetOwner)=>setData(d=>({
    ...d,monthlyPlans:[...(d.monthlyPlans||[]).filter(m=>!(m.month===mo&&m.owner===owner)),{month:mo,owner,planId:null,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]
  }));

  /* goals */
  const goals=(data.goals||[]).filter(g=>!g.deletedAt);
  /* `patch` overrides any of the defaults and returns the new goal's id, which
     is what lets the Purchase Advisor create a fully-formed savings goal in one
     step — the mirror of addInstallment returning its id. Called with one
     argument it behaves exactly as it always did. Deliberately still ONE way to
     create a goal: a second constructor is how the three goal-contribution
     paths drifted apart before applyGoalContribution was made the only writer. */
  const addGoal=(owner,patch)=>{
    const id=uid();
    setData(d=>({...d,goals:[...d.goals,{id,owner,name:"New goal",type:"savings",target:10000,
      contributions:[],monthly:500,color:SEG[d.goals.length%SEG.length],
      ...(patch||{}),updatedAt:new Date().toISOString()}]}));
    pushImportantRef.current();
    return id;
  };
  const updateGoal=(id,patch)=>setData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,...patch,updatedAt:new Date().toISOString()}:g)}));
  const removeGoal=id=>{
    const g=(data.goals||[]).find(x=>x.id===id);
    setData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}:g)}));
    if(g)triggerUndo(`Deleted goal "${g.name||"Goal"}"`,{collection:"goals",id});
    pushImportantRef.current();
  };
  /* THE one way money reaches a goal. Every UI path calls this — the Goals
     tab, Home's sheet, and the add-transaction modal's Goals mode — so the
     same action means the same thing everywhere, and the ledger row and the
     contribution can never be persisted half-written. See
     applyGoalContribution at module scope for why they link by id.

     `addContribution` is deliberately GONE rather than kept alongside: leaving
     a goal-only writer in place is exactly how the three paths drifted apart,
     and a second entry point would silently reintroduce the bug. */
  const contributeToGoal=({goalId,amount,note="",date,owner,name})=>{
    const now=new Date().toISOString();
    setData(d=>applyGoalContribution(d,{goalId,amount,note,
      date:date||now.slice(0,10),owner,name,
      expenseId:uid(),contributionId:uid(),now}));
    pushImportantRef.current();
  };
  const removeContribution=(goalId,cid)=>{
    const now=new Date().toISOString();
    setData(d=>applyGoalContributionDeleteByContribution(d,{goalId,contributionId:cid,now}));
