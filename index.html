     release a protected goal that lives in the same account: the goal has its
     own toggle, and the max() below still withholds what that goal claims. */
  const released=new Set(releasedBankIds||[]);
  const prot=new Set(protectedGoalIds||[]);
  const protectedList=(goals||[]).filter(g=>g&&!g.deletedAt&&(g.owner||"me")===owner&&prot.has(g.id));

  /* ── The withholding is computed PER BANK, and that is the whole design ──
     Goal money lives inside bank balances, so an emergency fund tracked as
     BOTH a reserved account and a protected goal linked to it would be
     subtracted twice by two independent totals — 22,000 withheld from an
     account holding 12,000, driving "available" negative and refusing
     purchases the household can afford. `max`, never a sum: the goal is
     already INSIDE the account, so a reserved account withholds its whole
     balance and the goal it holds costs nothing further. */
  let own=0,joint=0,unconverted=0,withheld=0;
  const inaccessible=[],reserved=[];
  const countedBankIds=new Set();
  (banks||[]).filter(b=>b&&!b.deletedAt).forEach(b=>{
    const mine=b.owner===owner,isJoint=b.owner==="household";
    if(!mine&&!isJoint)return;
    const v=conv(bankValue(b,todayStr),b.currency);
    const value=(v==null||!isFinite(Number(v)))?null:Number(v);
    if(isJoint){
      /* Reported, never added. Scope is per-owner and "household" is not a
         third person; a joint account silently missing from a total is the
         surprise the greyed line on screen exists to prevent. */
      if(value==null)unconverted++;else joint+=value;
      return;
    }
    /* An account you cannot reach is excluded whatever it holds — but it can be
       opted back in for ONE purchase (buying something while in the
       Philippines), which is a per-decision lever living in the draft, never a
       change to the account. */
    if(!bankIsAccessible(b)&&!included.has(b.id)){
      inaccessible.push({id:b.id,name:b.name||"Account",currency:b.currency,
        rawValue:bankValue(b,todayStr),value});
      return;
    }
    if(value==null){unconverted++;return;}
    own+=value;
    countedBankIds.add(b.id);
    const claimed=protectedList.filter(g=>g.bankId===b.id).reduce((s,g)=>s+goalSavedTotal(g),0);
    const isReserved=bankIsReserved(b);
    const reservedAmt=(isReserved&&!released.has(b.id))?value:0;
    const hold=Math.max(reservedAmt,claimed);
    if(hold>0)withheld+=hold;
    if(isReserved)reserved.push({id:b.id,name:b.name||"Account",value,claimed,held:hold,
      released:released.has(b.id)});
  });

  /* Three ways a protected goal's bankId can resolve, and they are NOT the
     same answer:
       • a counted bank of this owner → already folded into that bank's max()
       • a bank that exists but is NOT counted (unreachable, joint, the other
         person's) → subtract NOTHING. Its money was never added to `own`, so
         subtracting it would remove money that isn't there.
       • absent, or pointing at a bank that no longer resolves → subtract from
         the pool, exactly as before this build. We don't know where the money
         sits, and conservative is the right failure direction. */
  const bankById=new Map((banks||[]).filter(b=>b&&!b.deletedAt).map(b=>[b.id,b]));
  let unlinkedProtected=0,notCountedGoals=0;
  protectedList.forEach(g=>{
    if(g.bankId&&countedBankIds.has(g.bankId))return;              // handled per-bank
    if(g.bankId&&bankById.has(g.bankId)){notCountedGoals++;return;} // money isn't in `own`
    unlinkedProtected+=goalSavedTotal(g);
  });

  /* The Bills Reserve is deliberately NOT subtracted here (removed v1.34.0).
     It is a HOUSEHOLD-wide figure and this scope is per-owner, so subtracting
     it took the whole reserve off each person's cash independently — the
     weakest point in the original stack, flagged at design time as "revisit
     only alongside a household-scope conversation". Protecting money that is
     genuinely set aside is now the account flags' job: they are per-owner,
     visible, and releasable per purchase, which the reserve never was. */
  return{banks:own,joint,
    withheld,reserved,inaccessible,
    /* Two counts that are NOT interchangeable, and rendering the wrong one is
       an easy mistake: `protectedGoalCount` is every protected goal, including
       those already withheld via their bank's max(); `unlinkedProtectedCount`
       is only the ones subtracted from the pool, which is what the stack line
       beside `protectedGoals` is describing. */
    protectedGoals:unlinkedProtected,protectedGoalCount:protectedList.length,
    unlinkedProtectedCount:protectedList.filter(g=>!g.bankId||!bankById.has(g.bankId)).length,
    notCountedGoals,unconverted,
    available:own-withheld-unlinkedProtected};
}

/* A hypothetical schedule for a purchase not yet made. The financed total is
   price − downPayment + fees, and the split itself delegates to the SAME
   generateInstallmentSchedule real installments use, so the last-row rounding
   rule is shared rather than reimplemented a cent off. */
function buildPurchaseSchedule({price,downPayment,feesOrInterest,count,firstDueDate}){
  const p=Number(price)||0;
  const dp=Math.max(0,Math.min(p,Number(downPayment)||0));
  const fee=Number(feesOrInterest)||0;
  const financed=roundTo(p-dp+fee,2);
  const rows=generateInstallmentSchedule({firstDueDate,count,total:financed});
  return{financed,downPayment:dp,fees:fee,rows,check:scheduleDiff(financed,rows)};
}

/* The three scenarios. `ctx` is whatever purchaseHeadroomForBucket needs plus
   the already-computed availability stack and `todayStr`; `input` is only what
   the person typed.

   earliest walks forward accumulating max(0, headroom) — a bucket already in
   deficit contributes nothing and never subtracts, because you cannot save
   negative money into a purchase. An existing installment ending inside the
   horizon raises headroom from that bucket on automatically, which is why
   "wait until the Tabby plan finishes" needs no scenario of its own. */
function projectPurchaseScenarios(ctx,input){
  const c=ctx||{},i=input||{};
  const stack=c.stack||{};
  const available=Number(stack.available)||0;
  const price=Number(i.price)||0;
  const nowBucket=bucketKeyFor(c.todayStr,c.payPeriods,c.owner);

  const cash={id:"cash",price,available,feasible:available>=price,
    remainingAfter:available-price};

  let financed=null;
  if(i.financed){
    const sched=buildPurchaseSchedule(i);
    const byBucket=new Map();
    sched.rows.forEach(r=>{
      const k=bucketKeyFor(r.dueDate,c.payPeriods,c.owner);
      byBucket.set(k,(byBucket.get(k)||0)+(Number(r.scheduledAmount)||0));
    });
    const buckets=[...byBucket.keys()].sort().map(k=>{
      const h=purchaseHeadroomForBucket(c,k);
      const obligation=byBucket.get(k);
      return{key:k,income:h.income,baseHeadroom:h.headroom,obligation,
        headroom:h.headroom-obligation};
    });
    financed={id:"financed",financedTotal:sched.financed,fees:sched.fees,
      rows:sched.rows,check:sched.check,buckets,
      deficits:buckets.filter(b=>b.headroom<0),
      upfront:sched.downPayment,
      upfrontFeasible:available>=sched.downPayment,
      availableAfterUpfront:available-sched.downPayment,
      count:sched.rows.length,
      perPayment:sched.rows.length?Number(sched.rows[0].scheduledAmount)||0:0};
  }

  let earliest=null,cumulative=0;
  for(let n=0;n<=PURCHASE_HORIZON_BUCKETS;n++){
    const key=bucketShift(nowBucket,c.payPeriods,c.owner,n);
    if(available+cumulative>=price){
      const shortfall=Math.max(0,price-available);
      earliest={id:"earliest",bucketKey:key,n,cumulative,shortfall,
        requiredPerBucket:n>0?shortfall/n:0};
      break;
    }
    cumulative+=Math.max(0,purchaseHeadroomForBucket(c,key).headroom);
  }

  const savings=purchaseSavingsPlan(c,{price,available,desiredDate:i.desiredDate});

  return{cash,financed,earliest,savings};
}

/* How many buckets forward `toBucket` is from `fromBucket`, or null if it is in
   the past or beyond the horizon. Stepping with the existing bucketShift rather
   than doing date arithmetic is what makes this correct for a pay-period owner
   as well as a calendar-month one — a period is not a month, and counting
   months between two period keys would quietly drift. */
function purchaseBucketsBetween(fromBucket,toBucket,payPeriods,owner){
  if(!fromBucket||!toBucket)return null;
  if(String(toBucket)===String(fromBucket))return 0;
  for(let n=1;n<=PURCHASE_HORIZON_BUCKETS;n++){
    if(String(bucketShift(fromBucket,payPeriods,owner,n))===String(toBucket))return n;
  }
  return null;
}

/* "I want it by this date — what do I set aside, and can I?"
   The question Build A never answered: it reported the earliest possible date
   instead, and the date the person typed was used for nothing at all.

   Capacity reuses the SAME max(0, headroom) accumulation the earliest walk
   above performs — a bucket in deficit contributes nothing and never subtracts,
   because you cannot save negative money into a purchase. Writing a second
   per-bucket reduce here is how the two answers would drift apart.

   Feasibility is capacity vs shortfall across the whole window, not
   requiredPerBucket vs every bucket: saving more in a fat period to cover a
   lean one is a real plan, and rejecting it would be wrong. The tightest
   bucket is reported separately so the UI can warn about the front-loading
   that implies. */
function purchaseSavingsPlan(ctx,{price,available,desiredDate}){
  const c=ctx||{};
  if(!desiredDate)return null;
  const nowBucket=bucketKeyFor(c.todayStr,c.payPeriods,c.owner);
  const targetBucket=bucketKeyFor(desiredDate,c.payPeriods,c.owner);
  const shortfall=Math.max(0,(Number(price)||0)-(Number(available)||0));
  /* A date already past, or inside the period we are standing in, is not a
     savings plan — there is nothing left to spread it over. Say so and point at
     the cash answer rather than dividing by zero. */
  if(String(targetBucket)<=String(nowBucket))
    return{id:"savings",mode:"now",targetBucket,n:0,shortfall,
      requiredPerBucket:shortfall,capacity:0,tightest:null,feasible:shortfall<=0};
  const n=purchaseBucketsBetween(nowBucket,targetBucket,c.payPeriods,c.owner);
  if(n==null)return{id:"savings",mode:"beyondHorizon",targetBucket,n:null,shortfall,
    requiredPerBucket:0,capacity:0,tightest:null,feasible:false};
  let capacity=0,tightest=null;
  for(let k=0;k<n;k++){
    const key=bucketShift(nowBucket,c.payPeriods,c.owner,k);
    const h=purchaseHeadroomForBucket(c,key);
    capacity+=Math.max(0,h.headroom);
    if(!tightest||h.headroom<tightest.headroom)tightest={key,headroom:h.headroom,income:h.income};
  }
  return{id:"savings",mode:"plan",targetBucket,n,shortfall,
    requiredPerBucket:shortfall/n,capacity,tightest,
    feasible:capacity>=shortfall};
}

/* Two axes, module-scope thresholds, not a setting: cash-flow risk (does any
   month go negative, or nearly) and depletion risk (does paying cash leave
   nothing behind). Boundaries are deliberately non-strict on the good side —
   a headroom of exactly zero is not yet a deficit, and headroom at exactly
   PURCHASE_THIN_PCT of income is not yet thin. */
function purchaseVerdict(scenario,ctx){
  const c=ctx||{};
  if(!scenario)return"flat";
  if(scenario.id==="cash"){
    if(!scenario.feasible)return"bad";
    return scenario.remainingAfter<(Number(c.periodAllocation)||0)?"warn":"good";
  }
  if(scenario.id==="financed"){
    if(!scenario.upfrontFeasible)return"bad";
    const b=scenario.buckets||[];
    if(b.some(x=>x.headroom<0))return"bad";
    if(b.some(x=>x.income>0&&x.headroom<x.income*(PURCHASE_THIN_PCT/100)))return"warn";
    return"good";
  }
  if(scenario.id==="earliest")return scenario.n<=3?"good":"flat";
  if(scenario.id==="savings"){
    /* Nothing left to save for is simply good; a date already gone, or one the
       plan cannot reach at all, is bad. */
    if(scenario.shortfall<=0)return"good";
    if(scenario.mode!=="plan")return"bad";
    if(!scenario.feasible)return"bad";
    /* Feasible across the window, but only by putting aside more than the
       leanest period has spare — a real plan, and one worth flagging, because
       it means front-loading rather than an even monthly habit. */
    const t=scenario.tightest;
    if(t&&scenario.requiredPerBucket>t.headroom)return"warn";
    return"good";
  }
  return"flat";
}

/* Trailing actuals as a WARNING, never as arithmetic. The projection is
   plan-based on purpose — a plan is a decision, a trailing average is a
   description — but a plan the last three periods consistently overran is
   worth saying out loud before someone commits to 12 payments against it.
   Gated on MIN_TREND_BUCKETS, the same bar Home's trend cards use, so it stays
   dark until there is enough history to be honest. Built on bucketHistoryFor's
   rows rather than a second per-period reduce. */
function purchaseHistoryWarning(bucketHistory,fmt){
  const f=typeof fmt==="function"?fmt:n=>String(Math.round(Number(n)||0));
  const rows=(bucketHistory||[]).filter(r=>r&&Number(r.budget)>0);
  if(rows.length<MIN_TREND_BUCKETS)return null;
  const planned=rows.reduce((s,r)=>s+(Number(r.budget)||0),0)/rows.length;
  const actual=rows.reduce((s,r)=>s+(Number(r.spent)||0),0)/rows.length;
  if(!(planned>0)||actual<=planned*1.1)return null;
  return`Your plan allows ${f(planned)} a period for tracked spending; the last `
    +`${rows.length} averaged ${f(actual)}. These projections use the plan.`;
}

/* ── Installment state transactions ────────────────────────────────────────
   Every installment mutation is a pure (data, args) => data function here, and
   the App-level mutator is one line: setData(d=>applyX(d,args)) plus
   pushImportant(). Two reasons, both load-bearing:

   1. A plan and its payments, or a payment and its ledger row, MUST land in
      one setData. Two writes can be interleaved by the persistence debounce and
      uploaded half-done, so a partial plan could be synced. Doing the whole
      thing as one pure transform makes that impossible by construction rather
      than by remembering.
   2. It makes the coupling testable. installmenttest.cjs slices these and runs
      them on plain objects, so "deleting a linked expense reopens its payment"
      is asserted against the shipped code, not a copy of it.

   Ids and `now` are always passed IN, never generated here, so the functions
   stay deterministic under test. ──────────────────────────────────────────── */

function applyInstallmentCreate(d,{plan,rows,now,ids}){
  const inst={...plan,status:plan.status||"active",createdAt:now,updatedAt:now};
  const pays=(rows||[]).map((r,i)=>({id:(ids||[])[i],installmentId:inst.id,owner:inst.owner,
    sequence:r.sequence!=null?r.sequence:i+1,dueDate:r.dueDate,
    scheduledAmount:Number(r.scheduledAmount)||0,status:"upcoming",
    createdAt:now,updatedAt:now}));
  return{...d,installments:[...(d.installments||[]),inst],
    installmentPayments:[...(d.installmentPayments||[]),...pays]};
}

/* Edit. `rows` is optional — omit it to patch only the plan's details. When
   given, a row carrying an `id` updates that payment, a row without one is new,
   and an existing OPEN row missing from the list is tombstoned. Paid rows are
   never touched: a recorded payment is history, and rewriting its scheduled
   amount would make a past period's plan disagree with its own ledger. */
function applyInstallmentUpdate(d,{installmentId,patch,rows,ids,now}){
  const insts=(d.installments||[]).map(x=>x.id===installmentId
    ?{...x,...(patch||{}),id:x.id,createdAt:x.createdAt,updatedAt:now}:x);
  if(!rows)return{...d,installments:insts};
  const inst=insts.find(x=>x.id===installmentId);
  const owner=(inst&&inst.owner)||"me";
  let k=0;
  const existing=(d.installmentPayments||[]).map(p=>{
    if(p.installmentId!==installmentId||p.deletedAt||p.status==="paid")return p;
    const r=rows.find(x=>x.id===p.id);
    if(!r)return{...p,deletedAt:now,updatedAt:now};
    return{...p,dueDate:r.dueDate,scheduledAmount:Number(r.scheduledAmount)||0,
      sequence:r.sequence!=null?r.sequence:p.sequence,owner,updatedAt:now};
  });
  const added=rows.filter(r=>!r.id).map((r,i)=>({id:(ids||[])[k++],installmentId,owner,
    sequence:r.sequence!=null?r.sequence:i+1,dueDate:r.dueDate,
    scheduledAmount:Number(r.scheduledAmount)||0,status:"upcoming",createdAt:now,updatedAt:now}));
  return{...d,installments:insts,installmentPayments:[...existing,...added]};
}

/* One real payment ⇒ exactly ONE ledger row. Recording against a payment that
   already has one updates that row rather than adding a second, which is what
   keeps "record payment" idempotent if it's tapped twice or replayed after a
   merge. The row is an ordinary isTransfer expense — the same shape a goal
   contribution uses (catId = the thing it funds), so the unaccounted sheet
   classifies it as Transfers out with no arithmetic change. */
/* Is `catId` still a live category belonging to THIS owner?

   Owner-scoped on purpose: funding one person's installment out of the other
   person's envelope would split a linked chain across owners, which is the
   corruption this module exists to prevent.

   Deliberately not month-scoped. A plan chain materialises lazily and a category
   is inherited by every month after the one that introduced it, so "does this
   person have this category" is the question that stays true regardless of which
   bucket the money landed in. Scoping it to the paid month would reject a
   perfectly good category merely because that month hadn't been edited yet. */
function installmentFundingCategoryExists(d,owner,catId){
  if(!catId)return false;
  return(d&&d.plans||[]).some(pl=>pl&&!pl.deletedAt&&(pl.owner||"me")===owner
    &&(pl.categories||[]).some(c=>c&&c.id===catId&&!c.deletedAt));
}

/* `fundedCatId` (optional) says this payment came out of an ordinary budget
   envelope rather than being planned as its own Budget line — the Tabby
   downpayment paid out of this month's Shopping. When it is set the ledger row
   inverts shape:

     catId       = the BUDGET CATEGORY, not the installment id
     isTransfer  = false, so it consumes the envelope and lands in `spentMap`

   That inversion is safe because NOTHING reads `catId` on an installment
   expense — every reader keys on installmentId/installmentPaymentId — and it is
   the same shape v1.28.0 chose for untracked-category goal links: `catId` stays
   the category a person recognises, and the explicit link id is what MEANS it.
   `unaccountedParts` needs no change either; `isTransfer:false` already falls
   through to tracked spending.

   The planned side must move with it: `derivedInstallmentRowsFor` marks the row
   `fundedElsewhere` and `installmentTotal` drops it, because that money is now
   allocated by the envelope's own budget. Counting both is the double-allocation
   the comment above `unaccountedParts` has always been guarding against. */
function applyInstallmentPayment(d,{paymentId,actualAmount,paidDate,name,note,now,expenseId,fundedCatId}){
  const p=(d.installmentPayments||[]).find(x=>x.id===paymentId&&!x.deletedAt);
  if(!p)return d;
  const inst=(d.installments||[]).find(x=>x.id===p.installmentId&&!x.deletedAt);
  if(!inst)return d;
  const amt=Number(actualAmount!=null?actualAmount:p.scheduledAmount)||0;
  const date=paidDate||todayISO();
  const owner=p.owner||inst.owner||"me";
  /* Resolved against LIVE categories before the write, the same way
     categoryGoalFor resolves a goal link: a category that has since been
     tombstoned degrades to an ordinary transfer rather than writing an expense
     filed under something no envelope will ever show. */
  const funded=fundedCatId&&installmentFundingCategoryExists(d,owner,fundedCatId)?fundedCatId:null;
  const prior=p.expenseId?(d.expenses||[]).find(e=>e.id===p.expenseId):null;
  const exId=prior?prior.id:expenseId;
  const expenses=prior
    ?(d.expenses||[]).map(e=>e.id===exId
      ?{...e,amount:amt,date,name:name||e.name,note:note!=null?note:e.note,
        catId:funded||inst.id,isTransfer:!funded,deletedAt:null,updatedAt:now}:e)
    :[...(d.expenses||[]),{id:exId,catId:funded||inst.id,
        name:name||`${inst.name||"Installment"} #${p.sequence}`,note:note||"",
        amount:amt,date,owner,isTransfer:!funded,isExtraFunds:false,
        installmentId:inst.id,installmentPaymentId:p.id,createdAt:now,updatedAt:now}];
  const payments=(d.installmentPayments||[]).map(x=>{
    if(x.id!==paymentId)return x;
    const n={...x,status:"paid",actualAmount:amt,paidDate:date,expenseId:exId,owner,updatedAt:now};
    if(funded)n.fundedCatId=funded;else delete n.fundedCatId;
    return n;
  });
  return{...d,expenses,installmentPayments:payments};
}

/* Editing the ledger row is the SAME edit as editing the payment — amount
   becomes actualAmount, date becomes paidDate. Owner and the two link fields
   are deliberately not patchable here; moving one half of a linked chain to
   another person is the corruption this module exists to prevent. */
function applyInstallmentExpenseEdit(d,{expenseId,amount,date,name,note,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  if(!e)return d;
  const next={...e,createdAt:e.createdAt,updatedAt:now};
  if(amount!==undefined)next.amount=Number(amount)||0;
  if(date!==undefined)next.date=date;
  if(name!==undefined)next.name=name;
  if(note!==undefined)next.note=note;
  if(date!==undefined&&date!==e.date)delete next.ord;   // same rule as updateExpenseTx
  const expenses=(d.expenses||[]).map(x=>x.id===expenseId?next:x);
  if(!e.installmentPaymentId)return{...d,expenses};
  const payments=(d.installmentPayments||[]).map(p=>p.id===e.installmentPaymentId
    ?{...p,actualAmount:next.amount,paidDate:next.date,updatedAt:now}:p);
  return{...d,expenses,installmentPayments:payments};
}

/* Deleting the ledger row means the money didn't move, so the schedule row
   reopens. Tombstone-aware on both sides: nothing is spliced, and the link
   fields survive on the deleted expense so a restore can re-settle exactly the
   same payment even after a sync merge round-trips it. */
function applyInstallmentExpenseDelete(d,{expenseId,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  const expenses=(d.expenses||[]).map(x=>x.id===expenseId?{...x,deletedAt:now,updatedAt:now}:x);
  if(!e)return{...d,expenses};
  if(e.installmentPaymentId){
    const payments=(d.installmentPayments||[]).map(p=>{
      if(p.id!==e.installmentPaymentId)return p;
      const n={...p,status:"upcoming",updatedAt:now};
      /* fundedCatId goes with the money. A reopened payment is planned again,
         so leaving the mark would keep it out of the planned total while
         nothing funds it — the row would silently allocate nowhere. The
         deleted expense still carries catId, which is what lets restore
         re-derive it without stashing a copy. */
      delete n.actualAmount;delete n.paidDate;delete n.expenseId;delete n.fundedCatId;
      return n;
    });
    return{...d,expenses,installmentPayments:payments};
  }
  if(e.installmentPayoff){
    /* undoing a payoff reopens exactly the rows that payoff closed —
       payoffExpenseId is kept on them so a later restore can re-close the
       same set rather than guessing from status */
    const payments=(d.installmentPayments||[]).map(p=>{
      if(p.payoffExpenseId!==e.id||p.status==="paid")return p;
      const n={...p,status:"upcoming",updatedAt:now};
      delete n.cancelledBy;delete n.cancelledAt;
      return n;
    });
    const insts=(d.installments||[]).map(x=>{
      if(x.payoffExpenseId!==e.id)return x;
      const n={...x,status:"active",updatedAt:now};
      delete n.closedAt;
      return n;
    });
    return{...d,expenses,installments:insts,installmentPayments:payments};
  }
  return{...d,expenses};
}

function applyInstallmentExpenseRestore(d,{expenseId,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  const expenses=(d.expenses||[]).map(x=>x.id===expenseId?{...x,deletedAt:null,updatedAt:now}:x);
  if(!e)return{...d,expenses};
  if(e.installmentPaymentId){
    /* Re-derived from the restored row rather than stashed: a non-transfer
       installment expense is BY DEFINITION funded from its catId, so the
       expense is its own record of where the money came from and there is no
       second copy to fall out of step. */
    const refunded=(!e.isTransfer&&e.catId)?e.catId:null;
    const payments=(d.installmentPayments||[]).map(p=>{
      if(p.id!==e.installmentPaymentId)return p;
      const n={...p,status:"paid",actualAmount:Number(e.amount)||0,paidDate:e.date,
        expenseId:e.id,updatedAt:now};
      if(refunded)n.fundedCatId=refunded;else delete n.fundedCatId;
      return n;
    });
    return{...d,expenses,installmentPayments:payments};
  }
  if(e.installmentPayoff){
    const payments=(d.installmentPayments||[]).map(p=>
      (p.payoffExpenseId===e.id&&p.status!=="paid")
        ?{...p,status:"cancelled",cancelledBy:"payoff",cancelledAt:now,updatedAt:now}:p);
    const insts=(d.installments||[]).map(x=>x.payoffExpenseId===e.id
      ?{...x,status:"paidOffEarly",closedAt:e.date,updatedAt:now}:x);
    return{...d,expenses,installments:insts,installmentPayments:payments};
  }
  return{...d,expenses};
}

/* Early payoff: ONE ledger row for the whole thing, never one per cancelled
   payment. The closed rows keep their original dueDate and scheduledAmount so
   what was planned stays readable; they simply stop being planned, which is
   what makes future derived Budget rows disappear while paid history stands. */
function applyInstallmentPayoff(d,{installmentId,payoffDate,amount,name,note,now,expenseId}){
  const inst=(d.installments||[]).find(x=>x.id===installmentId&&!x.deletedAt);
  if(!inst)return d;
  const date=payoffDate||todayISO();
  const owner=inst.owner||"me";
  const expenses=[...(d.expenses||[]),{id:expenseId,catId:inst.id,
    name:name||`${inst.name||"Installment"} — early payoff`,note:note||"",
    amount:Number(amount)||0,date,owner,isTransfer:true,isExtraFunds:false,
    installmentId,installmentPayoff:true,createdAt:now,updatedAt:now}];
  const payments=(d.installmentPayments||[]).map(p=>
    (p.installmentId===installmentId&&!p.deletedAt&&installmentPaymentIsOpen(p))
      ?{...p,status:"cancelled",cancelledBy:"payoff",payoffExpenseId:expenseId,
        cancelledAt:now,updatedAt:now}
      :p);
  const insts=(d.installments||[]).map(x=>x.id===installmentId
    ?{...x,status:"paidOffEarly",closedAt:date,payoffExpenseId:expenseId,updatedAt:now}:x);
  return{...d,expenses,installments:insts,installmentPayments:payments};
}

/* Cancelling the arrangement itself. No ledger row — no money moved. Paid
   history stays exactly as it is; only unpaid rows close. */
function applyInstallmentCancel(d,{installmentId,now}){
  const payments=(d.installmentPayments||[]).map(p=>
    (p.installmentId===installmentId&&!p.deletedAt&&installmentPaymentIsOpen(p))
      ?{...p,status:"cancelled",cancelledBy:"plan",cancelledAt:now,updatedAt:now}:p);
  const insts=(d.installments||[]).map(x=>x.id===installmentId
    ?{...x,status:"cancelled",closedAt:String(now).slice(0,10),updatedAt:now}:x);
  return{...d,installments:insts,installmentPayments:payments};
}

/* Administrative removal. Soft-delete only, never a splice — a hard delete
   reads to an un-synced device as "you haven't seen this yet" and comes back.
   Unpaid payments are tombstoned WITH the plan (stamped `deletedWith` so the
   restore puts back exactly this batch and not rows deleted separately).
   PAID payments and their expense rows are deliberately left alone: real
   financial history is never removed as a side effect of tidying up. */
function applyInstallmentDelete(d,{installmentId,now}){
  const insts=(d.installments||[]).map(x=>x.id===installmentId
    ?{...x,deletedAt:now,updatedAt:now}:x);
  const payments=(d.installmentPayments||[]).map(p=>
    (p.installmentId===installmentId&&!p.deletedAt&&p.status!=="paid")
      ?{...p,deletedAt:now,deletedWith:installmentId,updatedAt:now}:p);
  return{...d,installments:insts,installmentPayments:payments};
}
function applyInstallmentRestore(d,{installmentId,now}){
  const insts=(d.installments||[]).map(x=>x.id===installmentId
    ?{...x,deletedAt:null,updatedAt:now}:x);
  const payments=(d.installmentPayments||[]).map(p=>{
    if(p.deletedWith!==installmentId)return p;
    const n={...p,deletedAt:null,updatedAt:now};
    delete n.deletedWith;
    return n;
  });
  return{...d,installments:insts,installmentPayments:payments};
}

/* The explicit escape hatch: keep the transaction, drop the link. Behind a
   warning in the UI because the payment reopens and the row stops being an
   installment payment for good — there is no re-link flow. */
function applyInstallmentUnlink(d,{expenseId,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  if(!e)return d;
  const expenses=(d.expenses||[]).map(x=>{
    if(x.id!==expenseId)return x;
    const n={...x,updatedAt:now};
    delete n.installmentId;delete n.installmentPaymentId;delete n.installmentPayoff;
    return n;
  });
  const payments=(d.installmentPayments||[]).map(p=>{
    if(p.id!==e.installmentPaymentId)return p;
    const n={...p,status:"upcoming",updatedAt:now};
    /* Same reasoning as the delete path: the payment is planned again, so it
       must re-enter the planned total. The expense keeps its catId and
       isTransfer:false and simply becomes an ordinary category expense, which
       is exactly what unlinking should leave behind. */
    delete n.actualAmount;delete n.paidDate;delete n.expenseId;delete n.fundedCatId;
    return n;
  });
  return{...d,expenses,installmentPayments:payments};
}

/* ── Goal contributions: one action, one write, two linked records ──────────

   Money reaching a goal has always meant two things — it leaves the budget
   (a ledger transfer) and it lands in the goal (a contribution). Three UI
   paths did this and only one of them did both:

     • the add-transaction modal's Goals mode wrote BOTH, but in TWO separate
       setData calls, so a sync between them could persist half of it
     • the Goals tab's "Add money" wrote ONLY the contribution
     • Home's GoalContributionSheet wrote ONLY the contribution

   So a goal could grow without any money leaving the budget, and the same
   action meant different things depending on which screen you started from.
   These functions are the one place it happens now, and both records land in a
   single write — the rule installments already follow.

   The two records LINK BY ID (`expense.goalContributionId` /
   `contribution.expenseId`). Before this, the only thing tying a transfer to a
   goal was `catId` happening to equal a live goal id — which is why deleting a
   goal silently reclassified its contributions as ordinary transfers. An
   explicit link cannot rot that way.

   `catId` stays the goal id for a direct contribution, so every existing
   reader (the unaccounted classifier, the Expenses category filter) keeps
   working unchanged. `goalId` is the field that MEANS it, and readers should
   prefer it — see `unaccountedParts`.

   Nothing is backfilled onto historical records. An absent link means "made
   before this build", the same way an absent `ord` means "unplaced": guessing
   which old expense pairs with which old contribution would be inventing data.
*/
function applyGoalContribution(d,{goalId,amount,note,date,owner,name,catId,expenseId,contributionId,now}){
  const g=(d.goals||[]).find(x=>x.id===goalId&&!x.deletedAt);
  if(!g)return d;
  const amt=Number(amount);
  if(!(amt>0))return d;
  const contrib={id:contributionId,date,amount:amt,note:note||"",expenseId,updatedAt:now};
  /* `catId` defaults to the goal, which is what a direct contribution has
     always been. A CATEGORY-LINKED transfer (v1.28.0) overrides it with the
     budget category the money actually left, because that is what the
     envelope's "transferred" figure and the Expenses category filter read.
     `goalId` is what says a goal was credited — the two are different
     questions and were only ever the same field by coincidence. */
  const expense={id:expenseId,catId:catId||goalId,goalId,goalContributionId:contributionId,
    name:name||`${g.name||"Goal"} (goal)`,note:note||"",amount:amt,date,
    owner:owner||g.owner||"me",isTransfer:true,createdAt:now,updatedAt:now};
  return{...d,
    expenses:[...(d.expenses||[]),expense],
    goals:(d.goals||[]).map(x=>x.id===goalId
      ?{...x,contributions:[...(x.contributions||[]),contrib],updatedAt:now}:x)};
}

/* The live goal a budget category is linked to, or null.

   Returns null when the goal has been deleted or no longer exists, which is
   what makes a linked category **degrade** to an ordinary untracked transfer
   rather than breaking: the link is a convenience, not a dependency, and a
   deleted goal must never swallow a transfer. Callers decide before writing —
   applyGoalContribution's own "unknown goal writes nothing" guard would
   otherwise silently drop the transaction entirely. */
function categoryGoalFor(cat,goals){
  if(!cat||!cat.goalId)return null;
  return(goals||[]).find(g=>g.id===cat.goalId&&!g.deletedAt)||null;
}

/* Deleting the ledger row means the money didn't move, so the goal must give
   it back — in the SAME write, or the two halves describe different money.
   Legacy rows carry no link and fall through to a plain tombstone. */
function applyGoalContributionDeleteByExpense(d,{expenseId,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  const expenses=(d.expenses||[]).map(x=>x.id===expenseId?{...x,deletedAt:now,updatedAt:now}:x);
  if(!e||!e.goalId||!e.goalContributionId)return{...d,expenses};
  return{...d,expenses,
    goals:(d.goals||[]).map(g=>g.id!==e.goalId?g:{...g,updatedAt:now,
      contributions:(g.contributions||[]).map(c=>
        c.id===e.goalContributionId?{...c,deletedAt:now,updatedAt:now}:c)})};
}
function applyGoalContributionRestoreByExpense(d,{expenseId,now}){
  const e=(d.expenses||[]).find(x=>x.id===expenseId);
  const expenses=(d.expenses||[]).map(x=>x.id===expenseId?{...x,deletedAt:null,updatedAt:now}:x);
  if(!e||!e.goalId||!e.goalContributionId)return{...d,expenses};
  return{...d,expenses,
    goals:(d.goals||[]).map(g=>g.id!==e.goalId?g:{...g,updatedAt:now,
      contributions:(g.contributions||[]).map(c=>
        c.id===e.goalContributionId?{...c,deletedAt:null,updatedAt:now}:c)})};
}

/* The mirror: deleting the contribution from the goal's own list takes the
   ledger row with it. Without this the money would still have left the budget
   while the goal no longer shows it arriving. */
function applyGoalContributionDeleteByContribution(d,{goalId,contributionId,now}){
  const g=(d.goals||[]).find(x=>x.id===goalId);
  const c=g&&(g.contributions||[]).find(x=>x.id===contributionId);
  const goals=(d.goals||[]).map(x=>x.id!==goalId?x:{...x,updatedAt:now,
    contributions:(x.contributions||[]).map(y=>
      y.id===contributionId?{...y,deletedAt:now,updatedAt:now}:y)});
  if(!c||!c.expenseId)return{...d,goals};
  return{...d,goals,
    expenses:(d.expenses||[]).map(x=>x.id===c.expenseId?{...x,deletedAt:now,updatedAt:now}:x)};
}
function applyGoalContributionRestoreByContribution(d,{goalId,contributionId,now}){
  const g=(d.goals||[]).find(x=>x.id===goalId);
  const c=g&&(g.contributions||[]).find(x=>x.id===contributionId);
  const goals=(d.goals||[]).map(x=>x.id!==goalId?x:{...x,updatedAt:now,
    contributions:(x.contributions||[]).map(y=>
      y.id===contributionId?{...y,deletedAt:null,updatedAt:now}:y)});
  if(!c||!c.expenseId)return{...d,goals};
  return{...d,goals,
    expenses:(d.expenses||[]).map(x=>x.id===c.expenseId?{...x,deletedAt:null,updatedAt:now}:x)};
}

/* ── Goal deadlines ───────────────────────────────────────────────────────
   A target and a monthly figure can say "~16 months at this pace". Only a
   deadline can say "you will miss this", which is the question somebody
   saving for a dated purchase is actually asking.

   Pure, module scope, takes `todayStr` — the same rules the rest of the
   derived layer follows, so goaltest.cjs runs the shipped function rather
   than a copy, and a projection can't move at midnight.

   Three choices worth keeping:

   • Returns null when there is no deadline. Absence is the normal case, not
     an incomplete record, so the Goals tab keeps showing exactly the pace line
     it always showed and no card has to special-case an empty state.
   • `onTrack` compares the goal's STATED `monthly` against what the deadline
     demands — never against recent actual contributions. Plan-based, with
     actuals only ever a warning: one month you happened to skip is not
     evidence the plan is wrong, and quietly re-deriving the plan from
     behaviour is how a budget stops being a decision. Same rule the Purchase
     Advisor's projections follow.
   • Months are WHOLE months remaining, via the existing completedMonths, which
     rounds the requirement UP rather than down — with three and a half months
     left you are asked for the three-month figure. A deadline is a commitment;
     flattering it with a part-month helps nobody. */
function goalDeadlineStatus(goal,todayStr){
  if(!goal||!goal.deadline)return null;
  const today=String(todayStr||"");
  const target=Number(goal.target)||0;
  const saved=(goal.contributions||[]).filter(c=>c&&!c.deletedAt)
    .reduce((s,c)=>s+(Number(c.amount)||0),0);
  const remain=Math.max(0,target-saved);
  const done=remain<=0;
  /* Reached counts as reached: a goal you finished early is not "overdue"
     just because its date has since passed. */
  const overdue=!done&&String(goal.deadline)<today;
  const monthsLeft=overdue?0:completedMonths(today,goal.deadline);
  const requiredMonthly=done?0:(monthsLeft>0?remain/monthsLeft:remain);
  const monthly=Number(goal.monthly)||0;
  return{deadline:String(goal.deadline),target,saved,remain,done,overdue,
    monthsLeft,requiredMonthly,monthly,
    onTrack:done||(!overdue&&monthly>=requiredMonthly)};
}

/* Tracked-spending rollup for one owner, for their CURRENT bucket (calendar
   month, or pay-period when that owner has pay-periods enabled).

   This is a straight lift of the envelope/spent maths ExpenseTrackerView
   already performs — same tracked test (trackExpenses!==false), same
   effective-budget rule (sub-category sum when subs exist, else the category
   amount), same skip of zero-budget categories, same bucket filter, and the
   same isExtraFunds handling where ad-hoc top-ups raise the effective budget
   rather than counting as spend. Kept as one shared top-level function so
   Home reads the numbers rather than re-deriving them. */
function trackedSpendingFor(owner,{planForMonth,expenses,payPeriods},bucket){
  const month=bucket||bucketNow(payPeriods,owner);
  const plan=planForMonth?planForMonth(month,owner):null;
  const envs=[];
  if(plan){
    (plan.groups||[]).forEach(g=>{
      (plan.categories||[]).filter(c=>c.groupId===g.id).forEach(c=>{
        if(c.trackExpenses===false)return; // untracked: transfers, savings, investments
        const effAmt=(c.subs||[]).length>0
          ?(c.subs||[]).reduce((s,sub)=>s+(Number(sub.amount)||0),0)
          :Number(c.amount)||0;
        if(effAmt<=0)return;
        envs.push({id:c.id,name:c.name,baseBudget:effAmt,color:c.color});
      });
    });
  }
  const inBucket=(expenses||[]).filter(e=>
    e.date&&(e.owner||"me")===owner&&bucketKeyFor(e.date,payPeriods,owner)===month);
  const spentMap={},extraMap={};
  inBucket.forEach(e=>{
    const m=e.isExtraFunds?extraMap:spentMap;
    m[e.catId]=(m[e.catId]||0)+e.amount;
  });
  const cats=envs.map(e=>{
    const budget=e.baseBudget+(extraMap[e.id]||0);
    const spent=spentMap[e.id]||0;
    return{id:e.id,name:e.name,color:e.color,owner,budget,spent,
      remaining:budget-spent,
      pct:budget>0?(spent/budget)*100:0,
      over:spent>budget};
  });
  return{month,cats,
    budget:cats.reduce((s,c)=>s+c.budget,0),
    spent:cats.reduce((s,c)=>s+c.spent,0)};
}

/* Savings & Investing rollup for one owner, current bucket (Phase 4 §4).
   Deliberately NOT income-minus-expenses — that guesses at savings from
   what's left over, which silently double-counts anything already spent
   from an envelope. Instead this sums actual `expenses` rows logged against
   whichever budget categories the user has picked as "savings" or
   "investment" in Home Dashboard settings (data.homeSettings), the same
   quickTransfer/addExtraFunds-logged entries the untracked-category system
   above already produces. Categories are matched by NAME rather than id
   because cloning a plan into a new month gives its categories fresh ids —
   name is the only thing stable across months for a category a user thinks
   of as "the same one". */
function savingsInvestingFor(owner,{planForMonth,expenses,payPeriods},savingsNames,investNames,bucket){
  const month=bucket||bucketNow(payPeriods,owner);
  const plan=planForMonth?planForMonth(month,owner):null;
  const idsFor=names=>new Set((plan&&plan.categories||[]).filter(c=>(names||[]).includes(c.name)).map(c=>c.id));
  const savingIds=idsFor(savingsNames),investIds=idsFor(investNames);
  const inBucket=(expenses||[]).filter(e=>
    e.date&&(e.owner||"me")===owner&&bucketKeyFor(e.date,payPeriods,owner)===month);
  const saved=inBucket.filter(e=>savingIds.has(e.catId)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const invested=inBucket.filter(e=>investIds.has(e.catId)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  return{month,saved,invested,income:Number((plan&&plan.income)||0)};
}

/* ── Month-over-month history for Home's two trend questions ──────────────
   "Is my lifestyle creeping?" and "Am I improving my savings over time?"
   both need the same thing: the per-bucket rollups the current-month cards
   already show, but for *completed* buckets going back in time.

   It runs the very same trackedSpendingFor()/savingsInvestingFor() the live
   cards use, just with an explicit bucket, so a past month can never be
   computed by a different rule than the current one.

   Only COMPLETE buckets are returned. The bucket in progress is excluded on
   purpose: a month that is four days old always looks like a spending
   collapse, and comparing against it would report an improvement that isn't
   real. `hasEnough` is the gate Home uses to decide whether the trend cards
   exist at all — with fewer than MIN_TREND_BUCKETS completed periods there
   is no honest trend to draw, so the cards render nothing rather than an
   empty state nobody can act on.

   A bucket counts as having data only if it carries at least one expense
   row; a plan alone is not evidence the month was tracked (plans carry
   forward automatically, so every future month "has" a plan). */
const MIN_TREND_BUCKETS=3;
function bucketHistoryFor(owner,ctx,savingsNames,investNames,maxBuckets=12){
  const{expenses,payPeriods}=ctx;
  const current=bucketNow(payPeriods,owner);
  const mine=(expenses||[]).filter(e=>e.date&&(e.owner||"me")===owner);
  // distinct completed buckets that actually contain tracked activity
  const buckets=[...new Set(mine.map(e=>bucketKeyFor(e.date,payPeriods,owner)))]
    .filter(b=>b<current).sort().slice(-maxBuckets);
  return buckets.map(b=>{
    const t=trackedSpendingFor(owner,ctx,b);
    const s=savingsInvestingFor(owner,ctx,savingsNames,investNames,b);
    const put=s.saved+s.invested;
    return{bucket:b,spent:t.spent,budget:t.budget,
      saved:s.saved,invested:s.invested,income:s.income,
      rate:s.income>0?(put/s.income)*100:0};
  });
}
/* Household = both owners' completed buckets merged key-by-key. Summing per
   bucket (rather than concatenating) keeps "one row per period", which is
   what both trend cards chart. */
function bucketHistoryCombined(profile,ctx,savingsNames,investNames,maxBuckets=12){
  if(profile!=="household")return bucketHistoryFor(profile,ctx,savingsNames,investNames,maxBuckets);
  const a=bucketHistoryFor("me",ctx,savingsNames,investNames,maxBuckets);
  const b=bucketHistoryFor("wife",ctx,savingsNames,investNames,maxBuckets);
  const byKey=new Map();
  [...a,...b].forEach(r=>{
    const cur=byKey.get(r.bucket);
    if(!cur){byKey.set(r.bucket,{...r});return;}
    cur.spent+=r.spent;cur.budget+=r.budget;cur.saved+=r.saved;
    cur.invested+=r.invested;cur.income+=r.income;
  });
  return[...byKey.values()].sort((x,y)=>x.bucket<y.bucket?-1:1)
    .map(r=>({...r,rate:r.income>0?((r.saved+r.invested)/r.income)*100:0}));
}

/* ── App version / build ──
   Single source of truth for the version shown in Settings → About and
   compared against version.json. Bump both on every deploy — BUILD_ID
   must also be copied into sw.js's BUILD_ID (used in the cache name) so
   the displayed build and the cached app release always correspond, and
   into version.json so the app can detect when a newer build is live.  */
const APP_VERSION="1.34.0";
const BUILD_ID="2026.08.07.0007";

/* ── Cloudflare Worker URL ──
   Replace with YOUR worker URL after deploying (see SETUP-GUIDE.md)     */
const PROXY_URL="https://alloc-kv.jastinefodra21.workers.dev";
// e.g. "https://allocation-proxy.yourname.workers.dev"

/* How long cached quotes / FX rates stay usable before a passive refresh will
   go and get new ones. Module scope since v1.32.0: the rates cache now lives in
   `data`, so the mount effect has to consult RATES_STALE_MS *before* App's body
   has finished executing, and a const declared further down that body would be
   a temporal-dead-zone trap waiting for the first person to reorder something. */
const QUOTES_STALE_MS=15*60*1000,RATES_STALE_MS=6*60*60*1000;

/* ── FX rates (free, no key) ── */
async function fetchRates(){
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    if(r.ok){const j=await r.json();if(j&&j.rates){const rt={};FX_CODES.forEach(c=>{if(j.rates[c]!=null)rt[c]=j.rates[c];});rt.USD=1;return{rates:rt,at:Date.now()};}}
  }catch(e){}
  try{
    const r=await fetch("https://api.frankfurter.app/latest?from=USD&to="+FX_CODES.filter(c=>c!=="USD").join(","));
    if(r.ok){const j=await r.json();if(j&&j.rates){return{rates:{USD:1,...j.rates},at:Date.now()};}}
  }catch(e){}
  throw new Error("no rates");
}

/* ── Stock quotes via Cloudflare Worker proxy ──
   The Worker fetches Yahoo Finance server-side (no CORS), and falls back to
   Finnhub for anything Yahoo misses. Both providers are called from the
   Worker, never from here — this page is served publicly from GitHub Pages,
   so it must not contain an API key. See worker.js.                     */

/* ── Gold spot price (Phase 3) ──
   Reuses the exact same Worker→Yahoo proxy as stock quotes (no new API, no
   new key) — Yahoo's chart endpoint serves "GC=F" (COMEX gold futures, USD
   per troy ounce, the standard proxy for spot gold — "XAUUSD=X" was tried
   first but Yahoo's chart endpoint returns no data for it) just like any
   equity ticker, so it rides fetchQuotes()/livePrice/the existing
   staleness-refresh cycle unchanged. */
const GOLD_TICKER="GC=F";

/* Map tickers to the right Yahoo symbol.
   VWRA → VWRA.L (LSE), bare US tickers stay as-is.                      */
const LSE_SET=new Set(["VWRA","VWRP","VWCE","VWRL","CSPX","EIMI","SWDA","IGLN","IUSA","ISF","HMWO","SSAC","VAGP","AGGG"]);
function toYahooSym(t){
  const b=t.toUpperCase().replace(/\.L$/i,"");
  return LSE_SET.has(b)?b+".L":b;
}
function baseKey(t){return t.toUpperCase().replace(/\.L$|\.AS$|\.DE$/i,"");}

/* Returns {[ticker]:{price,previousClose}} uniformly regardless of provider —
   previousClose is null when a provider doesn't have it, never fabricated.
   Callers that only need the bare number (e.g. net-worth/portfolio value
   math) read `.price`; Home's "today's gain/loss" is the only consumer of
   `.previousClose` so far. */
async function fetchQuotes(tickers){
  const out={};

  /* ── Cloudflare Worker → Yahoo Finance, then Finnhub for anything missing.
     Both provider calls happen inside the Worker; this just asks for prices.
     KVSync is declared further down the file but is only *read* here at call
     time (from effects, long after module init), so the forward reference is
     safe. /quote requires the sync token now, so an unconfigured device gets
     no live prices — same rule sync already followed.                      */
  if(KVSync._ready()){
    const syms=tickers.map(toYahooSym).join(",");
    try{
      const r=await fetch(`${PROXY_URL}/quote?symbols=${encodeURIComponent(syms)}`,{headers:KVSync._headers()});
      if(r.ok){
        const j=await r.json();
        Object.entries(j).forEach(([sym,q])=>{
          // Tolerate both the new {price,previousClose} shape (post-redeploy
          // worker.js) and the old bare-number shape (pre-redeploy), so this
          // client keeps working even before the Worker is redeployed.
          const price=(q&&typeof q==="object")?q.price:q;
          const previousClose=(q&&typeof q==="object")?(q.previousClose||null):null;
          if(price>0)out[baseKey(sym)]={price,previousClose};
        });
      }
    }catch(e){}
  }

  if(Object.keys(out).length===0)throw new Error("no quotes");
  return out;
}

/* ── Projection helper ── */
function projectSeries(start,monthly,years,annualPct){
  const r=annualPct/100/12;const out=[];
  for(let y=0;y<=years;y++){
    const m=y*12;
    const fv=r===0?start+monthly*m:start*Math.pow(1+r,m)+monthly*((Math.pow(1+r,m)-1)/r);
    out.push(Math.round(fv));
  }
  return out;
}

/* ── Target forecast: simulate invested + cash pools growing at separate
   conservative rates. Each category's monthly amount is routed to whichever
   pool the person tagged it as (invest vs cash) — a "GoTrade" contribution
   compounds at the invest rate, a "Seabank/time-deposit" contribution
   compounds at the cash rate. Returns a month-by-month series plus the
   first month the total crosses the target, or null if it doesn't within
   30 years. ── */
function computeTargetForecast(startInvest,startCash,monthlyInvest,monthlyCash,investRatePct,cashRatePct,targetAmount){
  const rInv=(Number(investRatePct)||0)/100/12,rCash=(Number(cashRatePct)||0)/100/12;
  let inv=Number(startInvest)||0,cash=Number(startCash)||0;
  const MAX_MONTHS=360;
  const series=[];let hitMonth=null;
  for(let m=0;m<=MAX_MONTHS;m++){
    const total=inv+cash;
    if(hitMonth===null&&targetAmount>0&&total>=targetAmount)hitMonth=m;
    if(m%3===0||m===MAX_MONTHS||m===hitMonth)series.push({m,total:Math.round(total)});
    if(hitMonth!==null&&m>=hitMonth)break;
    inv=inv*(1+rInv)+(Number(monthlyInvest)||0);
    cash=cash*(1+rCash)+(Number(monthlyCash)||0);
  }
  return{series,hitMonth};
}

/* ── Compute holding stats from trade log ── */
function holdingStats(trades=[]){
  let shares=0,cost=0;
  (trades||[]).filter(tr=>!tr.deletedAt).forEach(tr=>{
    const s=Number(tr.shares)||0,p=Number(tr.price)||0;
    if(tr.type==="buy"){shares+=s;cost+=s*p;}
    else if(tr.type==="sell"){
      const avgBefore=shares>0?cost/shares:0;
      shares=Math.max(0,shares-s);
      cost=shares*avgBefore;
    }
  });
  const avgCost=shares>0?cost/shares:0;
  return{shares,avgCost,totalCost:cost};
}

/* ── MP2 / Time Deposit valuation (Phase 2) ────────────────────────────────
   Dedicated valuation strategies alongside holdingStats() (stocks). Neither
   type has a live market price — both are rate-driven, so "confirmed" vs
   "estimated" is the core distinction instead of cost-basis vs market value.

   mp2GrowContribution walks a single contribution year-by-year (calendar-
   year buckets, pro-rated for partial years) from its date to `today`,
   applying whatever `rateForYear(y)` returns for each year. Two independent
   walks are done per contribution — one with a rate-lookup that returns
   null for any year without an official declared rate (→ confirmed, that
   year's growth simply isn't recognized yet), one that falls back to the
   account's projection rate for those same gaps (→ estimated). Never a
   single walk with a "confirmed so far, then estimate" switch, because in
   compounded mode that would let an estimated year's growth compound into
   later *confirmed* years once a rate is eventually declared — mixing
   projected money into a value labeled "confirmed". ───────────────────── */
function mp2GrowContribution(amount,dateStr,today,rateForYear,compound){
  const start=new Date(dateStr+"T00:00:00");
  let base=Number(amount)||0,dividends=0;
  if(!(start<today))return{base,dividends:0};
  let cursor=new Date(start);
  while(cursor<today){
    const y=cursor.getFullYear();
    const yearEnd=new Date(y,11,31,23,59,59,999);
    const periodEnd=yearEnd<today?yearEnd:today;
    const days=Math.max(0,(periodEnd-cursor)/86400000);
    const rate=rateForYear(y);
    if(rate!=null){
      const div=base*(Number(rate)/100)*(days/365);
      dividends+=div;
      if(compound)base+=div;
    }
    cursor=new Date(periodEnd.getTime()+86400000);
  }
  return{base,dividends};
}
/* declaredRatesByYear: {year:rate} built from data.mp2DividendRates, already
   resolved to "latest non-deleted entry per year". acc.rateOverrides (an
   optional {year:rate} map on the account itself) takes priority over the
   central table — "reused by all MP2 accounts unless explicitly overridden". */
function mp2Valuation(acc,declaredRatesByYear){
  const today=new Date();
  const contributions=(acc.contributions||[]).filter(c=>!c.deletedAt);
  const totalContrib=contributions.reduce((s,c)=>s+(Number(c.amount)||0),0);
  const compound=acc.payoutMode!=="annual";
  const declaredFor=y=>{
    const ov=acc.rateOverrides&&acc.rateOverrides[y];
    if(ov!=null&&ov!=="")return Number(ov);
    const d=(declaredRatesByYear||{})[y];
    return d!=null?Number(d):null;
  };
  const projFor=y=>{
    const d=declaredFor(y);
    return d!=null?d:(Number(acc.projectionRate)||0);
  };
  let confirmedDividends=0,estimatedDividends=0;
  contributions.forEach(c=>{
    const conf=mp2GrowContribution(c.amount,c.date,today,declaredFor,compound);
    const est=mp2GrowContribution(c.amount,c.date,today,projFor,compound);
    confirmedDividends+=conf.dividends;
    estimatedDividends+=est.dividends;
  });
  const paid=(acc.paidDividends||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  // Annual-payout mode: declared dividends are receivable, not reinvested —
  // once recorded paid (moved to a bank via "Record annual dividend payout"),
  // they must drop out of the MP2 account's own value or they'd be counted
  // twice (once here, once in the bank balance).
  const confirmedValue=Math.max(0,totalContrib+confirmedDividends-(compound?0:paid));
  const estimatedValueRaw=Math.max(0,totalContrib+estimatedDividends-(compound?0:paid));
  const estimatedValue=Math.max(confirmedValue,estimatedValueRaw);
  // Which calendar years actually have no declared rate yet, for the
  // "not yet officially declared" warning in the UI.
  const years=new Set();
  contributions.forEach(c=>{for(let y=new Date(c.date).getFullYear();y<=today.getFullYear();y++)years.add(y);});
  const undeclaredYears=[...years].filter(y=>declaredFor(y)==null).sort();
  return{totalContrib,confirmedDividends,estimatedDividends,confirmedValue,estimatedValue,paid,undeclaredYears};
}

/* Time Deposit: simple or compounded interest over the account's term,
   with an optional flat withholding-tax rate applied to interest only.
   `freq` "maturity" = simple interest for the whole term (no intra-term
   compounding); monthly/quarterly/annually compound at that cadence. */
function tdValuation(acc){
  const principal=Number(acc.principal)||0;
  const rate=Number(acc.rate)||0;
  const tax=Number(acc.taxRate)||0;
  const start=new Date((acc.startDate||"")+"T00:00:00");
  const maturity=new Date((acc.maturityDate||"")+"T00:00:00");
  const today=new Date();
  const validTerm=acc.startDate&&acc.maturityDate&&maturity>start;
  if(!validTerm)return{principal,grossAccrued:0,taxAmt:0,netAccrued:0,currentEstValue:principal,grossAtMaturity:0,maturityValue:principal,daysRemaining:0,daysTotal:0};
  const end=today<maturity?today:maturity;
  const elapsedDays=Math.max(0,(end-start)/86400000);
  const totalDays=Math.max(1,(maturity-start)/86400000);
  const periodsPerYear={maturity:0,monthly:12,quarterly:4,annually:1}[acc.compounding||"maturity"]||0;
  const grossFor=days=>periodsPerYear===0
    ?principal*(rate/100)*(days/365)
    :principal*Math.pow(1+(rate/100)/periodsPerYear,periodsPerYear*(days/365))-principal;
  const grossAccrued=grossFor(elapsedDays);
  const taxAmt=grossAccrued*(tax/100);
  const netAccrued=grossAccrued-taxAmt;
  const grossAtMaturity=grossFor(totalDays);
  const netAtMaturity=grossAtMaturity*(1-tax/100);
  return{
    principal,grossAccrued,taxAmt,netAccrued,
    currentEstValue:principal+netAccrued,
    grossAtMaturity,maturityValue:principal+netAtMaturity,
    daysRemaining:Math.max(0,Math.ceil((maturity-today)/86400000)),
    daysTotal:Math.round(totalDays),
  };
}

/* Gold (Phase 3): physical gold only (bars/coins, no jewellery), priced off
   a live spot quote (see GOLD_TICKER/fetchQuotes) rather than a rate table —
   the only priced type so far that's a literal commodity weight × purity ×
   market price, not a cost-basis or contribution-driven balance. Purity is
   entered as karat (24 for pure/24K, 22 for 22K, or any custom number the
   account owner types in) rather than a raw 0–1 fraction, since that's how
   gold purity is actually quoted/sold. `priceUsdPerOz` is looked up by the
   caller from the shared livePrice cache (same stale-tolerant, never-cleared
   pattern stocks already use) — this function is pure and never fetches. */
const TROY_OZ_GRAMS=31.1034768;
const GOLD_UNITS=[["g","Grams"],["oz","Troy ounces"]];
function goldWeightOz(hld){
  const w=Number(hld.weight)||0;
  return hld.weightUnit==="oz"?w:w/TROY_OZ_GRAMS;
}
function goldKaratFraction(hld){
  const k=Number(hld.karat)||0;
  return Math.min(1,Math.max(0,k/24));
}
function goldValuation(hld,priceUsdPerOz,convert){
  const oz=goldWeightOz(hld);
  const purity=goldKaratFraction(hld);
  const pureOz=oz*purity;
  const price=Number(priceUsdPerOz)||0;
  const currentValueUsd=pureOz*price;
  const purchaseCost=Number(hld.purchaseCost)||0;
  const purchaseValueUsd=convert?(convert(purchaseCost,hld.currency||"USD","USD")||0):0;
  const gainUsd=currentValueUsd-purchaseValueUsd;
  const gainPct=purchaseValueUsd>0?(gainUsd/purchaseValueUsd)*100:0;
  return{oz,purity,pureOz,currentValueUsd,purchaseValueUsd,gainUsd,gainPct,hasPrice:price>0};
}

/* ── Filter an investments array down to one owner's accounts.
   "household" returns everything (Home's household profile is the combined
   view, and a household-owned account is already included in that combined
   set — see investment-ownership comment near INVESTMENT_OWNERS above).
   Single source of truth so App() and PortfolioCard never re-implement this
   filter differently. ── */
function investmentsForProfile(invs,owner){
  if(owner==="household")return invs||[];
  return(invs||[]).filter(x=>(x.owner||"me")===owner);
}

/* Same rule for assets and liabilities, which gained an `owner` alongside the
   per-profile Net Worth view. The fallback differs on purpose: an investment
   with no owner is "me" (it predates joint accounts and was always personal),
   but an asset with no owner is "household" — migrate() defaults them there
   because the app never asked who owned the car or the loan. Shared so App()
   and NetWorthView filter through exactly one predicate. */
function ownerMatch(rec,profile){
  return profile==="household"||((rec&&rec.owner)||"household")===profile;
}

/* ── Bank interest accrual ─────────────────────────────────────────────────
   Bank balances go stale between manual updates. A bank that credits interest
   daily (Maribank PH does) drifts a little further from reality every day the
   figure isn't retyped.

   `balance` keeps exactly the meaning it always had: the last number a person
   typed, at `balanceAsOf`. It is NEVER auto-written. What the app shows is
   recomputed on read from that anchor:

     netAnnual = tierRate × (1 − taxPct/100)
     value     = balance × (1 + netAnnual/365) ^ (days since balanceAsOf)

   Deriving rather than incrementing was a deliberate call (see decisions.md):
   incrementing double-counts across two synced devices, loses every day the
   app isn't opened, and makes undo unsound. Recomputing from an anchor is
   idempotent — both phones show the same figure after any gap.

   Because the exponent is a whole number of days, the value is *constant
   within a calendar day*: the history/snapshot effects can't watch it drift
   mid-session and loop. Those rows are stamped auto:true, so a day's accrual
   never dirties the document either (see userFingerprint) — no daily KV write.

   Every read goes through bankValue()/bankValuation(), mirroring the single
   investmentValueSar() dispatch convention: extend this rather than writing a
   second accrual reduce anywhere. ── */
const BANK_CREDITING=[["daily","Daily"],["monthly","Monthly"]];
const DEFAULT_BANK_INTEREST=()=>({enabled:true,tiers:[{from:0,rate:0}],taxPct:20,crediting:"daily"});

/* Days since the epoch for a YYYY-MM-DD string, via Date.UTC — parsing both
   ends as local midnight and subtracting would give 23h or 25h across a DST
   boundary, which floors to the wrong number of days. */
function dayNumber(str){
  if(!str)return null;
  const[y,m,d]=String(str).slice(0,10).split("-").map(Number);
  if(!y||!m||!d)return null;
  return Math.round(Date.UTC(y,m-1,d)/86400000);
}
/* Whole calendar months elapsed — the day of the month has to have come round
   again for a month to count as completed. */
function completedMonths(fromStr,toStr){
  const a=String(fromStr||"").slice(0,10).split("-").map(Number);
  const b=String(toStr||"").slice(0,10).split("-").map(Number);
  if(!a[0]||!b[0])return 0;
  let m=(b[0]-a[0])*12+(b[1]-a[1]);
  if(b[2]<a[2])m-=1;
  return Math.max(0,m);
}
/* Tiers are WHOLE-BALANCE, not marginal: the balance selects one tier and
   that rate applies to all of it (confirmed as Maribank's behaviour by the
   account holder). Sorted defensively, since the editor appends rows in
   whatever order they're typed. A balance under every tier's floor earns the
   lowest configured rate rather than nothing — a list starting at 1,000,000
   means "above a million you get more", not "below it you get zero". */
function bankTierRate(interest,balance){
  const tiers=((interest&&interest.tiers)||[])
    .filter(t=>t&&isFinite(Number(t.from))&&isFinite(Number(t.rate)))
    .sort((a,b)=>Number(a.from)-Number(b.from));
  if(!tiers.length)return null;
  let rate=null;
  tiers.forEach(t=>{if(balance>=Number(t.from))rate=Number(t.rate);});
  return rate==null?Number(tiers[0].rate):rate;
}
function bankValuation(bank,asOf){
  const balance=Number(bank&&bank.balance)||0;
  const since=(bank&&bank.balanceAsOf)||null;
  const off={balance,value:balance,accrued:0,days:0,periods:0,rate:null,netRate:0,active:false,since};
  const it=bank&&bank.interest;
  if(!it||it.enabled===false)return off;
  // An overdraft doesn't earn interest, and charging it is a different
  // feature nobody asked for — leave a negative balance exactly as typed.
  if(balance<=0)return off;
  const anchor=dayNumber(since);
  const now=dayNumber(asOf||new Date().toISOString().slice(0,10));
  if(anchor==null||now==null||now<=anchor)return off;
  const rate=bankTierRate(it,balance);
  if(rate==null||!(rate>0))return off;
  const netRate=rate*(1-(Number(it.taxPct)||0)/100);
  const days=now-anchor;
  const monthly=it.crediting==="monthly";
  const periods=monthly?completedMonths(since,asOf||new Date().toISOString().slice(0,10)):days;
  const perPeriod=(netRate/100)/(monthly?12:365);
  const value=Math.round(balance*Math.pow(1+perPeriod,periods)*100)/100;
  return{balance,value,accrued:Math.round((value-balance)*100)/100,days,periods,rate,netRate,active:true,since};
}
/* The number every total should use. Thin wrapper so the reduce call sites
   read like the plain `b.balance` they replaced. */
function bankValue(bank,asOf){return bankValuation(bank,asOf).value;}

/* ── Can you reach it, and what is it for? ────────────────────────────────
   Two independent facts about an account, deliberately NOT collapsed into one
   "don't spend this" flag, because they fail differently:

     accessible:false   a capability. Money in a Philippine account this
                        household can't reach is not spendable no matter how
                        anyone feels about it. Excluded, and reported so the
                        exclusion is visible rather than a silent shortfall.
     purpose:"emergency"  a policy. You CAN spend it; you've decided you
                        shouldn't. So it stays counted, is withheld by default,
                        and can be released for one decision — the same shape
                        the Purchase Advisor's protected goals already use.

   Collapse them and the emergency fund loses the only interesting thing about
   it: being able to ask what raiding it would cost.

   Both read as absent-means-default, which is what lets migrate() leave every
   existing record untouched (see the note there). `purpose` is a one-value
   enum rather than a boolean so a later "sinking fund" or "tax" purpose
   doesn't need a second field; only "emergency" affects arithmetic today. */
const BANK_PURPOSES=[["","Everyday spending"],["emergency","Emergency fund"]];
function bankIsAccessible(b){return!!b&&b.accessible!==false;}
function bankIsReserved(b){return!!b&&b.purpose==="emergency";}
/* Reconcile: fold the accrued estimate into the stored balance and re-anchor
   to today. Anything that credits or debits an account has to do this first,
   or a later day's accrual gets applied to money that only arrived today. */
function settledBankPatch(bank,asOf){
  return{balance:bankValue(bank,asOf),balanceAsOf:asOf};
}

/* ── Liability remaining balance (auto-decrements by month) ── */
function liabilityBalance(liab){
  if(!liab.installment)return Number(liab.value)||0;
  const{monthly,monthsRemaining,asOfDate}=liab;
  if(!monthly||!monthsRemaining||!asOfDate)return Number(liab.value)||0;
  const now=new Date();
  const ref=new Date(asOfDate);
  const elapsed=Math.max(0,(now.getFullYear()-ref.getFullYear())*12+(now.getMonth()-ref.getMonth()));
  const remaining=Math.max(0,monthsRemaining-elapsed);
  return(Number(monthly)||0)*remaining;
}

function migrate(d){
  // Nothing to migrate means an EMPTY document, not the demo one — returning
  // sample records here is the same contamination the split above exists to
  // prevent, just reached through a corrupt localStorage blob.
  if(!d||typeof d!=="object")return structuralDefaults();
  if(!d.owners)d.owners={me:"Me",wife:"My wife"};
  // migrate activePlanId from string to {me, wife}
  if(typeof d.activePlanId==="string"){
    const oldId=d.activePlanId;
    d.activePlanId={me:oldId,wife:null};
    // create a blank wife plan if none exists
    if(!(d.plans||[]).find(p=>p.owner==="wife")){
      const wid=uid();
      d.plans=[...(d.plans||[]),{id:wid,owner:"wife",name:"Monthly Salary",
        month:monthLabel(),income:0,
        groups:[{id:uid(),name:"Savings"},{id:uid(),name:"Essentials"},{id:uid(),name:"Personal"}],
        categories:[]}];
      d.activePlanId.wife=wid;
    }
  }
  if(!d.activePlanId||typeof d.activePlanId!=="object")d.activePlanId={me:(d.plans||[])[0]?.id,wife:null};
  // ensure all plans have an owner
  (d.plans||[]).forEach(p=>{if(!p.owner)p.owner="me";});
  // ensure wife activePlanId points to a real plan
  if(!d.activePlanId.wife){
    const wifePlan=(d.plans||[]).find(p=>p.owner==="wife");
    if(wifePlan)d.activePlanId.wife=wifePlan.id;
  }
  // ensure expenses have owner + split name/note (old data had a single "name" field
  // used as the transaction title; keep that as-is for `name`, add empty `note`)
  (d.expenses||[]).forEach(e=>{
    if(!e.owner)e.owner="me";
    if(e.note===undefined)e.note="";
    if(!e.updatedAt)e.updatedAt=e.date?`${e.date}T00:00:00.000Z`:new Date().toISOString();
    /* Entry order. No row predating this feature has a real creation stamp, so
       updatedAt is the closest honest proxy — a row edited since will drift to
       its edit time, which is accepted rather than pretended away. Runs after
       the updatedAt backfill above, on purpose.

       `ord` is deliberately NOT defaulted: absent means "unplaced, therefore
       newest" — see compareTxForDisplay. Only sanitise a non-numeric one. */
    if(!e.createdAt)e.createdAt=e.updatedAt;
    if(e.ord!==undefined&&!(typeof e.ord==="number"&&isFinite(e.ord)))delete e.ord;
  });
  // ensure monthlyPlans have owner
  (d.monthlyPlans||[]).forEach(m=>{if(!m.owner)m.owner="me";if(!m.updatedAt)m.updatedAt="2000-01-01T00:00:00.000Z";});
  (d.banks||[]).forEach(b=>{
    if(!b.owner)b.owner="me";
    if(!b.updatedAt)b.updatedAt="2000-01-01T00:00:00.000Z";
    /* Interest accrual: every pre-existing account predates both fields. A
       null `interest` block means "behaves exactly as before", so the
       backfilled `balanceAsOf` is inert until someone turns interest on —
       which re-stamps it to that day (see the enable handler in BanksView).
       That matters, because `updatedAt` is only a proxy for "when the balance
       was confirmed": it also moves on a rename, and it's the year-2000
       sentinel above for records old enough to predate it. Accruing 26 years
       of interest off that sentinel is exactly what the re-stamp prevents. */
    if(b.interest===undefined)b.interest=null;
    if(!b.balanceAsOf)b.balanceAsOf=(b.updatedAt||"").slice(0,10)||new Date().toISOString().slice(0,10);
    /* `accessible` and `purpose` (v1.32.0) are deliberately NOT defaulted here,
       and adding a default would be a regression rather than a tidy-up:

         accessible  absent ⇒ true.  "I can reach this money" is what every
                     existing account already meant, so writing `true` onto all
                     of them states a fact the absence already states.
         purpose     absent ⇒ an ordinary spending account.

       Defaulting either one rewrites every bank record on every device's first
       open, which changes the document, which changes the fingerprint, which
       buys a Cloudflare KV write per device for information nobody entered.
       Same reasoning as `goalId` on a category, `fundedCatId` on an installment
       payment and `ord` on an expense — absence is the value. */
  });
  (d.goals||[]).forEach(g=>{
    if(!g.owner)g.owner="me";
    if(!g.type)g.type="savings";
    /* `bankId` and `deadline` (v1.32.0) follow the same absent-means-default
       rule as the two bank fields above — unlinked, and no deadline. A goal
       with no deadline is the normal case, not an incomplete one, so
       goalDeadlineStatus returns null for it and the Goals tab shows the
       pace line it always showed. */
    // migrate old saved→contributions
    if(g.saved!==undefined&&!g.contributions){
      g.contributions=[{id:uid(),date:new Date().toISOString().slice(0,10),amount:g.saved,note:"Migrated balance"}];
      delete g.saved;
    }
    if(!g.contributions)g.contributions=[];
    if(!g.updatedAt)g.updatedAt="2000-01-01T00:00:00.000Z";
  });
  (d.plans||[]).forEach(plan=>{
    (plan.categories||[]).forEach(c=>{
      if(!c.subs)c.subs=[];
      // default every category to tracked unless explicitly marked otherwise,
      // so existing budgets behave exactly as before this feature shipped
      if(c.trackExpenses===undefined)c.trackExpenses=true;
      /* `goalId` (v1.28.0) is deliberately NOT defaulted. The project rule is
         that a new field on an existing record type needs a default here — but
         that rule exists so readers never hit an undefined they must guess at,
         and here **absent already means the only sensible thing**: not linked.
         Writing `goalId:null` onto every category in every plan would change
         fingerprint() for every document and cost each device a KV write to
         say nothing. Same call as `ord` on an expense. */
    });
    /* Rescue categories whose groupId doesn't resolve. Every renderer walks
       groups→categories, so an unresolvable groupId makes the category and all
       its sub-items invisible while `allocated` (which sums all categories)
       still counts them — the budget silently stops adding up. clonePlanForMonth
       used to create these; it no longer can, but a device still running an
       older build can, and would sync the result here. Audited 2026-07-31:
       zero occurrences in live data, so this is a guard, not a repair. */
    const gids=new Set((plan.groups||[]).map(g=>g.id));
    const orphans=(plan.categories||[]).filter(c=>!gids.has(c.groupId));
    if(orphans.length>0){
      if(!plan.groups)plan.groups=[];
      let g=plan.groups.find(x=>x.name==="Ungrouped");
      if(!g){g={id:uid(),name:"Ungrouped"};plan.groups.push(g);}
      orphans.forEach(c=>{c.groupId=g.id;});
    }
    if(!plan.updatedAt)plan.updatedAt="2000-01-01T00:00:00.000Z";
  });
  (d.investments||[]).forEach(inv=>{
    // migrate old shares/avgCost→trades
    if(!inv.trades){
      const s=Number(inv.shares)||0,a=Number(inv.avgCost)||0;
      inv.trades=s>0?[{id:uid(),date:new Date().toISOString().slice(0,10),type:"buy",shares:s,price:a}]:[];
      delete inv.shares;delete inv.avgCost;
    }
    // Investment Accounts (Phase 1): every pre-existing holding predates the
    // owner/type fields, so it's a stock/ETF account belonging to "me"
    // (Jastine) — nothing else is a safe default since that's what every
    // holding in this app has been until now.
    if(!inv.owner)inv.owner="me";
    if(!inv.type)inv.type="stocks";
    if(!inv.updatedAt)inv.updatedAt="2000-01-01T00:00:00.000Z";
    // Phase 2: MP2 / Time Deposit field defaults, so records synced from an
    // older version (or a device on an older build) never render with
    // undefined fields — every reader below assumes these exist.
    if(inv.type==="mp2"){
      if(!inv.currency)inv.currency="PHP";
      if(!inv.payoutMode)inv.payoutMode="compounded";
      if(inv.projectionRate===undefined)inv.projectionRate=6;
      if(!inv.contributions)inv.contributions=[];
      if(!inv.paidDividends)inv.paidDividends=[];
      if(!inv.rateOverrides)inv.rateOverrides={};
      if(inv.notes===undefined)inv.notes="";
      (inv.contributions||[]).forEach(c=>{if(!c.updatedAt)c.updatedAt=c.date?`${c.date}T00:00:00.000Z`:"2000-01-01T00:00:00.000Z";if(c.createdAt===undefined)c.createdAt=c.updatedAt;if(c.note===undefined)c.note="";});
    }
    if(inv.type==="td"){
      if(!inv.currency)inv.currency="PHP";
      if(inv.principal===undefined)inv.principal=0;
      if(inv.rate===undefined)inv.rate=0;
      if(inv.taxRate===undefined)inv.taxRate=0;
      if(!inv.compounding)inv.compounding="maturity";
      if(!inv.status)inv.status="active";
      if(inv.institution===undefined)inv.institution="";
      if(inv.notes===undefined)inv.notes="";
    }
    // Phase 3: Gold — physical bars/coins only, priced off a live spot quote
    // (GOLD_TICKER) rather than a rate table. Karat defaults to 24 (pure)
    // rather than 0, so a record that predates this migration never silently
    // values at $0 purity.
    if(inv.type==="gold"){
      if(!inv.currency)inv.currency="USD";
      if(inv.weight===undefined)inv.weight=0;
      if(!inv.weightUnit)inv.weightUnit="g";
      if(!inv.purityType)inv.purityType="24k";
      if(inv.karat===undefined)inv.karat=inv.purityType==="22k"?22:24;
      if(!inv.purchaseDate)inv.purchaseDate="2000-01-01";
      if(inv.purchaseCost===undefined)inv.purchaseCost=0;
      if(inv.notes===undefined)inv.notes="";
    }
  });
  if(!d.mp2DividendRates)d.mp2DividendRates=[];
  (d.mp2DividendRates||[]).forEach(r=>{if(!r.updatedAt)r.updatedAt="2000-01-01T00:00:00.000Z";});
  if(!d.settings)d.settings={};
  if(d.settings.includeMp2EstimateInNetWorth===undefined)d.settings.includeMp2EstimateInNetWorth=false;
  // Phase 3: gold price rides the automatic staleness-refresh cycle by
  // default; snapshotRetention controls how many days of *daily*-resolution
  // history are kept before compressSnapshots() collapses older entries to
  // weekly, then monthly (see compressSnapshots below).
  if(d.settings.goldAutoRefresh===undefined)d.settings.goldAutoRefresh=true;
  // Benchmark for Home's savings-rate verdict. 20% is a common rule of thumb
  // and only affects what the card *says*, never a stored figure.
  if(d.settings.savingsTargetPct===undefined)d.settings.savingsTargetPct=20;
  if(!d.settings.snapshotRetention)d.settings.snapshotRetention={dailyDays:35,weeklyDays:365};
  if(d.settings.snapshotRetention.dailyDays===undefined)d.settings.snapshotRetention.dailyDays=35;
  if(d.settings.snapshotRetention.weeklyDays===undefined)d.settings.snapshotRetention.weeklyDays=365;
  if(!d.snapshots)d.snapshots=[];
  (d.assets||[]).forEach(a=>{
    if(a.kind==="liability"&&!a.installment){a.installment=false;}
    if(!a.updatedAt)a.updatedAt="2000-01-01T00:00:00.000Z";
    /* Assets and liabilities never had an owner, and per-owner net worth used
       to add ALL of them to BOTH people. Default to "household" (joint) rather
       than guessing a person: the app never asked, and attributing everything
       to "me" would silently hand one person the other's liabilities. The
       visible consequence is that each person's net worth is banks +
       investments until items are re-assigned in Net Worth — see
       docs/decisions.md. */
    if(!a.owner)a.owner="household";
  });
  if(!d.livePrice)d.livePrice={};
  if(d.livePriceAt===undefined)d.livePriceAt=null;
  if(!d.prevClose)d.prevClose={};
  if(!d.homeDisplay)d.homeDisplay={};
  if(!d.homeDisplay.netWorth)d.homeDisplay.netWorth={primary:"PHP",secondary:["SAR","USD","PHP"]};
  if(!d.homeDisplay.portfolio)d.homeDisplay.portfolio={primary:"USD"};
  if(!d.homeDisplay.cash)d.homeDisplay.cash={primary:"PHP"};
  if(!d.homeDisplay.budget)d.homeDisplay.budget={primary:"PHP"};
  if(!d.homeDisplay.savingsInvesting)d.homeDisplay.savingsInvesting={primary:"PHP"};
  // Phase 4 Home Dashboard settings — see defaultData() for field meanings.
  if(!d.homeSettings)d.homeSettings={};
  if(!Array.isArray(d.homeSettings.savingsCategories))d.homeSettings.savingsCategories=[];
  if(!Array.isArray(d.homeSettings.investmentCategories))d.homeSettings.investmentCategories=[];
  if(!d.homeSettings.cardVisibility)d.homeSettings.cardVisibility={};
  ["hero","portfolio","savingsInvesting","trackedSpending","goals"].forEach(k=>{
    if(d.homeSettings.cardVisibility[k]===undefined)d.homeSettings.cardVisibility[k]=true;
  });
  if(!d.portHistory)d.portHistory=[];
  if(!d.expenses)d.expenses=[];
  if(!d.monthlyPlans)d.monthlyPlans=[];
  if(!d.theme)d.theme="light";
  if(!d.payPeriods)d.payPeriods={me:{enabled:false,payday:28},wife:{enabled:false,payday:1}};
  if(!d.payPeriods.me)d.payPeriods.me={enabled:false,payday:28};
  if(!d.payPeriods.wife)d.payPeriods.wife={enabled:false,payday:1};
  /* Corrected period starts. Absent for everyone before this shipped, and an
     empty map is also the fast path in periodKeyFor — so an owner who never
     corrects a period pays exactly what they always did. */
  ["me","wife"].forEach(o=>{
    const as=d.payPeriods[o].actualStarts;
    if(!as||typeof as!=="object"){d.payPeriods[o].actualStarts={};return;}
    /* The "pending" sentinel (salary hasn't arrived yet) was removed: it made a
