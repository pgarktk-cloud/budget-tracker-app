       keyboard up between rows. Losing it here would cost more taps than the
       whole feature saves. See focusField. */
    focusField(nameRef);
  };

  /* transaction log grouped by bucket (calendar month or pay period) */
  const ownerExpenses=expenses.filter(e=>(e.owner||'me')===budgetOwner);
  const allFiltered=filterCat==="all"?[...ownerExpenses]
    :Array.isArray(filterCat)?ownerExpenses.filter(e=>filterCat.includes(e.catId))
    :ownerExpenses.filter(e=>e.catId===filterCat);
  const byMonth={};
  allFiltered.forEach(tx=>{
    if(!tx.date)return;
    const mo=bucketKeyFor(tx.date,payPeriods,budgetOwner);
    if(!byMonth[mo])byMonth[mo]=[];
    byMonth[mo].push(tx);
  });
  const allMonths=Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const GOALS_GROUP_COLOR=P.gr;

  /* shared row renderer — used by both the full month-grouped log below and
     the per-envelope expand list, so the two stay visually identical */
  const renderTxRow=(tx,idx,total,moPlan,showDate=true)=>{
    if(!moPlan)moPlan=planForMonth(bucketKeyFor(tx.date,payPeriods,budgetOwner));
    const env=(moPlan.categories||[]).find(c=>c.id===tx.catId);
    /* An installment payment carries the same shape a goal contribution does —
       catId is the thing it funds, isTransfer is set — so it resolves here the
       same way rather than falling through to a colourless "unknown" row. */
    const inst=!env&&tx.installmentId?(installments||[]).find(x=>x.id===tx.installmentId):null;
    const goal=!env&&!inst?(goals||[]).find(g=>g.id===tx.catId):null;
    const dotColor=env?.color||(inst?installmentProvider(inst.provider).color:goal?GOALS_GROUP_COLOR:P.faint);
    const subLabel=env?env.name:inst?`${installmentProviderLabel(inst)} – ${inst.name}`:goal?goal.name:"";
    /* A category-funded installment payment resolves as an ordinary envelope
       row above (catId IS the category), which is right — but it can be paying
       for a month other than the one it sits in, and nothing else on the row
       would say so. Derived at render, never stored, for the same reason
       "overdue" is: the answer changes with the schedule, not with a flag. */
    const linkedPay=tx.installmentPaymentId
      ?(installmentPayments||[]).find(p=>p.id===tx.installmentPaymentId):null;
    const coversBucket=(env&&linkedPay&&linkedPay.dueDate&&tx.date
      &&bucketKeyFor(linkedPay.dueDate,payPeriods,tx.owner||budgetOwner)
        !==bucketKeyFor(tx.date,payPeriods,tx.owner||budgetOwner))
      ?bucketLabel(bucketKeyFor(linkedPay.dueDate,payPeriods,tx.owner||budgetOwner),
          payPeriods,tx.owner||budgetOwner)
      :null;
    return(
      <div key={tx.id} className="tx-row"
        style={{borderBottom:idx<total-1?"1px solid rgba(0,0,0,.06)":"none"}}>
        <div style={{width:8,height:8,borderRadius:999,
          background:dotColor,flexShrink:0}}/>
        <div className="tx-row-main">
          <div style={{fontSize:14,fontWeight:500,color:P.neuInk,
            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",display:"flex",alignItems:"center",gap:6}}>
            {tx.name}
            {tx.isTransfer&&<span style={{fontSize:9,fontWeight:700,color:P.br,background:P.brS,borderRadius:999,padding:"1px 6px",flexShrink:0}}>TRANSFER</span>}
            {tx.installmentId&&<span style={{fontSize:9,fontWeight:700,color:P.jade,background:P.jadeS,borderRadius:999,padding:"1px 6px",flexShrink:0}}>{tx.installmentPayoff?"PAYOFF":"INSTALLMENT"}</span>}
            {tx.isExtraFunds&&<span style={{fontSize:9,fontWeight:700,color:P.jade,background:P.jadeS,borderRadius:999,padding:"1px 6px",flexShrink:0}}>+EXTRA</span>}
          </div>
          {/* Under a day sub-header the date is repeated noise, and with it
              gone the line can be empty — don't render an empty 11px strip. */}
          {(showDate||subLabel||tx.note||coversBucket)&&
            <div style={{fontSize:11,color:P.neuSub,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              {[showDate?tx.date:"",subLabel,
                coversBucket?`covers ${coversBucket}`:"",tx.note].filter(Boolean).join(" · ")}
            </div>}
        </div>
        <span className="tnum tx-row-amount" style={{fontSize:14,fontWeight:600,color:tx.isExtraFunds?P.jade:P.neuInk,flexShrink:0}}>{tx.isExtraFunds?"+":""}{fmt(tx.amount)}</span>
        <div className="tx-row-actions">
          <IconButton icon={I.Edit} label={`Edit ${tx.name||"transaction"}`} onClick={()=>openEdit(tx)} size={13} style={{color:P.jade,opacity:.6,padding:6,minWidth:32,minHeight:32,flexShrink:0}}/>
          <IconButton icon={I.X} label={`Delete ${tx.name||"transaction"}`} onClick={()=>removeExpenseTx(tx.id)} size={14} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32,flexShrink:0}}/>
        </div>
      </div>
    );
  };

  /* budget-vs-actual trend: trailing 3 buckets (excluding the viewed one)
     average spend per tracked envelope, to flag categories running hot or cold */
  const trendByCat=useMemo(()=>{
    const out={};
    const priorMonths=[addMonths(viewMonth,-1),addMonths(viewMonth,-2),addMonths(viewMonth,-3)];
    envelopes.forEach(env=>{
      const vals=priorMonths.map(mo=>
        expenses.filter(e=>(e.owner||'me')===budgetOwner&&e.catId===env.id&&e.date&&bucketKeyFor(e.date,payPeriods,budgetOwner)===mo)
          .reduce((s,e)=>s+e.amount,0)
      );
      const have=vals.filter(v=>v>0);
      out[env.id]={avg:have.length?have.reduce((a,b)=>a+b,0)/have.length:null,vals:vals.reverse()};
    });
    return out;
  },[envelopes,expenses,budgetOwner,viewMonth,payPeriods]);

  /* burn-rate depletion projection for the viewed bucket (only meaningful for
     the current bucket, where "days elapsed" has real significance) */
  const{elapsed:dayOfMonth,total:daysInMonth}=isNow
    ?bucketProgress(viewMonth,payPeriods,budgetOwner)
    :{elapsed:isFuture?0:9999,total:bucketProgress(viewMonth,payPeriods,budgetOwner).total};
  const burnFor=(env)=>{
    const spent=spentMap[env.id]||0;
    const effBudget=env.budget+(extraFundsMap[env.id]||0);
    if(dayOfMonth<=0||effBudget<=0)return null;
    const dailyRate=spent/dayOfMonth;
    if(dailyRate<=0)return{onPace:true,depleteDay:null,dailyRate:0};
    const depleteDay=Math.ceil(effBudget/dailyRate);
    const onPace=depleteDay>=daysInMonth;
    let depleteDate=null;
    if(!onPace){
      const{start}=usesPayPeriod?periodRange(viewMonth,(payPeriods||{})[budgetOwner]||{payday:1}):{start:(()=>{const[y,mo]=viewMonth.split("-").map(Number);return new Date(y,mo-1,1);})()};
      depleteDate=new Date(start);
      depleteDate.setDate(depleteDate.getDate()+Math.min(depleteDay,daysInMonth)-1);
    }
    return{onPace,depleteDay,depleteDate,dailyRate};
  };

  /* handle clone/assign — source is a *month*, resolved through planForMonth,
     for the same reasons as the Budget tab's copy picker (see the comment on
     copyMonthOptions there): listing raw plan records surfaced orphaned
     duplicates all bearing the same month label, and omitted carry-forward
     months entirely. `plans[0]` as a fallback source was also owner-blind. */
  const handleCreatePlan=()=>{
    const src=cloneSource?planForMonth(cloneSource,budgetOwner):null;
    if(src)clonePlanForMonth(viewMonth,src.id,budgetOwner,fmtMonth(viewMonth));
    setShowPlanPicker(false);
    setCloneSource("");
  };
  const handleAssignExisting=(pid)=>{
    assignPlanToMonth(viewMonth,pid,budgetOwner);
    setShowPlanPicker(false);
  };

  /* candidate source months for the plan picker */
  const clonePlanMonths=useMemo(()=>{
    // same shape as BudgetView's copyMonthOptions — anchored on the viewed
    // month and reaching forwards too, since any month can have a plan now
    const mapped=(data.monthlyPlans||[]).filter(m=>!m.deletedAt&&m.planId);
    const range=[];
    for(let i=-12;i<=3;i++)range.push(addMonths(viewMonth,i));
    const owned=mapped.filter(m=>m.owner===budgetOwner).map(m=>m.month)
      .filter(m=>String(m).length===String(viewMonth).length);
    const out=[];
    [...new Set([...range,...owned])].filter(m=>m!==viewMonth).sort().reverse().forEach(m=>{
      const p=planForMonth(m,budgetOwner);
      if(!p)return;
      out.push({month:m,plan:p,custom:!!mapped.find(x=>x.month===m&&x.owner===budgetOwner),future:m>nowMonth});
    });
    return out;
  },[nowMonth,viewMonth,budgetOwner,plans,data.monthlyPlans,JSON.stringify(payPeriods)]);

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px",transition:"background .25s ease"}}>
      {/* ── owner toggle ── */}
      <OwnerToggle owner={budgetOwner} setOwner={setBudgetOwner} owners={owners}/>

      {/* ── month navigator (glass) ── */}
      <div className="glass-panel" style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"10px 14px"}}>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,-1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>‹</button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontSize:15,fontWeight:700,color:P.ink}}>{fmtMonth(viewMonth)}</div>
          <div style={{fontSize:11,fontWeight:600,marginTop:1,
            color:isFuture?P.br:isNow?P.jade:P.faint}}>
            {isFuture?"Planning ahead":isNow?(usesPayPeriod?"Current pay period":"Current month"):(usesPayPeriod?"Past pay period":"Past month")}
          </div>
        </div>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>›</button>
        {viewMonth!==nowMonth&&(
          <button className="glass-btn" onClick={()=>setViewMonth(nowMonth)}
            style={{padding:"4px 10px",fontSize:12,fontWeight:600,color:P.jade}}>
            Today
          </button>
        )}
      </div>

      {/* ── monthly plan banner ── */}
      <div style={{...neu(14),padding:"12px 14px",marginBottom:12,
        display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:hasOwnPlan?P.jade:P.neuSub}}>
            <I.Receipt size={12}/>
            {hasOwnPlan?monthPlan.name
              :planSource.fromMonth?`Carried forward from ${fmtMonth(planSource.fromMonth)}`
              :"Base plan"}
          </div>
          <div style={{fontSize:11,color:hasOwnPlan?P.jade:P.neuSub,marginTop:2,opacity:.85}}>
            {hasOwnPlan
              ?`Income: ${cur} ${(monthPlan.income||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} · Custom budget for ${fmtMonth(viewMonth)}`
              :`Showing allocations from "${monthPlan.name}". Create a plan for ${fmtMonth(viewMonth)} to set a different income or allocation — or just edit the amounts in the Budget tab and a copy is made for you.`
            }
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          {hasOwnPlan
            ?<button onClick={()=>removePlanForMonth(viewMonth,budgetOwner)} className="neu-btn"
                style={{fontSize:11,padding:"5px 12px",color:P.wine,fontWeight:500}}>
                Remove
              </button>
            :<button onClick={()=>{setCloneSource(plans[0]?.id||"");setShowPlanPicker(true);}} className="neu-btn"
                style={{fontSize:11,padding:"5px 12px",color:P.jade,fontWeight:600}}>
                + Create plan
              </button>
          }
        </div>
      </div>

      {/* ── hero summary (neumorphic dark tile + signature liquid-glass bar).
             The "salary not yet spent" figure used to be its own card above
             this one; it's now the tappable pill in the header, which opens
             the breakdown sheet rather than leaving the maths unexplained. ── */}
      <div className="fade-up-1" style={{borderRadius:18,padding:16,marginBottom:16,
        background:isFuture?`linear-gradient(135deg,${P.br} 0%,${P.grD} 100%)`:P.deep,color:"#fff",
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:500,color:P.deepHi}}>
            {fmtMonth(viewMonth)} {isFuture?"plan":"spending"}
          </div>
          <button onClick={()=>setShowUnaccounted(true)} aria-label="How this is calculated"
            className="tnum" style={{flexShrink:0,display:"flex",alignItems:"center",gap:5,fontSize:11,fontWeight:600,
              borderRadius:999,padding:"4px 10px",border:"none",background:"rgba(0,0,0,.25)",
              color:totalUnallocatedOrUntransferred<0?"#F87171":P.deepHi}}>
            {totalUnallocatedOrUntransferred<0?"Over-transferred":"Unaccounted"} {fmt(Math.abs(totalUnallocatedOrUntransferred))}
            <I.Info size={12}/>
          </button>
        </div>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"baseline",gap:7,minWidth:0}}>
            <span key={totalSpent} className="serif tnum num-flash" style={{fontSize:28,fontWeight:600,
              color:totalSpent>totalBudget?"#F87171":"#fff"}}>{fmt(totalSpent)}</span>
            <span className="tnum" style={{fontSize:14,color:P.deepHi}}>of {fmt(totalBudget)}</span>
          </div>
          <div style={{textAlign:"right"}}>
            <span key={totalLeft} className="tnum num-flash" style={{fontSize:18,fontWeight:600,
              color:totalLeft>=0?"#4ADE80":"#F87171"}}>{fmt(Math.abs(totalLeft))}</span>
            <span style={{fontSize:12,color:P.deepHi,marginLeft:5}}>
              {totalLeft>=0?(isFuture?"available":"left"):"over"}
            </span>
          </div>
        </div>
        <div style={{marginTop:12,height:16,background:"rgba(0,0,0,.28)",borderRadius:999,overflow:"hidden",
          boxShadow:"inset 2px 2px 5px rgba(0,0,0,.35),inset -1px -1px 3px rgba(255,255,255,.06)"}}>
          {(()=>{
            const fc=totalSpent>=totalBudget?"#F87171":totalSpent/totalBudget>=.8?"#E07B2A":"#4ADE80";
            return <div className="bar-animated liquid-fill" style={{height:"100%",width:`${Math.min(100,totalBudget>0?(totalSpent/totalBudget)*100:0)}%`,
              background:`linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.05) 45%, ${fc}CC 45%, ${fc} 100%)`}}/>;
          })()}
        </div>
        {/* biggest spenders — the full envelope list is right below, so this is
            just the top few, as bars rather than Home's text-only rows */}
        {(()=>{
          const top=envelopes
            .map(e=>({name:e.name,spent:spentMap[e.id]||0,budget:e.budget+(extraFundsMap[e.id]||0)}))
            .filter(r=>r.spent>0)
            .sort((a,b)=>b.spent-a.spent)
            .slice(0,4);
          if(!top.length)return null;
          return(
            <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
              {top.map(r=>{
                const p=r.budget>0?(r.spent/r.budget)*100:100;
                const c=statusColor(r.spent,r.budget);
                return(
                  <div key={r.name} style={{display:"flex",alignItems:"center",gap:9,fontSize:12}}>
                    <span style={{width:"32%",flexShrink:0,color:P.deepHi,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
                    <span style={{flex:1,height:6,background:"rgba(0,0,0,.28)",borderRadius:999,overflow:"hidden"}}>
                      <span style={{display:"block",height:"100%",width:`${Math.min(100,p)}%`,background:c,borderRadius:999,transition:"width .4s ease"}}/>
                    </span>
                    <span className="tnum" style={{width:38,textAlign:"right",flexShrink:0,color:c,fontWeight:600}}>{Math.round(p)}%</span>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </div>

      {showUnaccounted&&
        <UnaccountedSheet monthLabel={fmtMonth(viewMonth)} income={totalIncome} parts={unaccountedParts}
          total={totalUnallocatedOrUntransferred} fmt={fmt} onClose={()=>setShowUnaccounted(false)}/>}

      {/* ── envelopes ── */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8,flexWrap:"wrap"}}>
        <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Envelopes</h2>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {(monthPlan.categories||[]).length>1&&(
            <button onClick={()=>setShowReorder(true)} className="neu-btn"
              style={{display:"flex",alignItems:"center",gap:5,padding:"6px 10px",
                fontSize:12,fontWeight:600,color:P.neuSub}}>
              <I.ArrowUp size={10}/><I.ArrowDown size={10}/>Reorder
            </button>
          )}
          <button onClick={()=>openAdd()} className="neu-btn"
            style={{display:"flex",alignItems:"center",gap:6,padding:"6px 14px",
              fontSize:14,fontWeight:500,color:isFuture?P.br:P.jade}}>
            <I.Plus size={14}/>{isFuture?"Plan transaction":"Add transaction"}
          </button>
        </div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
        {envelopes.length===0
          ?<div style={{...neuInset(14),padding:16,textAlign:"center",fontSize:13,color:P.neuSub}}>
              No tracked categories found. Add categories in the Budget tab, or check that they aren't marked "Untracked".
            </div>
          :envelopes.map(env=>{
            const spent=spentMap[env.id]||0;
            const extra=extraFundsMap[env.id]||0;
            const effBudget=env.budget+extra;
            const left=effBudget-spent;
            const ratio=effBudget>0?spent/effBudget:0;
            const trend=trendByCat[env.id];
            const burn=isNow?burnFor(env):null;
            const expectedRatio=isNow&&daysInMonth>0?dayOfMonth/daysInMonth:null;
            const pacing=paceHot(spent,effBudget,expectedRatio);
            const color=pacing?P.amber:statusColor(spent,effBudget);
            const bg=pacing?P.amberS:statusBg(spent,effBudget);
            const catTxs=viewMonthExpenses.filter(e=>e.catId===env.id);
            const envTxs=[...catTxs].sort(compareTxForDisplay);
            const envTxsTotal=catTxs.reduce((s,t)=>s+t.amount,0);
            const envMoPlan=planForMonth(viewMonth);
            const envOpen=!!expandedEnvelopes[env.id];
            return(
              <div key={env.id} style={{...neu(14),padding:"12px 16px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{width:8,height:8,borderRadius:999,background:env.color,flexShrink:0}}/>
                  <span style={{flex:1,fontSize:14,fontWeight:600,color:P.neuInk}}>{env.name}</span>
                  {pacing&&(
                    <span title="Spending is outpacing the calendar for this period"
                      style={{fontSize:10,fontWeight:600,color:P.amber,display:"flex",alignItems:"center",gap:2}}>
                      <I.TrendUp size={10}/>pace
                    </span>
                  )}
                  {trend&&trend.avg!=null&&(
                    <span title={`3-month avg: ${fmt(trend.avg)}`}
                      style={{fontSize:10,fontWeight:600,color:spent>trend.avg*1.15?P.wine:spent<trend.avg*0.85?P.jade:P.neuSub,
                        display:"flex",alignItems:"center",gap:2}}>
                      {spent>trend.avg*1.15?<I.ArrowUp size={10}/>:spent<trend.avg*0.85?<I.ArrowDown size={10}/>:null}
                      avg {fmt(trend.avg)}
                    </span>
                  )}
                  <span style={{fontSize:11,color:P.neuSub}}>{env.group}</span>
                  {extra>0&&(
                    <span title={`${fmt(extra)} extra funds added this month`}
                      style={{fontSize:10,fontWeight:700,color:P.jade,background:P.jadeS,borderRadius:999,padding:"2px 7px",display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                      <I.Plus size={9}/>{fmt(extra)}
                    </span>
                  )}
                  <button onClick={()=>toggleEnvelope(env.id)} title={envOpen?"Hide transactions":"Show transactions"}
                    style={{background:"transparent",border:"none",color:envOpen?P.jade:P.neuSub,padding:2,display:"flex",alignItems:"center",flexShrink:0}}>
                    <I.Chevron size={14} style={{transform:envOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
                  </button>
                </div>
                {/* liquid-glass fill in a neumorphic inset trough */}
                <div style={{...neuInset(999),height:8,marginBottom:6,position:"relative",overflow:"hidden"}}>
                  <div className="bar-animated liquid-fill" style={{width:`${Math.min(100,ratio*100)}%`,height:"100%",
                    background:`linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.05) 45%, ${color}CC 45%, ${color} 100%)`}}/>
                  {expectedRatio!=null&&expectedRatio<1&&(
                    <div style={{position:"absolute",top:0,bottom:0,left:`${Math.min(100,expectedRatio*100)}%`,width:1,background:"rgba(0,0,0,.3)"}} title="Even pace for today"/>
                  )}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12}} className="tnum">
                  <span style={{color:P.neuSub}}>
                    {isFuture?"Planned":"Spent"} <strong style={{color:P.neuInk}}>{fmt(spent)}</strong> of {fmt(effBudget)}
                  </span>
                  <span style={{fontWeight:600,color,background:bg,borderRadius:8,padding:"1px 8px"}}>
                    {left>=0?`${fmt(left)} left`:`${fmt(-left)} over`}
                  </span>
                </div>
                {burn&&!burn.onPace&&burn.depleteDate&&(
                  <div style={{marginTop:8,display:"flex",alignItems:"center",gap:6,fontSize:11,fontWeight:600,color:P.amber,background:P.amberS,borderRadius:8,padding:"5px 8px"}}>
                    <I.TrendUp size={12}/>
                    At this pace, depletes around {burn.depleteDate.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                  </div>
                )}
                <div style={{display:"flex",alignItems:"center",gap:14,marginTop:8}}>
                  <button onClick={()=>openAdd(env.id)}
                    style={{display:"flex",alignItems:"center",gap:5,fontSize:12,fontWeight:500,color:P.jade,background:"transparent",border:"none",padding:0}}>
                    <I.Plus size={12}/>Add to {env.name}
                  </button>
                  <button onClick={()=>setExtraFundsModal({catId:env.id,name:env.name})}
                    style={{display:"flex",alignItems:"center",gap:5,fontSize:12,fontWeight:500,color:P.br,background:"transparent",border:"none",padding:0}}>
                    <I.Send size={12}/>Add extra funds
                  </button>
                </div>
                {/* ── inline transactions for this envelope, tap the chevron above to reveal ── */}
                {envOpen&&(
                  <div style={{marginTop:10,paddingTop:8,borderTop:`1px solid rgba(0,0,0,.06)`}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:P.neuSub,marginBottom:4}}>
                      <span>{envTxs.length} transaction{envTxs.length===1?"":"s"}</span>
                      {envTxs.length>0&&<span className="tnum" style={{fontWeight:600}}>{fmt(envTxsTotal)}</span>}
                    </div>
                    {envTxs.length===0
                      ?<div style={{fontSize:12,color:P.neuSub,padding:"8px 0"}}>No transactions logged for {env.name} yet.</div>
                      :envTxs.map((tx,idx)=>renderTxRow(tx,idx,envTxs.length,envMoPlan))
                    }
                  </div>
                )}
              </div>
            );
          })
        }
      </div>

      {/* ── untracked categories — quick transfer ── */}
      {untrackedEnvelopes.length>0&&(
        <>
          <button onClick={()=>setUntrackedOpen(o=>!o)}
            style={{display:"flex",alignItems:"center",gap:6,marginBottom:untrackedOpen?10:20,width:"100%",
              background:"transparent",border:"none",padding:0,cursor:"pointer",textAlign:"left"}}>
            <I.Chevron size={13} style={{color:P.neuSub,transform:untrackedOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s",flexShrink:0}}/>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Untracked transfers</h2>
            <span style={{fontSize:11,color:P.neuSub,opacity:.75}}>{untrackedOpen?"one-time allocations, not itemized":`${untrackedEnvelopes.length} hidden`}</span>
          </button>
          {untrackedOpen&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
            {untrackedEnvelopes.map(env=>{
              const funded=fundedMap[env.id]||0;
              const isFunded=funded>=env.budget&&funded>0;
              const lastAmt=quickTransferLast?.[env.id];
              return(
                <div key={env.id} style={{...neu(14),padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                  <span style={{width:8,height:8,borderRadius:999,background:env.color,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:P.neuInk}}>{env.name}</div>
                    <div className="tnum" style={{fontSize:11,color:isFunded?P.jade:P.neuSub,marginTop:1}}>
                      {isFunded?`✓ Transferred ${fmt(funded)}`:`Budgeted ${fmt(env.budget)} · not yet transferred`}
                    </div>
                    {/* The link is set in Budget but SPENT here, so it has to
                        be visible here — otherwise a transfer quietly credits
                        a goal and the only clue is the goal moving. Reads the
                        live goal, so a deleted one simply stops showing. */}
                    {(()=>{
                      const g=categoryGoalFor((monthPlan.categories||[]).find(c=>c.id===env.id),goals);
                      return g?(
                        <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:P.neuSub,marginTop:2,opacity:.8}}>
                          <I.Target size={10}/>Also credits {g.name}
                        </div>
                      ):null;
                    })()}
                  </div>
                  <button onClick={()=>setTransferModal({catId:env.id,name:env.name,budget:env.budget,suggested:lastAmt||env.budget})}
                    className={isFunded?"neu-btn":""}
                    style={{display:"flex",alignItems:"center",gap:5,borderRadius:999,padding:"6px 12px",fontSize:12,fontWeight:600,
                      background:isFunded?undefined:P.br,color:isFunded?P.neuSub:"#fff",border:"none",flexShrink:0}}>
                    <I.Send size={11}/>{isFunded?"Add more":"Transfer"}
                  </button>
                </div>
              );
            })}
          </div>}
        </>
      )}

      {/* ── transaction log — collapsed by default, expand to browse ── */}
      <button onClick={()=>setLogExpanded(o=>!o)}
        style={{display:"flex",alignItems:"center",gap:6,marginBottom:logExpanded?8:20,width:"100%",
          background:"transparent",border:"none",padding:0,cursor:"pointer",textAlign:"left"}}>
        <I.Chevron size={13} style={{color:P.neuSub,transform:logExpanded?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s",flexShrink:0}}/>
        <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>All transactions</h2>
        <span style={{fontSize:11,color:P.neuSub,opacity:.75}}>{logExpanded?`${allFiltered.length} entries`:`${allFiltered.length} hidden`}</span>
      </button>

      {logExpanded&&(
        <>
          <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",marginBottom:8,flexWrap:"wrap",gap:8}}>
            {/* Multi-category filters (Home's Savings & Investing drill-down) don't
                map onto this single-select — shown as one extra option that falls
                back to "All categories" the moment the user picks anything else. */}
            <select value={Array.isArray(filterCat)?"__multi__":filterCat} onChange={e=>{if(e.target.value!=="__multi__")setFilterCat(e.target.value);}}
              style={{...neu(999),padding:"4px 10px",fontSize:12,border:"none",color:P.neuSub}}>
              <option value="all">All categories</option>
              {Array.isArray(filterCat)&&<option value="__multi__">{filterCat.length} categories (from Home)</option>}
              {envelopes.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              {untrackedEnvelopes.map(e=><option key={e.id} value={e.id}>{e.name} (untracked)</option>)}
            </select>
          </div>

          {allFiltered.length===0
            ?<div style={{...neuInset(16),padding:"24px 16px",textAlign:"center",fontSize:13,color:P.neuSub,marginBottom:20}}>
                No transactions yet. Tap "Add transaction" to start tracking.
              </div>
            :allMonths.map(mo=>{
              const txs=[...byMonth[mo]].sort(compareTxForDisplay);
              const moPlan=planForMonth(mo);
              const isCurrent=mo===nowMonth;
              const isViewing=mo===viewMonth;
              const isFutureMo=mo>nowMonth;
              const defaultOpen=isCurrent||isFutureMo||isViewing;
              const isOpen=collapsedMonths[mo]===undefined?defaultOpen:!collapsedMonths[mo];
              const monthTotal=txs.reduce((s,t)=>s+t.amount,0);
              const moLabel=fmtMonth(mo);
              /* compareTxForDisplay sorts by date first, so same-day rows are
                 already contiguous — one pass, no grouping map needed. */
              const days=[];
              txs.forEach(tx=>{
                const last=days[days.length-1];
                if(last&&last.date===tx.date)last.rows.push(tx);
                else days.push({date:tx.date,rows:[tx]});
              });

              const labelColor=isCurrent?P.jade:isFutureMo?P.br:P.neuInk;

              return(
                <div key={mo} style={{...neu(16),overflow:"hidden",marginBottom:10,
                  ...(isViewing?{boxShadow:`0 0 0 2px ${P.jade}, 7px 7px 15px ${P.neuLo}, -7px -7px 15px ${P.neuHi}`}:{}),
                  transition:"box-shadow .2s"}}>
                  <button
                    onClick={()=>setCollapsedMonths(c=>({...c,[mo]:isOpen}))}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",
                      padding:"12px 16px",background:"transparent",border:"none",cursor:"pointer",
                      borderBottom:isOpen?"1px solid rgba(0,0,0,.06)":"none",textAlign:"left"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <I.Chevron size={14} style={{color:P.neuSub,transform:isOpen?"rotate(180deg)":"rotate(0deg)",
                        transition:"transform .2s",flexShrink:0}}/>
                      <span style={{fontSize:14,fontWeight:700,color:labelColor}}>{moLabel}</span>
                      {isCurrent&&<span style={{fontSize:10,borderRadius:999,padding:"2px 7px",
                        background:P.jade,color:"#fff",fontWeight:700}}>NOW</span>}
                      {isFutureMo&&<span style={{fontSize:10,borderRadius:999,padding:"2px 7px",
                        background:P.br,color:"#fff",fontWeight:700}}>PLANNED</span>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span className="tnum" style={{fontSize:12,color:P.neuSub}}>{txs.length} tx</span>
                      <span className="tnum" style={{fontSize:13,fontWeight:700,color:P.neuInk}}>{fmt(monthTotal)}</span>
                    </div>
                  </button>

                  {isOpen&&days.map(day=>(
                    <div key={day.date}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,
                        padding:"5px 16px",background:"rgba(0,0,0,.03)"}}>
                        <span style={{fontSize:11,fontWeight:700,color:P.neuSub}}>{dayLabel(day.date)}</span>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span className="tnum" style={{fontSize:11,color:P.neuSub}}>
                            {fmt(day.rows.reduce((s,t)=>s+t.amount,0))}
                          </span>
                          {day.rows.length>1&&
                            <button onClick={()=>setDayReorder({date:day.date,ids:day.rows.map(r=>r.id)})}
                              aria-label={`Reorder ${dayLabel(day.date)}`}
                              style={{display:"flex",alignItems:"center",gap:1,background:"transparent",
                                border:"none",padding:"2px 4px",color:P.neuSub,opacity:.55}}>
                              <I.ArrowUp size={10}/><I.ArrowDown size={10}/>
                            </button>}
                        </div>
                      </div>
                      {day.rows.map((tx,i)=>renderTxRow(tx,i,day.rows.length,moPlan,false))}
                    </div>
                  ))}
                </div>
              );
            })
          }
        </>
      )}

      {/* ── add/edit transaction modal ── */}
      {showAdd&&(
        <Portal>
        <div className="sheet-bg" onClick={closeForm}>
          <div className="sheet" ref={addDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>
                {editTx?"Edit transaction":isFuture?"Plan transaction":"Add transaction"}
              </h3>
              <IconButton icon={I.X} label="Close" onClick={closeForm} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>

            <div style={{fontSize:12,color:isFuture?P.br:P.faint,marginBottom:14}}>
              {editTx?`Editing entry for ${fmtMonth(form.date?bucketKeyFor(form.date,payPeriods,budgetOwner):viewMonth)}`:isFuture?`Planning ahead for ${fmtMonth(viewMonth)}`:`Recording for ${fmtMonth(viewMonth)}`}
            </div>

            {/* ── segmented control: Tracked / Untracked / Goals — hidden while editing an existing entry ── */}
            {!editTx&&(
              <div style={{display:"flex",gap:4,marginBottom:14,background:"rgba(0,0,0,.05)",borderRadius:999,padding:3}}>
                {[["tracked","Tracked"],["untracked","Untracked"],["goals","Goals"]].map(([mv,label])=>(
                  <button key={mv} onClick={()=>{setAddMode(mv);setForm(f=>({...f,catId:"",goalId:"",name:""}));}}
                    style={{flex:1,borderRadius:999,padding:"6px 0",fontSize:12,fontWeight:600,border:"none",
                      background:addMode===mv?P.jade:"transparent",color:addMode===mv?"#fff":P.sub}}>
                    {label}
                  </button>
                ))}
              </div>
            )}

            {/* ── Repeat: refill a whole past transaction in one tap ──
                Deliberately a SEPARATE affordance from the name chips under
                Title, which still fill the name only. Two controls with two
                honest meanings beats one chip whose effect depends on where it
                came from — and it leaves the name chips free to keep narrowing
                as you type, which is their whole job.
                Amount is prefilled and then selected, so a recurring-but-
                varying cost (groceries) costs one keystroke rather than being
                a reason not to prefill at all. */}
            {/* ── Shortcuts: the pinned, synced half of the same idea ──
                Its own row rather than merged into Repeat, for the reason the
                name chips stayed separate in v1.24.0: one row that sometimes
                offers a delete affordance and sometimes doesn't is harder to
                explain than two rows that each mean one thing. Renders only
                when the owner has pinned something, so it costs nothing to
                anyone who never uses it. */}
            {!editTx&&addMode==="tracked"&&shortcutTemplates.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Shortcuts</div>
                <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2,
                  scrollbarWidth:"none",WebkitOverflowScrolling:"touch"}}>
                  {shortcutTemplates.map(t=>(
                    <div key={t.id} style={{flexShrink:0,display:"flex",alignItems:"center",
                      borderRadius:999,background:P.jadeS||"rgba(0,0,0,.05)",maxWidth:215}}>
                      <button onMouseDown={e=>e.preventDefault()}
                        onClick={()=>{
                          setForm(f=>({...f,catId:t.catId,name:t.name,
                            note:t.note||f.note,amount:String(t.amount)}));
                          focusField(amountRef);
                        }}
                        style={{display:"flex",alignItems:"baseline",gap:6,background:"transparent",
                          border:"none",padding:"5px 4px 5px 11px",color:P.sub,fontSize:12,minWidth:0}}>
                        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</span>
                        <span className="tnum" style={{fontWeight:600,color:P.ink,flexShrink:0}}>{fmt(t.amount)}</span>
                      </button>
                      {/* Unpin. Destructive-but-cheap, so it takes the undo
                          toast rather than a confirm dialog — the same trade
                          every other delete in this app makes. */}
                      <button onClick={()=>removeTxTemplate(t.id)}
                        aria-label={`Remove shortcut ${t.name}`}
                        style={{background:"transparent",border:"none",padding:"5px 9px 5px 3px",
                          color:P.sub,opacity:.5,display:"flex",alignItems:"center"}}>
                        <I.X size={12}/>
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {!editTx&&addMode==="tracked"&&repeatTemplates.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Repeat</div>
                <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2,
                  scrollbarWidth:"none",WebkitOverflowScrolling:"touch"}}>
                  {repeatTemplates.map(t=>(
                    <button key={t.key} onMouseDown={e=>e.preventDefault()}
                      onClick={()=>{
                        setForm(f=>({...f,catId:t.catId,name:t.name,amount:String(t.amount)}));
                        focusField(amountRef);
                      }}
                      style={{flexShrink:0,display:"flex",alignItems:"baseline",gap:6,
                        borderRadius:999,padding:"5px 11px",background:"rgba(0,0,0,.05)",
                        border:"none",color:P.sub,fontSize:12,maxWidth:190}}>
                      <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</span>
                      <span className="tnum" style={{fontWeight:600,color:P.ink,flexShrink:0}}>{fmt(t.amount)}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ── category / envelope / goal dropdown, dynamic by mode ──
                A linked installment row shows its plan read-only instead: the
                category, the owner and the link are all fixed, because moving
                one half of a linked chain is exactly the corruption this
                module is built to prevent. Unlinking is the one deliberate
                way out, and it's warned. */}
            {editLinkedInst?(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Installment</div>
                <div style={{borderRadius:10,padding:"10px",background:"rgba(0,0,0,.05)"}}>
                  <div style={{fontSize:14,fontWeight:600,color:P.ink}}>
                    {installmentProviderLabel(editLinkedInst)} – {editLinkedInst.name}
                  </div>
                  <div style={{fontSize:11,color:P.faint,marginTop:2}}>
                    {editingTxRec&&editingTxRec.installmentPayoff
                      ?"Early payoff"
                      :editLinkedPayment
                        ?`Payment #${editLinkedPayment.sequence} · scheduled ${fmt(editLinkedPayment.scheduledAmount)}`
                        :"Linked payment"}
                    {" · "}{owners[editingTxRec.owner||"me"]||editingTxRec.owner}
                  </div>
                  <button onClick={()=>setConfirmUnlink(editTx)}
                    style={{marginTop:8,background:"transparent",border:"none",padding:"6px 0",
                      minHeight:36,fontSize:12,fontWeight:600,color:P.wine}}>
                    Unlink from installment
                  </button>
                </div>
                <div style={{fontSize:11,color:P.faint,marginTop:6}}>
                  Changing the amount or date here updates the installment payment too.
                </div>
              </div>
            ):addMode==="goals"&&!editTx?(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Goal</div>
                <select value={form.goalId} onChange={e=>setForm(f=>({...f,goalId:e.target.value}))}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                    background:"rgba(0,0,0,.05)",border:form.goalId?"none":`1px solid ${P.red}`,color:P.ink}}>
                  <option value="">Select a goal…</option>
                  {ownerGoals.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
                </select>
                {ownerGoals.length===0&&<div style={{fontSize:11,color:P.faint,marginTop:4}}>No active goals for {owners[budgetOwner]} yet — add one in the Goals tab.</div>}
              </div>
            ):(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Category</div>
                <select value={form.catId} onChange={e=>setForm(f=>({...f,catId:e.target.value}))}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                    background:"rgba(0,0,0,.05)",border:form.catId?"none":`1px solid ${P.red}`,color:P.ink}}>
                  <option value="">Select a category…</option>
                  {addMode==="untracked"&&!editTx
                    ?untrackedEnvelopes.map(e=><option key={e.id} value={e.id}>{e.name}</option>)
                    :(monthPlan.groups||[]).map(g=>{
                        const opts=allCatOptions.filter(c=>c.groupId===g.id&&c.tracked);
                        if(opts.length===0)return null;
                        return(
                          <optgroup key={g.id} label={g.name}>
                            {opts.map(c=>(
                              <option key={c.id} value={c.id}>{c.name}</option>
                            ))}
                          </optgroup>
                        );
                      })
                  }
                </select>
              </div>
            )}

            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Title{addMode==="goals"&&!editTx?<span style={{color:P.faint,fontWeight:400}}> (optional)</span>:null}</div>
              <input ref={nameRef} value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
                placeholder={addMode==="goals"&&!editTx?"e.g. Monthly deposit":"e.g. Amazon Now"}
                style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                  background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              {/* Remembered names, narrowing as you type. Rendered in flow (the
                  modal scrolls, so an absolutely positioned popup would clip),
                  and onMouseDown-prevented so the tap lands before the input's
                  blur can tear the list down. */}
              {addMode==="tracked"&&!editLinkedInst&&(()=>{
                const sugg=rankNameSuggestions(nameCandidates,form.name);
                const typed=(form.name||"").trim().toLowerCase();
                if(!sugg.length)return null;
                if(sugg.length===1&&String(sugg[0]).toLowerCase()===typed)return null;
                return (
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>
                    {sugg.map(n=>(
                      <button key={n} onMouseDown={e=>e.preventDefault()}
                        onClick={()=>setForm(f=>({...f,name:n}))}
                        style={{fontSize:11,borderRadius:999,padding:"3px 9px",background:"rgba(0,0,0,.05)",border:"none",color:P.sub}}>
                        {n}
                      </button>
                    ))}
                  </div>
                );
              })()}
            </div>

            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Note <span style={{color:P.faint,fontWeight:400}}>(optional)</span></div>
              <input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}
                placeholder="e.g. bought a charger + cable"
                style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                  background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            </div>

            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount ({cur})</div>
                <input ref={amountRef} type="text" inputMode="decimal" value={form.amount}
                  onChange={e=>setForm(f=>({...f,amount:e.target.value}))}
                  onBlur={e=>setForm(f=>({...f,amount:e.target.value.trim()===""?"":String(evalMathExpr(e.target.value,Number(f.amount)||0))}))}
                  onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur();}}
                  placeholder="0"
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                    background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Date</div>
                <input type="date" value={form.date}
                  onChange={e=>setForm(f=>({...f,date:e.target.value}))}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,
                    background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
            </div>

            {addMode==="tracked"&&form.catId&&form.amount&&(()=>{
              const env=envelopes.find(e=>e.id===form.catId);
              if(!env)return null;
              const effBudget=env.budget+(extraFundsMap[env.id]||0);
              const editingTx=editTx?expenses.find(e=>e.id===editTx):null;
              const excludeAmt=(editingTx&&editingTx.catId===form.catId)?editingTx.amount:0;
              const already=(spentMap[form.catId]||0)-excludeAmt;
              const after=already+Number(form.amount);
              const left=effBudget-after;
              return(
                <div style={{borderRadius:10,padding:10,marginBottom:12,
                  background:left<0?P.redS:left/effBudget<.2?P.amberS:"rgba(0,0,0,.05)",
                  fontSize:13}} className="tnum">
                  <span style={{color:P.sub}}>{env.name}: </span>
                  <span style={{fontWeight:600,color:statusColor(after,effBudget)}}>
                    {left>=0?`${fmt(left)} remaining after this`:`${fmt(-left)} over budget`}
                  </span>
                </div>
              );
            })()}

            <div style={{display:"flex",gap:8}}>
              {editTx&&(
                <button onClick={()=>{removeExpenseTx(editTx);closeForm();}} className="neu-btn"
                  style={{padding:"10px 16px",fontSize:14,fontWeight:600,color:P.wine}}>
                  Delete
                </button>
              )}
              <button onClick={submitTx}
                style={{flex:1,borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                  background:isFuture?P.br:P.jade,color:"#fff",border:"none",
                  opacity:(editTx?(!form.catId||!form.name||!form.amount)
                    :addMode==="goals"?(!form.goalId||!form.amount)
                    :addMode==="untracked"?(!form.catId||!form.amount)
                    :(!form.catId||!form.name||!form.amount))?.5:1}}>
                {editTx?"Save changes":addMode==="goals"?"Add to goal":addMode==="untracked"?"Transfer":isFuture?"Save planned transaction":"Record transaction"}
              </button>
            </div>

            {/* ── rapid entry ──
                Below the primary rather than beside it: at 390px "Record
                transaction" and this label side by side squeeze both into two
                lines. Kept out of the flex row above so the Delete button's
                layout while editing is untouched.
                Not `disabled` — a disabled button swallows the blur that
                commits the amount field's draft (the NumField rule in
                CLAUDE.md, which this hand-rolled amount input follows too), so
                it dims and no-ops instead. */}
            {!editTx&&addMode==="tracked"&&(
              <button onClick={saveAndAddAnother}
                style={{width:"100%",marginTop:8,borderRadius:10,padding:"10px 0",
                  fontSize:14,fontWeight:600,background:"transparent",
                  border:`1px solid ${P.line}`,color:P.sub,
                  opacity:canRapidSave?1:.5}}>
                Save &amp; add another
              </button>
            )}

            {/* Pin the current form as a shortcut. Sits under the save actions
                because it is about the *next* time, not this transaction —
                putting it up beside the fields implied it changed what gets
                recorded. Text-only and quiet: it is the rarest action here. */}
            {!editTx&&addMode==="tracked"&&(
              <button onClick={()=>pinTxTemplate({catId:form.catId,name:form.name,note:form.note,
                  amount:evalMathExpr(form.amount,Number(form.amount)||0),owner:budgetOwner})}
                style={{width:"100%",marginTop:6,background:"transparent",border:"none",
                  padding:"8px 0",minHeight:36,fontSize:12,fontWeight:600,
                  color:currentIsPinned?P.jade:P.sub,
                  opacity:canRapidSave?1:.4}}>
                {currentIsPinned?"✓ Pinned as a shortcut":"Pin this as a shortcut"}
              </button>
            )}
          </div>
        </div>
        </Portal>
      )}

      <ConfirmDialog open={!!confirmUnlink}
        title="Unlink from installment?"
        message="The transaction stays in Expenses exactly as it is, but it stops counting as an installment payment and that payment reopens as unpaid. There is no way to link it back."
        confirmLabel="Unlink"
        onCancel={()=>setConfirmUnlink(null)}
        onConfirm={()=>{unlinkInstallmentExpense(confirmUnlink);setConfirmUnlink(null);closeForm();}}/>

      {/* ── quick transfer sheet ── */}
      {transferModal&&<Portal><QuickTransferSheet
        transferModal={transferModal}
        onClose={()=>setTransferModal(null)}
        onConfirm={(amount,date)=>{quickTransfer(transferModal.catId,transferModal.name,amount,date,budgetOwner,goalIdForCat(transferModal.catId));setTransferModal(null);}}
        fmt={fmt} cur={cur} viewMonth={viewMonth} isNow={isNow} usesPayPeriod={usesPayPeriod}/></Portal>}

      {/* ── extra funds sheet ── */}
      {extraFundsModal&&<Portal><ExtraFundsSheet
        extraFundsModal={extraFundsModal}
        onClose={()=>setExtraFundsModal(null)}
        onConfirm={(amount,date,note)=>{addExtraFunds(extraFundsModal.catId,extraFundsModal.name,amount,date,note,budgetOwner);setExtraFundsModal(null);}}
        fmt={fmt} cur={cur} viewMonth={viewMonth} isNow={isNow} usesPayPeriod={usesPayPeriod}/></Portal>}

      {/* ── reorder categories modal — controls the envelope card order above ── */}
      {showReorder&&(
        <Portal>
        <div className="sheet-bg" onClick={()=>setShowReorder(false)}>
          <div className="sheet" ref={reorderDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Reorder categories</h3>
              <IconButton icon={I.X} label="Close" onClick={()=>setShowReorder(false)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>
            <div style={{fontSize:12,color:P.faint,marginBottom:14}}>
              Move categories up or down. This controls the order they appear in the Envelopes list above.
            </div>
            <div style={{borderRadius:12,overflow:"hidden",background:"rgba(0,0,0,.03)"}}>
              <div style={{maxHeight:"60vh",overflowY:"auto"}}>
                {(monthPlan.categories||[]).map((c,i,arr)=>{
                  const g=(monthPlan.groups||[]).find(gr=>gr.id===c.groupId);
                  return(
                    <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",
                      borderBottom:i<arr.length-1?"1px solid rgba(0,0,0,.06)":"none"}}>
                      <span style={{width:8,height:8,borderRadius:999,background:c.color,flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,color:P.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div>
                        {g&&<div style={{fontSize:10,color:P.faint}}>{g.name}</div>}
                      </div>
                      <button onClick={()=>moveCat(c.id,-1)} disabled={i===0}
                        style={{background:"transparent",border:"none",borderRadius:8,padding:4,
                          color:i===0?P.faint:P.sub,opacity:i===0?.4:1}}>
                        <I.ArrowUp size={13}/>
                      </button>
                      <button onClick={()=>moveCat(c.id,1)} disabled={i===arr.length-1}
                        style={{background:"transparent",border:"none",borderRadius:8,padding:4,
                          color:i===arr.length-1?P.faint:P.sub,opacity:i===arr.length-1?.4:1}}>
                        <I.ArrowDown size={13}/>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
            <button onClick={()=>setShowReorder(false)}
              style={{width:"100%",marginTop:14,borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:P.jade,color:"#fff",border:"none"}}>
              Done
            </button>
          </div>
        </div>
        </Portal>
      )}

      {/* ── reorder one day's transactions ── */}
      {dayReorder&&(()=>{
        const byId=id=>expenses.find(e=>e.id===id);
        const move=(i,dir)=>setDayReorder(s=>{
          const arr=[...s.ids],j=i+dir;
          if(j<0||j>=arr.length)return s;
          [arr[i],arr[j]]=[arr[j],arr[i]];
          return{...s,ids:arr};
        });
        return(
        <Portal>
        <div className="sheet-bg" onClick={()=>setDayReorder(null)}>
          <div className="sheet" ref={dayReorderDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Reorder {dayLabel(dayReorder.date)}</h3>
              <IconButton icon={I.X} label="Close" onClick={()=>setDayReorder(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>
            <div style={{fontSize:12,color:P.faint,marginBottom:14}}>
              Order within this day only. To move a transaction to another day, change its date.
            </div>
            <div style={{borderRadius:12,overflow:"hidden",background:"rgba(0,0,0,.03)"}}>
              <div style={{maxHeight:"60dvh",overflowY:"auto"}}>
                {dayReorder.ids.map((id,i,arr)=>{
                  const tx=byId(id);
                  if(!tx)return null;
                  const env=((planForMonth(bucketKeyFor(tx.date,payPeriods,budgetOwner))||{}).categories||[]).find(c=>c.id===tx.catId);
                  return(
                    <div key={id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",
                      borderBottom:i<arr.length-1?"1px solid rgba(0,0,0,.06)":"none"}}>
                      <span style={{width:8,height:8,borderRadius:999,background:env?.color||P.faint,flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,color:P.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{tx.name}</div>
                        {env&&<div style={{fontSize:10,color:P.faint}}>{env.name}</div>}
                      </div>
                      <span className="tnum" style={{fontSize:12,color:P.sub,flexShrink:0}}>{fmt(tx.amount)}</span>
                      <button onClick={()=>move(i,-1)} disabled={i===0}
                        style={{background:"transparent",border:"none",borderRadius:8,padding:4,
                          color:i===0?P.faint:P.sub,opacity:i===0?.4:1}}>
                        <I.ArrowUp size={13}/>
                      </button>
                      <button onClick={()=>move(i,1)} disabled={i===arr.length-1}
                        style={{background:"transparent",border:"none",borderRadius:8,padding:4,
                          color:i===arr.length-1?P.faint:P.sub,opacity:i===arr.length-1?.4:1}}>
                        <I.ArrowDown size={13}/>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
            <button onClick={()=>{setExpenseDayOrder(dayReorder.ids);setDayReorder(null);}}
              style={{width:"100%",marginTop:14,borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:P.jade,color:"#fff",border:"none"}}>
              Done
            </button>
          </div>
        </div>
        </Portal>
        );
      })()}

      {/* ── create monthly plan modal ── */}
      {showPlanPicker&&(
        <Portal>
        <div className="sheet-bg" onClick={()=>setShowPlanPicker(false)}>
          <div className="sheet" ref={planPickerDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600}}>
                Create plan for {fmtMonth(viewMonth)}
              </h3>
              <IconButton icon={I.X} label="Close" onClick={()=>setShowPlanPicker(false)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>

            <div style={{fontSize:13,color:P.sub,marginBottom:16,lineHeight:1.5}}>
              This creates a <strong>copy</strong> of an existing plan that you can adjust
              independently — different income, tweaked allocations — without changing the original.
            </div>

            <div style={{fontSize:12,color:P.sub,marginBottom:6,fontWeight:600}}>
              Copy from which month?
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20,maxHeight:"38dvh",overflowY:"auto"}}>
              {clonePlanMonths.map(o=>(
                <button key={o.month} onClick={()=>setCloneSource(o.month)}
                  style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                    padding:"10px 14px",borderRadius:12,fontSize:14,textAlign:"left",border:"none",
                    background:cloneSource===o.month?P.jadeS:"rgba(0,0,0,.05)",
                    color:cloneSource===o.month?P.jadeD:P.ink}}>
                  <div>
                    <div style={{fontWeight:600}}>{fmtMonth(o.month)}{o.custom?(o.future?" · planned":""):" · carry-forward"}</div>
                    <div style={{fontSize:11,color:P.faint,marginTop:2}}>
                      {cur} {(o.plan.income||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} · {(o.plan.categories||[]).length} categories
                    </div>
                  </div>
                  {cloneSource===o.month&&<I.Check size={16} style={{color:P.jade,flexShrink:0}}/>}
                </button>
              ))}
            </div>

            <button onClick={handleCreatePlan} disabled={!cloneSource}
              style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:P.jade,color:"#fff",border:"none",opacity:cloneSource?1:.4}}>
              Create plan for {fmtMonth(viewMonth)}
            </button>
          </div>
        </div>
        </Portal>
      )}
    </div>
  );
}

/* ── QUICK TRANSFER SHEET — logs a transaction against an untracked category
   (e.g. Savings, Investment) and remembers the actual amount transferred,
   since it doesn't always match the budgeted figure exactly. ── */
function QuickTransferSheet({transferModal,onClose,onConfirm,fmt,cur,viewMonth,isNow,usesPayPeriod}){
  useScrollLock(true); // only ever mounted while open
  const dlgRef=useDialogA11y(onClose);
  const[amount,setAmount]=useState(String(transferModal.suggested||transferModal.budget||""));
  const[date,setDate]=useState(isNow?new Date().toISOString().slice(0,10):(usesPayPeriod?viewMonth:viewMonth+"-01"));
  return(
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Transfer — {transferModal.name}</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
        </div>
        <div style={{fontSize:12,color:P.faint,marginBottom:16}}>
          Logs a one-time transfer to {transferModal.name}. This counts against your salary but won't appear in detailed expense tracking.
        </div>

        <div style={{display:"flex",gap:6,marginBottom:14}}>
          <button onClick={()=>setAmount(String(transferModal.budget))}
            style={{flex:1,borderRadius:10,padding:"8px 0",fontSize:13,fontWeight:600,border:"none",
              background:Number(amount)===transferModal.budget?P.brS:"rgba(0,0,0,.05)",
              color:Number(amount)===transferModal.budget?P.br:P.sub}}>
            Budgeted {fmt(transferModal.budget)}
          </button>
          {transferModal.suggested&&transferModal.suggested!==transferModal.budget&&(
            <button onClick={()=>setAmount(String(transferModal.suggested))}
              style={{flex:1,borderRadius:10,padding:"8px 0",fontSize:13,fontWeight:600,border:"none",
                background:Number(amount)===transferModal.suggested?P.jadeS:"rgba(0,0,0,.05)",
                color:Number(amount)===transferModal.suggested?P.jadeD:P.sub}}>
              Last time {fmt(transferModal.suggested)}
            </button>
          )}
        </div>

        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount ({cur})</div>
            <input type="text" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)}
              onBlur={e=>setAmount(String(evalMathExpr(e.target.value,Number(amount)||0)))}
              onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur();}} autoFocus
              style={{width:"100%",borderRadius:10,padding:"10px",fontSize:18,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Date</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}
              style={{width:"100%",borderRadius:10,padding:"10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
          </div>
        </div>

        <button onClick={()=>{if(Number(amount)>0)onConfirm(Number(amount),date);}}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
            background:P.br,color:"#fff",border:"none",opacity:Number(amount)>0?1:.5}}>
          <I.Send size={14}/>Confirm transfer
        </button>
      </div>
    </div>
  );
}

/* ── HOUSEHOLD VIEW ── */
function HouseholdView({hh,setSplit,addExpense,updateExpense,removeExpense,fmt,owners}){
  const[confirmDeleteId,setConfirmDeleteId]=useState(null);
  const total=hh.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const mine=total*(hh.splitMine/100),theirs=total-mine;
  const card=neu(16);
  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div style={{...card,padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600,color:P.sub}}>Shared monthly expenses</span>
          <span className="tnum" style={{fontSize:15,fontWeight:700,color:P.ink}}>{fmt(total)}</span>
        </div>

        {/* ── visual split bar ── */}
        <div style={{height:22,borderRadius:999,overflow:"hidden",display:"flex",marginBottom:6}}>
          <div style={{width:`${hh.splitMine}%`,background:P.gr,display:"flex",alignItems:"center",justifyContent:"center",transition:"width .3s"}}>
            {hh.splitMine>=14&&<span style={{fontSize:11,fontWeight:700,color:"#fff"}} className="tnum">{hh.splitMine}%</span>}
          </div>
          <div style={{width:`${100-hh.splitMine}%`,background:P.br,display:"flex",alignItems:"center",justifyContent:"center",transition:"width .3s"}}>
            {100-hh.splitMine>=14&&<span style={{fontSize:11,fontWeight:700,color:"#fff"}} className="tnum">{100-hh.splitMine}%</span>}
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:P.faint,marginBottom:12}}>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:7,height:7,borderRadius:999,background:P.gr,display:"inline-block"}}/>{owners.me}</span>
          <span style={{display:"flex",alignItems:"center",gap:4}}>{owners.wife}<span style={{width:7,height:7,borderRadius:999,background:P.br,display:"inline-block"}}/></span>
        </div>

        {/* ── metric cards ── */}
        <div style={{display:"flex",gap:12,marginBottom:12}}>
          <div style={{flex:1,background:P.grS,borderRadius:12,padding:12}}>
            <div style={{fontSize:11,color:P.grD}}>{owners.me}'s Share</div>
            <div className="serif tnum" style={{fontSize:22,fontWeight:600,color:P.grD}}>{fmt(mine)}</div>
          </div>
          <div style={{flex:1,background:P.brS,borderRadius:12,padding:12}}>
            <div style={{fontSize:11,color:P.br}}>{owners.wife}'s Share</div>
            <div className="serif tnum" style={{fontSize:22,fontWeight:600,color:P.br}}>{fmt(theirs)}</div>
          </div>
        </div>
        <input type="range" min="0" max="100" value={hh.splitMine} onChange={e=>setSplit(Number(e.target.value))} style={{width:"100%"}}/>
      </div>

      {/* ── recurring expenses — 2-column grid on wider screens, tight card list on mobile ──
          Each row is two lines: name+amount, then a full-width "Track in Bills" toggle
          and a separated overflow delete button, so a stray tap can't hit delete instead
          of the toggle (previously an X sat right next to the amount field). */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(240px,100%),1fr))",gap:10,marginBottom:10}}>
        {hh.expenses.map(e=>(
          <div key={e.id} style={{...card,padding:"10px 14px",display:"flex",flexDirection:"column",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:10,height:10,borderRadius:999,background:e.color,flexShrink:0}}/>
              <input value={e.name} onChange={ev=>updateExpense(e.id,{name:ev.target.value})} className="bare" style={{flex:1,minWidth:0,fontSize:14}}/>
              <NumField value={e.amount} onCommit={v=>updateExpense(e.id,{amount:v})} min={0}
                className="bare tnum" style={{width:84,textAlign:"right",fontSize:14,fontWeight:600}}/>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
              <button onClick={()=>updateExpense(e.id,{trackInBills:!e.trackInBills})}
                aria-pressed={!!e.trackInBills}
                className="status-pill" style={{minWidth:0,cursor:"pointer",
                  border:`1px solid ${e.trackInBills?P.grS:P.line}`,background:e.trackInBills?P.grS:"transparent",
                  color:e.trackInBills?P.grD:P.faint}}>
                <I.PiggyBank size={13}/>{e.trackInBills?"Tracked in Bills":"Track in Bills"}
              </button>
              <IconButton icon={I.Trash} label={`Delete ${e.name||"recurring expense"}`} onClick={()=>setConfirmDeleteId(e.id)} size={15} style={{color:P.red,opacity:.5}}/>
            </div>
          </div>
        ))}
      </div>
      <button onClick={addExpense}
        style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",borderRadius:14,padding:"10px 16px",
          fontSize:14,fontWeight:500,color:P.gr,background:P.sf,border:`1px dashed ${P.line}`}}>
        <I.Plus size={14}/>Add shared expense
      </button>
      <ConfirmDialog open={!!confirmDeleteId} title="Delete this expense?"
        message="This removes it from the shared split and, if it was tracked in Bills, from future months' Bills lists. Past Bills history is kept."
        onConfirm={()=>{removeExpense(confirmDeleteId);setConfirmDeleteId(null);}}
        onCancel={()=>setConfirmDeleteId(null)}/>
    </div>
  );
}

/* ── BILLS VIEW ─────────────────────────────────────────────────────────
   A lightweight layer over Household: household.expenses items marked
   "Track in Bills" get one snapshot record per calendar month here
   (allocated/paid/status). No independent bill setup, no expenses-module
   integration — just: compare actual payments to the Household-set
   allocation, and keep a persistent rolling reserve. See App()'s
   computeBillsReserve/updateBill/adjustBillsReserve and docs/decisions.md. */
function monthKeyLabel(mk){
  if(!mk)return"";
  const[y,m]=mk.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
}
function AdjustReserveSheet({currentReserve,fmt,onClose,onConfirm}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const[balance,setBalance]=useState(String(Math.round(currentReserve*100)/100));
  const[note,setNote]=useState("");
  const delta=(Number(balance)||0)-currentReserve;
  // Portalled for the same reason as ConfirmDialog — BillsView renders inside
  // TabPane, whose stuck transform would otherwise anchor this to the tab pane
  // instead of the viewport. See Portal's note near the top of this file.
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Adjust Bills Reserve</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub}}/>
        </div>
        <div style={{fontSize:12,color:P.faint,marginBottom:16}}>

        </div>

          <div style={{fontSize:12,color:P.sub,marginBottom:4}}>New balance</div>
          <input type="text" inputMode="decimal" value={balance} onChange={e=>setBalance(e.target.value)} autoFocus
            style={{width:"100%",borderRadius:10,padding:"10px",fontSize:18,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
          {delta!==0&&
            <div style={{marginTop:6,fontSize:12,color:delta>0?P.gr:P.wine}}>{delta>0?"+":""}{fmt(delta)} change</div>}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Note <span style={{color:P.faint,fontWeight:400}}>(optional)</span></div>

        </div>
        <button onClick={()=>onConfirm(Number(balance)||0,note)}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:10,padding:"12px 0",fontSize:14,fontWeight:600,
            background:P.jade,color:"#fff",border:"none"}}>
          <I.Check size={14}/>Save reserve balance
        </button>
      </div>
    </div>
    </Portal>
  );
}

/* ── BANKS VIEW — grid of "digital wallet pass" cards ── */
/* ── Update-balance sheet ──────────────────────────────────────────────────
   Replaces the old "tap the balance field, select-all, delete, retype" flow,
   which is genuinely awkward one-handed on a phone. Add/Subtract cover the
   common case (a deposit, a withdrawal) without the person having to do the
   arithmetic themselves; Set stays available for reconciling against a
   statement. The running preview line is the safety net — it shows the exact
   figure that will be written before it's committed, so a mistyped amount or
   a wrong mode is visible rather than silently overwriting a real balance.

   Amounts run through evalMathExpr, same as the inline field it replaces, so
   "250+80" still works. Portalled for the same containing-block reason as
   every other sheet in this file — see Portal's note near the top.

   This sheet is also where interest accrual gets reconciled. It starts from
   the *accrued* value, not the stored balance, and all three modes re-anchor
   `balanceAsOf` to today — so Set means "this is the real figure, start again
   from here", and Add/Subtract can't compound past days' interest onto money
   that only moved today. */
function UpdateBalanceSheet({account,onClose,onConfirm}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  const[mode,setMode]=useState("add");
  const[amount,setAmount]=useState("");
  const val=bankValuation(account);
  const cur=val.value;
  const MODES=[["add","Add",P.jade],["subtract","Subtract",P.wine],["set","Set",P.br]];
  const idx=Math.max(0,MODES.findIndex(([k])=>k===mode));
  const parsed=evalMathExpr(amount,NaN);
  const hasAmount=amount.trim()!==""&&isFinite(parsed);
  const round2=n=>Math.round(n*100)/100;
  const next=!hasAmount?cur:round2(mode==="add"?cur+parsed:mode==="subtract"?cur-parsed:parsed);
  const num=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
  // Subtracting past zero is allowed (an overdraft is a real thing) but worth
  // flagging, since it's more often a mode mistake than an intentional entry.
  const goesNegative=hasAmount&&next<0;
  // With accrual running, committing the accrued figure unchanged is still a
  // meaningful action — it confirms the estimate and re-anchors the date — so
  // the usual "nothing would change" guard doesn't apply.
  const canSave=hasAmount&&(mode==="set"||parsed!==0)&&(next!==cur||val.active);
  const submit=()=>{if(canSave)onConfirm(next);};
  return(
    <Portal>
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Update balance</h3>
          <IconButton icon={I.X} label="Close" onClick={onClose} size={18} style={{color:P.sub}}/>
        </div>
        <div style={{fontSize:12,color:P.faint,marginBottom:val.active?8:14}}>
          {account.name||"Account"}{account.bank?` · ${account.bank}`:""}
        </div>
        {/* Says out loud that the starting figure is an estimate, not the
            number last typed — otherwise "Add 500" to an accrued balance looks
            like the app quietly changed the balance on its own. */}
        {val.active&&
          <div style={{fontSize:11,color:P.neuSub,marginBottom:14,lineHeight:1.5}}>
            Starting from the estimated balance — {num(val.balance)} confirmed on{" "}
            {new Date(val.since+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
            {" "}plus {num(val.accrued)} accrued. Saving re-anchors it to today.
          </div>}

        <div role="group" aria-label="Update mode" className="seg-control" style={{width:"100%",marginBottom:14}}>
          <div className="seg-indicator" style={{transform:`translateX(${idx*100}%)`,background:MODES[idx][2]}}/>
          {MODES.map(([key,label,color])=>(
            <button key={key} onClick={()=>setMode(key)} aria-pressed={mode===key} className="seg-btn"
              style={{color:mode===key?"#fff":color,fontSize:12,padding:"6px 4px"}}>
              {label}
            </button>
          ))}
        </div>

        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,color:P.sub,marginBottom:4}}>
            {mode==="set"?"New balance":"Amount"} ({account.currency})
          </div>
          <input type="text" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} autoFocus
            onKeyDown={e=>{if(e.key==="Enter")submit();}} placeholder="0"
            style={{width:"100%",borderRadius:10,padding:"12px",fontSize:22,fontWeight:600,textAlign:"right",
              background:"rgba(0,0,0,.05)",border:"none",color:P.ink}} className="tnum"/>
        </div>

        <div className="tnum" style={{...neuInset(12),padding:"10px 12px",marginBottom:4,fontSize:13,color:P.neuSub,
