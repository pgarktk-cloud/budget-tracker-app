/* ══════════════════════════════════════════════════════════════════════════
   HOME — dashboard landing tab. Purely presentational: every figure here is
   either read straight off App()'s already-computed values (netWorth,
   banksSar/invSar/assetSar/liabSar, holdingStats, goal contributions) or a
   thin per-owner reslice of the same raw collections (banks/plans/goals).
   It never recomputes financial logic and never mutates data except through
   the exact same mutator functions (contributeToGoal) the rest of the app
   already uses. Deliberately split into small sibling components so a
   future card (Wishlist, Subscriptions, Achievements) is just one more
   <XCard/> added to the list at the bottom of HomeView. ─────────────────── */

/* `overrides` lets individual cards dial padding up or down without
   inventing a new shadow/radius — every Home card still goes through neu(20).
   marginBottom is 0 by default: HomeView's .home-grid `gap` now handles
   spacing between cards (grid replaced the old single-column stack), so a
   card only needs its own marginBottom if it's rendered somewhere the grid
   doesn't apply (kept overridable for that reason). */
function homeCardStyle(overrides){return{...neu(20),padding:16,marginBottom:0,...overrides};}

/* ── Verdict line ──
   Every Home card is supposed to answer one question. A figure is not an
   answer: "SAR 3,958 remaining · 0% used" tells you what is true, not
   whether it is good. This is the one-line plain-language answer that sits
   directly under a card's title, with the figures kept below it as the
   supporting detail.

   Tones map to the same semantics as spendStatusColor so a green verdict and
   a green bar never disagree: good = on track, warn = worth a look,
   bad = acting against you, flat = true but not a judgement. */
const VERDICT_TONES={
  good:()=>({fg:P.grD,bg:P.grS,Icon:I.Check}),
  warn:()=>({fg:"#E07B2A",bg:P.amberS,Icon:I.ArrowUp}),
  bad: ()=>({fg:P.wine,bg:P.wineS,Icon:I.ArrowUp}),
  flat:()=>({fg:P.neuSub,bg:P.sfA,Icon:null}),
};
function Verdict({tone="flat",children,title}){
  const t=(VERDICT_TONES[tone]||VERDICT_TONES.flat)();
  const Icon=t.Icon;
  return(
    <div title={title} style={{display:"inline-flex",alignItems:"center",gap:6,
      borderRadius:999,padding:"4px 10px",marginBottom:10,maxWidth:"100%",
      background:t.bg,color:t.fg,fontSize:12,fontWeight:600,lineHeight:1.25}}>
      {Icon&&<Icon size={12} style={{flexShrink:0}}/>}
      <span style={{minWidth:0}}>{children}</span>
    </div>
  );
}

/* Turns a livePriceAt/ratesAt timestamp (+ online state) into the small
   muted freshness line shown on Home's live-priced/FX-derived cards. Never
   surfaces raw technical errors — those stay on Investments/Currency where
   they already are. */
function freshnessText(ts,isOnline){
  if(isOnline===false)return "Offline · showing cached values";
  if(!ts)return null;
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<1)return "Updated just now";
  if(mins<60)return `Updated ${mins} minute${mins===1?"":"s"} ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return `Updated ${hrs} hour${hrs===1?"":"s"} ago`;
  const d=new Date(ts);
  return `Using last available prices from ${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
}

/* Minimal inline circular-progress ring (stroke-dasharray technique) — no
   charting library needed for something this small. */
function ProgressRing({pct,size=60,stroke=7,color,track}){
  const p=Math.max(0,Math.min(100,pct||0));
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const off=c*(1-p/100);
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track||P.sfA} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color||P.gr} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset .4s ease"}}/>
    </svg>
  );
}

/* Subtle sparkline off portHistory/history — hidden axes/grid/tooltip on
   purpose, this is a glance-level trend indicator, not a chart to read
   values off. `area:true` renders a filled AreaChart instead of a bare line
   (used by Portfolio/Hero for a slightly richer look) — same Recharts import,
   no new dependency. `height` lets Hero use a taller trend than Portfolio's
   compact one. */
function Sparkline({data,color,area,height=40,fill}){
  if(!data||data.length<2)return null;
  const c=color||P.gr;
  const gid=`spark-${c.replace(/[^a-zA-Z0-9]/g,"")}`;
  /* Y-domain is the real fix for the "nearly flat decorative line": Recharts
     defaults a numeric axis to start at 0, so a series like 10,650 → 10,718
     gets squashed into an almost-horizontal band near the top of the plot.
     Pinning the domain to the data's own min/max (with a small pad so the
     stroke never clips against the edges) makes genuine month-to-month
     movement legible without inventing or rescaling a single value. */
  const vals=data.map(d=>d.value).filter(v=>Number.isFinite(v));
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=(hi-lo)*0.12||Math.abs(hi||1)*0.02||1;
  const domain=[lo-pad,hi+pad];
  const wrap=fill
    ?{width:"100%",marginTop:8,minHeight:height}
    :{width:"100%",height,marginTop:8};
  return(
    <div className={`${fill?"home-fill ":""}home-spark`} style={wrap}>
      <ResponsiveContainer width="100%" height="100%">
        {area?(
          <AreaChart data={data} margin={{top:2,right:0,bottom:0,left:0}}>
            <defs>
              <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={c} stopOpacity={0.28}/>
                <stop offset="100%" stopColor={c} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <YAxis hide domain={domain}/>
            <Area type="monotone" dataKey="value" stroke={c} strokeWidth={2} fill={`url(#${gid})`} dot={false} isAnimationActive={false}/>
          </AreaChart>
        ):(
          <LineChart data={data} margin={{top:2,right:0,bottom:0,left:0}}>
            <YAxis hide domain={domain}/>
            <Line type="monotone" dataKey="value" stroke={c} strokeWidth={2} dot={false} isAnimationActive={false}/>
          </LineChart>
        )}
      </ResponsiveContainer>
    </div>
  );
}

/* ── Range-selectable history chart (Phase 3 §7/§8) ────────────────────────
   Shared by both Net Worth and Portfolio-over-time sections rather than two
   near-identical components — the only thing that differs between them is
   which numeric field to plot and how to format it. Reads from
   data.snapshots (profile-filtered, passed in already bucketed by date), not
   the older monthly `history`/`portHistory` — those keep serving the
   MoM-stat/manual-entry features they always did (see decisions.md).
   Bucketing per range (§7) + memoization (§8) both live in
   bucketSnapshotsForRange(), a pure function outside this component so
   useMemo can cheaply skip recompute when neither the snapshot array nor the
   selected range changed. Derived chart points are only ever held in this
   component's own memo — never written back to `data` (§11: only raw
   snapshots persist). */
const RANGES=["1W","1M","3M","1Y","MAX"];
function HistoryRangeChart({snapshots,profile,field,money,color,height=200,emptyText}){
  const[range,setRange]=useState("1M");
  const profileSnaps=useMemo(()=>(snapshots||[]).filter(s=>s.profile===profile).sort((a,b)=>a.date.localeCompare(b.date)),[snapshots,profile]);
  const bucketed=useMemo(()=>bucketSnapshotsForRange(profileSnaps,range),[profileSnaps,range]);
  const fmtLabel=(dateStr,r)=>{
    const d=new Date(dateStr+"T00:00:00");
    if(r==="MAX")return d.toLocaleDateString("en-US",{month:"short",year:"2-digit"});
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  };
  // `field` may be a dot path (e.g. "byType.gold") to reach into snapshot.byType
  const at=s=>field.split(".").reduce((o,k)=>o==null?undefined:o[k],s);
  const pts=bucketed.map(s=>({label:fmtLabel(s.date,range),value:at(s)}));
  const first=bucketed[0],last=bucketed[bucketed.length-1];
  const firstVal=first?at(first):undefined,lastVal=last?at(last):undefined;
  const pctChange=first&&firstVal?((lastVal-firstVal)/Math.abs(firstVal))*100:null;
  const trending=last&&first?lastVal>=firstVal:true;
  const chartColor=color||(trending?P.jade:P.wine);
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:8}}>
        <div role="group" aria-label="Time range" style={{display:"flex",gap:4}}>
          {RANGES.map(r=>(
            <button key={r} onClick={()=>setRange(r)} className={range===r?"":"neu-btn"} aria-pressed={range===r}
              style={{borderRadius:999,padding:"3px 10px",fontSize:12,border:"none",
                ...(range===r?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>{r}</button>
          ))}
        </div>
        {pctChange!=null&&(
          <span className="tnum" style={{fontSize:13,fontWeight:600,color:trending?P.jade:P.wine}}>
            {trending?"▲":"▼"} {Math.abs(pctChange).toFixed(1)}%
          </span>
        )}
      </div>
      {pts.length>=2?(
        <div style={{width:"100%",height}}>
          <ResponsiveContainer>
            <LineChart data={pts} margin={{top:8,right:8,bottom:0,left:-12}}>
              <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
              <XAxis dataKey="label" tick={{fontSize:10,fill:P.neuSub}}/>
              <YAxis tick={{fontSize:10,fill:P.neuSub}} tickFormatter={v=>money(v,true)}/>
              <Tooltip formatter={v=>money(v)}/>
              <Line type="monotone" dataKey="value" stroke={chartColor} strokeWidth={2.5} dot={pts.length<=40?{r:3,fill:chartColor}:false}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      ):(
        <p style={{fontSize:13,color:P.neuSub}}>{emptyText||"Not enough history yet for this range."}</p>
      )}
    </div>
  );
}

/* ── Composition over time ──
   Net Worth used to carry two charts of the same thing: the range-selectable
   net-worth line above, and a monthly net-worth line inside the snapshot-log
   card below. Two lines of one figure, stacked on one screen — which is why
   the tab read as repetitive.

   The second slot now answers a different question: net worth went up, but
   *because of what?* Same snapshots, same range logic (RANGES /
   bucketSnapshotsForRange) as HistoryRangeChart, but plotting the components
   that were already being captured alongside `net` — banks, investments,
   other assets and liabilities — rather than the total again.

   A `negate` series gets its OWN stack id, not the positive one's. Sharing it
   makes Recharts *accumulate* the negative — the debt band ends up drawn
   downward from the top of the assets, so the top edge reads as gross assets
   and the band's lower edge is the real net worth. Correct arithmetic, easy
   to misread. A separate stack puts assets above the axis and debt below it,
   which is what the Net Worth card's caption promises.

   Generalised over a `series` prop so Investments plots its own composition
   (snapshot.byType.{stocks,mp2,td,gold}) through this same component instead
   of growing a second near-identical chart. Keys may be dot paths, the same
   way HistoryRangeChart's `field` reaches into byType. */
function CompositionRangeChart({snapshots,profile,series,money,height=200,emptyText}){
  const[range,setRange]=useState("1M");
  const profileSnaps=useMemo(()=>(snapshots||[]).filter(s=>s.profile===profile).sort((a,b)=>a.date.localeCompare(b.date)),[snapshots,profile]);
  const bucketed=useMemo(()=>bucketSnapshotsForRange(profileSnaps,range),[profileSnaps,range]);
  const fmtLabel=(dateStr,r)=>{
    const d=new Date(dateStr+"T00:00:00");
    if(r==="MAX")return d.toLocaleDateString("en-US",{month:"short",year:"2-digit"});
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  };
  /* `series` is [{key,label,color,negate?}]. `key` may be a dot path so it can
     reach snapshot.byType.* the same way HistoryRangeChart's `field` does.
     `negate` flips a series below the axis (liabilities on Net Worth). */
  const SERIES=series||[];
  const at=(s,key)=>key.split(".").reduce((o,k)=>o==null?undefined:o[k],s);
  const pts=bucketed.map(s=>{
    const row={label:fmtLabel(s.date,range)};
    SERIES.forEach(f=>{
      const v=Number(at(s,f.key))||0;
      row[f.key]=f.negate?-v:v;
    });
    return row;
  });
  /* Only draw a series that is actually non-zero somewhere in range —
     otherwise every household with no liabilities gets a legend entry and a
     tooltip row for a permanent zero. */
  const live=SERIES.filter(s=>pts.some(p=>p[s.key]!==0));
  return(
    <div>
      <div role="group" aria-label="Time range" style={{display:"flex",gap:4,marginBottom:8}}>
        {RANGES.map(r=>(
          <button key={r} onClick={()=>setRange(r)} className={range===r?"":"neu-btn"} aria-pressed={range===r}
            style={{borderRadius:999,padding:"3px 10px",fontSize:12,border:"none",
              ...(range===r?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>{r}</button>
        ))}
      </div>
      {pts.length>=2&&live.length>0?(
        <>
          <div style={{width:"100%",height}}>
            <ResponsiveContainer>
              <AreaChart data={pts} margin={{top:8,right:8,bottom:0,left:-12}}>
                <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
                <XAxis dataKey="label" tick={{fontSize:10,fill:P.neuSub}}/>
                <YAxis tick={{fontSize:10,fill:P.neuSub}} tickFormatter={v=>money(v,true)}/>
                <Tooltip formatter={(v,name)=>[money(Math.abs(v)),name]}/>
                {live.map(s=>(
                  <Area key={s.key} type="monotone" dataKey={s.key} name={s.label}
                    stackId={s.negate?"neg":"pos"}
                    stroke={s.color} fill={s.color} fillOpacity={.55} strokeWidth={1.5}/>
                ))}
              </AreaChart>
            </ResponsiveContainer>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:8}}>
            {live.map(s=>(
              <span key={s.key} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:P.neuSub}}>
                <span style={{width:9,height:9,borderRadius:999,background:s.color}}/>{s.label}
              </span>
            ))}
          </div>
        </>
      ):(
        <p style={{fontSize:13,color:P.neuSub}}>{emptyText||"Not enough history yet for this range."}</p>
      )}
    </div>
  );
}

/* 3-way Me / Wife / Household pill switcher for Home only. The underlying
   data model only ever has 2 profiles ("me"/"wife" — see PROFILE_KEY); there
   is no literal "household" profile anywhere else in the app. "Household" is
   a Home-only aggregate view (assumption documented at the top of this
   file's task): picking Me/Wife here also drives budgetOwner (so it stays
   consistent with every other tab), picking Household is purely local to
   this card and doesn't change budgetOwner. */
function HomeProfileToggle({profile,setProfile,owners}){
  const opts=[["me",owners.me||"Me",P.gr],["wife",owners.wife||"Wife",P.br],["household","Household",P.amber]];
  const idx=Math.max(0,opts.findIndex(([key])=>key===profile));
  return(
    <div role="group" aria-label="Profile" className="seg-control">
      <div className="seg-indicator" style={{transform:`translateX(${idx*100}%)`,background:opts[idx][2]}}/>
      {opts.map(([key,label,color])=>(
        <button key={key} onClick={()=>setProfile(key)} aria-pressed={profile===key} className="seg-btn"
          style={{color:profile===key?"#fff":color}}>
          {label}
        </button>
      ))}
    </div>
  );
}

/* a. Hero Card — net worth for the selected profile, MoM change from
   data.history[] (reused, not recomputed), secondary currencies per
   data.homeDisplay.netWorth, plus a trend sparkline off the same history[].
   MoM-%-sanity guard: if the prior month's net is near-zero relative to the
   current one, the percentage is mathematically unstable/misleading (a
   near-zero denominator can turn an ordinary swing into "1500%"), most often
   because a past month's auto-captured snapshot was saved before that
   month's investment quotes had ever been fetched (invSar was still 0 that
   month) — a data-staleness artifact, not a bug in the momPct formula
   itself. In that case we still show the raw amount change but hide the %
   rather than print something misleading. */
function HeroCard({profile,setProfile,owners,netWorthByProfile,history,homeDisplay,convert,ratesErr,onOpen}){
  const ref=useRef(null);
  const val=netWorthByProfile(profile);
  useFlash(Math.round(val),ref);
  const sorted=[...(history||[])].sort((a,b)=>a.month.localeCompare(b.month));
  const latest=sorted[sorted.length-1];
  const prev=sorted[sorted.length-2];
  const momAmt=(latest&&prev)?latest.net-prev.net:null;
  const pctUnstable=prev&&(Math.abs(prev.net)<Math.abs(latest.net)*0.05);
  const momPct=(momAmt!=null&&prev&&prev.net!==0&&!pctUnstable)?(momAmt/Math.abs(prev.net))*100:null;
  const nwSettings=(homeDisplay&&homeDisplay.netWorth)||{primary:"PHP",secondary:["SAR","USD","PHP"]};
  const primary=nwSettings.primary||"PHP";
  const secondary=nwSettings.secondary||["SAR","USD","PHP"];
  const primaryVal=convert?convert(val,"SAR",primary):null;
  const label=profile==="household"?"Household":(owners[profile]||profile);
  const trendPts=sorted.map(h=>({value:h.net}));
  /* Two-column split on wide screens (figures left, trend right) rather than
     one full-width band of text above a stretched-out chart — that band is
     what made the Hero read as "very wide and dominant" while still being
     mostly empty. `.hero-split` collapses back to a single column on mobile. */
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8,minHeight:28}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600,flex:"1 1 auto",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Net worth · {label}</div>
        <div onClick={e=>e.stopPropagation()} style={{flexShrink:0}}>
          <HomeProfileToggle profile={profile} setProfile={setProfile} owners={owners}/>
        </div>
      </div>
      <div className="hero-split">
        <div style={{minWidth:0}}>
          <div ref={ref} className="serif tnum" style={{fontSize:34,fontWeight:600,color:P.ink,lineHeight:1.1}}>
            {primaryVal!=null?`${primary} ${Math.round(primaryVal).toLocaleString("en-US")}`:`SAR ${Math.round(val).toLocaleString("en-US")}`}
          </div>
          {momAmt!=null&&
            <div className="tnum" style={{fontSize:13,marginTop:6,color:momAmt>=0?P.gr:P.red,fontWeight:600}}>
              {momAmt>=0?"▲":"▼"} SAR {Math.round(Math.abs(momAmt)).toLocaleString("en-US")}{momPct!=null?` (${momPct.toFixed(1)}%)`:pctUnstable?" (new baseline)":""} this month
            </div>}
          {convert&&
            <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:10}}>
              {secondary.filter(c=>c!==primary).map(c=>{
                const v=convert(val,"SAR",c);
                if(v==null)return null;
                return <span key={c} className="tnum" style={{fontSize:12,color:P.faint}}>{c} {Math.round(v).toLocaleString("en-US")}</span>;
              })}
            </div>}
          {ratesErr&&<div style={{fontSize:11,color:P.faint,marginTop:8}}>Using last available exchange rates.</div>}
        </div>
        <div style={{minWidth:0,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
          {sorted.length>=2
            ?<Sparkline data={trendPts} color={momAmt!=null&&momAmt<0?P.red:P.gr} area height={64}/>
            :<div style={{fontSize:11,color:P.faint,marginTop:10}}>Trend appears after 2+ months of history</div>}
        </div>
      </div>
    </div>
  );
}

/* b. Portfolio Card — same holdingStats+livePrice math as InvestmentsView,
   just re-summed here rather than imported (InvestmentsView keeps its rows
   local to itself); displayed in data.homeDisplay.portfolio currency.
   "Today's gain/loss" is additive: (price-previousClose)*shares, using the
   device-local data.prevClose cache (see fetchQuotes/setLivePrice in App()).
   Any ticker missing a previousClose (no refresh has run yet, or a provider
   didn't supply it) is simply excluded from the sum rather than fabricated;
   if NO ticker has one, the whole line is hidden. */
function PortfolioCard({invs,livePrice,livePriceAt,prevClose,convert,homeDisplay,portHistory,snapshots,profile,isOnline,isHousehold,mp2RatesByYear,includeMp2Estimate,onOpen}){
  const stockInvs=(invs||[]).filter(x=>(x.type||"stocks")==="stocks");
  const rows=stockInvs.map(hld=>{
    const{shares,totalCost}=holdingStats(hld.trades);
    const key=baseKey(hld.ticker||"");
    const price=livePrice[key]||0;
    const pc=(prevClose||{})[key];
    const hasToday=shares>0&&price>0&&pc>0;
    return{value:shares*price,totalCost,todayGain:hasToday?shares*(price-pc):null};
  });
  const totVal=rows.reduce((s,r)=>s+r.value,0);
  const totCost=rows.reduce((s,r)=>s+r.totalCost,0);
  const totGain=totVal-totCost;
  const totGainPct=totCost>0?(totGain/totCost)*100:0;
  const todayRows=rows.filter(r=>r.todayGain!=null);
  const todayGain=todayRows.length?todayRows.reduce((s,r)=>s+r.todayGain,0):null;
  /* MP2/TD — no daily market price, so they only ever feed the headline
     total and their own subline (section 10), never the today/overall gain
     stats above (those stay stock-only, per "do not portray MP2 projections
     or TD accrual as daily market gains"). */
  const mp2Invs=(invs||[]).filter(x=>x.type==="mp2");
  const tdInvs=(invs||[]).filter(x=>x.type==="td");
  const mp2ValUsd=mp2Invs.reduce((s,hld)=>{
    const v=mp2Valuation(hld,mp2RatesByYear||{});
    const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
    return s+(convert?(convert(chosen,hld.currency||"PHP","USD")||0):0);
  },0);
  const tdValUsd=tdInvs.reduce((s,hld)=>{
    if(hld.status==="closed")return s;
    const v=tdValuation(hld);
    const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
    return s+(convert?(convert(val,hld.currency||"PHP","USD")||0):0);
  },0);
  const goldInvs=(invs||[]).filter(x=>x.type==="gold");
  const goldValUsd=goldInvs.reduce((s,hld)=>s+goldValuation(hld,livePrice[GOLD_TICKER]||0,convert).currentValueUsd,0);
  const grandTotal=totVal+mp2ValUsd+tdValUsd+goldValUsd;
  const primary=(homeDisplay&&homeDisplay.portfolio&&homeDisplay.portfolio.primary)||"USD";
  const displayVal=primary==="USD"?grandTotal:(convert?convert(grandTotal,"USD",primary):null);
  /* portHistory is a single whole-portfolio snapshot series (see addPortSnap
     in App()) is now superseded here (Phase 3) by the per-profile daily
     snapshots — each Home profile (Me/Wife/Household) plots its own real
     trend instead of Household borrowing the shared monthly series and Me/
     Wife showing no chart at all. Compact by design (spec §9): just the
     mini sparkline, no range selector — that lives on the full Portfolio
     tab's HistoryRangeChart. */
  const pts=(snapshots||[]).filter(s=>s.profile===profile).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({value:s.investments}));
  const fresh=freshnessText(livePriceAt,isOnline);
  /* Wide-card composition: value on the left, today's/overall gain as aligned
     stat columns beside it, then the chart absorbing whatever height the row
     ends up at (.home-fill) so this card never shows a blank band. Stats sit
     in a wrapping flex row rather than a stack of one-liners, which is what
     lets the extra 2/3-width actually carry information. */
  const stat=(label,valueNode,tone)=>(
    <div style={{minWidth:0}}>
      <div style={{fontSize:11,color:P.faint,marginBottom:2,whiteSpace:"nowrap"}}>{label}</div>
      <div className="tnum" style={{fontSize:13,fontWeight:600,color:tone,whiteSpace:"nowrap"}}>{valueNode}</div>
    </div>
  );
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:10,minHeight:18}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Investments</div>
        {fresh&&<div style={{fontSize:11,color:P.faint,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{fresh}</div>}
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:20,flexWrap:"wrap",rowGap:10}}>
        <div className="serif tnum" style={{fontSize:26,fontWeight:600,color:P.ink,lineHeight:1.1}}>
          {displayVal!=null?`${primary} ${Math.round(displayVal).toLocaleString("en-US")}`:`$${Math.round(grandTotal).toLocaleString("en-US")}`}
        </div>
        <div style={{display:"flex",gap:18,flexWrap:"wrap",rowGap:8}}>
          {todayGain!=null&&stat("Today (stocks)",
            `${todayGain>=0?"▲":"▼"} $${Math.round(Math.abs(todayGain)).toLocaleString("en-US")}`,
            todayGain>=0?P.gr:P.red)}
          {stat("Overall (stocks)",
            `${totGain>=0?"▲":"▼"} $${Math.round(Math.abs(totGain)).toLocaleString("en-US")}`,
            totGain>=0?P.gr:P.red)}
          {stat("Return (stocks)",`${totGain>=0?"+":""}${totGainPct.toFixed(1)}%`,totGain>=0?P.gr:P.red)}
        </div>
      </div>
      {(mp2Invs.length>0||tdInvs.length>0||goldInvs.length>0)&&(
        <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:8,fontSize:11,color:P.faint}} className="tnum">
          <span>Market ${Math.round(totVal).toLocaleString("en-US")}</span>
          {mp2Invs.length>0&&<span>MP2 ${Math.round(mp2ValUsd).toLocaleString("en-US")}</span>}
          {tdInvs.length>0&&<span>Time deposits ${Math.round(tdValUsd).toLocaleString("en-US")}</span>}
          {goldInvs.length>0&&<span>Gold ${Math.round(goldValUsd).toLocaleString("en-US")}</span>}
        </div>
      )}
      {pts.length>=2
        ?<Sparkline data={pts} color={totGain>=0?P.gr:P.red} area height={64} fill/>
        :<div className="home-fill" style={{fontSize:11,color:P.faint,marginTop:10,display:"flex",alignItems:"flex-end"}}>
           Trend appears after 2+ days of history (captured automatically once a day)
         </div>}
    </div>
  );
}

/* c. Savings & Investing Card (Phase 4) — replaces the old Asset Allocation
   donut. That card answered "what do I own"; this one answers "am I actually
   saving/investing this month", which the roadmap explicitly wants computed
   from real category activity (savingsInvestingFor(), module scope) rather
   than an Income-Expenses guess — see that function's comment for why name-
   matched categories are the source of truth instead of a derived leftover
   number.
   Household sums both owners' rollups the same way TrackedSpendingCard does
   (every expense row carries exactly one owner, so summing never double-
   counts). Circular progress = savings rate against income; the horizontal
   two-tone bar is Saved vs Invested so the split reads at a glance without a
   legend. */
function SavingsInvestingCard({profile,payPeriods,planForMonth,expenses,savingsCategories,investmentCategories,homeDisplay,convert,cur,savingsTargetPct,onOpen}){
  const sum=useMemo(()=>{
    const ctx={planForMonth,expenses,payPeriods};
    if(profile==="household"){
      const a=savingsInvestingFor("me",ctx,savingsCategories,investmentCategories);
      const b=savingsInvestingFor("wife",ctx,savingsCategories,investmentCategories);
      return{saved:a.saved+b.saved,invested:a.invested+b.invested,income:a.income+b.income};
    }
    return savingsInvestingFor(profile,ctx,savingsCategories,investmentCategories);
  },[profile,planForMonth,expenses,payPeriods,savingsCategories,investmentCategories]);

  const primary=(homeDisplay&&homeDisplay.savingsInvesting&&homeDisplay.savingsInvesting.primary)||cur;
  // Display-only conversion; stored amounts are always in `cur` (same pattern as TrackedSpendingCard).
  const show=v=>{
    const c=primary===cur?v:(convert?convert(v,cur,primary):null);
    return`${primary} ${Math.round(c==null?v:c).toLocaleString("en-US")}`;
  };
  const total=sum.saved+sum.invested;
  const rate=sum.income>0?(total/sum.income)*100:0;
  const target=Number(savingsTargetPct)>0?Number(savingsTargetPct):20;
  const savedShare=total>0?(sum.saved/total)*100:50;
  const noCatsConfigured=(savingsCategories||[]).length===0&&(investmentCategories||[]).length===0;

  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{fontSize:12,color:P.sub,fontWeight:600,marginBottom:10,minHeight:18,display:"flex",alignItems:"center"}}>Savings &amp; Investing</div>
      {/* "Am I saving enough?" needs something to be enough *of* — the target
          is data.settings.savingsTargetPct, editable in Settings. Only shown
          once there is income to be a percentage of, otherwise a 0% rate
          would read as failure in a month that simply has no plan yet. */}
      {!noCatsConfigured&&sum.income>0&&
        <Verdict tone={rate>=target?"good":rate>=target*0.75?"warn":"bad"}
          title={`Target is ${target}% of income — change it in Settings`}>
          {rate>=target
            ?`Saving ${rate.toFixed(0)}% — at or above your ${target}% target`
            :`Saving ${rate.toFixed(0)}% — ${(target-rate).toFixed(0)} points under your ${target}% target`}
        </Verdict>}
      {noCatsConfigured?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          Choose your savings and investment categories in Settings to track this.
        </div>
      :(
        <>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{position:"relative",width:64,height:64,flexShrink:0}}>
              <ProgressRing pct={Math.min(100,rate)} size={64} stroke={7} color={P.jade}/>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span className="tnum" style={{fontSize:15,fontWeight:700,color:P.ink}}>{rate.toFixed(0)}%</span>
              </div>
            </div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:11,color:P.faint}}>Savings rate this month</div>
              <div className="tnum" style={{fontSize:13,fontWeight:600,color:P.ink,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {show(total)} of {show(sum.income)}
              </div>
            </div>
          </div>
          <div className="home-fill" style={{marginTop:12,display:"flex",flexDirection:"column",justifyContent:"center",gap:8,minHeight:0}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11,color:P.faint}}>
              <span className="tnum">Saved {show(sum.saved)}</span>
              <span className="tnum">Invested {show(sum.invested)}</span>
            </div>
            <div style={{height:8,borderRadius:999,background:P.sfA,overflow:"hidden",display:"flex"}}>
              {total>0?(<>
                <div style={{width:`${savedShare}%`,background:P.gr,transition:"width .4s ease"}}/>
                <div style={{width:`${100-savedShare}%`,background:P.br,transition:"width .4s ease"}}/>
              </>):null}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* d. Tracked Spending Card — replaces the old "Budget remaining" card, which
   showed unallocated income (a planning number) rather than how much of the
   month's tracked budget has actually been used.

   All figures come from trackedSpendingFor() at module scope, which is the
   same envelope/spent maths the Expenses tab runs — this component only
   formats and ranks. Household sums both owners' rollups; because every
   expense row carries exactly one `owner`, summing the two never
   double-counts. (data.household.expenses is a separate shared-bill
   splitter with no categories or tracking, so it is correctly not part of
   this at all.)

   Tapping anywhere drills into the Expenses tab for the same profile and
   current bucket — Expenses re-anchors its own viewMonth off budgetOwner,
   so setting the owner and switching tab is all that's needed. */
function TrackedSpendingCard({profile,owners,payPeriods,planForMonth,expenses,homeDisplay,convert,cur,onOpen}){
  const profileLabel=profile==="household"?"Household":((owners||{})[profile]||profile);
  const primary=(homeDisplay&&homeDisplay.budget&&homeDisplay.budget.primary)||cur;

  const sum=useMemo(()=>{
    const ctx={planForMonth,expenses,payPeriods};
    if(profile==="household"){
      const a=trackedSpendingFor("me",ctx),b=trackedSpendingFor("wife",ctx);
      return{month:a.month,cats:[...a.cats,...b.cats],
        budget:a.budget+b.budget,spent:a.spent+b.spent};
    }
    return trackedSpendingFor(profile,ctx);
  },[profile,planForMonth,expenses,payPeriods]);

  const{topCats,overCount,remaining,pctUsed,periodLabelText,daysLeft,pace}=useMemo(()=>{
    const remaining=sum.budget-sum.spent;
    const pctUsed=sum.budget>0?(sum.spent/sum.budget)*100:0;
    // "closest to reaching their budget" — highest % used first.
    const topCats=[...sum.cats].sort((a,b)=>b.pct-a.pct).slice(0,3);
    const overCount=sum.cats.filter(c=>c.over).length;
    // Household has two owners who may be on different pay-period settings;
    // label off "me" in that case, which is the same bucket Expenses opens on.
    const labelOwner=profile==="household"?"me":profile;
    const periodLabelText=bucketLabel(sum.month,payPeriods,labelOwner);
    const{elapsed,total}=bucketProgress(sum.month,payPeriods,labelOwner);

    /* The card's actual answer to "am I overspending right now?".
       % of budget used means nothing on its own — 60% used is fine on day 25
       and alarming on day 5. So compare burn rate against how much of the
       period has elapsed and project the finish.
       Skipped for the first two days: one big shop on day 1 projects to a
       catastrophe and would cry wolf every single period. */
    let pace=null;
    if(sum.budget>0&&elapsed>=3){
      const projected=(sum.spent/elapsed)*total;
      const over=projected-sum.budget;
      const ratio=projected/sum.budget;
      pace={projected,over,
        tone:ratio>=1.05?"bad":ratio>=0.95?"warn":"good",
        onTrack:ratio<0.95};
    }
    return{topCats,overCount,remaining,pctUsed,periodLabelText,daysLeft:Math.max(0,total-elapsed),pace};
  },[sum,payPeriods,profile]);

  // Display-only conversion; stored amounts are always in `cur`.
  const show=v=>{
    const c=primary===cur?v:(convert?convert(v,cur,primary):null);
    return`${primary} ${Math.round(c==null?v:c).toLocaleString("en-US")}`;
  };
  const barColor=spendStatusColor(sum.spent,sum.budget);
  const hasData=sum.cats.length>0;

  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8,flexWrap:"wrap"}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Tracked Spending</div>
        <div style={{fontSize:11,color:P.faint}}>{periodLabelText} · {profileLabel}</div>
      </div>

      {!hasData?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          No tracked categories with a budget this period.
        </div>
      :(
        <>
          {pace&&
            <Verdict tone={pace.tone}
              title={`Projected from ${show(sum.spent)} spent so far, extended over the whole period`}>
              {pace.onTrack?"On track this period"
                :pace.over>0?`Overspending — heading for ${show(pace.over)} over`
                :"Close to the limit"}
            </Verdict>}
          <div className="serif tnum" style={{fontSize:20,fontWeight:600,lineHeight:1.15,
            color:remaining>=0?P.ink:P.red}}>
            {show(Math.abs(remaining))} {remaining>=0?"remaining":"over"}
          </div>
          <div className="tnum" style={{fontSize:11,color:P.faint,marginTop:2}}>
            {show(sum.spent)} spent of {show(sum.budget)} · {pctUsed.toFixed(0)}% used
          </div>

          {/* Horizontal spent/remaining bar — replaces the old ring. */}
          <div style={{height:8,borderRadius:999,background:P.sfA,overflow:"hidden",marginTop:10}}>
            <div style={{height:"100%",width:`${Math.min(100,pctUsed)}%`,background:barColor,
              borderRadius:999,transition:"width .4s ease"}}/>
          </div>

          {overCount>0&&
            <div style={{fontSize:11,color:P.red,fontWeight:600,marginTop:6}}>
              {overCount} categor{overCount===1?"y":"ies"} over budget
            </div>}

          {/* Only the three closest to their limit — Home stays compact. */}
          <div className="home-fill" style={{marginTop:10,display:"flex",flexDirection:"column",
            justifyContent:"center",gap:6,minHeight:0}}>
            {topCats.map(c=>(
              <div key={c.id+c.owner} style={{display:"flex",alignItems:"center",gap:8,fontSize:11}}>
                <span style={{flex:1,color:P.sub,minWidth:0,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                <span className="tnum" style={{color:spendStatusColor(c.spent,c.budget),fontWeight:600}}>
                  {c.pct.toFixed(0)}%
                </span>
                <span className="tnum" style={{color:P.faint,whiteSpace:"nowrap",
                  minWidth:96,textAlign:"right"}}>
                  {/* Never a negative remaining — over-budget reads as "over". */}
                  {c.over?`${show(c.spent-c.budget)} over`:`${show(c.remaining)} left`}
                </span>
              </div>
            ))}
          </div>

          <div style={{fontSize:11,color:P.faint,marginTop:8}}>
            {daysLeft} day{daysLeft===1?"":"s"} left this period
          </div>
        </>
      )}
    </div>
  );
}

/* ── f/g. The two trend cards ──────────────────────────────────────────────
   These answer the remaining two Home questions — "is my lifestyle creeping?"
   and "am I improving my savings over time?" — and both need history that
   month-one users do not have. Expense tracking here started July 2026, so
   as of this build both render NOTHING.

   That is deliberate and was the explicit call: a card reading "not enough
   data yet" for months is exactly the decoration this redesign removed. They
   return null until MIN_TREND_BUCKETS completed periods exist and then appear
   on their own, with no further work.

   CAVEAT for whoever is here next: because they cannot render yet, their
   maths has been reviewed but never seen against real data. Re-check both
   the first month they light up (~Oct 2026). ─────────────────────────────── */

/* f. Lifestyle creep — this is about the *trend* in what you spend, so it
   compares the most recent COMPLETED period against the mean of the earlier
   completed ones. Deliberately not "this month so far", which is always
   lower and would report a phantom improvement. */
function LifestyleCreepCard({history,homeDisplay,convert,cur,onOpen}){
  if(!history||history.length<MIN_TREND_BUCKETS)return null;
  const latest=history[history.length-1];
  const prior=history.slice(0,-1);
  const baseline=prior.reduce((s,r)=>s+r.spent,0)/prior.length;
  if(!(baseline>0))return null;
  const deltaPct=((latest.spent-baseline)/baseline)*100;
  const primary=(homeDisplay&&homeDisplay.budget&&homeDisplay.budget.primary)||cur;
  const show=v=>{
    const c=primary===cur?v:(convert?convert(v,cur,primary):null);
    return`${primary} ${Math.round(c==null?v:c).toLocaleString("en-US")}`;
  };
  // ±5% is noise, not creep.
  const tone=deltaPct>10?"bad":deltaPct>5?"warn":deltaPct<-5?"good":"flat";
  const spark=history.map(r=>r.spent);
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{fontSize:12,color:P.sub,fontWeight:600,marginBottom:10}}>Lifestyle</div>
      <Verdict tone={tone} title={`Latest completed period vs the average of the ${prior.length} before it`}>
        {Math.abs(deltaPct)<=5?"Spending is holding steady"
          :deltaPct>0?`Spending up ${deltaPct.toFixed(0)}% vs your average`
          :`Spending down ${Math.abs(deltaPct).toFixed(0)}% vs your average`}
      </Verdict>
      <div className="tnum" style={{fontSize:11,color:P.faint}}>
        {show(latest.spent)} last period · {show(baseline)} average
      </div>
      <div className="home-fill home-spark" style={{marginTop:10,minHeight:0}}>
        <Sparkline data={spark} color={tone==="bad"?P.red:tone==="good"?P.gr:P.br} area height={46}/>
      </div>
    </div>
  );
}

/* g. Savings trend — same shape, on savings *rate* rather than spend, so a
   month where income also rose doesn't read as improvement when the
   proportion actually fell. Points, not percent-of-percent. */
function SavingsTrendCard({history,savingsTargetPct,onOpen}){
  if(!history||history.length<MIN_TREND_BUCKETS)return null;
  const withIncome=history.filter(r=>r.income>0);
  if(withIncome.length<MIN_TREND_BUCKETS)return null;
  const latest=withIncome[withIncome.length-1];
  const first=withIncome[0];
  const deltaPts=latest.rate-first.rate;
  const target=Number(savingsTargetPct)>0?Number(savingsTargetPct):20;
  const tone=deltaPts>=2?"good":deltaPts<=-2?"bad":"flat";
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{fontSize:12,color:P.sub,fontWeight:600,marginBottom:10}}>Savings trend</div>
      <Verdict tone={tone} title={`Savings rate now vs ${withIncome.length} completed periods ago`}>
        {Math.abs(deltaPts)<2?"Savings rate is flat"
          :deltaPts>0?`Improving — up ${deltaPts.toFixed(0)} points`
          :`Slipping — down ${Math.abs(deltaPts).toFixed(0)} points`}
      </Verdict>
      <div className="tnum" style={{fontSize:11,color:P.faint}}>
        {latest.rate.toFixed(0)}% last period · {first.rate.toFixed(0)}% at the start · {target}% target
      </div>
      <div className="home-fill home-spark" style={{marginTop:10,minHeight:0}}>
        <Sparkline data={withIncome.map(r=>r.rate)} color={tone==="bad"?P.red:P.gr} area height={46}/>
      </div>
    </div>
  );
}

/* e. Goals Summary Card — active/completed counts, a progress verdict, and
   one compact row per active goal.

   History: this first replaced a single combined progress bar summed across
   every goal, then spent a while showing exactly ONE goal (the one closest to
   completion) as a stand-in for a priority field the schema doesn't have.
   That was the wrong trade — with two goals you only ever saw one of them,
   and adding a third silently changed which one appeared rather than showing
   more. Every active goal now gets a row.

   Rows are still ordered CLOSEST TO COMPLETION first — the same derived sort
   that used to choose the single goal, kept because there is still no
   `priority`/`order` field on the goal schema and it puts the goals needing
   one last push at the top.

   Capped at GOAL_ROWS_MAX with a "+N more" line: Home is a dashboard, and an
   uncapped list would let one card run away with the page (the same reason
   the Budget rows were tightened). Completed goals stay in the header count
   only — they need no action, so they don't earn vertical space here. */
const GOAL_ROWS_MAX=4;
function GoalsSummaryCard({goals,profile,owners,onOpen}){
  const list=profile==="household"?(goals||[]):(goals||[]).filter(g=>g.owner===profile);
  const withSaved=list.map(g=>{
    const saved=(g.contributions||[]).filter(c=>!c.deletedAt).reduce((s,c)=>s+(Number(c.amount)||0),0);
    const target=Number(g.target)||0;
    return{...g,saved,target,pct:target>0?(saved/target)*100:0,completed:target>0&&saved>=target};
  });
  const active=withSaved.filter(g=>!g.completed);
  const completedCount=withSaved.length-active.length;
  const ranked=[...active].sort((a,b)=>b.pct-a.pct);
  const shown=ranked.slice(0,GOAL_ROWS_MAX);
  const hiddenCount=ranked.length-shown.length;

  /* "Am I progressing with my goals?" — a goal is *stalled* if it has no
     monthly contribution set, because then nothing is carrying it forward
     and its progress bar will look identical next month. Goals carrying a
     monthly amount are on pace by definition (the schema has no target date
     to be late against — TargetsView is where dated projections live), so
     the honest verdict is about movement, not lateness. */
  const funded=active.filter(g=>Number(g.monthly)>0).length;
  const stalled=active.length-funded;
  /* Deliberately mirrors BudgetCard's shell (header row, ring + headline,
     footer detail) so the two read as a matched pair on the same grid row
     rather than one dense card beside a nearly empty one. */
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:6}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Goals</div>
        <div style={{fontSize:12,color:P.faint}}>{completedCount} completed · {active.length} active</div>
      </div>
      {active.length>0&&
        <Verdict tone={stalled===0?"good":funded===0?"bad":"warn"}
          title="A goal with no monthly amount set has nothing moving it forward">
          {stalled===0?`All ${active.length} goal${active.length===1?"":"s"} funded monthly`
            :funded===0?`No monthly amount set${active.length===1?"":" on any goal"}`
            :`${stalled} of ${active.length} goals have no monthly amount`}
        </Verdict>}
      {shown.length===0?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          {withSaved.length===0?"No goals yet":"All goals completed 🎉"}
        </div>
      :(
        /* home-fill keeps this block absorbing the card's leftover height, so
           Goals still bottom-aligns with its grid neighbour above 768px. */
        <div className="home-fill" style={{display:"flex",flexDirection:"column",gap:10,minHeight:0}}>
          {shown.map(g=>{
            const color=g.color||P.gr;
            return(
              <div key={g.id}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                  <span style={{width:8,height:8,borderRadius:999,background:color,flexShrink:0}}/>
                  <span style={{flex:1,minWidth:0,fontSize:12,fontWeight:600,color:P.ink,
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {g.name}
                    {/* Household merges both owners' goals, and the two people
                        genuinely have same-named goals ("Emergency Fund"), so
                        the row would otherwise be ambiguous. Only shown there —
                        on a single profile every goal already belongs to you. */}
                    {profile==="household"&&
                      <span style={{fontWeight:500,color:P.faint}}> · {(owners||{})[g.owner]||g.owner}</span>}
                  </span>
                  <span className="tnum" style={{fontSize:12,fontWeight:600,color:P.sub,flexShrink:0}}>
                    {g.pct.toFixed(0)}%
                  </span>
                </div>
                {/* same trough + liquid fill as Budget/Expenses/Forecast bars.
                    Width is clamped: an over-funded goal must not overflow. */}
                <div style={{...neuInset(999),height:6,overflow:"hidden"}}>
                  <div className="bar-animated liquid-fill"
                    style={{width:`${Math.min(100,Math.max(0,g.pct))}%`,height:"100%",
                      background:liquidFillBg(color)}}/>
                </div>
              </div>
            );
          })}
          {hiddenCount>0&&
            /* plain text, not a button — the whole card is already a
               role="button" that opens the Goals tab, so a nested control
               here would just be a second tap target for the same action. */
            <div style={{fontSize:11,color:P.faint,marginTop:"auto"}}>
              +{hiddenCount} more goal{hiddenCount===1?"":"s"}
            </div>}
        </div>
      )}
    </div>
  );
}

/* f. Quick Actions — + Expense reuses the exact same globalAddTrigger bump
   the header FAB already uses (see the "Quick add transaction" button in
   App()'s render). + Income/+ Investment navigate to their tab: there's no
   standalone income dialog (income is a plain input in Budget's header),
   and the trade-add modal lives inline inside InvestmentsView rather than
   as a shared component (noted as a known limitation/future extension
   point). + Goal Contribution gets a native Home sheet since contributeToGoal
   is trivially reusable standalone. Deliberately lighter-weight than a card:
   sits as a slim strip right under the Hero, not its own "section". */
function quickActionItems({onExpense,onIncome,onInvestment,onGoal}){
  return[["Expense",I.Receipt,onExpense],["Income",I.Wallet,onIncome],
         ["Investment",I.Trending,onInvestment],["Goal",I.Target,onGoal]];
}

/* Tablet/desktop only (the .cell-qa grid cell is display:none below 768px).
   A 4-up equal-fraction grid rather than a wrapping flex row: every button is
   the same width and height and the group spans the full content width, so it
   reads as part of the grid instead of loose pills, and it can never wrap
   awkwardly at an in-between viewport size. */
function QuickActions(handlers){
  return(

      {quickActionItems(handlers).map(([label,Icon,fn])=>(

/* Mobile counterpart to the Quick Actions bar: the floating + opens this
   bottom sheet. Same .sheet-bg/.sheet shell and the same four handlers — no
   duplicated workflows, just a different presentation for the breakpoint
   where a 4-up bar wouldn't fit. */

  useScrollLock(true);
  const dlgRef=useDialogA11y(onClose);
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
