/* ── Conflict resolution — shown when local and cloud data disagree and this
   device has unsynced changes. Blocking modal by design: the person must
   pick a side rather than risk either copy being silently lost. ── */
/* Shared renderer for a buildConflictDiff() result — used by both
   ConflictModal (local-vs-cloud) and PendingChangesModal (local-vs-last-
   synced-snapshot). `buckets` maps which diff field goes under which
   title/color for this context. */
const diffRowStyle={fontSize:12,color:P.sub,padding:"2px 0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"};
function DiffBucket({title,items,color,bg}){
  if(!items.length)return null;
  return(
    <div style={{marginBottom:8}}>
      <div style={{fontSize:11,fontWeight:700,color,background:bg,display:"inline-block",padding:"2px 7px",borderRadius:6,marginBottom:4}}>
        {title} ({items.length})
      </div>
      {items.slice(0,5).map((t,i)=><div key={i} style={diffRowStyle}>• {t}</div>)}
      {items.length>5&&<div style={diffRowStyle}>+{items.length-5} more</div>}
    </div>
  );
}
function DiffCollectionsList({diff,buckets}){
  return diff.map(c=>(
    <div key={c.key} style={{marginBottom:6}}>
      <div style={{fontSize:12,fontWeight:600,color:P.ink,marginBottom:2}}>{c.label}</div>
      {buckets.map(b=><DiffBucket key={b.field} title={b.title} items={c[b.field]} color={b.color} bg={b.bg}/>)}
    </div>
  ));
}

function ConflictModal({conflict,onKeepLocal,onUseCloud,onSaveLocalToCloud}){
  useScrollLock(true); // only ever mounted while open
  const remoteWhen=conflict.remoteSavedAt?new Date(conflict.remoteSavedAt).toLocaleString():"an unknown time";
  const choiceBtn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink,textAlign:"left",display:"block"};
  const diff=useMemo(()=>buildConflictDiff(conflict.local,conflict.remote),[conflict]);
  const totalOnlyLocal=diff.reduce((s,c)=>s+c.onlyLocal.length,0);
  const totalOnlyRemote=diff.reduce((s,c)=>s+c.onlyRemote.length,0);
  const totalChanged=diff.reduce((s,c)=>s+c.changed.length,0);
  const buckets=[
    {field:"onlyLocal",title:"Only on this device",color:P.gr,bg:P.grS},
    {field:"onlyRemote",title:"Only on cloud",color:P.br,bg:P.brS},
    {field:"changed",title:"Changed on both",color:P.amber,bg:P.amberS},
  ];
  return(
    <div className="sheet-bg">
      <div className="sheet" style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 8px",fontWeight:600}}>Cloud and local data differ</h3>
        <p style={{fontSize:13,color:P.sub,lineHeight:1.5,marginBottom:10}}>
          This device has changes that haven't been saved to the cloud, and the cloud copy — last saved {remoteWhen} — is different. Choose which one to keep.
        </p>
        {diff.length>0?(
          <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:P.faint,textTransform:"uppercase",letterSpacing:.4,marginBottom:6}}>What's different</div>
            <DiffCollectionsList diff={diff} buckets={buckets}/>
            <div style={{fontSize:11,color:P.faint,marginTop:4}}>
              "Use Cloud" would drop the {totalOnlyLocal} item{totalOnlyLocal===1?"":"s"} only on this device. "Save Local to Cloud" would drop the {totalOnlyRemote} item{totalOnlyRemote===1?"":"s"} only on cloud{totalChanged?`, and pick this device's version for the ${totalChanged} changed item${totalChanged===1?"":"s"}`:""}.
            </div>
          </div>
        ):(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>No record-level differences found — this is likely just a settings/timestamp mismatch.</p>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={onKeepLocal} style={choiceBtn}>
            Keep Local<div style={{fontWeight:400,fontSize:12,color:P.faint,marginTop:2}}>Stay on this device's data. Cloud is left as-is.</div>
          </button>
          <button onClick={onUseCloud} style={choiceBtn}>
            Use Cloud<div style={{fontWeight:400,fontSize:12,color:P.faint,marginTop:2}}>Replace this device's data with the cloud copy. A backup of your local data is kept.</div>
          </button>
          <button onClick={onSaveLocalToCloud} style={{...choiceBtn,border:"none",background:P.gr,color:"#fff"}}>
            Save Local to Cloud<div style={{fontWeight:400,fontSize:12,opacity:.85,marginTop:2}}>Overwrite the cloud copy with this device's data.</div>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Pending-changes viewer — diffs the current local data against the last
   full snapshot known to be in sync with the cloud (cached locally, so this
   works offline / without a round-trip). Answers "what exactly is the N in
   the Save to Cloud badge?" before the person commits to syncing. ── */
function PendingChangesModal({data,onClose,onSaveToCloud}){
  useScrollLock(true); // only ever mounted while open
  const snapshot=useMemo(()=>loadSyncedSnapshot(),[]);
  const diff=useMemo(()=>snapshot?buildConflictDiff(data,snapshot):[],[data,snapshot]);
  const buckets=[
    {field:"onlyLocal",title:"Added since last sync",color:P.gr,bg:P.grS},
    {field:"onlyRemote",title:"Removed since last sync",color:P.wine,bg:P.wineS},
    {field:"changed",title:"Edited since last sync",color:P.amber,bg:P.amberS},
  ];
  const btn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink,display:"flex",alignItems:"center",justifyContent:"center",gap:6};
  return(
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 8px",fontWeight:600}}>What's pending</h3>
        {!snapshot?(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>No cached copy of the last synced state yet on this device — this'll be available after the next successful sync.</p>
        ):diff.length>0?(
          <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:14}}>
            <DiffCollectionsList diff={diff} buckets={buckets}/>
          </div>
        ):(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>No record-level changes found since the last sync — the pending flag is likely just a settings or timestamp difference.</p>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={onSaveToCloud} style={{...btn,border:"none",background:P.gr,color:"#fff"}}>
            <I.Cloud size={14}/>Save to Cloud
          </button>
          <button onClick={onClose} style={btn}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ── Recently Deleted — everything that's been soft-deleted (deletedAt set)
   but not yet purged, grouped by type, with one-tap restore. Only surfaces
   top-level records (transactions, goals, investments, etc.) — nested items
   like a single contribution or trade are covered by the undo toast at the
   moment you delete them instead of showing up here individually. ── */
function RecentlyDeletedModal({data,restoreRecord,retentionDays,onClose}){
  useScrollLock(true); // only ever mounted while open
  const groups=useMemo(()=>CONFLICT_COLLECTIONS.map(({key,label,nameOf})=>({
    key,label,
    items:((data||{})[key]||[]).filter(x=>x.deletedAt).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt)).map(x=>({id:x.id,label:nameOf(x),deletedAt:x.deletedAt})),
  })).filter(g=>g.items.length),[data]);
  const btn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink};
  return(
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 4px",fontWeight:600}}>Recently Deleted</h3>
        <p style={{fontSize:11,color:P.faint,marginBottom:14}}>
          Kept for {retentionDays} days before being permanently removed.
        </p>
        {groups.length===0?(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>Nothing here right now.</p>
        ):(
          <div style={{marginBottom:14}}>
            {groups.map(g=>(
              <div key={g.key} style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:P.faint,textTransform:"uppercase",letterSpacing:.4,marginBottom:6}}>{g.label}</div>
                {g.items.map(it=>(
                  <div key={it.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"8px 0",borderBottom:`1px solid ${P.line}`}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:13,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.label}</div>
                      <div style={{fontSize:11,color:P.faint}}>Deleted {new Date(it.deletedAt).toLocaleDateString()}</div>
                    </div>
                    <button onClick={()=>restoreRecord(g.key,it.id)}
                      style={{flexShrink:0,borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:600,border:`1px solid ${P.grS}`,background:P.grS,color:P.grD}}>
                      Restore
                    </button>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
        <button onClick={onClose} style={{...btn,width:"100%"}}>Close</button>
      </div>
    </div>
  );
}

        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <input value={owners.me} onChange={e=>setOwnerName("me",e.target.value)} placeholder="Your name" style={{flex:1,minWidth:0,borderRadius:10,padding:"8px 10px",fontSize:14,background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}/>
          <input value={owners.wife} onChange={e=>setOwnerName("wife",e.target.value)} placeholder="Wife's name" style={{flex:1,minWidth:0,borderRadius:10,padding:"8px 10px",fontSize:14,background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}/>
        </div>
        <button onClick={openProfilePicker}
          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",borderRadius:10,padding:"8px 12px",fontSize:13,fontWeight:500,marginBottom:16,
            background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}>
          <I.Users size={14}/>Change default profile for this device
        </button>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Pay periods</div>
        <div style={{fontSize:11,color:P.faint,marginBottom:8,lineHeight:1.5}}>
          Budget and track expenses by paycheck instead of calendar month. Off by default — when off, that person's Budget and Expenses tabs work exactly as before.
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {["me","wife"].map(ok=>{
            const cfg=(data.payPeriods||{})[ok]||{enabled:false,payday:1};
            return(
              <div key={ok} style={{borderRadius:10,padding:"10px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:cfg.enabled?8:0}}>
                  <span style={{fontSize:13,fontWeight:600,color:P.ink}}>{owners[ok]}</span>
                  <button onClick={()=>setPayPeriod(ok,{enabled:!cfg.enabled})}
                    style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,
                      background:cfg.enabled?P.gr:P.sf,color:cfg.enabled?"#fff":P.sub,border:`1px solid ${cfg.enabled?P.gr:P.line}`}}>
                    {cfg.enabled?"On":"Off"}
                  </button>
                </div>
                {cfg.enabled&&(
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,color:P.sub}}>Payday</span>
                    <input type="number" min="1" max="31" value={cfg.payday}
                      onChange={e=>setPayPeriod(ok,{payday:Math.min(31,Math.max(1,Number(e.target.value)||1))})}
                      className="tnum" style={{width:56,borderRadius:8,padding:"5px 8px",fontSize:13,background:P.sf,border:`1px solid ${P.line}`,color:P.ink}}/>
                    <span style={{fontSize:11,color:P.faint,flexBasis:"100%"}}>of each month{cfg.payday>28?" (clamped to last day in short months)":""}</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Currency label</div>
        <input value={data.currency} onChange={e=>setData(d=>({...d,currency:e.target.value}))} style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,marginBottom:16,background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}/>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Home Display</div>
        <div style={{fontSize:11,color:P.faint,marginBottom:8,lineHeight:1.5}}>
          Which currency each Home card shows its figure in. Presentation only — never affects any stored balance or calculation.
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {(()=>{
            const hd=data.homeDisplay||{};
            const setHD=(card,patch)=>setData(d=>({...d,homeDisplay:{...(d.homeDisplay||{}),[card]:{...((d.homeDisplay||{})[card]||{}),...patch}}}));
            const selStyle={borderRadius:8,padding:"5px 8px",fontSize:13,background:P.sf,border:`1px solid ${P.line}`,color:P.ink};
            return(<>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <span style={{fontSize:13,color:P.ink}}>Net Worth card</span>
                <select value={(hd.netWorth&&hd.netWorth.primary)||"PHP"} onChange={e=>setHD("netWorth",{primary:e.target.value})} style={selStyle}>
                  {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div style={{borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:6}}>Net Worth card — secondary currencies</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {BANK_CCY.map(c=>{
                    const list=(hd.netWorth&&hd.netWorth.secondary)||["SAR","USD","PHP"];
                    const active=list.includes(c);
                    return(
                      <button key={c} onClick={()=>setHD("netWorth",{secondary:active?list.filter(x=>x!==c):[...list,c]})}
                        style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,
                          background:active?P.grS:P.sf,color:active?P.grD:P.sub,border:`1px solid ${active?P.grS:P.line}`}}>
                        {c}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <span style={{fontSize:13,color:P.ink}}>Portfolio card</span>
                <select value={(hd.portfolio&&hd.portfolio.primary)||"USD"} onChange={e=>setHD("portfolio",{primary:e.target.value})} style={selStyle}>
                  {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <span style={{fontSize:13,color:P.ink}}>Savings &amp; Investing card</span>
                <select value={(hd.savingsInvesting&&hd.savingsInvesting.primary)||"PHP"} onChange={e=>setHD("savingsInvesting",{primary:e.target.value})} style={selStyle}>
                  {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                <span style={{fontSize:13,color:P.ink}}>Tracked Spending card</span>
                <select value={(hd.budget&&hd.budget.primary)||"PHP"} onChange={e=>setHD("budget",{primary:e.target.value})} style={selStyle}>
                  {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </>);
          })()}
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Savings &amp; Investing categories</div>
        <div style={{fontSize:11,color:P.faint,marginBottom:8,lineHeight:1.5}}>
          Which budget categories count toward the Home Savings &amp; Investing card. Matched by
          category name each month — not Income minus Expenses, and not the "Invest &amp; Grow" target in Budget.
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {(()=>{
            const hs=data.homeSettings||{};
            const allNames=[...new Set((data.plans||[]).flatMap(p=>(p.categories||[]).map(c=>c.name)))].sort();
            const toggleName=(field,name)=>setData(d=>{
              const cur=(d.homeSettings&&d.homeSettings[field])||[];
              const next=cur.includes(name)?cur.filter(n=>n!==name):[...cur,name];
              return{...d,homeSettings:{...(d.homeSettings||{}),[field]:next}};
            });
            const picker=(label,field)=>{
              const sel=hs[field]||[];
              return(
                <div style={{borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                  <div style={{fontSize:12,color:P.sub,marginBottom:6}}>{label}</div>
                  {allNames.length===0?
                    <div style={{fontSize:12,color:P.faint}}>Add categories in Budget first.</div>
                  :(
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {allNames.map(name=>{
                        const active=sel.includes(name);
                        return(
                          <button key={name} onClick={()=>toggleName(field,name)}
                            style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,
                              background:active?P.grS:P.sf,color:active?P.grD:P.sub,border:`1px solid ${active?P.grS:P.line}`}}>
                            {name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            };
            return(<>
              {picker("Savings categories","savingsCategories")}
              {picker("Investment categories","investmentCategories")}
            </>);
          })()}
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Home card visibility</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {(()=>{
            const vis=(data.homeSettings&&data.homeSettings.cardVisibility)||{};
            const toggleCard=key=>setData(d=>({...d,homeSettings:{...(d.homeSettings||{}),
              cardVisibility:{...((d.homeSettings&&d.homeSettings.cardVisibility)||{}),[key]:vis[key]===false}}}));
            const cards=[["hero","Net Worth"],["portfolio","Portfolio"],["savingsInvesting","Savings & Investing"],["trackedSpending","Tracked Spending"],["goals","Goals"]];
            return cards.map(([key,label])=>{
              const on=vis[key]!==false;
              return(
                <div key={key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"8px 12px",background:P.sfA,border:`1px solid ${P.line}`}}>
                  <span style={{fontSize:13,color:P.ink}}>{label}</span>
                  <button onClick={()=>toggleCard(key)}
                    style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,
                      background:on?P.gr:P.sf,color:on?"#fff":P.sub,border:`1px solid ${on?P.gr:P.line}`}}>
                    {on?"Shown":"Hidden"}
                  </button>
                </div>
              );
            });
          })()}
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Investments</div>
        <button onClick={()=>setData(d=>({...d,settings:{...(d.settings||{}),includeMp2EstimateInNetWorth:!(d.settings&&d.settings.includeMp2EstimateInNetWorth)}}))}
          style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:16,
            background:P.sfA,border:`1px solid ${P.line}`,color:P.ink,textAlign:"left"}}>
          <span>Include estimated MP2 earnings in Net Worth<br/>
            <span style={{fontSize:11,color:P.faint,fontWeight:400}}>Off by default — Net Worth and Portfolio use MP2's confirmed value only</span>
          </span>
          <span style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,flexShrink:0,marginLeft:8,
            background:(data.settings&&data.settings.includeMp2EstimateInNetWorth)?P.gr:P.sf,color:(data.settings&&data.settings.includeMp2EstimateInNetWorth)?"#fff":P.sub,
            border:`1px solid ${(data.settings&&data.settings.includeMp2EstimateInNetWorth)?P.gr:P.line}`}}>
            {(data.settings&&data.settings.includeMp2EstimateInNetWorth)?"On":"Off"}
          </span>
        </button>
        <button onClick={()=>setData(d=>({...d,settings:{...(d.settings||{}),goldAutoRefresh:!(d.settings?d.settings.goldAutoRefresh!==false:true)}}))}
          style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:16,
            background:P.sfA,border:`1px solid ${P.line}`,color:P.ink,textAlign:"left"}}>
          <span>Automatically refresh gold price<br/>
            <span style={{fontSize:11,color:P.faint,fontWeight:400}}>On by default — gold rides the same background refresh as stock quotes. Turn off to only update it with the manual "Refresh prices" button in Investments.</span>
          </span>
          <span style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,flexShrink:0,marginLeft:8,
            background:(data.settings?data.settings.goldAutoRefresh!==false:true)?P.gr:P.sf,color:(data.settings?data.settings.goldAutoRefresh!==false:true)?"#fff":P.sub,
            border:`1px solid ${(data.settings?data.settings.goldAutoRefresh!==false:true)?P.gr:P.line}`}}>
            {(data.settings?data.settings.goldAutoRefresh!==false:true)?"On":"Off"}
          </span>
        </button>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:16,
          background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}>
          <span>Detailed (daily) snapshot history<br/>
            <span style={{fontSize:11,color:P.faint,fontWeight:400}}>How many recent days keep day-by-day resolution before older history compresses to weekly, then monthly</span>
          </span>
          <select value={(data.settings&&data.settings.snapshotRetention&&data.settings.snapshotRetention.dailyDays)||35}
            onChange={e=>setData(d=>({...d,settings:{...(d.settings||{}),snapshotRetention:{...((d.settings&&d.settings.snapshotRetention)||{weeklyDays:365}),dailyDays:Number(e.target.value)}}}))}
            style={{borderRadius:8,padding:"5px 8px",fontSize:13,background:P.sf,border:`1px solid ${P.line}`,color:P.ink,flexShrink:0}}>
            <option value={14}>14 days</option>
            <option value={35}>35 days</option>
            <option value={60}>60 days</option>
            <option value={90}>90 days</option>
          </select>
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Cloudflare KV Sync</div>
        {kvReady
          ?<div style={{marginBottom:16}}>
            {(()=>{
              const statusMap={
                saving:{label:"Saving…",color:P.sub,bg:P.sfA},
                synced:{label:"✅ Cloud synced",color:P.gr,bg:P.grS},
                pending:{label:`⚠️ Pending changes${changesSinceSave?` (${changesSinceSave})`:""}`,color:P.amber,bg:P.amberS},
                offline:{label:"📴 Offline — will sync when back online",color:P.sub,bg:P.sfA},
                failed:{label:"❌ Sync failed — data is safe on this device",color:P.red||P.wine,bg:P.amberS},
                stale:{label:"⬆️ Newer data available — syncing…",color:P.amber,bg:P.amberS},
                idle:hasUnsyncedChanges
                  ?{label:`⚠️ Local changes pending${changesSinceSave?` (${changesSinceSave})`:""}`,color:P.amber,bg:P.amberS}
                  :{label:"✅ Cloud is up to date",color:P.gr,bg:P.grS},
              };
              const s=statusMap[syncStatus]||statusMap.idle;
              return(
                <div style={{fontSize:12,color:s.color,marginBottom:8,padding:"8px 10px",background:s.bg,borderRadius:10,lineHeight:1.6}}>
                  {s.label}
                  <div style={{fontSize:11,color:P.faint,marginTop:4}}>
                    Last saved to cloud: {lastCloudSavedAt?lastCloudSavedAt.toLocaleString():"never"}<br/>
                    Last pulled from cloud: {lastCloudPulledAt?lastCloudPulledAt.toLocaleString():"never"}
                  </div>
                  {hasUnsyncedChanges&&onViewPendingChanges&&
                    <button onClick={onViewPendingChanges} style={{marginTop:6,background:"transparent",border:"none",padding:0,fontSize:11,fontWeight:600,color:P.amber,textDecoration:"underline"}}>
                      View what's pending
                    </button>}
                </div>
              );
            })()}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <button onClick={()=>saveToCloud()} disabled={syncOp==="push"} style={btn}>
                <I.Cloud size={14}/>{syncOp==="push"?"Saving…":"Save to Cloud"}
              </button>
              <button onClick={()=>pullFromCloud()} disabled={syncOp==="pull"} style={btn}>
                <I.Refresh size={14}/>{syncOp==="pull"?"Pulling…":"Pull from Cloud"}
              </button>
            </div>
            {preCloudBackupAt&&
              <button onClick={restorePreCloudBackup} style={{...btn,width:"100%",marginBottom:8}}>
                <I.Reset size={14}/>Restore previous local copy
              </button>}
            <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginBottom:8}}>
              Changes save automatically on this device. Cloud upload only happens when you tap Save to Cloud. Opening the app checks the cloud automatically — pull-to-sync on mobile saves pending changes first, or pulls the latest copy when this device is already clean.
            </div>
            <div style={{fontSize:11,color:P.sub,padding:"8px 10px",background:P.sfA,borderRadius:10}}>
              Pull before editing on another device. Save to Cloud when finished — you and {owners.wife||"your partner"} share this dataset.
            </div>
            <SyncDiagnostics {...{localRev,cloudRev,lastCloudSavedAt,lastCloudPulledAt,hasUnsyncedChanges,changesSinceSave,syncStatus,isOnline,lastSyncError}}/>
          </div>
          :<div style={{marginBottom:16,fontSize:12,color:P.sub,padding:"10px 12px",background:P.sfA,borderRadius:10,lineHeight:1.6}}>
            Add your Worker URL and Sync Token to <code>index.html</code> to enable sync.
            See the setup guide for instructions.
          </div>
        }
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Manual backup</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <button onClick={download} style={btn}><I.Download size={14}/>Download</button>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} style={btn}><I.Upload size={14}/>Import</button>
        </div>
        <input ref={fileRef} type="file" accept=".json" onChange={onFile} style={{display:"none"}}/>
        {msg&&<div style={{fontSize:12,color:P.gr,marginBottom:12}}>{msg}</div>}
        {onOpenRecentlyDeleted&&
          <button onClick={onOpenRecentlyDeleted} style={{...btn,width:"100%",marginBottom:12}}>
            <I.Trash size={14}/>Recently Deleted
          </button>}
        <button onClick={()=>confirm?(setData(migrate(defaultData())),flash("Reset done")):setConfirm(true)}
          style={{display:"flex",width:"100%",alignItems:"center",justifyContent:"center",gap:8,borderRadius:10,padding:"8px 12px",fontSize:14,fontWeight:500,marginTop:4,
            background:confirm?P.red:P.sfA,color:confirm?"#fff":P.red,border:`1px solid ${confirm?P.red:P.line}`}}>
          <I.Reset size={14}/>{confirm?"Tap again to confirm reset":"Reset to sample data"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
window.__hideLoading=function(){
  var el=document.getElementById("loading");
  if(el){el.style.opacity="0";el.style.transition="opacity 0.3s";setTimeout(function(){el.remove();},300);}
};
setTimeout(window.__hideLoading,30000);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.log('SW Registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
