          display:"flex",alignItems:"center",justifyContent:"center",gap:6,flexWrap:"wrap"}}>
          <span>{num(cur)}</span>
          {mode!=="set"&&<span style={{fontWeight:700,color:MODES[idx][2]}}>{mode==="add"?"+":"−"}</span>}
          {mode!=="set"&&<span>{hasAmount?num(Math.abs(parsed)):"0"}</span>}
          <span style={{color:P.faint}}>=</span>
          <strong style={{fontSize:16,color:goesNegative?P.wine:P.neuInk}}>{num(next)}</strong>
        </div>
        <div style={{fontSize:11,color:goesNegative?P.wine:P.faint,marginBottom:16,textAlign:"center",minHeight:15}}>
          {goesNegative?"This would take the account below zero.":"Supports simple math, e.g. 250+80"}
        </div>

        <button onClick={submit} disabled={!canSave}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:10,
            padding:"12px 0",fontSize:14,fontWeight:600,border:"none",
            background:canSave?P.jade:P.sfA,color:canSave?"#fff":P.faint,cursor:canSave?"pointer":"default"}}>
          <I.Check size={14}/>Save balance
        </button>
      </div>
    </div>
    </Portal>
  );
}

/* ── Interest setup for one account ───────────────────────────────────────
   Lives inside the account's settings panel (behind the gear) rather than on
   the card, so accounts that don't earn interest — most of them — never see
   it. Everything here is configuration; the maths is bankValuation()'s.

   Enabling stamps `balanceAsOf` to today. That is load-bearing: migrate()
   backfills the anchor from `updatedAt`, which for an old record is the
   year-2000 sentinel, and accruing from there would invent decades of
   interest the moment the toggle is flipped. ── */
function InterestSettings({b,updateBank,todayStr,accent}){
  const it=b.interest;
  const on=!!(it&&it.enabled!==false);
  const patch=next=>updateBank(b.id,{interest:{...(it||DEFAULT_BANK_INTEREST()),...next}});
  const tiers=(it&&it.tiers)||[];
  const setTier=(i,next)=>patch({tiers:tiers.map((t,j)=>j===i?{...t,...next}:t)});
  const toggle=()=>{
    if(!it)updateBank(b.id,{interest:DEFAULT_BANK_INTEREST(),balanceAsOf:todayStr});
    else if(it.enabled===false)updateBank(b.id,{interest:{...it,enabled:true},balanceAsOf:todayStr});
    else patch({enabled:false});  // keep the tiers, just stop accruing
  };
  const field={...neuInset(8),flex:1,minWidth:0,textAlign:"right",fontSize:13,padding:"5px 8px",color:P.neuInk};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:8,paddingTop:8,borderTop:`1px solid ${P.line}`}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:12,color:P.neuSub}}>Earns interest</span>
        <button onClick={toggle} aria-pressed={on} className="status-pill status-pill-fixed"
          style={{marginLeft:"auto",cursor:"pointer",border:`1px solid ${on?P.grS:P.line}`,
            background:on?P.grS:"transparent",color:on?P.grD:P.neuSub}}>
          {on?<I.Check size={13}/>:<I.X size={13}/>}{on?"On":"Off"}
        </button>
      </div>

      {on&&<>
        {/* Whole-balance tiers: the balance picks ONE rate and it applies to
            all of it. Said in the UI because the marginal reading is the more
            common convention and would quietly give a different number. */}
        <div style={{fontSize:11,color:P.faint,lineHeight:1.5}}>
          The balance picks one rate and it applies to the whole amount — not
          just the part above each threshold.
        </div>
        {tiers.map((t,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:P.neuSub,flexShrink:0}}>{i===0?"From":"From"}</span>
            <NumField value={t.from} onCommit={v=>setTier(i,{from:v})} min={0}
              className="bare tnum" style={field}/>
            <span style={{fontSize:11,color:P.neuSub,flexShrink:0}}>at</span>
            <NumField value={t.rate} onCommit={v=>setTier(i,{rate:v})} min={0}
              className="bare tnum" style={{...field,maxWidth:70}}/>
            <span style={{fontSize:11,color:P.neuSub,flexShrink:0}}>%</span>
            {tiers.length>1&&
              <IconButton icon={I.Trash} label={`Remove tier ${i+1}`} size={13}
                onClick={()=>patch({tiers:tiers.filter((_,j)=>j!==i)})}
                style={{color:P.wine,opacity:.5,flexShrink:0}}/>}
          </div>
        ))}
        <button onClick={()=>patch({tiers:[...tiers,{from:0,rate:0}]})} className="neu-btn"
          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,padding:"5px 0",
            fontSize:11,fontWeight:600,color:accent}}>
          <I.Plus size={11}/>Add tier
        </button>

        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:P.neuSub,flexShrink:0}}>Withholding tax</span>
          <NumField value={(it&&it.taxPct)!=null?it.taxPct:20} onCommit={v=>patch({taxPct:v})} min={0} max={100}
            className="bare tnum" style={{...field,maxWidth:70}}/>
          <span style={{fontSize:11,color:P.neuSub,flexShrink:0}}>%</span>
          <select value={(it&&it.crediting)||"daily"} onChange={e=>patch({crediting:e.target.value})}
            aria-label="Interest crediting frequency"
            style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub,flexShrink:0}}>
            {BANK_CREDITING.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select>
        </div>
        <div style={{fontSize:11,color:P.faint,lineHeight:1.5}}>
          Accruing from {b.balanceAsOf
            ?new Date(b.balanceAsOf+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
            :"—"}. Updating the balance re-anchors this to that day.
        </div>
      </>}
    </div>
  );
}

/* Bank owner keys. "household" is a JOINT account — it belongs to both, so it
   shows only in the Combined view, never in either person's. Kept here rather
   than inlined so the label and the accent stay in one place. */
const BANK_OWNERS=["me","wife","household"];
function bankOwnerLabel(k,owners){return k==="household"?"Joint":(owners&&owners[k])||k;}
function bankOwnerAccent(k){return k==="wife"?{c:P.br,s:P.brS}:k==="household"?{c:P.amber,s:P.amberS}:{c:P.jade,s:P.jadeS};}

function BanksView({banks,addBank,updateBank,removeBank,convert,sarRate,profile,setProfile,owners,syncNow}){
  const[openId,setOpenId]=useState(null); // account id whose settings panel is expanded
  const[balanceEditId,setBalanceEditId]=useState(null); // account id whose Update-balance sheet is open
  const sar=n=>formatMoney(n,{code:"SAR"});
  // One date for the whole view, so every card and every total on screen is
  // computed against the same day (see bankValuation).
  const todayStr=new Date().toISOString().slice(0,10);
  const sarOf=b=>{const v=convert(bankValue(b,todayStr),b.currency,"SAR");return v==null?0:v;};
  /* Everything on screen follows the profile switch. Combined shows all three
     owner buckets; a person's view shows strictly their own accounts. */
  const visibleBanks=profile==="household"?banks:banks.filter(b=>b.owner===profile);
  const total=visibleBanks.reduce((s,b)=>s+sarOf(b),0);
  const usdTotal=sarRate?Math.round(total/sarRate):null;
  const phpTotal=convert?convert(total,"SAR","PHP"):null;
  /* Per-owner tiles, including Joint — without that third bucket the tiles
     didn't add up to the total whenever a jointly-owned account existed. */
  const ownerTotals={};
  BANK_OWNERS.forEach(k=>{ownerTotals[k]=banks.filter(b=>b.owner===k).reduce((s,b)=>s+sarOf(b),0);});
  const hasJoint=banks.some(b=>b.owner==="household");

  const Card=b=>{
    const isOpen=openId===b.id;
    const{c:accent,s:accentS}=bankOwnerAccent(b.owner);
    const val=bankValuation(b,todayStr);
    // Whole units on the headline: accrual always produces cents, and at 26px
    // serif "PHP 150,203.14" wraps to two lines and collides with the Update
    // button. Every other money figure in the app (the totals above, sar())
    // already rounds — the card was the outlier. The exact stored figure is
    // still visible and editable in the settings panel's Balance field.
    const money=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
    const money2=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
    return(
      <div key={b.id} style={{...neu(16),overflow:"hidden",position:"relative",display:"flex",flexDirection:"column"}}>
        {/* accent strip — reads as the "card network" band of a wallet pass */}
        <div style={{height:5,background:accent}}/>
        <div style={{padding:16,flex:1,display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:11,fontWeight:600,color:accent,textTransform:"uppercase",letterSpacing:".05em"}}>{b.bank||"Bank"}</div>
              <div style={{fontSize:16,fontWeight:700,color:P.neuInk,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{b.name||"Account"}</div>
            </div>
            <button onClick={()=>setOpenId(isOpen?null:b.id)}
              title="Account settings" aria-label={`${b.name||"Account"} settings`} aria-expanded={isOpen} className="neu-btn"
              style={{flexShrink:0,borderRadius:10,padding:6,color:isOpen?accent:P.neuSub}}>
              <I.Settings size={14}/>
            </button>
          </div>

          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:8}}>
            <div style={{minWidth:0}}>
              <div className="serif tnum" style={{fontSize:26,fontWeight:600,color:P.neuInk,whiteSpace:"nowrap"}}>
                {b.currency} {money(val.value)}
              </div>
              {/* Accrual is always labelled an estimate and always says what
                  it's an estimate *since*, because the app can never separate
                  interest from a deposit after the fact — the honest claim is
                  only ever "since you last confirmed this". */}
              {val.active&&
                <div className="tnum" style={{fontSize:11,color:accent,marginTop:2}}>
                  ≈ {money2(val.accrued)} accrued since{" "}
                  {new Date(val.since+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                  <span style={{color:P.faint}}> · est.</span>
                </div>}
              {b.currency!=="SAR"&&<div className="tnum" style={{fontSize:12,color:P.neuSub,marginTop:2}}>≈ {sar(sarOf(b))}</div>}
            </div>
            {/* Primary action on this card — updating a balance is by far the
                most frequent thing anyone does here, so it gets a real button
                rather than living behind the settings gear. */}
            <button onClick={()=>setBalanceEditId(b.id)} className="neu-btn"
              aria-label={`Update ${b.name||"account"} balance`}
              style={{flexShrink:0,display:"flex",alignItems:"center",gap:5,padding:"7px 12px",
                fontSize:12,fontWeight:600,color:accent}}>
              <I.Plus size={12}/>Update
            </button>
          </div>

          <div style={{marginTop:"auto",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:10,fontWeight:600,borderRadius:999,padding:"2px 8px",background:accentS,color:accent}}>{b.currency}</span>
            <span style={{fontSize:10,color:P.neuSub}}>{COUNTRIES.find(([c])=>c===b.country)?.[1]||b.country}</span>
            {/* On the card face, not just behind the settings gear: an account
                the Purchase Advisor won't spend has to say so where the balance
                is, or the advisor's total looks wrong rather than careful. */}
            {bankIsReserved(b)&&
              <span style={{fontSize:10,fontWeight:600,borderRadius:999,padding:"2px 8px",
                background:P.amberS,color:"#E07B2A"}}>Emergency fund</span>}
            {!bankIsAccessible(b)&&
              <span style={{fontSize:10,fontWeight:600,borderRadius:999,padding:"2px 8px",
                background:P.sfA,color:P.faint}}>Can't reach</span>}
            <span style={{marginLeft:"auto",fontSize:10,fontWeight:600,color:accent}}>{bankOwnerLabel(b.owner,owners)}</span>
          </div>
        </div>

        {/* ── settings panel — edit fields, collapsed by default ── */}
        {isOpen&&(
          <div style={{...neuInset(0),borderRadius:0,padding:"12px 16px",display:"flex",flexDirection:"column",gap:8}}>
            <div style={{display:"flex",gap:8}}>
              <input value={b.name} placeholder="Account name" onChange={e=>updateBank(b.id,{name:e.target.value})}
                className="bare" style={{...neu(8),flex:1,fontSize:13,fontWeight:600,padding:"6px 8px",color:P.neuInk}}/>
              <input value={b.bank} placeholder="Bank name" onChange={e=>updateBank(b.id,{bank:e.target.value})}
                className="bare" style={{...neu(8),flex:1,fontSize:13,padding:"6px 8px",color:P.neuInk}}/>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select value={b.country} onChange={e=>updateBank(b.id,{country:e.target.value})}
                style={{...neu(8),flex:1,padding:"6px 8px",fontSize:12,border:"none",color:P.neuSub}}>
                {COUNTRIES.map(([c,l])=><option key={c} value={c}>{l}</option>)}
              </select>
              <select value={b.currency} onChange={e=>updateBank(b.id,{currency:e.target.value})}
                style={{...neu(8),padding:"6px 8px",fontSize:12,border:"none",color:P.neuSub}}>
                {BANK_CCY.map(c=><option key={c}>{c}</option>)}
              </select>
              {/* Owner is editable here as well as via which section you added
                  from — without this, "household" (joint) would be unreachable. */}
              <select value={b.owner} onChange={e=>updateBank(b.id,{owner:e.target.value})}
                aria-label="Account owner"
                style={{...neu(8),padding:"6px 8px",fontSize:12,border:"none",color:P.neuSub}}>
                {BANK_OWNERS.map(k=><option key={k} value={k}>{bankOwnerLabel(k,owners)}</option>)}
              </select>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:12,color:P.neuSub}}>Balance ({b.currency})</span>
              {/* Typing here is a confirmation too, so it re-anchors the
                  accrual date exactly like the Update sheet's Set mode. */}
              <NumField value={b.balance} onCommit={v=>{updateBank(b.id,{balance:v,balanceAsOf:todayStr});syncNow&&syncNow();}}
                className="bare tnum" style={{...neuInset(8),flex:1,textAlign:"right",fontSize:14,fontWeight:600,padding:"6px 8px",color:P.neuInk}}/>
            </div>

            {/* ── What this account is for ──
                Both fields affect the Purchase Advisor only. Net worth, the
                Home cash card and every total elsewhere still count this money
                — you own it either way, and an account you can't reach today
                has not stopped being yours. */}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <select value={b.purpose||""} aria-label="What this account is for"
                onChange={e=>updateBank(b.id,{purpose:e.target.value||null})}
                style={{...neu(8),flex:"1 1 150px",minWidth:0,padding:"6px 8px",fontSize:12,border:"none",color:P.neuSub}}>
                {BANK_PURPOSES.map(([v,l])=><option key={v||"none"} value={v}>{l}</option>)}
              </select>
              <label style={{display:"flex",alignItems:"center",gap:8,minHeight:40,
                fontSize:12,color:P.neuSub,flex:"1 1 150px",minWidth:0}}>
                <input type="checkbox" checked={bankIsAccessible(b)}
                  onChange={e=>updateBank(b.id,{accessible:e.target.checked?null:false})}
                  style={{width:16,height:16,accentColor:P.jade,flexShrink:0}}/>
                <span>I can reach this money</span>
              </label>
            </div>
            <div style={{fontSize:11,color:P.faint,lineHeight:1.5,marginTop:-2}}>
              {!bankIsAccessible(b)
                ?"Left out of the Purchase Advisor's available cash, shown there as excluded, and includable for one purchase from that tab. Still counted in Net Worth."
                :bankIsReserved(b)
                  ?"Held back from the Purchase Advisor's available cash. You can release it for a single purchase from that tab."
                  :"Counted as spendable by the Purchase Advisor."}
            </div>

            <InterestSettings b={b} updateBank={updateBank} todayStr={todayStr} accent={accent}/>

            <button onClick={()=>{removeBank(b.id);setOpenId(null);}} className="neu-btn"
              style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"7px 0",
                fontSize:12,fontWeight:600,color:P.wine}}>
              <I.Trash size={12}/>Delete account
            </button>
          </div>
        )}
      </div>
    );
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      {/* ── top summary — total liquid assets, split by owner ── */}
      <div style={{background:P.deep,color:"#fff",borderRadius:18,padding:16,marginBottom:16,
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`,
        display:"flex",flexWrap:"wrap",gap:16,alignItems:"center"}}>
        <div style={{flex:"1 1 200px"}}>
          <div style={{fontSize:12,fontWeight:500,color:P.deepHi,marginBottom:4}}>
            Total liquid assets{profile!=="household"?` · ${owners[profile]||""}`:""}
          </div>
          <span className="serif tnum" style={{fontSize:30,fontWeight:600}}>{sar(total)}</span>
          <div className="tnum" style={{marginTop:6,display:"flex",gap:16,color:P.deepHi,fontSize:14}}>
            <span>{usdTotal!=null?`≈ $${usdTotal.toLocaleString("en-US")}`:"USD —"}</span>
            <span>{phpTotal!=null?`≈ ₱${Math.round(phpTotal).toLocaleString("en-US")}`:"PHP —"}</span>
          </div>
        </div>
        {profile==="household"&&(
          <div style={{display:"flex",gap:10,flex:"1 1 220px"}}>
            {BANK_OWNERS.filter(k=>k!=="household"||hasJoint).map(k=>(
              <div key={k} style={{flex:1,background:"rgba(0,0,0,.2)",boxShadow:"inset 2px 2px 5px rgba(0,0,0,.3),inset -1px -1px 2px rgba(255,255,255,.05)",borderRadius:12,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:P.deepHi}}>{bankOwnerLabel(k,owners)}</div>
                <div className="tnum" style={{fontSize:16,fontWeight:700}}>{sar(ownerTotals[k])}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}>
        <HomeProfileToggle profile={profile} setProfile={setProfile} owners={owners}/>
      </div>

      {/* ── card grid, per owner. Combined lists all three buckets; a person's
             view lists only theirs, so joint money never lands in one name. ── */}
      {(profile==="household"?BANK_OWNERS:[profile]).map(ok=>{
        const items=banks.filter(b=>b.owner===ok);
        // don't advertise a Joint section to someone who has no joint accounts
        if(ok==="household"&&!items.length&&profile!=="household")return null;
        const{c:accent}=bankOwnerAccent(ok);
        const who=bankOwnerLabel(ok,owners);
        return(
          <section key={ok} style={{marginBottom:22}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{width:8,height:8,borderRadius:999,background:accent}}/>
              <h2 style={{fontSize:14,fontWeight:600,color:accent,margin:0}}>{ok==="household"?"Joint accounts":`${who}'s accounts`}</h2>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(min(280px,100%),1fr))",gap:12}}>
              {items.map(Card)}
              <button onClick={()=>addBank(ok)} className="neu-btn"
                style={{borderRadius:16,minHeight:150,color:P.jade,
                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,fontSize:13,fontWeight:500}}>
                <I.Plus size={20}/>Add {ok==="household"?"joint":`${who}'s`} account
              </button>
            </div>
          </section>
        );
      })}
      {/* Looked up fresh from `banks` rather than captured at open time, so the
          sheet can't act on a stale balance if a sync lands while it's open.
          If the account disappears out from under it (deleted on another
          device), the sheet unmounts instead of writing to a dead record. */}
      {(()=>{
        const acct=banks.find(b=>b.id===balanceEditId);
        if(!acct)return null;
        return <UpdateBalanceSheet account={acct} onClose={()=>setBalanceEditId(null)}
          onConfirm={newBalance=>{
            // Every mode re-anchors: the figure being saved is true as of
            // today, whether it came from a deposit, a withdrawal or a
            // statement. Accrual restarts from here.
            updateBank(acct.id,{balance:newBalance,balanceAsOf:todayStr});
            setBalanceEditId(null);syncNow&&syncNow();
          }}/>;
      })()}
    </div>
  );
}

/* ── INVESTMENTS VIEW — trade log ── */
function InvestmentsView({profile,setProfile,invs,addInv,updateInv,removeInv,addTrade,removeTrade,livePrice,setLivePrice,sarRate,convert,projection,setProjection,portHistory,addPortSnap,snapshots,owners,
  mp2Rates,mp2RatesByYear,addMp2Rate,updateMp2Rate,removeMp2Rate,
  addMp2Contribution,updateMp2Contribution,removeMp2Contribution,recordMp2Payout,
  confirmTdMaturity,transferTdProceeds,banks,includeMp2Estimate}){
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[updatedAt,setUpdatedAt]=useState(null);
  const[tradeModal,setTradeModal]=useState(null); // invId
  const[contribModal,setContribModal]=useState(null); // invId (MP2)
  const[payoutModal,setPayoutModal]=useState(null); // invId (MP2)
  const[maturityModal,setMaturityModal]=useState(null); // invId (TD)
  const[showRates,setShowRates]=useState(false);
  useScrollLock(!!tradeModal||!!contribModal||!!payoutModal||!!maturityModal||showRates);
  const tradeDlgRef=useDialogA11y(()=>setTradeModal(null),!!tradeModal);
  const[tradeForm,setTradeForm]=useState({type:"buy",shares:"",price:"",date:new Date().toISOString().slice(0,10)});
  const[expandedId,setExpandedId]=useState(null);
  const[fetchingName,setFetchingName]=useState({});

  /* Section 8 filters — account type / active-matured status. Owner is no
     longer a local dropdown: it's the app-wide profile switch, where
     "household" means the combined view (everything, including jointly-owned
     holdings) and a person's view means strictly their own. Status only
     meaningfully applies to Time Deposit (stocks/MP2 don't have a status
     field), so it's a no-op filter for the other two types. */
  const[typeFilter,setTypeFilter]=useState("all");
  const[statusFilter,setStatusFilter]=useState("all"); // all | active | matured
  const passFilters=hld=>{
    if(profile!=="household"&&(hld.owner||"me")!==profile)return false;
    if(typeFilter!=="all"&&(hld.type||"stocks")!==typeFilter)return false;
    if(statusFilter!=="all"&&hld.type==="td"){
      const st=hld.status||"active";
      if(statusFilter==="active"&&st!=="active")return false;
      if(statusFilter==="matured"&&st==="active")return false;
    }
    return true;
  };
  const filteredInvs=invs.filter(passFilters);
  const stocksInvs=filteredInvs.filter(x=>(x.type||"stocks")==="stocks");
  const mp2Invs=filteredInvs.filter(x=>x.type==="mp2");
  const tdInvs=filteredInvs.filter(x=>x.type==="td");
  const goldInvs=filteredInvs.filter(x=>x.type==="gold");

  /* Look up a company / fund name for a ticker. The Cloudflare Worker tries
     Yahoo first (best for ETFs like VWRA, using the mapped symbol) then
     Finnhub search (good for US stocks) — that two-tier chain moved into
     worker.js so the Finnhub key never reaches the browser.                */
  const fetchName=async(id,ticker)=>{
    const t=(ticker||"").trim().toUpperCase();
    if(!t)return;
    setFetchingName(s=>({...s,[id]:true}));
    let name=null;
    if(KVSync._ready()){
      try{
        const ys=toYahooSym(t);
        const res=await fetch(`${PROXY_URL}/name?symbol=${encodeURIComponent(ys)}`,{headers:KVSync._headers()});
        if(res.ok){const j=await res.json();if(j&&j.name)name=j.name;}
      }catch(e){}
    }
    if(name)updateInv(id,{name});
    setFetchingName(s=>{const n={...s};delete n[id];return n;});
  };

  const usd=n=>formatMoney(n,{symbol:"$",decimals:2});

  const rows=stocksInvs.map(hld=>{
    const{shares,avgCost,totalCost}=holdingStats(hld.trades);
    const price=livePrice[baseKey(hld.ticker||"")]||0;
    const value=shares*price;
    const gain=value-totalCost;
    const gainPct=totalCost>0?(gain/totalCost)*100:0;
    return{...hld,shares,avgCost,totalCost,price,value,gain,gainPct};
  });
  const totVal=rows.reduce((s,r)=>s+r.value,0);
  const totCost=rows.reduce((s,r)=>s+r.totalCost,0);
  const totGain=totVal-totCost;
  const totGainPct=totCost>0?(totGain/totCost)*100:0;

  /* Non-market accounts, converted to USD (the hero's currency) for the
     combined "Total investments" line — kept visually separate from the
     stock-only cost/gain stats below it (section 9: never blend a market
     gain % with MP2/TD accrual into one misleading number). */
  const mp2TotalUsd=mp2Invs.reduce((s,hld)=>{
    const v=mp2Valuation(hld,mp2RatesByYear);
    const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
    return s+(convert?(convert(chosen,hld.currency||"PHP","USD")||0):0);
  },0);
  const tdTotalUsd=tdInvs.reduce((s,hld)=>{
    if(hld.status==="closed")return s;
    const v=tdValuation(hld);
    const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
    return s+(convert?(convert(val,hld.currency||"PHP","USD")||0):0);
  },0);
  const goldPriceUsd=livePrice[GOLD_TICKER]||0;
  const goldTotalUsd=goldInvs.reduce((s,hld)=>s+goldValuation(hld,goldPriceUsd,convert).currentValueUsd,0);
  const grandTotalUsd=totVal+mp2TotalUsd+tdTotalUsd+goldTotalUsd;

  /* Quote fetching and the portHistory snapshot deliberately use the UNFILTERED
     holdings. They're whole-portfolio facts: prices are shared, and portHistory
     feeds Home's Portfolio card. Deriving either from the filtered set would
     write a partial total into history the moment the profile isn't Combined. */
  const allStocks=invs.filter(x=>(x.type||"stocks")==="stocks");
  const allGold=invs.filter(x=>x.type==="gold");
  const refresh=async()=>{
    const tickers=[...new Set([
      ...allStocks.map(h=>(h.ticker||"").trim().toUpperCase()).filter(Boolean),
      ...(allGold.length?[GOLD_TICKER]:[]),
    ])];
    if(!tickers.length){setErr("Add a ticker symbol first.");return;}
    setLoading(true);setErr("");
    try{
      const q=await fetchQuotes(tickers);
      setLivePrice(q);
      setUpdatedAt(Date.now());
      const hit=tickers.filter(t=>q[baseKey(t)]!=null).length;
      if(!hit)setErr("No prices found. Check your Worker URL or ticker symbols.");
      else if(hit<tickers.length)setErr(`Got ${hit}/${tickers.length} prices — remaining tickers not found.`);
      else setErr("");
      // auto-capture portfolio snapshot for the history chart
      const newTotVal=allStocks.reduce((s,hld)=>{
        const{shares}=holdingStats(hld.trades);
        const p=q[baseKey(hld.ticker||"")]||livePrice[baseKey(hld.ticker||"")]||0;
        return s+shares*p;
      },0);
      if(newTotVal>0)addPortSnap(newTotVal);
    }catch(e){
      setErr(!KVSync._ready()
        ?"Live prices need your sync passphrase — enter it in Settings → Cloudflare KV Sync."
        :"Price fetch failed — check your connection, or re-enter your sync passphrase in Settings.");
    }
    setLoading(false);
  };

  const openTrade=invId=>{
    setTradeModal(invId);
    setTradeForm({type:"buy",shares:"",price:"",date:new Date().toISOString().slice(0,10)});
  };
  const submitTrade=()=>{
    if(!tradeForm.shares||!tradeForm.price)return;
    addTrade(tradeModal,{type:tradeForm.type,shares:Number(tradeForm.shares),price:Number(tradeForm.price),date:tradeForm.date});
    setTradeModal(null);
  };

  const gTone=n=>n>0?P.gr:n<0?P.red:P.sub;
  const series=projectSeries(totVal,projection.monthly,projection.years,projection.rate||8);
  const projData=series.map((v,i)=>({year:`Y${i}`,value:v}));

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      {/* hero */}
      <div className="fade-up" style={{borderRadius:18,padding:20,marginBottom:16,background:P.deep,color:"#fff",
        boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`}}>
        {/* "Investments" not "Stock portfolio" once MP2/TD are in the mix
            (section 9) — the stock-only cost/gain line below stays clearly
            separate so a market % is never blended with MP2/TD accrual. */}
        <div style={{fontSize:12,fontWeight:500,color:P.deepHi,marginBottom:4}}>Total investments (USD){profile!=="household"?` · ${owners[profile]||""}`:""}</div>
        <span key={Math.round(grandTotalUsd)} className="serif tnum num-flash" style={{fontSize:38,fontWeight:600}}>{usd(grandTotalUsd)}</span>
        {(sarRate||convert)&&(
          <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:4,fontSize:14,color:P.deepHi}}>
            {sarRate&&<span>≈ SAR {Math.round(grandTotalUsd*sarRate).toLocaleString("en-US")}</span>}
            {(()=>{const php=convert?convert(grandTotalUsd,"USD","PHP"):null;return php!=null?<span>≈ ₱{Math.round(php).toLocaleString("en-US")}</span>:null;})()}
          </div>
        )}
        {(mp2Invs.length>0||tdInvs.length>0||goldInvs.length>0)&&(
          <div className="tnum" style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:8,fontSize:12,color:P.deepHi,opacity:.85}}>
            <span>Market {usd(totVal)}</span>
            {mp2Invs.length>0&&<span>MP2 {usd(mp2TotalUsd)}{includeMp2Estimate?" (est.)":" (confirmed)"}</span>}
            {tdInvs.length>0&&<span>Time deposits {usd(tdTotalUsd)}</span>}
            {goldInvs.length>0&&<span>Gold {usd(goldTotalUsd)}</span>}
          </div>
        )}
        <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:20,fontSize:14}} className="tnum">
          <span style={{color:P.deepHi}}>Market cost {usd(totCost)}</span>
          <span style={{color:totGain>=0?"#6FC6DA":"#E89B8C",fontWeight:600}}>
            {totGain>=0?"▲":"▼"} {usd(Math.abs(totGain))} ({totGainPct.toFixed(1)}%) <span style={{opacity:.7,fontWeight:400}}>· stocks/ETF only</span>
          </span>
        </div>
      </div>

      {/* Portfolio trend (Phase 3) — range-selectable, off the new daily
          per-profile snapshots, distinct from the monthly-only chart below
          (kept as-is, off portHistory, for backward compatibility). */}
      <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 12px"}}>Portfolio trend</h3>
        <HistoryRangeChart snapshots={snapshots} profile={profile} field="investments"
          money={(v,short)=>{const u=convert?convert(v,"SAR","USD"):null;const n=u!=null?u:v;return short?`$${Math.round(n/1000)}k`:`$${Math.round(n).toLocaleString("en-US")}`;}}
          emptyText="Trend appears once 2+ days of portfolio history have been captured (captured automatically once a day)."/>
      </div>

      {/* Replaces two charts that used to sit here: "Portfolio over time" (a
          monthly net-portfolio line off portHistory — the same figure as
          "Portfolio trend" above, just from the older data source) and the
          standalone "Gold value over time". Gold is now one band of this
          composition instead of its own card, and the question this answers —
          which *kind* of investment is actually growing — is one the tab
          couldn't answer before despite already capturing the data.
          portHistory is still written on refresh and still read by Home's
          PortfolioCard, so nothing is orphaned. */}
      <div className="fade-up-1" style={{...neu(16),padding:16,marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 4px"}}>What's driving it</h3>
        <p style={{fontSize:11,color:P.faint,margin:"0 0 12px"}}>
          Portfolio value split by account type over time.
        </p>
        <CompositionRangeChart snapshots={snapshots} profile={profile}
          series={[
            {key:"byType.stocks",label:"Stocks / ETF",color:SEG[0]},
            {key:"byType.mp2",label:"Pag-IBIG MP2",color:SEG[3]},
            {key:"byType.td",label:"Time deposits",color:SEG[5]},
            {key:"byType.gold",label:"Gold",color:P.amber},
          ]}
          money={(v,short)=>{const u=convert?convert(v,"SAR","USD"):null;const n=u!=null?u:v;return short?`$${Math.round(n/1000)}k`:`$${Math.round(n).toLocaleString("en-US")}`;}}
          emptyText={profile==="household"?"Appears once 2+ days of history have been captured (captured automatically once a day).":`Appears once 2+ days of history have been captured for ${owners[profile]||"this profile"} (captured automatically once a day).`}/>
      </div>

      {/* Section 8 filters: account type / active-matured status. Owner is the
          app-wide profile switch above it, not a dropdown here. */}
      <div style={{display:"flex",justifyContent:"center",marginBottom:12}}>
        <HomeProfileToggle profile={profile} setProfile={setProfile} owners={owners}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
        <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="all">All types</option>
          {INVESTMENT_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{...neu(8),padding:"5px 8px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="all">Active + matured</option>
          <option value="active">Active only</option>
          <option value="matured">Matured/closed only</option>
        </select>
        <button onClick={()=>setShowRates(true)} className="neu-btn" style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:5,padding:"5px 10px",fontSize:12,fontWeight:500,color:P.neuSub}}>
          <I.Settings size={12}/>MP2 declared rates
        </button>
      </div>

      {/* Each section wraps its own header + card so the sticky header is
          bounded by its section, the same shape Budget's groups use. */}
      <div style={{marginBottom:16}}>
      {/* controls */}
      <div className="group-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0 8px"}}>
        <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Stocks / ETF</h2>
        <button onClick={refresh} disabled={loading} className="neu-btn"
          style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",fontSize:14,fontWeight:500,color:P.jade,opacity:loading?.6:1}}>
          <I.Refresh size={14} style={loading?{animation:"spin .9s linear infinite"}:null}/>
          {loading?"Fetching…":"Refresh prices"}
        </button>
      </div>
      {err&&<div style={{fontSize:12,color:P.wine,marginBottom:8,padding:"8px 12px",background:P.wineS,borderRadius:8}}>{err}</div>}
      {updatedAt&&!err&&<div style={{fontSize:11,color:P.neuSub,marginBottom:8}}>Prices updated {new Date(updatedAt).toLocaleTimeString()}</div>}

      {/* holdings list */}
      {(typeFilter==="all"||typeFilter==="stocks")&&
      <div style={{...neu(16),overflow:"hidden"}}>
        {rows.map(r=>{
          const trades=(r.trades||[]).filter(t=>!t.deletedAt);
          const open=expandedId===r.id;
          return(
          <div key={r.id} style={{borderBottom:"1px solid rgba(0,0,0,.06)"}}>
            {/* Collapsed summary — ticker, value and gain, the three things you
                scan a holdings list for. Everything editable (owner/type,
                delete) and every action (add trade, trade log) is behind the
                chevron, the same split Budget's category rows use. */}
            <div style={{padding:"8px 12px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <input value={r.ticker} placeholder="TICKER"
                  onChange={e=>updateInv(r.id,{ticker:e.target.value.toUpperCase()})}
                  onBlur={e=>{
                    const t=(e.target.value||"").trim().toUpperCase();
                    if(!t||r.name)return; // don't overwrite an existing name
                    fetchName(r.id,t);
                  }}
                  className="bare" style={{fontSize:14,fontWeight:700,width:66,letterSpacing:".03em",color:P.neuInk,flexShrink:0}}/>
                <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk,marginLeft:"auto"}}>{usd(r.value)}</span>
                <span className="tnum" style={{fontSize:12,fontWeight:600,color:gTone(r.gain),flexShrink:0}}>
                  {r.gain>=0?"▲":"▼"}{r.gainPct.toFixed(1)}%
                </span>
                <button onClick={()=>setExpandedId(open?null:r.id)}
                  aria-expanded={open} aria-label={open?`Hide details for ${r.ticker||"holding"}`:`Show details for ${r.ticker||"holding"}`}
                  style={{background:"transparent",border:"none",color:open?P.jade:P.neuSub,padding:8,minWidth:40,minHeight:40,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <I.Chevron size={14} style={{transform:open?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
                </button>
              </div>
            </div>

            {open&&(
              <div style={{...neuInset(0),borderRadius:0,padding:"8px 0 2px"}}>
                <div style={{padding:"0 12px 8px"}}>
                  <input value={r.name} placeholder={fetchingName[r.id]?"fetching name…":"Name"} onChange={e=>updateInv(r.id,{name:e.target.value})}
                    className="bare" style={{fontSize:13,color:P.neuSub,width:"100%",marginBottom:8}}/>
                  <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:12,fontSize:12,color:P.neuSub,marginBottom:8}} className="tnum">
                    <span>{r.shares.toFixed(4)} shares</span>
                    <span>Avg {usd(r.avgCost)}</span>
                    <span>Price {r.price>0?usd(r.price):"—"}</span>
                    <span style={{color:gTone(r.gain),fontWeight:600}}>{r.gain>=0?"▲":"▼"} {usd(Math.abs(r.gain))}</span>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
                    <select value={r.owner||"me"} onChange={e=>updateInv(r.id,{owner:e.target.value})}
                      style={{...neu(8),padding:"4px 6px",fontSize:12,border:"none",color:P.neuSub}}>
                      {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
                    </select>
                    <select value={r.type||"stocks"} onChange={e=>updateInv(r.id,{type:e.target.value})}
                      style={{...neu(8),padding:"4px 6px",fontSize:12,border:"none",color:P.neuSub}}>
                      {INVESTMENT_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
                    </select>
                    <button onClick={()=>openTrade(r.id)} className="neu-btn"
                      style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
                      <I.Plus size={12}/>Add trade
                    </button>
                    <button onClick={()=>removeInv(r.id)} className="status-pill"
                      aria-label={`Delete ${r.name||r.ticker||"holding"}`}
                      style={{marginLeft:"auto",cursor:"pointer",border:`1px solid ${P.line}`,background:"transparent",color:P.wine}}>
                      <I.Trash size={13}/>Delete
                    </button>
                  </div>
                </div>
                {/* Trade log — was a 5-column grid with 272px of fixed tracks,
                    which left the date column ~38px on a 390px phone. Two
                    compact lines instead, no fixed columns. */}
                {trades.length>0&&(
                  <div>
                    {[...trades].sort((a,b)=>a.date.localeCompare(b.date)).map(tr=>{
                      const total=(Number(tr.shares)||0)*(Number(tr.price)||0);
                      return(
                        <div key={tr.id} style={{padding:"6px 12px",borderTop:"1px solid rgba(0,0,0,.05)"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span className="tnum" style={{fontSize:12,color:P.neuSub}}>{tr.date}</span>
                            <span style={{fontSize:10,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",
                              color:tr.type==="buy"?P.jade:P.wine}}>{tr.type}</span>
                            <span className="tnum" style={{marginLeft:"auto",fontSize:13,fontWeight:600,color:P.neuInk}}>{usd(total)}</span>
                            <IconButton icon={I.X} label={`Delete trade from ${tr.date||"this holding"}`} onClick={()=>removeTrade(r.id,tr.id)} size={12} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
                          </div>
                          <div className="tnum" style={{fontSize:11,color:P.faint}}>
                            {(Number(tr.shares)||0).toFixed(4)} × {usd(tr.price)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
          );
        })}
        <button onClick={()=>addInv("stocks")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
          <I.Plus size={14}/>Add holding
        </button>
      </div>}
      </div>

      {/* MP2 accounts */}
      {(typeFilter==="all"||typeFilter==="mp2")&&(
        <div style={{marginBottom:16}}>
          <div className="group-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0 8px"}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Pag-IBIG MP2</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {mp2Invs.map(hld=>(
              <Mp2AccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv}
                mp2RatesByYear={mp2RatesByYear} includeMp2Estimate={includeMp2Estimate}
                onAddContribution={()=>setContribModal(hld.id)}
                onRemoveContribution={cid=>removeMp2Contribution(hld.id,cid)}
                onPayout={()=>setPayoutModal(hld.id)}/>
            ))}
            <button onClick={()=>addInv("mp2")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add MP2 account
            </button>
          </div>
        </div>
      )}

      {/* Time Deposit accounts */}
      {(typeFilter==="all"||typeFilter==="td")&&(
        <div style={{marginBottom:16}}>
          <div className="group-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0 8px"}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Time Deposits</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {tdInvs.map(hld=>(
              <TdAccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv} banks={banks}
                onConfirmMaturity={()=>setMaturityModal(hld.id)} onTransfer={bankId=>transferTdProceeds(hld.id,bankId)}/>
            ))}
            <button onClick={()=>addInv("td")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add Time Deposit
            </button>
          </div>
        </div>
      )}

      {/* Gold accounts (Phase 3) */}
      {(typeFilter==="all"||typeFilter==="gold")&&(
        <div style={{marginBottom:16}}>
          <div className="group-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0 8px"}}>
            <h2 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:0}}>Gold</h2>
          </div>
          <div style={{...neu(16),overflow:"hidden"}}>
            {goldInvs.map(hld=>(
              <GoldAccountCard key={hld.id} hld={hld} owners={owners} updateInv={updateInv} removeInv={removeInv} goldPriceUsd={goldPriceUsd} priceAt={updatedAt} convert={convert}/>
            ))}
            <button onClick={()=>addInv("gold")} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add Gold account
            </button>
          </div>
        </div>
      )}

      {/* projection */}
      <div style={{...neu(16),padding:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:P.neuSub,margin:"0 0 8px"}}>Growth projection ({projection.rate||8}%/yr)</h3>
        <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:10,fontSize:13}}>
          <label style={{color:P.neuSub}}>+$/mo <NumField value={projection.monthly} onCommit={v=>setProjection({monthly:v})} min={0} navGroup="projection" className="bare tnum" style={{width:80,fontWeight:600,color:P.neuInk}}/></label>
          <label style={{color:P.neuSub}}>Years <NumField value={projection.years} onCommit={v=>setProjection({years:v})} integer min={1} max={100} navGroup="projection" className="bare tnum" style={{width:56,fontWeight:600,color:P.neuInk}}/></label>
          <label style={{color:P.neuSub}}>Rate % <NumField value={projection.rate??8} onCommit={v=>setProjection({rate:v})} navGroup="projection" className="bare tnum" style={{width:48,fontWeight:600,color:P.neuInk}} min={0} max={30}/></label>
          <span className="tnum" style={{marginLeft:"auto",fontWeight:600,color:P.jade}}>→ ${series[series.length-1].toLocaleString("en-US")}</span>
        </div>
        <div style={{width:"100%",height:180}}>
          <ResponsiveContainer>
            <LineChart data={projData} margin={{top:8,right:8,bottom:0,left:-12}}>
              <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
              <XAxis dataKey="year" tick={{fontSize:11,fill:P.neuSub}}/>
              <YAxis tick={{fontSize:11,fill:P.neuSub}} tickFormatter={v=>`${Math.round(v/1000)}k`}/>
              <Tooltip formatter={v=>`$${Math.round(v).toLocaleString("en-US")}`}/>
              <Line type="monotone" dataKey="value" stroke={P.br} strokeWidth={2} dot={false}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Add trade modal */}
      {tradeModal&&(
        <Portal>
        <div className="sheet-bg" onClick={()=>setTradeModal(null)}>
          <div className="sheet" ref={tradeDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>
                Add trade — {invs.find(x=>x.id===tradeModal)?.ticker||""}
              </h3>
              <IconButton icon={I.X} label="Close" onClick={()=>setTradeModal(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              {["buy","sell"].map(t=>(
                <button key={t} onClick={()=>setTradeForm(f=>({...f,type:t}))}
                  style={{flex:1,borderRadius:10,padding:"8px 0",fontSize:14,fontWeight:600,textTransform:"capitalize",
                    background:tradeForm.type===t?(t==="buy"?P.jade:P.wine):"transparent",
                    color:tradeForm.type===t?"#fff":(t==="buy"?P.jade:P.wine),
                    border:`2px solid ${t==="buy"?P.jade:P.wine}`}}>
                  {t==="buy"?"▲ Buy":"▼ Sell"}
                </button>
              ))}
            </div>
            {/* These two were the last raw numeric inputs in the app. They
                escaped the NumField sweep because the loop wrote type={type}
                from an array rather than a literal type="number", so grepping
                for the literal never found them. Split out so Shares/Price get
                math expressions, select-on-focus and Enter-to-next like every
                other amount field; Date stays a native date picker. */}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Date</div>
              <input type="date" value={tradeForm.date} onChange={e=>setTradeForm(f=>({...f,date:e.target.value}))}
                style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
            </div>
            {[["shares","Shares"],["price","Price per share (USD)"]].map(([k,label])=>(
              <div key={k} style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>{label}</div>
                <NumField value={tradeForm[k]} onCommit={v=>setTradeForm(f=>({...f,[k]:v}))}
                  allowEmpty live min={0} navGroup="trade"
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
            ))}
            {tradeForm.shares&&tradeForm.price&&(
              <div style={{background:"rgba(0,0,0,.05)",borderRadius:10,padding:10,marginBottom:12,fontSize:13,color:P.sub}} className="tnum">
                Total: ${(Number(tradeForm.shares)*Number(tradeForm.price)).toLocaleString("en-US",{minimumFractionDigits:2})}
              </div>
            )}
            <button onClick={submitTrade}
              style={{width:"100%",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:600,
                background:tradeForm.type==="buy"?P.jade:P.wine,color:"#fff",border:"none"}}>
              Confirm {tradeForm.type==="buy"?"Purchase":"Sale"}
            </button>
          </div>
        </div>
        </Portal>
      )}

      {/* Add MP2 contribution modal */}
      {contribModal&&(
        <Mp2ContributionModal
          hld={invs.find(x=>x.id===contribModal)}
          onClose={()=>setContribModal(null)}
          onSubmit={(amount,date,note)=>{addMp2Contribution(contribModal,amount,date,note);setContribModal(null);}}/>
      )}

      {/* Record MP2 annual dividend payout modal */}
      {payoutModal&&(
        <Mp2PayoutModal
          hld={invs.find(x=>x.id===payoutModal)}
          banks={banks}
          mp2RatesByYear={mp2RatesByYear}
          onClose={()=>setPayoutModal(null)}
          onSubmit={payload=>{recordMp2Payout(payoutModal,payload);setPayoutModal(null);}}/>
      )}

      {/* Confirm Time Deposit maturity modal */}
      {maturityModal&&(
        <TdMaturityModal
          hld={invs.find(x=>x.id===maturityModal)}
          onClose={()=>setMaturityModal(null)}
          onSubmit={payload=>{confirmTdMaturity(maturityModal,payload);setMaturityModal(null);}}/>
      )}

      {/* MP2 declared dividend rates */}
      {showRates&&(
        <Mp2RatesModal
          rates={mp2Rates}
          addMp2Rate={addMp2Rate}
          updateMp2Rate={updateMp2Rate}
          removeMp2Rate={removeMp2Rate}
          onClose={()=>setShowRates(false)}/>
      )}
    </div>
  );
}

/* ── MP2 account card — no live market price, so the summary is the
   confirmed/estimated split from mp2Valuation() rather than a ticker+shares
   row. Clearly labels which number is official vs projected (section 3/4). */
function Mp2AccountCard({hld,owners,updateInv,removeInv,mp2RatesByYear,includeMp2Estimate,onAddContribution,onRemoveContribution,onPayout}){
  // `expanded` now governs the whole editing panel (see the collapsed summary
  // below); the contributions list keeps its own toggle inside it.
  const[expanded,setExpanded]=useState(false);
  const[showContribs,setShowContribs]=useState(false);
  const v=mp2Valuation(hld,mp2RatesByYear);
  const ccy=hld.currency||"PHP";
  const money=n=>formatMoney(n,{code:ccy});
  const contributions=(hld.contributions||[]).filter(c=>!c.deletedAt).sort((a,b)=>a.date.localeCompare(b.date));
  const maturityLabel=hld.maturityDate?new Date(hld.maturityDate+"T00:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"}):"—";
  const daysToMaturity=hld.maturityDate?Math.ceil((new Date(hld.maturityDate+"T00:00:00")-new Date())/86400000):null;
  const dateInvalid=hld.startDate&&hld.maturityDate&&new Date(hld.maturityDate)<=new Date(hld.startDate);
  const shownValue=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"8px 12px"}}>
      {/* Collapsed summary. Everything editable lives behind the chevron —
          same split as Budget's category rows. `dateInvalid` surfaces on the
          collapsed row so a broken account is never hidden by the collapse. */}
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{minWidth:0,flex:1,fontSize:14,fontWeight:700,color:P.neuInk,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {hld.name||"MP2 account"}
        </span>
        {dateInvalid&&<span title="Maturity date must be after the start date" style={{color:P.wine,fontSize:12,fontWeight:700,flexShrink:0}}>!</span>}
        <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk,flexShrink:0}}>{money(shownValue)}</span>
        <button onClick={()=>setExpanded(e=>!e)} aria-expanded={expanded}
          aria-label={expanded?`Hide details for ${hld.name||"MP2 account"}`:`Show details for ${hld.name||"MP2 account"}`}
          style={{background:"transparent",border:"none",color:expanded?P.jade:P.neuSub,padding:8,minWidth:40,minHeight:40,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <I.Chevron size={14} style={{transform:expanded?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
        </button>
      </div>
      <div style={{fontSize:11,color:P.faint,marginTop:-2}}>
        {investmentOwnerLabel(hld.owner||"me",owners)} · Matures {maturityLabel}
        {daysToMaturity!=null&&(daysToMaturity>0?` · ${daysToMaturity} days`:" · Matured")}
      </div>

      {expanded&&<>
      <div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0 6px"}}>
        <input value={hld.name||""} placeholder="Account name" onChange={e=>updateInv(hld.id,{name:e.target.value})}
          className="bare" style={{fontSize:14,fontWeight:700,flex:1,minWidth:0,color:P.neuInk}}/>
        <IconButton icon={I.X} label={`Delete ${hld.name||"holding"}`} onClick={()=>removeInv(hld.id)} size={15} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <select value={hld.owner||"me"} onChange={e=>updateInv(hld.id,{owner:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <input value={hld.nickname||""} placeholder="Nickname / masked ref (optional)" onChange={e=>updateInv(hld.id,{nickname:e.target.value})}
          className="bare" style={{fontSize:12,color:P.neuSub,minWidth:120,flex:1}}/>
        <select value={hld.payoutMode||"compounded"} onChange={e=>updateInv(hld.id,{payoutMode:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          <option value="compounded">5-year compounded</option>
          <option value="annual">Annual dividend payout</option>
        </select>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:8,fontSize:12,color:P.neuSub}}>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Start date
          <input type="date" value={hld.startDate||""} onChange={e=>updateInv(hld.id,{startDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Maturity date
          <input type="date" value={hld.maturityDate||""} onChange={e=>updateInv(hld.id,{maturityDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Projection rate %/yr
          <NumField value={hld.projectionRate??""} onCommit={v=>updateInv(hld.id,{projectionRate:v})} allowEmpty min={0} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
      </div>
      {dateInvalid&&(
        <div style={{fontSize:11,color:P.wine,marginBottom:8}}>Maturity date must be after the start date.</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Confirmed value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.neuInk}}>{money(v.confirmedValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Based on officially declared rates only</div>
        </div>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Estimated value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.jade}}>{money(v.estimatedValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Based on projected rate — not yet officially declared</div>
        </div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:P.neuSub}} className="tnum">
        <span>Total contributions {money(v.totalContrib)}</span>
        <span>Confirmed dividends {money(v.confirmedDividends)}</span>
        <span>Est. accrued dividends {money(v.estimatedDividends)}</span>
        {hld.payoutMode==="annual"&&v.paid>0&&<span>Paid out {money(v.paid)}</span>}
      </div>
      {/* maturity moved to the always-visible collapsed line above */}
      {v.undeclaredYears.length>0&&(
        <div style={{fontSize:11,color:P.amber||P.neuSub,marginBottom:8,padding:"6px 10px",background:"rgba(0,0,0,.04)",borderRadius:8}}>
          No official rate declared yet for {v.undeclaredYears.join(", ")} — estimated value uses the projection rate for {v.undeclaredYears.length>1?"those years":"that year"}.
        </div>
      )}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <button onClick={onAddContribution} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
          <I.Plus size={12}/>Add contribution
        </button>
        {contributions.length>0&&(
          <button onClick={()=>setShowContribs(s=>!s)} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,color:P.neuSub}}>
            {showContribs?"Hide":"Show"} {contributions.length} contribution{contributions.length!==1?"s":""}
          </button>
        )}
        {hld.payoutMode==="annual"&&(
          <button onClick={onPayout} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.br}}>
            <I.Bank size={12}/>Record annual dividend payout
          </button>
        )}
      </div>
      <textarea value={hld.notes||""} placeholder="Notes" onChange={e=>updateInv(hld.id,{notes:e.target.value})}
        style={{width:"100%",borderRadius:8,padding:"6px 8px",fontSize:12,background:"rgba(0,0,0,.03)",border:"none",color:P.neuInk,resize:"vertical",minHeight:32}}/>
      {showContribs&&contributions.length>0&&(
        <div style={{marginTop:8,borderRadius:8,overflow:"hidden",background:"rgba(0,0,0,.03)"}}>
          {contributions.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",fontSize:12,borderTop:"1px solid rgba(0,0,0,.05)"}}>
              <span className="tnum" style={{color:P.neuSub}}>{c.date}</span>
              <span className="tnum" style={{fontWeight:600,color:P.neuInk,marginLeft:"auto"}}>{money(c.amount)}</span>
              {c.note&&<span style={{color:P.neuSub,fontSize:11}}>{c.note}</span>}
              <IconButton icon={I.X} label={`Delete contribution from ${c.date}`} onClick={()=>onRemoveContribution(c.id)} size={12} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
            </div>
          ))}
        </div>
      )}
      </>}
    </div>
  );
}

/* ── Time Deposit account card — status-driven: Active shows live estimates,
   Matured/Closed shows the user-confirmed actual figures instead (section 7). */
function TdAccountCard({hld,owners,updateInv,removeInv,banks,onConfirmMaturity,onTransfer}){
  const v=tdValuation(hld);
  const ccy=hld.currency||"PHP";
  const money=n=>formatMoney(n,{code:ccy});
  const status=hld.status||"active";
  const usingConfirmed=status!=="active"&&hld.confirmedFinalAmount!=null;
  const displayValue=usingConfirmed?Number(hld.confirmedFinalAmount):v.currentEstValue;
  const[expanded,setExpanded]=useState(false);
  const dateInvalid=hld.startDate&&hld.maturityDate&&new Date(hld.maturityDate)<=new Date(hld.startDate);
  /* A matured deposit needs action (confirm / transfer proceeds), so it stays
     called out on the collapsed row rather than hiding behind the chevron. */
  const needsAction=status==="active"&&v.daysRemaining<=0;
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"8px 12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{minWidth:0,flex:1,fontSize:14,fontWeight:700,color:P.neuInk,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{hld.name||"Time deposit"}</span>
        {status!=="active"&&
          <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".04em",padding:"2px 8px",borderRadius:999,
            background:"rgba(0,0,0,.08)",color:P.neuSub,flexShrink:0}}>{status}</span>}
        {dateInvalid&&<span title="Maturity date must be after the start date" style={{color:P.wine,fontSize:12,fontWeight:700,flexShrink:0}}>!</span>}
        <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk,flexShrink:0}}>{money(displayValue)}</span>
        <button onClick={()=>setExpanded(e=>!e)} aria-expanded={expanded}
          aria-label={expanded?`Hide details for ${hld.name||"time deposit"}`:`Show details for ${hld.name||"time deposit"}`}
          style={{background:"transparent",border:"none",color:expanded?P.jade:P.neuSub,padding:8,minWidth:40,minHeight:40,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <I.Chevron size={14} style={{transform:expanded?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
        </button>
      </div>
      <div style={{fontSize:11,color:needsAction?P.wine:P.faint,marginTop:-2,fontWeight:needsAction?600:400}}>
        {investmentOwnerLabel(hld.owner||"me",owners)}
        {status==="active"
          ?(needsAction?" · Matured — confirm it":` · Matures in ${v.daysRemaining} days`)
          :hld.maturedAt?` · Matured ${new Date(hld.maturedAt).toLocaleDateString()}`:""}
      </div>

      {expanded&&<>
      <div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0 6px"}}>
        <input value={hld.name||""} placeholder="Account name" onChange={e=>updateInv(hld.id,{name:e.target.value})}
          className="bare" style={{fontSize:14,fontWeight:700,flex:1,minWidth:0,color:P.neuInk}}/>
        <IconButton icon={I.X} label={`Delete ${hld.name||"holding"}`} onClick={()=>removeInv(hld.id)} size={15} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <select value={hld.owner||"me"} onChange={e=>updateInv(hld.id,{owner:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <input value={hld.institution||""} placeholder="Bank / institution" onChange={e=>updateInv(hld.id,{institution:e.target.value})}
          className="bare" style={{fontSize:12,color:P.neuSub,minWidth:100,flex:1}}/>
        <select value={hld.compounding||"maturity"} onChange={e=>updateInv(hld.id,{compounding:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}} disabled={status!=="active"}>
          <option value="maturity">At maturity</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annually">Annually</option>
        </select>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:8,fontSize:12,color:P.neuSub}}>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Principal
          <NumField value={hld.principal??""} onCommit={v=>updateInv(hld.id,{principal:v})} allowEmpty min={0} className="tnum" style={{...neuInset(6),width:100,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Annual rate %
          <NumField value={hld.rate??""} onCommit={v=>updateInv(hld.id,{rate:v})} allowEmpty min={0} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Withholding tax %
          <NumField value={hld.taxRate??""} onCommit={v=>updateInv(hld.id,{taxRate:v})} allowEmpty min={0} max={100} className="tnum" style={{...neuInset(6),width:70,padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Start date
          <input type="date" value={hld.startDate||""} onChange={e=>updateInv(hld.id,{startDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Maturity date
          <input type="date" value={hld.maturityDate||""} onChange={e=>updateInv(hld.id,{maturityDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}} disabled={status!=="active"}/>
        </label>
      </div>
      {dateInvalid&&(
        <div style={{fontSize:11,color:P.wine,marginBottom:8}}>Maturity date must be after the start date.</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>{usingConfirmed?"Confirmed value":"Current estimated value"}</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.neuInk}}>{money(displayValue)}</div>
          {!usingConfirmed&&<div style={{fontSize:10,color:P.neuSub}}>Estimate until maturity or bank confirmation</div>}
        </div>
        <div>
          <div style={{fontSize:11,color:P.neuSub}}>Maturity value</div>
          <div className="tnum" style={{fontSize:16,fontWeight:700,color:P.jade}}>{money(v.maturityValue)}</div>
          <div style={{fontSize:10,color:P.neuSub}}>Estimate — full term</div>
        </div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:8,fontSize:12,color:P.neuSub}} className="tnum">
        <span>Gross accrued {money(v.grossAccrued)}</span>
        <span>Withholding tax {money(v.taxAmt)}</span>
        <span>Net accrued {money(v.netAccrued)}</span>
        {/* maturity status moved to the always-visible collapsed line above */}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
        {status==="active"&&v.daysRemaining<=0&&(
          <button onClick={onConfirmMaturity} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.br}}>
            <I.Bank size={12}/>Confirm matured
          </button>
        )}
        {status==="active"&&v.daysRemaining>0&&(
          <button onClick={onConfirmMaturity} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,color:P.neuSub}}>
            Confirm matured early
          </button>
        )}
        {status==="matured"&&(
          <TdTransferControl banks={banks} onTransfer={onTransfer}/>
        )}
        {status==="closed"&&hld.transferBankId&&(
          <span style={{fontSize:11,color:P.neuSub}}>Proceeds transferred to {(banks||[]).find(b=>b.id===hld.transferBankId)?.name||"bank"}</span>
        )}
      </div>
      <textarea value={hld.notes||""} placeholder="Notes" onChange={e=>updateInv(hld.id,{notes:e.target.value})}
        style={{width:"100%",borderRadius:8,padding:"6px 8px",fontSize:12,background:"rgba(0,0,0,.03)",border:"none",color:P.neuInk,resize:"vertical",minHeight:32}}/>
      </>}
    </div>
  );
}

function TdTransferControl({banks,onTransfer}){
  const[bankId,setBankId]=useState((banks&&banks[0]&&banks[0].id)||"");
  if(!banks||!banks.length)return<span style={{fontSize:11,color:P.neuSub}}>Add a bank account to transfer proceeds.</span>;
  return(
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <select value={bankId} onChange={e=>setBankId(e.target.value)} style={{...neu(8),padding:"3px 6px",fontSize:12,border:"none",color:P.neuSub}}>
        {banks.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
      </select>
      <button onClick={()=>bankId&&onTransfer(bankId)} className="neu-btn" style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",fontSize:12,fontWeight:500,color:P.jade}}>
        <I.Refresh size={12}/>Transfer proceeds
      </button>
    </div>
  );
}

/* ── Gold account card (Phase 3) — physical bars/coins only. No live market
   price series like stocks (a single spot quote, not a per-holding
   ticker/trade log), so the summary is purchase-vs-current value off
   goldValuation(), mirroring how TdAccountCard/Mp2AccountCard summarize
   rate-driven (not trade-driven) accounts. Purity is entered as karat
   (24K/22K/custom) since that's how gold is actually quoted, converted to a
   0–1 fraction only inside goldValuation(). */
function GoldAccountCard({hld,owners,updateInv,removeInv,goldPriceUsd,priceAt,convert}){
  const v=goldValuation(hld,goldPriceUsd,convert);
  const ccy=hld.currency||"USD";
  const money=(n,c=ccy)=>formatMoney(n,{code:c});
  const weightInvalid=!(Number(hld.weight)>0);
  const costInvalid=!(Number(hld.purchaseCost)>0);
  const karatInvalid=!(Number(hld.karat)>0&&Number(hld.karat)<=24);
  const setPurityType=pt=>{
    const karat=pt==="24k"?24:pt==="22k"?22:(Number(hld.karat)||18);
    updateInv(hld.id,{purityType:pt,karat});
  };
  const[expanded,setExpanded]=useState(false);
  const anyInvalid=weightInvalid||costInvalid||karatInvalid;
  const shownValue=v.hasPrice?money(convert?(convert(v.currentValueUsd,"USD",ccy)||v.currentValueUsd):v.currentValueUsd):"—";
  const weightLabel=`${Number(hld.weight)||0}${(hld.weightUnit||"g")} · ${hld.purityType==="custom"?`${Number(hld.karat)||0}K`:(hld.purityType||"24k").toUpperCase()}`;
  return(
    <div style={{borderBottom:"1px solid rgba(0,0,0,.06)",padding:"8px 12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{minWidth:0,flex:1,fontSize:14,fontWeight:700,color:P.neuInk,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{hld.name||"Gold"}</span>
        {anyInvalid&&<span title="This account has an invalid weight, karat or purchase cost" style={{color:P.wine,fontSize:12,fontWeight:700,flexShrink:0}}>!</span>}
        <span className="tnum" style={{fontSize:14,fontWeight:600,color:P.neuInk,flexShrink:0}}>{shownValue}</span>
        {v.hasPrice&&
          <span className="tnum" style={{fontSize:12,fontWeight:600,color:v.gainUsd>=0?P.jade:P.wine,flexShrink:0}}>
            {v.gainUsd>=0?"▲":"▼"}{v.gainPct.toFixed(1)}%
          </span>}
        <button onClick={()=>setExpanded(e=>!e)} aria-expanded={expanded}
          aria-label={expanded?`Hide details for ${hld.name||"gold account"}`:`Show details for ${hld.name||"gold account"}`}
          style={{background:"transparent",border:"none",color:expanded?P.jade:P.neuSub,padding:8,minWidth:40,minHeight:40,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <I.Chevron size={14} style={{transform:expanded?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
        </button>
      </div>
      <div style={{fontSize:11,color:P.faint,marginTop:-2}}>
        {investmentOwnerLabel(hld.owner||"me",owners)} · {weightLabel}
      </div>

      {expanded&&<>
      <div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0 6px"}}>
        <input value={hld.name||""} placeholder="Account name" onChange={e=>updateInv(hld.id,{name:e.target.value})}
          className="bare" style={{fontSize:14,fontWeight:700,flex:1,minWidth:0,color:P.neuInk}}/>
        <IconButton icon={I.X} label={`Delete ${hld.name||"holding"}`} onClick={()=>removeInv(hld.id)} size={15} style={{color:P.wine,opacity:.5,padding:6,minWidth:32,minHeight:32}}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <select value={hld.owner||"me"} onChange={e=>updateInv(hld.id,{owner:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {INVESTMENT_OWNERS.map(o=><option key={o} value={o}>{investmentOwnerLabel(o,owners)}</option>)}
        </select>
        <select value={ccy} onChange={e=>updateInv(hld.id,{currency:e.target.value})} style={{...neu(8),padding:"2px 6px",fontSize:12,border:"none",color:P.neuSub}}>
          {BANK_CCY.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:4,fontSize:12,color:P.neuSub}}>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Weight
          <NumField value={hld.weight??""} onCommit={v=>updateInv(hld.id,{weight:v})} allowEmpty min={0}
            className="tnum" style={{...neuInset(6),width:90,padding:"3px 6px",fontSize:12,color:weightInvalid?P.wine:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Unit
          <select value={hld.weightUnit||"g"} onChange={e=>updateInv(hld.id,{weightUnit:e.target.value})} style={{...neu(6),padding:"3px 6px",fontSize:12,border:"none",color:P.neuInk}}>
            {GOLD_UNITS.map(([v2,l])=><option key={v2} value={v2}>{l}</option>)}
          </select>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purity
          <select value={hld.purityType||"24k"} onChange={e=>setPurityType(e.target.value)} style={{...neu(6),padding:"3px 6px",fontSize:12,border:"none",color:P.neuInk}}>
            <option value="24k">24K</option>
            <option value="22k">22K</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        {hld.purityType==="custom"&&(
          <label style={{display:"flex",flexDirection:"column",gap:2}}>Karat
            {/* deliberately unclamped — clamping to 1..24 would make the
                "Karat must be between 1 and 24" message below unreachable */}
            <NumField value={hld.karat??""} onCommit={v=>updateInv(hld.id,{karat:v})} allowEmpty
              className="tnum" style={{...neuInset(6),width:60,padding:"3px 6px",fontSize:12,color:karatInvalid?P.wine:P.neuInk}}/>
          </label>
        )}
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purchase date
          <input type="date" value={hld.purchaseDate||""} onChange={e=>updateInv(hld.id,{purchaseDate:e.target.value})} className="tnum" style={{...neuInset(6),padding:"3px 6px",fontSize:12,color:P.neuInk}}/>
        </label>
        <label style={{display:"flex",flexDirection:"column",gap:2}}>Purchase cost ({ccy})
          <NumField value={hld.purchaseCost??""} onCommit={v=>updateInv(hld.id,{purchaseCost:v})} allowEmpty min={0}
