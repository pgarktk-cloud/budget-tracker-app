    financed:financedMode&&(Number(draft.count)||0)>0&&!!draft.firstDue,
    downPayment:draft.downPayment,feesOrInterest:draft.fees,
    count:draft.count,firstDueDate:draft.firstDue,
    desiredDate:draft.desiredDate}),
    [draft.price,draft.count,draft.firstDue,draft.downPayment,draft.fees,financedMode,draft.desiredDate]);

  const scenarios=useMemo(()=>projectPurchaseScenarios({...engineCtx,stack,todayStr},input),
    [engineCtx,stack,todayStr,input]);

  const historyWarning=useMemo(()=>purchaseHistoryWarning(
    bucketHistoryFor(budgetOwner,{planForMonth,expenses,payPeriods},[],[],6),fmt),
    [budgetOwner,planForMonth,expenses,payPeriods,fmt]);

  const trimCats=useMemo(()=>{
    const plan=resolvePlanForMonth(monthlyPlans,bucket,budgetOwner,activePlanId,plans).plan;
    return((plan&&plan.categories)||[]).map(c=>({id:c.id,name:c.name,effAmt:categoryEffectiveAmt(c)}))
      .filter(c=>c.effAmt>0);
  },[monthlyPlans,bucket,budgetOwner,activePlanId,plans]);
  const trimTotal=trimCats.reduce((s,c)=>s+purchaseTrimFor(trims,c.id,c.effAmt),0);

  const price=Number(draft.price)||0;
  const noIncome=thisBucket.income<=0;
  const ready=price>0;
  const product=String(draft.product||"").trim();
  const label=k=>bucketLabel(k,payPeriods,budgetOwner);

  /* ── shared field styling ──
     The date inputs need all three corrections or they will not line up with
     the NumField beside them: `fontFamily:"inherit"` (a bare date input renders
     in the UA font), an explicit height (its shadow-DOM -webkit-datetime-edit
     adds content height no padding reaches), and appearance:none in all three
     prefixes (Safari gives that shadow tree a min-content width that ignores
     width:100% and spills over the neighbour). The two-up rows wrap so they
     stack on a narrow phone rather than colliding. */
  const lab={fontSize:12,color:P.sub,marginBottom:4};
  const box={width:"100%",borderRadius:10,padding:"9px 10px",fontSize:14,fontFamily:"inherit",
    height:38,background:"rgba(0,0,0,.05)",border:"none",color:P.ink};
  const dateBox={...box,minWidth:0,WebkitAppearance:"none",MozAppearance:"none",appearance:"none"};
  const twoUp={display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"};
  const cell={flex:"1 1 150px",minWidth:0};
  const card={...neu(16),padding:14,marginBottom:16};
  const rowLine={display:"flex",justifyContent:"space-between",gap:10,fontSize:12,
    color:P.neuSub,padding:"4px 0"};

  const stackRow=(name,value,tone)=>(
    <div style={rowLine}>
      <span style={{color:tone==="muted"?P.faint:P.neuSub}}>{name}</span>
      <span className="tnum" style={{fontWeight:600,
        color:tone==="muted"?P.faint:(tone==="minus"?P.wine:P.neuInk)}}>
        {tone==="minus"?`− ${fmt(value)}`:fmt(value)}
      </span>
    </div>
  );

  const cashVerdict=purchaseVerdict(scenarios.cash,{periodAllocation:thisBucket.planned});
  const financedVerdict=purchaseVerdict(scenarios.financed,{});
  const earliestVerdict=purchaseVerdict(scenarios.earliest,{});
  /* null when no date was given — that is what switches the savings card back
     to its earliest-possible mode. */
  const sav=scenarios.savings;
  const savingsVerdict=purchaseVerdict(sav,{});

  /* The savings mirror of "Create this plan in Installments". Goals already
     ARE savings plans — target, monthly, contributions — the deadline is the
     only thing they lacked, and A2 added it. One write through the existing
     addGoal, then it is an ordinary goal and the advisor stores nothing:
     because it belongs to this owner it immediately appears in the protected
     list above, so the money it holds stops counting as spendable. */
  const startSaving=()=>{
    if(!sav||sav.mode!=="plan"||sav.shortfall<=0)return;
    /* The goal's target is the SHORTFALL, not the price. A goal targeting the
       full price would be asking you to save money you already have, and would
       read as 0% and permanently behind from the moment it was created — which
       is what the first version of this did. This mirrors the card directly:
       "starting from available X, still to find Y", and Y is the goal.

       `monthly` is computed with the GOAL's own arithmetic rather than reused
       from the card. The advisor counts pay-period buckets and the goal counts
       whole calendar months, so the two legitimately differ by one near a
       boundary; seeding the card's figure produced a goal that called itself
       behind the instant it appeared. Deriving it through goalDeadlineStatus
       means the created goal is self-consistent, and if the person edits the
       monthly afterwards the goal will tell them honestly. */
    const target=Math.round(sav.shortfall);
    const probe=goalDeadlineStatus({target,contributions:[],monthly:0,
      deadline:draft.desiredDate},todayStr);
    const monthly=Math.ceil(probe?probe.requiredMonthly:sav.requiredPerBucket);
    const id=addGoal(budgetOwner,{
      name:product||"Purchase",
      type:"tech",
      target,monthly,
      deadline:draft.desiredDate||null,
    });
    if(id&&setTab)setTab("goals");
  };

  const openCreate=()=>{
    const f=scenarios.financed;
    setCreateSheet({
      name:product||"Purchase",
      provider:(draft.method==="cash"?"other":draft.method),
      purchaseDate:draft.desiredDate||todayStr,
      originalAmount:f?f.financedTotal:price,
      includeInBudget:true,
      notes:f&&f.upfront>0?`Down payment ${fmt(f.upfront)} paid up front`:"",
      firstDueDate:draft.firstDue||"",
      count:Number(draft.count)||4,
    });
  };

  return(
    <div>
      <OwnerToggle owner={budgetOwner} setOwner={setBudgetOwner} owners={owners}/>

      {/* ── What are you buying? ── */}
      <section style={card}>
        <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:12}}>What are you thinking of buying?</div>

        <div style={{marginBottom:12}}>
          <div style={lab}>Product</div>
          <input value={draft.product} onChange={e=>set({product:e.target.value})}
            placeholder="e.g. MacBook Air" style={box}/>
        </div>

        <div style={twoUp}>
          <div style={cell}>
            <div style={lab}>Price ({cur})</div>
            <NumField value={draft.price} onCommit={v=>set({price:v})}
              allowEmpty min={0} live className="tnum" style={box}/>
          </div>
          <div style={cell}>
            <div style={lab}>When would you want it?</div>
            <input type="date" value={draft.desiredDate||""}
              onChange={e=>set({desiredDate:e.target.value})}
              aria-label="Desired purchase date" style={dateBox}/>
          </div>
        </div>

        <div style={twoUp}>
          <div style={cell}>
            <div style={lab}>How would you pay?</div>
            <select value={draft.method} onChange={e=>{
                const m=e.target.value;
                set({method:m,firstDue:draft.firstDue
                  ||(m!=="cash"?(installmentProvider(m).bnpl?todayStr:addMonthsISO(todayStr,1)):"")});
              }} style={box}>
              <option value="cash">Cash — pay in full</option>
              {INSTALLMENT_PROVIDERS.map(p=><option key={p.key} value={p.key}>{p.label}</option>)}
            </select>
          </div>
          {financedMode&&
            <div style={cell}>
              <div style={lab}>Down payment ({cur})</div>
              <NumField value={draft.downPayment} onCommit={v=>set({downPayment:v})}
                allowEmpty min={0} max={price||undefined} live className="tnum" style={box}/>
            </div>}
        </div>

        {financedMode&&
          <div style={twoUp}>
            <div style={cell}>
              <div style={lab}>Number of payments</div>
              <NumField value={draft.count} onCommit={v=>set({count:v})}
                integer min={1} max={60} live className="tnum" style={box}/>
            </div>
            <div style={cell}>
              <div style={lab}>First payment due</div>
              <input type="date" value={draft.firstDue||""}
                onChange={e=>set({firstDue:e.target.value})}
                aria-label="First payment due date" style={dateBox}/>
            </div>
          </div>}

        {financedMode&&
          <div style={twoUp}>
            <div style={cell}>
              <div style={lab}>Fees or interest ({cur})</div>
              <NumField value={draft.fees} onCommit={v=>set({fees:v})}
                allowEmpty min={0} live className="tnum" style={box}/>
            </div>
          </div>}
      </section>

      {/* Income of zero is the fresh-device skeleton, not a budget. Every
          scenario would divide a purchase into a plan with no money in it. */}
      {noIncome&&
        <section style={card}>
          <Verdict tone="flat">Nothing to project against yet</Verdict>
          <div style={{fontSize:12,color:P.neuSub,lineHeight:1.6}}>
            The plan {owners[budgetOwner]} has for {label(bucket)} carries no income, so there is
            no headroom to project against. Set an income in Budget and this tab will
            work from it.
          </div>
        </section>}

      {!noIncome&&<>
        {/* ── Available cash, itemised ── */}
        <section style={card}>
          <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:8}}>Cash you could actually use</div>
          {/* "Accounts · Me" rather than a possessive — the default owner
              label is literally "Me", and "Me's accounts" is not a sentence. */}
          {stackRow(`Accounts · ${owners[budgetOwner]}`,stack.banks)}
          {/* One line per reserved account, naming it. A single "withheld"
              total would be the bare number this card exists to avoid. */}
          {stack.reserved.map(r=>
            <div key={r.id} style={{...rowLine,alignItems:"flex-start"}}>
              <span style={{flex:1,minWidth:0}}>
                {r.name} — emergency fund
                {/* Releasable, because "won't spend it" is a policy, not a
                    capability. This is what the two-concept split is FOR: you
                    can ask what raiding it would cost without changing the
                    account. Releasing does not release a protected goal living
                    in the same account — that has its own toggle below. */}
                <button onClick={()=>setDraft(d=>{
                    const next=new Set(d.releasedBankIds||[]);
                    if(next.has(r.id))next.delete(r.id);else next.add(r.id);
                    return{...d,releasedBankIds:[...next]};
                  })}
                  style={{display:"block",background:"transparent",border:"none",padding:"4px 0",
                    minHeight:32,color:r.released?"#E07B2A":P.jade,fontSize:11,fontWeight:600,
                    textAlign:"left"}}>
                  {r.released
                    ?"✓ released for this purchase — tap to protect again"
                    :"Spend it on this purchase"}
                </button>
                {r.released&&r.held>0&&
                  <span style={{display:"block",fontSize:11,color:P.faint}}>
                    {fmt(r.held)} still held back by a goal kept in this account.
                  </span>}
              </span>
              <span className="tnum" style={{fontWeight:600,flexShrink:0,
                color:r.held>0?P.wine:P.faint}}>
                {r.held>0?`− ${fmt(r.held)}`:`(${fmt(r.value)} freed)`}
              </span>
            </div>)}
          {stack.protectedGoals>0&&
            stackRow(stack.unlinkedProtectedCount===1?"1 protected goal"
              :`${stack.unlinkedProtectedCount} protected goals`,stack.protectedGoals,"minus")}
          <div style={{...rowLine,borderTop:`1px solid ${P.line}`,marginTop:6,paddingTop:8,
            fontSize:14,color:P.neuInk}}>
            <span style={{fontWeight:600}}>Available</span>
            <span className="tnum" style={{fontWeight:700,
              color:stack.available>=0?P.neuInk:P.wine}}>{fmt(stack.available)}</span>
          </div>

          {/* ── Excluded, and said so ──
              An account silently missing from a total is the surprise these
              lines exist to prevent. The unreachable ones are tappable: a
              purchase you would genuinely make in that country can count that
              money, for this purchase only. */}
          {stack.inaccessible.map(a=>{
            const on=includedBankIds.indexOf(a.id)>=0;
            return(
              <div key={a.id} style={{...rowLine,alignItems:"flex-start",color:P.faint,fontSize:11}}>
                <span style={{flex:1,minWidth:0}}>
                  {a.name} — can't reach
                  {a.value==null
                    ?<span style={{display:"block"}}>
                       Can't convert {a.currency} right now, so it can't be included.
                     </span>
                    :<button onClick={()=>setDraft(d=>{
                        const next=new Set(d.includedBankIds||[]);
                        if(next.has(a.id))next.delete(a.id);else next.add(a.id);
                        return{...d,includedBankIds:[...next]};
                      })}
                      style={{display:"block",background:"transparent",border:"none",padding:"4px 0",
                        minHeight:32,color:on?P.grD:P.jade,fontSize:11,fontWeight:600,textAlign:"left"}}>
                      {on?"✓ counted for this purchase — tap to exclude":"Include for this purchase"}
                    </button>}
                </span>
                <span className="tnum" style={{flexShrink:0}}>
                  {a.currency} {(Number(a.rawValue)||0).toLocaleString("en-US",{maximumFractionDigits:0})}
                  {a.value!=null&&a.currency!==cur&&
                    <span style={{display:"block"}}>≈ {fmt(a.value)}</span>}
                </span>
              </div>
            );
          })}
          {/* The stale-rate caveat the cached FX makes possible — a converted
              figure has to say how old the rate behind it is. */}
          {stack.inaccessible.some(a=>a.value!=null&&a.currency!==cur)&&ratesStaleDays!=null&&ratesStaleDays>0&&
            <div style={{fontSize:11,color:P.faint,marginTop:2}}>
              Converted at the last exchange rate this device fetched
              ({ratesStaleDays} day{ratesStaleDays===1?"":"s"} ago).
            </div>}
          {stack.joint>0&&
            <div style={{...rowLine,color:P.faint,fontSize:11}}>
              <span>Joint accounts — not counted</span>
              <span className="tnum">{fmt(stack.joint)}</span>
            </div>}
          {stack.notCountedGoals>0&&
            <div style={{fontSize:11,color:P.faint,marginTop:6,lineHeight:1.5}}>
              {stack.notCountedGoals} protected goal{stack.notCountedGoals===1?"":"s"} sit
              {stack.notCountedGoals===1?"s":""} in an account not counted above, so
              {stack.notCountedGoals===1?" it is":" they are"} not subtracted again.
            </div>}
          {stack.unconverted>0&&
            <div style={{fontSize:11,color:P.faint,marginTop:6}}>
              {stack.unconverted} account{stack.unconverted===1?"":"s"} in another currency
              couldn't be converted and {stack.unconverted===1?"is":"are"} excluded.
            </div>}
          <div style={{fontSize:11,color:P.faint,marginTop:8,lineHeight:1.5}}>
            Goal balances sit inside these accounts, so protecting a goal subtracts it here —
            once, even when the goal names the account it lives in. Money set aside for bills
            isn't taken off automatically: mark the account it sits in on the Banks tab.
          </div>
        </section>

        {!ready&&
          <section style={card}>
            <div style={{fontSize:12,color:P.neuSub}}>Enter a price above and the three
              scenarios appear here.</div>
          </section>}

        {ready&&<>
          {historyWarning&&
            <section style={{...card,padding:"12px 14px"}}>
              <div style={{fontSize:12,color:"#E07B2A",lineHeight:1.6}}>{historyWarning}</div>
            </section>}

          {/* ── 1 · Cash ── */}
          <section style={card}>
            <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:8}}>Buy it now, in cash</div>
            <Verdict tone={cashVerdict}>
              {!scenarios.cash.feasible
                ?`Short by ${fmt(price-stack.available)}`
                :cashVerdict==="warn"
                  ?`Affordable, but it leaves less than one period's spending behind`
                  :`Affordable — ${fmt(scenarios.cash.remainingAfter)} still available afterwards`}
            </Verdict>
            <div style={rowLine}><span>Price</span>
              <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(price)}</span></div>
            <div style={rowLine}><span>Available now</span>
              <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(stack.available)}</span></div>
            <div style={rowLine}><span>Left afterwards</span>
              <span className="tnum" style={{fontWeight:600,
                color:scenarios.cash.remainingAfter>=0?P.neuInk:P.wine}}>
                {fmt(scenarios.cash.remainingAfter)}</span></div>
          </section>

          {/* ── 2 · The entered plan ── */}
          <section style={card}>
            <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:8}}>
              Buy it now, on {financedMode?installmentProvider(draft.method).label:"a payment plan"}
            </div>
            {!scenarios.financed
              ?<div style={{fontSize:12,color:P.neuSub,lineHeight:1.6}}>
                 Pick a provider, a number of payments and a first due date above to see what
                 the instalments would do to each period.
               </div>
              :<>
                <Verdict tone={financedVerdict}>
                  {!scenarios.financed.upfrontFeasible
                    ?`The ${fmt(scenarios.financed.upfront)} down payment is more than you have available`
                    :scenarios.financed.deficits.length>0
                      ?`${scenarios.financed.deficits.length} period${scenarios.financed.deficits.length===1?"":"s"} would go over budget`
                      :financedVerdict==="warn"
                        ?"It fits, but one period is left with almost nothing spare"
                        :"Every affected period still balances"}
                </Verdict>
                <div style={rowLine}><span>Up front today</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(scenarios.financed.upfront)}</span></div>
                <div style={rowLine}><span>{scenarios.financed.count} payments of about</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(scenarios.financed.perPayment)}</span></div>
                {scenarios.financed.fees>0&&
                  <div style={rowLine}><span>Fees or interest</span>
                    <span className="tnum" style={{fontWeight:600,color:P.wine}}>{fmt(scenarios.financed.fees)}</span></div>}
                <div style={{fontSize:11,color:P.faint,textTransform:"uppercase",letterSpacing:".08em",
                  margin:"12px 0 4px"}}>Each affected period</div>
                <div style={{...neuInset(12),padding:"4px 0"}}>
                  {scenarios.financed.buckets.map(b=>(
                    <div key={b.key} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px"}}>
                      <span style={{flex:1,minWidth:0,fontSize:12,color:P.neuSub,overflow:"hidden",
                        textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label(b.key)}</span>
                      <span className="tnum" style={{fontSize:11,color:P.faint,flexShrink:0}}>
                        −{fmt(b.obligation)}</span>
                      <span className="tnum" style={{fontSize:13,fontWeight:600,flexShrink:0,minWidth:88,
                        textAlign:"right",color:b.headroom<0?P.wine
                          :(b.income>0&&b.headroom<b.income*(PURCHASE_THIN_PCT/100)?"#E07B2A":P.neuInk)}}>
                        {fmt(b.headroom)}</span>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:11,color:P.faint,marginTop:6}}>
                  Headroom left in each period after the plan, existing instalments and this one.
                </div>
              </>}
          </section>

          {/* ── 3 · Save up for it ──
              ONE card with two modes. With a date it answers "can I make it,
              and what per period?"; without one it falls back to the
              earliest-possible answer. Two separate cards would say nearly the
              same thing twice in different words. */}
          <section style={card}>
            <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:8}}>
              {sav&&sav.mode==="plan"?`Save up for it by ${instShortDate(draft.desiredDate)}`:"Save up for it instead"}
            </div>

            {sav&&sav.mode==="plan"&&<>
              <Verdict tone={savingsVerdict}>
                {sav.shortfall<=0
                  ?"You can already afford it out of cash"
                  :!sav.feasible
                    ?`Not on this plan — ${fmt(sav.capacity)} spare before then, ${fmt(sav.shortfall)} needed`
                    :savingsVerdict==="warn"
                      ?`Possible, but one period can't spare ${fmt(sav.requiredPerBucket)}`
                      :`On track — set aside ${fmt(sav.requiredPerBucket)} per period`}
              </Verdict>
              {sav.shortfall>0&&<>
                <div style={rowLine}><span>Starting from available</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(stack.available)}</span></div>
                <div style={rowLine}><span>Still to find</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(sav.shortfall)}</span></div>
                <div style={rowLine}><span>Periods until then</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{sav.n}</span></div>
                <div style={rowLine}><span>Set aside per period</span>
                  <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(sav.requiredPerBucket)}</span></div>
                <div style={rowLine}><span>Spare per period, tightest</span>
                  <span className="tnum" style={{fontWeight:600,
                    color:sav.tightest&&sav.tightest.headroom>=sav.requiredPerBucket?P.neuInk:"#E07B2A"}}>
                    {sav.tightest?fmt(sav.tightest.headroom):"—"}</span></div>
              </>}
              <div style={{fontSize:11,color:P.faint,marginTop:8,lineHeight:1.5}}>
                Counts only what each period has left over after the plan and existing
                instalments. Saving more in one period to cover a leaner one is allowed —
                the tightest period is shown so you know when that's required.
              </div>
            </>}

            {sav&&sav.mode==="now"&&
              <>
                <Verdict tone={savingsVerdict}>
                  {sav.shortfall<=0?"You can already afford it out of cash":"That date is already here"}
                </Verdict>
                <div style={{fontSize:12,color:P.neuSub,lineHeight:1.6}}>
                  {sav.shortfall<=0
                    ?"Nothing left to save for — see the cash answer above."
                    :`There is no period left to spread ${fmt(sav.shortfall)} over. Either pick a later
                      date or look at the cash and payment-plan answers above.`}
                </div>
              </>}

            {sav&&sav.mode==="beyondHorizon"&&
              <>
                <Verdict tone="bad">That date is more than two years out</Verdict>
                <div style={{fontSize:12,color:P.neuSub,lineHeight:1.6}}>
                  This tab projects {PURCHASE_HORIZON_BUCKETS} periods ahead and won't guess
                  past that.
                </div>
              </>}

            {/* No date given — the original earliest-possible answer. */}
            {!sav&&(!scenarios.earliest
              ?<>
                <Verdict tone="bad">Not reachable within two years</Verdict>
                <div style={{fontSize:12,color:P.neuSub,lineHeight:1.6}}>
                  At the current plan, {PURCHASE_HORIZON_BUCKETS} periods of leftover money still
                  don't reach {fmt(price)}. Trimming a category below, or a bigger change to the
                  plan, is what would move this.
                </div>
              </>
              :<>
                <Verdict tone={earliestVerdict}>
                  {scenarios.earliest.n===0
                    ?"You can already afford it out of cash"
                    :`Affordable by ${label(scenarios.earliest.bucketKey)}`}
                </Verdict>
                {scenarios.earliest.n>0&&<>
                  <div style={rowLine}><span>Periods to wait</span>
                    <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{scenarios.earliest.n}</span></div>
                  <div style={rowLine}><span>Still to find</span>
                    <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(scenarios.earliest.shortfall)}</span></div>
                  <div style={rowLine}><span>Per period</span>
                    <span className="tnum" style={{fontWeight:600,color:P.neuInk}}>{fmt(scenarios.earliest.requiredPerBucket)}</span></div>
                </>}
                <div style={{fontSize:11,color:P.faint,marginTop:8,lineHeight:1.5}}>
                  Set a date above and this becomes "can I make it?" instead. Counts only what
                  each period has left over — a plan that finishes along the way frees its money
                  up automatically.
                </div>
              </>)}

            {/* The savings mirror of "Create this plan in Installments". Goals
                already ARE savings plans; the deadline is what they lacked. */}
            {sav&&sav.mode==="plan"&&sav.shortfall>0&&
              <button onClick={startSaving}
                style={{width:"100%",borderRadius:12,padding:"12px 0",marginTop:12,
                  fontSize:13,fontWeight:600,border:`1px solid ${P.line}`,
                  background:"transparent",color:P.grD}}>
                Start saving the {fmt(sav.shortfall)}
              </button>}
          </section>

          {/* ── Levers ── */}
          <section style={card}>
            <div style={{fontSize:13,fontWeight:700,color:P.neuInk,marginBottom:4}}>What if…</div>
            <div style={{fontSize:11,color:P.faint,marginBottom:12,lineHeight:1.5}}>
              These change the projections only. Nothing here edits your budget or your goals.
            </div>

            {myGoals.length>0&&<>
              <div style={{fontSize:12,color:P.neuSub,marginBottom:6}}>Goals available to spend</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                {myGoals.map(g=>{
                  const on=!unprotected.has(g.id);
                  return(
                    <button key={g.id} aria-pressed={!on} className="status-pill"
                      onClick={()=>setDraft(d=>{
                        const next=new Set(d.unprotectedGoalIds||[]);
                        if(next.has(g.id))next.delete(g.id);else next.add(g.id);
                        return{...d,unprotectedGoalIds:[...next]};
                      })}
                      style={{border:`1px solid ${on?P.line:P.gr}`,cursor:"pointer",
                        background:on?"transparent":P.grS,color:on?P.sub:P.grD}}>
                      {on?"Protected":"Spendable"} · {g.name||"Goal"}
                    </button>
                  );
                })}
              </div>
            </>}

            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <button onClick={()=>setShowTrims(true)}
                style={{borderRadius:999,padding:"8px 14px",minHeight:40,fontSize:12,fontWeight:600,
                  border:`1px solid ${P.line}`,background:"transparent",color:P.sub}}>
                Trim categories
              </button>
              {trimTotal>0&&
                <span className="tnum" style={{fontSize:12,color:P.grD,fontWeight:600}}>
                  −{fmt(trimTotal)} per period assumed
                </span>}
              {trimTotal>0&&
                <button onClick={()=>set({trims:{}})}
                  style={{background:"transparent",border:"none",color:P.wine,fontSize:12,
                    fontWeight:600,padding:"8px 4px",minHeight:40}}>Clear</button>}
            </div>
          </section>

          {/* ── The one durable exit ── */}
          {financedMode&&
            <button onClick={openCreate}
              style={{width:"100%",borderRadius:14,padding:"14px 0",fontSize:14,fontWeight:600,
                border:"none",background:P.gr,color:"#fff",marginBottom:24}}>
              Create this plan in Installments
            </button>}
        </>}
      </>}

      {showTrims&&
        <PurchaseTrimSheet categories={trimCats} trims={trims} cur={cur} fmt={fmt}
          setTrim={(id,v)=>setDraft(d=>({...d,trims:{...(d.trims||{}),[id]:Number(v)||0}}))}
          onClose={()=>setShowTrims(false)}/>}

      {createSheet&&
        <InstallmentEditSheet prefill={createSheet} payments={[]}
          owner={budgetOwner} ownerLabel={owners[budgetOwner]||budgetOwner}
          cur={cur} fmt={fmt}
          onClose={()=>setCreateSheet(null)}
          onSave={({plan,rows})=>{
            const id=addInstallment(plan,rows);
            setCreateSheet(null);
            openInstallment(id);
          }}/>}
    </div>
  );
}

/* ── OVERVIEW VIEW ── */
/* ── TARGETS / FORECAST VIEW ──────────────────────────────────────────────
   Trend-based capital forecasting. Unlike Goals (manual-contribution pots),
   a Target's progress is derived live: pick which budget categories count as
   "savings rate" toward it, and it projects your current invested + cash
   balances forward at two separately-editable conservative growth rates. ── */
function TargetsView({targets,addTarget,updateTarget,removeTarget,plans,activePlanId,owners,invSar,banksSar,fmt}){
  const[openId,setOpenId]=useState(null);
  useScrollLock(!!openId);
  const[catPickerId,setCatPickerId]=useState(null);
  useScrollLock(!!catPickerId);
  const openDlgRef=useDialogA11y(()=>setOpenId(null),!!openId);
  const catPickerDlgRef=useDialogA11y(()=>setCatPickerId(null),!!catPickerId);

  // only the CURRENT plan per owner — `plans` holds one entry per month
  // (carry-forward history), so looping over all of them would repeat
  // every category once per past month
  const allCats=useMemo(()=>{
    const activeIds=new Set([activePlanId?.me,activePlanId?.wife].filter(Boolean));
    const out=[];
    (plans||[]).filter(p=>activeIds.has(p.id)).forEach(p=>(p.categories||[]).forEach(c=>{
      out.push({id:c.id,name:c.name,owner:p.owner,amount:Number(c.amount)||0});
    }));
    return out;
  },[plans,activePlanId]);

  const open=targets.find(t=>t.id===openId);
  const catPickerTarget=targets.find(t=>t.id===catPickerId);

  // sum a target's tagged categories into invest vs cash monthly flows
  const splitMonthly=t=>{
    const alloc=t.categoryAlloc||{};
    let monthlyInvest=0,monthlyCash=0,count=0;
    allCats.forEach(c=>{
      const dest=alloc[c.id];
      if(dest==="invest"){monthlyInvest+=c.amount;count++;}
      else if(dest==="cash"){monthlyCash+=c.amount;count++;}
    });
    return{monthlyInvest,monthlyCash,count};
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div style={{fontSize:12,color:P.neuSub,marginBottom:14,lineHeight:1.5}}>
        Pick which budget categories count toward each target, and tag each one
        as going into stocks (grows at the invest rate) or cash/time deposit
        (grows at the cash rate). A GoTrade contribution and a Seabank
        contribution compound differently — this keeps them separate.
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(min(160px,100%),1fr))",gap:10}}>
        {targets.map(t=>{
          const{monthlyInvest,monthlyCash,count}=splitMonthly(t);
          const{hitMonth}=computeTargetForecast(invSar,banksSar,monthlyInvest,monthlyCash,t.investRate,t.cashRate,t.targetAmount);
          const current=invSar+banksSar;
          const pct=t.targetAmount>0?Math.min(100,(current/t.targetAmount)*100):0;
          return(
            <button key={t.id} onClick={()=>setOpenId(t.id)}
              style={{textAlign:"left",padding:14,minHeight:150,...neu(16),
                display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:8,height:8,borderRadius:999,background:t.color||P.jade}}/>
                <span style={{fontSize:13,fontWeight:600,color:P.neuInk}}>{t.name}</span>
              </div>
              <div style={{fontSize:11,color:P.neuSub}}>Target</div>
              <div className="tnum" style={{fontSize:15,fontWeight:700,color:P.neuInk}}>{fmt(t.targetAmount)}</div>
              <div style={{...neuInset(999),height:8,overflow:"hidden",marginTop:2}}>
                <div className="liquid-fill" style={{height:"100%",width:`${pct}%`,background:liquidFillBg(t.color||P.jade)}}/>
              </div>
              <div style={{fontSize:11,color:P.neuSub,marginTop:"auto"}}>
                {count===0?"No categories selected"
                  :hitMonth===null?"30+ yrs at current pace"
                  :hitMonth===0?"Target already reached"
                  :`~${hitMonth} mo (${(hitMonth/12).toFixed(1)} yrs) to go`}
              </div>
            </button>
          );
        })}
        <button onClick={addTarget} className="neu-btn"
          style={{borderRadius:16,padding:14,minHeight:150,color:P.jade,
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,fontSize:13,fontWeight:500}}>
          <I.Plus size={20}/>Add target
        </button>
      </div>

      {/* ── Detail / edit modal ── */}
      {open&&(()=>{
        const{monthlyInvest,monthlyCash,count}=splitMonthly(open);
        const{series,hitMonth}=computeTargetForecast(invSar,banksSar,monthlyInvest,monthlyCash,open.investRate,open.cashRate,open.targetAmount);
        return(
        <Portal>
        <div className="sheet-bg" onClick={()=>setOpenId(null)}>
          <div className="sheet" ref={openDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <input value={open.name} onChange={e=>updateTarget(open.id,{name:e.target.value})}
                className="bare" style={{fontSize:17,fontWeight:700,flex:1,color:P.ink}}/>
              <IconButton icon={I.X} label="Close" onClick={()=>setOpenId(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>

            <div style={{display:"flex",gap:12,marginBottom:12,fontSize:13}}>
              <label style={{flex:1,color:P.sub}}>Target amount (SAR)
                <NumField value={open.targetAmount} onCommit={v=>updateTarget(open.id,{targetAmount:v})} min={0}
                  className="bare tnum" style={{display:"block",width:"100%",fontWeight:600,fontSize:15,marginTop:2,color:P.ink}}/>
              </label>
              <label style={{flex:1,color:P.sub}}>Target date
                <input type="date" value={open.targetDate||""} onChange={e=>updateTarget(open.id,{targetDate:e.target.value})}
                  className="bare tnum" style={{display:"block",width:"100%",fontWeight:600,fontSize:13,marginTop:2,color:P.ink}}/>
              </label>
            </div>

            <div style={{display:"flex",gap:12,marginBottom:14,fontSize:13}}>
              <label style={{flex:1,color:P.sub}}>Invest rate %/yr
                <NumField value={open.investRate} onCommit={v=>updateTarget(open.id,{investRate:v})} min={0}
                  className="bare tnum" style={{display:"block",width:"100%",fontWeight:600,fontSize:15,marginTop:2,color:P.ink}}/>
              </label>
              <label style={{flex:1,color:P.sub}}>Cash rate %/yr
                <NumField value={open.cashRate} onCommit={v=>updateTarget(open.id,{cashRate:v})} min={0}
                  className="bare tnum" style={{display:"block",width:"100%",fontWeight:600,fontSize:15,marginTop:2,color:P.ink}}/>
              </label>
            </div>

            <div style={{marginBottom:14}}>
              <button onClick={()=>setCatPickerId(open.id)}
                style={{width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:10,background:"rgba(0,0,0,.05)",border:"none",fontSize:13}}>
                <div style={{color:P.sub,marginBottom:6}}>Savings-rate categories ({count} selected)</div>
                <div style={{display:"flex",gap:16}}>
                  <div>
                    <div style={{fontSize:10,color:P.faint}}>→ Stocks</div>
                    <div className="tnum" style={{fontWeight:600,color:P.ink}}>{fmt(monthlyInvest)}/mo</div>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:P.faint}}>→ Cash</div>
                    <div className="tnum" style={{fontWeight:600,color:P.ink}}>{fmt(monthlyCash)}/mo</div>
                  </div>
                </div>
              </button>
            </div>

            <div style={{borderRadius:14,padding:12,background:"rgba(0,0,0,.05)",marginBottom:14}}>
              <div style={{fontSize:12,color:P.sub,marginBottom:6}}>
                {count===0?"Select at least one category to project a timeline."
                  :hitMonth===null?"Target isn't reached within 30 years at this pace — raise the monthly rate or the growth rates."
                  :`Projected: ~${hitMonth} months (${(hitMonth/12).toFixed(1)} years) from today.`}
              </div>
              <div style={{width:"100%",height:150}}>
                <ResponsiveContainer>
                  <LineChart data={series} margin={{top:8,right:8,bottom:0,left:-16}}>
                    <CartesianGrid strokeDasharray="3 3" stroke={P.line}/>
                    <XAxis dataKey="m" tick={{fontSize:10,fill:P.faint}} tickFormatter={v=>`${Math.round(v/12)}y`}/>
                    <YAxis tick={{fontSize:10,fill:P.faint}} tickFormatter={v=>`${Math.round(v/1000)}k`}/>
                    <Tooltip formatter={v=>fmt(v)} labelFormatter={v=>`Month ${v}`}/>
                    <Line type="monotone" dataKey="total" stroke={open.color||P.jade} strokeWidth={2} dot={false}/>
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>

            <button onClick={()=>{removeTarget(open.id);setOpenId(null);}}
              style={{width:"100%",padding:"10px",borderRadius:10,background:"transparent",border:`1px solid ${P.line}`,color:P.red,fontSize:13,fontWeight:500}}>
              <I.Trash size={13} style={{marginRight:6,verticalAlign:-2}}/>Delete target
            </button>
          </div>
        </div>
        </Portal>
        );
      })()}

      {/* ── Category picker modal ── */}
      {catPickerTarget&&(
        <Portal>
        <div className="sheet-bg" onClick={()=>setCatPickerId(null)}>
          <div className="sheet" ref={catPickerDlgRef} role="dialog" aria-modal="true" tabIndex={-1} onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600,color:P.ink}}>Savings-rate categories</h3>
              <IconButton icon={I.X} label="Close" onClick={()=>setCatPickerId(null)} size={18} style={{color:P.sub,padding:0,minWidth:0,minHeight:0}}/>
            </div>
            <div style={{fontSize:11,color:P.faint,marginBottom:10,lineHeight:1.4}}>
              Tag each category as going into stocks or cash — it changes which
              growth rate applies to that money.
            </div>
            <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
              {["me","wife"].map(ok=>{
                const cats=allCats.filter(c=>c.owner===ok);
                if(!cats.length)return null;
                return(
                  <div key={ok} style={{marginBottom:6}}>
                    <div style={{fontSize:11,fontWeight:600,color:P.faint,textTransform:"uppercase",margin:"6px 2px"}}>{owners?.[ok]||ok}</div>
                    {cats.map(c=>{
                      const alloc=catPickerTarget.categoryAlloc||{};
                      const dest=alloc[c.id]||null;
                      const setDest=d=>{
                        const next={...alloc};
                        if(d===null)delete next[c.id];else next[c.id]=d;
                        updateTarget(catPickerTarget.id,{categoryAlloc:next});
                      };
                      const segBtn=(val,label)=>(
                        <button onClick={()=>setDest(dest===val?null:val)}
                          style={{padding:"4px 9px",borderRadius:7,fontSize:11,fontWeight:600,border:"none",
                            background:dest===val?(val==="invest"?P.jade:P.br):"rgba(0,0,0,.05)",
                            color:dest===val?"#fff":P.sub}}>
                          {label}
                        </button>
                      );
                      return(
                        <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 6px",fontSize:13}}>
                          <span style={{flex:1,color:P.ink,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                          <span className="tnum" style={{color:P.faint,fontSize:11}}>{fmt(c.amount)}</span>
                          <div style={{display:"flex",gap:4}}>
                            {segBtn("invest","Stocks")}
                            {segBtn("cash","Cash")}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        </Portal>
      )}
    </div>
  );
}

/* ── SETTINGS MODAL ── */
/* ── Conflict resolution — shown when local and cloud data disagree and this
   device has unsynced changes. Blocking modal by design: the person must
   pick a side rather than risk either copy being silently lost. ── */
/* Shared renderer for a buildConflictDiff() result — used by both
   ConflictModal (local-vs-cloud) and PendingChangesModal (local-vs-last-
   synced-snapshot). `buckets` maps which diff field goes under which
   title/color for this context. */
const diffRowStyle={fontSize:12,color:P.sub,padding:"2px 0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"};
function DiffBucket({title,items,color,bg}){
  if(!items.length)return null;
  return(
    <div style={{marginBottom:8}}>
      <div style={{fontSize:11,fontWeight:700,color,background:bg,display:"inline-block",padding:"2px 7px",borderRadius:6,marginBottom:4}}>
        {title} ({items.length})
      </div>
      {items.slice(0,5).map((t,i)=><div key={i} style={diffRowStyle}>• {t}</div>)}
      {items.length>5&&<div style={diffRowStyle}>+{items.length-5} more</div>}
    </div>
  );
}
function DiffCollectionsList({diff,buckets}){
  return diff.map(c=>(
    <div key={c.key} style={{marginBottom:6}}>
      <div style={{fontSize:12,fontWeight:600,color:P.ink,marginBottom:2}}>{c.label}</div>
      {buckets.map(b=><DiffBucket key={b.field} title={b.title} items={c[b.field]} color={b.color} bg={b.bg}/>)}
    </div>
  ));
}

function ConflictModal({conflict,onUseCloud,onSaveLocalToCloud}){
  useScrollLock(true); // only ever mounted while open
  const dlgRef=useDialogA11y(null); // no dismiss action — user must choose an option below
  const remoteWhen=conflict.remoteSavedAt?new Date(conflict.remoteSavedAt).toLocaleString():"an unknown time";
  /* Who saved it. The server echoes back whatever X-Device-Id the writing
     device sent — a friendly label if that device has one, otherwise an opaque
     id. Strip the id when a label is present: "Charlene's phone" is the useful
     part, and the raw id is only there to keep two unlabelled devices apart. */
  const rawWriter=conflict.remoteWriter||"";
  const writerLabel=rawWriter&&rawWriter!==deviceTag()
    ?rawWriter.replace(/\s*\([^)]*\)\s*$/,"")||rawWriter
    :"";
  const savedByLine=writerLabel?`saved by ${writerLabel}`:"last saved";
  const choiceBtn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink,textAlign:"left",display:"block"};
  const diff=useMemo(()=>buildConflictDiff(conflict.local,conflict.remote),[conflict]);
  const totalOnlyLocal=diff.reduce((s,c)=>s+c.onlyLocal.length,0);
  const totalOnlyRemote=diff.reduce((s,c)=>s+c.onlyRemote.length,0);
  const totalChanged=diff.reduce((s,c)=>s+c.changed.length,0);
  const buckets=[
    {field:"onlyLocal",title:"Only on this device",color:P.gr,bg:P.grS},
    {field:"onlyRemote",title:"Only on cloud",color:P.br,bg:P.brS},
    {field:"changed",title:"Changed on both",color:P.amber,bg:P.amberS},
  ];
  return(
    <div className="sheet-bg">
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 8px",fontWeight:600}}>Cloud and local data differ</h3>
        <p style={{fontSize:13,color:P.sub,lineHeight:1.5,marginBottom:10}}>
          This device has changes that haven't been saved to the cloud, and the cloud copy — {savedByLine} {remoteWhen} — is different. Choose which one to keep.
          {totalOnlyLocal>0&&totalOnlyRemote>0&&totalChanged===0&&
            <><br/><span style={{color:P.faint}}>You each added different things — nothing was edited on both sides, so whichever you pick, the other side's additions are the only thing at stake.</span></>}
        </p>
        {diff.length>0?(
          <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:P.faint,textTransform:"uppercase",letterSpacing:.4,marginBottom:6}}>What's different</div>
            <DiffCollectionsList diff={diff} buckets={buckets}/>
            <div style={{fontSize:11,color:P.faint,marginTop:4}}>
              "Use Cloud" would drop the {totalOnlyLocal} item{totalOnlyLocal===1?"":"s"} only on this device. "Save Local to Cloud" would drop the {totalOnlyRemote} item{totalOnlyRemote===1?"":"s"} only on cloud{totalChanged?`, and pick this device's version for the ${totalChanged} changed item${totalChanged===1?"":"s"}`:""}.
            </div>
          </div>
        ):(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>No record-level differences found — this is likely just a settings/timestamp mismatch.</p>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={onUseCloud} style={choiceBtn}>
            Use Cloud<div style={{fontWeight:400,fontSize:12,color:P.faint,marginTop:2}}>Replace this device's data with the cloud copy. A backup of your local data is kept.</div>
          </button>
          <button onClick={onSaveLocalToCloud} style={{...choiceBtn,border:"none",background:P.gr,color:"#fff"}}>
            Save Local to Cloud<div style={{fontWeight:400,fontSize:12,opacity:.85,marginTop:2}}>Overwrite the cloud copy with this device's data.</div>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── First connection: this device has records, the cloud has a document ─────
   Deliberately NOT ConflictModal. That one describes two devices that diverged
   from a shared baseline and asks which side wins; here there is no shared
   baseline at all — this device has simply never synced. Saying "cloud and
   local data differ" would imply a common history that doesn't exist, and its
   "Save Local to Cloud" button OVERWRITES, which from a device that has never
   seen the cloud would silently destroy the other phone's entire dataset.

   So the destructive option isn't offered. "Keep mine" merges — the union of
   two documents that share nothing loses neither side — and it says how many
   records it is about to add, because the person is being asked to change a
   document they cannot see from here. */
function FirstConnectSheet({info,onUseCloud,onMerge,onLater}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onLater);
  const choiceBtn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink,textAlign:"left",display:"block",width:"100%"};
  /* Counts from the existing validator summary rather than a bespoke reduce,
     so it can't drift from what the rest of the app calls a record. */
  const mine=useMemo(()=>{
    try{const r=validateBackup(info.local);return r.summary?r.summary.counts:null;}catch(e){return null;}
  },[info]);
  const theirs=useMemo(()=>{
    try{const r=validateBackup(info.remote);return r.summary?r.summary.counts:null;}catch(e){return null;}
  },[info]);
  const phrase=c=>{
    if(!c)return "";
    const parts=[[c.transactions,"transaction"],[c.goals,"goal"],[c.investments,"investment"],
      [c.banks,"account"],[c.assets,"asset"],[c.installments,"installment"]]
      .filter(([n])=>n>0).map(([n,w])=>`${n} ${w}${n===1?"":"s"}`);
    if(!parts.length)return "no records";
    return parts.slice(0,3).join(", ")+(parts.length>3?"…":"");
  };
  return(
    <div className="sheet-bg">
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380,maxHeight:"85dvh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 8px",fontWeight:600}}>This device has data of its own</h3>
        <p style={{fontSize:13,color:P.sub,lineHeight:1.5,marginBottom:12}}>
          You've just connected, and there's already a document in the cloud. This device has never synced before, so nothing has been sent or changed yet — choose what should happen.
        </p>
        <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:14,fontSize:12,lineHeight:1.7}}>
          <div><span style={{color:P.faint}}>On this device: </span><strong>{phrase(mine)}</strong></div>
          <div><span style={{color:P.faint}}>In the cloud: </span><strong>{phrase(theirs)}</strong></div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={onUseCloud} style={choiceBtn}>
            Use the cloud copy<div style={{fontWeight:400,fontSize:12,color:P.faint,marginTop:2}}>Take the cloud document exactly. A backup of this device's data is kept, so this is undoable.</div>
          </button>
          <button onClick={onMerge} style={{...choiceBtn,border:"none",background:P.gr,color:"#fff"}}>
            Merge and upload<div style={{fontWeight:400,fontSize:12,opacity:.85,marginTop:2}}>Adds this device's {phrase(mine)} to the cloud. Nothing already in the cloud is removed.</div>
          </button>
          <button onClick={onLater} style={{...choiceBtn,background:"transparent",border:"none",color:P.faint,fontWeight:500,fontSize:13,textAlign:"center"}}>
            Decide later — keep this device offline for now
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Pending-changes viewer — diffs the current local data against the last
   full snapshot known to be in sync with the cloud (cached locally, so this
   works offline / without a round-trip). Answers "what exactly is the N in
   the Save to Cloud badge?" before the person commits to syncing. ── */
function PendingChangesModal({data,onClose,onSaveToCloud}){
  useScrollLock(true); // only ever mounted while open
  const dlgRef=useDialogA11y(onClose);
  const snapshot=useMemo(()=>loadSyncedSnapshot(),[]);
  const diff=useMemo(()=>snapshot?buildConflictDiff(data,snapshot):[],[data,snapshot]);
  // Derived (auto:true history/snapshot) rows are counted separately: they no
  // longer mark the doc dirty on their own, but they're still in the payload,
  // so if a save IS happening they go up with it. Saying so explicitly is the
  // whole point — the old copy claimed "no changes" while the badge showed a
  // number, because this data was invisible to the diff.
  const{derived}=useMemo(()=>countPendingChanges(data,snapshot),[data,snapshot]);
  const buckets=[
    {field:"onlyLocal",title:"Added since last sync",color:P.gr,bg:P.grS},
    {field:"onlyRemote",title:"Removed since last sync",color:P.wine,bg:P.wineS},
    {field:"changed",title:"Edited since last sync",color:P.amber,bg:P.amberS},
  ];
  const derivedNote=derived>0&&(
    <p style={{fontSize:11,color:P.faint,marginBottom:14,lineHeight:1.5}}>
      Plus {derived} automatic {derived===1?"entry":"entries"} (net-worth / portfolio history recomputed from the latest prices). These don't trigger a cloud save on their own — they ride along the next time you save something you actually changed.
    </p>
  );
  const btn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink,display:"flex",alignItems:"center",justifyContent:"center",gap:6};
  return(
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 8px",fontWeight:600}}>What's pending</h3>
        {!snapshot?(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>No cached copy of the last synced state yet on this device — this'll be available after the next successful sync.</p>
        ):diff.length>0?(
          <React.Fragment>
            <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:derived>0?8:14}}>
              <DiffCollectionsList diff={diff} buckets={buckets}/>
            </div>
            {derivedNote}
          </React.Fragment>
        ):(
          <React.Fragment>
            <p style={{fontSize:12,color:P.faint,marginBottom:derived>0?8:14}}>Nothing you've edited is waiting to be saved.</p>
            {derivedNote}
          </React.Fragment>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={onSaveToCloud} style={{...btn,border:"none",background:P.gr,color:"#fff"}}>
            <I.Cloud size={14}/>Save to Cloud
          </button>
          <button onClick={onClose} style={btn}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ── Recently Deleted — everything that's been soft-deleted (deletedAt set)
   but not yet purged, grouped by type, with one-tap restore. Only surfaces
   top-level records (transactions, goals, investments, etc.) — nested items
   like a single contribution or trade are covered by the undo toast at the
   moment you delete them instead of showing up here individually. ── */
function RecentlyDeletedModal({data,restoreRecord,retentionDays,onClose}){
  useScrollLock(true); // only ever mounted while open
  const dlgRef=useDialogA11y(onClose);
  const groups=useMemo(()=>CONFLICT_COLLECTIONS.filter(c=>!HIDE_FROM_RECENTLY_DELETED.has(c.key)).map(c=>({
    key:c.key,label:c.label,
    items:conflictArr(c,data).filter(x=>x.deletedAt).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt)).map(x=>({id:x.id,label:c.nameOf(x),deletedAt:x.deletedAt})),
  })).filter(g=>g.items.length),[data]);
  const btn={borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink};
  return(
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1} style={{maxWidth:380,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <h3 style={{margin:"0 0 4px",fontWeight:600}}>Recently Deleted</h3>
        <p style={{fontSize:11,color:P.faint,marginBottom:14}}>
          Kept for {retentionDays} days before being permanently removed.
        </p>
        {groups.length===0?(
          <p style={{fontSize:12,color:P.faint,marginBottom:14}}>Nothing here right now.</p>
        ):(
          <div style={{marginBottom:14}}>
            {groups.map(g=>(
              <div key={g.key} style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:P.faint,textTransform:"uppercase",letterSpacing:.4,marginBottom:6}}>{g.label}</div>
                {g.items.map(it=>(
                  <div key={it.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"8px 0",borderBottom:`1px solid ${P.line}`}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:13,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.label}</div>
                      <div style={{fontSize:11,color:P.faint}}>Deleted {new Date(it.deletedAt).toLocaleDateString()}</div>
                    </div>
                    <button onClick={()=>restoreRecord(g.key,it.id)}
                      style={{flexShrink:0,borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:600,border:`1px solid ${P.grS}`,background:P.grS,color:P.grD}}>
                      Restore
                    </button>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
        <button onClick={onClose} style={{...btn,width:"100%"}}>Close</button>
      </div>
    </div>
  );
}

/* ── Import preview ────────────────────────────────────────────────────────
   Shown between choosing a file and replacing anything. Two jobs: prove the
   file is the one the user meant (date, owners, record counts), and state the
   two consequences that aren't obvious — the whole dataset goes, and the
   safety copy it leaves behind is a single slot.

   Portalled: rendered from inside SettingsModal, which is itself inside no
   TabPane — but the rule is cheap to honour and this sheet may later be opened
   from elsewhere. */
function ImportPreviewSheet({report,fileName,onConfirm,onCancel,partnerName}){
  useScrollLock(true);
  const dlgRef=useDialogA11y(onCancel);
  const{ok,errors,warnings,summary}=report;
  const row={display:"flex",justifyContent:"space-between",gap:12,fontSize:12,padding:"3px 0"};
  const counts=summary?[
    ["Transactions",summary.counts.transactions],
    ["Budget plans",summary.counts.plans],
    ["Planned months",summary.counts.monthlyPlans],
    ["Goals",summary.counts.goals],
    ["Investments",summary.counts.investments],
    ["Bank accounts",summary.counts.banks],
    ["Assets & liabilities",summary.counts.assets],
    ["Installment plans",summary.counts.installments],
    ["Household expenses",summary.counts.householdExpenses],
  ].filter(([,n])=>n>0):[];
  return(
    <Portal>
      <div className="sheet-bg" onClick={onCancel}>
        <div className="sheet" ref={dlgRef} role="dialog" aria-modal="true" tabIndex={-1}
          style={{maxWidth:400,maxHeight:"85dvh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
          <h3 style={{margin:"0 0 4px",fontWeight:600}}>{ok?"Import this backup?":"That file can't be imported"}</h3>
          <div style={{fontSize:11,color:P.faint,marginBottom:12,wordBreak:"break-all"}}>{fileName}</div>

          {!ok&&
            <div style={{background:P.amberS,borderRadius:10,padding:"10px 12px",marginBottom:14}}>
              <div style={{fontSize:12,color:P.amber,fontWeight:600,marginBottom:6}}>What's wrong with it</div>
              {errors.slice(0,6).map((e,i)=><div key={i} style={{fontSize:12,color:P.sub,lineHeight:1.5}}>• {e}</div>)}
              {errors.length>6&&<div style={{fontSize:11,color:P.faint,marginTop:4}}>…and {errors.length-6} more.</div>}
              <div style={{fontSize:11,color:P.faint,marginTop:8,lineHeight:1.5}}>Nothing on this device has been touched.</div>
            </div>}

          {ok&&summary&&
            <div style={{background:P.sf,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
              <div style={row}><span style={{color:P.faint}}>Backed up</span>
                <b>{summary.savedAt?new Date(summary.savedAt).toLocaleString():"date not recorded"}</b></div>
              {summary.owners&&(summary.owners.me||summary.owners.wife)&&
                <div style={row}><span style={{color:P.faint}}>People</span>
                  <b>{[summary.owners.me,summary.owners.wife].filter(Boolean).join(" & ")}</b></div>}
              {summary.currency&&<div style={row}><span style={{color:P.faint}}>Currency</span><b>{summary.currency}</b></div>}
              <div style={{borderTop:`1px solid ${P.line}`,margin:"8px 0"}}/>
              {counts.length
                ?counts.map(([label,n])=><div key={label} style={row}><span style={{color:P.faint}}>{label}</span><b>{n}</b></div>)
                :<div style={{fontSize:12,color:P.amber}}>This backup contains no records at all.</div>}
              {summary.deleted>0&&
                <div style={{fontSize:11,color:P.faint,marginTop:6}}>Plus {summary.deleted} deleted {summary.deleted===1?"item":"items"} still recoverable from Recently Deleted.</div>}
            </div>}

          {ok&&warnings.length>0&&
            <div style={{fontSize:11,color:P.faint,lineHeight:1.5,marginBottom:12}}>
              {warnings.map((w,i)=><div key={i}>• {w}</div>)}
            </div>}

          {ok&&
            <div style={{background:P.amberS,borderRadius:10,padding:"10px 12px",marginBottom:14,fontSize:12,color:P.sub,lineHeight:1.6}}>
              <b style={{color:P.amber}}>This replaces everything on this device</b> — every transaction, budget, goal and account is swapped for what's in the file.
              <br/><br/>
              It stays on this device until you tap <b>Save to Cloud</b>, so {partnerName||"your partner"} won't see it before you've had a look.
              <br/><br/>
              Your current data is kept as a restorable copy in Settings. The last <b>two</b> are kept, so importing twice by mistake still leaves you a way back.
            </div>}

          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {ok&&
              <button onClick={onConfirm} style={{borderRadius:10,padding:"11px 14px",fontSize:14,fontWeight:600,border:"none",background:P.red,color:"#fff"}}>
                Replace all data on this device
              </button>}
            <button onClick={onCancel} style={{borderRadius:10,padding:"11px 14px",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,background:P.sfA,color:P.ink}}>
              {ok?"Cancel":"Close"}
            </button>
          </div>
        </div>
      </div>
    </Portal>
  );
}

/* Hidden-by-default troubleshooting panel — a person shouldn't need this to
   use the app day to day, so it's collapsed behind a disclosure rather than
   always shown alongside the plain-language status pill above it. */
function SyncDiagnostics({localRev,cloudRev,lastCloudSavedAt,lastCloudPulledAt,hasUnsyncedChanges,changesSinceSave,syncStatus,isOnline,lastSyncError}){
  const[open,setOpen]=useState(false);
  const row=(label,value)=>(
    <div style={{display:"flex",justifyContent:"space-between",gap:8,padding:"4px 0",borderBottom:`1px solid ${P.line}`,fontSize:12}}>
      <span style={{color:P.faint}}>{label}</span>
      <span style={{color:P.ink,fontFamily:"monospace",textAlign:"right"}}>{value}</span>
    </div>
  );
  return(
    <div style={{marginTop:10}}>
      <button onClick={()=>setOpen(o=>!o)}
        style={{background:"transparent",border:"none",padding:0,fontSize:11,fontWeight:600,color:P.faint,textDecoration:"underline",cursor:"pointer"}}>
        {open?"Hide":"Show"} Sync Diagnostics
      </button>
      {open&&
        <div style={{marginTop:8,padding:"8px 10px",background:P.sfA,borderRadius:10}}>
          {row("Local revision",localRev??"—")}
          {row("Cloud revision",cloudRev??"—")}
          {row("Last cloud upload",lastCloudSavedAt?lastCloudSavedAt.toLocaleString():"never")}
          {row("Last cloud download",lastCloudPulledAt?lastCloudPulledAt.toLocaleString():"never")}
          {row("Pending changes",hasUnsyncedChanges?`yes (${changesSinceSave||0})`:"no")}
          {row("Sync status",syncStatus||"idle")}
          {row("Network",isOnline?"online":"offline")}
          {lastSyncError&&row("Last error",lastSyncError)}
        </div>}
    </div>
  );
}

function SettingsModal({data,setData,onClose,theme,pullFromCloud,saveToCloud,kvReady,setSyncTokenSet,hasUnsyncedChanges,lastCloudSavedAt,lastCloudPulledAt,changesSinceSave,syncOp,preCloudSlots,restorePreCloudBackup,importBackup,importPending,openProfilePicker,setOwnerName,owners,toggleTheme,setPayPeriod,setActualStart,onViewPendingChanges,onOpenRecentlyDeleted,localRev,cloudRev,syncStatus,isOnline,lastSyncError}){
  useScrollLock(true); // only ever mounted while open
  const dlgRef=useDialogA11y(onClose);
  const[confirm,setConfirm]=useState(false);

  const[msg,setMsg]=useState("");
  const[ppSheet,setPpSheet]=useState(null);    // {owner,periodKey,heading}
  const[ppConfirm,setPpConfirm]=useState(null);// {owner,count,turningOn?,repay?,apply}
  const fileRef=useRef(null);
  /* ── Sync passphrase (per device) ──────────────────────────────────────
     `pass` is the draft in the input; it is never persisted until the Worker
     has actually accepted it, so a typo can't leave this device holding a
     credential that will only fail later, silently, in a background save. */
  const[pass,setPass]=useState("");
  const[passState,setPassState]=useState("idle"); // idle | checking | bad | error
  const[forgetConfirm,setForgetConfirm]=useState(false);
  const[devLabel,setDevLabel]=useState(()=>getDeviceLabel());
  const connectPass=async()=>{
    const typed=pass.trim();
    if(!typed)return;
    setPassState("checking");
    try{
      // /sync/meta is the cheapest authenticated endpoint — it transfers no
      // dataset, so it's the right thing to test a passphrase against.
      const r=await fetch(`${PROXY_URL}/sync/meta`,{headers:{"X-Sync-Token":typed}});
      if(r.ok){setSyncToken(typed);setSyncTokenSet(true);setPass("");setPassState("idle");flash("Connected ✓");return;}
      setPassState(r.status===401?"bad":"error");
    }catch(e){setPassState("error");}
  };
  const forgetPass=()=>{
    setSyncToken("");setSyncTokenSet(false);setForgetConfirm(false);
    setPass("");setPassState("idle");flash("Passphrase forgotten on this device");
  };
  /* How many of an owner's logged expenses would land in a different bucket
     under `trial`. The same comparison SalaryArrivedSheet shows before moving a
     boundary, but through bucketKeyFor rather than periodKeyFor, because
     toggling pay periods switches the whole keying scheme rather than nudging
     one edge. Purely a preview — nothing on the expense records changes. */
  const countRebucketed=(owner,trial)=>{
    const all=data.payPeriods||{};
    const alt={...all,[owner]:trial};
    return(data.expenses||[]).filter(e=>e.date&&!e.deletedAt&&(e.owner||"me")===owner
      &&bucketKeyFor(e.date,all,owner)!==bucketKeyFor(e.date,alt,owner)).length;
  };
  const[versionCheck,setVersionCheck]=useState({status:"checking"});
  useEffect(()=>{
    let cancelled=false;
    fetch(`./version.json?t=${Date.now()}`,{cache:"no-store"})
      .then(r=>r.ok?r.json():Promise.reject(new Error("bad response")))
      .then(j=>{if(!cancelled)setVersionCheck({status:"ok",version:j.version,buildId:j.buildId});})
      .catch(()=>{if(!cancelled)setVersionCheck({status:"error"});});
    return()=>{cancelled=true;};
  },[]);
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),2500);};
  const download=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`allocation-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    flash("Backup downloaded ✓");
  };
  /* Choosing a file no longer changes anything. It validates, then opens the
     preview; only the button in there replaces data. The input is reset on
     every path so picking the SAME file twice still fires a change event. */
  const MAX_BACKUP_BYTES=8*1024*1024;
  const[importPreview,setImportPreview]=useState(null); // {report,fileName,raw}
  const resetFileInput=()=>{if(fileRef.current)fileRef.current.value="";};
  const onFile=e=>{
    const f=e.target.files&&e.target.files[0];

    if(!f)return;
    if(f.size>MAX_BACKUP_BYTES){
      setImportPreview({fileName:f.name,raw:null,
        report:{ok:false,warnings:[],summary:null,
          errors:[`This file is ${(f.size/1048576).toFixed(1)} MB. A backup from this app is far smaller, so this is almost certainly something else.`]}});
      return;
    }
    if(f.size===0){
      setImportPreview({fileName:f.name,raw:null,report:{ok:false,warnings:[],summary:null,errors:["This file is empty."]}});
      return;
    }
    const r=new FileReader();
    r.onerror=()=>setImportPreview({fileName:f.name,raw:null,
      report:{ok:false,warnings:[],summary:null,errors:["This file couldn't be read from your device."]}});
    r.onload=()=>{
      let parsed;

      catch(err){
        setImportPreview({fileName:f.name,raw:null,
          report:{ok:false,warnings:[],summary:null,errors:["This isn't a readable backup file — the contents aren't valid JSON."]}});
