          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8,color:P.gr}}>
              <I.Wallet size={18} sw={2.2}/>
              <span style={{fontSize:12,fontWeight:600,letterSpacing:".18em",textTransform:"uppercase"}}>Where'dItGo</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              {syncMsg&&<span style={{fontSize:11,color:P.sub}}>{syncMsg}</span>}
              <button onClick={toggleTheme} title={theme==="dark"?"Switch to light mode":"Switch to dark mode"}
                style={{display:"flex",alignItems:"center",justifyContent:"center",borderRadius:999,padding:8,color:P.sub,background:"transparent",border:"none"}}>
                {theme==="dark"?<I.Sun size={17}/>:<I.Moon size={17}/>}
              </button>
              <button onClick={()=>pullFromCloud()} disabled={syncOp==="pull"}
                title={kvReady?"Pull from Cloud":"Configure Worker URL and sync token to enable sync"}
                style={{display:"flex",alignItems:"center",justifyContent:"center",borderRadius:999,padding:8,
                  color:P.sub,background:"transparent",border:`1px solid ${P.line}`,opacity:kvReady?1:.5}}>
                <I.Refresh size={14} style={syncOp==="pull"?{animation:"spin .9s linear infinite"}:null}/>
              </button>

/* ══════════════════════════════════════════════════════════════════════════
   HOME — dashboard landing tab. Purely presentational: every figure here is
   either read straight off App()'s already-computed values (netWorth,
   banksSar/invSar/assetSar/liabSar, holdingStats, goal contributions) or a
   thin per-owner reslice of the same raw collections (banks/plans/goals).
   It never recomputes financial logic and never mutates data except through
   the exact same mutator functions (addContribution) the rest of the app
   already uses. Deliberately split into small sibling components so a
   future card (Wishlist, Subscriptions, Achievements) is just one more
   <XCard/> added to the list at the bottom of HomeView. ─────────────────── */

/* `overrides` lets individual cards dial padding up or down without
   inventing a new shadow/radius — every Home card still goes through neu(20).
   marginBottom is 0 by default: HomeView's .home-grid `gap` now handles
   spacing between cards (grid replaced the old single-column stack), so a
   card only needs its own marginBottom if it's rendered somewhere the grid
   doesn't apply (kept overridable for that reason). */
function homeCardStyle(overrides){return{...neu(20),padding:18,marginBottom:0,...overrides};}

/* Turns a livePriceAt/ratesAt timestamp (+ online state) into the small
   muted freshness line shown on Home's live-priced/FX-derived cards. Never
   surfaces raw technical errors — those stay on Investments/Currency where
   they already are. */
function freshnessText(ts,isOnline){
  if(isOnline===false)return "Offline · showing cached values";
  if(!ts)return null;
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<1)return "Updated just now";
  if(mins<60)return `Updated ${mins} minute${mins===1?"":"s"} ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return `Updated ${hrs} hour${hrs===1?"":"s"} ago`;
  const d=new Date(ts);
  return `Using last available prices from ${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
}

/* Minimal inline circular-progress ring (stroke-dasharray technique) — no
   charting library needed for something this small. */
function ProgressRing({pct,size=60,stroke=7,color,track}){
  const p=Math.max(0,Math.min(100,pct||0));
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const off=c*(1-p/100);
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track||P.sfA} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color||P.gr} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset .4s ease"}}/>
    </svg>
  );
}

/* Subtle sparkline off portHistory/history — hidden axes/grid/tooltip on
   purpose, this is a glance-level trend indicator, not a chart to read
   values off. `area:true` renders a filled AreaChart instead of a bare line
   (used by Portfolio/Hero for a slightly richer look) — same Recharts import,
   no new dependency. `height` lets Hero use a taller trend than Portfolio's
   compact one. */
function Sparkline({data,color,area,height=40,fill}){
  if(!data||data.length<2)return null;
  const c=color||P.gr;
  const gid=`spark-${c.replace(/[^a-zA-Z0-9]/g,"")}`;
  /* Y-domain is the real fix for the "nearly flat decorative line": Recharts
     defaults a numeric axis to start at 0, so a series like 10,650 → 10,718
     gets squashed into an almost-horizontal band near the top of the plot.
     Pinning the domain to the data's own min/max (with a small pad so the
     stroke never clips against the edges) makes genuine month-to-month
     movement legible without inventing or rescaling a single value. */
  const vals=data.map(d=>d.value).filter(v=>Number.isFinite(v));
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=(hi-lo)*0.12||Math.abs(hi||1)*0.02||1;
  const domain=[lo-pad,hi+pad];
  const wrap=fill
    ?{width:"100%",marginTop:8,minHeight:height}
    :{width:"100%",height,marginTop:8};
  return(
    <div className={`${fill?"home-fill ":""}home-spark`} style={wrap}>
      <ResponsiveContainer width="100%" height="100%">
        {area?(
          <AreaChart data={data} margin={{top:2,right:0,bottom:0,left:0}}>
            <defs>
              <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={c} stopOpacity={0.28}/>
                <stop offset="100%" stopColor={c} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <YAxis hide domain={domain}/>
            <Area type="monotone" dataKey="value" stroke={c} strokeWidth={2} fill={`url(#${gid})`} dot={false} isAnimationActive={false}/>
          </AreaChart>
        ):(
          <LineChart data={data} margin={{top:2,right:0,bottom:0,left:0}}>
            <YAxis hide domain={domain}/>
            <Line type="monotone" dataKey="value" stroke={c} strokeWidth={2} dot={false} isAnimationActive={false}/>
          </LineChart>
        )}
      </ResponsiveContainer>
    </div>
  );
}

/* ── Range-selectable history chart (Phase 3 §7/§8) ────────────────────────
   Shared by both Net Worth and Portfolio-over-time sections rather than two
   near-identical components — the only thing that differs between them is
   which numeric field to plot and how to format it. Reads from
   data.snapshots (profile-filtered, passed in already bucketed by date), not
   the older monthly `history`/`portHistory` — those keep serving the
   MoM-stat/manual-entry features they always did (see decisions.md).
   Bucketing per range (§7) + memoization (§8) both live in
   bucketSnapshotsForRange(), a pure function outside this component so
   useMemo can cheaply skip recompute when neither the snapshot array nor the
   selected range changed. Derived chart points are only ever held in this
   component's own memo — never written back to `data` (§11: only raw
   snapshots persist). */
const RANGES=["1W","1M","3M","1Y","MAX"];
function HistoryRangeChart({snapshots,profile,field,money,color,height=200,emptyText}){
  const[range,setRange]=useState("1M");
  const profileSnaps=useMemo(()=>(snapshots||[]).filter(s=>s.profile===profile).sort((a,b)=>a.date.localeCompare(b.date)),[snapshots,profile]);
  const bucketed=useMemo(()=>bucketSnapshotsForRange(profileSnaps,range),[profileSnaps,range]);
  const fmtLabel=(dateStr,r)=>{
    const d=new Date(dateStr+"T00:00:00");
    if(r==="MAX")return d.toLocaleDateString("en-US",{month:"short",year:"2-digit"});
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  };
  // `field` may be a dot path (e.g. "byType.gold") to reach into snapshot.byType
  const at=s=>field.split(".").reduce((o,k)=>o==null?undefined:o[k],s);
  const pts=bucketed.map(s=>({label:fmtLabel(s.date,range),value:at(s)}));
  const first=bucketed[0],last=bucketed[bucketed.length-1];
  const firstVal=first?at(first):undefined,lastVal=last?at(last):undefined;
  const pctChange=first&&firstVal?((lastVal-firstVal)/Math.abs(firstVal))*100:null;
  const trending=last&&first?lastVal>=firstVal:true;
  const chartColor=color||(trending?P.jade:P.wine);
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:4}}>
          {RANGES.map(r=>(
            <button key={r} onClick={()=>setRange(r)} className={range===r?"":"neu-btn"}
              style={{borderRadius:999,padding:"3px 10px",fontSize:12,border:"none",
                ...(range===r?{background:P.jade,color:"#fff"}:{color:P.neuSub})}}>{r}</button>
          ))}
        </div>
        {pctChange!=null&&(
          <span className="tnum" style={{fontSize:13,fontWeight:600,color:trending?P.jade:P.wine}}>
            {trending?"▲":"▼"} {Math.abs(pctChange).toFixed(1)}%
          </span>
        )}
      </div>
      {pts.length>=2?(
        <div style={{width:"100%",height}}>
          <ResponsiveContainer>
            <LineChart data={pts} margin={{top:8,right:8,bottom:0,left:-12}}>
              <CartesianGrid strokeDasharray="3 3" stroke={P.neuLo} opacity={.4}/>
              <XAxis dataKey="label" tick={{fontSize:10,fill:P.neuSub}}/>
              <YAxis tick={{fontSize:10,fill:P.neuSub}} tickFormatter={v=>money(v,true)}/>
              <Tooltip formatter={v=>money(v)}/>
              <Line type="monotone" dataKey="value" stroke={chartColor} strokeWidth={2.5} dot={pts.length<=40?{r:3,fill:chartColor}:false}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      ):(
        <p style={{fontSize:13,color:P.neuSub}}>{emptyText||"Not enough history yet for this range."}</p>
      )}
    </div>
  );
}

/* 3-way Me / Wife / Household pill switcher for Home only. The underlying
   data model only ever has 2 profiles ("me"/"wife" — see PROFILE_KEY); there
   is no literal "household" profile anywhere else in the app. "Household" is
   a Home-only aggregate view (assumption documented at the top of this
   file's task): picking Me/Wife here also drives budgetOwner (so it stays
   consistent with every other tab), picking Household is purely local to
   this card and doesn't change budgetOwner. */
function HomeProfileToggle({profile,setProfile,owners}){
  const opts=[["me",owners.me||"Me",P.gr],["wife",owners.wife||"Wife",P.br],["household","Household",P.amber]];
  return(
    <div style={{display:"flex",gap:4,background:P.sfA,borderRadius:999,padding:3}}>
      {opts.map(([key,label,color])=>(
        <button key={key} onClick={()=>setProfile(key)}
          style={{borderRadius:999,padding:"4px 10px",fontSize:11,fontWeight:600,border:"none",whiteSpace:"nowrap",
            background:profile===key?color:"transparent",color:profile===key?"#fff":color,
            transition:"background .15s,color .15s"}}>
          {label}
        </button>
      ))}
    </div>
  );
}

/* a. Hero Card — net worth for the selected profile, MoM change from
   data.history[] (reused, not recomputed), secondary currencies per
   data.homeDisplay.netWorth, plus a trend sparkline off the same history[].
   MoM-%-sanity guard: if the prior month's net is near-zero relative to the
   current one, the percentage is mathematically unstable/misleading (a
   near-zero denominator can turn an ordinary swing into "1500%"), most often
   because a past month's auto-captured snapshot was saved before that
   month's investment quotes had ever been fetched (invSar was still 0 that
   month) — a data-staleness artifact, not a bug in the momPct formula
   itself. In that case we still show the raw amount change but hide the %
   rather than print something misleading. */
function HeroCard({profile,setProfile,owners,netWorthByProfile,history,homeDisplay,convert,ratesErr,onOpen}){
  const ref=useRef(null);
  const val=netWorthByProfile(profile);
  useFlash(Math.round(val),ref);
  const sorted=[...(history||[])].sort((a,b)=>a.month.localeCompare(b.month));
  const latest=sorted[sorted.length-1];
  const prev=sorted[sorted.length-2];
  const momAmt=(latest&&prev)?latest.net-prev.net:null;
  const pctUnstable=prev&&(Math.abs(prev.net)<Math.abs(latest.net)*0.05);
  const momPct=(momAmt!=null&&prev&&prev.net!==0&&!pctUnstable)?(momAmt/Math.abs(prev.net))*100:null;
  const nwSettings=(homeDisplay&&homeDisplay.netWorth)||{primary:"PHP",secondary:["SAR","USD","PHP"]};
  const primary=nwSettings.primary||"PHP";
  const secondary=nwSettings.secondary||["SAR","USD","PHP"];
  const primaryVal=convert?convert(val,"SAR",primary):null;
  const label=profile==="household"?"Household":(owners[profile]||profile);
  const trendPts=sorted.map(h=>({value:h.net}));
  /* Two-column split on wide screens (figures left, trend right) rather than
     one full-width band of text above a stretched-out chart — that band is
     what made the Hero read as "very wide and dominant" while still being
     mostly empty. `.hero-split` collapses back to a single column on mobile. */
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle({padding:16}),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8,flexWrap:"wrap"}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Net worth · {label}</div>
        <div onClick={e=>e.stopPropagation()}>
          <HomeProfileToggle profile={profile} setProfile={setProfile} owners={owners}/>
        </div>
      </div>
      <div className="hero-split">
        <div style={{minWidth:0}}>
          <div ref={ref} className="serif tnum" style={{fontSize:34,fontWeight:600,color:P.ink,lineHeight:1.1}}>
            {primaryVal!=null?`${primary} ${Math.round(primaryVal).toLocaleString("en-US")}`:`SAR ${Math.round(val).toLocaleString("en-US")}`}
          </div>
          {momAmt!=null&&
            <div className="tnum" style={{fontSize:13,marginTop:6,color:momAmt>=0?P.gr:P.red,fontWeight:600}}>
              {momAmt>=0?"▲":"▼"} SAR {Math.round(Math.abs(momAmt)).toLocaleString("en-US")}{momPct!=null?` (${momPct.toFixed(1)}%)`:pctUnstable?" (new baseline)":""} this month
            </div>}
          {convert&&
            <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:10}}>
              {secondary.filter(c=>c!==primary).map(c=>{
                const v=convert(val,"SAR",c);
                if(v==null)return null;
                return <span key={c} className="tnum" style={{fontSize:12,color:P.faint}}>{c} {Math.round(v).toLocaleString("en-US")}</span>;
              })}
            </div>}
          {ratesErr&&<div style={{fontSize:11,color:P.faint,marginTop:8}}>Using last available exchange rates.</div>}
        </div>
        <div style={{minWidth:0,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
          {sorted.length>=2
            ?<Sparkline data={trendPts} color={momAmt!=null&&momAmt<0?P.red:P.gr} area height={64}/>
            :<div style={{fontSize:11,color:P.faint,marginTop:10}}>Trend appears after 2+ months of history</div>}
        </div>
      </div>
    </div>
  );
}

/* b. Portfolio Card — same holdingStats+livePrice math as InvestmentsView,
   just re-summed here rather than imported (InvestmentsView keeps its rows
   local to itself); displayed in data.homeDisplay.portfolio currency.
   "Today's gain/loss" is additive: (price-previousClose)*shares, using the
   device-local data.prevClose cache (see fetchQuotes/setLivePrice in App()).
   Any ticker missing a previousClose (no refresh has run yet, or a provider
   didn't supply it) is simply excluded from the sum rather than fabricated;
   if NO ticker has one, the whole line is hidden. */
function PortfolioCard({invs,livePrice,livePriceAt,prevClose,convert,homeDisplay,portHistory,snapshots,profile,isOnline,isHousehold,mp2RatesByYear,includeMp2Estimate,onOpen}){
  const stockInvs=(invs||[]).filter(x=>(x.type||"stocks")==="stocks");
  const rows=stockInvs.map(hld=>{
    const{shares,totalCost}=holdingStats(hld.trades);
    const key=baseKey(hld.ticker||"");
    const price=livePrice[key]||0;
    const pc=(prevClose||{})[key];
    const hasToday=shares>0&&price>0&&pc>0;
    return{value:shares*price,totalCost,todayGain:hasToday?shares*(price-pc):null};
  });
  const totVal=rows.reduce((s,r)=>s+r.value,0);
  const totCost=rows.reduce((s,r)=>s+r.totalCost,0);
  const totGain=totVal-totCost;
  const totGainPct=totCost>0?(totGain/totCost)*100:0;
  const todayRows=rows.filter(r=>r.todayGain!=null);
  const todayGain=todayRows.length?todayRows.reduce((s,r)=>s+r.todayGain,0):null;
  /* MP2/TD — no daily market price, so they only ever feed the headline
     total and their own subline (section 10), never the today/overall gain
     stats above (those stay stock-only, per "do not portray MP2 projections
     or TD accrual as daily market gains"). */
  const mp2Invs=(invs||[]).filter(x=>x.type==="mp2");
  const tdInvs=(invs||[]).filter(x=>x.type==="td");
  const mp2ValUsd=mp2Invs.reduce((s,hld)=>{
    const v=mp2Valuation(hld,mp2RatesByYear||{});
    const chosen=includeMp2Estimate?v.estimatedValue:v.confirmedValue;
    return s+(convert?(convert(chosen,hld.currency||"PHP","USD")||0):0);
  },0);
  const tdValUsd=tdInvs.reduce((s,hld)=>{
    if(hld.status==="closed")return s;
    const v=tdValuation(hld);
    const val=(hld.status==="matured"&&hld.confirmedFinalAmount!=null)?Number(hld.confirmedFinalAmount):v.currentEstValue;
    return s+(convert?(convert(val,hld.currency||"PHP","USD")||0):0);
  },0);
  const goldInvs=(invs||[]).filter(x=>x.type==="gold");
  const goldValUsd=goldInvs.reduce((s,hld)=>s+goldValuation(hld,livePrice[GOLD_TICKER]||0,convert).currentValueUsd,0);
  const grandTotal=totVal+mp2ValUsd+tdValUsd+goldValUsd;
  const primary=(homeDisplay&&homeDisplay.portfolio&&homeDisplay.portfolio.primary)||"USD";
  const displayVal=primary==="USD"?grandTotal:(convert?convert(grandTotal,"USD",primary):null);
  /* portHistory is a single whole-portfolio snapshot series (see addPortSnap
     in App()) is now superseded here (Phase 3) by the per-profile daily
     snapshots — each Home profile (Me/Wife/Household) plots its own real
     trend instead of Household borrowing the shared monthly series and Me/
     Wife showing no chart at all. Compact by design (spec §9): just the
     mini sparkline, no range selector — that lives on the full Portfolio
     tab's HistoryRangeChart. */
  const pts=(snapshots||[]).filter(s=>s.profile===profile).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({value:s.investments}));
  const fresh=freshnessText(livePriceAt,isOnline);
  /* Wide-card composition: value on the left, today's/overall gain as aligned
     stat columns beside it, then the chart absorbing whatever height the row
     ends up at (.home-fill) so this card never shows a blank band. Stats sit
     in a wrapping flex row rather than a stack of one-liners, which is what
     lets the extra 2/3-width actually carry information. */
  const stat=(label,valueNode,tone)=>(
    <div style={{minWidth:0}}>
      <div style={{fontSize:11,color:P.faint,marginBottom:2,whiteSpace:"nowrap"}}>{label}</div>
      <div className="tnum" style={{fontSize:13,fontWeight:600,color:tone,whiteSpace:"nowrap"}}>{valueNode}</div>
    </div>
  );
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle(),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:8,marginBottom:6}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Investments</div>
        {fresh&&<div style={{fontSize:11,color:P.faint,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{fresh}</div>}
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:20,flexWrap:"wrap",rowGap:10}}>
        <div className="serif tnum" style={{fontSize:26,fontWeight:600,color:P.ink,lineHeight:1.1}}>
          {displayVal!=null?`${primary} ${Math.round(displayVal).toLocaleString("en-US")}`:`$${Math.round(grandTotal).toLocaleString("en-US")}`}
        </div>
        <div style={{display:"flex",gap:18,flexWrap:"wrap",rowGap:8}}>
          {todayGain!=null&&stat("Today (stocks)",
            `${todayGain>=0?"▲":"▼"} $${Math.round(Math.abs(todayGain)).toLocaleString("en-US")}`,
            todayGain>=0?P.gr:P.red)}
          {stat("Overall (stocks)",
            `${totGain>=0?"▲":"▼"} $${Math.round(Math.abs(totGain)).toLocaleString("en-US")}`,
            totGain>=0?P.gr:P.red)}
          {stat("Return (stocks)",`${totGain>=0?"+":""}${totGainPct.toFixed(1)}%`,totGain>=0?P.gr:P.red)}
        </div>
      </div>
      {(mp2Invs.length>0||tdInvs.length>0||goldInvs.length>0)&&(
        <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:8,fontSize:11,color:P.faint}} className="tnum">
          <span>Market ${Math.round(totVal).toLocaleString("en-US")}</span>
          {mp2Invs.length>0&&<span>MP2 ${Math.round(mp2ValUsd).toLocaleString("en-US")}</span>}
          {tdInvs.length>0&&<span>Time deposits ${Math.round(tdValUsd).toLocaleString("en-US")}</span>}
          {goldInvs.length>0&&<span>Gold ${Math.round(goldValUsd).toLocaleString("en-US")}</span>}
        </div>
      )}
      {pts.length>=2
        ?<Sparkline data={pts} color={totGain>=0?P.gr:P.red} area height={64} fill/>
        :<div className="home-fill" style={{fontSize:11,color:P.faint,marginTop:10,display:"flex",alignItems:"flex-end"}}>
           Trend appears after 2+ days of history (captured automatically once a day)
         </div>}
    </div>
  );
}

/* c. Savings & Investing Card (Phase 4) — replaces the old Asset Allocation
   donut. That card answered "what do I own"; this one answers "am I actually
   saving/investing this month", which the roadmap explicitly wants computed
   from real category activity (savingsInvestingFor(), module scope) rather
   than an Income-Expenses guess — see that function's comment for why name-
   matched categories are the source of truth instead of a derived leftover
   number.
   Household sums both owners' rollups the same way TrackedSpendingCard does
   (every expense row carries exactly one owner, so summing never double-
   counts). Circular progress = savings rate against income; the horizontal
   two-tone bar is Saved vs Invested so the split reads at a glance without a
   legend. */
function SavingsInvestingCard({profile,payPeriods,planForMonth,expenses,savingsCategories,investmentCategories,homeDisplay,convert,cur,onOpen}){
  const sum=useMemo(()=>{
    const ctx={planForMonth,expenses,payPeriods};
    if(profile==="household"){
      const a=savingsInvestingFor("me",ctx,savingsCategories,investmentCategories);
      const b=savingsInvestingFor("wife",ctx,savingsCategories,investmentCategories);
      return{saved:a.saved+b.saved,invested:a.invested+b.invested,income:a.income+b.income};
    }
    return savingsInvestingFor(profile,ctx,savingsCategories,investmentCategories);
  },[profile,planForMonth,expenses,payPeriods,savingsCategories,investmentCategories]);

  const primary=(homeDisplay&&homeDisplay.savingsInvesting&&homeDisplay.savingsInvesting.primary)||cur;
  // Display-only conversion; stored amounts are always in `cur` (same pattern as TrackedSpendingCard).
  const show=v=>{
    const c=primary===cur?v:(convert?convert(v,cur,primary):null);
    return`${primary} ${Math.round(c==null?v:c).toLocaleString("en-US")}`;
  };
  const total=sum.saved+sum.invested;
  const rate=sum.income>0?(total/sum.income)*100:0;
  const savedShare=total>0?(sum.saved/total)*100:50;
  const noCatsConfigured=(savingsCategories||[]).length===0&&(investmentCategories||[]).length===0;

  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle({padding:14}),cursor:"pointer"}}>
      <div style={{fontSize:12,color:P.sub,fontWeight:600,marginBottom:8}}>Savings &amp; Investing</div>
      {noCatsConfigured?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          Choose your savings and investment categories in Settings to track this.
        </div>
      :(
        <>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{position:"relative",width:64,height:64,flexShrink:0}}>
              <ProgressRing pct={Math.min(100,rate)} size={64} stroke={7} color={P.jade}/>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span className="tnum" style={{fontSize:15,fontWeight:700,color:P.ink}}>{rate.toFixed(0)}%</span>
              </div>
            </div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:11,color:P.faint}}>Savings rate this month</div>
              <div className="tnum" style={{fontSize:13,fontWeight:600,color:P.ink,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {show(total)} of {show(sum.income)}
              </div>
            </div>
          </div>
          <div className="home-fill" style={{marginTop:12,display:"flex",flexDirection:"column",justifyContent:"center",gap:8,minHeight:0}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11,color:P.faint}}>
              <span className="tnum">Saved {show(sum.saved)}</span>
              <span className="tnum">Invested {show(sum.invested)}</span>
            </div>
            <div style={{height:8,borderRadius:999,background:P.sfA,overflow:"hidden",display:"flex"}}>
              {total>0?(<>
                <div style={{width:`${savedShare}%`,background:P.gr,transition:"width .4s ease"}}/>
                <div style={{width:`${100-savedShare}%`,background:P.br,transition:"width .4s ease"}}/>
              </>):null}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* d. Tracked Spending Card — replaces the old "Budget remaining" card, which
   showed unallocated income (a planning number) rather than how much of the
   month's tracked budget has actually been used.

   All figures come from trackedSpendingFor() at module scope, which is the
   same envelope/spent maths the Expenses tab runs — this component only
   formats and ranks. Household sums both owners' rollups; because every
   expense row carries exactly one `owner`, summing the two never
   double-counts. (data.household.expenses is a separate shared-bill
   splitter with no categories or tracking, so it is correctly not part of
   this at all.)

   Tapping anywhere drills into the Expenses tab for the same profile and
   current bucket — Expenses re-anchors its own viewMonth off budgetOwner,
   so setting the owner and switching tab is all that's needed. */
function TrackedSpendingCard({profile,owners,payPeriods,planForMonth,expenses,homeDisplay,convert,cur,onOpen}){
  const profileLabel=profile==="household"?"Household":((owners||{})[profile]||profile);
  const primary=(homeDisplay&&homeDisplay.budget&&homeDisplay.budget.primary)||cur;

  const sum=useMemo(()=>{
    const ctx={planForMonth,expenses,payPeriods};
    if(profile==="household"){
      const a=trackedSpendingFor("me",ctx),b=trackedSpendingFor("wife",ctx);
      return{month:a.month,cats:[...a.cats,...b.cats],
        budget:a.budget+b.budget,spent:a.spent+b.spent};
    }
    return trackedSpendingFor(profile,ctx);
  },[profile,planForMonth,expenses,payPeriods]);

  const{topCats,overCount,remaining,pctUsed,periodLabelText,daysLeft}=useMemo(()=>{
    const remaining=sum.budget-sum.spent;
    const pctUsed=sum.budget>0?(sum.spent/sum.budget)*100:0;
    // "closest to reaching their budget" — highest % used first.
    const topCats=[...sum.cats].sort((a,b)=>b.pct-a.pct).slice(0,3);
    const overCount=sum.cats.filter(c=>c.over).length;
    // Household has two owners who may be on different pay-period settings;
    // label off "me" in that case, which is the same bucket Expenses opens on.
    const labelOwner=profile==="household"?"me":profile;
    const periodLabelText=bucketLabel(sum.month,payPeriods,labelOwner);
    const{elapsed,total}=bucketProgress(sum.month,payPeriods,labelOwner);
    return{topCats,overCount,remaining,pctUsed,periodLabelText,daysLeft:Math.max(0,total-elapsed)};
  },[sum,payPeriods,profile]);

  // Display-only conversion; stored amounts are always in `cur`.
  const show=v=>{
    const c=primary===cur?v:(convert?convert(v,cur,primary):null);
    return`${primary} ${Math.round(c==null?v:c).toLocaleString("en-US")}`;
  };
  const barColor=spendStatusColor(sum.spent,sum.budget);
  const hasData=sum.cats.length>0;

  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle({padding:14}),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:8,flexWrap:"wrap"}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Tracked Spending</div>
        <div style={{fontSize:11,color:P.faint}}>{periodLabelText} · {profileLabel}</div>
      </div>

      {!hasData?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          No tracked categories with a budget this period.
        </div>
      :(
        <>
          <div className="serif tnum" style={{fontSize:20,fontWeight:600,lineHeight:1.15,
            color:remaining>=0?P.ink:P.red}}>
            {show(Math.abs(remaining))} {remaining>=0?"remaining":"over"}
          </div>
          <div className="tnum" style={{fontSize:11,color:P.faint,marginTop:2}}>
            {show(sum.spent)} spent of {show(sum.budget)} · {pctUsed.toFixed(0)}% used
          </div>

          {/* Horizontal spent/remaining bar — replaces the old ring. */}
          <div style={{height:8,borderRadius:999,background:P.sfA,overflow:"hidden",marginTop:10}}>
            <div style={{height:"100%",width:`${Math.min(100,pctUsed)}%`,background:barColor,
              borderRadius:999,transition:"width .4s ease"}}/>
          </div>

          {overCount>0&&
            <div style={{fontSize:11,color:P.red,fontWeight:600,marginTop:6}}>
              {overCount} categor{overCount===1?"y":"ies"} over budget
            </div>}

          {/* Only the three closest to their limit — Home stays compact. */}
          <div className="home-fill" style={{marginTop:10,display:"flex",flexDirection:"column",
            justifyContent:"center",gap:6,minHeight:0}}>
            {topCats.map(c=>(
              <div key={c.id+c.owner} style={{display:"flex",alignItems:"center",gap:8,fontSize:11}}>
                <span style={{flex:1,color:P.sub,minWidth:0,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                <span className="tnum" style={{color:spendStatusColor(c.spent,c.budget),fontWeight:600}}>
                  {c.pct.toFixed(0)}%
                </span>
                <span className="tnum" style={{color:P.faint,whiteSpace:"nowrap",
                  minWidth:96,textAlign:"right"}}>
                  {/* Never a negative remaining — over-budget reads as "over". */}
                  {c.over?`${show(c.spent-c.budget)} over`:`${show(c.remaining)} left`}
                </span>
              </div>
            ))}
          </div>

          <div style={{fontSize:11,color:P.faint,marginTop:8}}>
            {daysLeft} day{daysLeft===1?"":"s"} left this period
          </div>
        </>
      )}
    </div>
  );
}

/* e. Goals Summary Card — replaces the old combined-progress-bar GoalsCard.
   Shows active/completed counts (kept, already good) plus the progress of
   ONE goal: the single highest-priority active goal, rather than a bar
   summed across every goal. There is no priority/order field anywhere on
   the goal schema (checked: no `priority`/`order`/`sortIndex`), so as a
   documented proxy this picks the active goal CLOSEST TO COMPLETION (surfaces
   the goal most likely to need one last push) — an arbitrary-but-reasonable
   stand-in until a real priority field exists. */
function GoalsSummaryCard({goals,profile,onOpen}){
  const list=profile==="household"?(goals||[]):(goals||[]).filter(g=>g.owner===profile);
  const withSaved=list.map(g=>{
    const saved=(g.contributions||[]).filter(c=>!c.deletedAt).reduce((s,c)=>s+(Number(c.amount)||0),0);
    const target=Number(g.target)||0;
    return{...g,saved,target,pct:target>0?(saved/target)*100:0,completed:target>0&&saved>=target};
  });
  const active=withSaved.filter(g=>!g.completed);
  const completedCount=withSaved.length-active.length;
  const top=[...active].sort((a,b)=>b.pct-a.pct)[0];
  /* Deliberately mirrors BudgetCard's shell (header row, ring + headline,
     footer detail) so the two read as a matched pair on the same grid row
     rather than one dense card beside a nearly empty one. */
  return(
    <div className="home-card home-tappable" role="button" tabIndex={0}
      onClick={onOpen}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen&&onOpen();}}}
      style={{...homeCardStyle({padding:14}),cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:6}}>
        <div style={{fontSize:12,color:P.sub,fontWeight:600}}>Goals</div>
        <div style={{fontSize:12,color:P.faint}}>{completedCount} completed · {active.length} active</div>
      </div>
      {!top?
        <div className="home-fill" style={{fontSize:13,color:P.faint,display:"flex",alignItems:"center"}}>
          {withSaved.length===0?"No goals yet":"All goals completed 🎉"}
        </div>
      :(
        <>
          <div className="home-fill" style={{display:"flex",alignItems:"center",gap:14,minHeight:0}}>
            <ProgressRing pct={top.pct} size={56} stroke={6} color={top.color||P.gr}/>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{top.name}</div>
              <div className="tnum" style={{fontSize:11,color:P.faint,marginTop:2}}>{top.pct.toFixed(0)}% saved</div>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:10,fontSize:11,color:P.faint}}>
            <span className="tnum">Saved {Math.round(top.saved).toLocaleString("en-US")}</span>
            <span className="tnum">Target {Math.round(top.target).toLocaleString("en-US")}</span>
          </div>
        </>
      )}
    </div>
  );
}

/* f. Quick Actions — + Expense reuses the exact same globalAddTrigger bump
   the header FAB already uses (see the "Quick add transaction" button in
   App()'s render). + Income/+ Investment navigate to their tab: there's no
   standalone income dialog (income is a plain input in Budget's header),
   and the trade-add modal lives inline inside InvestmentsView rather than
   as a shared component (noted as a known limitation/future extension
   point). + Goal Contribution gets a native Home sheet since addContribution
   is trivially reusable standalone. Deliberately lighter-weight than a card:
   sits as a slim strip right under the Hero, not its own "section". */
function quickActionItems({onExpense,onIncome,onInvestment,onGoal}){
  return[["Expense",I.Receipt,onExpense],["Income",I.Wallet,onIncome],
         ["Investment",I.Trending,onInvestment],["Goal",I.Target,onGoal]];
}

/* Tablet/desktop only (the .cell-qa grid cell is display:none below 768px).
   A 4-up equal-fraction grid rather than a wrapping flex row: every button is
   the same width and height and the group spans the full content width, so it
   reads as part of the grid instead of loose pills, and it can never wrap

          <I.Plus size={11}/><Icon size={13}/>{label}
        </button>
      ))}

}

/* Mobile counterpart to the Quick Actions bar: the floating + opens this

            <button onClick={onClose} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {quickActionItems(handlers).map(([label,Icon,fn])=>(

                style={{display:"flex",alignItems:"center",gap:10,borderRadius:12,
                  padding:"12px 14px",fontSize:14,fontWeight:600,color:P.gr,textAlign:"left"}}>
                <I.Plus size={13}/><Icon size={16}/>{label}
              </button>
            ))}
          </div>
        </div>
      </div>

}

/* Native "add goal contribution" sheet for Home — styled identically to
   GoalsView's own add-money sheet (same .sheet-bg/.sheet classes, same
   Portal+useScrollLock pattern) but calls addContribution(goalId,...)
   directly rather than routing through the Goals tab, since that mutator is
   already a clean standalone function. */
function GoalContributionSheet({goals,addContribution,onClose}){
  useScrollLock(true);
  const[goalId,setGoalId]=useState((goals&&goals[0]&&goals[0].id)||null);
  const[amount,setAmount]=useState("");
  const[note,setNote]=useState("");
  const canSubmit=goalId&&Number(amount)>0;
  return(
    <Portal>
      <div className="sheet-bg" onClick={onClose}>
        <div className="sheet" onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:600,color:P.ink}}>Add goal contribution</h3>
            <button onClick={onClose} style={{background:"transparent",border:"none",color:P.sub}}><I.X size={18}/></button>
          </div>
          {(!goals||goals.length===0)
            ?<div style={{fontSize:13,color:P.sub}}>No goals yet — create one in the Goals tab first.</div>
            :<>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Goal</div>
                <select value={goalId||""} onChange={e=>setGoalId(e.target.value)}
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}>
                  {goals.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
                </select>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Amount to add</div>
                <input type="text" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)}
                  placeholder="0" autoFocus
                  style={{width:"100%",borderRadius:10,padding:"10px",fontSize:18,fontWeight:600,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,color:P.sub,marginBottom:4}}>Note (optional)</div>
                <input value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Monthly deposit"
                  style={{width:"100%",borderRadius:10,padding:"8px 10px",fontSize:14,background:"rgba(0,0,0,.05)",border:"none",color:P.ink}}/>
              </div>
              <button onClick={()=>{if(canSubmit){addContribution(goalId,amount,note);onClose();}}}
                disabled={!canSubmit}
                style={{width:"100%",borderRadius:10,padding:"10px",fontSize:14,fontWeight:600,background:P.gr,color:"#fff",border:"none",opacity:canSubmit?1:.5}}>
                Add contribution
              </button>
            </>}
        </div>
      </div>
    </Portal>
  );
}

/* Composition root — see the block comment above for the "small sibling
   components" rationale. Adding a new card later = write <YCard/> above and
   add one line to the JSX below. */
function HomeView({budgetOwner,setBudgetOwner,owners,netWorth,banks,invSar,invSarForOwner,assetSar,liabSar,convert,sarRate,ratesAt,ratesErr,isOnline,data,invs,livePrice,livePriceAt,prevClose,portHistory,plans,activePlanId,goals,fmt,cur,setTab,setGlobalAddTrigger,addContribution,history,planForMonth,expenses,payPeriods,mp2RatesByYear,includeMp2Estimate,setExpensesFilterRequest}){
  const[profile,setProfile]=useState(budgetOwner);
  const setProfileSynced=p=>{setProfile(p);if(p==="me"||p==="wife")setBudgetOwner(p);};
  const[goalSheet,setGoalSheet]=useState(false);
  const[qaSheet,setQaSheet]=useState(false);
  useScrollLock(goalSheet);
  const homeDisplay=data.homeDisplay||{};
  const homeSettings=data.homeSettings||{};
  const visibility=homeSettings.cardVisibility||{};
  const isVisible=key=>visibility[key]!==false;
  const savingsCategories=homeSettings.savingsCategories||[];
  const investmentCategories=homeSettings.investmentCategories||[];

  /* Investment Accounts (Phase 1): everything below is filtered by the
     selected profile using the same investmentsForProfile()/invSarForOwner()
     helpers App() already computed — no calculation is re-derived here,
     just sliced per owner so each card only ever shows its own profile's
     accounts (banks were already owner-tagged; investments now are too). */
  const profileInvs=useMemo(()=>investmentsForProfile(invs,profile),[invs,profile]);
  const profileBanks=useMemo(()=>profile==="household"?(banks||[]):(banks||[]).filter(b=>b.owner===profile),[banks,profile]);
  const profileInvSar=profile==="household"?invSar:invSarForOwner(profile);

  const netWorthByProfile=useCallback(profileKey=>{
    if(profileKey==="household")return netWorth;
    const ownerBanksSar=(banks||[]).filter(b=>b.owner===profileKey).reduce((s,b)=>{
      const v=convert?convert(b.balance,b.currency,"SAR"):null;return s+(v==null?0:v);
    },0);
    return ownerBanksSar+invSarForOwner(profileKey)+assetSar-liabSar;
  },[banks,invSarForOwner,assetSar,liabSar,convert,netWorth]);

  /* Drill-down for the Tracked Spending card. Expenses derives its own
     viewMonth from bucketNow(payPeriods,budgetOwner) and re-anchors whenever
     budgetOwner changes, so aligning the owner and switching tab lands on the
     right profile AND the current period with no extra state. "Household"
     isn't a real profile in the data model, so it drills into whichever owner
     is currently active rather than inventing a combined Expenses view. */
  const openExpenses=useCallback(()=>{
    if(profile==="me"||profile==="wife")setBudgetOwner(profile);
    setTab("expenses");
  },[profile,setBudgetOwner,setTab]);

  /* Savings & Investing's drill-down (§4/§10): same owner/tab handoff as
     Tracked Spending, plus a one-shot filter request so Expenses opens
     already scoped to the selected savings+investment categories instead of
     showing everything. ExpenseTrackerView applies this itself (matches
     category names to this month's category ids) and doesn't otherwise
     change — Expenses stays out of scope for this phase. */
  const openExpensesFiltered=useCallback(()=>{
    if(profile==="me"||profile==="wife")setBudgetOwner(profile);
    if(setExpensesFilterRequest){
      setExpensesFilterRequest({catNames:[...savingsCategories,...investmentCategories],nonce:Date.now()});
    }
    setTab("expenses");
  },[profile,setBudgetOwner,setTab,setExpensesFilterRequest,savingsCategories,investmentCategories]);

  const actions={
    onExpense:()=>{setTab("expenses");setGlobalAddTrigger(n=>n+1);},
    onIncome:()=>setTab("budget"),
    onInvestment:()=>setTab("investments"),
    onGoal:()=>setGoalSheet(true),
  };

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px"}}>
      <div className="home-grid">
        {isVisible("hero")&&
          <div className="home-cell cell-hero">
            <HeroCard profile={profile} setProfile={setProfileSynced} owners={owners}
              netWorthByProfile={netWorthByProfile} history={history} homeDisplay={homeDisplay} convert={convert} ratesErr={ratesErr}
              onOpen={()=>setTab("networth")}/>
          </div>}
        {isVisible("portfolio")&&
          <div className="home-cell cell-portfolio">
            <PortfolioCard invs={profileInvs} livePrice={livePrice} livePriceAt={livePriceAt} prevClose={prevClose} convert={convert} homeDisplay={homeDisplay} portHistory={portHistory} snapshots={data.snapshots} profile={profile} isOnline={isOnline} isHousehold={profile==="household"} mp2RatesByYear={mp2RatesByYear} includeMp2Estimate={includeMp2Estimate}
              onOpen={()=>setTab("investments")}/>
          </div>}
        {isVisible("savingsInvesting")&&
          <div className="home-cell cell-savings">
            <SavingsInvestingCard profile={profile} payPeriods={payPeriods} planForMonth={planForMonth} expenses={expenses}
              savingsCategories={savingsCategories} investmentCategories={investmentCategories}
              homeDisplay={homeDisplay} convert={convert} cur={cur} onOpen={openExpensesFiltered}/>
          </div>}
        {isVisible("trackedSpending")&&
          <div className="home-cell cell-budget">
            <TrackedSpendingCard profile={profile} owners={owners} payPeriods={payPeriods}
              planForMonth={planForMonth} expenses={expenses}
              homeDisplay={homeDisplay} convert={convert} cur={cur} onOpen={openExpenses}/>
          </div>}
        {isVisible("goals")&&
          <div className="home-cell cell-goals">
            <GoalsSummaryCard goals={goals} profile={profile} onOpen={()=>setTab("goals")}/>
          </div>}
        <div className="home-cell cell-qa">
          <QuickActions {...actions}/>
        </div>
      </div>
      {/* Mobile-only floating +; App suppresses its global FAB on the Home tab
          so only ever one + is on screen, and CSS hides this one >=768px where
          the in-grid Quick Actions bar takes over.
          MUST be portalled to <body>: HomeView renders inside TabPane, whose
          .tab-enter-* animation is declared `both`, so the final keyframe's
          transform:translateX(0) sticks permanently. Any transform other than
          `none` makes that element the containing block for position:fixed
          descendants, which would anchor this button to the tab pane and make
          it scroll with the page instead of floating. App's own FAB avoids
          this by living outside TabPane; Portal is how the rest of this file
          escapes transformed/clipped ancestors. */}
      <Portal>
        <button aria-label="Quick add" className="home-fab" onClick={()=>setQaSheet(true)}
          style={{position:"fixed",right:16,bottom:"calc(env(safe-area-inset-bottom) + 24px)",zIndex:70,
            width:56,height:56,borderRadius:999,background:P.gr,color:"#fff",border:"none",
            display:"flex",alignItems:"center",justifyContent:"center",
            boxShadow:"0 6px 20px rgba(12,22,40,.35)",cursor:"pointer"}}>
          <I.Plus size={24}/>
        </button>
      </Portal>
      {qaSheet&&<QuickActionSheet {...actions} onClose={()=>setQaSheet(false)}/>}
      {goalSheet&&<GoalContributionSheet goals={goals} addContribution={addContribution} onClose={()=>setGoalSheet(false)}/>}
    </div>
  );
}

/* ── BUDGET VIEW — month-aware, percentage shown inline beside amount ── */
function BudgetView({planForMonth,monthlyPlans,plans,clonePlanForMonth,removePlanForMonth,activePlanId,setCatsFor,setGrpsFor,patchPlanById,fmt,cur,budgetOwner,setBudgetOwner,owners,payPeriods,investTarget,setInvestTarget,syncNow}){
  const usesPayPeriod=ownerUsesPayPeriod(payPeriods,budgetOwner);
  const nowMonth=bucketNow(payPeriods,budgetOwner);
  const[viewMonth,setViewMonth]=useState(nowMonth);
  // when switching owners, OR when pay-period settings finish loading/change
  // (e.g. the cloud sync pull resolves after this component already mounted
  // with default settings), re-anchor to that owner's "now" so we're never
  // holding a calendar-month key while in pay-period mode (or vice versa) —
  // that mismatch is what produces "Invalid Date".
  useEffect(()=>{setViewMonth(bucketNow(payPeriods,budgetOwner));},[budgetOwner,JSON.stringify(payPeriods)]);
  const[expandedSubs,setExpandedSubs]=useState({});
  const toggleSubs=id=>setExpandedSubs(s=>({...s,[id]:!s[id]}));
  const[showInvestSettings,setShowInvestSettings]=useState(false);
  /* neumorphic + glass helpers, scoped to this view */
  const card={background:P.neuBg,borderRadius:18,boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`};
  const neu=(r=18)=>({background:P.neuBg,borderRadius:r,boxShadow:`7px 7px 15px ${P.neuLo},-7px -7px 15px ${P.neuHi}`});
  const neuInset=(r=14)=>({background:P.neuBg,borderRadius:r,boxShadow:`inset 4px 4px 9px ${P.neuLo},inset -4px -4px 9px ${P.neuHi}`});
  const neuBtn=(active)=>({background:P.neuBg,borderRadius:999,border:"none",color:active?P.jade:P.neuInk,
    boxShadow:active?`inset 3px 3px 7px ${P.neuLo},inset -3px -3px 7px ${P.neuHi}`:`4px 4px 9px ${P.neuLo},-4px -4px 9px ${P.neuHi}`});
  const glassPanel=(r=20)=>({background:P.glassBg,backdropFilter:"blur(16px) saturate(160%)",WebkitBackdropFilter:"blur(16px) saturate(160%)",
    border:`1px solid ${P.glassBorder}`,boxShadow:`0 10px 26px ${P.glassShadow}, inset 0 1px 0 ${P.glassHi}`,borderRadius:r});

  const addMonths=(ym,n)=>bucketShift(ym,payPeriods,budgetOwner,n);
  const fmtMonth=m=>bucketLabel(m,payPeriods,budgetOwner);
  const isFuture=viewMonth>nowMonth;
  const isNow=viewMonth===nowMonth;
  const isPast=viewMonth<nowMonth;

  /* the plan that applies to the viewed month for this owner */
  const monthPlan=planForMonth(viewMonth,budgetOwner);
  const hasOwnPlan=!!(monthlyPlans||[]).find(m=>m.month===viewMonth&&m.owner===budgetOwner);
  /* Current month always edits the carry-forward base plan directly.
     Other months are only editable once a custom copy exists. */
  const editable=isNow||hasOwnPlan;
  const pid=monthPlan.id;

  /* keep a category's stored amount in sync with its sub-items' sum */
  const syncAmt=c=>{const subs=c.subs||[];return subs.length>0?{...c,amount:subs.reduce((s,x)=>s+(Number(x.amount)||0),0)}:c;};

  /* month-scoped mutators — all target the viewed month's plan id, atomically */
  const updateCat=(id,patch)=>setCatsFor(pid,cats=>cats.map(c=>c.id===id?{...c,...patch}:c));
  const addCat=gid=>setCatsFor(pid,cats=>[...cats,{id:uid(),name:"New category",amount:0,groupId:gid,color:SEG[cats.length%SEG.length],subs:[],trackExpenses:true}]);
  const removeCat=id=>setCatsFor(pid,cats=>cats.filter(c=>c.id!==id));
  const updateSub=(catId,subId,patch)=>setCatsFor(pid,cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:(c.subs||[]).map(s=>s.id===subId?{...s,...patch}:s)}):c));
  const removeSub=(catId,subId)=>setCatsFor(pid,cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:(c.subs||[]).filter(s=>s.id!==subId)}):c));
  const addGroup=()=>setGrpsFor(pid,gs=>[...gs,{id:uid(),name:"New group"}]);
  const renameGroup=(id,name)=>setGrpsFor(pid,gs=>gs.map(g=>g.id===id?{...g,name}:g));
  const removeGroup=id=>{setCatsFor(pid,cats=>cats.filter(c=>c.groupId!==id));setGrpsFor(pid,gs=>gs.filter(g=>g.id!==id));};
  const setIncome=v=>patchPlanById(pid,{income:Number(v)||0});

  const handleAddSub=catId=>{
    setCatsFor(pid,cats=>cats.map(c=>c.id===catId?syncAmt({...c,subs:[...(c.subs||[]),{id:uid(),name:"New item",amount:0}]}):c));
    setExpandedSubs(s=>({...s,[catId]:true}));
  };
  const handleSubChange=(catId,subId,patch)=>updateSub(catId,subId,patch);
  const handleRemoveSub=(catId,subId)=>removeSub(catId,subId);

  const effectiveAmt=c=>{
    const subs=c.subs||[];
    if(subs.length>0)return subs.reduce((s,sub)=>s+(Number(sub.amount)||0),0);
    return Number(c.amount)||0;
  };

  /* month-scoped totals */
  const income=Number(monthPlan.income)||0;
  const allocated=(monthPlan.categories||[]).reduce((s,c)=>s+effectiveAmt(c),0);
  const remaining=income-allocated;
  const pct=n=>income>0?((Number(n)||0)/income)*100:0;

  /* Default: copy whatever is currently being previewed for this month
     (fixes the old bug where this silently pulled from the base plan
     instead of the shown carry-forward/custom plan). */
  const createCopy=()=>clonePlanForMonth(viewMonth,pid,budgetOwner,fmtMonth(viewMonth));
  const[showCopyPicker,setShowCopyPicker]=useState(false);
  const[copySourceId,setCopySourceId]=useState("");
  const ownerPlanOptions=(plans||[]).filter(p=>p.owner===budgetOwner);
  const createCopyFrom=()=>{if(copySourceId){clonePlanForMonth(viewMonth,copySourceId,budgetOwner,fmtMonth(viewMonth));setShowCopyPicker(false);}};

  return(
    <div style={{background:P.neuBg,borderRadius:24,padding:"14px 12px 18px",margin:"0 -4px",transition:"background .25s ease"}}>
      {/* ── owner toggle ── */}
      <OwnerToggle owner={budgetOwner} setOwner={setBudgetOwner} owners={owners}/>

      {/* ── month navigator (glass — floating nav chrome) ── */}
      <div className="fade-up glass-panel" style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"10px 14px"}}>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,-1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>‹</button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontSize:15,fontWeight:700,color:P.ink}}>{fmtMonth(viewMonth)}</div>
          <div style={{fontSize:11,fontWeight:600,marginTop:1,color:isFuture?P.br:isNow?P.jade:P.faint}}>
            {isFuture?"Planning ahead":isNow?(usesPayPeriod?"Current pay period":"Current month"):(usesPayPeriod?"Past pay period":"Past month")}
          </div>
        </div>
        <button className="glass-btn" onClick={()=>setViewMonth(m=>addMonths(m,1))}
          style={{padding:"4px 10px",fontSize:18,lineHeight:1}}>›</button>
        {viewMonth!==nowMonth&&(
          <button className="glass-btn" onClick={()=>setViewMonth(nowMonth)}
            style={{padding:"4px 10px",fontSize:12,fontWeight:600,color:P.jadeD||P.jade}}>Today</button>
        )}
      </div>

      {/* ── plan status banner (neumorphic raised, subtly tinted) ── */}
      <div style={{...neu(14),padding:"12px 14px",marginBottom:12,
        display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1}}>
          <div style={{fontSize:12,fontWeight:600,color:isNow?P.jade:hasOwnPlan?P.br:P.neuSub}}>
            {isNow?"📋 Carry-forward plan":hasOwnPlan?`📋 Custom plan for ${fmtMonth(viewMonth)}`:"📋 Carry-forward (preview)"}
          </div>
          <div style={{fontSize:11,color:isNow?P.gr:hasOwnPlan?P.br:P.faint,marginTop:2}}>
            {isNow
              ?"This is your base budget. Edits here carry forward to every future month automatically."
              :hasOwnPlan
                ?"A custom copy for this month. Edits here only affect this month."
                :`Showing your carry-forward budget. Create a copy to customize ${fmtMonth(viewMonth)} without touching other months.`}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
          {!isNow&&(hasOwnPlan
            ?<button onClick={()=>removePlanForMonth(viewMonth,budgetOwner)} className="neu-btn"
                style={{fontSize:11,padding:"5px 12px",color:P.wine,fontWeight:500}}>Remove</button>
            :<>
              <button onClick={createCopy} className="neu-btn"
                  style={{fontSize:11,padding:"5px 12px",color:P.jade,fontWeight:600,whiteSpace:"nowrap"}}>+ Create copy</button>
              <button onClick={()=>setShowCopyPicker(v=>!v)}
                  style={{fontSize:10,background:"transparent",border:"none",color:P.neuSub,padding:0,textDecoration:"underline",whiteSpace:"nowrap"}}>copy from a different month</button>
            </>
          )}
        </div>
      </div>

      {/* ── optional: pick a specific source plan to copy from ── */}
      {!isNow&&!hasOwnPlan&&showCopyPicker&&(
        <div style={{...neuInset(14),padding:12,marginBottom:12,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <select value={copySourceId} onChange={e=>setCopySourceId(e.target.value)}
            style={{fontSize:12,borderRadius:8,padding:"5px 8px",background:P.neuBg,border:"none",color:P.neuInk,flex:1,minWidth:160}}>
            <option value="">Select a plan to copy…</option>
            {ownerPlanOptions.map(p=>(
              <option key={p.id} value={p.id}>{p.name||p.month} ({cur} {(p.income||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})})</option>
            ))}
          </select>
          <button onClick={createCopyFrom} disabled={!copySourceId} className="neu-btn"
            style={{fontSize:11,padding:"6px 14px",color:copySourceId?P.jade:P.neuSub,fontWeight:600}}>Copy</button>
        </div>
      )}

      {/* ── income + allocation summary ── */}
      <div style={{...neu(16),padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"baseline",gap:6}}>
            <span style={{fontSize:12,color:P.neuSub,textTransform:"uppercase",letterSpacing:".08em"}}>Income</span>
            <span style={{fontSize:13,color:P.neuSub}}>{cur}</span>
            <input type="number" value={income} disabled={!editable}
              onChange={e=>setIncome(e.target.value)}
              onBlur={()=>syncNow&&syncNow()}
              className="bare tnum serif" style={{fontSize:22,fontWeight:600,width:130,color:editable?P.neuInk:P.neuSub,
                ...(editable?neuInset(8):{}),padding:editable?"2px 8px":undefined}}/>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:600,color:P.neuSub}}>Allocated {fmt(allocated)}</span>
          <span key={remaining} className="num-flash" style={{fontSize:13,fontWeight:600,color:remaining<0?P.wine:P.jade}}>
            {remaining<0?"Over by ":"Left "}{fmt(Math.abs(remaining))}
          </span>
        </div>
      </div>

      {/* ── allocation breakdown: donut + list (replaces the old linear bar; also folds in what used to be the separate Overview tab) ── */}
      {(()=>{
        const groupData=(monthPlan.groups||[]).map((g,i)=>({
          name:g.name,
          value:(monthPlan.categories||[]).filter(c=>c.groupId===g.id).reduce((s,c)=>s+effectiveAmt(c),0),
          color:SEG[i%SEG.length],
        })).filter(d=>d.value>0);
        return(
          <div style={{display:"flex",gap:16,marginBottom:16,flexWrap:"wrap"}}>
            <div style={{...neu(16),padding:16,flex:"1 1 200px",minWidth:200}}>
              <div style={{width:"100%",height:190}}>
                <ResponsiveContainer>
                  <PieChart>
                    <Pie data={groupData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={78} innerRadius={44} paddingAngle={2}>
                      {groupData.map((d,i)=><Cell key={i} fill={d.color}/>)}
                    </Pie>
                    <Tooltip formatter={v=>fmt(v)}/>
                  </PieChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div style={{...neu(16),padding:16,flex:"1 1 200px",minWidth:200,display:"flex",flexDirection:"column",justifyContent:"center"}}>
              <div style={{fontSize:11,fontWeight:600,color:P.neuSub,textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Where {fmt(income)} goes</div>
              {groupData.map(d=>(
                <div key={d.name} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,padding:"4px 0"}}>
                  <span style={{width:9,height:9,borderRadius:999,background:d.color,flexShrink:0}}/>
                  <span style={{flex:1,color:P.neuSub,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                  <span className="tnum" style={{color:P.neuSub,fontSize:12,opacity:.75}}>{pct(d.value).toFixed(2)}%</span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {/* ── Invest & Grow target badge ── */}
      {(()=>{
        const investGroupNames=investTarget?.groupNames||[];
        const investAmt=(monthPlan.categories||[]).filter(c=>{
          const g=(monthPlan.groups||[]).find(gr=>gr.id===c.groupId);
          return g&&investGroupNames.includes(g.name);
        }).reduce((s,c)=>s+effectiveAmt(c),0);
        const investPct=pct(investAmt);
        const thresholdPct=Number(investTarget?.thresholdPct)||0;
        const meetsTarget=thresholdPct>0&&investPct>=thresholdPct;
        const gapSar=Math.max(0,(thresholdPct/100)*income-investAmt);
        const barPct=thresholdPct>0?Math.min(100,(investPct/thresholdPct)*100):Math.min(100,investPct);
        const fillColor=thresholdPct===0?P.neuSub:meetsTarget?P.jade:P.br;
        return(
          <div style={{...neu(16),padding:"12px 14px",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{fontSize:13,fontWeight:600,color:thresholdPct===0?P.neuSub:meetsTarget?P.jade:P.br}}>
                {thresholdPct>0&&(meetsTarget?"✓ ":"⚠ ")}
                Invest &amp; Grow — {investPct.toFixed(2)}% of income
                {thresholdPct>0&&(meetsTarget
                  ?` · meeting your ${thresholdPct}% target`
                  :` · ${fmt(gapSar)} short of ${thresholdPct}% target`)}
              </div>

                    onChange={e=>setInvestTarget({thresholdPct:Number(e.target.value)||0})}

                  <span style={{fontSize:12,color:P.neuSub}}>% of income</span>

                <div style={{display:"flex",flexWrap:"wrap",gap:10}}>

                    const checked=investGroupNames.includes(g.name);

      {!editable&&(
        <div style={{...neuInset(14),padding:"14px 16px",marginBottom:16,textAlign:"center"}}>

            style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 16px",fontSize:14,fontWeight:600,color:P.jade}}>

        const items=(monthPlan.categories||[]).filter(c=>c.groupId===g.id);

              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:13,fontWeight:600,color:P.neuSub}} className="tnum">{fmt(groupTotal)}</span>
                <button onClick={()=>removeGroup(g.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.5}}><I.Trash size={14}/></button>

            {items.map(c=>{
              const subs=c.subs||[];

                      <input value={c.name} onChange={e=>updateCat(c.id,{name:e.target.value})} className="bare"
                        style={{flex:1,fontSize:14,minWidth:0,fontWeight:hasSubs?600:400,

                    </div>
                    <div className="cat-row-meta">
                      <div className="cat-row-figures">
                        <span className="tnum" style={{fontSize:12,color:P.neuSub,width:44,textAlign:"right",opacity:.75}}>{pct(effAmt).toFixed(2)}%</span>
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <span style={{fontSize:11,color:P.neuSub}}>{cur}</span>
                          {hasSubs
                            /* when subs exist, show computed total (read-only style) */
                            ?<span className="tnum" style={{width:88,textAlign:"right",fontSize:14,fontWeight:600,color:P.jade}}>{effAmt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
                            /* no subs — manual input as before */
                            :<input type="text" inputMode="decimal" value={c.amount} onChange={e=>updateCat(c.id,{amount:e.target.value})}
                              onBlur={e=>updateCat(c.id,{amount:evalMathExpr(e.target.value,0)})}
                              onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur();}}
                              className="bare tnum" style={{width:88,textAlign:"right",fontSize:14,fontWeight:600,color:P.neuInk}}/>
                          }
                        </div>
                      </div>
                      <div className="cat-row-actions">
                        {/* tracking toggle */}
                        <button onClick={()=>updateCat(c.id,{trackExpenses:c.trackExpenses===false})}
                          title={c.trackExpenses===false?"Re-enable expense tracking for this category":"Exclude this category from expense tracking (one-time transfers, e.g. Savings)"}
                          style={{background:"transparent",border:"none",color:c.trackExpenses===false?P.br:P.neuSub,padding:2,display:"flex",alignItems:"center",opacity:c.trackExpenses===false?1:.5}}>
                          {c.trackExpenses===false?<I.EyeOff size={14}/>:<I.Receipt size={14}/>}
                        </button>
                        {/* sub-toggle button */}
                        <button onClick={()=>toggleSubs(c.id)} title={subsOpen?"Hide sub-items":"Show sub-items"}
                          style={{background:"transparent",border:"none",color:subsOpen?P.jade:P.neuSub,padding:2,display:"flex",alignItems:"center"}}>
                          <I.Chevron size={14} style={{transform:subsOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}/>
                        </button>
                        <button onClick={()=>removeCat(c.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={15}/></button>
                      </div>
                    </div>
                  </div>

                  {/* Sub-items panel */}
                  {subsOpen&&(
                    <div style={{...neuInset(0),borderRadius:0,padding:"2px 0"}}>
                      {subs.map(sub=>(
                        <div key={sub.id} className="sub-row" style={{borderBottom:"1px solid rgba(0,0,0,.05)"}}>
                          <div className="sub-row-name">
                            {/* indent indicator */}
                            <span style={{width:6,height:6,borderRadius:999,background:P.neuSub,flexShrink:0}}/>
                            <input value={sub.name} onChange={e=>handleSubChange(c.id,sub.id,{name:e.target.value})}
                              className="bare" style={{flex:1,fontSize:13,minWidth:0,color:P.neuInk}}/>
                          </div>
                          <div className="sub-row-meta">
                            <div style={{display:"flex",alignItems:"center",gap:4}}>
                              <span style={{fontSize:11,color:P.neuSub}}>{cur}</span>
                              <input type="text" inputMode="decimal" value={sub.amount} onChange={e=>handleSubChange(c.id,sub.id,{amount:e.target.value})}
                                onBlur={e=>handleSubChange(c.id,sub.id,{amount:evalMathExpr(e.target.value,0)})}
                                onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur();}}
                                className="bare tnum" style={{width:80,textAlign:"right",fontSize:13,fontWeight:600,color:P.neuInk}}/>
                            </div>
                            <button onClick={()=>handleRemoveSub(c.id,sub.id)} style={{background:"transparent",border:"none",color:P.wine,opacity:.4}}><I.X size={13}/></button>
                          </div>
                        </div>
                      ))}
                      {/* sub total when multiple subs */}
                      {subs.length>1&&(
                        <div style={{display:"flex",justifyContent:"flex-end",padding:"5px 16px 5px 36px",fontSize:12,color:P.neuSub}} className="tnum">
                          Subtotal: {cur} {effAmt.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
                        </div>
                      )}
                      <button onClick={()=>handleAddSub(c.id)}
                        style={{display:"flex",alignItems:"center",gap:5,padding:"7px 16px 7px 36px",fontSize:13,color:P.jade,background:"transparent",border:"none",width:"100%"}}>
                        <I.Plus size={12}/>Add sub-item
                      </button>
                    </div>
                  )}

                  {/* Quick "add sub-item" link when panel is closed (only shows when no subs yet) */}
                  {!subsOpen&&!hasSubs&&(
                    <div style={{paddingLeft:36,paddingBottom:6,marginTop:-4}}>
                      <button onClick={()=>handleAddSub(c.id)}
                        style={{fontSize:11,color:P.neuSub,background:"transparent",border:"none",padding:"0 0 2px",display:"flex",alignItems:"center",gap:4}}>
                        <I.Plus size={10}/>add sub-items
                      </button>
                    </div>
                  )}
                </div>
              );
            })}

            <button onClick={()=>addCat(g.id)} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"10px 16px",fontSize:14,fontWeight:500,color:P.jade,background:"transparent",border:"none"}}>
              <I.Plus size={14}/>Add category
            </button>
          </section>
        );
      })}
      {editable&&(
        <button onClick={addGroup} className="neu-btn" style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",fontSize:14,fontWeight:500,color:P.jade}}>
          <I.Plus size={14}/>Add group
        </button>
      )}
    </div>
  );
}
