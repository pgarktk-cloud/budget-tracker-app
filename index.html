<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Where'dItGo — Salary &amp; Net Worth</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#15243B"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Where'dItGo"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<script>
(function(){
  try{
    var t=localStorage.getItem("allocation:theme");
    if(t==="dark"){
      var root=document.documentElement;
      root.setAttribute("data-theme","dark");
      var vars={
        "--bg":"#15191B","--ink":"#EAF0FA","--sub":"#9FB0C8","--faint":"#647289",
        "--line":"rgba(255,255,255,.09)","--sf":"#1E2427","--sfA":"#0E1213","--gr":"#3FBF9E",
        "--grD":"#8FE3CC","--grS":"#17322B","--br":"#4FA9C7","--brS":"#1A323B","--red":"#C97177",
        "--deep":"#0A1119","--deepHi":"#7E93B5",
        "--neuBg":"#15191B","--neuHi":"#232A2D","--neuLo":"#060809","--neuInk":"#E7ECEC","--neuSub":"#93A1A7",
        "--jade":"#3FBF9E","--jadeS":"#17322B","--wine":"#C97177","--wineS":"#3A2224",
        "--glassBg":"rgba(255,255,255,.07)","--glassBgStrong":"rgba(255,255,255,.12)","--glassBorder":"rgba(255,255,255,.16)","--glassShadow":"rgba(0,0,0,.5)","--glassHi":"rgba(255,255,255,.18)"
      };
      for(var k in vars)root.style.setProperty(k,vars[k]);
    }
  }catch(e){}
})();
</script>
<!-- Subresource Integrity: the browser refuses to run a file whose bytes don't
     hash to the pinned value, so a compromised CDN (or a hijacked connection)
     can't inject code into this page. That matters here specifically because
     anything running on this origin can read the sync passphrase out of
     localStorage — SRI is what stops a swapped-in script from exfiltrating it.

     Every URL below must be a REAL FILE IN THE NPM PACKAGE, never one jsDelivr
     generates on the fly. Recharts is why: the package ships umd/Recharts.js
     (already minified), and requesting umd/Recharts.min.js made jsDelivr
     synthesise a file with a generated banner — whose bytes can change under
     us. jsDelivr says so itself: "Do NOT use SRI with dynamically generated
     files." Hashes below were cross-checked byte-for-byte against unpkg.

     BUMPING A LIBRARY VERSION MEANS REGENERATING ITS HASH, or the app goes
     blank with a console error. See CLAUDE.md for the one-liner. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous" integrity="sha384-/AfDwVDXNopzPvhxMPQ11y1OCpR6mVkWx47qzSwIiquvxkcMkZddEzDNtIOtfCpk"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js" crossorigin="anonymous" integrity="sha384-d1XH4LhwLW8j0l6VXMP8yJabdGY9ZqtZk7k7PaPk5NoUCcZ/hDkL5aaKioKQbcZg"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js" crossorigin="anonymous" integrity="sha384-BcI7nduYchENm39cFMEVJXHEE7fwHONANyn/pY2YTa+BNtrWF2bKBZeI0wqVithi"></script>
<style>
:root{
  --bg:#E4E7E9;--ink:#15243B;--sub:#56657E;--faint:#8A98AD;
  --line:rgba(34,41,44,.09);--sf:#EEF0F1;--sfA:#DADEE0;
  --gr:#1E6E5C;--grD:#154F42;--grS:#DCEAE5;
  --br:#2E8BB0;--brS:#E0EEF4;--red:#9B4A4E;
  --deep:#15243B;--deepHi:#9DB0CC;
  --neuBg:#E4E7E9;--neuHi:#FFFFFF;--neuLo:#B8C1C5;--neuInk:#22292C;--neuSub:#5C6B70;
  --jade:#1E6E5C;--jadeS:#DCEAE5;--wine:#9B4A4E;--wineS:#F3E2E1;
  --glassBg:rgba(255,255,255,.5);--glassBgStrong:rgba(255,255,255,.68);--glassBorder:rgba(255,255,255,.85);--glassShadow:rgba(34,41,44,.16);--glassHi:rgba(255,255,255,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);transition:background .25s ease;width:100%;}
/* overflow-x:hidden belongs on <html> ONLY. On <body> it made body a scroll
   container: per spec `overflow-x:hidden` with `overflow-y:visible` computes
   the y axis to `auto`, so body reported `hidden auto`, and every
   position:sticky descendant then resolved `top:0` against *body's*
   scrollport — i.e. the full document height — instead of the viewport, so
   sticky silently never engaged. The root element's overflow propagates to
   the viewport, so html alone still clips horizontal overflow. */
html{overflow-x:hidden;}
/* whenever any sheet/modal overlay is mounted anywhere in the document
   (including Portal-rendered ones attached directly to body), freeze the
   page behind it — otherwise a touch-drag that starts inside the sheet can
   hand off to the underlying page scroll once it hits the sheet's own
   scroll edge, which on iOS feels like "the page behind is scrolling". */
/* body scroll lock now handled entirely by the useScrollLock hook (JS,
   position:fixed + top offset) — the old CSS-only body:has() rule below
   was removed because it applied overflow:hidden/height:100vh instantly
   at paint time, snapping the background to the top before the JS fix
   could take over, causing a visible jump on iOS. */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior-x:none;}
.serif{font-family:"Iowan Old Style",Georgia,serif;}
.tnum{font-variant-numeric:tabular-nums;}
input.bare{background:transparent;border:none;outline:none;padding:1px 2px;border-radius:4px;transition:background .12s,box-shadow .12s;font:inherit;color:inherit;}
input.bare:hover{background:rgba(127,143,168,.12);}
input.bare:focus{background:rgba(91,143,217,.12);box-shadow:0 0 0 1px rgba(91,143,217,.4);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
button{cursor:pointer;font:inherit;}
select{font:inherit;}

/* ── Keyframes ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes numFlash{0%{opacity:1}30%{opacity:.35}100%{opacity:1}}
@keyframes slideInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes sheetDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetBgIn{from{opacity:0}to{opacity:1}}

/* ── Top sheet (mobile-first modal alternative) — anchored near the top of
   the viewport so it's visible immediately on open, no scrolling needed,
   and stays clear of the on-screen keyboard which eats the bottom half. ── */
.sheet-bg{
  position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(21,25,27,.32);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  animation:sheetBgIn .25s ease both;
  overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top) + 16px) 12px 16px;
  /* dvh, not vh: on mobile Safari/Chrome `100vh` is the *large* viewport (as
     if the URL bar were hidden), so a fixed overlay sized in vh overflows the
     actually-visible area and pushes a sheet's bottom buttons below the fold
     until the person scrolls the browser chrome away. dvh tracks the real
     visible height. The vh line stays first as the fallback for browsers
     without dvh support. */
  height:100vh;height:100dvh;
}
.sheet{
  border-radius:20px;padding:18px;
  width:100%;max-width:480px;overflow-y:auto;overflow-x:hidden;
  max-height:calc(100vh - env(safe-area-inset-top) - 32px);
  max-height:calc(100dvh - env(safe-area-inset-top) - 32px);
  overscroll-behavior:contain;
  background:var(--glassBgStrong);
  border:1px solid var(--glassBorder);box-shadow:0 16px 40px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  animation:sheetDown .28s cubic-bezier(.22,1,.36,1) both;
}
.sheet-handle{display:none;}


.spin{animation:spin .9s linear infinite;}
:focus-visible{outline:2px solid var(--gr);outline-offset:1px;}

/* ── Tab content fade ── */
.tab-enter{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;}
.tab-enter-right{animation:slideInRight .45s cubic-bezier(.22,1,.36,1) both;}
.tab-enter-left{animation:slideInLeft .45s cubic-bezier(.22,1,.36,1) both;}

/* ── Cards / sections fade up on mount ── */
.fade-up{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;}
.fade-up-1{animation:fadeUp .5s .1s cubic-bezier(.22,1,.36,1) both;}
.fade-up-2{animation:fadeUp .5s .2s cubic-bezier(.22,1,.36,1) both;}
.fade-up-3{animation:fadeUp .5s .3s cubic-bezier(.22,1,.36,1) both;}
.fade-up-4{animation:fadeUp .5s .4s cubic-bezier(.22,1,.36,1) both;}
.fade-up-5{animation:fadeUp .5s .5s cubic-bezier(.22,1,.36,1) both;}

/* ── List item appear ── */
.list-item-enter{animation:fadeUp .38s cubic-bezier(.22,1,.36,1) both;}

/* ── Number flash when value changes ── */
.num-flash{animation:numFlash .6s ease both;}

/* ── Modal overlay + panel ── */
.modal-bg{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(21,25,27,.32);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  animation:overlayIn .3s ease both;
}
.modal{
  border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:var(--glassBgStrong);
  border:1px solid var(--glassBorder);box-shadow:0 16px 40px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  animation:scaleIn .4s cubic-bezier(.22,1,.36,1) both;
}

/* ── Button & interactive transitions ── */
button{transition:opacity .18s,transform .15s,background .22s,color .22s,box-shadow .22s;}
button:active{transform:scale(.96);}
select{transition:background .22s;}

/* ── Progress bars ── */
.bar-animated{transition:width .8s cubic-bezier(.22,1,.36,1);}
.bar-color{transition:background .5s;}

/* ── Neumorphism + liquid-glass (Budget pilot) ──
   Neumorphic surfaces are matte, same hue as their bed, carved via dual
   soft shadows (a light "highlight" + a dark "depth" tint of the same
   stone color — never pure black, which reads cheap). Glass is reserved
   for floating/overlay chrome: translucent, blurred, edge-lit. */
.neu-raised{
  background:var(--neuBg);border-radius:18px;
  box-shadow:7px 7px 15px var(--neuLo),-7px -7px 15px var(--neuHi);
  transition:box-shadow .25s ease;
}
.neu-inset{
  background:var(--neuBg);border-radius:14px;
  box-shadow:inset 4px 4px 9px var(--neuLo),inset -4px -4px 9px var(--neuHi);
}
.neu-btn{
  background:var(--neuBg);border-radius:999px;border:none;color:var(--neuInk);
  box-shadow:4px 4px 9px var(--neuLo),-4px -4px 9px var(--neuHi);
  transition:box-shadow .15s ease,transform .12s ease;
}
.neu-btn:active{
  box-shadow:inset 3px 3px 6px var(--neuLo),inset -3px -3px 6px var(--neuHi);
  transform:scale(.97);
}
.neu-btn.is-active{
  box-shadow:inset 3px 3px 7px var(--neuLo),inset -3px -3px 7px var(--neuHi);
  color:var(--jade);
}
.glass-panel{
  background:var(--glassBg);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid var(--glassBorder);
  box-shadow:0 10px 26px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  border-radius:20px;
}
.glass-btn{
  background:var(--glassBgStrong);
  backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid var(--glassBorder);
  box-shadow:0 4px 12px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  border-radius:999px;color:var(--neuInk);
  transition:box-shadow .15s ease,transform .12s ease;
}
.glass-btn:active{transform:scale(.96);}
/* liquid-fill progress: an inset trough (neu-inset) contains this —
   a translucent gradient body with a glassy highlight riding the top,
   like liquid settling in a tube. */
.liquid-fill{
  position:relative;height:100%;border-radius:999px;
  transition:width .8s cubic-bezier(.22,1,.36,1);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -6px 10px -4px rgba(0,0,0,.18);
}

/* ── Reduced motion override ── */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}

/* ── Mobile viewport hardening ──
   iOS Safari auto-zooms the whole page when a focused form control computes
   to under 16px. That zoom also shifts the layout off-center in the PWA
   standalone shell. Forcing 16px on every interactive control (while keeping
   the *visual* size the same via padding/line-height tweaks) stops the zoom
   without changing how anything looks above 768px. ── */
@media(max-width:768px){
  input,select,textarea,input.bare,input.bare.tnum{
    font-size:16px!important;
  }
  /* the tighter/narrower numeric fields need a touch more padding at 16px
     so they don't visually balloon relative to their neighbors */
  input.bare.tnum{padding:1px 2px;}
}

/* ── Budget tab: one-line category/sub rows ──
   These used to wrap to three stacked lines on a phone (name / % + amount /
   Tracked pill + chevron + trash) — 121px per category, which for 19
   categories was 2,299px of a 4,484px page: most of why Budget ran 5.3
   screens deep. They are a single line at every width now.
   What stays on the row is what actually gets edited every month — the name
   and the amount. The Tracked toggle and Delete moved into the panel behind
   the chevron. Nothing is lost at a glance: an untracked category already
   renders its name italic and greyed, which is the same signal the pill
   was carrying. ── */
/* 4px vertical padding, not 8: the row's height floor is already the 40px
   chevron target, so extra padding only lengthens the page. */
.cat-row{display:flex;align-items:center;gap:8px;padding:4px 12px;}
.cat-row-name{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;}
.cat-row-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.cat-row-figures{display:flex;align-items:center;gap:8px;}
.cat-row-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 30px;}
.sub-row-name{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;}
.sub-row-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
/* Below tablet the per-category % is the first thing to drop: it is
   secondary (the "Where your income goes" card already breaks down shares)
   and losing it buys ~44px back for the name, which is what you scan by. */
@media(max-width:768px){
  .cat-pct{display:none;}
  /* the per-row currency code goes too — a plan is single-currency, and the
     code is already on the group total and the income line above. Between
     them these two buy the category name ~70px, enough that "Long Term
     Savings" stops truncating. */
  .cat-cur{display:none;}
}
/* Group headers stay put while their own card is on screen, so you always
   know which group the row under your thumb belongs to. Needs an opaque
   background (rows would show through otherwise); the group <section> uses
   overflow:clip rather than hidden so this still works — `hidden` would make
   the section a scroll container and sticky would resolve against it. */
.group-head{position:sticky;top:0;z-index:2;background:var(--neuBg);}
.status-pill-fixed{min-width:104px;justify-content:center;}
@media(max-width:400px){.status-pill-fixed{min-width:0;padding:0 8px;}}

/* ── Home tab: responsive dashboard grid ──
   One shared 6-column track at every breakpoint, so every card snaps to the
   same vertical guides instead of each row inventing its own widths (that
   inconsistency is what made the old 2-col version feel "assembled"). Cards
   claim column spans per breakpoint; `order` handles the mobile reading
   sequence.

   Row structure by breakpoint (Phase 4 §7 — Savings & Investing replaces the
   old Asset Allocation slot, same column position):
     mobile  (<768)      1 col   Hero / Portfolio / Budget / Savings / Goals
     tablet  (768-1023)  6 col   Hero(6) / Portfolio(3)+Savings(3)
                                 / Budget(3)+Goals(3) / QuickActions(6)
     desktop (>=1024)    6 col   same, but Portfolio(4)+Savings(2) so the
                                 analytical card gets the 2/3 width it needs
                                 and Savings gets the compact column it's
                                 designed for.

   .home-cell is a flex wrapper whose single child card stretches to the full
   row height — that's what keeps side-by-side cards bottom-aligned rather
   than leaving one short card floating against a tall neighbour. */
.home-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:stretch;}
.home-cell{display:flex;min-width:0;grid-column:1/-1;}
/* A card that decides it has nothing honest to say returns null, which would
   otherwise leave its wrapper behind as a grid gap. Cards guard themselves
   (the trend pair needs both enough periods AND a non-zero baseline), so the
   wrapper has to follow the card rather than duplicate its conditions. */
.home-cell:empty{display:none;}
.home-cell>*{flex:1;min-width:0;}
.home-grid>.cell-hero{order:1;}
.home-grid>.cell-portfolio{order:2;}
.home-grid>.cell-budget{order:3;}
.home-grid>.cell-savings{order:4;}
.home-grid>.cell-goals{order:5;}
/* The two trend cards read after the "right now" ones — you ask "am I
   overspending today" before "am I drifting over months". Absent entirely
   until three completed periods exist. */
.home-grid>.cell-lifestyle{order:6;}
.home-grid>.cell-savingstrend{order:7;}
/* Mobile uses the floating + button instead (never both at once). */
.home-grid>.cell-qa{display:none;}
@media(min-width:768px){
  .home-grid>.cell-portfolio{grid-column:span 3;order:2;}
  .home-grid>.cell-savings{grid-column:span 3;order:3;}
  .home-grid>.cell-budget{grid-column:span 3;order:4;}
  .home-grid>.cell-goals{grid-column:span 3;order:5;}
  .home-grid>.cell-lifestyle{grid-column:span 3;order:6;}
  .home-grid>.cell-savingstrend{grid-column:span 3;order:7;}
  .home-grid>.cell-qa{display:flex;order:8;}
}
@media(min-width:1024px){
  .home-grid>.cell-portfolio{grid-column:span 4;}
  .home-grid>.cell-savings{grid-column:span 2;}
}
/* Home's own FAB: mobile-only, and only on the Home tab (App suppresses its
   global FAB there). Above 768px the in-grid Quick Actions bar takes over, so
   the floating button disappears — the two are never visible together. */
@media(min-width:768px){.home-fab{display:none!important;}}
/* Equal-height cards: the card root fills its stretched cell, and whichever
   child is marked .home-fill (a chart, usually) absorbs the leftover height
   so a tall row never leaves a dead blank band inside a short card. */
.home-card{display:flex;flex-direction:column;height:100%;box-sizing:border-box;}
.home-fill{flex:1;min-height:0;}
/* Cards that drill into a tab: same neumorphic shell, just a light press
   affordance so it reads as tappable without introducing a new style. */
.home-tappable{transition:transform .15s ease,opacity .15s ease;}
.home-tappable:active{transform:scale(.985);}
.home-tappable:focus-visible{outline:2px solid var(--gr,#1E6E5C);outline-offset:2px;}
/* Mobile keeps trend charts short so Net Worth, Portfolio and part of Budget
   all land on the first screen; they grow back on wider layouts where the
   extra height is what keeps side-by-side cards level. */
@media(max-width:767px){
  /* Fixed height, and opt out of .home-fill's flex growth — a max-height alone
     would let the flex basis collapse the chart to nothing. */
  .home-spark{flex:0 0 auto!important;height:46px!important;min-height:0!important;}
}
/* Hero: stacked on mobile; figures | trend side by side once there's width,
   so the full-bleed row stops being mostly empty space. */
.hero-split{display:grid;grid-template-columns:1fr;gap:8px;}
@media(min-width:768px){
  .hero-split{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:end;}
}

#root{padding-top:env(safe-area-inset-top);}

/* ── Floating action button ──
   Shared by App's global FAB and Home's own FAB (mutually exclusive, never
   both mounted). Fixed position with all four safe-area insets respected so
   it never drifts under a notch/home-indicator on the sides either. Callers
   still own their bottom/onClick — this only standardizes size/shadow/inset math. */
.fab-btn{
  position:fixed;
  right:calc(env(safe-area-inset-right) + 16px);
  /* clears the fixed bottom nav rather than sitting on top of it */
  bottom:calc(env(safe-area-inset-bottom) + var(--bottom-nav-h) + 16px);
  /* above the bottom nav (30), below .sheet-bg/.modal-bg (40). It used to be
     70, which floated it over every open sheet's scrim — visually wrong and
     still tappable through the overlay. */
  z-index:35;width:56px;height:56px;border-radius:999px;color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(12,22,40,.35);cursor:pointer;
}

/* ── Bottom tab bar ──
   Fixed, thumb-reachable navigation. Replaces a wrapping row of 11 ~30px
   pills that sat in normal document flow under the header: on a phone that
   was four to five rows of chrome before any content began, and because it
   scrolled away with the page, switching tabs from halfway down a long view
   meant scrolling back to the top first. Five primary destinations plus a
   More button; everything else lives in the More sheet.
   z-index 30 is deliberately *below* .sheet-bg/.modal-bg (40) so an open
   dialog covers the bar instead of leaving it floating over the scrim. */
:root{--bottom-nav-h:56px;}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  background:var(--glassBgStrong);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-top:1px solid var(--glassBorder);
}
/* The bar spans the window (so the glass reaches both edges) but the row of
   destinations is capped and centred — full-width on a laptop would fling
   six items across 1400px. On a phone the cap never binds. */
.bottom-nav-inner{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  max-width:560px;margin:0 auto;
}
.bottom-nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:var(--bottom-nav-h);min-height:44px;
  border:none;background:transparent;padding:0 2px;cursor:pointer;
  font-size:10px;font-weight:600;line-height:1;
  min-width:0;
}
/* the global button:active scale would shrink the whole cell — too loud for
   a bar you tap constantly; the color change is enough feedback. */
.bottom-nav-btn:active{transform:none;}
.bottom-nav-btn>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* More sheet: destinations as a two-column grid of tappable rows. */
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.more-item{
  display:flex;align-items:center;gap:10px;
  padding:14px 12px;min-height:56px;border:none;border-radius:14px;
  font-size:14px;font-weight:600;text-align:left;cursor:pointer;min-width:0;
}
.more-item>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── Status pill (Tracked / Not tracked, etc.) ──
   One shape for every on/off status badge: same height, padding, icon gap,
   type and radius — only the color+bg (passed via inline style) differs. */
.status-pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:0 10px;height:28px;font-size:11px;font-weight:600;line-height:1;
  white-space:nowrap;box-sizing:border-box;
}

/* ── Segmented control (Home profile toggle: Me / Wife / Household) ──
   Fixed overall width + equal-width columns so switching segments never
   resizes or reflows the row; a single absolutely-positioned indicator
   slides between columns instead of each button re-styling itself. */
.seg-control{
  position:relative;display:grid;grid-template-columns:repeat(3,1fr);
  width:220px;max-width:100%;background:var(--sfA);border-radius:999px;padding:3px;
  flex-shrink:0;
}
.seg-indicator{
  position:absolute;top:3px;left:3px;bottom:3px;width:calc((100% - 6px)/3);
  border-radius:999px;transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s ease;
  z-index:0;
}
.seg-btn{
  position:relative;z-index:1;border:none;background:transparent;border-radius:999px;
  padding:4px 4px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:color .15s;min-width:0;
}
@media(max-width:380px){.seg-control{width:100%;}}

/* ── Transaction row (Amount | Status | Dropdown | Delete) ──
   Name/note takes the flexible middle column; amount/status/dropdown/delete
   never shrink below a usable size and never wrap onto their own line, so
   the row degrades by truncating the name text first, not by clipping the
   trailing controls. */
.tx-row{display:flex;align-items:center;gap:8px;padding:10px 16px;box-sizing:border-box;max-width:100%;}
.tx-row-main{flex:1 1 auto;min-width:0;}
.tx-row-amount{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.tx-row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}

.loader{width:32px;height:32px;border:3px solid #DADEE0;border-top-color:#1E6E5C;border-radius:50%;animation:spin .8s linear infinite;}

<script type="text/babel" data-presets="react">
const{useState,useEffect,useMemo,useRef,useCallback}=React;
/* Renders children directly onto document.body instead of in the normal DOM

   wrapped in an entrance-animation div whose transform never fully clears
   (fill-mode "both" keeps translateX(0) applied after the animation ends),
   which silently turns that div into the containing block for *all*
   position:fixed descendants — so "fixed" modals inside it end up anchored
   to the scrollable page instead of the viewport. Portaling to <body> sidesteps
   that entirely. */
function Portal({children}){
  return ReactDOM.createPortal(children,document.body);
}
const _RC=(typeof Recharts!=='undefined')?Recharts:window.Recharts||{};
const{ResponsiveContainer,LineChart,Line,AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip}=_RC;

/* ── Animation helpers ── */

/* Flash a DOM node's class briefly when a value changes */
function useFlash(val,ref){
  const prev=useRef(val);
  useEffect(()=>{
    if(prev.current===val){return;}
    prev.current=val;
    const el=ref.current;
    if(!el)return;
    el.classList.remove("num-flash");
    // force reflow so re-adding the class restarts the animation
    void el.offsetWidth;
    el.classList.add("num-flash");
    const t=setTimeout(()=>el.classList.remove("num-flash"),400);
    return()=>clearTimeout(t);
  },[val]);
}

/* Locks background scroll while a modal/sheet is open, in a way that
   actually survives iOS Safari. The CSS-only `body:has(.sheet-bg){overflow:
   hidden}` approach doesn't reliably hold the scroll position on iOS — the
   page can snap back to the top when the sheet closes (or even while open,
   if the keyboard toggles). Pinning the body with position:fixed and a
   negative top offset, then restoring scrollTo on close, is the fix that
   actually holds on iOS. Wired to every .sheet-bg instance in the app —
   confirmed working on the Add/Edit Transaction sheet, then rolled out. */
/* Refcounted, because sheets nest: Settings holds a lock and can open the
   pay-period date sheet (and a ConfirmDialog) on top of itself. With a
   per-instance savedY the inner sheet's cleanup cleared body.style.position
   while Settings was still open, and restored a savedY it had read as 0
   (body was already position:fixed when it mounted) — the page jumped to the
   top under a still-open modal. Only the OUTERMOST lock owns the scroll
   position, so the counter and the Y both live at module scope. */
let scrollLockCount=0,scrollLockY=0;
function useScrollLock(active){
  useEffect(()=>{
    if(!active)return;
    const{body}=document;
    if(scrollLockCount===0){
      scrollLockY=window.scrollY||document.documentElement.scrollTop||0;
      body.style.position="fixed";
      body.style.top=`-${scrollLockY}px`;
      body.style.left="0";
      body.style.right="0";
      body.style.width="100%";
    }
    scrollLockCount++;
    return()=>{
      scrollLockCount--;
      if(scrollLockCount>0)return;   // an outer sheet still holds it
      body.style.position="";
      body.style.top="";
      body.style.left="";
      body.style.right="";
      body.style.width="";
      window.scrollTo(0,scrollLockY);
    };
  },[active]);
}

/* Wires up the a11y a .sheet-bg/.sheet dialog was missing: Escape closes it,
   role="dialog"/aria-modal marks it for screen readers, and focus moves into
   the panel on open so keyboard users aren't left tabbing through the page
   behind it. Attach the returned ref to the .sheet panel itself. */
function useDialogA11y(onClose,active=true){
  const ref=useRef(null);
  useEffect(()=>{
    if(!active)return;
    if(ref.current)ref.current.focus();
    const onKey=e=>{if(e.key==="Escape"&&onClose)onClose();};
    document.addEventListener("keydown",onKey);
    return()=>document.removeEventListener("keydown",onKey);
  },[active]);

/* ── Which tabs go where ──
   PRIMARY are the five in the bottom bar; MORE live behind the More sheet.
   Chosen from actual weekly use, not from what the data model happens to
   contain: Bills is touched a few times a month, Household only when the
   split changes, Currency rarely. Net Worth moved to More because Home now
   owns the "how rich am I" question and Home already links straight into it
   (as it does for Goals).
   HIDDEN is reachable by code but has no nav entry. Forecast (`targets`)
   sits here: the tab was retired, but its view and `data.targets` stay put
   — deleting them would orphan saved records and mean touching
   CONFLICT_COLLECTIONS for no user-visible gain. Note this does make the
   Forecast view unreachable from the UI; that was the explicit ask. */
const PRIMARY_TABS=["home","budget","expenses","banks","investments"];
const MORE_TABS=["networth","goals","installments","advisor","bills","household","currency"];

   Every tab must appear here, including "home" — it was missing, so
   indexOf returned -1 and every transition into or out of Home computed its
   slide direction against a phantom position before the first tab. */
const TAB_ORDER=[...PRIMARY_TABS,...MORE_TABS,...HIDDEN_TABS];
function TabPane({tab,children}){
  const prevTab=useRef(tab);
  const dir=useRef("right");
  if(prevTab.current!==tab){
    const pi=TAB_ORDER.indexOf(prevTab.current);
    const ci=TAB_ORDER.indexOf(tab);
    dir.current=ci>pi?"right":"left";
    prevTab.current=tab;

  return <div key={tab} className={cls}>{children}</div>;
}

/* Staggered fade-up wrapper for a list of items */
function FadeList({items,renderItem,keyFn}){
  return items.map((item,i)=>(
    <div key={keyFn?keyFn(item):i} className={`fade-up-${Math.min(i+1,5)}`}>
      {renderItem(item,i)}

  useScrollLock(open);

            style={{width:"100%",borderRadius:12,padding:"12px 0",fontSize:14,fontWeight:600,border:`1px solid ${P.line}`,

    </div>
    </Portal>

}

const formatMoney=(n,{code,symbol,decimals=0}={})=>{

  return symbol?`${symbol}${v}`:`${code} ${v}`;

/* inline math evaluator for amount fields — only allows digits/operators/parens,
   evaluates via Function constructor, and falls back to the previous value on
   anything invalid (empty, unsafe chars, NaN, division errors, etc). */
const MATH_CHARS_RE=/^[0-9+\-*/. ()]+$/;
const evalMathExpr=(raw,fallback=0)=>{
  if(raw==null)return fallback;
  const s=String(raw).trim();
  if(s==="")return fallback;
  if(!MATH_CHARS_RE.test(s))return Number(s)||fallback;
  try{
    const val=new Function("return ("+s+")")();
    return(typeof val==="number"&&isFinite(val))?val:fallback;
  }catch(e){return fallback;}
};
/* NumField — a numeric field that can actually be emptied.
   `<input type="number" value={n} onChange={e=>set(Number(e.target.value))}/>`
   is a trap: Number("") is 0, so backspacing the last digit writes 0 straight
   back into state and React repaints "0". The box can never be blank, and
   replacing a value means selecting the leftover 0 first or you end up
   typing "0500". Roughly 25 fields across the app had that shape.
   This keeps keystrokes in a local string draft, leaves the real state alone
   until blur/Enter, and commits through evalMathExpr — so "1200+350" works
   here too, matching the expense form (see submitTx) and UpdateBalanceSheet.
   Focus selects the current text, so tapping a field and typing replaces it.
   Blur on an emptied box restores the previous value rather than writing 0:
   clearing is nearly always a prelude to typing, not an edit in itself. Pass
   allowEmpty for fields that are legitimately blank when unset (an MP2
   principal that hasn't been entered yet is not the same as one worth 0).
   type is "text" + inputMode so phones still get a numeric keypad, without
   the desktop spinner, and so operators can be typed at all.
   `live` also commits on every keystroke. Needed wherever something outside
   the field reacts to the value before blur — a submit button gated on
   `disabled={!valid}` (tapping a disabled button doesn't reliably blur the
   field, so a blur-only commit strands you with a filled box and a dead
   button) or a running conversion/preview. The draft still drives what's
   displayed, so emptying the box still shows empty.
   `navGroup` makes Enter commit and jump to the next field carrying the same
   group, in document order. Budget's monthly sweep is ~21 amounts down a
   list; without this every one costs dismissing the keyboard, scrolling and
   tapping the next box. */
function NumField({value,onCommit,allowEmpty=false,integer=false,min,max,live=false,navGroup,
                   inputMode="decimal",onFocus,onBlur,onKeyDown,step,...rest}){
  const[draft,setDraft]=useState(null);
  const shown=draft!==null?draft:(value==null?"":String(value));
  const parse=raw=>{
    let v=evalMathExpr(raw,Number(value)||0);
    if(integer)v=Math.round(v);
    if(min!=null)v=Math.max(min,v);
    if(max!=null)v=Math.min(max,v);
    return v;
  };
  const commit=e=>{
    if(draft!==null){
      const t=draft.trim();
      setDraft(null);
      if(t===""){ if(allowEmpty)onCommit(""); }
      else onCommit(parse(t));
    }
    onBlur&&onBlur(e);
  };
  return<input type="text" inputMode={inputMode} value={shown} data-numnav={navGroup||undefined}
    onChange={e=>{
      const raw=e.target.value;
      setDraft(raw);
      if(!live)return;
      const t=raw.trim();
      if(t==="")onCommit(allowEmpty?"":0);
      else onCommit(parse(t));
    }}
    onFocus={e=>{e.target.select();onFocus&&onFocus(e);}}
    onBlur={commit}
    onKeyDown={e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const el=e.currentTarget;
        el.blur();  // commits through the handler above
        if(navGroup){
          const all=[...document.querySelectorAll(`[data-numnav="${navGroup}"]`)];
          const next=all[all.indexOf(el)+1];
          if(next)next.focus();
        }
      }
      onKeyDown&&onKeyDown(e);
    }}
    {...rest}/>;
}

/* ── Pay-period utilities ──────────────────────────────────────────────────
   Pay-periods are an opt-in alternative to calendar-month budgeting, for
   people whose salary lands on a fixed day rather than the 1st. A period is
   identified by a "period key" — the ISO date (YYYY-MM-DD) of its START day
   — so it sorts and compares like any other date string. When pay-periods
   are off for an owner, the rest of the app keeps using plain "YYYY-MM"
   calendar-month keys exactly as before; these utilities are only called
   when `payPeriod.enabled` is true for that owner.

   "payday" = day of month (1-31) salary arrives; the period covering a given
   date runs from that day through the day before the same day next month.
   A payday beyond a short month (e.g. 31 in February) clamps to the last
   actual day of that month, the conventional way to handle this.

   ── Actual starts (2026-07-31) ────────────────────────────────────────────
   Salary doesn't always land on payday. `cfg.actualStarts` is a map of
   NOMINAL period key → the day that period really began:

     actualStarts: {"2026-08-28":"2026-08-24"}   // arrived four days early
     actualStarts: {"2026-08-28":"2026-08-31"}   // arrived three days late

   The critical rule: **a period's KEY stays derived from `payday` forever.**
   Only its boundaries move. Keying by the real start would change a period's
   identity the moment it was corrected and orphan every expense pointing at
   it. So payday is the default and this map records reality where it differed.

   One override moves TWO boundaries — it is period K's start and period K−1's
   end — so a period STRETCHES rather than sliding: correcting August to have
   begun three days early makes August Jul 29–Aug 31 (34 days) and shortens
   July to Jul 1–Jul 28. It does not cascade; September still starts nominally.

   Every value here is a plain YYYY-MM-DD string. migrate() sanitises anything
   else out, so this layer never has to defend against a non-date.

   That also means these functions now take the owner's whole pay-period
   CONFIG, not a bare payday number. The bucket* wrappers below already had the
   config in hand, so this is a change of what they pass down, not a change of
   what views call. Everything reads through periodRange(), so a corrected
   boundary propagates to labels, lengths, progress and bucketing at once.

   Periods are NOT pro-rated: a 24-day period keeps its full monthly category
   amounts, which is the entire point — the daily allowance rises and Home
   stops reading an early payday as overspending. ─────────────────────────── */

/* Last valid calendar day of a given year/month (month is 1-12) */
function daysInCalMonth(y,m){return new Date(y,m,0).getDate();}

/* Resolve a payday (1-31) against a specific year/month, clamping to the
   month's last real day so "31" in February becomes that February's 28/29. */
function clampPayday(y,m,payday){return Math.min(Math.max(1,Number(payday)||1),daysInCalMonth(y,m));}

/* Accepts either a config object ({payday,actualStarts,…}) or a bare payday
   number, so a stray numeric caller degrades to "no overrides" rather than
   silently reading `undefined.payday` and bucketing everything into day 1. */
function asPeriodCfg(cfg){
  if(cfg&&typeof cfg==="object")return cfg;
  return{payday:cfg};
}
const dateToKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const keyToDate=k=>{const[y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d);};
const addDaysTo=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* Build a Date for the NOMINAL period start that contains `dateStr` — payday
   arithmetic only, no overrides. The identity layer everything else builds on. */
function periodStartFor(dateStr,cfg){
  const payday=asPeriodCfg(cfg).payday;
  const d=new Date(dateStr+"T00:00:00");
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const thisMonthPayday=clampPayday(y,m,payday);
  if(day>=thisMonthPayday){
    return new Date(y,m-1,thisMonthPayday);
  }
  // falls before this month's payday → belongs to the period that started last month
  const py=m===1?y-1:y, pm=m===1?12:m-1;
  return new Date(py,pm-1,clampPayday(py,pm,payday));
}
function nominalKeyFor(dateStr,cfg){return dateToKey(periodStartFor(dateStr,cfg));}

/* Step a period key n nominal periods. Keys are nominal identities, so this
   is pure payday arithmetic and is deliberately NOT affected by overrides —
   the period after "2026-08-28" is "2026-09-28" however early it began. */
function shiftPeriod(periodKey,cfg,n){
  const payday=asPeriodCfg(cfg).payday;
  let[y,m,d]=String(periodKey||"").split("-").map(Number);
  if(!y||!m||!d)[y,m,d]=nominalKeyFor(todayISO(),cfg).split("-").map(Number);
  const tm=m-1+n;                       // month index, may go negative or >11
  const ty=y+Math.floor(tm/12), tmm=((tm%12)+12)%12+1;
  return dateToKey(new Date(ty,tmm-1,clampPayday(ty,tmm,payday)));
}

/* The day a period really began: the override if there is one, otherwise the
   key itself. Always a YYYY-MM-DD string — a period always has a real start. */
function periodActualStart(periodKey,cfg){
  const c=asPeriodCfg(cfg);
  const raw=(c.actualStarts||{})[periodKey];
  if(typeof raw==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
  return periodKey;
}

/* {start,end} Date objects (inclusive) for the period identified by a key.
   A period runs from its own real start to the day before the NEXT period's
   real start, so moving one boundary correctly resizes both neighbours. */
function periodRange(periodKey,cfg){
  const c=asPeriodCfg(cfg);
  let key=periodKey;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(key||""))){
    // Malformed or stale key — e.g. a calendar-month key ("YYYY-MM") briefly
    // passed in for one render right as pay-periods finish loading/turn on,
    // before the owning view's re-anchoring effect has run. Falling back to
    // the period containing today (instead of building an Invalid Date,
    // which throws once it hits toLocaleDateString) is what was producing
    // the stuck "Invalid Date" budget header.
    key=nominalKeyFor(todayISO(),c);
  }
  // Deliberately does NOT read the clock: a period's extent is a pure function
  // of (key,cfg), so labels, lengths and bucketing are the same all day and the
  // history/snapshot effects can't loop on a boundary that moves at midnight.
  const start=keyToDate(periodActualStart(key,c));
  const end=addDaysTo(keyToDate(periodActualStart(shiftPeriod(key,c,1),c)),-1);
  return{start,end};
}

/* The period KEY containing a given date. With no overrides configured this
   is exactly the nominal answer and costs exactly what it always did; the
   candidate scan only runs for owners who have actually corrected a period. */
function periodKeyFor(dateStr,cfg){
  const c=asPeriodCfg(cfg);
  const nominal=nominalKeyFor(dateStr,c);
  const overrides=c.actualStarts;
  if(!overrides||!Object.keys(overrides).length)return nominal;
  // A moved boundary can push a date into either neighbour, never further:
  // an override may not cross a whole period (see periodStartValidity).
  const d=keyToDate(dateStr);
  for(const k of[shiftPeriod(nominal,c,-1),nominal,shiftPeriod(nominal,c,1)]){
    const{start,end}=periodRange(k,c);
    if(d>=start&&d<=end)return k;
  }
  return nominal;
}

/* Number of days in a period (inclusive of both ends) */
function periodLength(periodKey,cfg){
  const{start,end}=periodRange(periodKey,cfg);
  return Math.max(1,Math.round((end-start)/86400000)+1);
}

/* Human label for a period: "Jun 28 – Jul 27, 2026" */
function periodLabel(periodKey,cfg){
  const{start,end}=periodRange(periodKey,cfg);
  const sameYear=start.getFullYear()===end.getFullYear();
  const startStr=start.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  if(sameYear){
    const endStr=end.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    return`${startStr} – ${endStr}, ${end.getFullYear()}`;
  }
  // crosses a year boundary: show both years explicitly, e.g. "Dec 28, 2025 – Jan 27, 2026"
  const startWithYear=start.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const endWithYear=end.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  return`${startWithYear} – ${endWithYear}`;
}

/* Today's date as YYYY-MM-DD, local time */
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

/* Is `dateStr` a legal real start for the period `periodKey`?
   Two bounds, both of which keep periodKeyFor's three-candidate scan sound —
   an override may shift a boundary but never swallow a whole period:
     • not before the PREVIOUS period's start (+1 day), or the previous period
       would vanish and its expenses would have nowhere to live
     • not in the future — you can't record a salary that hasn't landed */
function periodStartValidity(periodKey,cfg,dateStr){
  const c=asPeriodCfg(cfg);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr||"")))return{ok:false,why:"Pick a date."};
  const d=keyToDate(dateStr);
  const today=keyToDate(todayISO());
  if(d>today)return{ok:false,why:"That's in the future."};
  const prevKey=shiftPeriod(periodKey,c,-1);
  const prevStart=periodRange(prevKey,c).start;
  const floor=addDaysTo(prevStart,1);
  if(d<floor)return{ok:false,why:`Can't start before ${floor.toLocaleDateString("en-US",{month:"short",day:"numeric"})} — that's the previous period.`};
  return{ok:true};
}

/* Set / clear one period's real start. Returns a NEW payPeriods object.
   Clearing removes the key entirely rather than storing the nominal date, so
   "no override" and "corrected back to payday" can't drift apart, and the
   fast path in periodKeyFor keeps working for owners with nothing recorded. */
function withActualStart(payPeriods,owner,periodKey,value){
  const all=payPeriods||{};
  const cfg=all[owner]||{};
  const next={...(cfg.actualStarts||{})};
  if(value==null)delete next[periodKey];
  else next[periodKey]=value;
  return{...all,[owner]:{...cfg,actualStarts:next}};
}

/* ── Unified period helpers — these are what views actually call.
   They check the owner's payPeriod settings and transparently fall back to
   plain calendar-month bucketing ("YYYY-MM") when pay-periods are off,
   so existing calendar-month logic and stored data are untouched. ───────── */
function ownerUsesPayPeriod(payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  return!!(cfg&&cfg.enabled&&cfg.payday);
}
/* Each wrapper hands the WHOLE config down, not cfg.payday, so the period
   layer can consult cfg.actualStarts. That indirection is why adding
   corrected boundaries touched one call site outside this block instead of
   every view in the app. */
function bucketKeyFor(dateStr,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return periodKeyFor(dateStr,cfg);
  return(dateStr||"").slice(0,7);
}
function bucketLabel(bucketKey,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return periodLabel(bucketKey,cfg);
  const[y,mo]=bucketKey.split("-");
  return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
}
function bucketShift(bucketKey,payPeriods,owner,n){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return shiftPeriod(bucketKey,cfg,n);
  const[y,m]=bucketKey.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function bucketNow(payPeriods,owner){
  return bucketKeyFor(todayISO(),payPeriods,owner);
}
/* Days elapsed / total in the CURRENT bucket, for burn-rate projections.
   For calendar months this is identical to the old daysInMonth/dayOfMonth
   logic; for pay-periods it uses the period's actual start/end. */
function bucketProgress(bucketKey,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday){
    const{start,end}=periodRange(bucketKey,cfg);
    const total=periodLength(bucketKey,cfg);
    const now=new Date();now.setHours(0,0,0,0);
    const elapsed=Math.max(1,Math.min(total,Math.round((now-start)/86400000)+1));
    return{elapsed,total};
  }
  const[y,m]=bucketKey.split("-").map(Number);
  const total=daysInCalMonth(y,m);
  const elapsed=new Date().getDate();
  return{elapsed,total};
}

/* ── Which plan applies to a bucket ────────────────────────────────────────
   A month with its own monthlyPlans mapping uses it. Otherwise the chain walks
   BACKWARDS to the nearest preceding month that has one, and only falls back
   to activePlanId[owner] when nothing precedes it at all.

   Walking backwards is the whole point. Resolving every unmapped month to the
   single active plan meant editing this month retroactively changed what last
   March displayed — the same base plan was answering for all of them — so
   Home's trend cards were comparing today's budget against itself. It also
   made "plan two months ahead" impossible: September could only ever show the
   base plan, never August's actual plan. Both fall out of this one change.

   Keys sort lexicographically in both bucket modes: "2026-03" (calendar) and
   "2026-03-28" (pay period). Mixing them across a mode switch still orders
   correctly — "2026-03" < "2026-03-28" < "2026-04" — so a period beginning in
   March inherits March's calendar-month plan. That is intended, not an
   accident of string comparison; don't "fix" it by shape-matching the keys.

   Two skip rules, both deliberate:
   • A tombstoned mapping (planId:null + deletedAt, written by
     removePlanForMonth) is ignored entirely rather than terminating the walk.
     "Remove this month's custom plan" means the month goes back to inheriting,
     not that everything after it falls off a cliff.
   • A mapping pointing at a plan that no longer resolves (soft-deleted here,
     or tombstoned by a sync from another device) is skipped and the walk
     continues. Same reasoning as clonePlanForMonth's missing `||plans[0]`
     fallback: a plausible wrong budget is worse than none — but an older real
     mapping is better than either. ────────────────────────────────────────── */
/* ── A plan's categories and groups are records, not array positions ────────
   Two devices editing DIFFERENT categories in the same month used to lose one
   side: `plans` merged whole-record, newest `updatedAt` wins. Merging them
   per-record needs two things the old shape couldn't express.

   1. DELETION. `removeCat` used to hard-delete, so a union merge would
      resurrect a category the other person deleted — trading a lost edit for a
      resurrected delete, which is no better. Categories and groups are now
      tombstoned (`deletedAt`) like every other collection in this app.

   2. ORDER. Category order is user-controlled ("Reorder categories" moves them
      up and down) and it lived in array position — but `mergeArrayById` sorts
      by id, so any merge would scramble it. Same lesson as transactions
      (`compareTxForDisplay`): order has to live in a FIELD. Hence `ord`,
      backfilled once by `migrate()`.

   `livePlanView` is the canonical read shape: tombstones filtered, order
   applied. Applied at `resolvePlanForMonth` so every reader gets it for free
   rather than 37 call sites each remembering to filter. It returns the
   IDENTICAL object when there's nothing to do — same rule as the bills
   reconciler — so render identity doesn't churn on the common path.
   Writers go through `editPlanForMonth`, which operates on the raw record and
   therefore still sees tombstones. */
const PLAN_ORD_LAST=1e9;
const planOrdOf=x=>(x&&typeof x.ord==="number"&&isFinite(x.ord))?x.ord:PLAN_ORD_LAST;
function comparePlanRecords(a,b){
  const oa=planOrdOf(a),ob=planOrdOf(b);
  if(oa!==ob)return oa-ob;
  return String(a&&a.id||"").localeCompare(String(b&&b.id||""));
}
function livePlanView(plan){
  if(!plan)return plan;
  const cats=plan.categories||[],grps=plan.groups||[];
  const liveCats=cats.filter(c=>!c.deletedAt),liveGrps=grps.filter(g=>!g.deletedAt);
  const sortedCats=[...liveCats].sort(comparePlanRecords);
  const sortedGrps=[...liveGrps].sort(comparePlanRecords);
  const same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
  if(same(sortedCats,cats)&&same(sortedGrps,grps))return plan;
  return{...plan,categories:sortedCats,groups:sortedGrps};
}
/* Stamps `updatedAt` on the categories/groups that actually changed, and gives
   any new one an `ord`. Called from editPlanForMonth — the one choke point
   every budget mutation already goes through — rather than from each mutator,
   for the same reason the copy-on-write decision lives there. */
function stampPlanRecords(prev,next,now){
  if(!next)return next;
  const stampArr=(prevArr,nextArr)=>{
    const before=new Map((prevArr||[]).map(x=>[x.id,x]));
    let maxOrd=-1;
    (nextArr||[]).forEach(x=>{const o=planOrdOf(x);if(o!==PLAN_ORD_LAST&&o>maxOrd)maxOrd=o;});
    let touched=false;
    const out=(nextArr||[]).map(x=>{
      const b=before.get(x.id);
      if(b&&JSON.stringify(b)===JSON.stringify(x))return x;
      touched=true;
      const withOrd=planOrdOf(x)===PLAN_ORD_LAST?{...x,ord:++maxOrd}:{...x};
      return{...withOrd,updatedAt:now};
    });
    return touched?out:nextArr;
  };
  const categories=stampArr(prev&&prev.categories,next.categories);
  const groups=stampArr(prev&&prev.groups,next.groups);
  if(categories===next.categories&&groups===next.groups)return next;
  return{...next,categories,groups};
}

function resolvePlanForMonth(monthlyPlans,mo,owner,activePlanId,plans){
  const live=(plans||[]).filter(p=>!p.deletedAt);
  const byId=id=>live.find(p=>p.id===id)||null;
  const preceding=(monthlyPlans||[])
    .filter(m=>m&&m.owner===owner&&!m.deletedAt&&m.planId&&String(m.month)<=String(mo))
    .sort((a,b)=>String(b.month).localeCompare(String(a.month)));   // newest first
  for(const m of preceding){
    const p=byId(m.planId);
    if(p)return{plan:livePlanView(p),fromMonth:m.month,exact:String(m.month)===String(mo),source:"chain"};
  }
  const base=byId((activePlanId||{})[owner])
          ||live.find(p=>p.owner===owner)
          ||live[0]||null;
  return{plan:livePlanView(base),fromMonth:null,exact:false,source:"base"};
}

/* Deep-clone a plan record for a new month. Pure: takes an id factory, returns
   the record, writes nothing. Split out of clonePlanForMonth so copy-on-write
   can fold the clone and the user's edit into ONE setData, and so the orphan
   rescue and amount re-derive can be unit-tested directly.

   `preserveIds` keeps the source's category/group/sub ids instead of minting
   new ones, and copy-on-write REQUIRES it. The UI reads the inherited plan and
   hands a mutator that category's id; if the clone renumbers everything, that
   id matches nothing, the mutation hits zero rows, and the no-op guard
   correctly concludes nothing changed — so deleting or renaming a category in
   a carried-forward month silently did nothing at all, while "add category"
   and "set income" (which reference no existing id) worked fine.

   Preserving ids is also the truer model: a carried-forward September IS the
   same budget as August, so its "Groceries" is the same envelope — which
   matters because expenses key on `catId`, so any transaction already logged
   into that month stays attached instead of being orphaned by the copy.
   Write-through to the source is prevented by the deep clone of the objects
   and arrays, not by renumbering — the ids were never what made it safe. */
function clonePlanRecord(source,mkId,owner,label,mo,{preserveIds=false}={}){
  const idFor=old=>preserveIds?old:mkId();
  // migrate() doesn't guarantee either array exists; an unguarded .map here
  // threw *before* setData, so the copy silently did nothing.
  const srcGroups=source.groups||[];
  const srcCats=source.categories||[];
  const newId=mkId();
  // `label` lets the caller supply a bucket-aware display name (calendar
  // month OR pay-period range); falls back to the old calendar-month-only
  // parsing if no label is given, for any caller that hasn't been updated.
  const derivedLabel=label||(()=>{
    const parts=String(mo).split("-");
    return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  })();
  // deep-clone groups and categories so edits don't affect source
  const groups=srcGroups.map(g=>({...g,id:idFor(g.id)}));
  const groupIdMap={};
  srcGroups.forEach((g,i)=>{groupIdMap[g.id]=groups[i].id;});
  /* Orphan rescue. This used to be `groupIdMap[c.groupId]||c.groupId`, which
     left a category pointing at the *source* plan's group id — an id that
     doesn't exist in the clone. Every renderer walks groups→categories, so
     those categories and all their sub-items became invisible in the copy
     while `allocated` (which sums all categories) still counted them: the
     "some subcategories are missing, some amounts differ" bug. Park them in
     a synthesized group instead, created only if something needs it. */
  let orphanGid=null;
  const categories=srcCats.map(c=>{
    let gid=groupIdMap[c.groupId];
    if(!gid){
      if(!orphanGid){orphanGid=mkId();groups.push({id:orphanGid,name:"Ungrouped"});}
      gid=orphanGid;
    }
    const subs=(c.subs||[]).map(s=>({...s,id:idFor(s.id)}));
    // re-derive the cached amount from the subs (same rule as syncAmt in
    // BudgetView) so a source whose cache had drifted can't carry the
    // inconsistency into the copy.
    const amount=subs.length>0?subs.reduce((s,x)=>s+(Number(x.amount)||0),0):(Number(c.amount)||0);
    return{...c,id:idFor(c.id),groupId:gid,subs,amount};
  });
  const cloned={...source,id:newId,name:derivedLabel,month:derivedLabel,groups,categories};
  delete cloned.deletedAt;
  cloned.owner=owner;
  return cloned;
}

/* Spend-status thresholds — hoisted to module scope so the Expenses tab and
   Home's Tracked Spending card colour envelopes by the exact same rule
   (green under 80%, amber from 80%, red at/over 100%) instead of each keeping
   its own copy. */
function spendStatusColor(spent,budget){
  if(budget===0)return P.sub;
  const r=spent/budget;
  if(r>=1)return P.red;
  if(r>=0.8)return"#E07B2A";
  return P.gr;
}
function spendStatusBg(spent,budget){
  if(budget===0)return P.sfA;
  const r=spent/budget;
  if(r>=1)return P.redS;
  if(r>=0.8)return P.amberS;
  return P.sfA;
}

/* ── Transaction display order ─────────────────────────────────────────────
   One comparator for every transaction list, because the period log and the
   per-envelope expand list drifting apart is exactly the kind of thing nobody
   notices until the same day reads two different ways on two screens.

   The order is: newer DAY first; within a day, the one entered most recently
   first; and a manual `ord` overrides entry order for a day that's been
   hand-arranged.

   `ord` is absent on unplaced rows and that absence is MEANINGFUL — an
   unplaced row sorts above every placed row of its day. That single rule is
   what makes two separate behaviours fall out for free: a transaction added
   after a day was reordered lands on top rather than silently at the end, and
   a transaction whose date is edited into a reordered day arrives at the
   newest position (updateExpenseTx deletes `ord` on a date change). So never
   "fix" the absence by defaulting it to a number.

   Order lives in these fields and never in array position: the sync merge
   re-sorts expenses by id (mergeArrayById) and fingerprint() canonicalizes
   with sortedById, so an array-position order would be silently erased the
   first time two devices synced. ──────────────────────────────────────────── */
function compareTxForDisplay(a,b){
  const da=(a&&a.date)||"",db=(b&&b.date)||"";
  if(da!==db)return db.localeCompare(da);
  const num=x=>(x&&typeof x.ord==="number"&&isFinite(x.ord))?x.ord:null;
  const oa=num(a),ob=num(b);
  if(oa===null&&ob!==null)return -1;      // unplaced is "newest"
  if(oa!==null&&ob===null)return 1;
  if(oa!==null&&ob!==null&&oa!==ob)return oa-ob;
  const ca=(a&&a.createdAt)||"",cb=(b&&b.createdAt)||"";
  if(ca!==cb)return cb.localeCompare(ca);
  /* Rows predating entry-order tracking all carry createdAt = date+T00:00:00Z
     (migrate), so every one of them ties here. Falling back to id keeps the
     order arbitrary but DETERMINISTIC and identical on every device — ids are
     synced — which beats leaving it to whatever order the merge happened to
     produce. Any day that actually matters can be arranged by hand. */
  return String((b&&b.id)||"").localeCompare(String((a&&a.id)||""));
}

/* "Today" / "Yesterday" / "Fri, Jul 31" for a day sub-header. Weekday included
   because "what did I spend on Saturday" is how people actually remember it. */
function dayLabel(dateStr){
  if(!dateStr)return"No date";
  const today=todayISO();
  if(dateStr===today)return"Today";
  const y=new Date(today+"T00:00:00");y.setDate(y.getDate()-1);
  if(dateStr===dateToKey(y))return"Yesterday";
  const d=new Date(dateStr+"T00:00:00");
  if(isNaN(d.getTime()))return dateStr;
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}

/* ── INSTALLMENTS ──────────────────────────────────────────────────────────
   Short-term purchase installments (Tabby, Tamara, Amazon, card pay-in-3/4).
   Deliberately NOT a loan system: no interest, no fees, no amortisation.

   Three collections own three different things and nothing owns two:
     data.installments        — the plan (what was bought, from whom, by whom)
     data.installmentPayments — the SCHEDULE: planned timing and amounts
     data.expenses            — the LEDGER: money that actually moved
   Budget owns none of them. It renders a *derived* group from the schedule
   (derivedInstallmentRowsFor) and stores no copy, because a plan category id
   is reminted every time a month's plan is cloned and would silently stop
   matching — the same trap that made Savings & Investing match by name.

   Nothing below stores a running total. Remaining balance, progress, "X of Y
   paid", next payment and overdue are ALL derived on read, so they cannot
   drift after an edit, a deletion, a sync merge or an early payoff. In
   particular "overdue" is never written: it is a function of (dueDate, today),
   so a schedule can't rot while a device is offline. The three stored payment
   states are only the ones a user action can cause.

   All of it is module scope and pure so installmenttest.cjs runs the shipped
   code rather than a copy. ─────────────────────────────────────────────────── */

/* Half a halala. Providers split totals unevenly (249.75 / 249.75 / 249.74),
   so the schedule editor compares against a tolerance, never for equality. */
const INSTALLMENT_ROUND_TOL=0.005;
/* Synthetic ids for the derived Budget group. Prefixed so they can never
   collide with a real plan group/category id, and so a stray write against one
   fails to find a target instead of corrupting a category. */
const INSTALLMENT_GROUP_ID="__installments__";
function installmentRowId(paymentId){return"inst:"+paymentId;}

/* Provider registry. `iconKey` names an entry in `I` — no remote logos, no
   scraped branding. "other" carries a free-text customProviderName. */
/* `bnpl` means the first payment falls due AT PURCHASE, not a month later — the
   Tabby/Tamara downpayment. It only ever seeds a default in the create sheet;
   nothing downstream branches on it, so adding a provider here is safe. */
const INSTALLMENT_PROVIDERS=[
  {key:"tabby",  label:"Tabby",       iconKey:"Layers",  color:"#5BC0A8", bnpl:true},
  {key:"tamara", label:"Tamara",      iconKey:"Layers",  color:"#C98BB9", bnpl:true},
  {key:"amazon", label:"Amazon",      iconKey:"Package", color:"#E0913A"},
  {key:"card",   label:"Credit card", iconKey:"Card",    color:"#6E8FD0"},
  {key:"other",  label:"Other",       iconKey:"Receipt", color:"#8C93A8"},
];
function installmentProvider(key){
  return INSTALLMENT_PROVIDERS.find(p=>p.key===key)||INSTALLMENT_PROVIDERS[INSTALLMENT_PROVIDERS.length-1];
}
function installmentProviderLabel(inst){
  if(!inst)return"";
  if(inst.provider==="other")return(inst.customProviderName||"").trim()||"Other";
  return installmentProvider(inst.provider).label;
}

/* Step an ISO date n calendar months, clamping to the target month's last day.
   Callers always step from the FIRST due date (addMonthsISO(first,i)), never
   iteratively, so a 31st never drifts to the 28th and stays there. */
function addMonthsISO(dateStr,n){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||""));
  if(!m)return String(dateStr||"");
  const total=Number(m[1])*12+(Number(m[2])-1)+(Number(n)||0);
  const y=Math.floor(total/12),mo=total-y*12+1;
  const day=Math.min(Number(m[3]),daysInCalMonth(y,mo));
  return`${String(y).padStart(4,"0")}-${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function roundTo(n,decimals){
  const f=Math.pow(10,Number(decimals)||0);
  return Math.round((Number(n)||0)*f)/f;
}

/* Propose an equal monthly split. The unavoidable rounding remainder goes into
   the FINAL payment (computed as total − the others, not as another rounded
   share), so the schedule sums to the original amount exactly rather than
   landing a cent or two off and blocking Save. Monthly only this release. */
function generateInstallmentSchedule({firstDueDate,count,total,decimals=2}){
  const n=Math.max(0,Math.floor(Number(count)||0));
  if(n===0)return[];
  const amt=Number(total)||0;
  const per=roundTo(amt/n,decimals);
  const rows=[];
  for(let i=0;i<n;i++){
    rows.push({sequence:i+1,
      dueDate:addMonthsISO(firstDueDate,i),
      scheduledAmount:i===n-1?roundTo(amt-per*(n-1),decimals):per});
  }
  return rows;
}

function scheduleTotal(rows){
  return(rows||[]).reduce((s,r)=>s+(Number(r&&r.scheduledAmount)||0),0);
}
/* Live validation for the schedule editor. `ok` is the Save gate — never an
   equality test, because a user typing exact provider amounts must be able to
   save a total that differs from the sum by float noise but not by money. */
function scheduleDiff(total,rows){
  const scheduledTotal=roundTo(scheduleTotal(rows),2);
  const originalAmount=roundTo(Number(total)||0,2);
  const difference=roundTo(scheduledTotal-originalAmount,2);
  return{originalAmount,scheduledTotal,difference,ok:Math.abs(difference)<=INSTALLMENT_ROUND_TOL};
}

/* An installment belongs to exactly ONE real person. "household" is a view
   across the app, never a third owner, and it is not an installment owner at
   all — a combined list would have no editable meaning and would let a plan,
   its budget row and its expense drift to different owners. */
function installmentsForOwner(insts,owner){
  if(owner!=="me"&&owner!=="wife")return[];
  return(insts||[]).filter(x=>x&&!x.deletedAt&&(x.owner||"me")===owner);
}
function installmentPaymentsFor(payments,installmentId){
  return(payments||[])
    .filter(p=>p&&!p.deletedAt&&p.installmentId===installmentId)
    .sort((a,b)=>(Number(a.sequence)||0)-(Number(b.sequence)||0));
}

/* Derived, never stored. "upcoming" past its due date reads as "overdue"
   WITHOUT touching the record — the schedule underneath stays exactly as the
   provider set it, so a late device or a paused app can't rewrite history. */
function installmentPaymentDerivedStatus(p,todayStr){
  if(!p)return"upcoming";
  if(p.status==="paid")return"paid";
  if(p.status==="cancelled")return"cancelled";
  const today=todayStr||todayISO();
  return(p.dueDate&&String(p.dueDate)<today)?"overdue":"upcoming";
}
const installmentPaymentIsOpen=p=>!!p&&p.status!=="paid"&&p.status!=="cancelled";

function installmentRemainingBalance(inst,pays){
  return(pays||[]).filter(installmentPaymentIsOpen)
    .reduce((s,p)=>s+(Number(p.scheduledAmount)||0),0);
}
function installmentPaidTotal(pays){
  return(pays||[]).filter(p=>p&&p.status==="paid")
    .reduce((s,p)=>s+(p.actualAmount!=null?Number(p.actualAmount)||0:Number(p.scheduledAmount)||0),0);
}
/* Progress is payment state, not elapsed calendar months — a plan three months
   old with nothing paid is 0%, and paying two at once moves it two steps.
   Cancelled rows leave the denominator (they were part of the deal) but are
   counted as closed so an early payoff reads as complete rather than stuck. */
function installmentProgress(pays){
  const live=(pays||[]).filter(p=>p&&!p.deletedAt);
  const total=live.length;
  const paid=live.filter(p=>p.status==="paid").length;
  const closed=live.filter(p=>!installmentPaymentIsOpen(p)).length;
  return{paid,total,closed,pct:total>0?Math.min(100,(closed/total)*100):0};
}
function installmentNextPayment(pays,todayStr){
  const open=(pays||[]).filter(installmentPaymentIsOpen);
  if(!open.length)return null;
  return open.slice().sort((a,b)=>{
    const d=String(a.dueDate||"").localeCompare(String(b.dueDate||""));
    if(d!==0)return d;
    return(Number(a.sequence)||0)-(Number(b.sequence)||0);
  })[0];
}
/* When the plan finishes if nothing changes — the last still-open due date,
   or the last date overall once everything is closed. */
function installmentExpectedCompletion(pays){
  const live=(pays||[]).filter(p=>p&&!p.deletedAt&&p.status!=="cancelled");
  if(!live.length)return null;
  const open=live.filter(installmentPaymentIsOpen);
  const pool=open.length?open:live;
  return pool.reduce((mx,p)=>(!mx||String(p.dueDate||"")>mx)?String(p.dueDate||""):mx,"")||null;
}
/* Stored status wins for the two states only a user action can produce;
   otherwise "completed" the moment nothing is open. Kept derived so a plan
   whose last payment is recorded reads as finished without a second write. */
function installmentDerivedStatus(inst,pays){
  if(!inst)return"active";
  if(inst.status==="cancelled")return"cancelled";
  if(inst.status==="paidOffEarly")return"paidOffEarly";
  const live=(pays||[]).filter(p=>p&&!p.deletedAt);
  if(live.length&&!live.some(installmentPaymentIsOpen))return"completed";
  return"active";
}

/* Whether a scheduled payment should appear in the derived Budget group.
   Cancelled rows (plan cancelled, or closed by an early payoff) drop out, which
   is exactly what makes future allocations disappear while paid history stays.
   Bucketing goes through bucketKeyFor, so a pay-period owner's "this month"
   is their real period — never the calendar month — and periods stay
   un-pro-rated. */
function installmentPaymentInBucket(p,payPeriods,owner,bucketKey){
  if(!p||!p.dueDate)return false;
  return bucketKeyFor(p.dueDate,payPeriods,owner)===bucketKey;
}
function derivedInstallmentRowsFor(insts,pays,owner,bucketKey,payPeriods){
  const owned=installmentsForOwner(insts,owner)
    .filter(x=>x.includeInBudget!==false&&x.status!=="cancelled");
  const byId=new Map(owned.map(x=>[x.id,x]));
  return(pays||[])
    .filter(p=>p&&!p.deletedAt&&p.status!=="cancelled"&&(p.owner||"me")===owner
      &&byId.has(p.installmentId)&&installmentPaymentInBucket(p,payPeriods,owner,bucketKey))
    .map(p=>{
      const inst=byId.get(p.installmentId);
      return{id:installmentRowId(p.id),paymentId:p.id,installmentId:inst.id,
        name:inst.name||"Installment",provider:inst.provider,
        providerLabel:installmentProviderLabel(inst),
        color:installmentProvider(inst.provider).color,
        /* Derived, never stored — a reopened payment stops being funded the
           moment its status changes, with nothing to clean up. The row keeps
           its scheduled `amount` so it still DISPLAYS what was due; it is
           installmentTotal that drops it, because an envelope is already
           allocating that money. */
        fundedCatId:p.fundedCatId||null,
        fundedElsewhere:p.status==="paid"&&!!p.fundedCatId,
        sequence:p.sequence,dueDate:p.dueDate,
        /* the PLANNED figure is always the scheduled amount — a payment that
           came out a riyal different is an actuals fact and must not rewrite
           what was planned (that's what the ledger is for) */
        amount:Number(p.scheduledAmount)||0,
        actualAmount:p.status==="paid"&&p.actualAmount!=null?Number(p.actualAmount):null,
        status:p.status};
    })
    .sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))
      ||String(a.name).localeCompare(String(b.name)));
}

/* One rollup for the Installments tab's summary card. `dueThisPeriod` uses the
   owner's own bucket, so it answers "what lands before my next payday". */
function installmentSummary(insts,pays,owner,{bucketKey,payPeriods,todayStr}={}){
  const owned=installmentsForOwner(insts,owner);
  const ownedIds=new Set(owned.map(x=>x.id));
  const mine=(pays||[]).filter(p=>p&&!p.deletedAt&&ownedIds.has(p.installmentId));
  const active=owned.filter(x=>installmentDerivedStatus(x,installmentPaymentsFor(mine,x.id))==="active");
  const dueThisPeriod=bucketKey
    ?mine.filter(p=>installmentPaymentIsOpen(p)&&installmentPaymentInBucket(p,payPeriods,owner,bucketKey))
      .reduce((s,p)=>s+(Number(p.scheduledAmount)||0),0)
    :0;
  const remaining=active.reduce((s,x)=>s+installmentRemainingBalance(x,installmentPaymentsFor(mine,x.id)),0);
  const next=installmentNextPayment(mine.filter(p=>ownedIds.has(p.installmentId)),todayStr);
  const nextInst=next?owned.find(x=>x.id===next.installmentId)||null:null;
  return{dueThisPeriod,remaining,activeCount:active.length,next,nextInstallment:nextInst,
    overdueCount:mine.filter(p=>installmentPaymentDerivedStatus(p,todayStr)==="overdue").length};
}

/* ── Purchase Advisor engine ───────────────────────────────────────────────
   "Should I buy this, and how?" — answered by walking the existing plan chain
   forward, never by inventing a second model of the budget.

   Everything here is module scope, pure, and takes `todayStr` rather than
   reading the clock, for the same three reasons the installments block above
   is: purchasetest.cjs slices and runs the SHIPPED functions instead of a
   copy; a projection that moves at midnight can't be reasoned about; and the
   advisor must be able to render without materialising anything.

   The load-bearing rules:

   • It DERIVES, it never writes. Nothing below takes `data`, returns `data`,
     or can reach editPlanForMonth — viewing a future month in the advisor must
     not clone a plan into it, exactly as the derived Budget rows must not.
     That is also why the whole feature stores its draft in localStorage and
     touches no synced collection: no migrate() entry, no fingerprint touch
     point, no merge, no KV write, no effect on the other phone.

   • Headroom is Budget's own arithmetic, not a second opinion.
     purchaseHeadroomForBucket is income − Σ categoryEffectiveAmt −
     installmentTotal, which is byte-identical to what BudgetView computes for
     the viewed month once `trims` is empty. If the two ever disagree the
     advisor is wrong, and purchasetest.cjs asserts the equality against the
     sliced Budget expression rather than against a restatement of it.

   • Funded installment rows are excluded from the obligation, the same way
     BudgetView excludes them: their money is already inside a category's
     allocation, so counting them again reserves the same riyal twice.

   • Scope is per-owner. Joint ("household") accounts are REPORTED by
     purchaseAvailableStack and deliberately not added, so the exclusion is
     visible on screen instead of being a silent surprise. ─────────────────── */

/* 24 buckets ≈ two years. A bounded walk, and the horizon is also the honest
   answer: past it the engine returns null and the UI says "not reachable
   within two years" rather than extrapolating a plan nobody has made. */
const PURCHASE_HORIZON_BUCKETS=24;
/* Headroom below this share of a bucket's income is "thin" — technically
   affordable, but with nothing left for the month to go wrong in. */
const PURCHASE_THIN_PCT=5;

/* A category's real monthly figure. Extracted verbatim from BudgetView, which
   held the only copy while ExpenseTrackerView carried a second inline one — a
   category's `amount` is a manual figure ONLY while it has no subs, and that
   rule has to be stated once. Both call sites now read this. */
function categoryEffectiveAmt(c){
  const subs=(c&&c.subs)||[];
  if(subs.length>0)return subs.reduce((s,sub)=>s+(Number(sub.amount)||0),0);
  return Number(c&&c.amount)||0;
}

/* One trim, clamped. A negative trim would be a raise, and a trim larger than
   the category would be free money — both clamp to the range the lever can
   actually offer. A trim naming a category that no longer exists simply never
   gets looked up, because the walk is over live categories. */
function purchaseTrimFor(trims,catId,effAmt){
  const raw=Number((trims||{})[catId])||0;
  return Math.max(0,Math.min(effAmt,raw));
}

/* Σ of a plan's categories after trims. livePlanView is applied again here
   rather than assumed: resolvePlanForMonth already returns the live view (and
   the call is free — it returns the identical object when there is nothing to
   do), but a caller handing in a raw plan record must not silently get
   tombstoned categories counted. */
function purchasePlannedTotal(plan,trims){
  const view=livePlanView(plan);
  return((view&&view.categories)||[]).reduce((s,c)=>{
    const eff=categoryEffectiveAmt(c);
    return s+eff-purchaseTrimFor(trims,c.id,eff);
  },0);
}

/* What is left over in ONE bucket after the plan and the installment schedule
   have taken their share. The bucket may be in the future and may have no
   monthlyPlans row of its own — resolvePlanForMonth walks the chain backwards
   for us, which is exactly the same inheritance Budget displays. */
function purchaseHeadroomForBucket(ctx,bucketKey){
  const c=ctx||{};
  const plan=resolvePlanForMonth(c.monthlyPlans,bucketKey,c.owner,c.activePlanId,c.plans).plan;
  const income=Number(plan&&plan.income)||0;
  const planned=plan?purchasePlannedTotal(plan,c.trims):0;
  const rows=derivedInstallmentRowsFor(c.installments,c.installmentPayments,c.owner,bucketKey,c.payPeriods);
  const installmentTotal=rows.reduce((s,r)=>s+(r.fundedElsewhere?0:r.amount),0);
  return{bucketKey,income,planned,installmentTotal,headroom:income-planned-installmentTotal};
}

/* The itemised subtraction stack, never a bare "cash available" number.

   Goal money lives INSIDE bank balances — applyGoalContribution writes a
   transfer expense and credits the goal, it never touches `banks` — so Σ
   bankValue already contains every goal pot and the Bills Reserve. Subtracting
   them is not conservatism, it is removing a double count of money that is
   already spoken for.

   `toBase` converts an account's own currency into the document currency and
   may return null when no FX has loaded; such accounts are counted as
   `unconverted` and excluded rather than silently added at face value.

   The Bills Reserve used to be subtracted here and no longer is (v1.34.0) —
   see the note beside the return. */
function goalSavedTotal(g){
  return((g&&g.contributions)||[]).filter(c=>c&&!c.deletedAt)
    .reduce((a,c)=>a+(Number(c.amount)||0),0);
}

function purchaseAvailableStack({banks,goals,owner,protectedGoalIds,
                                 includedBankIds,releasedBankIds,todayStr,toBase}){
  const conv=typeof toBase==="function"?toBase:v=>v;
  const included=new Set(includedBankIds||[]);
  /* Releasing a reserved account is a per-decision lever, the mirror of
     unprotecting a goal — "spend the emergency fund on THIS". It does not
