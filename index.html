<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function(){
  try{
    var t=localStorage.getItem("allocation:theme");
    if(t==="dark"){
      var root=document.documentElement;
      root.setAttribute("data-theme","dark");
      var vars={
        "--bg":"#15191B","--ink":"#EAF0FA","--sub":"#9FB0C8","--faint":"#647289",
        "--line":"rgba(255,255,255,.09)","--sf":"#1E2427","--sfA":"#0E1213","--gr":"#3FBF9E",
        "--grD":"#8FE3CC","--grS":"#17322B","--br":"#4FA9C7","--brS":"#1A323B","--red":"#C97177",
        "--deep":"#0A1119","--deepHi":"#7E93B5",
        "--neuBg":"#15191B","--neuHi":"#232A2D","--neuLo":"#060809","--neuInk":"#E7ECEC","--neuSub":"#93A1A7",
        "--jade":"#3FBF9E","--jadeS":"#17322B","--wine":"#C97177","--wineS":"#3A2224",
        "--glassBg":"rgba(255,255,255,.07)","--glassBgStrong":"rgba(255,255,255,.12)","--glassBorder":"rgba(255,255,255,.16)","--glassShadow":"rgba(0,0,0,.5)","--glassHi":"rgba(255,255,255,.18)"
      };
      for(var k in vars)root.style.setProperty(k,vars[k]);
    }
  }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#E4E7E9;--ink:#15243B;--sub:#56657E;--faint:#8A98AD;
  --line:rgba(34,41,44,.09);--sf:#EEF0F1;--sfA:#DADEE0;
  --gr:#1E6E5C;--grD:#154F42;--grS:#DCEAE5;
  --br:#2E8BB0;--brS:#E0EEF4;--red:#9B4A4E;
  --deep:#15243B;--deepHi:#9DB0CC;
  --neuBg:#E4E7E9;--neuHi:#FFFFFF;--neuLo:#B8C1C5;--neuInk:#22292C;--neuSub:#5C6B70;
  --jade:#1E6E5C;--jadeS:#DCEAE5;--wine:#9B4A4E;--wineS:#F3E2E1;
  --glassBg:rgba(255,255,255,.5);--glassBgStrong:rgba(255,255,255,.68);--glassBorder:rgba(255,255,255,.85);--glassShadow:rgba(34,41,44,.16);--glassHi:rgba(255,255,255,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);transition:background .25s ease;overflow-x:hidden;width:100%;}
/* whenever any sheet/modal overlay is mounted anywhere in the document
   (including Portal-rendered ones attached directly to body), freeze the
   page behind it — otherwise a touch-drag that starts inside the sheet can
   hand off to the underlying page scroll once it hits the sheet's own
   scroll edge, which on iOS feels like "the page behind is scrolling". */
/* body scroll lock now handled entirely by the useScrollLock hook (JS,
   position:fixed + top offset) — the old CSS-only body:has() rule below
   was removed because it applied overflow:hidden/height:100vh instantly
   at paint time, snapping the background to the top before the JS fix
   could take over, causing a visible jump on iOS. */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior-x:none;}
.serif{font-family:"Iowan Old Style",Georgia,serif;}
.tnum{font-variant-numeric:tabular-nums;}
input.bare{background:transparent;border:none;outline:none;padding:1px 2px;border-radius:4px;transition:background .12s,box-shadow .12s;font:inherit;color:inherit;}
input.bare:hover{background:rgba(127,143,168,.12);}
input.bare:focus{background:rgba(91,143,217,.12);box-shadow:0 0 0 1px rgba(91,143,217,.4);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
button{cursor:pointer;font:inherit;}
select{font:inherit;}

/* ── Keyframes ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes numFlash{0%{opacity:1}30%{opacity:.35}100%{opacity:1}}
@keyframes slideInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes sheetDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetBgIn{from{opacity:0}to{opacity:1}}

/* ── Top sheet (mobile-first modal alternative) — anchored near the top of
   the viewport so it's visible immediately on open, no scrolling needed,
   and stays clear of the on-screen keyboard which eats the bottom half. ── */
.sheet-bg{
  position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(21,25,27,.32);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  animation:sheetBgIn .25s ease both;
  overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top) + 16px) 12px 16px;
}
.sheet{
  border-radius:20px;padding:18px;
  width:100%;max-width:480px;max-height:calc(100vh - env(safe-area-inset-top) - 32px);overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  background:var(--glassBgStrong);
  border:1px solid var(--glassBorder);box-shadow:0 16px 40px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  animation:sheetDown .28s cubic-bezier(.22,1,.36,1) both;
}
.sheet-handle{display:none;}


.spin{animation:spin .9s linear infinite;}
:focus-visible{outline:2px solid var(--gr);outline-offset:1px;}

/* ── Tab content fade ── */
.tab-enter{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;}
.tab-enter-right{animation:slideInRight .45s cubic-bezier(.22,1,.36,1) both;}
.tab-enter-left{animation:slideInLeft .45s cubic-bezier(.22,1,.36,1) both;}

/* ── Cards / sections fade up on mount ── */
.fade-up{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;}
.fade-up-1{animation:fadeUp .5s .1s cubic-bezier(.22,1,.36,1) both;}
.fade-up-2{animation:fadeUp .5s .2s cubic-bezier(.22,1,.36,1) both;}
.fade-up-3{animation:fadeUp .5s .3s cubic-bezier(.22,1,.36,1) both;}
.fade-up-4{animation:fadeUp .5s .4s cubic-bezier(.22,1,.36,1) both;}
.fade-up-5{animation:fadeUp .5s .5s cubic-bezier(.22,1,.36,1) both;}

/* ── List item appear ── */
.list-item-enter{animation:fadeUp .38s cubic-bezier(.22,1,.36,1) both;}

/* ── Number flash when value changes ── */
.num-flash{animation:numFlash .6s ease both;}

/* ── Modal overlay + panel ── */
.modal-bg{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(21,25,27,.32);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  animation:overlayIn .3s ease both;
}
.modal{
  border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:var(--glassBgStrong);
  border:1px solid var(--glassBorder);box-shadow:0 16px 40px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  animation:scaleIn .4s cubic-bezier(.22,1,.36,1) both;
}

/* ── Button & interactive transitions ── */
button{transition:opacity .18s,transform .15s,background .22s,color .22s,box-shadow .22s;}
button:active{transform:scale(.96);}
select{transition:background .22s;}

/* ── Progress bars ── */
.bar-animated{transition:width .8s cubic-bezier(.22,1,.36,1);}
.bar-color{transition:background .5s;}

/* ── Neumorphism + liquid-glass (Budget pilot) ──
   Neumorphic surfaces are matte, same hue as their bed, carved via dual
   soft shadows (a light "highlight" + a dark "depth" tint of the same
   stone color — never pure black, which reads cheap). Glass is reserved
   for floating/overlay chrome: translucent, blurred, edge-lit. */
.neu-raised{
  background:var(--neuBg);border-radius:18px;
  box-shadow:7px 7px 15px var(--neuLo),-7px -7px 15px var(--neuHi);
  transition:box-shadow .25s ease;
}
.neu-inset{
  background:var(--neuBg);border-radius:14px;
  box-shadow:inset 4px 4px 9px var(--neuLo),inset -4px -4px 9px var(--neuHi);
}
.neu-btn{
  background:var(--neuBg);border-radius:999px;border:none;color:var(--neuInk);
  box-shadow:4px 4px 9px var(--neuLo),-4px -4px 9px var(--neuHi);
  transition:box-shadow .15s ease,transform .12s ease;
}
.neu-btn:active{
  box-shadow:inset 3px 3px 6px var(--neuLo),inset -3px -3px 6px var(--neuHi);
  transform:scale(.97);
}
.neu-btn.is-active{
  box-shadow:inset 3px 3px 7px var(--neuLo),inset -3px -3px 7px var(--neuHi);
  color:var(--jade);
}
.glass-panel{
  background:var(--glassBg);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid var(--glassBorder);
  box-shadow:0 10px 26px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  border-radius:20px;
}
.glass-btn{
  background:var(--glassBgStrong);
  backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid var(--glassBorder);
  box-shadow:0 4px 12px var(--glassShadow),inset 0 1px 0 var(--glassHi);
  border-radius:999px;color:var(--neuInk);
  transition:box-shadow .15s ease,transform .12s ease;
}
.glass-btn:active{transform:scale(.96);}
/* liquid-fill progress: an inset trough (neu-inset) contains this —
   a translucent gradient body with a glassy highlight riding the top,
   like liquid settling in a tube. */
.liquid-fill{
  position:relative;height:100%;border-radius:999px;
  transition:width .8s cubic-bezier(.22,1,.36,1);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -6px 10px -4px rgba(0,0,0,.18);
}

/* ── Reduced motion override ── */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}

/* ── Mobile viewport hardening ──
   iOS Safari auto-zooms the whole page when a focused form control computes
   to under 16px. That zoom also shifts the layout off-center in the PWA
   standalone shell. Forcing 16px on every interactive control (while keeping
   the *visual* size the same via padding/line-height tweaks) stops the zoom
   without changing how anything looks above 768px. ── */
@media(max-width:768px){
  input,select,textarea,input.bare,input.bare.tnum{
    font-size:16px!important;
  }
  /* the tighter/narrower numeric fields need a touch more padding at 16px
     so they don't visually balloon relative to their neighbors */
  input.bare.tnum{padding:1px 2px;}
}

/* ── Budget tab: category/sub rows reflow on narrow screens ──
   Desktop: name | %  | currency+amount | action icons, all on one line.
   Mobile: name gets its own full-width line (it's the thing that was
   getting clipped); % + amount + action icons wrap to a second line,
   indented to roughly align under the name text. ── */
.cat-row{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;}
.cat-row-name{display:flex;align-items:center;gap:8px;flex:1 1 160px;min-width:0;}
.cat-row-meta{display:flex;align-items:center;gap:10px;flex-shrink:0;justify-content:space-between;}
.cat-row-figures{display:flex;align-items:center;gap:10px;}
.cat-row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.sub-row{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 36px;flex-wrap:wrap;}
.sub-row-name{display:flex;align-items:center;gap:8px;flex:1 1 140px;min-width:0;}
.sub-row-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;justify-content:space-between;}
@media(max-width:768px){
  .cat-row-name{flex-basis:100%;}
  .cat-row-meta{flex-basis:100%;padding-left:18px;}
  .sub-row-name{flex-basis:100%;}
  .sub-row-meta{flex-basis:100%;padding-left:14px;}
}

/* ── Home tab: responsive dashboard grid ──
   One shared 6-column track at every breakpoint, so every card snaps to the
   same vertical guides instead of each row inventing its own widths (that
   inconsistency is what made the old 2-col version feel "assembled"). Cards
   claim column spans per breakpoint; `order` handles the mobile reading
   sequence.

   Row structure by breakpoint (Phase 4 §7 — Savings & Investing replaces the
   old Asset Allocation slot, same column position):
     mobile  (<768)      1 col   Hero / Portfolio / Budget / Savings / Goals
     tablet  (768-1023)  6 col   Hero(6) / Portfolio(3)+Savings(3)
                                 / Budget(3)+Goals(3) / QuickActions(6)
     desktop (>=1024)    6 col   same, but Portfolio(4)+Savings(2) so the
                                 analytical card gets the 2/3 width it needs
                                 and Savings gets the compact column it's
                                 designed for.

   .home-cell is a flex wrapper whose single child card stretches to the full
   row height — that's what keeps side-by-side cards bottom-aligned rather
   than leaving one short card floating against a tall neighbour. */
.home-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:stretch;}
.home-cell{display:flex;min-width:0;grid-column:1/-1;}
.home-cell>*{flex:1;min-width:0;}
.home-grid>.cell-hero{order:1;}
.home-grid>.cell-portfolio{order:2;}
.home-grid>.cell-budget{order:3;}
.home-grid>.cell-savings{order:4;}
.home-grid>.cell-goals{order:5;}
/* Mobile uses the floating + button instead (never both at once). */
.home-grid>.cell-qa{display:none;}
@media(min-width:768px){
  .home-grid>.cell-portfolio{grid-column:span 3;order:2;}
  .home-grid>.cell-savings{grid-column:span 3;order:3;}
  .home-grid>.cell-budget{grid-column:span 3;order:4;}
  .home-grid>.cell-goals{grid-column:span 3;order:5;}
  .home-grid>.cell-qa{display:flex;order:6;}
}
@media(min-width:1024px){
  .home-grid>.cell-portfolio{grid-column:span 4;}
  .home-grid>.cell-savings{grid-column:span 2;}
}
/* Home's own FAB: mobile-only, and only on the Home tab (App suppresses its
   global FAB there). Above 768px the in-grid Quick Actions bar takes over, so
   the floating button disappears — the two are never visible together. */
@media(min-width:768px){.home-fab{display:none!important;}}
/* Equal-height cards: the card root fills its stretched cell, and whichever
   child is marked .home-fill (a chart, usually) absorbs the leftover height
   so a tall row never leaves a dead blank band inside a short card. */
.home-card{display:flex;flex-direction:column;height:100%;box-sizing:border-box;}
.home-fill{flex:1;min-height:0;}
/* Cards that drill into a tab: same neumorphic shell, just a light press
   affordance so it reads as tappable without introducing a new style. */
.home-tappable{transition:transform .15s ease,opacity .15s ease;}
.home-tappable:active{transform:scale(.985);}
.home-tappable:focus-visible{outline:2px solid var(--gr,#1E6E5C);outline-offset:2px;}
/* Mobile keeps trend charts short so Net Worth, Portfolio and part of Budget
   all land on the first screen; they grow back on wider layouts where the
   extra height is what keeps side-by-side cards level. */
@media(max-width:767px){
  /* Fixed height, and opt out of .home-fill's flex growth — a max-height alone
     would let the flex basis collapse the chart to nothing. */
  .home-spark{flex:0 0 auto!important;height:46px!important;min-height:0!important;}
}
/* Hero: stacked on mobile; figures | trend side by side once there's width,
   so the full-bleed row stops being mostly empty space. */
.hero-split{display:grid;grid-template-columns:1fr;gap:8px;}
@media(min-width:768px){
  .hero-split{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:end;}
}

#root{padding-top:env(safe-area-inset-top);}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999;font-family:-apple-system,sans-serif;color:#56657E;font-size:14px;transition:background .25s;}
.loader{width:32px;height:32px;border:3px solid #DADEE0;border-top-color:#1E6E5C;border-radius:50%;animation:spin .8s linear infinite;}
</style>
</head>
<body>
<div id="loading"><div class="loader"></div><span>Loading Where'dItGo…</span></div>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const{useState,useEffect,useMemo,useRef,useCallback}=React;
/* Renders children directly onto document.body instead of in the normal DOM
   tree. Needed for any fixed-position overlay (modals/sheets): tab panes are
   wrapped in an entrance-animation div whose transform never fully clears
   (fill-mode "both" keeps translateX(0) applied after the animation ends),
   which silently turns that div into the containing block for *all*
   position:fixed descendants — so "fixed" modals inside it end up anchored
   to the scrollable page instead of the viewport. Portaling to <body> sidesteps
   that entirely. */
function Portal({children}){
  return ReactDOM.createPortal(children,document.body);
}
const _RC=(typeof Recharts!=='undefined')?Recharts:window.Recharts||{};
const{PieChart,Pie,Cell,ResponsiveContainer,LineChart,Line,AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip}=_RC;

/* ── Animation helpers ── */

/* Flash a DOM node's class briefly when a value changes */
function useFlash(val,ref){
  const prev=useRef(val);
  useEffect(()=>{
    if(prev.current===val){return;}
    prev.current=val;
    const el=ref.current;
    if(!el)return;
    el.classList.remove("num-flash");
    // force reflow so re-adding the class restarts the animation
    void el.offsetWidth;
    el.classList.add("num-flash");
    const t=setTimeout(()=>el.classList.remove("num-flash"),400);
    return()=>clearTimeout(t);
  },[val]);
}

/* Locks background scroll while a modal/sheet is open, in a way that
   actually survives iOS Safari. The CSS-only `body:has(.sheet-bg){overflow:
   hidden}` approach doesn't reliably hold the scroll position on iOS — the
   page can snap back to the top when the sheet closes (or even while open,
   if the keyboard toggles). Pinning the body with position:fixed and a
   negative top offset, then restoring scrollTo on close, is the fix that
   actually holds on iOS. Wired to every .sheet-bg instance in the app —
   confirmed working on the Add/Edit Transaction sheet, then rolled out. */
function useScrollLock(active){
  const savedY=useRef(0);
  useEffect(()=>{
    if(!active)return;
    savedY.current=window.scrollY||document.documentElement.scrollTop||0;
    const{body}=document;
    body.style.position="fixed";
    body.style.top=`-${savedY.current}px`;
    body.style.left="0";
    body.style.right="0";
    body.style.width="100%";
    return()=>{
      body.style.position="";
      body.style.top="";
      body.style.left="";
      body.style.right="";
      body.style.width="";
      window.scrollTo(0,savedY.current);
    };
  },[active]);
}

/* Tab direction tracker so we can slide left or right */
const TAB_ORDER=["budget","expenses","household","banks","investments","networth","goals","targets","currency"];
function TabPane({tab,children}){
  const prevTab=useRef(tab);
  const dir=useRef("right");
  if(prevTab.current!==tab){
    const pi=TAB_ORDER.indexOf(prevTab.current);
    const ci=TAB_ORDER.indexOf(tab);
    dir.current=ci>pi?"right":"left";
    prevTab.current=tab;
  }
  const cls=dir.current==="right"?"tab-enter-right":"tab-enter-left";
  return <div key={tab} className={cls}>{children}</div>;
}

/* Staggered fade-up wrapper for a list of items */
function FadeList({items,renderItem,keyFn}){
  return items.map((item,i)=>(
    <div key={keyFn?keyFn(item):i} className={`fade-up-${Math.min(i+1,5)}`}>
      {renderItem(item,i)}
    </div>
  ));
}

/* ── palette ──
   P's properties are mutated in place (not reassigned) when switching themes,
   so every component that reads P.xxx at render time picks up the new value
   without needing prop-drilling or context. */
const PALETTE_LIGHT={bg:"#E4E7E9",ink:"#15243B",sub:"#56657E",faint:"#8A98AD",line:"rgba(34,41,44,.09)",sf:"#EEF0F1",sfA:"#DADEE0",gr:"#1E6E5C",grD:"#154F42",grS:"#DCEAE5",br:"#2E8BB0",brS:"#E0EEF4",red:"#9B4A4E",deep:"#15243B",deepHi:"#9DB0CC",redS:"#F3E2E1",amberS:"#FEF4E8",amber:"#B5651D",
  neuBg:"#E4E7E9",neuHi:"#FFFFFF",neuLo:"#B8C1C5",neuInk:"#22292C",neuSub:"#5C6B70",
  jade:"#1E6E5C",jadeS:"#DCEAE5",jadeD:"#154F42",
  wine:"#9B4A4E",wineS:"#F3E2E1",
  glassBg:"rgba(255,255,255,.5)",glassBgStrong:"rgba(255,255,255,.68)",glassBorder:"rgba(255,255,255,.85)",glassShadow:"rgba(34,41,44,.16)",glassHi:"rgba(255,255,255,.6)"};
const PALETTE_DARK={bg:"#15191B",ink:"#EAF0FA",sub:"#9FB0C8",faint:"#647289",line:"rgba(255,255,255,.09)",sf:"#1E2427",sfA:"#0E1213",gr:"#3FBF9E",grD:"#8FE3CC",grS:"#17322B",br:"#4FA9C7",brS:"#1A323B",red:"#C97177",deep:"#0A1119",deepHi:"#7E93B5",redS:"#3A2224",amberS:"#3A2E18",amber:"#E0A85C",

/* ── Pay-period utilities ──────────────────────────────────────────────────
   Pay-periods are an opt-in alternative to calendar-month budgeting, for
   people whose salary lands on a fixed day rather than the 1st. A period is
   identified by a "period key" — the ISO date (YYYY-MM-DD) of its START day
   — so it sorts and compares like any other date string. When pay-periods
   are off for an owner, the rest of the app keeps using plain "YYYY-MM"
   calendar-month keys exactly as before; these utilities are only called
   when `payPeriod.enabled` is true for that owner.

   "payday" = day of month (1-31) salary arrives; the period covering a given
   date runs from that day through the day before the same day next month.
   A payday beyond a short month (e.g. 31 in February) clamps to the last
   actual day of that month, the conventional way to handle this. ───────── */

/* Last valid calendar day of a given year/month (month is 1-12) */
function daysInCalMonth(y,m){return new Date(y,m,0).getDate();}

/* Resolve a payday (1-31) against a specific year/month, clamping to the
   month's last real day so "31" in February becomes that February's 28/29. */
function clampPayday(y,m,payday){return Math.min(Math.max(1,Number(payday)||1),daysInCalMonth(y,m));}

/* Build a Date for the period START that contains `dateStr`, given a payday.
   Returns a plain Date at local midnight. */
function periodStartFor(dateStr,payday){
  const d=new Date(dateStr+"T00:00:00");
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const thisMonthPayday=clampPayday(y,m,payday);
  if(day>=thisMonthPayday){
    return new Date(y,m-1,thisMonthPayday);
  }
  // falls before this month's payday → belongs to the period that started last month
  const py=m===1?y-1:y, pm=m===1?12:m-1;
  return new Date(py,pm-1,clampPayday(py,pm,payday));
}

/* The period KEY (YYYY-MM-DD of the period's start) containing a given date */
function periodKeyFor(dateStr,payday){
  const start=periodStartFor(dateStr,payday);
  return`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,"0")}-${String(start.getDate()).padStart(2,"0")}`;
}

/* {start,end} Date objects (inclusive) for the period identified by a key */
function periodRange(periodKey,payday){
  let[y,m,d]=(periodKey||"").split("-").map(Number);
  if(!y||!m||!d){
    // Malformed or stale key — e.g. a calendar-month key ("YYYY-MM") briefly
    // passed in for one render right as pay-periods finish loading/turn on,
    // before the owning view's re-anchoring effect has run. Falling back to
    // the period containing today (instead of building an Invalid Date,
    // which throws once it hits toLocaleDateString) is what was producing
    // the stuck "Invalid Date" budget header.
    [y,m,d]=periodKeyFor(todayISO(),payday).split("-").map(Number);
  }
  const start=new Date(y,m-1,d);
  const nextY=m===12?y+1:y, nextM=m===12?1:m+1;
  const nextPayday=clampPayday(nextY,nextM,payday);
  const end=new Date(nextY,nextM-1,nextPayday-1);
  return{start,end};
}

/* Number of days in a period (inclusive of both ends) */
function periodLength(periodKey,payday){
  const{start,end}=periodRange(periodKey,payday);
  return Math.round((end-start)/86400000)+1;
}

/* Step a period key forward/back n periods */
function shiftPeriod(periodKey,payday,n){
  let key=periodKey;
  if(n>0){for(let i=0;i<n;i++){const{end}=periodRange(key,payday);const next=new Date(end);next.setDate(next.getDate()+1);key=periodKeyFor(`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}-${String(next.getDate()).padStart(2,"0")}`,payday);}}
  else if(n<0){for(let i=0;i<-n;i++){const{start}=periodRange(key,payday);const prevDay=new Date(start);prevDay.setDate(prevDay.getDate()-1);key=periodKeyFor(`${prevDay.getFullYear()}-${String(prevDay.getMonth()+1).padStart(2,"0")}-${String(prevDay.getDate()).padStart(2,"0")}`,payday);}}
  return key;
}

/* Human label for a period: "Jun 28 – Jul 27, 2026" */
function periodLabel(periodKey,payday){
  const{start,end}=periodRange(periodKey,payday);
  const sameYear=start.getFullYear()===end.getFullYear();
  const startStr=start.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  if(sameYear){
    const endStr=end.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    return`${startStr} – ${endStr}, ${end.getFullYear()}`;
  }
  // crosses a year boundary: show both years explicitly, e.g. "Dec 28, 2025 – Jan 27, 2026"
  const startWithYear=start.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const endWithYear=end.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  return`${startWithYear} – ${endWithYear}`;
}

/* Today's date as YYYY-MM-DD, local time */
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

/* ── Unified period helpers — these are what views actually call.
   They check the owner's payPeriod settings and transparently fall back to
   plain calendar-month bucketing ("YYYY-MM") when pay-periods are off,
   so existing calendar-month logic and stored data are untouched. ───────── */
function ownerUsesPayPeriod(payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  return!!(cfg&&cfg.enabled&&cfg.payday);
}
function bucketKeyFor(dateStr,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return periodKeyFor(dateStr,cfg.payday);
  return(dateStr||"").slice(0,7);
}
function bucketLabel(bucketKey,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return periodLabel(bucketKey,cfg.payday);
  const[y,mo]=bucketKey.split("-");
  return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
}
function bucketShift(bucketKey,payPeriods,owner,n){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday)return shiftPeriod(bucketKey,cfg.payday,n);
  const[y,m]=bucketKey.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function bucketNow(payPeriods,owner){
  return bucketKeyFor(todayISO(),payPeriods,owner);
}
/* Days elapsed / total in the CURRENT bucket, for burn-rate projections.
   For calendar months this is identical to the old daysInMonth/dayOfMonth
   logic; for pay-periods it uses the period's actual start/end. */
function bucketProgress(bucketKey,payPeriods,owner){
  const cfg=(payPeriods||{})[owner];
  if(cfg&&cfg.enabled&&cfg.payday){
    const{start,end}=periodRange(bucketKey,cfg.payday);
    const total=periodLength(bucketKey,cfg.payday);
    const now=new Date();now.setHours(0,0,0,0);
    const elapsed=Math.max(1,Math.min(total,Math.round((now-start)/86400000)+1));
    return{elapsed,total};
  }
  const[y,m]=bucketKey.split("-").map(Number);
  const total=daysInCalMonth(y,m);
  const elapsed=new Date().getDate();
  return{elapsed,total};
}

/* Spend-status thresholds — hoisted to module scope so the Expenses tab and
   Home's Tracked Spending card colour envelopes by the exact same rule
   (green under 80%, amber from 80%, red at/over 100%) instead of each keeping
   its own copy. */
function spendStatusColor(spent,budget){
  if(budget===0)return P.sub;
  const r=spent/budget;
  if(r>=1)return P.red;
  if(r>=0.8)return"#E07B2A";
  return P.gr;
}
function spendStatusBg(spent,budget){
  if(budget===0)return P.sfA;
  const r=spent/budget;
  if(r>=1)return P.redS;
  if(r>=0.8)return P.amberS;
  return P.sfA;
}

/* Tracked-spending rollup for one owner, for their CURRENT bucket (calendar
   month, or pay-period when that owner has pay-periods enabled).

   This is a straight lift of the envelope/spent maths ExpenseTrackerView
   already performs — same tracked test (trackExpenses!==false), same
   effective-budget rule (sub-category sum when subs exist, else the category
   amount), same skip of zero-budget categories, same bucket filter, and the
   same isExtraFunds handling where ad-hoc top-ups raise the effective budget
   rather than counting as spend. Kept as one shared top-level function so
   Home reads the numbers rather than re-deriving them. */
function trackedSpendingFor(owner,{planForMonth,expenses,payPeriods}){
  const month=bucketNow(payPeriods,owner);
  const plan=planForMonth?planForMonth(month,owner):null;
  const envs=[];
  if(plan){
    (plan.groups||[]).forEach(g=>{
      (plan.categories||[]).filter(c=>c.groupId===g.id).forEach(c=>{
        if(c.trackExpenses===false)return; // untracked: transfers, savings, investments
        const effAmt=(c.subs||[]).length>0
          ?(c.subs||[]).reduce((s,sub)=>s+(Number(sub.amount)||0),0)
          :Number(c.amount)||0;
        if(effAmt<=0)return;
        envs.push({id:c.id,name:c.name,baseBudget:effAmt,color:c.color});
      });
    });
  }
  const inBucket=(expenses||[]).filter(e=>
    e.date&&(e.owner||"me")===owner&&bucketKeyFor(e.date,payPeriods,owner)===month);
  const spentMap={},extraMap={};
  inBucket.forEach(e=>{
    const m=e.isExtraFunds?extraMap:spentMap;
    m[e.catId]=(m[e.catId]||0)+e.amount;
  });
  const cats=envs.map(e=>{
    const budget=e.baseBudget+(extraMap[e.id]||0);
    const spent=spentMap[e.id]||0;
    return{id:e.id,name:e.name,color:e.color,owner,budget,spent,
      remaining:budget-spent,
      pct:budget>0?(spent/budget)*100:0,
      over:spent>budget};
  });
  return{month,cats,
    budget:cats.reduce((s,c)=>s+c.budget,0),
    spent:cats.reduce((s,c)=>s+c.spent,0)};
}

/* Savings & Investing rollup for one owner, current bucket (Phase 4 §4).
   Deliberately NOT income-minus-expenses — that guesses at savings from
   what's left over, which silently double-counts anything already spent
   from an envelope. Instead this sums actual `expenses` rows logged against
   whichever budget categories the user has picked as "savings" or
   "investment" in Home Dashboard settings (data.homeSettings), the same
   quickTransfer/addExtraFunds-logged entries the untracked-category system
   above already produces. Categories are matched by NAME rather than id
   because cloning a plan into a new month gives its categories fresh ids —
   name is the only thing stable across months for a category a user thinks
   of as "the same one". */
function savingsInvestingFor(owner,{planForMonth,expenses,payPeriods},savingsNames,investNames){
  const month=bucketNow(payPeriods,owner);
  const plan=planForMonth?planForMonth(month,owner):null;
  const idsFor=names=>new Set((plan&&plan.categories||[]).filter(c=>(names||[]).includes(c.name)).map(c=>c.id));
  const savingIds=idsFor(savingsNames),investIds=idsFor(investNames);
  const inBucket=(expenses||[]).filter(e=>
    e.date&&(e.owner||"me")===owner&&bucketKeyFor(e.date,payPeriods,owner)===month);
  const saved=inBucket.filter(e=>savingIds.has(e.catId)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const invested=inBucket.filter(e=>investIds.has(e.catId)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  return{month,saved,invested,income:Number((plan&&plan.income)||0)};
}

/* ── Stock quotes via Cloudflare Worker proxy ──
   Worker fetches Yahoo Finance server-side (no CORS), returns JSON.
   Finnhub handles US stocks directly as a fast fallback.                 */
const FINNHUB_KEY="d94h0p9r01qib64ang9gd94h0p9r01qib64anga0";

/* ── Gold spot price (Phase 3) ──
   Reuses the exact same Worker→Yahoo proxy as stock quotes (no new API, no
   new key) — Yahoo's chart endpoint serves "GC=F" (COMEX gold futures, USD
   per troy ounce, the standard proxy for spot gold — "XAUUSD=X" was tried
   first but Yahoo's chart endpoint returns no data for it) just like any
   equity ticker, so it rides fetchQuotes()/livePrice/the existing
   staleness-refresh cycle unchanged. */
const GOLD_TICKER="GC=F";

/* Map tickers to the right Yahoo symbol.
   VWRA → VWRA.L (LSE), bare US tickers stay as-is.                      */
const LSE_SET=new Set(["VWRA","VWRP","VWCE","VWRL","CSPX","EIMI","SWDA","IGLN","IUSA","ISF","HMWO","SSAC","VAGP","AGGG"]);
function toYahooSym(t){
  const b=t.toUpperCase().replace(/\.L$/i,"");
  return LSE_SET.has(b)?b+".L":b;
}
function baseKey(t){return t.toUpperCase().replace(/\.L$|\.AS$|\.DE$/i,"");}

/* Returns {[ticker]:{price,previousClose}} uniformly regardless of provider —
   previousClose is null when a provider doesn't have it, never fabricated.
   Callers that only need the bare number (e.g. net-worth/portfolio value
   math) read `.price`; Home's "today's gain/loss" is the only consumer of
   `.previousClose` so far. */
async function fetchQuotes(tickers){
  const out={};

  /* ── 1. Cloudflare Worker → Yahoo Finance (handles VWRA + all tickers) */
  if(!PROXY_URL.startsWith("PASTE_")){
    const syms=tickers.map(toYahooSym).join(",");
    try{
      const r=await fetch(`${PROXY_URL}/quote?symbols=${encodeURIComponent(syms)}`);
      if(r.ok){
        const j=await r.json();
        Object.entries(j).forEach(([sym,q])=>{
          // Tolerate both the new {price,previousClose} shape (post-redeploy
          // worker.js) and the old bare-number shape (pre-redeploy), so this
          // client keeps working even before the Worker is redeployed.
          const price=(q&&typeof q==="object")?q.price:q;
          const previousClose=(q&&typeof q==="object")?(q.previousClose||null):null;
          if(price>0)out[baseKey(sym)]={price,previousClose};
        });
      }
    }catch(e){}
  }

  /* ── 2. Finnhub direct (US, real-time, no proxy needed) ── */
  if(!FINNHUB_KEY.startsWith("PASTE_")){
    const missing=tickers.filter(t=>!out[baseKey(t)]);
    await Promise.all(missing.map(async t=>{
      try{
        const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(baseKey(t))}&token=${FINNHUB_KEY}`);
        if(!r.ok)return;
        const j=await r.json();
        // Finnhub already returns both current (c) and previous-close (pc) —
        // previously only `pc` was read, as a same-value fallback for the
        // price when `c` was missing, and previousClose itself was discarded.
        const p=j.c>0?j.c:(j.pc>0?j.pc:null);
        if(p)out[baseKey(t)]={price:p,previousClose:j.pc>0?j.pc:null};
      }catch(e){}
    }));
  }

  if(Object.keys(out).length===0)throw new Error("no quotes");
  return out;
}

/* ── Projection helper ── */
function projectSeries(start,monthly,years,annualPct){
  const r=annualPct/100/12;const out=[];
  for(let y=0;y<=years;y++){
    const m=y*12;
    const fv=r===0?start+monthly*m:start*Math.pow(1+r,m)+monthly*((Math.pow(1+r,m)-1)/r);
    out.push(Math.round(fv));
  }
  return out;
}

/* ── Target forecast: simulate invested + cash pools growing at separate
   conservative rates. Each category's monthly amount is routed to whichever
   pool the person tagged it as (invest vs cash) — a "GoTrade" contribution
   compounds at the invest rate, a "Seabank/time-deposit" contribution
   compounds at the cash rate. Returns a month-by-month series plus the
   first month the total crosses the target, or null if it doesn't within
   30 years. ── */
function computeTargetForecast(startInvest,startCash,monthlyInvest,monthlyCash,investRatePct,cashRatePct,targetAmount){
  const rInv=(Number(investRatePct)||0)/100/12,rCash=(Number(cashRatePct)||0)/100/12;
  let inv=Number(startInvest)||0,cash=Number(startCash)||0;
  const MAX_MONTHS=360;
  const series=[];let hitMonth=null;
  for(let m=0;m<=MAX_MONTHS;m++){
    const total=inv+cash;
    if(hitMonth===null&&targetAmount>0&&total>=targetAmount)hitMonth=m;
    if(m%3===0||m===MAX_MONTHS||m===hitMonth)series.push({m,total:Math.round(total)});
    if(hitMonth!==null&&m>=hitMonth)break;
    inv=inv*(1+rInv)+(Number(monthlyInvest)||0);
    cash=cash*(1+rCash)+(Number(monthlyCash)||0);
  }
  return{series,hitMonth};
}

/* ── Compute holding stats from trade log ── */
function holdingStats(trades=[]){
  let shares=0,cost=0;
  (trades||[]).filter(tr=>!tr.deletedAt).forEach(tr=>{
    const s=Number(tr.shares)||0,p=Number(tr.price)||0;
    if(tr.type==="buy"){shares+=s;cost+=s*p;}
    else if(tr.type==="sell"){
      const avgBefore=shares>0?cost/shares:0;
      shares=Math.max(0,shares-s);
      cost=shares*avgBefore;
    }
  });
  const avgCost=shares>0?cost/shares:0;
  return{shares,avgCost,totalCost:cost};
}

/* ── MP2 / Time Deposit valuation (Phase 2) ────────────────────────────────
   Dedicated valuation strategies alongside holdingStats() (stocks). Neither
   type has a live market price — both are rate-driven, so "confirmed" vs
   "estimated" is the core distinction instead of cost-basis vs market value.

   mp2GrowContribution walks a single contribution year-by-year (calendar-
   year buckets, pro-rated for partial years) from its date to `today`,
   applying whatever `rateForYear(y)` returns for each year. Two independent
   walks are done per contribution — one with a rate-lookup that returns
   null for any year without an official declared rate (→ confirmed, that
   year's growth simply isn't recognized yet), one that falls back to the
   account's projection rate for those same gaps (→ estimated). Never a
   single walk with a "confirmed so far, then estimate" switch, because in
   compounded mode that would let an estimated year's growth compound into
   later *confirmed* years once a rate is eventually declared — mixing
   projected money into a value labeled "confirmed". ───────────────────── */
function mp2GrowContribution(amount,dateStr,today,rateForYear,compound){
  const start=new Date(dateStr+"T00:00:00");
  let base=Number(amount)||0,dividends=0;
  if(!(start<today))return{base,dividends:0};
  let cursor=new Date(start);
  while(cursor<today){
    const y=cursor.getFullYear();
    const yearEnd=new Date(y,11,31,23,59,59,999);
    const periodEnd=yearEnd<today?yearEnd:today;
    const days=Math.max(0,(periodEnd-cursor)/86400000);
    const rate=rateForYear(y);
    if(rate!=null){
      const div=base*(Number(rate)/100)*(days/365);
      dividends+=div;
      if(compound)base+=div;
    }
    cursor=new Date(periodEnd.getTime()+86400000);
  }
  return{base,dividends};
}
/* declaredRatesByYear: {year:rate} built from data.mp2DividendRates, already
   resolved to "latest non-deleted entry per year". acc.rateOverrides (an
   optional {year:rate} map on the account itself) takes priority over the
   central table — "reused by all MP2 accounts unless explicitly overridden". */
function mp2Valuation(acc,declaredRatesByYear){
  const today=new Date();
  const contributions=(acc.contributions||[]).filter(c=>!c.deletedAt);
  const totalContrib=contributions.reduce((s,c)=>s+(Number(c.amount)||0),0);
  const compound=acc.payoutMode!=="annual";
  const declaredFor=y=>{
    const ov=acc.rateOverrides&&acc.rateOverrides[y];
    if(ov!=null&&ov!=="")return Number(ov);
    const d=(declaredRatesByYear||{})[y];
    return d!=null?Number(d):null;
  };
  const projFor=y=>{
    const d=declaredFor(y);
    return d!=null?d:(Number(acc.projectionRate)||0);
  };
  let confirmedDividends=0,estimatedDividends=0;
  contributions.forEach(c=>{
    const conf=mp2GrowContribution(c.amount,c.date,today,declaredFor,compound);
    const est=mp2GrowContribution(c.amount,c.date,today,projFor,compound);
    confirmedDividends+=conf.dividends;
    estimatedDividends+=est.dividends;
  });
  const paid=(acc.paidDividends||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  // Annual-payout mode: declared dividends are receivable, not reinvested —
  // once recorded paid (moved to a bank via "Record annual dividend payout"),
  // they must drop out of the MP2 account's own value or they'd be counted
  // twice (once here, once in the bank balance).
  const confirmedValue=Math.max(0,totalContrib+confirmedDividends-(compound?0:paid));
  const estimatedValueRaw=Math.max(0,totalContrib+estimatedDividends-(compound?0:paid));
  const estimatedValue=Math.max(confirmedValue,estimatedValueRaw);
  // Which calendar years actually have no declared rate yet, for the
  // "not yet officially declared" warning in the UI.
  const years=new Set();
  contributions.forEach(c=>{for(let y=new Date(c.date).getFullYear();y<=today.getFullYear();y++)years.add(y);});
  const undeclaredYears=[...years].filter(y=>declaredFor(y)==null).sort();
  return{totalContrib,confirmedDividends,estimatedDividends,confirmedValue,estimatedValue,paid,undeclaredYears};
}

/* Time Deposit: simple or compounded interest over the account's term,
   with an optional flat withholding-tax rate applied to interest only.
   `freq` "maturity" = simple interest for the whole term (no intra-term
   compounding); monthly/quarterly/annually compound at that cadence. */
function tdValuation(acc){
  const principal=Number(acc.principal)||0;
  const rate=Number(acc.rate)||0;
  const tax=Number(acc.taxRate)||0;
  const start=new Date((acc.startDate||"")+"T00:00:00");
  const maturity=new Date((acc.maturityDate||"")+"T00:00:00");
  const today=new Date();
  const validTerm=acc.startDate&&acc.maturityDate&&maturity>start;
  if(!validTerm)return{principal,grossAccrued:0,taxAmt:0,netAccrued:0,currentEstValue:principal,grossAtMaturity:0,maturityValue:principal,daysRemaining:0,daysTotal:0};
  const end=today<maturity?today:maturity;
  const elapsedDays=Math.max(0,(end-start)/86400000);
  const totalDays=Math.max(1,(maturity-start)/86400000);
  const periodsPerYear={maturity:0,monthly:12,quarterly:4,annually:1}[acc.compounding||"maturity"]||0;
  const grossFor=days=>periodsPerYear===0
    ?principal*(rate/100)*(days/365)
    :principal*Math.pow(1+(rate/100)/periodsPerYear,periodsPerYear*(days/365))-principal;
  const grossAccrued=grossFor(elapsedDays);
  const taxAmt=grossAccrued*(tax/100);
  const netAccrued=grossAccrued-taxAmt;
  const grossAtMaturity=grossFor(totalDays);
  const netAtMaturity=grossAtMaturity*(1-tax/100);
  return{
    principal,grossAccrued,taxAmt,netAccrued,
    currentEstValue:principal+netAccrued,
    grossAtMaturity,maturityValue:principal+netAtMaturity,
    daysRemaining:Math.max(0,Math.ceil((maturity-today)/86400000)),
    daysTotal:Math.round(totalDays),
  };
}

/* Gold (Phase 3): physical gold only (bars/coins, no jewellery), priced off
   a live spot quote (see GOLD_TICKER/fetchQuotes) rather than a rate table —
   the only priced type so far that's a literal commodity weight × purity ×
   market price, not a cost-basis or contribution-driven balance. Purity is
   entered as karat (24 for pure/24K, 22 for 22K, or any custom number the
   account owner types in) rather than a raw 0–1 fraction, since that's how
   gold purity is actually quoted/sold. `priceUsdPerOz` is looked up by the
   caller from the shared livePrice cache (same stale-tolerant, never-cleared
   pattern stocks already use) — this function is pure and never fetches. */
const TROY_OZ_GRAMS=31.1034768;
const GOLD_UNITS=[["g","Grams"],["oz","Troy ounces"]];
function goldWeightOz(hld){
  const w=Number(hld.weight)||0;
  return hld.weightUnit==="oz"?w:w/TROY_OZ_GRAMS;
}
function goldKaratFraction(hld){
  const k=Number(hld.karat)||0;
  return Math.min(1,Math.max(0,k/24));
}
function goldValuation(hld,priceUsdPerOz,convert){
  const oz=goldWeightOz(hld);
  const purity=goldKaratFraction(hld);
  const pureOz=oz*purity;
  const price=Number(priceUsdPerOz)||0;
  const currentValueUsd=pureOz*price;
  const purchaseCost=Number(hld.purchaseCost)||0;
  const purchaseValueUsd=convert?(convert(purchaseCost,hld.currency||"USD","USD")||0):0;
  const gainUsd=currentValueUsd-purchaseValueUsd;
  const gainPct=purchaseValueUsd>0?(gainUsd/purchaseValueUsd)*100:0;
  return{oz,purity,pureOz,currentValueUsd,purchaseValueUsd,gainUsd,gainPct,hasPrice:price>0};
}

/* ── Filter an investments array down to one owner's accounts.
   "household" returns everything (Home's household profile is the combined
   view, and a household-owned account is already included in that combined
   set — see investment-ownership comment near INVESTMENT_OWNERS above).
   Single source of truth so App() and PortfolioCard never re-implement this
   filter differently. ── */
function investmentsForProfile(invs,owner){
  if(owner==="household")return invs||[];
  return(invs||[]).filter(x=>(x.owner||"me")===owner);
}

/* ── Liability remaining balance (auto-decrements by month) ── */
function liabilityBalance(liab){
  if(!liab.installment)return Number(liab.value)||0;
  const{monthly,monthsRemaining,asOfDate}=liab;
  if(!monthly||!monthsRemaining||!asOfDate)return Number(liab.value)||0;
  const now=new Date();
  const ref=new Date(asOfDate);
  const elapsed=Math.max(0,(now.getFullYear()-ref.getFullYear())*12+(now.getMonth()-ref.getMonth()));
  const remaining=Math.max(0,monthsRemaining-elapsed);
  return(Number(monthly)||0)*remaining;
}

/* ── Default data ── */

function migrate(d){
  if(!d||typeof d!=="object")return defaultData();
  if(!d.owners)d.owners={me:"Me",wife:"My wife"};
  // migrate activePlanId from string to {me, wife}
  if(typeof d.activePlanId==="string"){
    const oldId=d.activePlanId;
    d.activePlanId={me:oldId,wife:null};
    // create a blank wife plan if none exists
    if(!(d.plans||[]).find(p=>p.owner==="wife")){
      const wid=uid();
      d.plans=[...(d.plans||[]),{id:wid,owner:"wife",name:"Monthly Salary",
        month:monthLabel(),income:0,
        groups:[{id:uid(),name:"Savings"},{id:uid(),name:"Essentials"},{id:uid(),name:"Personal"}],
        categories:[]}];
      d.activePlanId.wife=wid;
    }
  }
  if(!d.activePlanId||typeof d.activePlanId!=="object")d.activePlanId={me:(d.plans||[])[0]?.id,wife:null};
  // ensure all plans have an owner
  (d.plans||[]).forEach(p=>{if(!p.owner)p.owner="me";});
  // ensure wife activePlanId points to a real plan
  if(!d.activePlanId.wife){
    const wifePlan=(d.plans||[]).find(p=>p.owner==="wife");
    if(wifePlan)d.activePlanId.wife=wifePlan.id;
  }
  // ensure expenses have owner + split name/note (old data had a single "name" field
  // used as the transaction title; keep that as-is for `name`, add empty `note`)
  (d.expenses||[]).forEach(e=>{
    if(!e.owner)e.owner="me";
    if(e.note===undefined)e.note="";
    if(!e.updatedAt)e.updatedAt=e.date?`${e.date}T00:00:00.000Z`:new Date().toISOString();
  });
  // ensure monthlyPlans have owner
  (d.monthlyPlans||[]).forEach(m=>{if(!m.owner)m.owner="me";if(!m.updatedAt)m.updatedAt="2000-01-01T00:00:00.000Z";});
  (d.banks||[]).forEach(b=>{if(!b.owner)b.owner="me";if(!b.updatedAt)b.updatedAt="2000-01-01T00:00:00.000Z";});
  (d.goals||[]).forEach(g=>{
    if(!g.owner)g.owner="me";
    if(!g.type)g.type="savings";
    // migrate old saved→contributions
    if(g.saved!==undefined&&!g.contributions){
      g.contributions=[{id:uid(),date:new Date().toISOString().slice(0,10),amount:g.saved,note:"Migrated balance"}];
      delete g.saved;
    }
    if(!g.contributions)g.contributions=[];
    if(!g.updatedAt)g.updatedAt="2000-01-01T00:00:00.000Z";
  });
  (d.plans||[]).forEach(plan=>{
    (plan.categories||[]).forEach(c=>{
      if(!c.subs)c.subs=[];
      // default every category to tracked unless explicitly marked otherwise,
      // so existing budgets behave exactly as before this feature shipped
      if(c.trackExpenses===undefined)c.trackExpenses=true;
    });
    if(!plan.updatedAt)plan.updatedAt="2000-01-01T00:00:00.000Z";
  });
  (d.investments||[]).forEach(inv=>{
    // migrate old shares/avgCost→trades
    if(!inv.trades){
      const s=Number(inv.shares)||0,a=Number(inv.avgCost)||0;
      inv.trades=s>0?[{id:uid(),date:new Date().toISOString().slice(0,10),type:"buy",shares:s,price:a}]:[];
      delete inv.shares;delete inv.avgCost;
    }
    // Investment Accounts (Phase 1): every pre-existing holding predates the
    // owner/type fields, so it's a stock/ETF account belonging to "me"
    // (Jastine) — nothing else is a safe default since that's what every
    // holding in this app has been until now.
    if(!inv.owner)inv.owner="me";
    if(!inv.type)inv.type="stocks";
    if(!inv.updatedAt)inv.updatedAt="2000-01-01T00:00:00.000Z";
    // Phase 2: MP2 / Time Deposit field defaults, so records synced from an
    // older version (or a device on an older build) never render with
    // undefined fields — every reader below assumes these exist.
    if(inv.type==="mp2"){
      if(!inv.currency)inv.currency="PHP";
      if(!inv.payoutMode)inv.payoutMode="compounded";
      if(inv.projectionRate===undefined)inv.projectionRate=6;
      if(!inv.contributions)inv.contributions=[];
      if(!inv.paidDividends)inv.paidDividends=[];
      if(!inv.rateOverrides)inv.rateOverrides={};
      if(inv.notes===undefined)inv.notes="";
      (inv.contributions||[]).forEach(c=>{if(!c.updatedAt)c.updatedAt=c.date?`${c.date}T00:00:00.000Z`:"2000-01-01T00:00:00.000Z";if(c.createdAt===undefined)c.createdAt=c.updatedAt;if(c.note===undefined)c.note="";});
    }
    if(inv.type==="td"){
      if(!inv.currency)inv.currency="PHP";
      if(inv.principal===undefined)inv.principal=0;
      if(inv.rate===undefined)inv.rate=0;
      if(inv.taxRate===undefined)inv.taxRate=0;
      if(!inv.compounding)inv.compounding="maturity";
      if(!inv.status)inv.status="active";
      if(inv.institution===undefined)inv.institution="";
      if(inv.notes===undefined)inv.notes="";
    }
    // Phase 3: Gold — physical bars/coins only, priced off a live spot quote
    // (GOLD_TICKER) rather than a rate table. Karat defaults to 24 (pure)
    // rather than 0, so a record that predates this migration never silently
    // values at $0 purity.
    if(inv.type==="gold"){
      if(!inv.currency)inv.currency="USD";
      if(inv.weight===undefined)inv.weight=0;
      if(!inv.weightUnit)inv.weightUnit="g";
      if(!inv.purityType)inv.purityType="24k";
      if(inv.karat===undefined)inv.karat=inv.purityType==="22k"?22:24;
      if(!inv.purchaseDate)inv.purchaseDate="2000-01-01";
      if(inv.purchaseCost===undefined)inv.purchaseCost=0;
      if(inv.notes===undefined)inv.notes="";
    }
  });
  if(!d.mp2DividendRates)d.mp2DividendRates=[];
  (d.mp2DividendRates||[]).forEach(r=>{if(!r.updatedAt)r.updatedAt="2000-01-01T00:00:00.000Z";});
  if(!d.settings)d.settings={};
  if(d.settings.includeMp2EstimateInNetWorth===undefined)d.settings.includeMp2EstimateInNetWorth=false;
  // Phase 3: gold price rides the automatic staleness-refresh cycle by
  // default; snapshotRetention controls how many days of *daily*-resolution
  // history are kept before compressSnapshots() collapses older entries to
  // weekly, then monthly (see compressSnapshots below).
  if(d.settings.goldAutoRefresh===undefined)d.settings.goldAutoRefresh=true;
  if(!d.settings.snapshotRetention)d.settings.snapshotRetention={dailyDays:35,weeklyDays:365};
  if(d.settings.snapshotRetention.dailyDays===undefined)d.settings.snapshotRetention.dailyDays=35;
  if(d.settings.snapshotRetention.weeklyDays===undefined)d.settings.snapshotRetention.weeklyDays=365;
  if(!d.snapshots)d.snapshots=[];
  (d.assets||[]).forEach(a=>{
    if(a.kind==="liability"&&!a.installment){a.installment=false;}
    if(!a.updatedAt)a.updatedAt="2000-01-01T00:00:00.000Z";
  });
  if(!d.livePrice)d.livePrice={};
  if(d.livePriceAt===undefined)d.livePriceAt=null;
  if(!d.prevClose)d.prevClose={};
  if(!d.homeDisplay)d.homeDisplay={};
  if(!d.homeDisplay.netWorth)d.homeDisplay.netWorth={primary:"PHP",secondary:["SAR","USD","PHP"]};
  if(!d.homeDisplay.portfolio)d.homeDisplay.portfolio={primary:"USD"};
  if(!d.homeDisplay.cash)d.homeDisplay.cash={primary:"PHP"};
  if(!d.homeDisplay.budget)d.homeDisplay.budget={primary:"PHP"};
  if(!d.homeDisplay.savingsInvesting)d.homeDisplay.savingsInvesting={primary:"PHP"};
  // Phase 4 Home Dashboard settings — see defaultData() for field meanings.
  if(!d.homeSettings)d.homeSettings={};
  if(!Array.isArray(d.homeSettings.savingsCategories))d.homeSettings.savingsCategories=[];
  if(!Array.isArray(d.homeSettings.investmentCategories))d.homeSettings.investmentCategories=[];
  if(!d.homeSettings.cardVisibility)d.homeSettings.cardVisibility={};
  ["hero","portfolio","savingsInvesting","trackedSpending","goals"].forEach(k=>{
    if(d.homeSettings.cardVisibility[k]===undefined)d.homeSettings.cardVisibility[k]=true;
  });
  if(!d.portHistory)d.portHistory=[];
  if(!d.expenses)d.expenses=[];
  if(!d.monthlyPlans)d.monthlyPlans=[];
  if(!d.theme)d.theme="light";
  if(!d.payPeriods)d.payPeriods={me:{enabled:false,payday:28},wife:{enabled:false,payday:1}};
  if(!d.payPeriods.me)d.payPeriods.me={enabled:false,payday:28};
  if(!d.payPeriods.wife)d.payPeriods.wife={enabled:false,payday:1};
  if(!d.quickTransferLast)d.quickTransferLast={};
  if(!d.netWorthAutoHistory)d.netWorthAutoHistory=[];
  if(!d.targets)d.targets=[];
  if(!d.investTarget)d.investTarget={};
  // migrate old single shared shape {thresholdPct,groupNames} to per-owner {me:{...},wife:{...}}
  if(d.investTarget.thresholdPct!==undefined||d.investTarget.groupNames!==undefined){
    d.investTarget={me:{thresholdPct:d.investTarget.thresholdPct||20,groupNames:d.investTarget.groupNames||[]},wife:{thresholdPct:20,groupNames:[]}};
  }
  if(!d.investTarget.me)d.investTarget.me={thresholdPct:20,groupNames:[]};
  if(!d.investTarget.wife)d.investTarget.wife={thresholdPct:20,groupNames:[]};
  (d.targets||[]).forEach(t=>{
    if(!t.categoryAlloc){
      // migrate old flat categoryIds (everything treated as "cash") into the
      // new destination-tagged map so nothing silently resets
      t.categoryAlloc={};
      (t.categoryIds||[]).forEach(id=>{t.categoryAlloc[id]="cash";});
    }
    delete t.categoryIds;
    if(t.investRate===undefined)t.investRate=4;   // conservative default, user-editable
    if(t.cashRate===undefined)t.cashRate=1;        // conservative default, user-editable
    if(!t.currency)t.currency="SAR";
    if(!t.color)t.color=P.gr;
    if(!t.updatedAt)t.updatedAt="2000-01-01T00:00:00.000Z";
  });
  // per-device edit clock used purely for cross-device merge tiebreaking on
  // settings that aren't record arrays (currency, projection, owners names,
  // payPeriods, investTarget, activePlanId, quickTransferLast, household
  // split %). Never shown in UI, never a source of truth for anything else.
  if(!d.dataUpdatedAt)d.dataUpdatedAt="2000-01-01T00:00:00.000Z";
  return d;
}

/* ── Cloudflare KV Sync ──────────────────────────────────────────────────────
   No login ever required. Set SYNC_TOKEN to the same secret you put in worker.js.
   The Worker URL is already set above as PROXY_URL.
   ─────────────────────────────────────────────────────────────────────────── */
const SYNC_TOKEN="kgTZEPzv2cSIcG79rv04pZFeyK2mPg2bhw2gh";

const KVSync={
  lastPulledAt:null,
  lastKnownRev:0, // best-known cloud revision, updated by every successful load/save/meta check
  _ready(){return !PROXY_URL.startsWith("PASTE_")&&!SYNC_TOKEN.startsWith("PASTE_");},
  _headers(){return{"Content-Type":"application/json","X-Sync-Token":SYNC_TOKEN};},
  /* Full download. Returns {data, savedAt, rev} | null (null only on
     network/parse failure — a genuinely-empty account still resolves with
     data:null, rev:0, which callers distinguish from a failed fetch). */
  async load(){
    if(!this._ready())return null;
    const r=await fetch(`${PROXY_URL}/sync`,{headers:this._headers()});
    if(!r.ok)return null;
    const j=await r.json();
    if(j.savedAt)this.lastPulledAt=j.savedAt;
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
  /* Cheap metadata-only GET — no dataset transfer. Returns {savedAt, rev} |
     null. This is what the "app became active" check uses. */
  async checkMeta(){
    if(!this._ready())return null;
    const r=await fetch(`${PROXY_URL}/sync/meta`,{headers:this._headers()});
    if(!r.ok)return null;
    const j=await r.json();
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
  /* baseRev = the cloud revision this save is built on top of (i.e. the
     device's current localRev). Server rejects with {conflict:true} and
     hands back its current data+rev if baseRev is stale, instead of
     silently overwriting a change this device never saw. */
  async save(data,baseRev){
    if(!this._ready())return{ok:false,reason:"not configured"};
    const body=JSON.stringify({data,savedAt:new Date().toISOString(),rev:baseRev||0});
    const r=await fetch(`${PROXY_URL}/sync`,{method:"POST",headers:this._headers(),body});
    if(!r.ok)return{ok:false,reason:`HTTP ${r.status}`};
    const j=await r.json();
    if(j.savedAt)this.lastPulledAt=j.savedAt;
    if(Number.isFinite(j.rev))this.lastKnownRev=j.rev;
    return j;
  },
};

/* ── Local-first sync metadata ──────────────────────────────────────────────
   Local-only bookkeeping about the sync state itself (never sent to the
   cloud, never mixed into the financial dataset). Kept in its own
   localStorage key so closing/reopening the app doesn't lose track of
   whether this device has unsaved work. ─────────────────────────────────── */
const SYNC_META_KEY="salaryPlanner:v3:syncMeta";
const LAST_SYNCED_DATA_KEY="salaryPlanner:v3:lastSyncedData";
const cacheSyncedSnapshot=d=>{try{localStorage.setItem(LAST_SYNCED_DATA_KEY,JSON.stringify(d));}catch(e){}};
const loadSyncedSnapshot=()=>{try{const raw=localStorage.getItem(LAST_SYNCED_DATA_KEY);if(raw)return JSON.parse(raw);}catch(e){}return null;};
const PRE_CLOUD_BACKUP_KEY="salaryPlanner:v3:preCloudRestore";
const PROFILE_KEY="allocation:preferredProfile";

/* theme is a per-device UI preference (see PROFILE_KEY / allocation:theme in
   localStorage) that also happens to ride along inside the shared `data`
   object. It must never count toward "is my copy different from the
   cloud's" — two devices with different light/dark preferences would
   otherwise permanently disagree on everything, defeating auto-merge and
   re-triggering the conflict modal on every save. Fingerprints used for
   dirty-checking / conflict-detection strip it out; the actual payload
   sent to the cloud still includes theme as normal. */
const sortedById=arr=>Array.isArray(arr)?[...arr].sort((a,b)=>String((a&&a.id)||"").localeCompare(String((b&&b.id)||""))):arr;
const sortedByKey=(arr,keyOf)=>Array.isArray(arr)?[...arr].sort((a,b)=>String(keyOf(a)||"").localeCompare(String(keyOf(b)||""))):arr;
/* Two devices can hold the exact same set of records added in a different
   order (new items get appended wherever they land locally), so a raw
   JSON.stringify would call that "different" even when nothing actually
   changed. This canonicalizes every collection where order isn't
   meaningful (transactions, goals, investments, etc. — nothing in the UI
   depends on their raw array order, everything gets re-sorted by date at
   render time anyway) before comparing. Deliberately leaves plan-level
   `categories`/`groups` order alone, since reordering those IS a real edit
   a person might make on purpose. */
const fingerprint=d=>{
  try{
    // livePrice/livePriceAt/prevClose are excluded the same way theme is:
    // they're refreshed automatically in the background (manual/auto quote+FX
    // refresh) and must never make the doc look "dirty" or trigger a cloud
    // autosave just because a stock price ticked.
    const{theme,dataUpdatedAt,livePrice,livePriceAt,prevClose,...rest}=d||{};
    const canon={
      ...rest,
      expenses:sortedById(rest.expenses),
      goals:sortedById((rest.goals||[]).map(g=>({...g,contributions:sortedByKey(g.contributions,c=>`${c.date||""}|${c.id||""}`)}))),
      investments:sortedById((rest.investments||[]).map(iv=>({...iv,
        trades:sortedByKey(iv.trades,t=>`${t.date||""}|${t.id||""}`),
        contributions:sortedByKey(iv.contributions,c=>`${c.date||""}|${c.id||""}`),
        paidDividends:sortedByKey(iv.paidDividends,p=>`${p.date||""}|${p.id||""}`),
      }))),
      banks:sortedById(rest.banks),
      assets:sortedById(rest.assets),
      targets:sortedById(rest.targets),
      mp2DividendRates:sortedById(rest.mp2DividendRates),
      plans:sortedById(rest.plans),
      monthlyPlans:sortedByKey(rest.monthlyPlans,m=>`${m.month||""}|${m.owner||""}`),
      portHistory:sortedByKey(rest.portHistory,h=>h.month||""),
      history:sortedByKey(rest.history,h=>h.month||""),
      snapshots:sortedByKey(rest.snapshots,s=>`${s.date||""}|${s.profile||""}`),
      household:rest.household?{...rest.household,expenses:sortedById(rest.household.expenses)}:rest.household,
    };
    return JSON.stringify(canon);
  }catch(e){return "";}
};

/* union records by id; on overlap, whichever has the newer updatedAt (or
   date, as a fallback for records that don't track updatedAt) wins outright.
   Deletes are tombstones (deletedAt set on the record, filtered out at read
   time), so a delete on one device merges cleanly instead of a stale copy
   on the other device silently resurrecting it. This is the same pattern
   originally used only for expenses, now shared by every collection. */
function mergeArrayById(localArr,remoteArr,tsOf=r=>r.updatedAt||r.date||""){
  const map=new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (remoteArr||[]).forEach(rx=>{
    const lx=map.get(rx.id);
    if(!lx){map.set(rx.id,rx);return;}
    map.set(rx.id,tsOf(rx)>tsOf(lx)?rx:lx);
  });
  // sorted by id so the array order itself is deterministic — otherwise
  // Map-insertion order (local's order, then remote-only additions tacked
  // on) drifts a little differently every time this runs, and a plain
  // JSON.stringify-based fingerprint would mistake that drift for a real
  // change even when the actual record set is identical.
  return Array.from(map.values()).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
}
/* Same idea, but for parent records that own a nested child array (goals→
   contributions, investments→trades). The parent's own scalar fields still
   go to whichever side is newer, but the child array is separately unioned
   so e.g. two different contributions added on two different devices to
   the same goal both survive, even though only one device's edit to the
   goal record itself "won". */
function mergeArrayByIdWithChild(localArr,remoteArr,childKey,childTsOf){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const ids=Array.from(new Set([...lm.keys(),...rm.keys()])).sort((a,b)=>String(a).localeCompare(String(b)));
  return ids.map(id=>{
    const l=lm.get(id),r=rm.get(id);
    if(l&&r){
      const winner=(r.updatedAt||"")>(l.updatedAt||"")?r:l;
      return{...winner,[childKey]:mergeArrayById(l[childKey]||[],r[childKey]||[],childTsOf)};
    }
    return l||r;
  });
}
/* Same idea as mergeArrayByIdWithChild but for records that can carry more
   than one nested child array — investments now have "trades" (stocks),
   "contributions" (MP2) and "paidDividends" (MP2 payout receipts), never
   more than one populated per record depending on `type`, but the merge
   can't assume which. Only merges a childSpec's key when at least one side
   actually has that array, so plain scalar fields on stocks (no
   contributions) or MP2 (no trades) aren't given an empty array they never
   had. */
function mergeArrayByIdWithChildren(localArr,remoteArr,childSpecs){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const ids=Array.from(new Set([...lm.keys(),...rm.keys()])).sort((a,b)=>String(a).localeCompare(String(b)));
  return ids.map(id=>{
    const l=lm.get(id),r=rm.get(id);
    if(l&&r){
      const winner=(r.updatedAt||"")>(l.updatedAt||"")?r:l;
      const merged={...winner};
      childSpecs.forEach(({key,tsOf})=>{
        if(l[key]||r[key])merged[key]=mergeArrayById(l[key]||[],r[key]||[],tsOf);
      });
      return merged;
    }
    return l||r;
  });
}
/* Records with no id, keyed some other way (monthlyPlans by month+owner,
   portHistory/history by month). No independent per-record timestamp, so a
   genuine same-key conflict falls back to whichever whole dataset was
   edited more recently overall. Sorted by key for the same determinism
   reason as mergeArrayById above. */
function mergeKeyed(localArr,remoteArr,keyOf,preferLocal){
  const map=new Map();
  (preferLocal?(remoteArr||[]):(localArr||[])).forEach(x=>map.set(keyOf(x),x));
  (preferLocal?(localArr||[]):(remoteArr||[])).forEach(x=>map.set(keyOf(x),x));
  return Array.from(map.values()).sort((a,b)=>String(keyOf(a)).localeCompare(String(keyOf(b))));
}

/* ── Historical snapshots (Phase 3) ────────────────────────────────────────
   data.snapshots: one row per {date:"YYYY-MM-DD", profile:"me"|"wife"|
   "household"} per calendar day, holding both Net Worth and Portfolio
   figures (+ a per-type investment breakdown) so one array feeds both the
   Net Worth and Portfolio range charts — never two parallel snapshot
   systems. Kept entirely separate from the pre-existing `history`/
   `portHistory` (monthly, manual-entry-friendly, MoM-stat-driving) arrays,
   which continue to work exactly as before; this is purely additive so nothing
   that already worked regresses. See docs/decisions.md for why. */
const addDaysStr=(dateStr,n)=>{const d=new Date(dateStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
/* Monday of the ISO week containing dateStr, used as a stable weekly bucket key. */
const isoWeekKey=dateStr=>{
  const d=new Date(dateStr+"T00:00:00Z");
  const dow=(d.getUTCDay()+6)%7; // 0=Mon..6=Sun
  d.setUTCDate(d.getUTCDate()-dow);
  return d.toISOString().slice(0,10);
};
const monthKeyOf=dateStr=>dateStr.slice(0,7);
/* Progressive retention (spec §6): every day for the most recent
   `dailyDays`, then one (the latest) snapshot per ISO week for the next
   `weeklyDays`, then one per calendar month forever beyond that — applied
   per profile so Me/Wife/Household compress independently. Runs on every
   write (arrays are tiny — a handful of profiles × ~400 rows tops) rather
   than as a separate scheduled job, so storage never grows unbounded (spec
   §11) without needing any background task. */
function compressSnapshots(snaps,retention){
  const{dailyDays=35,weeklyDays=365}=retention||{};
  const today=new Date().toISOString().slice(0,10);
  const dailyCutoff=addDaysStr(today,-dailyDays);
  const weeklyCutoff=addDaysStr(today,-(dailyDays+weeklyDays));
  const byProfile=new Map();
  (snaps||[]).forEach(s=>{
    if(!byProfile.has(s.profile))byProfile.set(s.profile,[]);
    byProfile.get(s.profile).push(s);
  });
  let out=[];
  byProfile.forEach(list=>{
    const sorted=[...list].sort((a,b)=>a.date.localeCompare(b.date));
    const daily=sorted.filter(s=>s.date>=dailyCutoff);
    const weekly=sorted.filter(s=>s.date<dailyCutoff&&s.date>=weeklyCutoff);
    const monthly=sorted.filter(s=>s.date<weeklyCutoff);
    const byWeek=new Map();
    weekly.forEach(s=>{const k=isoWeekKey(s.date);const cur=byWeek.get(k);if(!cur||s.date>cur.date)byWeek.set(k,s);});
    const byMonth=new Map();
    monthly.forEach(s=>{const k=monthKeyOf(s.date);const cur=byMonth.get(k);if(!cur||s.date>cur.date)byMonth.set(k,s);});
    out=out.concat(Array.from(byMonth.values()),Array.from(byWeek.values()),daily);
  });
  return out.sort((a,b)=>a.date===b.date?String(a.profile).localeCompare(b.profile):a.date.localeCompare(b.date));
}
/* Buckets a sorted (by date), already-profile-filtered snapshot list to the
   density a given range should render at (spec §7), taking the LAST
   snapshot in each bucket — never averaging/recalculating values, since
   every stored figure is itself already a point-in-time truth. Also caps to
   the range window except for "MAX". Pure + cheap (a handful of ms for
   hundreds of rows) so callers can useMemo it without a perf concern (§8). */
const RANGE_DAYS={"1W":7,"1M":30,"3M":90,"1Y":365,"MAX":Infinity};
function bucketSnapshotsForRange(sorted,range){
  const today=new Date().toISOString().slice(0,10);
  const days=RANGE_DAYS[range]??RANGE_DAYS["1M"];
  const windowed=days===Infinity?sorted:sorted.filter(s=>s.date>=addDaysStr(today,-days));
  let keyOf;
  if(range==="1W"||range==="1M")keyOf=s=>s.date;         // daily
  else if(range==="3M")keyOf=s=>isoWeekKey(s.date);       // weekly (dense enough at 90d without being noisy)
  else if(range==="1Y")keyOf=s=>isoWeekKey(s.date);       // weekly
  else keyOf=s=>monthKeyOf(s.date);                        // MAX: monthly
  const byKey=new Map();
  windowed.forEach(s=>{const k=keyOf(s);const cur=byKey.get(k);if(!cur||s.date>cur.date)byKey.set(k,s);});
  return Array.from(byKey.values()).sort((a,b)=>a.date.localeCompare(b.date));
}

/* Full cross-field auto-merge. Every record-bearing collection is merged by
   id (or by month/owner key where there's no id), so additions made on both
   devices always survive together — not just expenses. Anything left over
   that's a plain setting rather than a record (currency, projection, owner
   names, payPeriods, investTarget, activePlanId, quickTransferLast, live
   price cache, household split %) is seeded from whichever whole dataset
   carries the newer `dataUpdatedAt` stamp, since those aren't "add"
   operations the way transactions/goals/trades are — there's no
   union to take, just a most-recent-edit-wins call. Returns null (falling
   back to the conflict modal) only if something is structurally malformed. */
function tryAutoMergeAll(local,remote){
  try{
    const preferLocal=(local.dataUpdatedAt||"")>=(remote.dataUpdatedAt||"");
    const base=preferLocal?local:remote;
    return{
      ...base,
      expenses:mergeArrayById(local.expenses,remote.expenses),
      goals:mergeArrayByIdWithChild(local.goals,remote.goals,"contributions",c=>c.date||""),
      investments:mergeArrayByIdWithChildren(local.investments,remote.investments,[
        {key:"trades",tsOf:t=>t.date||""},
        {key:"contributions",tsOf:c=>c.date||""},
        {key:"paidDividends",tsOf:p=>p.date||""},
      ]),
      banks:mergeArrayById(local.banks,remote.banks),
      assets:mergeArrayById(local.assets,remote.assets),
      targets:mergeArrayById(local.targets,remote.targets),
      mp2DividendRates:mergeArrayById(local.mp2DividendRates,remote.mp2DividendRates),
      plans:mergeArrayById(local.plans,remote.plans),
      monthlyPlans:mergeKeyed(local.monthlyPlans,remote.monthlyPlans,m=>`${m.month}|${m.owner}`,preferLocal),
      portHistory:mergeKeyed(local.portHistory,remote.portHistory,h=>h.month,preferLocal),
      history:mergeKeyed(local.history,remote.history,h=>h.month,preferLocal),
      snapshots:mergeKeyed(local.snapshots,remote.snapshots,s=>`${s.date}|${s.profile}`,preferLocal),
      household:{
        ...(base.household||{splitMine:50,expenses:[]}),
        expenses:mergeArrayById((local.household||{}).expenses,(remote.household||{}).expenses,()=>""),
      },
    };
  }catch(e){return null;}
}

/* Reports what's different between local and remote for one id-keyed
   collection, without merging anything — used purely to show the person
   what a given conflict-modal choice would win/lose. Tombstoned records
   (deletedAt set) are left out of "only on X" so a delete on one side
   doesn't show up looking like a brand-new item on the other. */
function diffCollection(localArr,remoteArr){
  const lm=new Map((localArr||[]).map(x=>[x.id,x]));
  const rm=new Map((remoteArr||[]).map(x=>[x.id,x]));
  const onlyLocal=[],onlyRemote=[],changed=[];
  lm.forEach((lx,id)=>{if(!rm.has(id)&&!lx.deletedAt)onlyLocal.push(lx);});
  rm.forEach((rx,id)=>{
    if(!lm.has(id)){if(!rx.deletedAt)onlyRemote.push(rx);return;}
    const lx=lm.get(id);
    if(!lx.deletedAt&&!rx.deletedAt&&JSON.stringify(lx)!==JSON.stringify(rx))changed.push({local:lx,remote:rx});
  });
  return{onlyLocal,onlyRemote,changed};
}
/* Collections worth summarizing in the conflict modal, with a short label
   function for each record so the person can recognize it at a glance. */
const CONFLICT_COLLECTIONS=[
  {key:"expenses",label:"Transactions",nameOf:e=>`${e.name||"Transaction"}${e.amount!=null?` — ${Number(e.amount).toLocaleString()}`:""}${e.date?` (${e.date})`:""}`},
  {key:"goals",label:"Goals",nameOf:g=>g.name||"Goal"},
  {key:"investments",label:"Investments",nameOf:i=>i.ticker||i.name||"Investment"},
  {key:"banks",label:"Bank accounts",nameOf:b=>`${b.name||"Account"}${b.bank?` — ${b.bank}`:""}`},
  {key:"assets",label:"Assets & liabilities",nameOf:a=>a.name||"Asset"},
  {key:"targets",label:"Targets",nameOf:t=>t.name||"Target"},
  {key:"mp2DividendRates",label:"MP2 declared rates",nameOf:r=>`${r.year||""} — ${r.rate!=null?`${r.rate}%`:""}`},
  {key:"plans",label:"Plans",nameOf:p=>`${p.name||"Plan"}${p.month?` (${p.month})`:""}`},
];
function buildConflictDiff(local,remote){
  return CONFLICT_COLLECTIONS.map(({key,label,nameOf})=>{
    const{onlyLocal,onlyRemote,changed}=diffCollection((local||{})[key],(remote||{})[key]);
    return{key,label,
      onlyLocal:onlyLocal.map(nameOf),
      onlyRemote:onlyRemote.map(nameOf),
      changed:changed.map(c=>{
        const l=nameOf(c.local),r=nameOf(c.remote);
        return l===r?`${l} (other details differ)`:`${l}  →  ${r}`;
      })};
  }).filter(c=>c.onlyLocal.length||c.onlyRemote.length||c.changed.length);
}

/* localRev: the cloud revision number this device has fully reconciled
   with — either by pulling it, or by a push that the server confirmed
   landed at that revision. This (not a timestamp/fingerprint) is the
   source of truth for "am I behind the cloud".
   pendingUpload / pendingUploadFP: written to localStorage *before* a push
   request is sent, and only cleared *after* the server confirms it. If the
   process is killed/backgrounded mid-flight, these survive in localStorage
   (synchronous write) so the next launch/resume can check whether that
   upload actually landed rather than silently assuming success OR failure. */
const loadSyncMeta=()=>{
  try{
    const raw=localStorage.getItem(SYNC_META_KEY);
    if(raw){
      const m=JSON.parse(raw);
      if(!Number.isFinite(m.localRev))m.localRev=0;
      if(typeof m.pendingUpload!=="boolean")m.pendingUpload=false;
      if(m.pendingUploadFP===undefined)m.pendingUploadFP=null;
      if(m.lastCloudUploadAt===undefined)m.lastCloudUploadAt=m.lastCloudSavedAt||null;
      if(m.lastCloudDownloadAt===undefined)m.lastCloudDownloadAt=m.lastCloudPulledAt||null;
      return m;
    }
  }catch(e){}
  return{hasUnsyncedChanges:false,lastCloudSavedAt:null,lastCloudPulledAt:null,lastCloudUploadAt:null,lastCloudDownloadAt:null,lastCloudSnapshot:null,changesSinceSave:0,localRev:0,pendingUpload:false,pendingUploadFP:null};
};
const saveSyncMeta=m=>{try{localStorage.setItem(SYNC_META_KEY,JSON.stringify(m));}catch(e){}};

/* ════════════════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════════════════ */
function App(){
  const[data,setDataRaw]=useState(()=>migrate(defaultData()));
  const skipSave=useRef(false);
  /* every mutator in this file calls setData(updater). Wrapping it here (once)
     means none of those ~45 call sites need to know about dataUpdatedAt.
     skipSave.current is already set to true, right before setData, by every
     code path that's loading/merging/resolving cloud data rather than
     applying a real local edit — so we read (without consuming) that same
     flag to skip the stamp in those cases. */
  const setData=updater=>setDataRaw(d=>{
    const next=typeof updater==="function"?updater(d):updater;
    if(next===d)return d;
    if(skipSave.current)return next;
    return{...next,dataUpdatedAt:new Date().toISOString()};
  });
  const[loaded,setLoaded]=useState(false);
  const[tab,setTab]=useState("home");
  const[planMenu,setPlanMenu]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[showPendingDiff,setShowPendingDiff]=useState(false);
  const[globalAddTrigger,setGlobalAddTrigger]=useState(0); // bumped to tell ExpenseTrackerView to open the add-transaction modal
  const[expensesFilterRequest,setExpensesFilterRequest]=useState(null); // {catNames,nonce} — Home's Savings & Investing card drill-down (Phase 4)
  const[syncMsg,setSyncMsg]=useState("");
  const[themeTick,setThemeTick]=useState(0); // bumped to force re-render after P/SEG mutate
  const kvReady=!PROXY_URL.startsWith("PASTE_")&&!SYNC_TOKEN.startsWith("PASTE_");

  /* ── local-first sync state ──────────────────────────────────────────── */
  const[hasUnsyncedChanges,setHasUnsyncedChanges]=useState(false);
  const[lastCloudSavedAt,setLastCloudSavedAt]=useState(null); // last confirmed upload
  const[lastCloudPulledAt,setLastCloudPulledAt]=useState(null); // last confirmed download
  const[changesSinceSave,setChangesSinceSave]=useState(0);
  const[syncOp,setSyncOp]=useState(null); // null | "push" | "pull"
  const[conflict,setConflict]=useState(null); // {local,remote,remoteSavedAt} | null
  /* ── revision-based sync state ───────────────────────────────────────────
     localRev tracks the last cloud revision this device has fully
     reconciled with (see loadSyncMeta comment). syncStatus drives the
     status pill in the UI; isOnline is a plain navigator.onLine mirror so
     we can show "Offline" immediately instead of waiting for a fetch to
     time out. lastSyncError is diagnostics-only. */
  const[localRev,setLocalRev]=useState(0);
  const[cloudRev,setCloudRev]=useState(0); // last-known cloud revision, incl. ahead-of-local (diagnostics + "newer data available")
  const[syncStatus,setSyncStatus]=useState("idle"); // idle|saving|synced|pending|offline|failed|stale
  const[isOnline,setIsOnline]=useState(()=>typeof navigator==="undefined"?true:navigator.onLine);
  const[lastSyncError,setLastSyncError]=useState(null);
  const localRevRef=useRef(0);
  useEffect(()=>{localRevRef.current=localRev;},[localRev]);
  const[preCloudBackupAt,setPreCloudBackupAt]=useState(()=>{
    try{const raw=localStorage.getItem(PRE_CLOUD_BACKUP_KEY);if(raw)return JSON.parse(raw).at;}catch(e){}
    return null;
  });
  const syncing=syncOp!=null;
  const lastCloudSnapshotRef=useRef(null);
  const dataRef=useRef(data);
  useEffect(()=>{dataRef.current=data;},[data]);

  /* ── undo / recently-deleted ───────────────────────────────────────────
     Every delete in this app already sets `deletedAt` on the record instead
     of removing it (needed for tombstone merging across devices) — so undo
     just means clearing that flag again, and "recently deleted" just means
     showing what's still sitting there. restoreRecord handles both the
     6-second toast and the full recovery list with one function. */
  const restoreRecord=(collection,id,childKey,childId)=>{
    setData(d=>{
      const arr=d[collection]||[];
      if(childKey&&childId){
        return{...d,[collection]:arr.map(p=>p.id===id?{...p,[childKey]:(p[childKey]||[]).map(c=>c.id===childId?{...c,deletedAt:null}:c),updatedAt:new Date().toISOString()}:p)};
      }
