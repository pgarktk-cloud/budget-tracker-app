            background:(data.settings&&data.settings.includeMp2EstimateInNetWorth)?P.gr:P.sf,color:(data.settings&&data.settings.includeMp2EstimateInNetWorth)?"#fff":P.sub,
            border:`1px solid ${(data.settings&&data.settings.includeMp2EstimateInNetWorth)?P.gr:P.line}`}}>
            {(data.settings&&data.settings.includeMp2EstimateInNetWorth)?"On":"Off"}
          </span>
        </button>
        <button onClick={()=>setData(d=>({...d,settings:{...(d.settings||{}),goldAutoRefresh:!(d.settings?d.settings.goldAutoRefresh!==false:true)}}))}
          style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:16,
            background:P.sfA,border:`1px solid ${P.line}`,color:P.ink,textAlign:"left"}}>
          <span>Automatically refresh gold price<br/>
            <span style={{fontSize:11,color:P.faint,fontWeight:400}}>On by default — gold rides the same background refresh as stock quotes. Turn off to only update it with the manual "Refresh prices" button in Investments.</span>
          </span>
          <span style={{borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:600,flexShrink:0,marginLeft:8,
            background:(data.settings?data.settings.goldAutoRefresh!==false:true)?P.gr:P.sf,color:(data.settings?data.settings.goldAutoRefresh!==false:true)?"#fff":P.sub,
            border:`1px solid ${(data.settings?data.settings.goldAutoRefresh!==false:true)?P.gr:P.line}`}}>
            {(data.settings?data.settings.goldAutoRefresh!==false:true)?"On":"Off"}
          </span>
        </button>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:16,
          background:P.sfA,border:`1px solid ${P.line}`,color:P.ink}}>
          <span>Detailed (daily) snapshot history<br/>
            <span style={{fontSize:11,color:P.faint,fontWeight:400}}>How many recent days keep day-by-day resolution before older history compresses to weekly, then monthly</span>
          </span>
          <select value={(data.settings&&data.settings.snapshotRetention&&data.settings.snapshotRetention.dailyDays)||35}
            onChange={e=>setData(d=>({...d,settings:{...(d.settings||{}),snapshotRetention:{...((d.settings&&d.settings.snapshotRetention)||{weeklyDays:365}),dailyDays:Number(e.target.value)}}}))}
            style={{borderRadius:8,padding:"5px 8px",fontSize:13,background:P.sf,border:`1px solid ${P.line}`,color:P.ink,flexShrink:0}}>
            <option value={14}>14 days</option>
            <option value={35}>35 days</option>
            <option value={60}>60 days</option>
            <option value={90}>90 days</option>
          </select>
        </div>
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Cloudflare KV Sync</div>
        {kvReady
          ?<div style={{marginBottom:16}}>
            {(()=>{
              const statusMap={
                saving:{icon:I.Cloud,label:"Saving…",color:P.sub,bg:P.sfA},
                synced:{icon:I.Check,label:"Cloud synced",color:P.gr,bg:P.grS},
                pending:{icon:I.Cloud,label:`Pending changes${changesSinceSave?` (${changesSinceSave})`:""}`,color:P.amber,bg:P.amberS},
                offline:{icon:I.EyeOff,label:"Offline — will sync when back online",color:P.sub,bg:P.sfA},
                failed:{icon:I.X,label:"Sync failed — data is safe on this device",color:P.red||P.wine,bg:P.amberS},
                stale:{icon:I.ArrowUp,label:"Newer data available — syncing…",color:P.amber,bg:P.amberS},
                idle:hasUnsyncedChanges
                  ?{icon:I.Cloud,label:`Local changes pending${changesSinceSave?` (${changesSinceSave})`:""}`,color:P.amber,bg:P.amberS}
                  :{icon:I.Check,label:"Cloud is up to date",color:P.gr,bg:P.grS},
              };
              /* A rejected passphrase (the Worker's SYNC_TOKEN was rotated, or
                 this device holds an old one) otherwise looks identical to an
                 ordinary sync failure, and the fix is completely different —
                 so it gets its own row rather than "Sync failed". */
              if(KVSync.lastStatus===401)return(
                <div style={{fontSize:12,color:P.amber,marginBottom:8,padding:"8px 10px",background:P.amberS,borderRadius:10,lineHeight:1.6}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:6}}><I.X size={13}/>Passphrase rejected</span>
                  <div style={{fontSize:11,color:P.faint,marginTop:4}}>
                    The cloud didn't accept this device's passphrase — it was probably changed. Forget it below and enter the new one. Your data on this device is untouched.
                  </div>
                </div>
              );
              const s=statusMap[syncStatus]||statusMap.idle;
              /* The reason a sync failed used to live ONLY in a title tooltip on
                 the cloud button, which no phone renders — so a failure on the
                 device that had it was undiagnosable, and the v1.22.1
                 device-name bug (fetch throwing before a byte was sent) took a
                 whole session to find instead of being readable off the screen.
                 Show it here. "TypeError: ..." and "HTTP 500" need completely
                 different responses and otherwise look identical.
                 Nothing here is secret: lastSyncError is an exception message or
                 an HTTP status, and the passphrase is never in either. */
              const failDetail=syncStatus==="failed"&&(lastSyncError||KVSync.lastStatus)
                ?`${lastSyncError||"unknown error"}${KVSync.lastStatus?` · HTTP ${KVSync.lastStatus}`:""}`
                :"";
              return(
                <div style={{fontSize:12,color:s.color,marginBottom:8,padding:"8px 10px",background:s.bg,borderRadius:10,lineHeight:1.6}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:6}}><s.icon size={13}/>{s.label}</span>
                  {failDetail&&
                    <div style={{fontSize:11,fontFamily:"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace",color:P.sub,marginTop:5,padding:"5px 7px",background:P.sf,borderRadius:6,wordBreak:"break-word"}}>
                      {failDetail}
                    </div>}
                  <div style={{fontSize:11,color:P.faint,marginTop:4}}>
                    Last saved to cloud: {lastCloudSavedAt?lastCloudSavedAt.toLocaleString():"never"}<br/>
                    Last pulled from cloud: {lastCloudPulledAt?lastCloudPulledAt.toLocaleString():"never"}
                  </div>
                  {hasUnsyncedChanges&&onViewPendingChanges&&
                    <button onClick={onViewPendingChanges} style={{marginTop:6,background:"transparent",border:"none",padding:0,fontSize:11,fontWeight:600,color:P.amber,textDecoration:"underline"}}>
                      View what's pending
                    </button>}
                </div>
              );
            })()}
            {importPending&&
              <div style={{fontSize:12,color:P.sub,marginBottom:8,padding:"10px 12px",background:P.amberS,borderRadius:10,lineHeight:1.6}}>
                <b style={{color:P.amber}}>Imported data is on this device only.</b>
                <div style={{marginTop:4}}>
                  Nothing has been uploaded — {owners.wife||"your partner"} is still on the old copy. Tap <b>Save to Cloud</b> to share it, or restore one of the saved copies below to undo the import. Pulling is paused until you choose.
                </div>
              </div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <button onClick={()=>saveToCloud()} disabled={syncOp==="push"}
                style={importPending?{...btn,background:P.gr,color:"#fff",border:"none"}:btn}>
                <I.Cloud size={14}/>{syncOp==="push"?"Saving…":"Save to Cloud"}
              </button>
              <button onClick={()=>pullFromCloud()} disabled={syncOp==="pull"||importPending}
                style={{...btn,opacity:importPending?.4:1}}
                title={importPending?"Finish the import first":undefined}>
                <I.Refresh size={14}/>{syncOp==="pull"?"Pulling…":"Pull from Cloud"}
              </button>
            </div>
            {(preCloudSlots||[]).map((slot,i)=>(
              <button key={slot.at} onClick={()=>restorePreCloudBackup(i)}
                style={{...btn,width:"100%",marginBottom:8,flexDirection:"column",alignItems:"stretch",gap:2,padding:"9px 12px"}}>
                <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  <I.Reset size={14}/>{importPending&&i===0?"Undo import — restore this copy":"Restore this local copy"}
                </span>
                <span style={{fontSize:11,color:P.faint,fontWeight:400,textAlign:"center"}}>
                  {new Date(slot.at).toLocaleString()}{slot.label?` · ${slot.label}`:""}
                </span>
              </button>
            ))}
            <label style={{display:"block",fontSize:11,color:P.faint,marginBottom:4}}>Name this device</label>
            <input value={devLabel} onChange={e=>{setDevLabel(e.target.value);setDeviceLabel(e.target.value);}}
              placeholder="e.g. My phone"
              style={{width:"100%",boxSizing:"border-box",borderRadius:10,padding:"9px 12px",fontSize:14,marginBottom:6,
                background:P.sf,border:`1px solid ${P.line}`,color:P.ink}}/>
            <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginBottom:10}}>
              Only used to say which device saved last if you and {owners.wife||"your partner"} ever change the same thing at once. Stored on this device, never uploaded as part of your data.
            </div>
            <button onClick={()=>setForgetConfirm(true)} style={{...btn,width:"100%",marginBottom:8}}>
              <I.EyeOff size={14}/>Forget passphrase on this device
            </button>
            <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginBottom:8}}>
              <b style={{color:P.sub}}>Nothing here is manual.</b> Everything you type is saved on this device immediately, signal or not. It then uploads on its own — a few seconds after you stop editing, and again whenever you switch away from the app or close it.
              <br/><br/>
              <b style={{color:P.sub}}>Offline is fine.</b> Edits queue up on this device and go up by themselves the next time you're connected. Nothing is lost while you wait.
              <br/><br/>
              <b style={{color:P.sub}}>The two buttons are shortcuts, not requirements.</b> Save to Cloud uploads right now instead of waiting; Pull from Cloud fetches the latest copy from the other device. Opening the app already checks for you, and pull-to-sync on mobile does whichever of the two is needed.
            </div>
            <div style={{fontSize:11,color:P.sub,padding:"8px 10px",background:P.sfA,borderRadius:10,lineHeight:1.6}}>
              You and {owners.wife||"your partner"} share one dataset. If you both change different things, they're combined automatically. If you both change the <i>same</i> thing, the app stops and asks you which to keep rather than picking one silently.
            </div>
            <SyncDiagnostics {...{localRev,cloudRev,lastCloudSavedAt,lastCloudPulledAt,hasUnsyncedChanges,changesSinceSave,syncStatus,isOnline,lastSyncError}}/>
          </div>
          :<div style={{marginBottom:16}}>
            <div style={{fontSize:12,color:P.sub,padding:"10px 12px",background:P.sfA,borderRadius:10,lineHeight:1.6,marginBottom:10}}>
              This device isn't connected to the cloud yet. Everything still works and saves here — enter your sync passphrase to share data with your other devices and turn on live prices.
            </div>
            <label style={{display:"block",fontSize:11,color:P.faint,marginBottom:4}}>Sync passphrase</label>
            <div style={{display:"flex",gap:8,marginBottom:6}}>
              <input type="password" value={pass} autoComplete="current-password"
                onChange={e=>{setPass(e.target.value);if(passState!=="idle")setPassState("idle");}}
                onKeyDown={e=>{if(e.key==="Enter")connectPass();}}
                placeholder="Type your passphrase"
                style={{flex:1,minWidth:0,borderRadius:10,padding:"10px 12px",fontSize:14,
                  background:P.sf,border:`1px solid ${passState==="bad"?P.amber:P.line}`,color:P.ink}}/>
              <button onClick={connectPass} disabled={!pass.trim()||passState==="checking"}
                style={{...btn,flexShrink:0,opacity:(!pass.trim()||passState==="checking")?.5:1}}>
                {passState==="checking"?"Checking…":"Connect"}
              </button>
            </div>
            {passState==="bad"&&
              <div style={{fontSize:11,color:P.amber,marginBottom:6}}>That passphrase didn't work. Check it and try again.</div>}
            {passState==="error"&&
              <div style={{fontSize:11,color:P.amber,marginBottom:6}}>Couldn't reach the server. Check your connection and try again.</div>}
            <div style={{fontSize:11,color:P.faint,lineHeight:1.6}}>
              Stored on this device only — it is never uploaded, never included in a backup file, and isn't in the app's source. It's the same passphrase set as <code>SYNC_TOKEN</code> in your Cloudflare Worker, and you'll enter it once on each device.
            </div>
          </div>
        }
        <div style={{fontSize:12,fontWeight:600,color:P.sub,marginBottom:6}}>Manual backup</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <button onClick={download} style={btn}><I.Download size={14}/>Download</button>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} style={btn}><I.Upload size={14}/>Import</button>
        </div>
        <input ref={fileRef} type="file" accept=".json,application/json" onChange={onFile} style={{display:"none"}}/>
        <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginBottom:8}}>
          Download saves everything to a file you keep. Import shows you what's in a file and asks before replacing anything{kvReady?", and holds off uploading until you say so":""}.
        </div>
        {importPreview&&
          <ImportPreviewSheet report={importPreview.report} fileName={importPreview.fileName}
            partnerName={owners.wife} onConfirm={confirmImport} onCancel={()=>setImportPreview(null)}/>}
        {msg&&<div style={{fontSize:12,color:P.gr,marginBottom:12}}>{msg}</div>}
        {onOpenRecentlyDeleted&&
          <button onClick={onOpenRecentlyDeleted} style={{...btn,width:"100%",marginBottom:12}}>
            <I.Trash size={14}/>Recently Deleted
          </button>}
        {/* Reset now empties rather than loading the demo dataset. On a
            connected device the old behaviour was the fresh-device
            contamination bug through a second door: it replaced real data with
            sample records, the persist effect flagged the document dirty, and
            the idle autosave pushed the demo data to the other phone. */}
        <button onClick={()=>confirm
            ?(()=>{setData(d=>migrate(resetToEmptyDoc(d)));markResetData();setConfirm(false);
                   flash(kvReady?"This device is now empty — the cloud still has your data":"This device is now empty");})()
            :setConfirm(true)}
          style={{display:"flex",width:"100%",alignItems:"center",justifyContent:"center",gap:8,borderRadius:10,padding:"8px 12px",fontSize:14,fontWeight:500,marginTop:4,
            background:confirm?P.red:P.sfA,color:confirm?"#fff":P.red,border:`1px solid ${confirm?P.red:P.line}`}}>
          <I.Reset size={14}/>{confirm?"Tap again to confirm reset":"Reset to empty"}
        </button>
        {kvReady&&
          <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginTop:6}}>
            Empties this device only. The cloud copy and your other device keep their data until you deliberately Save to Cloud.
          </div>}
        {/* Sample data is explicit and marked. markSampleData() is what stops
            it from ever being auto-pushed; only a deliberate Save to Cloud can
            share it, and doing so ends its sample status. */}
        <button onClick={()=>sampleConfirm
            ?(()=>{setData(migrate(sampleData(structuralDefaults())));markSampleData();setSampleConfirm(false);
                   flash(kvReady?"Sample data loaded — it won't sync unless you Save to Cloud":"Sample data loaded");})()
            :setSampleConfirm(true)}
          style={{...btn,width:"100%",marginTop:8,justifyContent:"center"}}>
          <I.Refresh size={14}/>{sampleConfirm?"Tap again — this replaces what's on this device":"Load sample data"}
        </button>
        <div style={{fontSize:11,color:P.faint,lineHeight:1.6,marginTop:6}}>
          Sample data is for trying things out. It stays on this device and won't sync on its own.
        </div>
        <div style={{marginTop:16,paddingTop:12,borderTop:`1px solid ${P.line}`,fontSize:11,color:P.faint,lineHeight:1.7}}>
          <div>Version {APP_VERSION} · Build {BUILD_ID}</div>
          <div>Latest server build: {versionCheck.status==="ok"?versionCheck.buildId:versionCheck.status==="checking"?"checking…":"couldn't check"}</div>
          {versionCheck.status==="ok"&&
            <div>Status: {versionCheck.buildId===BUILD_ID?"Up to date":"Update available"}</div>}
          {versionCheck.status==="ok"&&versionCheck.buildId!==BUILD_ID&&
            <button onClick={()=>window.location.reload()} style={{...btn,width:"100%",marginTop:8}}>
              <I.Refresh size={14}/>Update Available — Reload
            </button>}
        </div>
      </div>
      {/* Siblings of the modal body, not nested in the owner map, so only one
          of each can ever be open. Both are Portalled by their own components;
          useScrollLock is refcounted so opening one on top of Settings doesn't
          release the body lock underneath it. */}
      {ppSheet&&
        <SalaryArrivedSheet periodKey={ppSheet.periodKey}
          cfg={(data.payPeriods||{})[ppSheet.owner]||{}}
          owner={ppSheet.owner} owners={owners} expenses={data.expenses}
          heading={ppSheet.heading}
          onClose={()=>setPpSheet(null)}
          onConfirm={date=>{setActualStart(ppSheet.owner,ppSheet.periodKey,date);setPpSheet(null);}}/>}
      <ConfirmDialog open={!!ppConfirm}
        title={ppConfirm&&ppConfirm.repay?"Change payday?":ppConfirm&&ppConfirm.turningOn?"Track pay periods?":"Stop tracking pay periods?"}
        message={ppConfirm&&(ppConfirm.repay
          ?`A period is identified by its payday, so the ${ppConfirm.count} correction${ppConfirm.count===1?"":"s"} already recorded for ${owners[ppConfirm.owner]} no longer line up and will be cleared.`
          :`${ppConfirm.count} of ${owners[ppConfirm.owner]}'s logged expenses will move into a different ${ppConfirm.turningOn?"period":"month"}. Past totals on Home and in Expenses will change. Nothing on the transactions themselves changes, so switching back restores them exactly.`)}
        confirmLabel={ppConfirm&&ppConfirm.repay?"Change payday":ppConfirm&&ppConfirm.turningOn?"Turn on":"Turn off"}
        danger={false}
        onConfirm={()=>{ppConfirm.apply();setPpConfirm(null);}}
        onCancel={()=>setPpConfirm(null)}/>
      <ConfirmDialog open={forgetConfirm}
        title="Forget passphrase on this device?"
        message="This device will stop syncing and live prices will turn off until you enter it again. Nothing on this device is deleted, and nothing in the cloud changes."
        confirmLabel="Forget it"
        danger={false}
        onConfirm={forgetPass}
        onCancel={()=>setForgetConfirm(false)}/>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){
    console.error("App crashed:",error,info);
    if(typeof window.__hideLoading==="function")window.__hideLoading();
  }
  render(){
    if(!this.state.error)return this.props.children;
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:P.bg,color:P.ink,fontFamily:"inherit"}}>
        <div style={{maxWidth:420,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Something went wrong</div>
          <div style={{fontSize:14,color:P.sub,marginBottom:20,lineHeight:1.5}}>
            Where'dItGo hit an unexpected error and couldn't continue. Your saved data on this device hasn't been touched — reloading usually fixes it.
          </div>
          <button onClick={()=>window.location.reload()}
            style={{padding:"10px 20px",borderRadius:10,border:"none",background:P.gr,color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>
            Reload app
          </button>
        </div>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>

<script>
window.__hideLoading=function(){
  var el=document.getElementById("loading");
  if(el){el.style.opacity="0";el.style.transition="opacity 0.3s";setTimeout(function(){el.remove();},300);}
};
setTimeout(window.__hideLoading,30000);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.log('SW Registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
