<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Transaction - Analytical Console</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@600&amp;family=Source+Serif+4:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#cfc4c5",
                        "surface-dim": "#dadada",
                        "on-surface-variant": "#4c4546",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "border-hairline": "#E4E2E4",
                        "tertiary-container": "#1b1b1b",
                        "on-tertiary-fixed-variant": "#474747",
                        "surface": "#f9f9f9",
                        "outline": "#7e7576",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#848484",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-fixed": "#1b1b1b",
                        "on-secondary-fixed": "#002114",
                        "on-background": "#1b1b1b",
                        "surface-container": "#eeeeee",
                        "secondary-fixed-dim": "#68dba9",
                        "background": "#f9f9f9",
                        "on-tertiary-fixed": "#1b1b1b",
                        "status-success": "#059669",
                        "text-muted": "#64748B",
                        "on-primary-container": "#848484",
                        "primary": "#000000",
                        "inverse-surface": "#303030",
                        "surface-secondary": "#FFFFFF",
                        "secondary-fixed": "#85f8c4",
                        "on-surface": "#1b1b1b",
                        "surface-bright": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#005137",
                        "primary-container": "#1b1b1b",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#e2e2e2",
                        "surface-tint": "#5e5e5e",
                        "secondary": "#006c4a",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#00714e",
                        "tertiary-fixed": "#e2e2e2",
                        "status-attention": "#F87171",
                        "secondary-container": "#82f5c1",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface-container-low": "#f3f3f3",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-primary-fixed-variant": "#474747",
                        "inverse-on-surface": "#f1f1f1",
                        "on-error": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "surface-primary": "#F9F9F9",
                        "tertiary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-padding": "24px",
                        "gap-module": "20px",
                        "margin-desktop": "32px",
                        "margin-mobile": "20px",
                        "gutter": "1px"
                    },
                    "fontFamily": {
                        "grid-content": ["Inter"],
                        "instrument-title": ["Inter"],
                        "display-currency": ["\"Source Serif 4\""],
                        "section-header": ["Inter"],
                        "instrument-value": ["JetBrains Mono"],
                        "display-currency-mobile": ["\"Source Serif 4\""],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "grid-content": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "instrument-title": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "display-currency": ["36px", { "lineHeight": "44px", "fontWeight": "600" }],
                        "section-header": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "instrument-value": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-currency-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<!-- Application Shell (Task Focused - No Nav) -->
<div class="flex flex-col h-screen overflow-hidden">
<!-- Header Actions -->
<header class="h-16 flex items-center justify-between px-margin-desktop border-b border-border-hairline bg-surface shrink-0">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-low transition-colors rounded-DEFAULT text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
<span class="font-instrument-title text-instrument-title uppercase">Cancel</span>
</button>
</div>
<div class="font-instrument-title text-instrument-title uppercase tracking-widest text-primary">
                ENTRY CONSOLE
            </div>
<div class="flex items-center gap-4 text-on-surface-variant">
<button class="p-2 hover:bg-surface-container-low transition-colors rounded-DEFAULT">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-auto p-margin-desktop">
<div class="max-w-6xl mx-auto h-full flex flex-col">
<!-- Instrumentation Header -->
<div class="grid grid-cols-2 border border-border-hairline bg-surface-secondary mb-gap-module shrink-0">
<div class="p-section-padding border-r border-border-hairline flex flex-col justify-center">
<span class="font-instrument-title text-instrument-title text-on-surface-variant uppercase mb-2 block">Available Balance</span>
<div class="font-display-currency text-display-currency text-primary flex items-baseline gap-1">
<span class="text-2xl">$</span>8,432.50
                        </div>
</div>
<div class="p-section-padding flex flex-col justify-center">
<span class="font-instrument-title text-instrument-title text-on-surface-variant uppercase mb-2 block">Monthly Burn Rate</span>
<div class="font-display-currency text-display-currency text-primary flex items-baseline gap-1">
<span class="text-2xl">$</span>2,150.00
                        </div>
<div class="w-full h-1 bg-surface-container mt-4">
<div class="h-full bg-status-success w-[45%]"></div>
</div>
</div>
</div>
<!-- Main Console Grid -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-0 border border-border-hairline bg-surface-secondary flex-1 min-h-0">
<!-- Entry Form (Left & Center) -->
<div class="lg:col-span-2 flex flex-col border-r border-border-hairline overflow-y-auto">
<!-- Amount Input -->
<div class="p-section-padding border-b border-border-hairline flex flex-col items-center justify-center py-12">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase mb-4">Transaction Amount</label>
<div class="flex items-center gap-2 text-primary">
<span class="font-display-currency text-display-currency text-on-surface-variant">$</span>
<input autofocus="" class="bg-transparent border-none text-center font-display-currency text-display-currency p-0 focus:ring-0 focus:outline-none w-64 text-primary placeholder-surface-dim" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Details Grid -->
<div class="grid grid-cols-2 border-b border-border-hairline">
<div class="p-section-padding border-r border-border-hairline">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-4">Date &amp; Time</label>
<input class="w-full bg-surface border border-border-hairline p-3 font-grid-content text-grid-content text-primary focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" type="datetime-local"/>
</div>
<div class="p-section-padding">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-4">Payee / Merchant</label>
<input class="w-full bg-surface border border-border-hairline p-3 font-grid-content text-grid-content text-primary focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder-surface-dim" placeholder="Enter entity..." type="text"/>
</div>
</div>
<!-- Category Selector -->
<div class="p-section-padding border-b border-border-hairline flex-1">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-6">Classification</label>
<div class="grid grid-cols-4 gap-4">
<!-- Category Option -->
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="restaurant">restaurant</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Dining</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-primary bg-surface-container transition-all aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-primary" data-icon="shopping_cart">shopping_cart</span>
<span class="font-body-sm text-body-sm text-primary font-bold">Groceries</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="directions_car">directions_car</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Transport</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="home">home</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Housing</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="bolt">bolt</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Utilities</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="fitness_center">fitness_center</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Health</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="local_activity">local_activity</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Ent.</span>
</button>
<button class="flex flex-col items-center justify-center p-4 border border-border-hairline hover:border-primary hover:bg-surface-container-low transition-all bg-surface-secondary aspect-square gap-2">
<span class="material-symbols-outlined text-2xl text-on-surface-variant" data-icon="more_horiz">more_horiz</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Notes -->
<div class="p-section-padding bg-surface-secondary">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-4">Context / Notes</label>
<textarea class="w-full bg-surface border border-border-hairline p-3 font-grid-content text-grid-content text-primary focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder-surface-dim resize-none" placeholder="Optional context..." rows="2"></textarea>
</div>
</div>
<!-- Context & Action Pane (Right) -->
<div class="flex flex-col bg-surface overflow-y-auto">
<!-- Account Selector -->
<div class="p-section-padding border-b border-border-hairline bg-surface-secondary">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-4">Source Account</label>
<select class="w-full bg-surface border border-border-hairline p-3 font-grid-content text-grid-content text-primary focus:ring-1 focus:ring-primary focus:border-primary outline-none appearance-none rounded-none">
<option>Primary Checking (...1234)</option>
<option>Shared Savings (...5678)</option>
<option>Credit Card (...9012)</option>
</select>
</div>
<!-- Recent Context List -->
<div class="flex-1 p-section-padding border-b border-border-hairline flex flex-col">
<label class="font-instrument-title text-instrument-title text-on-surface-variant uppercase block mb-6 flex items-center justify-between">
<span>Recent Groceries</span>
<span class="material-symbols-outlined text-sm" data-icon="history">history</span>
</label>
<div class="flex flex-col">
<!-- List Item -->
<div class="py-3 border-b border-border-hairline flex justify-between items-center last:border-b-0">
<div>
<div class="font-grid-content text-grid-content text-primary">Whole Foods</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-1">Oct 24 • Debit</div>
</div>
<div class="font-instrument-value text-instrument-value text-primary text-sm">
                                        $142.50
                                    </div>
</div>
<!-- List Item -->
<div class="py-3 border-b border-border-hairline flex justify-between items-center last:border-b-0">
<div>
<div class="font-grid-content text-grid-content text-primary">Trader Joe's</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-1">Oct 18 • Credit</div>
</div>
<div class="font-instrument-value text-instrument-value text-primary text-sm">
                                        $89.20
                                    </div>
</div>
<!-- List Item -->
<div class="py-3 border-b border-border-hairline flex justify-between items-center last:border-b-0">
<div>
<div class="font-grid-content text-grid-content text-primary">Safeway</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-1">Oct 12 • Debit</div>
</div>
<div class="font-instrument-value text-instrument-value text-primary text-sm">
                                        $210.00
                                    </div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="p-section-padding bg-surface-container-high mt-auto">
<button class="w-full bg-primary text-on-primary py-4 px-6 font-section-header text-section-header uppercase tracking-wider hover:bg-inverse-surface transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                                Commit Entry
                            </button>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
